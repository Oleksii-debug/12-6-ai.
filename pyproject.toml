[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "twelve-six-ai"
version = "0.2.0.dev0"
description = "12-6 AI from-scratch language model research"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.12"]
data-scale = ["datatrove[io]==0.10.0", "spacy>=3.8"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
