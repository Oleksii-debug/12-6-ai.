[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "twelve-six-ai"
version = "0.2.0.dev0"
description = "12-6 AI from-scratch language model research"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = ["numpy>=1.26", "safetensors>=0.5", "torch>=2.5"]

[project.scripts]
twelve-six-generate = "twelve_six.inference.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.12"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint.per-file-ignores]
"tools/research41_learned_scaling.py" = ["E701", "E702", "F841"]
