[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "twelve-six-ai"
version = "0.2.0.dev0"
description = "12-6 AI from-scratch language model research"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26", "safetensors>=0.5", "torch>=2.5"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.12", "setuptools>=75", "wheel"]

[project.scripts]
twelve-six-windows = "twelve_six.windows_operator_cli:main"

[tool.setuptools.data-files]
"share/twelve-six-ai/configs/research" = [
    "configs/research/r01_windows_local_free_operator_v1.json",
    "configs/research/r01_portable_local_free_run_packet_v1.json",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["src"]

# Lock the established pre-Ruff-0.16 baseline so tool updates cannot silently
# expand 59 implicit checks to 413 without a reviewed migration.
# This preserves the historical E4/E7/E9/F error gates rather than masking
# individual findings. A broadened policy needs a separate owned rollout.
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

# Module initialization and tool-probe fixtures deliberately perform setup
# before importing exported bindings. These are semantic import-order gates,
# not lint mistakes; retain E402 only for the enumerated source files.
[tool.ruff.lint.per-file-ignores]
"src/twelve_six/checkpoint/__init__.py" = ["E402"]
"tests/test_audit_d03_rada_trees_primary_archive.py" = ["E402"]
"tests/test_d03_rada_bulk_observation_cli.py" = ["E402"]
"tests/test_d03_rada_bulk_source_probe.py" = ["E402"]
"tests/test_d03_rada_bulk_source_probe_authority.py" = ["E402"]
"tests/test_d03_rada_trees_acquisition_probe.py" = ["E402"]
"tests/test_probe_d03_rada_trees_hf_objects.py" = ["E402"]

[tool.ruff.lint.isort]
known-first-party = ["twelve_six", "tools"]
