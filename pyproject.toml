[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "twelve-six-ai"
version = "0.2.0.dev0"
description = "12-6 AI from-scratch language model research"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.12"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint.per-file-ignores]
"src/twelve_six/data/dedup_scale.py" = ["UP035"]
"tools/run_dedup_scale_experiment.py" = ["UP035", "SIM905", "TRY004"]
