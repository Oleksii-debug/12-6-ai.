[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "twelve-six-ai"
version = "0.2.0.dev0"
description = "12-6 AI from-scratch language model research"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.12"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint.per-file-ignores]
# Preserve the exact reviewed incumbent quality/privacy blobs composed into the
# Rada gate. These are style-only findings from the repository's newer Ruff
# rules; waiving them here keeps the reviewed runtime byte identities intact.
"src/twelve_six/data/document_quality.py" = ["C408", "UP035"]
"src/twelve_six/data/privacy_filter_v3.py" = ["FURB167", "SIM102", "UP035"]
