name: DATA-232 Decontamination Authority V2

on:
  pull_request:
    paths:
      - ".github/workflows/data232-decontamination-authority-v2.yml"
      - "configs/data/data232_decontamination_v2.json"
      - "data/evaluation/data232_reserved_authorities_v1.json"
      - "docs/DATA232_DECONTAMINATION_AUTHORITY_V2.md"
      - "evidence/data232/**"
      - "src/twelve_six/data/_data232_decontamination_matching.py"
      - "src/twelve_six/data/decontamination_authority_v2.py"
      - "tests/fixtures/data232_decontamination_adversarial_v1.json"
      - "tests/test_data232_decontamination_authority_v2.py"
      - "tools/run_data232_decontamination.py"
  workflow_dispatch:

concurrency:
  group: data232-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  authority:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Prove exact source checkout
        env:
          SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11.16"
      - name: Universal exact execution bootstrap
        uses: ./.github/actions/execution-bootstrap
        with:
          capabilities: tests,lint
          venv: .data232-venv
          command: python -m pytest -q tests/test_data232_decontamination_authority_v2.py
          manifest: evidence/data232/execution-environment.json
      - name: Compile focused implementation
        run: >-
          PYTHONPATH=src .data232-venv/bin/python -m compileall -q
          src/twelve_six/data/_data232_decontamination_matching.py
          src/twelve_six/data/decontamination_authority_v2.py
          tools/run_data232_decontamination.py
      - name: Focused adversarial tests
        run: >-
          PYTHONPATH=src .data232-venv/bin/python -m pytest -q
          tests/test_data232_decontamination_authority_v2.py
      - name: Focused lint
        run: >-
          .data232-venv/bin/ruff check
          src/twelve_six/data/_data232_decontamination_matching.py
          src/twelve_six/data/decontamination_authority_v2.py
          tools/run_data232_decontamination.py
          tests/test_data232_decontamination_authority_v2.py
      - name: Reproduce immutable missing-DATA230 authority report
        run: |
          set -euo pipefail
          rm -f /tmp/data232-blocker.json
          PYTHONPATH=src .data232-venv/bin/python tools/run_data232_decontamination.py blocker \
            --authorities data/evaluation/data232_reserved_authorities_v1.json \
            --report /tmp/data232-blocker.json
          cmp /tmp/data232-blocker.json evidence/data232/decontamination-authority-v2-blocker.json
          PYTHONPATH=src .data232-venv/bin/python tools/run_data232_decontamination.py verify \
            --report evidence/data232/decontamination-authority-v2-blocker.json
      - name: Prove no model training path
        run: >-
          .data232-venv/bin/python -c
          "import json; p=json.load(open('evidence/data232/decontamination-authority-v2-blocker.json'));
          assert p['training_executed'] is False;
          assert p['model_architecture_or_hyperparameters_selected'] is False;
          assert p['final_test_outcomes_read'] is False"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: data232-decontamination-authority-v2
          path: |
            evidence/data232/decontamination-authority-v2-blocker.json
            evidence/data232/execution-environment.json
          if-no-files-found: error
          retention-days: 30
