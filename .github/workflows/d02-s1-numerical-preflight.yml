name: D02 S1 Numerical Preflight

on:
  pull_request:
    paths:
      - ".github/workflows/d02-s1-numerical-preflight.yml"
      - "src/twelve_six/model.py"
      - "src/twelve_six/training/**"
      - "src/twelve_six/checkpoint/**"
      - "src/twelve_six/tokenization/**"
      - "src/twelve_six/packing/**"
      - "src/twelve_six/evaluation.py"
      - "src/twelve_six/stage_gates.py"
      - "configs/stages/s1*"
      - "configs/training/**"
      - "data/s0/packaged/**"
      - "tools/run_s1_numerical_preflight.py"
      - "tools/validate_s1_numerical_preflight.py"
      - "tools/verify_locked_environment.py"
      - "requirements/locks/index.json"
      - "requirements/locks/linux-x86_64/**"
      - "pyproject.toml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  locked-s1-cpu-preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Prove exact source checkout
        env:
          SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11.16"
      - name: Verify exact D08 locked environment and repository checks
        env:
          SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: >-
          python tools/verify_locked_environment.py
          --profile linux-x86_64
          --source-sha "$SOURCE_SHA"
          --evidence-out locked-environment-linux-x86_64.json
          --run-repo-checks
      - name: Create exact locked D02 S1 execution environment
        run: |
          python -m venv .d02-s1-locked
          .d02-s1-locked/bin/python -m pip install --disable-pip-version-check --require-hashes --no-deps -r requirements/locks/linux-x86_64/toolchain.lock.txt
          .d02-s1-locked/bin/python -m pip install --disable-pip-version-check --require-hashes --no-deps -r requirements/locks/linux-x86_64/runtime.lock.txt
          PIP_NO_INDEX=1 PIP_DISABLE_PIP_VERSION_CHECK=1 .d02-s1-locked/bin/python -m pip install --no-deps --no-build-isolation -e .
          .d02-s1-locked/bin/python -c "import torch,twelve_six; assert torch.__version__; print(twelve_six.__version__)"
      - name: Execute current S1 engineering-candidate numerical preflight
        env:
          SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          .d02-s1-locked/bin/python tools/run_s1_numerical_preflight.py \
            --source-sha "$SOURCE_SHA" \
            --locked-environment-evidence locked-environment-linux-x86_64.json \
            --output s1-numerical-preflight.json \
            --seed 1337 \
            --max-steps 6 \
            --batch-size 3
          .d02-s1-locked/bin/python tools/validate_s1_numerical_preflight.py \
            s1-numerical-preflight.json \
            --locked-environment-evidence locked-environment-linux-x86_64.json
          cat s1-numerical-preflight.json
      - name: Upload S1 numerical preflight evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: d02-s1-numerical-preflight-evidence
          path: |
            locked-environment-linux-x86_64.json
            s1-numerical-preflight.json
          if-no-files-found: error
          retention-days: 30
