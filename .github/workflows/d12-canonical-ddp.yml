name: D12 Canonical Token-Correct DDP

on:
  pull_request:
    paths:
      - "src/twelve_six/distributed/ddp_training.py"
      - "tests/test_canonical_ddp_training.py"
      - "docs/CANONICAL_DDP_TRAINING_D12.md"
      - ".github/workflows/d12-canonical-ddp.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  locked-cpu-ddp:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Prove exact source checkout
        run: test "$(git rev-parse HEAD)" = "$SOURCE_SHA"

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11.16"

      - name: Verify D08 locked environment and repository checks
        run: >-
          python tools/verify_locked_environment.py
          --profile linux-x86_64
          --source-sha "$SOURCE_SHA"
          --evidence-out locked-environment-linux-x86_64.json
          --run-repo-checks

      - name: Create exact locked execution environment
        run: |
          python -m venv .d12-ddp-locked
          .d12-ddp-locked/bin/python -m pip install --disable-pip-version-check --require-hashes --no-deps -r requirements/locks/linux-x86_64/toolchain.lock.txt
          .d12-ddp-locked/bin/python -m pip install --disable-pip-version-check --require-hashes --no-deps -r requirements/locks/linux-x86_64/runtime.lock.txt
          .d12-ddp-locked/bin/python -m pip install --disable-pip-version-check --require-hashes --no-deps -r requirements/locks/linux-x86_64/dev.lock.txt
          PIP_NO_INDEX=1 PIP_DISABLE_PIP_VERSION_CHECK=1 .d12-ddp-locked/bin/python -m pip install --no-deps --no-build-isolation -e .

      - name: Focused DDP correctness tests
        run: .d12-ddp-locked/bin/python -m pytest -q tests/test_canonical_ddp_training.py

      - name: Execute real two-rank 1M canonical DDP optimizer step
        run: |
          .d12-ddp-locked/bin/python -m twelve_six.distributed.ddp_training \
            --stage-config configs/stages/s2_1m.json \
            --source-sha "$SOURCE_SHA" \
            --output d12-s2-1m-ddp-evidence.json \
            --world-size 2 \
            --sequence-length 32 \
            --seed 20260825

      - name: Validate distributed evidence truth boundary
        run: |
          .d12-ddp-locked/bin/python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          report = json.loads(Path("d12-s2-1m-ddp-evidence.json").read_text(encoding="utf-8"))
          assert report["schema"] == "12-6.canonical-ddp-execution.v1"
          assert report["source_sha"] == os.environ["SOURCE_SHA"]
          assert report["canonical_base"] == "random_init"
          assert report["paid_compute"] is False
          assert report["promotion_authority"] is False
          assert report["behavioral_alignment"] is False
          execution = report["execution"]
          assert execution["stage"] == "S2"
          assert execution["parameter_count"] == 1_066_112
          assert execution["world_size"] == 2
          assert execution["local_valid_tokens"][0] != execution["local_valid_tokens"][1]
          assert execution["global_valid_tokens"] == sum(execution["local_valid_tokens"])
          assert execution["max_cross_rank_parameter_diff"] == 0.0
          assert execution["max_reference_parameter_diff"] <= execution["reference_tolerance"]
          assert execution["max_parameter_change"] > 0.0
          assert execution["passed"] is True
          assert report["correctness"]["normalization"] == "GLOBAL_VALID_TOKEN_WEIGHTED"
          expected = report.pop("report_sha256")
          encoded = json.dumps(
              report,
              sort_keys=True,
              separators=(",", ":"),
              ensure_ascii=False,
          ).encode("utf-8")
          assert hashlib.sha256(encoded).hexdigest() == expected
          PY

      - name: Show measured DDP evidence
        run: cat d12-s2-1m-ddp-evidence.json

      - name: Upload exact-head DDP evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: d12-s2-1m-ddp-evidence-${{ env.SOURCE_SHA }}
          path: |
            locked-environment-linux-x86_64.json
            d12-s2-1m-ddp-evidence.json
          if-no-files-found: error
          retention-days: 30
