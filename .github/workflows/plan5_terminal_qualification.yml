name: Plan 5 terminal agent reference qualification
on:
  push:
    paths:
      - 'src/twelve_six_agent_runtime/**'
      - 'tests/test_agent_*.py'
      - 'tests/fixtures/plan5_agent_runtime_scenario_v1.json'
      - 'docs/PLAN5_SECTION12_TERMINAL_QUALIFICATION.md'
      - '.github/workflows/plan5_terminal_qualification.yml'
  pull_request:
    paths:
      - 'src/twelve_six_agent_runtime/**'
      - 'tests/test_agent_*.py'
      - 'tests/fixtures/plan5_agent_runtime_scenario_v1.json'
      - 'docs/PLAN5_SECTION12_TERMINAL_QUALIFICATION.md'
      - '.github/workflows/plan5_terminal_qualification.yml'
jobs:
  local-free:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install pytest ruff
      - run: PYTHONPATH=src python -m pytest -q tests/test_agent_*.py
      - run: PYTHONPATH=src python -m compileall -q src/twelve_six_agent_runtime tests/test_agent_terminal_qualification_section12.py
      - run: ruff check --select E4,E7,E9,F tests/test_agent_terminal_qualification_section12.py
