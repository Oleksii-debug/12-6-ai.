name: NEXT100-065F Current-Main Global Dedup V8

on:
  pull_request:
    paths:
      - "configs/data/next100_065f_global_dedup_v8.json"
      - "tools/run_next100_065f_global_dedup_v8.py"
      - "tests/test_next100_065f_global_dedup_v8.py"
      - "docs/NEXT100_065F_GLOBAL_DEDUP_V8.md"
      - ".github/workflows/next100-065f-global-dedup-v8.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: next100-065f-v8-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  global-dedup:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      TWELVE_SIX_EXECUTION_PROFILE: LOCAL_FREE
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_SHA }}
          fetch-depth: 1
          persist-credentials: false
      - name: Prove exact current-main successor checkout
        run: test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11.16"
      - name: Check frozen bindings and focused regressions
        run: |
          python tools/run_next100_065f_global_dedup_v8.py check-config
          python -m unittest tests.test_next100_065f_global_dedup_v8 -v
          python -m py_compile tools/run_next100_065f_global_dedup_v8.py tests/test_next100_065f_global_dedup_v8.py
      - name: Checkout exact terminal V7 implementation only
        uses: actions/checkout@v4
        with:
          ref: d3333ec1b4a508df232a5aefccd6686adda745fb
          path: _terminal_v7
          fetch-depth: 1
          persist-credentials: false
      - name: Install deterministic NIST PDF extractor required by terminal V7 reproduction
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends poppler-utils
          pdftotext -v
      - name: Independent composed global dedup A
        run: >-
          python tools/run_next100_065f_global_dedup_v8.py run
          --v7-root _terminal_v7
          --workspace "$RUNNER_TEMP/v8-work-a"
          --report "$RUNNER_TEMP/v8-a.json"
      - name: Independent composed global dedup B
        run: >-
          python tools/run_next100_065f_global_dedup_v8.py run
          --v7-root _terminal_v7
          --workspace "$RUNNER_TEMP/v8-work-b"
          --report "$RUNNER_TEMP/v8-b.json"
      - name: Require byte-identical reports and revalidate
        run: |
          cmp "$RUNNER_TEMP/v8-a.json" "$RUNNER_TEMP/v8-b.json"
          python tools/run_next100_065f_global_dedup_v8.py verify --report "$RUNNER_TEMP/v8-a.json"
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          report = json.loads((Path(os.environ["RUNNER_TEMP"]) / "v8-a.json").read_text())
          vector = report["source_vector"]
          print("report_sha256=", report["report_sha256"])
          print("pre_global_dedup_bytes=", vector["source_capacity_bytes_before_global_dedup"])
          print("post_global_dedup_unique_bytes=", vector["conservative_unique_capacity_bytes_after_global_dedup"])
          print("duplicate_discount_bytes=", vector["duplicate_discount_bytes"])
          print("duplicate_cluster_count=", vector["duplicate_cluster_count"])
          print("family_counts=", vector["source_family_counts"])
          assert report["claim_boundary"]["authorized_training_exposure"] == 0
          assert report["claim_boundary"]["tokenizer_fit_authorized"] is False
          assert report["claim_boundary"]["final_test_payload_read"] is False
          PY
      - name: Upload immutable V8 report
        uses: actions/upload-artifact@v4
        with:
          name: next100-065f-global-dedup-v8-${{ env.SOURCE_SHA }}
          path: ${{ runner.temp }}/v8-a.json
          if-no-files-found: error
          retention-days: 90
