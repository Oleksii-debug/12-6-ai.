name: Dependency lock bootstrap
on:
  pull_request:
    paths:
      - pyproject.toml
      - src/twelve_six/integration/dependency_lock.py
      - tools/bootstrap_dependency_lock.py
      - .github/workflows/dependency-lock-bootstrap.yml
permissions:
  contents: read
jobs:
  bootstrap-lock:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            profile: linux-x86_64
          - runner: ubuntu-24.04-arm
            profile: linux-aarch64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11.16"
      - run: python -m pip --version
      - run: python tools/bootstrap_dependency_lock.py
      - name: Upload generated profile
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dependency-lock-${{ matrix.profile }}
          path: requirements/locks/${{ matrix.profile }}
          if-no-files-found: error
          retention-days: 30
