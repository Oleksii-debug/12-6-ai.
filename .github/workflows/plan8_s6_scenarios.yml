name: Plan 8 S6 scenario harness

on:
  pull_request:
    paths:
      - "src/twelve_six/scenario_harness.py"
      - "tests/test_plan8_scenario_harness.py"
      - "configs/control/product_source_surface_inventory_v1.json"
      - ".github/workflows/plan8_s6_scenarios.yml"
  workflow_dispatch:

jobs:
  scenarios:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install pytest ruff
      - name: Exact-head scenario contracts
        env:
          EXPECTED_HEAD: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          PYTHONPATH: src
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          python -m ruff check src/twelve_six/scenario_harness.py tests/test_plan8_scenario_harness.py
          python -m pytest -q tests/test_plan8_scenario_harness.py
