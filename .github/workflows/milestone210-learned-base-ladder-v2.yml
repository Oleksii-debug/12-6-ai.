name: MILESTONE-210 Learned Base Ladder V2

on:
  pull_request:
    branches: [env151/universal-execution-bootstrap-20260826]
  workflow_dispatch:

concurrency:
  group: milestone210-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

jobs:
  validate-terminal-ladder:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.11.16"
      - uses: ./.github/actions/execution-bootstrap
        with:
          capabilities: runtime,tests
          venv: .milestone210
          command: python -m pytest -q tests/test_milestone210_ladder_v2.py
          manifest: milestone210-environment.json
      - name: Fetch exact terminal M150 producer artifact
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl --fail --location --silent --show-error \
            -H "Authorization: Bearer ${GITHUB_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/Oleksii-debug/12-6-ai./actions/artifacts/9595677772/zip" \
            -o m150.zip
          echo "c00b7e9006320f8916c739a3311e8cc47ad0d0b16957f8ebd7d19233fd9f1c71  m150.zip" | sha256sum -c -
          mkdir m150-incumbent
          unzip -q m150.zip -d m150-incumbent
          test -f m150-incumbent/ladder-report.json
      - name: Validate only terminal executed ladder evidence
        run: |
          set -euo pipefail
          .milestone210/bin/python tools/validate_milestone210.py \
            --m150-report m150-incumbent/ladder-report.json
          .milestone210/bin/python -m pytest -q tests/test_milestone210_ladder_v2.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: milestone210-terminal-ladder-v2
          path: |
            evidence/milestone210/learned-base-ladder-v2.json
            milestone210-environment.json
            m150-incumbent/ladder-report.json
          if-no-files-found: error
          retention-days: 30
