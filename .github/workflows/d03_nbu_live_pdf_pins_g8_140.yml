name: D03 NBU live discovery and PDF pins

on:
  pull_request:
    branches:
      - audit/d03-912-catalog-route-sync-g8-138-20261005
    paths:
      - ".github/workflows/d03_nbu_live_pdf_pins_g8_140.yml"

permissions:
  contents: read

concurrency:
  group: d03-nbu-live-pdf-pins-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  qualify-current-nbu-contract:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.head_ref == 'execution/2785-nbu-live-pdf-pins-g8-140-20261005'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PARENT_HEAD: 18ce06f3b60323b2544a5ea3c6a11e0ff0566029
      EXECUTION_HEAD: ${{ github.event.pull_request.head.sha }}

    steps:
      - name: Checkout exact execution head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.EXECUTION_HEAD }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set exact CPython
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11.16"

      - name: Bind parent-relative closure
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXECUTION_HEAD"
          test "$(git merge-base "$PARENT_HEAD" HEAD)" = "$PARENT_HEAD"
          test "$(git diff --name-only "$PARENT_HEAD"..HEAD)" =             ".github/workflows/d03_nbu_live_pdf_pins_g8_140.yml"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          test "$(git hash-object tools/validate_d03_ua_nbu_official_resolutions_intake_v1.py)" =             "65efa6b94e470ff7e1a7543bfad7f04a15e4c313"
          test "$(git hash-object tools/materialize_d03_ua_nbu_official_pdf_pins_v1.py)" =             "467b0168488e3e9997feaafaf3389ffd49e1f964"

      - name: Install bounded test tools
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check             "pytest==9.1.1" "ruff==0.16.10"

      - name: Run exact NBU static and focused regressions
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile             tools/validate_d03_ua_nbu_official_resolutions_intake_v1.py             tools/materialize_d03_ua_nbu_official_pdf_pins_v1.py
          ruff check             tools/validate_d03_ua_nbu_official_resolutions_intake_v1.py             tools/materialize_d03_ua_nbu_official_pdf_pins_v1.py             tests/test_d03_ua_nbu_official_resolutions_intake_v1.py             tests/test_d03_ua_nbu_official_pdf_pins_v1.py
          pytest -q             tests/test_d03_ua_nbu_official_resolutions_intake_v1.py             tests/test_d03_ua_nbu_official_pdf_pins_v1.py
          python tools/validate_d03_ua_nbu_official_resolutions_intake_v1.py

  live-discovery-and-pdf-pins:
    needs: qualify-current-nbu-contract
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      EXECUTION_HEAD: ${{ github.event.pull_request.head.sha }}
      MAX_HTML_BYTES: "8388608"

    steps:
      - name: Checkout exact execution head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.EXECUTION_HEAD }}
          fetch-depth: 1
          persist-credentials: false

      - name: Set exact CPython
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11.16"

      - name: Execute two-fetch stable official NBU discovery
        shell: bash
        run: |
          set -euo pipefail
          mkdir "$RUNNER_TEMP/nbu"
          PYTHONPATH=. python - <<'PY'
          from __future__ import annotations

          import importlib.util
          import json
          import os
          import urllib.request
          from pathlib import Path
          from urllib.parse import urlsplit

          root = Path.cwd()
          tool = root / "tools/validate_d03_ua_nbu_official_resolutions_intake_v1.py"
          spec = importlib.util.spec_from_file_location("nbu_live_discovery", tool)
          if spec is None or spec.loader is None:
              raise SystemExit("cannot load NBU discovery authority")
          nbu = importlib.util.module_from_spec(spec)
          import sys
          sys.modules[spec.name] = nbu
          spec.loader.exec_module(nbu)

          config = nbu.load_config()
          origin = urlsplit(config["source"]["allowed_origin"])
          limit = int(os.environ["MAX_HTML_BYTES"])

          class SameOriginRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, req, fp, code, msg, headers, newurl):
                  parts = urlsplit(newurl)
                  if (
                      parts.scheme != "https"
                      or parts.hostname is None
                      or parts.hostname.casefold() != origin.hostname.casefold()
                      or parts.username
                      or parts.password
                      or parts.port not in (None, 443)
                  ):
                      raise RuntimeError("NBU HTML redirect escaped allowed origin")
                  return super().redirect_request(req, fp, code, msg, headers, newurl)

          opener = urllib.request.build_opener(SameOriginRedirect())

          def fetch_html(url: str) -> str:
              request = urllib.request.Request(
                  url,
                  headers={"User-Agent": "12-6-ai-d03-nbu-live-discovery/1.0 (+source-audit)"},
                  method="GET",
              )
              with opener.open(request, timeout=30) as response:
                  final = urlsplit(response.geturl())
                  if (
                      final.scheme != "https"
                      or final.hostname is None
                      or final.hostname.casefold() != origin.hostname.casefold()
                  ):
                      raise RuntimeError("NBU HTML final URL escaped allowed origin")
                  raw = response.read(limit + 1)
              if not raw or len(raw) > limit:
                  raise RuntimeError("NBU HTML body is empty or exceeds hard bound")
              return raw.decode("utf-8", errors="strict")

          catalog_url = config["source"]["catalog_url"]
          catalog = [fetch_html(catalog_url), fetch_html(catalog_url)]
          first_urls = nbu.discover_resolution_urls(catalog[0], config)
          second_urls = nbu.discover_resolution_urls(catalog[1], config)
          if first_urls != second_urls:
              raise RuntimeError("NBU catalog set changed between independent fetches")
          if not first_urls:
              raise RuntimeError("NBU catalog yielded no resolution URLs")
          if len(first_urls) > config["discovery_contract"]["hard_max_documents"]:
              raise RuntimeError("NBU catalog exceeds hard document bound")

          document_fetches = {
              url: [fetch_html(url), fetch_html(url)]
              for url in first_urls
          }
          evidence = nbu.build_body_free_discovery_evidence(
              config,
              catalog,
              document_fetches,
          )
          nbu.validate_evidence(evidence, config)
          path = Path(os.environ["RUNNER_TEMP"]) / "nbu/discovery-evidence.json"
          path.write_text(
              json.dumps(evidence, ensure_ascii=False, sort_keys=True, separators=(",", ":")) + "\n",
              encoding="utf-8",
          )
          print(
              "NBU_DISCOVERY_PASS documents="
              + str(evidence["discovered_documents"])
              + " evidence="
              + evidence["evidence_identity_sha256"]
          )
          PY

      - name: Pin each official PDF twice without persisting PDF bodies
        shell: bash
        run: |
          set -euo pipefail
          python tools/materialize_d03_ua_nbu_official_pdf_pins_v1.py             "$RUNNER_TEMP/nbu/discovery-evidence.json"             --output "$RUNNER_TEMP/nbu/pdf-pins-evidence.json"

      - name: Independently verify text-free zero-credit evidence
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=. python - <<'PY'
          from __future__ import annotations

          import importlib.util
          import json
          import os
          from pathlib import Path

          root = Path.cwd()
          tmp = Path(os.environ["RUNNER_TEMP"]) / "nbu"
          spec = importlib.util.spec_from_file_location(
              "nbu_pdf_verify",
              root / "tools/materialize_d03_ua_nbu_official_pdf_pins_v1.py",
          )
          if spec is None or spec.loader is None:
              raise SystemExit("cannot load NBU PDF authority")
          module = importlib.util.module_from_spec(spec)
          import sys
          sys.modules[spec.name] = module
          spec.loader.exec_module(module)

          config = module.load_config()
          discovery = json.loads((tmp / "discovery-evidence.json").read_text(encoding="utf-8"))
          pins = json.loads((tmp / "pdf-pins-evidence.json").read_text(encoding="utf-8"))
          module.PARENT.validate_evidence(discovery, module.PARENT.load_config())
          module.validate_pin_evidence(pins, config)

          if pins["pinned_pdfs"] <= 0 or pins["observed_pdf_bytes"] <= 0:
              raise SystemExit("empty live NBU PDF-pin result")
          expected_false = {
              "raw_pdf_bytes_emitted": False,
              "text_materialized": False,
              "tokenizer_fit_authorized": False,
              "model_training_executed": False,
              "final_test_accessed": False,
              "paid_compute_used": False,
          }
          expected_zero = {
              "canonical_capacity_credit_bytes": 0,
              "training_authorized_bytes": 0,
              "authorized_unique_loss_positions": 0,
              "optimizer_updates": 0,
          }
          for field, expected in {**expected_false, **expected_zero}.items():
              observed = pins.get(field)
              if type(observed) is not type(expected) or observed != expected:
                  raise SystemExit(f"truth boundary drift: {field}")
          if any("body" in row or "text" in row for row in pins["pins"]):
              raise SystemExit("raw PDF/text field persisted in pin rows")
          print(
              "NBU_PDF_PIN_QUALIFIED count="
              + str(pins["pinned_pdfs"])
              + " bytes="
              + str(pins["observed_pdf_bytes"])
              + " evidence="
              + pins["evidence_identity_sha256"]
          )
          PY

      - name: Upload body-free NBU evidence only
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: nbu-live-pdf-pins-${{ env.EXECUTION_HEAD }}
          path: |
            ${{ runner.temp }}/nbu/discovery-evidence.json
            ${{ runner.temp }}/nbu/pdf-pins-evidence.json
          if-no-files-found: error
          retention-days: 90
