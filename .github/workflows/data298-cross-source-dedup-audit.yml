name: DATA-298 Cross-Source Dedup Mirror Audit

on:
  pull_request:
    paths:
      - ".github/workflows/data298-cross-source-dedup-audit.yml"
      - "configs/data/data298_cross_source_inventory_v1.json"
      - "docs/DATA298_CROSS_SOURCE_DEDUP_MIRROR_AUDIT.md"
      - "src/twelve_six/data/cross_source_capacity_audit.py"
      - "tests/test_data298_cross_source_capacity_audit.py"
      - "tools/run_data298_cross_source_audit.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cross-source-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      TWELVE_SIX_EXECUTION_PROFILE: LOCAL_FREE
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Prove exact source checkout
        env:
          EXPECTED_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SOURCE_SHA"

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11.16"

      - name: Universal exact LOCAL_FREE bootstrap
        uses: ./.github/actions/execution-bootstrap
        with:
          capabilities: tests,lint
          venv: .data298
          command: python -m pytest -q tests/test_data298_cross_source_capacity_audit.py
          manifest: data298-execution-environment.json

      - name: Compile focused implementation
        run: >-
          PYTHONPATH=src .data298/bin/python -m compileall -q
          src/twelve_six/data/cross_source_capacity_audit.py
          tools/run_data298_cross_source_audit.py

      - name: Focused adversarial tests
        run: >-
          PYTHONPATH=src .data298/bin/python -m pytest -q
          tests/test_data298_cross_source_capacity_audit.py

      - name: Focused lint
        run: >-
          .data298/bin/ruff check --select E4,E9,F
          src/twelve_six/data/cross_source_capacity_audit.py
          tools/run_data298_cross_source_audit.py
          tests/test_data298_cross_source_capacity_audit.py

      - name: Acquire exact objects and run live cross-source audit
        env:
          PYTHONPATH: src
        run: |
          mkdir -p evidence/data298
          .data298/bin/python tools/run_data298_cross_source_audit.py run \
            --inventory configs/data/data298_cross_source_inventory_v1.json \
            --report evidence/data298/cross-source-dedup-live.json

      - name: Verify live capacity boundaries and report identity
        env:
          PYTHONPATH: src
        run: |
          .data298/bin/python tools/run_data298_cross_source_audit.py verify \
            --report evidence/data298/cross-source-dedup-live.json
          .data298/bin/python - <<'PY'
          import json
          from pathlib import Path

          report = json.loads(Path("evidence/data298/cross-source-dedup-live.json").read_text())
          assert report["source_count"] == 7
          assert report["local_free_only"] is True
          assert report["model_training_executed"] is False
          assert report["raw_text_emitted"] is False
          expected = {
              "canonical_registry": (3, 2, 173358),
              "terminal_evidence": (5, 4, 183061),
              "all_observed": (7, 6, 207771),
          }
          for scope_name, (sources, families, before) in expected.items():
              scope = report["scopes"][scope_name]
              assert scope["source_count"] == sources
              assert scope["declared_family_count"] == families
              assert scope["declared_capacity_bytes_before"] == before
              assert scope["conservative_unique_capacity_bytes_after"] <= before
              assert scope["effective_independent_family_count"] <= families
          assert report["scopes"]["all_observed"]["raw_bytes_before"] == 480273
          PY

      - name: Prove report is hash-only/text-free evidence
        run: |
          ! grep -q '"text"' evidence/data298/cross-source-dedup-live.json
          ! grep -q '"acquisition_url"' evidence/data298/cross-source-dedup-live.json

      - name: Upload immutable DATA-298 audit evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: data298-cross-source-dedup-${{ github.event.pull_request.head.sha || github.sha }}
          if-no-files-found: error
          retention-days: 90
          path: |
            configs/data/data298_cross_source_inventory_v1.json
            data298-execution-environment.json
            evidence/data298/cross-source-dedup-live.json
