name: 20M readiness controller

on:
  pull_request:
    paths:
      - "configs/control/20m_readiness_controller_v1.json"
      - "tools/validate_20m_readiness_controller.py"
      - "docs/20M_READINESS_CONTROLLER.md"
      - ".github/workflows/20m-readiness-controller.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11.16"
      - name: Validate live readiness authority
        run: python tools/validate_20m_readiness_controller.py
      - name: Assert LOCAL_FREE truth boundary
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path("configs/control/20m_readiness_controller_v1.json").read_text())
          assert d["execution_profile"] == "LOCAL_FREE"
          assert d["training_executed"] is False
          assert d["paid_compute_used"] is False
          assert d["long_training_authorized"] is False
          assert d["campaign"]["campaign_runnable_now"] is False
          PY
