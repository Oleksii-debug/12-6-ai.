name: Pre-decontamination candidate identity

on:
  push:
    branches:
      - "gpt56/20m-predecontam-identity-verifier-20260826"
    paths:
      - "tools/build_predecontam_candidate_identity.py"
      - "tools/validate_predecontam_candidate_identity.py"
      - "tests/test_predecontam_candidate_identity.py"
      - ".github/workflows/predecontam-candidate-identity.yml"
  pull_request:
    paths:
      - "tools/build_predecontam_candidate_identity.py"
      - "tools/validate_predecontam_candidate_identity.py"
      - "tests/test_predecontam_candidate_identity.py"
      - ".github/workflows/predecontam-candidate-identity.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11.16"
      - name: Install verifier test dependencies
        run: python -m pip install "pytest>=8" "ruff>=0.12"
      - name: Lint verifier contract
        run: >-
          ruff check
          tools/validate_predecontam_candidate_identity.py
          tests/test_predecontam_candidate_identity.py
      - name: Exercise builder determinism
        run: python tools/build_predecontam_candidate_identity.py --self-test
      - name: Verify tamper rejection contract
        run: pytest -q tests/test_predecontam_candidate_identity.py
