name: DATA-295 Balance Policy 20M V1

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-balance-policy:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      TWELVE_SIX_EXECUTION_PROFILE: LOCAL_FREE
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11.16"

      - name: Bind exact source head
        env:
          EXPECTED_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SOURCE_SHA"

      - name: Bootstrap universal exact LOCAL_FREE environment
        uses: ./.github/actions/execution-bootstrap
        with:
          capabilities: runtime,tests
          venv: .data295
          command: python tools/validate_data295_balance_policy.py
          manifest: data295-execution-environment.json

      - name: Compile validator
        run: .data295/bin/python -m py_compile tools/validate_data295_balance_policy.py

      - name: Validate preregistered mixture and ceilings
        run: .data295/bin/python tools/validate_data295_balance_policy.py
