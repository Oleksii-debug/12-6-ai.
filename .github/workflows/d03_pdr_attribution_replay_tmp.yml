name: D03 PDR raw schema diagnostic temporary

on:
  push:
    branches:
      - d03/pdr-attribution-provenance-1071
    paths:
      - .github/workflows/d03_pdr_attribution_replay_tmp.yml

permissions:
  contents: read

concurrency:
  group: d03-pdr-attribution-replay-${{ github.ref }}
  cancel-in-progress: false

jobs:
  schema-diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Download exact source files and print schema names only
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .pdr-src
          mkdir -p .pdr-src/v0
          python - <<'PY'
          import gzip
          import hashlib
          import json
          import urllib.request
          from pathlib import Path

          revision = '177f70f044bd7a347616727c0f33ab4af9baa495'
          files = {
              'v0/00000_collections.jsonl.gz': (
                  '0a5cbe305d7f468aad95a8cfc4d5fae14132bc359ccf92fc3705072db33a46fd',
                  2_000_000,
              ),
              'v0/00000_essays.jsonl.gz': (
                  '825aed6a66ab14f89e1fe3110f67265d511994c52e5aed48b866a9e8a1bdeb4d',
                  2_500_000,
              ),
          }
          for rel, (expected_sha, limit) in files.items():
              url = (
                  'https://huggingface.co/datasets/common-pile/'
                  f'public_domain_review/resolve/{revision}/{rel}?download=true'
              )
              request = urllib.request.Request(
                  url,
                  headers={
                      'User-Agent': '12-6-ai-D03-PDR-schema/1.0',
                      'Accept': 'application/octet-stream',
                  },
              )
              with urllib.request.urlopen(request, timeout=120) as response:
                  payload = response.read(limit + 1)
              assert len(payload) <= limit
              assert hashlib.sha256(payload).hexdigest() == expected_sha
              target = Path('.pdr-src') / rel
              target.parent.mkdir(parents=True, exist_ok=True)
              target.write_bytes(payload)
              with gzip.open(target, 'rt', encoding='utf-8') as handle:
                  row = json.loads(next(handle))
              metadata = row.get('metadata')
              diagnostic = {
                  'file': rel,
                  'top_level_keys': sorted(row),
                  'top_level_types': {
                      key: type(row[key]).__name__ for key in sorted(row)
                  },
                  'metadata_keys': (
                      sorted(metadata) if isinstance(metadata, dict) else None
                  ),
                  'metadata_types': (
                      {
                          key: type(metadata[key]).__name__
                          for key in sorted(metadata)
                      }
                      if isinstance(metadata, dict)
                      else None
                  ),
              }
              print(
                  'PDR_RAW_SCHEMA='
                  + json.dumps(diagnostic, sort_keys=True, separators=(',', ':'))
              )
          PY
          rm -rf .pdr-src