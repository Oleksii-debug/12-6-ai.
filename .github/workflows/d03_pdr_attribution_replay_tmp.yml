        run: test -z "$(git status --porcelain --untracked-files=no)"

  compare-independent-replays:
    name: compare independent replays
    needs: [execute-a, execute-b]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      artifact_id: ${{ steps.upload.outputs.artifact-id }}
      artifact_digest: ${{ steps.upload.outputs.artifact-digest }}
    steps:
      - name: Download replay A evidence
        uses: actions/download-artifact@v4
        with:
          name: d03-pdr-attribution-evidence-a-${{ github.run_id }}
          path: /tmp/pdr-compare/a
      - name: Download replay B evidence
        uses: actions/download-artifact@v4
        with:
          name: d03-pdr-attribution-evidence-b-${{ github.run_id }}
          path: /tmp/pdr-compare/b
      - name: Require deterministic replay evidence
        env:
          EXECUTION_HEAD: ${{ github.sha }}
          A_ARTIFACT_ID: ${{ needs.execute-a.outputs.artifact_id }}
          A_ARTIFACT_DIGEST: ${{ needs.execute-a.outputs.artifact_digest }}
          B_ARTIFACT_ID: ${{ needs.execute-b.outputs.artifact_id }}
          B_ARTIFACT_DIGEST: ${{ needs.execute-b.outputs.artifact_digest }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          a_raw = Path('/tmp/pdr-compare/a/evidence.json').read_bytes()
          b_raw = Path('/tmp/pdr-compare/b/evidence.json').read_bytes()
          a = json.loads(a_raw)
          b = json.loads(b_raw)
          assert a['execution_slot'] == 'A'
          assert b['execution_slot'] == 'B'
          a_cmp = dict(a); b_cmp = dict(b)
          a_cmp.pop('execution_slot'); b_cmp.pop('execution_slot')
          assert a_cmp == b_cmp
          assert a_cmp['candidate_jsonl_sha256'] == '38b0ef94062b80ae1cb8055fe897feb10a1e8d04a9b17340cbc080d4bfb21591'
          assert a_cmp['candidate_jsonl_bytes'] == 5_630_935
          assert a_cmp['selected_record_count'] == 1_166
          assert a_cmp['selected_normalized_utf8_bytes'] == 4_795_007
          assert a_cmp['candidate_projection_identity_sha256'] == 'bf9f7896fc2c940458916184b1b702f443d72290e286ee16b24da4088b2aa4ab'
          boundary = a_cmp['claim_boundary']
          for key in ('training_authorized_bytes', 'authorized_optimized_target_exposure'):
              assert isinstance(boundary[key], int) and not isinstance(boundary[key], bool) and boundary[key] == 0
          for key in ('author_values_persisted_in_evidence', 'training_text_modified', 'canonical_corpus_admitted', 'tokenizer_fit_authorized', 'model_training_executed', 'final_test_payload_accessed', 'paid_compute_used', 'foreign_pretrained_weights_used'):
              assert boundary[key] is False
          assert boundary['source_rights_review_status'] == 'REVIEW_REQUIRED'

          manifest = {
              'schema_version': '12-6.d03-pdr-attribution-run-bound-compare.v1',
              'run_id': int(os.environ['RUN_ID']),
              'run_attempt': int(os.environ['RUN_ATTEMPT']),
              'execution_head_sha': os.environ['EXECUTION_HEAD'],
              'execution_a_artifact': {
                  'id': int(os.environ['A_ARTIFACT_ID']),
                  'digest': os.environ['A_ARTIFACT_DIGEST'],
                  'evidence_sha256': hashlib.sha256(a_raw).hexdigest(),
              },
              'execution_b_artifact': {
                  'id': int(os.environ['B_ARTIFACT_ID']),
                  'digest': os.environ['B_ARTIFACT_DIGEST'],
                  'evidence_sha256': hashlib.sha256(b_raw).hexdigest(),
              },
              'deterministic_evidence': a_cmp,
          }
          output = Path('/tmp/pdr-compare/compare-manifest.json')
          output.write_text(json.dumps(manifest, sort_keys=True, separators=(',', ':')) + '\n', encoding='utf-8')
          print('PDR_ATTRIBUTION_RUN_BOUND_COMPARE=' + json.dumps(manifest, sort_keys=True, separators=(',', ':')))
          PY
      - name: Upload run-bound compare manifest
        id: upload
        uses: actions/upload-artifact@v4
        with:
          name: d03-pdr-attribution-compare-${{ github.run_id }}
          path: /tmp/pdr-compare/compare-manifest.json
          if-no-files-found: error
          retention-days: 30
