name: D03 LangUK Supreme Court Retest Temporary

on:
  pull_request:
    branches: [main]
    paths:
      - "configs/data/d03_languk_supreme_court_retest_v1.json"
      - "tools/retest_d03_languk_supreme_court.py"
      - "tests/test_d03_languk_supreme_court_retest.py"
      - ".github/workflows/d03-languk-supreme-court-retest-temporary.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: d03-languk-supreme-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  exact-retest:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Prove exact checkout
        run: test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11.16"
      - name: Prove exact Python runtime
        run: |
          python - <<'PY'
          import platform
          assert platform.python_implementation() == "CPython"
          assert platform.python_version() == "3.11.16"
          print("python_runtime=", platform.python_version())
          PY
      - name: Install frozen focused runtime
        run: python -m pip install "pyarrow==17.0.0" pytest
      - name: Run inherited adversarial suite
        run: PYTHONPATH=. pytest -q tests/test_d03_languk_supreme_court_retest.py
      - name: Independent exact acquisition and retest A
        run: >-
          python tools/retest_d03_languk_supreme_court.py
          --download
          --parquet "$RUNNER_TEMP/source-a.parquet"
          --output-jsonl "$RUNNER_TEMP/retained-a.jsonl"
          --report "$RUNNER_TEMP/report-a.json"
      - name: Diagnose fail-closed row reasons without emitting text
        if: failure()
        run: |
          python - <<'PY'
          import importlib.util
          import json
          import os
          from collections import Counter
          from pathlib import Path

          import pyarrow.parquet as pq

          source = Path(os.environ["RUNNER_TEMP"]) / "source-a.parquet"
          if not source.exists():
              print("row_diagnostic=source_absent")
              raise SystemExit(0)

          tool_path = Path("tools/retest_d03_languk_supreme_court.py")
          spec = importlib.util.spec_from_file_location("languk_retest", tool_path)
          assert spec is not None and spec.loader is not None
          module = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(module)
          cfg = module.load_config()
          rows = pq.read_table(source).to_pylist()

          annotation = Counter()
          assessed = Counter()
          for row in rows:
              try:
                  module._validate_occurrences(row, row["text"])
              except module.RetestError as exc:
                  annotation[str(exc)] += 1
              else:
                  annotation["PASS"] += 1
              ok, reason, _ = module.assess_row(row, cfg)
              assessed[reason if not ok else "accepted"] += 1

          print("annotation_failure_counts=" + json.dumps(dict(sorted(annotation.items())), sort_keys=True))
          print("assess_reason_counts=" + json.dumps(dict(sorted(assessed.items())), sort_keys=True))
          print("rows_diagnosed=", len(rows))
          PY
      - name: Independent exact acquisition and retest B
        run: >-
          python tools/retest_d03_languk_supreme_court.py
          --download
          --parquet "$RUNNER_TEMP/source-b.parquet"
          --output-jsonl "$RUNNER_TEMP/retained-b.jsonl"
          --report "$RUNNER_TEMP/report-b.json"
      - name: Require byte-identical bounded result
        run: |
          cmp "$RUNNER_TEMP/report-a.json" "$RUNNER_TEMP/report-b.json"
          cmp "$RUNNER_TEMP/retained-a.jsonl" "$RUNNER_TEMP/retained-b.jsonl"
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          report = json.loads((Path(os.environ["RUNNER_TEMP"]) / "report-a.json").read_text(encoding="utf-8"))
          assert report["source_sha256"] == "9b8870d10695715e4a0540c6f8fdca381599c0e6cdbaf3ecdf3c0782207b6597"
          assert report["source_bytes"] == 20220778
          assert 1 <= report["retained_records"] <= 256
          assert report["training_authorized_bytes"] == 0
          assert report["canonical_capacity_credited"] == 0
          assert report["family_credit_added"] == 0
          assert report["universal_pii_absence_claimed"] is False
          assert report["final_test_accessed"] is False
          assert report["paid_compute_used"] is False
          print("parquet_rows=", report["parquet_rows"])
          print("retained_records=", report["retained_records"])
          print("retained_normalized_bytes=", report["retained_normalized_bytes"])
          print("retained_jsonl_sha256=", report["retained_jsonl_sha256"])
          print("report_identity_sha256=", report["report_identity_sha256"])
          print("disposition_counts=", report["disposition_counts"])
          PY
      - name: Upload text-free evidence only
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: d03-languk-supreme-retest-${{ env.SOURCE_SHA }}
          path: ${{ runner.temp }}/report-a.json
          if-no-files-found: error
          retention-days: 30
