name: D03 LangUK Supreme Court Retest Temporary

on:
  pull_request:
    branches: [main]
    paths:
      - "configs/data/d03_languk_supreme_court_retest_v1.json"
      - "tools/retest_d03_languk_supreme_court.py"
      - "tests/test_d03_languk_supreme_court_retest.py"
      - ".github/workflows/d03-languk-supreme-court-retest-temporary.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: d03-languk-supreme-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  exact-retest:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Prove exact checkout
        run: test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install frozen focused runtime
        run: python -m pip install "pyarrow==17.0.0" pytest
      - name: Run inherited adversarial suite
        run: PYTHONPATH=. pytest -q tests/test_d03_languk_supreme_court_retest.py
      - name: Independent exact acquisition and retest A
        run: >-
          python tools/retest_d03_languk_supreme_court.py
          --download
          --parquet "$RUNNER_TEMP/source-a.parquet"
          --output-jsonl "$RUNNER_TEMP/retained-a.jsonl"
          --report "$RUNNER_TEMP/report-a.json"
      - name: Diagnose annotation-count contract without emitting text
        if: failure()
        run: |
          python - <<'PY'
          import json
          import os
          import re
          from pathlib import Path

          import pyarrow.parquet as pq

          source = Path(os.environ["RUNNER_TEMP"]) / "source-a.parquet"
          if not source.exists():
              print("annotation_diagnostic=source_absent")
              raise SystemExit(0)

          categories = {
              "number": ("number_count", "number_occurrences", re.compile(r"НОМЕР_[1-9][0-9]*")),
              "information": ("information_count", "information_occurrences", re.compile(r"ІНФОРМАЦІЯ_[1-9][0-9]*")),
              "person": ("person_count", "person_occurrences", re.compile(r"ОСОБА_[1-9][0-9]*")),
              "address": ("address_count", "address_occurrences", re.compile(r"АДРЕСА_[1-9][0-9]*")),
          }
          table = pq.read_table(source)
          rows = table.to_pylist()
          report = {
              "rows": len(rows),
              "schema_names": table.schema.names,
              "categories": {},
              "sum_of_unique_entities": {
                  "equals_nonzero_category_count": 0,
                  "equals_total_distinct_marker_labels": 0,
              },
          }
          for category, (count_field, occurrence_field, pattern) in categories.items():
              stats = {
                  "declared_equals_annotation_len": 0,
                  "declared_equals_regex_occurrences": 0,
                  "declared_equals_distinct_marker_labels": 0,
                  "annotation_len_equals_regex_occurrences": 0,
                  "mismatch_rows": 0,
                  "first_mismatch": None,
              }
              for row_index, row in enumerate(rows):
                  text = row["text"]
                  declared = row[count_field]
                  annotations = row[occurrence_field]
                  annotation_len = len(annotations)
                  matches = pattern.findall(text)
                  regex_occurrences = len(matches)
                  distinct_marker_labels = len(set(matches))
                  stats["declared_equals_annotation_len"] += int(declared == annotation_len)
                  stats["declared_equals_regex_occurrences"] += int(declared == regex_occurrences)
                  stats["declared_equals_distinct_marker_labels"] += int(
                      declared == distinct_marker_labels
                  )
                  stats["annotation_len_equals_regex_occurrences"] += int(
                      annotation_len == regex_occurrences
                  )
                  if declared != annotation_len:
                      stats["mismatch_rows"] += 1
                      if stats["first_mismatch"] is None:
                          stats["first_mismatch"] = {
                              "row_index": row_index,
                              "declared": declared,
                              "annotation_len": annotation_len,
                              "regex_occurrences": regex_occurrences,
                              "distinct_marker_labels": distinct_marker_labels,
                          }
              report["categories"][category] = stats

          for row in rows:
              distinct_by_category = []
              for count_field, _, pattern in categories.values():
                  matches = pattern.findall(row["text"])
                  distinct_by_category.append(len(set(matches)))
              nonzero_categories = sum(value > 0 for value in distinct_by_category)
              total_distinct_labels = sum(distinct_by_category)
              declared_sum = row["sum_of_unique_entities"]
              report["sum_of_unique_entities"]["equals_nonzero_category_count"] += int(
                  declared_sum == nonzero_categories
              )
              report["sum_of_unique_entities"]["equals_total_distinct_marker_labels"] += int(
                  declared_sum == total_distinct_labels
              )

          print("annotation_contract_diagnostic=" + json.dumps(report, sort_keys=True))
          PY
      - name: Independent exact acquisition and retest B
        run: >-
          python tools/retest_d03_languk_supreme_court.py
          --download
          --parquet "$RUNNER_TEMP/source-b.parquet"
          --output-jsonl "$RUNNER_TEMP/retained-b.jsonl"
          --report "$RUNNER_TEMP/report-b.json"
      - name: Require byte-identical bounded result
        run: |
          cmp "$RUNNER_TEMP/report-a.json" "$RUNNER_TEMP/report-b.json"
          cmp "$RUNNER_TEMP/retained-a.jsonl" "$RUNNER_TEMP/retained-b.jsonl"
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          report = json.loads((Path(os.environ["RUNNER_TEMP"]) / "report-a.json").read_text(encoding="utf-8"))
          assert report["source_sha256"] == "9b8870d10695715e4a0540c6f8fdca381599c0e6cdbaf3ecdf3c0782207b6597"
          assert report["source_bytes"] == 20220778
          assert 1 <= report["retained_records"] <= 256
          assert report["training_authorized_bytes"] == 0
          assert report["canonical_capacity_credited"] == 0
          assert report["family_credit_added"] == 0
          assert report["universal_pii_absence_claimed"] is False
          assert report["final_test_accessed"] is False
          assert report["paid_compute_used"] is False
          print("parquet_rows=", report["parquet_rows"])
          print("retained_records=", report["retained_records"])
          print("retained_normalized_bytes=", report["retained_normalized_bytes"])
          print("retained_jsonl_sha256=", report["retained_jsonl_sha256"])
          print("report_identity_sha256=", report["report_identity_sha256"])
          print("disposition_counts=", report["disposition_counts"])
          PY
      - name: Upload text-free evidence only
        uses: actions/upload-artifact@v4
        with:
          name: d03-languk-supreme-retest-${{ env.SOURCE_SHA }}
          path: ${{ runner.temp }}/report-a.json
          if-no-files-found: error
          retention-days: 30
