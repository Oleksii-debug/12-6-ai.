name: D03 LangUK Supreme Court Retest Temporary

on:
  pull_request:
    branches: [main]
    paths:
      - "configs/data/d03_languk_supreme_court_retest_v1.json"
      - "tools/retest_d03_languk_supreme_court.py"
      - "tests/test_d03_languk_supreme_court_retest.py"
      - ".github/workflows/d03-languk-supreme-court-retest-temporary.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: d03-languk-supreme-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  exact-retest:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Prove exact checkout
        run: test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install frozen focused runtime
        run: python -m pip install "pyarrow==17.0.0" pytest
      - name: Run inherited adversarial suite
        run: PYTHONPATH=. pytest -q tests/test_d03_languk_supreme_court_retest.py
      - name: Independent exact acquisition and retest A
        run: >-
          python tools/retest_d03_languk_supreme_court.py
          --download
          --parquet "$RUNNER_TEMP/source-a.parquet"
          --output-jsonl "$RUNNER_TEMP/retained-a.jsonl"
          --report "$RUNNER_TEMP/report-a.json"
      - name: Independent exact acquisition and retest B
        run: >-
          python tools/retest_d03_languk_supreme_court.py
          --download
          --parquet "$RUNNER_TEMP/source-b.parquet"
          --output-jsonl "$RUNNER_TEMP/retained-b.jsonl"
          --report "$RUNNER_TEMP/report-b.json"
      - name: Require byte-identical bounded result
        run: |
          cmp "$RUNNER_TEMP/report-a.json" "$RUNNER_TEMP/report-b.json"
          cmp "$RUNNER_TEMP/retained-a.jsonl" "$RUNNER_TEMP/retained-b.jsonl"
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          report = json.loads((Path(os.environ["RUNNER_TEMP"]) / "report-a.json").read_text(encoding="utf-8"))
          assert report["source_sha256"] == "9b8870d10695715e4a0540c6f8fdca381599c0e6cdbaf3ecdf3c0782207b6597"
          assert report["source_bytes"] == 20220778
          assert 1 <= report["retained_records"] <= 256
          assert report["training_authorized_bytes"] == 0
          assert report["canonical_capacity_credited"] == 0
          assert report["family_credit_added"] == 0
          assert report["universal_pii_absence_claimed"] is False
          assert report["final_test_accessed"] is False
          assert report["paid_compute_used"] is False
          print("parquet_rows=", report["parquet_rows"])
          print("retained_records=", report["retained_records"])
          print("retained_normalized_bytes=", report["retained_normalized_bytes"])
          print("retained_jsonl_sha256=", report["retained_jsonl_sha256"])
          print("report_identity_sha256=", report["report_identity_sha256"])
          print("disposition_counts=", report["disposition_counts"])
          PY
      - name: Upload text-free evidence only
        uses: actions/upload-artifact@v4
        with:
          name: d03-languk-supreme-retest-${{ env.SOURCE_SHA }}
          path: ${{ runner.temp }}/report-a.json
          if-no-files-found: error
          retention-days: 30
