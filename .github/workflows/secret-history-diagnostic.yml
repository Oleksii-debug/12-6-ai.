name: Secret History Diagnostic
on:
  pull_request:
permissions:
  contents: read

env:
  GITLEAKS_VERSION: "8.30.1"
  GITLEAKS_ARCHIVE_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"

jobs:
  sanitized-history-findings:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install hash-verified Gitleaks
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/gitleaks.tar.gz"
          bindir="$RUNNER_TEMP/gitleaks-bin"
          mkdir -p "$bindir"
          curl --fail --location --proto '=https' --tlsv1.2 --retry 3 --retry-all-errors \
            --output "$archive" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          printf '%s  %s\n' "$GITLEAKS_ARCHIVE_SHA256" "$archive" | sha256sum --check --strict
          tar -xzf "$archive" -C "$bindir" gitleaks
          "$bindir/gitleaks" version
          echo "$bindir" >> "$GITHUB_PATH"
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11.16"
      - name: Produce sanitized complete-history finding metadata
        id: history_scan
        shell: bash
        env:
          PYTHONPATH: src
        run: |
          set -euo pipefail
          raw_report="$RUNNER_TEMP/gitleaks-raw.json"
          sanitized_report="$RUNNER_TEMP/gitleaks-sanitized.json"
          trap 'rm -f "$raw_report"' EXIT
          set +e
          gitleaks git --redact --exit-code 23 --config .gitleaks.toml \
            --report-format json --report-path "$raw_report" \
            --log-opts="--full-history --all --diff-filter=tuxdb" .
          scan_status=$?
          set -e
          if [ "$scan_status" -ne 0 ] && [ "$scan_status" -ne 23 ]; then
            echo "unexpected Gitleaks exit code: $scan_status" >&2
            exit 1
          fi
          python tools/sanitize_gitleaks_report.py "$raw_report" "$sanitized_report"
          cp "$sanitized_report" sanitized-gitleaks-findings.json
          printf 'scan_exit_code=%s\n' "$scan_status" >> "$GITHUB_OUTPUT"
          cat sanitized-gitleaks-findings.json
      - name: Upload sanitized finding metadata only
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: sanitized-gitleaks-findings
          path: sanitized-gitleaks-findings.json
          if-no-files-found: error
          retention-days: 14
      - name: Preserve fail-closed secret gate
        env:
          PYTHONPATH: src
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          report = json.loads(Path("sanitized-gitleaks-findings.json").read_text(encoding="utf-8"))
          count = report["finding_count"]
          scan_exit_code = "${{ steps.history_scan.outputs.scan_exit_code }}"
          expected = "0" if count == 0 else "23"
          if scan_exit_code != expected:
              raise SystemExit(
                  f"inconsistent scan evidence: findings={count} scan_exit_code={scan_exit_code}"
              )
          if count:
              raise SystemExit(f"complete-history secret gate remains blocked: findings={count}")
          print("secret_history_gate=pass findings=0")
          PY
