name: RESEARCH20 Gradient Stochasticity

on:
  pull_request:

permissions:
  contents: read

jobs:
  gradient-stochasticity-cpu:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Prove exact source checkout
        env:
          SOURCE_SHA: ${{ github.event.pull_request.head.sha }}
        run: test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11.16"
      - name: Verify exact locked environment inputs
        env:
          SOURCE_SHA: ${{ github.event.pull_request.head.sha }}
        run: >-
          python tools/verify_locked_environment.py
          --profile linux-x86_64
          --source-sha "$SOURCE_SHA"
          --evidence-out research20-locked-environment.json
      - name: Create locked LOCAL_FREE execution environment
        run: |
          python -m venv .research20-locked
          .research20-locked/bin/python -m pip install --disable-pip-version-check --require-hashes --no-deps -r requirements/locks/linux-x86_64/toolchain.lock.txt
          .research20-locked/bin/python -m pip install --disable-pip-version-check --require-hashes --no-deps -r requirements/locks/linux-x86_64/runtime.lock.txt
          .research20-locked/bin/python -m pip install --disable-pip-version-check --require-hashes --no-deps -r requirements/locks/linux-x86_64/dev.lock.txt
          PIP_NO_INDEX=1 PIP_DISABLE_PIP_VERSION_CHECK=1 .research20-locked/bin/python -m pip install --no-deps --no-build-isolation -e .
      - name: Run focused contract tests
        run: |
          .research20-locked/bin/ruff check src/twelve_six/gradient_noise.py tools/run_gradient_noise_matrix.py tests/test_gradient_noise.py
          .research20-locked/bin/python -m pytest -q tests/test_gradient_noise.py
      - name: Execute full affordable 100K-to-1M matrix
        env:
          SOURCE_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          .research20-locked/bin/python tools/run_gradient_noise_matrix.py run \
            --repo-root . \
            --source-sha "$SOURCE_SHA" \
            --config configs/experiments/gradient_stochasticity_matrix_v1.json \
            --output research20-gradient-stochasticity.json
          .research20-locked/bin/python tools/run_gradient_noise_matrix.py validate \
            research20-gradient-stochasticity.json \
            --expected-source-sha "$SOURCE_SHA"
      - name: Upload machine-readable diagnostic evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: research20-gradient-stochasticity-evidence
          path: |
            research20-locked-environment.json
            research20-gradient-stochasticity.json
          if-no-files-found: error
          retention-days: 30
