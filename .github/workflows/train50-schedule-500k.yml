name: TRAIN-50 500K Learning-Rate Schedule Comparison

on:
  pull_request:

permissions:
  contents: read

jobs:
  schedule-500k-cpu:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Prove exact source checkout
        env:
          SOURCE_SHA: ${{ github.event.pull_request.head.sha }}
        run: test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11.16"
      - name: Verify exact locked environment inputs
        env:
          SOURCE_SHA: ${{ github.event.pull_request.head.sha }}
        run: >-
          python tools/verify_locked_environment.py
          --profile linux-x86_64
          --source-sha "$SOURCE_SHA"
          --evidence-out train50-locked-environment.json
      - name: Create locked LOCAL_FREE execution environment
        run: |
          python -m venv .train50-locked
          .train50-locked/bin/python -m pip install --disable-pip-version-check --require-hashes --no-deps -r requirements/locks/linux-x86_64/toolchain.lock.txt
          .train50-locked/bin/python -m pip install --disable-pip-version-check --require-hashes --no-deps -r requirements/locks/linux-x86_64/runtime.lock.txt
          PIP_NO_INDEX=1 PIP_DISABLE_PIP_VERSION_CHECK=1 .train50-locked/bin/python -m pip install --no-deps --no-build-isolation -e .
      - name: Focused TRAIN-50 contract tests
        run: .train50-locked/bin/python -m pytest -q tests/test_schedule_experiment.py
      - name: Execute full-horizon two-seed schedule comparison
        env:
          SOURCE_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          .train50-locked/bin/python -m twelve_six.training.schedule_experiment run \
            --repo-root . \
            --source-sha "$SOURCE_SHA" \
            --plan configs/runs/train50_schedule_500k.experimental.json \
            --output train50-schedule-results.json \
            --torch-threads 2
          .train50-locked/bin/python -m twelve_six.training.schedule_experiment validate \
            train50-schedule-results.json \
            --expected-source-sha "$SOURCE_SHA"
      - name: Print compact scientific summary
        run: |
          .train50-locked/bin/python - <<'PY'
          import json
          report = json.load(open("train50-schedule-results.json", encoding="utf-8"))
          print(json.dumps({
              "source": report["source"],
              "parameters": report["model"]["parameter_count"],
              "planned_optimizer_steps": report["plan"]["planned_optimizer_steps"],
              "planned_optimized_tokens": report["plan"]["planned_optimized_tokens"],
              "warmup_steps": report["plan"]["warmup_steps"],
              "final_quality": report["final_quality"],
              "time_to_quality": report["time_to_quality"]["aggregate_levels"],
              "report_sha256": report["report_sha256"],
          }, indent=2, sort_keys=True))
          PY
      - name: Upload retained TRAIN-50 evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: train50-schedule-500k-evidence
          path: |
            train50-locked-environment.json
            configs/runs/train50_schedule_500k.experimental.json
            train50-schedule-results.json
          if-no-files-found: error
          retention-days: 30
