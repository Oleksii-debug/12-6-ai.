name: MODEL-341 Independent Exact Runtime Audit

on:
  pull_request:
    paths:
      - "configs/candidates/model341_20m_candidate_a.json"
      - "src/twelve_six/model.py"
      - "requirements/locks/**"
      - "tools/verify_locked_environment.py"
      - "tools/verify_model341_20m_candidate_a_independent.py"
      - "tests/test_model341_20m_independent_verify.py"
      - ".github/workflows/model341-independent-runtime-audit.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  independent-exact-runtime:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Prove exact source checkout
        run: test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11.16"
      - name: Verify locked environment and repository policy
        run: >-
          python tools/verify_locked_environment.py
          --profile linux-x86_64
          --source-sha "$SOURCE_SHA"
          --evidence-out locked-environment-linux-x86_64.json
          --run-repo-checks
      - name: Create exact locked audit environment
        run: |
          python -m venv .model341-audit-locked
          .model341-audit-locked/bin/python -m pip install --disable-pip-version-check --require-hashes --no-deps -r requirements/locks/linux-x86_64/toolchain.lock.txt
          .model341-audit-locked/bin/python -m pip install --disable-pip-version-check --require-hashes --no-deps -r requirements/locks/linux-x86_64/runtime.lock.txt
          .model341-audit-locked/bin/python -m pip install --disable-pip-version-check --require-hashes --no-deps -r requirements/locks/linux-x86_64/dev.lock.txt
          PIP_NO_INDEX=1 PIP_DISABLE_PIP_VERSION_CHECK=1 .model341-audit-locked/bin/python -m pip install --no-deps --no-build-isolation -e .
      - name: Run exact repository runtime and adversarial tests
        run: .model341-audit-locked/bin/python -m pytest -q tests/test_model341_20m_independent_verify.py
      - name: Produce independent machine-readable audit evidence
        run: >-
          .model341-audit-locked/bin/python
          tools/verify_model341_20m_candidate_a_independent.py
          --output "$RUNNER_TEMP/model341-independent-audit.json"
      - name: Validate non-training truth boundary
        run: |
          .model341-audit-locked/bin/python - <<'PY'
          import json
          import os
          from pathlib import Path

          payload = json.loads(
              (Path(os.environ["RUNNER_TEMP"]) / "model341-independent-audit.json").read_text(
                  encoding="utf-8"
              )
          )
          assert payload["verdict"] == "PASS"
          assert payload["pass"] is True
          assert payload["candidate"] == "MODEL-341-20M-CANDIDATE-A"
          assert payload["static_identity"]["breakdown"]["total"] == 20_613_440
          assert payload["runtime"]["same_seed_reproduced"] is True
          assert payload["runtime"]["different_seed_changed"] is True
          assert payload["runtime"]["oversized_context_rejected"] is True
          assert all(payload["adversarial_fail_closed"].values())
          boundary = payload["truth_boundary"]
          assert boundary["local_free_cpu_only"] is True
          assert boundary["random_init_only"] is True
          assert boundary["training_performed"] is False
          assert boundary["checkpoint_loaded"] is False
          assert boundary["learned_quality_claimed"] is False
          PY
      - name: Upload independent audit evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: model341-independent-runtime-audit-${{ env.SOURCE_SHA }}
          path: |
            locked-environment-linux-x86_64.json
            ${{ runner.temp }}/model341-independent-audit.json
          if-no-files-found: error
          retention-days: 30
