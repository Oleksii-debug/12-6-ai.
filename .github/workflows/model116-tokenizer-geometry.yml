name: MODEL-116 Tokenizer Geometry

on:
  pull_request:
    branches:
      - milestone100/first-learned-base-20260826
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  matched-tokenizer-geometry:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      PYTHONPATH: src
      OMP_NUM_THREADS: "2"
      MKL_NUM_THREADS: "2"
    steps:
      - name: Checkout exact MODEL-116 head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up exact Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11.16"

      - name: Bind exact source
        env:
          EXPECTED_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SOURCE_SHA"

      - name: Install hash-locked LOCAL_FREE CPU runtime
        run: |
          set -euo pipefail
          python -m venv .model116
          .model116/bin/python -m pip install \
            --disable-pip-version-check --no-deps --require-hashes \
            -r requirements/locks/linux-x86_64/toolchain.lock.txt
          .model116/bin/python -m pip install \
            --disable-pip-version-check --no-deps --require-hashes \
            -r requirements/locks/linux-x86_64/runtime.lock.txt
          .model116/bin/python -m pip install \
            --disable-pip-version-check --no-deps --require-hashes \
            -r requirements/experiments/tokenizers-linux-x86_64.lock.txt
          test "$(.model116/bin/python -c 'import tokenizers; print(tokenizers.__version__)')" = "0.23.1"

      - name: Compile and test matched-capacity contracts
        run: |
          set -euo pipefail
          .model116/bin/python -m compileall -q src/twelve_six
          .model116/bin/python -m pytest -q \
            tests/test_vocabulary_allocation.py \
            tests/test_model116_tokenizer_geometry.py

      - name: Execute matched tokenizer and geometry matrix
        env:
          EXPECTED_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          .model116/bin/python -m twelve_six.model116_tokenizer_geometry \
            run \
            --repo-root . \
            --source-sha "$EXPECTED_SOURCE_SHA" \
            --output-dir model116-evidence \
            --optimized-tokens 16384

      - name: Validate exact-head evidence
        env:
          EXPECTED_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          .model116/bin/python -m twelve_six.model116_tokenizer_geometry \
            validate model116-evidence/report.json \
            --expected-source-sha "$EXPECTED_SOURCE_SHA"
          .model116/bin/python - <<'PY'
          import json
          from pathlib import Path

          report = json.loads(Path("model116-evidence/report.json").read_text(encoding="utf-8"))
          compact = {
              "source_sha": report["source"]["git_sha"],
              "corpus_identity_sha256": report["corpus"]["identity_sha256"],
              "optimized_tokens_per_row": report["experiment_control"]["optimized_tokens_per_row"],
              "matrix_rows": len(report["matrix"]),
              "scales": {
                  scale: {
                      "recommendation": value["scale_dependent_recommendation"],
                      "observed_preferred_vocab": value["observed_preferred_vocab"],
                      "seed_unanimity": value["seed_unanimity"],
                      "ranked": [
                          {
                              "vocab": row["vocab_size"],
                              "params": row["parameter_count"],
                              "d_ff": row["d_ff"],
                              "final_macro_bpb": row["mean_final_macro_bpb"],
                              "tokens_per_second": row["mean_optimized_tokens_per_second"],
                          }
                          for row in value["ranked_candidates"]
                      ],
                  }
                  for scale, value in report["recommendation"]["scales"].items()
              },
              "global_freeze": report["recommendation"]["global_freeze"],
              "report_sha256": report["report_sha256"],
          }
          print(json.dumps(compact, ensure_ascii=False, sort_keys=True, indent=2))
          PY

      - name: Publish compact MODEL-116 evidence to PR
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          .model116/bin/python - <<'PY'
          import json
          from pathlib import Path

          r = json.loads(Path("model116-evidence/report.json").read_text(encoding="utf-8"))
          lines = [
              "### MODEL-116 exact-head matched-capacity evidence",
              "",
              f"- source SHA: `{r['source']['git_sha']}`",
              f"- DATA-25 corpus: `{r['corpus']['identity_sha256']}`",
              f"- matched rows: `{len(r['matrix'])}` (3 scales × 3 vocabularies × 2 seeds)",
              f"- optimized tokens per row: `{r['experiment_control']['optimized_tokens_per_row']}`",
              "- larger-vocabulary extra total capacity: `DISALLOWED`",
              "- canonical tokenizer freeze: `NO`",
              "",
          ]
          for scale, value in r["recommendation"]["scales"].items():
              lines.append(
                  f"- {scale} params: `{value['scale_dependent_recommendation']}`; "
                  f"observed best vocab `{value['observed_preferred_vocab']}`; "
                  f"seed unanimity `{value['seed_unanimity']}`"
              )
          lines += [
              "",
              "Truth boundary: this is bounded LOCAL_FREE evidence on DATA-25. DATA-25 has zero "
              "external training-eligible sources, so these observations cannot establish a "
              "real-world-representative canonical vocabulary freeze.",
              "",
              f"Report SHA-256: `{r['report_sha256']}`",
          ]
          Path("model116-evidence/pr-comment.md").write_text("\n".join(lines) + "\n", encoding="utf-8")
          PY
          gh pr comment "$PR_NUMBER" --repo "$GH_REPO" --body-file model116-evidence/pr-comment.md

      - name: Upload MODEL-116 evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: model116-tokenizer-geometry
          path: |
            model116-evidence/report.json
            model116-evidence/machine-manifest.json
            model116-evidence/corpus-manifest.json
            model116-evidence/tokenizer-training-selection.json
            model116-evidence/tokenizers/
            model116-evidence/rows/
          if-no-files-found: error
          retention-days: 30
