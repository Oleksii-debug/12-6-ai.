name: EVAL-237 Source-Family Generalization V2

on:
  pull_request:

permissions:
  contents: read

jobs:
  eval237-contract-and-readiness:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Prove exact source checkout
        env:
          SOURCE_SHA: ${{ github.event.pull_request.head.sha }}
        run: test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11.16"
      - name: Universal locked bootstrap
        env:
          SOURCE_SHA: ${{ github.event.pull_request.head.sha }}
        run: >-
          python tools/verify_locked_environment.py
          --profile linux-x86_64
          --source-sha "$SOURCE_SHA"
          --evidence-out locked-environment-linux-x86_64.json
      - name: Create exact locked EVAL-237 environment
        run: |
          python -m venv .eval237-locked
          .eval237-locked/bin/python -m pip install --disable-pip-version-check --require-hashes --no-deps -r requirements/locks/linux-x86_64/toolchain.lock.txt
          .eval237-locked/bin/python -m pip install --disable-pip-version-check --require-hashes --no-deps -r requirements/locks/linux-x86_64/runtime.lock.txt
          .eval237-locked/bin/python -m pip install --disable-pip-version-check --require-hashes --no-deps -r requirements/locks/linux-x86_64/dev.lock.txt
          PIP_NO_INDEX=1 PIP_DISABLE_PIP_VERSION_CHECK=1 .eval237-locked/bin/python -m pip install --no-deps --no-build-isolation -e .
      - name: Compile focused implementation
        run: >-
          .eval237-locked/bin/python -m compileall -q
          src/twelve_six/training/source_generalization.py
          src/twelve_six/training/source_family_generalization_v2.py
          tools/run_eval237_source_family_generalization_v2.py
          tests/test_source_generalization.py
          tests/test_source_family_generalization_v2.py
      - name: Exercise inherited and V2 contracts
        run: >-
          .eval237-locked/bin/python -m pytest -q
          tests/test_source_generalization.py
          tests/test_source_family_generalization_v2.py
      - name: Reproduce fail-closed DATA-230 readiness evidence
        run: |
          .eval237-locked/bin/python tools/run_eval237_source_family_generalization_v2.py \
            --blocked-missing-data230 \
            --output eval237-readiness.generated.json
          .eval237-locked/bin/python tools/run_eval237_source_family_generalization_v2.py \
            --validate-blocked eval237-readiness.generated.json
          cmp reports/eval237/eval237-readiness.json eval237-readiness.generated.json
      - name: Upload exact readiness evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: eval237-source-family-generalization-v2
          path: |
            locked-environment-linux-x86_64.json
            eval237-readiness.generated.json
          if-no-files-found: error
          retention-days: 30
