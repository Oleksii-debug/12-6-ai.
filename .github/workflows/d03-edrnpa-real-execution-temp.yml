name: TEMP D03 EDRNPA structural diagnosis

on:
  push:
    branches:
      - d03/edrnpa-open-data-probe-20260907
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect-current-edrnpa:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out exact Product head
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Acquire exact current resource once and inventory archive structure
        run: |
          python - <<'PY'
          import collections
          import hashlib
          import importlib.util
          import shutil
          import zipfile
          from pathlib import Path

          tool = Path('tools/probe_d03_edrnpa_open_data_v1.py')
          spec = importlib.util.spec_from_file_location('edrnpa_probe', tool)
          assert spec is not None and spec.loader is not None
          mod = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(mod)

          root = Path('/tmp/edrnpa-structure')
          root.mkdir(parents=True, exist_ok=True)
          source = mod.download_archive(timeout=240.0)
          if mod.md5(source) != mod.RESOURCE_MD5:
              raise SystemExit('exact current resource MD5 mismatch')
          source_path = root / 'source.zip'
          source_path.write_bytes(source)
          print(
              'SOURCE '
              f'bytes={len(source)} md5={mod.md5(source)} '
              f'sha256={hashlib.sha256(source).hexdigest()}'
          )

          nested_budget = 1400 * 1024 * 1024
          nested_copied = 0
          with zipfile.ZipFile(source_path) as outer:
              infos = outer.infolist()
              total = sum(i.file_size for i in infos if not i.is_dir())
              print(f'OUTER members={len(infos)} total_uncompressed_bytes={total}')
              for info in infos:
                  print(
                      'OUTER_MEMBER '
                      f'name={info.filename!r} size={info.file_size} '
                      f'compressed={info.compress_size} flags={info.flag_bits}'
                  )
              for index, info in enumerate(infos):
                  if info.is_dir() or not info.filename.casefold().endswith('.zip'):
                      continue
                  if info.file_size > 700 * 1024 * 1024:
                      raise SystemExit(f'nested archive too large for diagnostic: {info.filename}')
                  nested_copied += info.file_size
                  if nested_copied > nested_budget:
                      raise SystemExit('nested diagnostic byte budget exceeded')
                  nested_path = root / f'nested-{index}.zip'
                  with outer.open(info) as src, nested_path.open('wb') as dst:
                      shutil.copyfileobj(src, dst, length=1024 * 1024)
                  with zipfile.ZipFile(nested_path) as nested:
                      ninfos = nested.infolist()
                      suffixes = collections.Counter(
                          Path(i.filename).suffix.casefold() or '<none>'
                          for i in ninfos if not i.is_dir()
                      )
                      sizes = [i.file_size for i in ninfos if not i.is_dir()]
                      print(
                          'NESTED '
                          f'outer_name={info.filename!r} members={len(ninfos)} '
                          f'total_uncompressed_bytes={sum(sizes)} '
                          f'max_member_bytes={max(sizes, default=0)} '
                          f'suffixes={dict(sorted(suffixes.items()))}'
                      )
                      for sample in ninfos[:25]:
                          print(
                              'NESTED_SAMPLE '
                              f'outer_name={info.filename!r} name={sample.filename!r} '
                              f'size={sample.file_size} compressed={sample.compress_size} '
                              f'flags={sample.flag_bits}'
                          )
          PY
