name: TEMP D03 EDRNPA substantive real execution

on:
  push:
    branches:
      - d03/edrnpa-open-data-probe-20260907
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose-current-edrnpa-real-shape:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out exact Product head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11.16'

      - name: Run focused structural regressions
        run: |
          python -m pip install pytest
          python -m pytest -q tests/test_probe_d03_edrnpa_open_data_v1.py
          python -m py_compile tools/probe_d03_edrnpa_open_data_v1.py

      - name: Diagnose real XML hierarchy and attribute lengths without payload text
        run: |
          python - <<'PY'
          import hashlib
          import importlib.util
          import tempfile
          import xml.etree.ElementTree as ET
          from collections import Counter, defaultdict
          from pathlib import Path

          tool = Path('tools/probe_d03_edrnpa_open_data_v1.py')
          spec = importlib.util.spec_from_file_location('edrnpa_probe', tool)
          assert spec is not None and spec.loader is not None
          mod = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(mod)

          counts = Counter()
          path_counts = Counter()
          attribute_names = defaultdict(set)
          item_name_hash_counts = Counter()
          par_def_by_item = defaultdict(Counter)

          def value_hash(value: str) -> str:
              return hashlib.sha256(value.encode('utf-8')).hexdigest()

          with tempfile.TemporaryDirectory(prefix='edrnpa-shape-') as tmp:
              root = Path(tmp)
              source = root / 'source.zip'
              source_identity = mod.download_archive_to(source, timeout=240.0)
              nested_path = root / 'nested.zip'
              mod._extract_nested_zip(source, nested_path)
              nested, info, xml_path = mod._nested_xml_info(nested_path)
              stack = []
              active_item_hashes = []
              with nested:
                  with nested.open(info) as raw:
                      guarded = mod._GuardedXMLReader(raw, expected_size=info.file_size)
                      for event, elem in ET.iterparse(guarded, events=('start', 'end')):
                          tag = mod._local_tag(elem.tag)
                          if event == 'start':
                              stack.append(tag)
                              if tag in {'item', 'text', 'richtext', 'par'}:
                                  path_counts['/'.join(stack[-8:])] += 1
                                  attribute_names[tag].update(elem.attrib)
                              if tag == 'item':
                                  raw_name = elem.attrib.get('name')
                                  name_hash = value_hash(raw_name) if raw_name is not None else '<missing>'
                                  active_item_hashes.append(name_hash)
                                  item_name_hash_counts[name_hash] += 1
                              elif tag == 'par':
                                  counts['par_elements_total'] += 1
                                  if 'def' in elem.attrib:
                                      value = elem.attrib['def']
                                      encoded_len = len(value.encode('utf-8'))
                                      counts['par_def_present'] += 1
                                      counts['par_def_utf8_bytes'] += encoded_len
                                      counts['par_def_max_utf8_bytes'] = max(
                                          counts['par_def_max_utf8_bytes'], encoded_len
                                      )
                                      if value.strip():
                                          counts['par_def_nonempty'] += 1
                                      item_hash = active_item_hashes[-1] if active_item_hashes else '<no-item>'
                                      bucket = par_def_by_item[item_hash]
                                      bucket['elements'] += 1
                                      bucket['utf8_bytes'] += encoded_len
                                      bucket['max_utf8_bytes'] = max(
                                          bucket['max_utf8_bytes'], encoded_len
                                      )
                                      if value.strip():
                                          bucket['nonempty'] += 1
                              continue

                          if tag in {'text', 'richtext', 'par'}:
                              element_text = ''.join(elem.itertext())
                              encoded_len = len(element_text.encode('utf-8'))
                              counts[f'{tag}_itertext_utf8_bytes'] += encoded_len
                              counts[f'{tag}_itertext_nonempty'] += int(bool(element_text.strip()))
                          if tag == 'item':
                              if not active_item_hashes:
                                  raise SystemExit('item stack underflow')
                              active_item_hashes.pop()
                          if tag in {'item', 'text', 'richtext', 'par'}:
                              elem.clear()
                          stack.pop()

                      if guarded.bytes_seen != info.file_size:
                          raise SystemExit('diagnostic did not consume full XML')
                      counts['xml10_control_bytes_removed'] = guarded.removed_control_bytes
                      control_identity = guarded.removal_identity_sha256

              safe = {
                  'source_identity': source_identity,
                  'nested_xml_member': xml_path,
                  'nested_xml_bytes': info.file_size,
                  'counts': dict(sorted(counts.items())),
                  'xml10_control_removal_identity_sha256': control_identity,
                  'target_paths': dict(sorted(path_counts.items())),
                  'attribute_names': {
                      tag: sorted(names) for tag, names in sorted(attribute_names.items())
                  },
                  'item_name_hash_counts': dict(sorted(item_name_hash_counts.items())),
                  'par_def_by_item_name_hash': {
                      key: dict(sorted(value.items()))
                      for key, value in sorted(par_def_by_item.items())
                  },
                  'payload_text_printed': False,
                  'payload_attribute_values_printed': False,
              }
              print('SAFE_REAL_SHAPE', mod.cjson(safe).decode('utf-8').strip())
          PY
