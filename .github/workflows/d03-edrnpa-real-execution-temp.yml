name: TEMP D03 EDRNPA XML schema diagnosis

on:
  push:
    branches:
      - d03/edrnpa-open-data-probe-20260907
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect-current-edrnpa-xml:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out exact Product head
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Inspect nested text XML structure without payload text
        run: |
          python - <<'PY'
          import collections
          import importlib.util
          import shutil
          import xml.etree.ElementTree as ET
          import zipfile
          from pathlib import Path

          tool = Path('tools/probe_d03_edrnpa_open_data_v1.py')
          spec = importlib.util.spec_from_file_location('edrnpa_probe', tool)
          assert spec is not None and spec.loader is not None
          mod = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(mod)

          root = Path('/tmp/edrnpa-schema')
          root.mkdir(parents=True, exist_ok=True)
          source = mod.download_archive(timeout=240.0)
          if mod.md5(source) != mod.RESOURCE_MD5:
              raise SystemExit('exact current resource MD5 mismatch')
          outer_path = root / 'source.zip'
          outer_path.write_bytes(source)

          def local(tag: str) -> str:
              return tag.rsplit('}', 1)[-1] if '}' in tag else tag

          with zipfile.ZipFile(outer_path) as outer:
              info = outer.getinfo('25.2-edrnpa_text.zip')
              nested_path = root / 'texts.zip'
              with outer.open(info) as src, nested_path.open('wb') as dst:
                  shutil.copyfileobj(src, dst, length=1024 * 1024)

          with zipfile.ZipFile(nested_path) as nested:
              ninfos = [i for i in nested.infolist() if not i.is_dir()]
              if len(ninfos) != 1 or not ninfos[0].filename.casefold().endswith('.xml'):
                  raise SystemExit('unexpected nested text ZIP shape')
              info = ninfos[0]
              print(f'XML_MEMBER name={info.filename!r} size={info.file_size} compressed={info.compress_size}')
              with nested.open(info) as stream:
                  depth = 0
                  root_tag = None
                  direct_child_count = 0
                  tag_counts = collections.Counter()
                  for event, elem in ET.iterparse(stream, events=('start', 'end')):
                      tag = local(elem.tag)
                      if event == 'start':
                          if root_tag is None:
                              root_tag = tag
                              print(f'ROOT tag={tag!r} attrs={sorted(local(k) for k in elem.attrib)}')
                          if depth <= 3 and sum(tag_counts.values()) < 120:
                              print(
                                  f'START depth={depth} tag={tag!r} '
                                  f'attrs={sorted(local(k) for k in elem.attrib)}'
                              )
                          depth += 1
                          tag_counts[tag] += 1
                          continue

                      depth -= 1
                      text_chars = len(elem.text or '')
                      if depth == 1:
                          direct_child_count += 1
                          child_shapes = []
                          for child in list(elem)[:40]:
                              child_shapes.append(
                                  (local(child.tag), len(child.text or ''), sorted(local(k) for k in child.attrib))
                              )
                          print(
                              f'ROOT_CHILD index={direct_child_count} tag={tag!r} '
                              f'attrs={sorted(local(k) for k in elem.attrib)} '
                              f'text_chars={text_chars} child_shapes={child_shapes}'
                          )
                          elem.clear()
                          if direct_child_count >= 5:
                              break
                      elif depth >= 1:
                          # Keep the first root-child subtree intact until its end,
                          # then clear it as a unit. No payload text is printed.
                          pass
                  print(f'OBSERVED_TAG_COUNTS {dict(tag_counts)}')
          PY
