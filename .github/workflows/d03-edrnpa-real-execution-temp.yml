name: TEMP D03 EDRNPA substantive real execution

on:
  push:
    branches:
      - d03/edrnpa-open-data-probe-20260907
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair-observed-edrnpa-schema:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out exact Product head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11.16'

      - name: Apply narrow schema-bound repair and adversarial tests
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(text: str, old: str, new: str, label: str) -> str:
              if text.count(old) != 1:
                  raise SystemExit(f'{label}: expected exactly one match, got {text.count(old)}')
              return text.replace(old, new, 1)

          tool_path = Path('tools/probe_d03_edrnpa_open_data_v1.py')
          source = tool_path.read_text(encoding='utf-8')
          source = replace_once(
              source,
              'SCHEMA = "12-6.d03-edrnpa-open-data-candidate.v3"',
              'SCHEMA = "12-6.d03-edrnpa-open-data-candidate.v4"',
              'schema-version',
          )
          source = replace_once(
              source,
              '''    current_chunks: list[str] | None = None
              current_chars = 0
              current_has_par = False
              current_ordinal = 0
          ''',
              '''    current_chunks: list[str] | None = None
              current_chars = 0
              current_richtext_items = 0
              current_ordinal = 0
          ''',
              'document-state',
          )
          source = replace_once(
              source,
              '''                    elif tag == "document":
                          if current_chunks is not None:
                              raise ProbeError("nested document elements forbidden")
                          if database_depth < 1:
                              raise ProbeError("document outside database container")
                          current_chunks = []
                          current_chars = 0
                          current_has_par = False
                          current_ordinal += 1
                      continue
          ''',
              '''                    elif tag == "document":
                          if current_chunks is not None:
                              raise ProbeError("nested document elements forbidden")
                          if database_depth < 1:
                              raise ProbeError("document outside database container")
                          current_chunks = []
                          current_chars = 0
                          current_richtext_items = 0
                          current_ordinal += 1
                      elif current_chunks is not None and tag == "item":
                          if stack != ["rna", "database", "document", "item"]:
                              raise ProbeError("unexpected EDRNPA item path")
                          if set(elem.attrib) != {"name"}:
                              raise ProbeError("unexpected EDRNPA item attributes")
                      elif current_chunks is not None and tag == "richtext":
                          if stack != ["rna", "database", "document", "item", "richtext"]:
                              raise ProbeError("unexpected EDRNPA richtext path")
                          current_richtext_items += 1
                          if current_richtext_items > 1:
                              raise ProbeError(
                                  "document must contain exactly one richtext legal-text item"
                              )
                      elif current_chunks is not None and tag == "par":
                          if stack != [
                              "rna", "database", "document", "item", "richtext", "par"
                          ]:
                              raise ProbeError("unexpected EDRNPA paragraph path")
                          if set(elem.attrib) != {"def"}:
                              raise ProbeError("unexpected EDRNPA paragraph attributes")
                      continue
          ''',
              'observed-start-shape',
          )
          source = replace_once(
              source,
              '''                if current_chunks is not None and tag == "par" and "text" in stack:
                      chunk = "".join(elem.itertext())
                      if len(chunk) > MAX_PARAGRAPH_CHARS:
                          current_chars = MAX_DOCUMENT_CHARS + 1
                      elif current_chars <= MAX_DOCUMENT_CHARS and chunk.strip():
                          current_chunks.append(chunk)
                          current_chars += len(chunk)
                      current_has_par = True
                      elem.clear()
                  elif current_chunks is not None and tag == "text" and not current_has_par:
                      chunk = "".join(elem.itertext())
                      if len(chunk) > MAX_DOCUMENT_CHARS:
                          current_chars = MAX_DOCUMENT_CHARS + 1
                      elif current_chars <= MAX_DOCUMENT_CHARS and chunk.strip():
                          current_chunks.append(chunk)
                          current_chars += len(chunk)
                      elem.clear()
                  elif tag == "document":
          ''',
              '''                if current_chunks is not None and tag == "par":
                      if stack != [
                          "rna", "database", "document", "item", "richtext", "par"
                      ]:
                          raise ProbeError("unexpected EDRNPA paragraph path")
                      chunk = "".join(elem.itertext())
                      if len(chunk) > MAX_PARAGRAPH_CHARS:
                          current_chars = MAX_DOCUMENT_CHARS + 1
                      elif current_chars <= MAX_DOCUMENT_CHARS and chunk.strip():
                          current_chunks.append(chunk)
                          current_chars += len(chunk)
                      elem.clear()
                  elif tag == "document":
          ''',
              'observed-payload-extraction',
          )
          source = replace_once(
              source,
              '''                    if current_chunks is None:
                          raise ProbeError("document finalization state missing")
                      if current_chars > MAX_DOCUMENT_CHARS:
          ''',
              '''                    if current_chunks is None:
                          raise ProbeError("document finalization state missing")
                      if current_richtext_items != 1:
                          raise ProbeError(
                              "document must contain exactly one richtext legal-text item"
                          )
                      if current_chars > MAX_DOCUMENT_CHARS:
          ''',
              'richtext-cardinality',
          )
          source = replace_once(
              source,
              '''                    current_chunks = None
                      current_chars = 0
                      current_has_par = False
                      elem.clear()
          ''',
              '''                    current_chunks = None
                      current_chars = 0
                      current_richtext_items = 0
                      elem.clear()
          ''',
              'document-reset',
          )
          source = replace_once(
              source,
              '"policy": "EDRNPA_UK_DOCUMENT_TEXT_ZERO_CREDIT_V3",',
              '"policy": "EDRNPA_UK_DOCUMENT_RICHTEXT_ZERO_CREDIT_V4",',
              'selection-policy',
          )
          if 'current_has_par' in source:
              raise SystemExit('legacy text/par state survived schema repair')
          tool_path.write_text(source, encoding='utf-8', newline='\n')

          test_path = Path('tests/test_probe_d03_edrnpa_open_data_v1.py')
          tests = test_path.read_text(encoding='utf-8')
          tests = replace_once(
              tests,
              '''        documents.append(
                  "<document>"
                  f'<item name="id">{index}</item>'
                  f'<item name="title">Документ {index}</item>'
                  "<text><richtext>"
                  f"<par>{text}</par>"
                  "</richtext></text>"
                  "</document>"
              )
          ''',
              '''        documents.append(
                  "<document>"
                  f'<item name="metadata"><text>Документ {index}</text></item>'
                  '<item name="legal-text"><richtext>'
                  f'<par def="1">{text}</par>'
                  "</richtext></item>"
                  "</document>"
              )
          ''',
              'synthetic-observed-shape',
          )
          insertion = '''
          
          def test_rejects_legacy_guessed_text_richtext_path() -> None:
              xml = (
                  "<rna><database><document><text><richtext>"
                  f'<par def="1">{_uk("WRONG")}</par>'
                  "</richtext></text></document></database></rna>"
              ).encode()
              data = _archive_from_xml(xml)
              with pytest.raises(mod.ProbeError, match="unexpected EDRNPA richtext path"):
                  mod.materialize_archive_bytes(data, expected_md5=mod.md5(data))
          
          
          def test_requires_exactly_one_observed_richtext_item() -> None:
              missing_xml = (
                  "<rna><database><document>"
                  '<item name="metadata"><text>Документ</text></item>'
                  "</document></database></rna>"
              ).encode()
              missing = _archive_from_xml(missing_xml)
              with pytest.raises(mod.ProbeError, match="exactly one richtext"):
                  mod.materialize_archive_bytes(missing, expected_md5=mod.md5(missing))
          
              text = _uk("TWO")
              multiple_xml = (
                  "<rna><database><document>"
                  '<item name="one"><richtext>'
                  f'<par def="1">{text}</par></richtext></item>'
                  '<item name="two"><richtext>'
                  f'<par def="1">{text}</par></richtext></item>'
                  "</document></database></rna>"
              ).encode()
              multiple = _archive_from_xml(multiple_xml)
              with pytest.raises(mod.ProbeError, match="exactly one richtext"):
                  mod.materialize_archive_bytes(multiple, expected_md5=mod.md5(multiple))
          
          
          '''
          tests = replace_once(
              tests,
              'def test_report_self_hash_is_stable() -> None:\n',
              insertion + 'def test_report_self_hash_is_stable() -> None:\n',
              'adversarial-test-insertion',
          )
          test_path.write_text(tests, encoding='utf-8', newline='\n')
          PY

      - name: Prove repair before publishing it
        run: |
          python -m pip install pytest
          python -m pytest -q tests/test_probe_d03_edrnpa_open_data_v1.py
          python -m py_compile tools/probe_d03_edrnpa_open_data_v1.py tests/test_probe_d03_edrnpa_open_data_v1.py
          git diff --check
          test -n "$(git status --short tools/probe_d03_edrnpa_open_data_v1.py tests/test_probe_d03_edrnpa_open_data_v1.py)"

      - name: Publish tested same-lineage Product repair
        run: |
          git config user.name "12-6-ai swarm worker"
          git config user.email "actions@users.noreply.github.com"
          git add tools/probe_d03_edrnpa_open_data_v1.py tests/test_probe_d03_edrnpa_open_data_v1.py
          git commit -m "D03: bind EDRNPA extraction to observed richtext schema"
          git push origin HEAD:d03/edrnpa-open-data-probe-20260907
