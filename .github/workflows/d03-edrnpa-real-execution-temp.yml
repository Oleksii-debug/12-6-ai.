name: TEMP D03 EDRNPA substantive real execution

on:
  push:
    branches:
      - d03/edrnpa-open-data-probe-20260907
  workflow_dispatch:

permissions:
  contents: read

jobs:
  two-clean-current-edrnpa-materialization:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out exact Product head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11.16'

      - name: Re-prove focused schema and safety regressions
        run: |
          python -m pip install pytest
          python -m pytest -q tests/test_probe_d03_edrnpa_open_data_v1.py
          python -m py_compile tools/probe_d03_edrnpa_open_data_v1.py tests/test_probe_d03_edrnpa_open_data_v1.py

      - name: Execute two independent current-source acquisitions and materializations
        run: |
          python - <<'PY'
          import hashlib
          import importlib.util
          import tempfile
          from pathlib import Path

          tool = Path('tools/probe_d03_edrnpa_open_data_v1.py')
          spec = importlib.util.spec_from_file_location('edrnpa_probe', tool)
          assert spec is not None and spec.loader is not None
          mod = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(mod)

          def selected_payload_identity(rows):
              hasher = hashlib.sha256()
              for row in rows:
                  hasher.update(mod.cjson(row))
              return hasher.hexdigest()

          def run_clean(label: str):
              with tempfile.TemporaryDirectory(prefix=f'edrnpa-{label}-') as tmp:
                  root = Path(tmp)
                  source_path = root / 'source.zip'
                  download_identity = mod.download_archive_to(source_path, timeout=240.0)
                  rows, report = mod.materialize_archive_path(
                      source_path,
                      byte_cap=mod.MAX_SELECTED_BYTES,
                      work_dir=root / 'work',
                  )
                  selection = report['selection']
                  truth = report['truth_boundary']
                  if not rows:
                      raise SystemExit(f'{label}: no selected rows')
                  if selection['selected_bytes'] > mod.MAX_SELECTED_BYTES:
                      raise SystemExit(f'{label}: selected byte cap exceeded')
                  if any(row['training_eligible'] for row in rows):
                      raise SystemExit(f'{label}: training eligibility widened')
                  if any(row['evaluation_eligible'] for row in rows):
                      raise SystemExit(f'{label}: evaluation eligibility widened')
                  required_zero_false = {
                      'canonical_corpus_admitted': False,
                      'canonical_capacity_credit_bytes': 0,
                      'family_count_credit_added': 0,
                      'training_authorized_bytes': 0,
                      'unique_causal_loss_positions': 0,
                      'authorized_optimized_target_exposure': 0,
                      'tokenizer_fit_executed': False,
                      'optimizer_updates': 0,
                      'model_training_executed': False,
                      'final_test_accessed': False,
                      'paid_compute_used': False,
                      'foreign_pretrained_weights_used': False,
                  }
                  for key, expected in required_zero_false.items():
                      if truth.get(key) != expected:
                          raise SystemExit(
                              f'{label}: truth boundary drift for {key}: '
                              f'{truth.get(key)!r} != {expected!r}'
                          )
                  safe = {
                      'label': label,
                      'schema_version': report['schema_version'],
                      'execution_profile': report['execution_profile'],
                      'download_identity': download_identity,
                      'source': {
                          'dataset_id': report['source']['dataset_id'],
                          'resource_id': report['source']['resource_id'],
                          'resource_updated': report['source']['resource_updated'],
                          'resource_md5': report['source']['resource_md5'],
                          'source_sha256': report['source']['source_sha256'],
                          'source_bytes': report['source']['source_bytes'],
                          'nested_zip_member': report['source']['nested_zip_member'],
                          'nested_zip_bytes': report['source']['nested_zip_bytes'],
                          'nested_xml_member': report['source']['nested_xml_member'],
                          'nested_xml_bytes': report['source']['nested_xml_bytes'],
                          'family_id': report['source']['family_id'],
                      },
                      'normalization': {
                          'xml10_control_bytes_removed': report['normalization'][
                              'xml10_control_bytes_removed'
                          ],
                          'xml10_control_removal_identity_sha256': report['normalization'][
                              'xml10_control_removal_identity_sha256'
                          ],
                          'generic_xml_recovery_enabled': report['normalization'][
                              'generic_xml_recovery_enabled'
                          ],
                      },
                      'selection': {
                          key: selection[key]
                          for key in (
                              'policy',
                              'byte_cap',
                              'source_documents',
                              'documents_without_text',
                              'documents_too_short',
                              'documents_too_large',
                              'documents_non_ukrainian',
                              'quarantined_email_or_phone',
                              'duplicate_normalized_objects',
                              'candidate_objects_after_quality',
                              'selected_objects',
                              'selected_bytes',
                              'skipped_for_cap',
                              'inventory_identity_sha256',
                          )
                      },
                      'selected_payload_identity_sha256': selected_payload_identity(rows),
                      'report_identity_sha256': report['report_identity_sha256'],
                      'truth_boundary': truth,
                      'payload_text_printed': False,
                      'candidate_rows_persisted': False,
                  }
                  print(f'SAFE_EDRNPA_{label}', mod.cjson(safe).decode('utf-8').strip())
                  return safe

          first = run_clean('A')
          second = run_clean('B')

          comparable_keys = (
              'schema_version',
              'download_identity',
              'source',
              'normalization',
              'selection',
              'selected_payload_identity_sha256',
              'report_identity_sha256',
              'truth_boundary',
          )
          mismatches = [key for key in comparable_keys if first[key] != second[key]]
          if mismatches:
              raise SystemExit(f'two-clean mismatch: {mismatches}')
          proof = {
              'two_clean_exact_match': True,
              'source_sha256': first['source']['source_sha256'],
              'resource_md5': first['source']['resource_md5'],
              'selected_objects': first['selection']['selected_objects'],
              'selected_bytes': first['selection']['selected_bytes'],
              'inventory_identity_sha256': first['selection'][
                  'inventory_identity_sha256'
              ],
              'selected_payload_identity_sha256': first[
                  'selected_payload_identity_sha256'
              ],
              'report_identity_sha256': first['report_identity_sha256'],
              'authorized_optimized_target_exposure': 0,
              'canonical_capacity_credit_bytes': 0,
              'training_authorized_bytes': 0,
              'payload_text_printed': False,
          }
          print('SAFE_TWO_CLEAN_EDRNPA', mod.cjson(proof).decode('utf-8').strip())
          PY

      - name: Ensure execution did not mutate repository
        run: git diff --exit-code
