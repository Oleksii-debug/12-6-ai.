name: Rada Trees Secondary Role Terminal Probe

on:
  pull_request:
    paths:
      - ".github/workflows/rada-trees-secondary-role-terminal-probe.yml"
      - "configs/data/d03_rada_trees_secondary_role_probe_v1.json"
      - "configs/data/d03_rada_trees_member_classification_v1.json"
      - "tools/probe_d03_rada_trees_secondary_role.py"
      - "tools/classify_d03_rada_trees_members.py"
      - "tools/download_d03_rada_trees_from_hf_snapshot.py"
      - "tools/inventory_d03_rada_trees_archive.py"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rada-trees-secondary-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Prove exact checkout
        run: test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install bounded archive extractor
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends 7zip
          command -v 7zz
          7zz i | head -n 5
      - name: Compile existing probe surface
        run: >-
          python -m py_compile
          tools/probe_d03_rada_trees_secondary_role.py
          tools/classify_d03_rada_trees_members.py
          tools/download_d03_rada_trees_from_hf_snapshot.py
          tools/inventory_d03_rada_trees_archive.py
      - name: Execute exact secondary archive role probe
        run: >-
          python tools/probe_d03_rada_trees_secondary_role.py
          --archive-output "$RUNNER_TEMP/rada_xtag_texts.7z"
          --report-output "$RUNNER_TEMP/rada-secondary-role-report.json"
          --timeout 900
      - name: Assert zero-credit truth boundary
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          path = Path(os.environ["RUNNER_TEMP"]) / "rada-secondary-role-report.json"
          report = json.loads(path.read_text(encoding="utf-8"))
          boundary = report["claim_boundary"]
          assert boundary["training_authorized_bytes"] == 0
          assert boundary["unique_causal_loss_positions_authorized"] == 0
          assert boundary["tokenizer_fit_authorized"] is False
          assert boundary["optimizer_updates"] == 0
          assert boundary["model_training_executed"] is False
          assert boundary["final_test_payload_accessed"] is False
          assert boundary["paid_compute_used"] is False
          assert report["decision"]["training_admission_claimed"] is False
          print("report_sha256=", report["report_sha256"])
          print("content_sha256=", report["source"]["content_sha256_observed"])
          print("member_count=", report["inventory"]["member_count"])
          print("uncompressed_bytes=", report["inventory"]["uncompressed_bytes"])
          print("role_state=", report["decision"]["role_state"])
          print(
              "plain_text_suffix_member_count=",
              report["classification"]["plain_text_suffix_member_count"],
          )
          print(
              "plain_text_candidate_members=",
              report["classification"]["plain_text_candidate_members"],
          )
          print(
              "plain_text_candidate_bytes_after_exact_duplicate_collapse=",
              report["classification"][
                  "plain_text_candidate_bytes_after_exact_duplicate_collapse"
              ],
          )
          PY
      - name: Upload text-free role evidence
        uses: actions/upload-artifact@v4
        with:
          name: rada-trees-secondary-role-${{ env.SOURCE_SHA }}
          path: ${{ runner.temp }}/rada-secondary-role-report.json
          if-no-files-found: error
          retention-days: 30
