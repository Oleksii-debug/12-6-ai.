name: POSTBASE-353 SFT runner mechanics

on:
  push:
    branches:
      - postbase353/sft-runner-mechanics-20260826
  pull_request:
    paths:
      - "src/twelve_six/post_base/**"
      - "tests/test_post_base_sft_runner.py"
      - ".github/workflows/postbase353-sft-runner-mechanics.yml"

permissions:
  contents: read

jobs:
  mechanics:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip
      - run: pip install -e .[dev]
      - run: ruff check src tests
      - run: pytest -q tests/test_post_base_contract.py tests/test_post_base_sft_runner.py
