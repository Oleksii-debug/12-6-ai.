name: POSTBASE-353 SFT runner mechanics

on:
  push:
    branches:
      - postbase353/sft-runner-mechanics-20260826
  pull_request:
    paths:
      - "src/twelve_six/post_base/**"
      - "tests/test_post_base_contract.py"
      - "tests/test_post_base_sft_runner.py"
      - "tests/test_postbase353_recovery.py"
      - ".github/workflows/postbase353-sft-runner-mechanics.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: postbase353-sft-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mechanics:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip
      - run: pip install -e .[dev]
      - name: Scoped import/startup gate
        run: python -m compileall -q src/twelve_six/post_base
      - name: Scoped Ruff gate
        run: >-
          ruff check
          src/twelve_six/post_base/contract.py
          src/twelve_six/post_base/sft_runner.py
          src/twelve_six/post_base/sft_recovery.py
          tests/test_post_base_contract.py
          tests/test_post_base_sft_runner.py
          tests/test_postbase353_recovery.py
      - name: Scoped exact-head component tests
        run: >-
          pytest -q
          tests/test_post_base_contract.py
          tests/test_post_base_sft_runner.py
          tests/test_postbase353_recovery.py
