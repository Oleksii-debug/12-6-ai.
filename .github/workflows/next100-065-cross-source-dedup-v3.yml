name: NEXT100-065 Cross-Source Dedup V3

on:
  pull_request:
    paths:
      - ".github/workflows/next100-065-cross-source-dedup-v3.yml"
      - "configs/data/next100_065_cross_source_dedup_v3.json"
      - "docs/NEXT100_065_CROSS_SOURCE_DEDUP_V3.md"
      - "src/twelve_six/data/cross_source_capacity_audit_v3.py"
      - "tests/test_next100_065_cross_source_dedup_v3.py"
      - "tools/run_next100_065_cross_source_dedup_v3.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  red-team-dedup:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      TWELVE_SIX_EXECUTION_PROFILE: LOCAL_FREE
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Prove exact source checkout
        env:
          EXPECTED_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SOURCE_SHA"

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11.16"

      - name: Universal exact LOCAL_FREE bootstrap
        uses: ./.github/actions/execution-bootstrap
        with:
          capabilities: runtime,tests,lint
          venv: .next100-065
          command: python -m pytest -q tests/test_data298_cross_source_capacity_audit.py tests/test_next100_065_cross_source_dedup_v3.py
          manifest: next100-065-execution-environment.json

      - name: Compile focused implementation
        run: >-
          PYTHONPATH=src .next100-065/bin/python -m compileall -q
          src/twelve_six/data/cross_source_capacity_audit.py
          src/twelve_six/data/cross_source_capacity_audit_v3.py
          tools/run_next100_065_cross_source_dedup_v3.py

      - name: Inherited exact/near-copy plus V3 lineage adversarial tests
        run: >-
          PYTHONPATH=src .next100-065/bin/python -m pytest -q
          tests/test_data298_cross_source_capacity_audit.py
          tests/test_next100_065_cross_source_dedup_v3.py

      - name: Focused lint
        run: >-
          .next100-065/bin/ruff check --select E4,E9,F
          src/twelve_six/data/cross_source_capacity_audit_v3.py
          tools/run_next100_065_cross_source_dedup_v3.py
          tests/test_next100_065_cross_source_dedup_v3.py

      - name: Materialize live terminal-source audit twice
        env:
          PYTHONPATH: src
        run: |
          mkdir -p evidence/next100_065/a evidence/next100_065/b
          .next100-065/bin/python tools/run_next100_065_cross_source_dedup_v3.py run \
            --inventory configs/data/next100_065_cross_source_dedup_v3.json \
            --report evidence/next100_065/a/report.json
          .next100-065/bin/python tools/run_next100_065_cross_source_dedup_v3.py run \
            --inventory configs/data/next100_065_cross_source_dedup_v3.json \
            --report evidence/next100_065/b/report.json
          cmp evidence/next100_065/a/report.json evidence/next100_065/b/report.json

      - name: Verify conservative capacity and no-training boundary
        env:
          PYTHONPATH: src
        run: |
          .next100-065/bin/python tools/run_next100_065_cross_source_dedup_v3.py verify \
            --report evidence/next100_065/a/report.json
          .next100-065/bin/python - <<'PY'
          import json
          from pathlib import Path

          report = json.loads(Path("evidence/next100_065/a/report.json").read_text())
          scope = report["terminal_candidates"]
          assert report["source_count"] == 5
          assert report["model_training_executed"] is False
          assert scope["declared_capacity_bytes_before"] == 183061
          assert scope["conservative_unique_capacity_bytes_after"] == 183061
          assert scope["duplicate_discount_bytes"] == 0
          assert scope["stable_origin_count"] == 4
          assert scope["effective_independent_origin_count"] == 4
          assert scope["by_modality"]["uk"]["conservative_unique_capacity_bytes_after"] == 88565
          assert scope["by_modality"]["en"]["conservative_unique_capacity_bytes_after"] == 84793
          assert scope["by_modality"]["code"]["conservative_unique_capacity_bytes_after"] == 9703
          PY

      - name: Prove text-free public evidence
        run: |
          ! grep -q '"text"' evidence/next100_065/a/report.json
          ! grep -q '"acquisition_url"' evidence/next100_065/a/report.json

      - name: Upload immutable NEXT100-065 evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: next100-065-cross-source-dedup-${{ github.event.pull_request.head.sha || github.sha }}
          if-no-files-found: error
          retention-days: 90
          path: |
            configs/data/next100_065_cross_source_dedup_v3.json
            next100-065-execution-environment.json
            evidence/next100_065/a/report.json
