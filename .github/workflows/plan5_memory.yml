name: Plan 5 memory scoped qualification

on:
  pull_request:
    paths:
      - 'src/twelve_six_agent_runtime/**'
      - 'tests/test_agent_memory_section3*.py'
      - '.github/workflows/plan5_memory.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  memory:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v4
      - name: Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install local-free qualification tools
        run: python -m pip install 'pytest>=8,<10' 'ruff>=0.12,<1'
      - name: Plan 5 memory, recovery and task-state integration tests
        run: PYTHONPATH=src python -m pytest -q tests/test_agent_memory_section3.py tests/test_agent_memory_section3_adversarial.py tests/test_agent_task_state_section2.py tests/test_agent_task_state_section2_adversarial.py
      - name: Scoped static qualification
        run: ruff check src/twelve_six_agent_runtime/memory.py tests/test_agent_memory_section3.py tests/test_agent_memory_section3_adversarial.py
