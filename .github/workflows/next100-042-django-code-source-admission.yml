name: NEXT100-042 Django Code Source Admission

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qualify-django-code:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      TWELVE_SIX_EXECUTION_PROFILE: LOCAL_FREE
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12.11"

      - name: Bind exact project source head
        env:
          EXPECTED_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SOURCE_SHA"

      - name: Static verifier parse
        run: python -m py_compile tools/next100_042_django_code_admission.py

      - name: Reacquire and qualify exact Django snapshot
        env:
          EXPECTED_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          mkdir -p next100-042-evidence
          python tools/next100_042_django_code_admission.py \
            --repo-root . \
            --config configs/data/next100_042_django_code_source_v1.json \
            --output next100-042-evidence/django-code-source-authority.json \
            --expected-head "$EXPECTED_SOURCE_SHA" \
            | tee next100-042-evidence/stdout.json

      - name: Validate terminal authority invariants
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          report = json.loads(Path("next100-042-evidence/django-code-source-authority.json").read_text())
          assert report["schema_version"] == "12-6.next100-042-django-code-authority.v1"
          assert report["authority"] == "NEXT100_042_DJANGO_CODE_SOURCE_ADMISSION"
          assert report["decision"] == "ADMIT"
          assert report["terminal"] is True
          assert report["execution_profile"] == "LOCAL_FREE"
          assert report["upstream"]["tag"] == "6.0.8"
          assert report["upstream"]["commit"] == "b2821457e8bfa9e9066837b9f9b3a3955224ab19"
          assert report["upstream"]["tag_signature_verified"] is True
          assert report["selected_object_count"] == 3
          assert report["selected_raw_bytes"] == 54156
          assert report["source_family"]["id"] == "github:django/django"
          assert report["source_family"]["family_credit"] == 1
          assert report["source_family"]["independent_of_incumbents"] is True
          assert report["quality"]["all_strict_utf8_identity"] is True
          assert report["quality"]["all_python_ast_parse"] is True
          assert report["quality"]["all_privacy_secret_scans_clear"] is True
          assert report["deduplication"]["compared_object_count"] == 5
          assert report["deduplication"]["exact_duplicate_pairs"] == []
          assert report["deduplication"]["near_duplicate_pairs"] == []
          assert report["rights"]["model_training"] == "ALLOWED"
          assert report["rights"]["redistribution"] == "ALLOWED"
          assert report["evaluation_boundary"]["evaluation_use"] == "NOT_SEPARATELY_AUTHORIZED"
          assert report["evaluation_boundary"]["evaluation_reserved"] is False
          expected = {
              "django/core/signing.py": "d6be4a5d804916e3d7705018f485c4c374d90cc3",
              "django/db/transaction.py": "1710d1ef17497c4aef3f4b65498dd539d0ee0050",
              "django/urls/resolvers.py": "6c681f9d8d32a35ca512cf3d08b68ab5bc358777",
          }
          assert {item["path"]: item["blob_sha1"] for item in report["objects"]} == expected
          PY

      - name: Upload NEXT100-042 immutable evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: next100-042-django-code-authority-${{ github.event.pull_request.head.sha || github.sha }}
          if-no-files-found: error
          retention-days: 90
          path: |
            configs/data/next100_042_django_code_source_v1.json
            next100-042-evidence/
