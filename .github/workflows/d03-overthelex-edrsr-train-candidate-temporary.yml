name: D03 EDRSR Train Candidate Temporary

on:
  pull_request:
    branches: [main]
    paths:
      - "configs/data/d03_overthelex_edrsr_train_candidate_v1.json"
      - "tools/qualify_d03_overthelex_edrsr_train.py"
      - "tests/test_d03_overthelex_edrsr_train_candidate.py"
      - ".github/workflows/d03-overthelex-edrsr-train-candidate-temporary.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: d03-edrsr-train-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  exact-qualification:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Prove exact checkout
        run: test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install frozen focused runtime
        run: python -m pip install "pyarrow==17.0.0" pytest
      - name: Run focused fail-closed suite
        run: PYTHONPATH=. pytest -q tests/test_d03_overthelex_edrsr_train_candidate.py
      - name: Exact immutable acquisition and materialization A
        run: >-
          python tools/qualify_d03_overthelex_edrsr_train.py
          --download
          --parquet "$RUNNER_TEMP/source-a.parquet"
          --output-jsonl "$RUNNER_TEMP/candidate-a.jsonl"
          --report "$RUNNER_TEMP/report-a.json"
      - name: Independent exact acquisition and materialization B
        run: >-
          python tools/qualify_d03_overthelex_edrsr_train.py
          --download
          --parquet "$RUNNER_TEMP/source-b.parquet"
          --output-jsonl "$RUNNER_TEMP/candidate-b.jsonl"
          --report "$RUNNER_TEMP/report-b.json"
      - name: Require byte-identical bounded result
        run: |
          cmp "$RUNNER_TEMP/candidate-a.jsonl" "$RUNNER_TEMP/candidate-b.jsonl"
          cmp "$RUNNER_TEMP/report-a.json" "$RUNNER_TEMP/report-b.json"
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          report = json.loads((Path(os.environ["RUNNER_TEMP"]) / "report-a.json").read_text(encoding="utf-8"))
          assert report["source_sha256"] == "e5706a2a35a0131224dc75eac8345296e11518688c4072dc996b25a55a5b7793"
          assert report["source_bytes"] == 49826322
          assert report["source_rows"] == 11561
          assert report["training_split_only"] is True
          assert report["excluded_evaluation_splits"] == ["validation", "test"]
          assert 0 < report["retained_records"] <= 11561
          assert 0 < report["retained_normalized_bytes"] <= 6000000
          assert report["facts_column_only"] is True
          assert report["dispositive_emitted"] is False
          assert report["outcome_emitted"] is False
          assert report["judge_metadata_emitted"] is False
          assert report["reserved_evaluation_decontamination_complete"] is False
          assert report["training_authorized_bytes"] == 0
          assert report["canonical_capacity_credited"] == 0
          assert report["family_credit_added"] == 0
          assert report["tokenizer_fit_authorized"] is False
          assert report["model_training_executed"] is False
          assert report["optimizer_updates"] == 0
          assert report["final_test_payload_accessed"] is False
          assert report["final_test_outcomes_read"] is False
          assert report["paid_compute_used"] is False
          print("source_rows=", report["source_rows"])
          print("retained_records=", report["retained_records"])
          print("retained_normalized_bytes=", report["retained_normalized_bytes"])
          print("retained_jsonl_sha256=", report["retained_jsonl_sha256"])
          print("report_identity_sha256=", report["report_identity_sha256"])
          print("disposition_counts=", report["disposition_counts"])
          PY
      - name: Upload text-free evidence only
        uses: actions/upload-artifact@v4
        with:
          name: d03-edrsr-train-candidate-${{ env.SOURCE_SHA }}
          path: ${{ runner.temp }}/report-a.json
          if-no-files-found: error
          retention-days: 30
