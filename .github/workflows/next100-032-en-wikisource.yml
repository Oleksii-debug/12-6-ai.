name: NEXT100-032 English Wikisource qualification

on:
  push:
    branches:
      - next100-032/data-en-wikisource-20260826
  pull_request:
    paths:
      - 'evidence/next100_032/**'
      - 'tools/validate_next100_032_en_wikisource.py'
      - 'tests/test_next100_032_en_wikisource.py'
      - 'docs/NEXT100_032_EN_WIKISOURCE.md'
      - 'data/registry/external_snapshots.v2.json'
      - '.github/workflows/next100-032-en-wikisource.yml'

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate sealed authority
        run: python tools/validate_next100_032_en_wikisource.py --repo .
      - name: Focused test
        run: python -m pytest -q tests/test_next100_032_en_wikisource.py
