name: PERF-250 GQA Static KV Convergence V2

on:
  push:
    branches: [perf250/gqa-static-kv-convergence-v2-20260826]
  workflow_dispatch:

concurrency:
  group: perf250-gqa-static-kv-${{ github.ref }}
  cancel-in-progress: true

permissions: {contents: read, actions: read}

jobs:
  local-free-cpu:
    runs-on: ubuntu-24.04
    env:
      PYTHONPATH: src
      PERF250_EXECUTION_PROFILE: LOCAL_FREE
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: "${{ github.sha }}"
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with: {python-version: "3.11.16"}

      - name: Universal bootstrap exact combined-path tests and lint
        uses: ./.github/actions/execution-bootstrap
        with:
          capabilities: runtime,tests,lint
          venv: .perf250-cpu
          command: >-
            python -m pytest -q
            tests/test_attention_perf.py
            tests/test_attention_perf_model_integration.py
            tests/test_static_kv_cache.py
            tests/test_kv_cache_generation.py
            tests/test_cached_batched_generation.py
            tests/test_checkpointing.py
          manifest: reports/perf250/environment.json

      - name: Verify LOCAL_FREE CPU-only boundary
        run: |
          set -euo pipefail
          .perf250-cpu/bin/python - <<'PY'
          import json
          from pathlib import Path
          import torch

          manifest = json.loads(Path('reports/perf250/environment.json').read_text())
          assert manifest['preflight']['status'] == 'PASS'
          assert manifest['plan']['cuda_packages_present'] is False
          assert torch.__version__ == '2.13.0+cpu'
          assert torch.version.cuda is None
          assert torch.cuda.is_available() is False
          print(json.dumps({'bootstrap': 'PASS', 'profile': 'LOCAL_FREE', 'device': 'cpu'}))
          PY

      - name: Prove production GQA remains unexpanded
        run: |
          set -euo pipefail
          if grep -n "def _expand_kv" src/twelve_six/model.py; then
            echo "production attention must not define the old K/V expansion helper" >&2
            exit 1
          fi
          if grep -nE "[kv]\.repeat_interleave\(" src/twelve_six/model.py; then
            echo "production attention must not materialize grouped K/V to query-head width" >&2
            exit 1
          fi

      - name: Prove accepted static decode has no torch.cat growth
        run: |
          set -euo pipefail
          if grep -n "torch\.cat" src/twelve_six/inference/static_kv.py; then
            echo "accepted static KV module must not contain torch.cat" >&2
            exit 1
          fi

      - name: Ruff convergence surface
        run: >-
          .perf250-cpu/bin/ruff check
          src/twelve_six/attention_perf.py
          src/twelve_six/model.py
          src/twelve_six/inference/static_kv.py
          src/twelve_six/integration/s0_runtime.py
          src/twelve_six/integration/torch_batching.py
          tests/test_attention_perf.py
          tests/test_attention_perf_model_integration.py
          tests/test_static_kv_cache.py
          tools/benchmark_static_kv_cache.py
          tools/benchmark_perf250_learned.py

      - name: Measure combined static/native-GQA synthetic control
        run: >-
          .perf250-cpu/bin/python tools/benchmark_static_kv_cache.py
          --repetitions 7
          --output reports/perf250/static_gqa_benchmark.json

      - name: Download exact terminal learned checkpoint artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p learned-artifacts/zips learned-artifacts/m150 learned-artifacts/learn191 learned-artifacts/learn217
          gh api "/repos/${GITHUB_REPOSITORY}/actions/artifacts/9595677772/zip" > learned-artifacts/zips/m150.zip
          gh api "/repos/${GITHUB_REPOSITORY}/actions/artifacts/9597788382/zip" > learned-artifacts/zips/learn191.zip
          gh api "/repos/${GITHUB_REPOSITORY}/actions/artifacts/9602650341/zip" > learned-artifacts/zips/learn217.zip
          echo "c00b7e9006320f8916c739a3311e8cc47ad0d0b16957f8ebd7d19233fd9f1c71  learned-artifacts/zips/m150.zip" | sha256sum -c -
          echo "f57bf36113a68fffd4bfcf877bf08762393479b9c09e6fd0fd613fbb91f044ee  learned-artifacts/zips/learn191.zip" | sha256sum -c -
          echo "8631e90417e40365b3fc0d6bc98ee6adda5a4ed24530e675d9a91c93219537ee  learned-artifacts/zips/learn217.zip" | sha256sum -c -
          unzip -q learned-artifacts/zips/m150.zip -d learned-artifacts/m150
          unzip -q learned-artifacts/zips/learn191.zip -d learned-artifacts/learn191
          unzip -q learned-artifacts/zips/learn217.zip -d learned-artifacts/learn217

      - name: Benchmark learned 1M 3M and 10M checkpoints
        run: >-
          .perf250-cpu/bin/python tools/benchmark_perf250_learned.py
          --repetitions 3
          --checkpoint learned_1m=learned-artifacts/m150/retained/1m/best
          --checkpoint learned_3m=learned-artifacts/learn191/learn191-evidence/3m/checkpoint-t131292
          --checkpoint learned_10m=learned-artifacts/learn217/scale141-evidence/retained/best
          --output reports/perf250/learned_static_gqa_benchmark.json

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: perf250-gqa-static-kv-local-free
          path: |
            reports/perf250/environment.json
            reports/perf250/static_gqa_benchmark.json
            reports/perf250/learned_static_gqa_benchmark.json
          if-no-files-found: warn
