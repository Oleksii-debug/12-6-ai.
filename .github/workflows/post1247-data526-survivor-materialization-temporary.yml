name: Post-1247 DATA526 survivor materialization terminal

on:
  pull_request:
    paths:
      - "tools/materialize_post1247_data526_survivors_v1.py"
      - "tests/test_post1247_data526_survivor_materialization.py"
      - ".github/workflows/post1247-data526-survivor-materialization-temporary.yml"

concurrency:
  group: post1247-data526-survivors-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  actions: read
  contents: read

jobs:
  terminal-materialization:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      TWELVE_SIX_EXECUTION_PROFILE: LOCAL_FREE
      SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.SOURCE_SHA }}
          fetch-depth: 1
          persist-credentials: false

      - name: Prove exact current checkout
        run: test "$(git rev-parse HEAD)" = "$SOURCE_SHA"

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11.16"

      - name: Checkout exact historical DATA-526 materializer
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: 70d6ccc87396d129d00771bbf0b6b29bc673bfc4
          path: _data526_hist
          fetch-depth: 1
          persist-credentials: false

      - name: Install exact historical validation dependencies
        run: >-
          python -m pip install --require-hashes --no-deps
          -r _data526_hist/requirements/locks/linux-x86_64/dev.lock.txt

      - name: Install deterministic PDF extractor used by historical V7 acquisition
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends poppler-utils
          pdftotext -v

      - name: Validate focused current-main contracts before source work
        run: |
          python -m pytest -q \
            tests/test_post1247_data526_survivor_materialization.py \
            tests/test_data526_v8_record_composition.py
          python -m compileall -q \
            tools/materialize_post1247_data526_survivors_v1.py \
            tools/compose_data526_records_from_v8.py \
            tools/materialize_data526_record_inventory_v1.py

      - name: Checkout exact terminal V7 source materializer
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: d3333ec1b4a508df232a5aefccd6686adda745fb
          path: _data526_v7
          fetch-depth: 1
          persist-credentials: false

      - name: Retrieve immutable DATA-213 and V8 authority artifacts twice
        run: |
          set -euo pipefail
          for build in a b; do
            curl --fail --silent --show-error --location \
              -H "Authorization: Bearer $GITHUB_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/Oleksii-debug/12-6-ai./actions/artifacts/9600107886/zip" \
              -o "/tmp/data213-${build}.zip"
            curl --fail --silent --show-error --location \
              -H "Authorization: Bearer $GITHUB_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/Oleksii-debug/12-6-ai./actions/artifacts/10032510626/zip" \
              -o "/tmp/v8-${build}.zip"
          done
          test "$(sha256sum /tmp/data213-a.zip | cut -d' ' -f1)" = \
            "927e10ccb83f919d57a8b78e3ea9cae72f9d4e0232401043234a35eec150074d"
          test "$(sha256sum /tmp/data213-b.zip | cut -d' ' -f1)" = \
            "927e10ccb83f919d57a8b78e3ea9cae72f9d4e0232401043234a35eec150074d"
          test "$(sha256sum /tmp/v8-a.zip | cut -d' ' -f1)" = \
            "960c678fdbe6245658fa69c39edf355eb7b38ef39b7f8f833155c894dbd90385"
          test "$(sha256sum /tmp/v8-b.zip | cut -d' ' -f1)" = \
            "960c678fdbe6245658fa69c39edf355eb7b38ef39b7f8f833155c894dbd90385"
          cmp /tmp/data213-a.zip /tmp/data213-b.zip
          cmp /tmp/v8-a.zip /tmp/v8-b.zip
          mkdir -p /tmp/v8-a /tmp/v8-b
          unzip -q /tmp/v8-a.zip -d /tmp/v8-a
          unzip -q /tmp/v8-b.zip -d /tmp/v8-b

      - name: Rebuild exact historical 48-record graph twice
        run: |
          set -euo pipefail
          rm -rf /tmp/historical-a /tmp/historical-b
          mkdir -p /tmp/historical-a /tmp/historical-b
          (
            cd _data526_hist
            python tools/run_data526_materializer_data_only.py \
              --v7-root ../_data526_v7 \
              --data213-zip /tmp/data213-a.zip \
              --records-jsonl /tmp/historical-a/records.jsonl \
              --inventory-json /tmp/historical-a/inventory.json \
              --evidence-json /tmp/historical-a/evidence.json
            python tools/run_data526_materializer_data_only.py \
              --v7-root ../_data526_v7 \
              --data213-zip /tmp/data213-b.zip \
              --records-jsonl /tmp/historical-b/records.jsonl \
              --inventory-json /tmp/historical-b/inventory.json \
              --evidence-json /tmp/historical-b/evidence.json
          )
          cmp /tmp/historical-a/records.jsonl /tmp/historical-b/records.jsonl
          test "$(sha256sum /tmp/historical-a/records.jsonl | cut -d' ' -f1)" = \
            "2f21f7655c9287bbc7424b410788f431f20f0936f445fefd26fcf6114b772dbd"

      - name: Freshly acquire exact six-family bulk code twice
        run: |
          set -euo pipefail
          rm -rf /tmp/bulk-a /tmp/bulk-b
          mkdir -p /tmp/bulk-a /tmp/bulk-b
          python tools/materialize_data_bulk_code1_permissive_python_bundle.py \
            --workspace /tmp/bulk-a \
            --output /tmp/bulk-a-report.json
          python tools/materialize_data_bulk_code1_permissive_python_bundle.py \
            --workspace /tmp/bulk-b \
            --output /tmp/bulk-b-report.json
          cmp /tmp/bulk-a-report.json /tmp/bulk-b-report.json
          python - <<'PY'
          import json
          from pathlib import Path

          for name in ("a", "b"):
              report = json.loads(Path(f"/tmp/bulk-{name}-report.json").read_text())
              assert report["report_identity_sha256"] == (
                  "80f3a8f20dfb82825e6c89ac1f76f2f41233296b8a426a1cf466b0fcc0892985"
              )
              assert report["eligible_file_count"] == 229
              assert report["eligible_utf8_bytes"] == 3_880_009
              assert report["security"]["credential_scan"] == "PASS_NO_HIGH_CONFIDENCE_HITS"
          PY

      - name: Rebuild exact canonical 275-record pre-decontamination graph twice
        run: |
          set -euo pipefail
          rm -rf /tmp/current-a /tmp/current-b
          mkdir -p /tmp/current-a /tmp/current-b
          python tools/compose_data526_records_from_v8.py \
            --historical-records-jsonl /tmp/historical-a/records.jsonl \
            --bulk-report /tmp/bulk-a-report.json \
            --bulk-workspace /tmp/bulk-a \
            --v8-report /tmp/v8-a/v8-a.json \
            --v8-survivors /tmp/v8-a/v8-survivors-a.json \
            --records-jsonl /tmp/current-a/records.jsonl \
            --inventory-json /tmp/current-a/inventory.json \
            --evidence-json /tmp/current-a/evidence.json \
            --execution-head-sha "$SOURCE_SHA"
          python tools/compose_data526_records_from_v8.py \
            --historical-records-jsonl /tmp/historical-b/records.jsonl \
            --bulk-report /tmp/bulk-b-report.json \
            --bulk-workspace /tmp/bulk-b \
            --v8-report /tmp/v8-b/v8-a.json \
            --v8-survivors /tmp/v8-b/v8-survivors-a.json \
            --records-jsonl /tmp/current-b/records.jsonl \
            --inventory-json /tmp/current-b/inventory.json \
            --evidence-json /tmp/current-b/evidence.json \
            --execution-head-sha "$SOURCE_SHA"
          cmp /tmp/current-a/records.jsonl /tmp/current-b/records.jsonl
          test "$(sha256sum /tmp/current-a/records.jsonl | cut -d' ' -f1)" = \
            "18a933b2e637b4cff497f4acfbff31041d4c0ba21fba397af53d213edfd7a1b7"

      - name: Execute exact post-1247 survivor materialization
        run: |
          set -euo pipefail
          rm -rf /tmp/post1247
          mkdir -p /tmp/post1247 evidence/data526/post1247
          python tools/materialize_post1247_data526_survivors_v1.py \
            --records-jsonl-a /tmp/current-a/records.jsonl \
            --records-jsonl-b /tmp/current-b/records.jsonl \
            --pre-materialization-evidence evidence/data526/v8/materialization_evidence.json \
            --decontamination-evidence evidence/data232/current_reserved_decontamination_v1_terminal.json \
            --survivor-records-jsonl /tmp/post1247/survivors.jsonl \
            --inventory-json evidence/data526/post1247/record_inventory.json \
            --evidence-json evidence/data526/post1247/materialization_evidence.json \
            --execution-head-sha "$SOURCE_SHA"

      - name: Assert real survivor result and zero-credit boundary
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          inv_path = Path("evidence/data526/post1247/record_inventory.json")
          ev_path = Path("evidence/data526/post1247/materialization_evidence.json")
          inv = json.loads(inv_path.read_text())
          ev = json.loads(ev_path.read_text())
          assert inv["record_count"] == ev["result"]["record_count"] == 272
          assert inv["total_payload_bytes"] == ev["result"]["total_payload_bytes"] == 5_921_963
          assert ev["result"]["source_object_count"] == 259
          assert ev["result"]["excluded_record_count"] == 3
          assert ev["result"]["excluded_payload_bytes"] == 173_358
          assert ev["repeat_pre_rebuild_byte_identical"] is True
          assert ev["repeat_survivor_materialization_byte_identical"] is True
          assert ev["authorized_optimized_target_exposure"] == 0
          assert ev["tokenizer_fit_authorized"] is False
          assert ev["training_executed"] is False
          assert ev["optimizer_updates_executed"] == 0
          assert ev["learned_weights_created"] is False
          assert ev["final_test_outcomes_read"] is False
          assert ev["paid_compute_used"] is False
          assert "normalized_payload" not in inv_path.read_text()
          assert "normalized_payload" not in ev_path.read_text()
          PY
          test -s /tmp/post1247/survivors.jsonl
          rm -f /tmp/post1247/survivors.jsonl \
            /tmp/current-a/records.jsonl /tmp/current-b/records.jsonl \
            /tmp/historical-a/records.jsonl /tmp/historical-b/records.jsonl

      - name: Upload text-free post-1247 terminal candidate
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: post1247-data526-survivors-${{ env.SOURCE_SHA }}
          if-no-files-found: error
          retention-days: 90
          path: |
            evidence/data526/post1247/record_inventory.json
            evidence/data526/post1247/materialization_evidence.json
