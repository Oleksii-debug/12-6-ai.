name: NEXT100-053 attrs Code Source Admission

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qualify-attrs:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      TWELVE_SIX_EXECUTION_PROFILE: LOCAL_FREE
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11.16"

      - name: Bind exact source head
        env:
          EXPECTED_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SOURCE_SHA"

      - name: Universal exact bootstrap
        uses: ./.github/actions/execution-bootstrap
        with:
          capabilities: runtime,tests,lint
          venv: .next100-053
          command: python -m pytest
          manifest: next100-053-execution-environment.json

      - name: Static and unit gates
        run: |
          .next100-053/bin/python -m py_compile tools/validate_next100_053_attrs_code_source.py tests/test_next100_053_attrs_code_source.py
          .next100-053/bin/ruff check --select E4,E9,F tools/validate_next100_053_attrs_code_source.py tests/test_next100_053_attrs_code_source.py
          .next100-053/bin/python -m pytest -q tests/test_next100_053_attrs_code_source.py

      - name: Acquire and qualify exact upstream snapshot
        run: |
          rm -rf next100-053-evidence
          mkdir -p next100-053-evidence
          .next100-053/bin/python tools/validate_next100_053_attrs_code_source.py run \
            --repo . \
            --output-dir next100-053-evidence \
            | tee next100-053-evidence/stdout.json

      - name: Validate terminal authority
        run: |
          .next100-053/bin/python tools/validate_next100_053_attrs_code_source.py validate \
            --report next100-053-evidence/next100-053-attrs-code-admission.json
          .next100-053/bin/python - <<'PY'
          import json
          from pathlib import Path

          report = json.loads(Path("next100-053-evidence/next100-053-attrs-code-admission.json").read_text())
          assert report["verdict"] == "ADMIT"
          assert report["source_family"] == "github:python-attrs/attrs"
          assert report["release_tag"] == "26.1.0"
          assert report["upstream_commit"] == "7bfc49e9b22d5ba25b6e429524c3d49fee27cb36"
          assert report["object_count"] == 4
          assert report["capacity_bytes"] == 170435
          assert report["independent_family_credit"] == 1
          assert report["training_purpose_decision"] == "ALLOWED"
          assert report["redistribution_decision"] == "ALLOWED_WITH_LICENSE_CONDITIONS"
          assert report["repository"]["release_tag_verified"] is True
          assert report["repository"]["commit_verified"] is True
          assert report["upstream_ai_policy"]["does_not_override_mit_release_license"] is True
          assert report["normalization_identity_preserved"] is True
          assert report["privacy_secrets_pass"] is True
          assert report["syntax_parse_compile_pass"] is True
          assert report["quality_pass"] is True
          assert report["dedup"]["exact_duplicates"] == []
          assert report["dedup"]["near_duplicate_pairs"] == []
          assert report["evaluation_reservation"]["selected_objects_are_training_only_not_evaluation_authority"] is True
          PY

      - name: Upload immutable evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: next100-053-attrs-admission-${{ github.event.pull_request.head.sha || github.sha }}
          if-no-files-found: error
          retention-days: 90
          path: |
            configs/data/next100_053_attrs_code_source_v1.json
            next100-053-execution-environment.json
            next100-053-evidence/
