name: TOK-37 ByteLevel BPE Vocabulary Sweep

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bpe-vocab-sweep:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11.16"
      - name: Bind exact source and purpose profile
        env:
          EXPECTED_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_SOURCE_SHA"
          test "$(sha256sum requirements/locks/linux-x86_64/profile.json | cut -d' ' -f1)" = "0dbd74f05d2824082d378aa9031141c864f6a092f950d63ccfae0ade4d76e121"
          test "$(sha256sum requirements/profiles/linux-x86_64-tokenizer-experiment/overlay.lock.txt | cut -d' ' -f1)" = "11f27613ee7c15585796af39accde71b1e7c2791c24ff98d74c395262ee68544"
      - name: Install exact purpose-specific tokenizer environment
        run: |
          python -m venv .tok37
          .tok37/bin/python -m pip install \
            --disable-pip-version-check --no-deps --require-hashes \
            -r requirements/locks/linux-x86_64/toolchain.lock.txt
          .tok37/bin/python -m pip install \
            --disable-pip-version-check --no-deps --require-hashes \
            -r requirements/locks/linux-x86_64/runtime.lock.txt
          .tok37/bin/python -m pip install \
            --disable-pip-version-check --no-deps --require-hashes --only-binary=:all: \
            -r requirements/profiles/linux-x86_64-tokenizer-experiment/overlay.lock.txt
          .tok37/bin/python -c "import tokenizers; assert tokenizers.__version__ == '0.23.1'"
      - name: Execute real BPE sweep and model probes
        env:
          EXPECTED_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          PYTHONPATH: src
        run: |
          .tok37/bin/python -m twelve_six.tokenization.bpe_sweep \
            --source-sha "$EXPECTED_SOURCE_SHA" \
            --output tok37-bpe-sweep.json \
            --artifact-dir tok37-artifacts
      - name: Validate retained evidence self-hash and gates
        run: |
          .tok37/bin/python - <<'PY'
          import hashlib, json
          from pathlib import Path
          p = Path('tok37-bpe-sweep.json')
          data = json.loads(p.read_text(encoding='utf-8'))
          expected = data.pop('evidence_sha256')
          canonical = json.dumps(data, ensure_ascii=False, sort_keys=True, separators=(',', ':'))
          assert hashlib.sha256(canonical.encode('utf-8')).hexdigest() == expected
          passed = [r for r in data['results'] if r['status'] == 'PASS']
          assert len(passed) == 6
          assert all(r['repeat_training_identity_exact'] for r in passed)
          assert all(r['training_unknown_tokens'] == 0 for r in passed)
          assert all(r['held_out']['unknown_tokens'] == 0 for r in passed)
          assert all(r['held_out']['round_trip_exact'] for r in passed)
          selected = data['prefilter_model_probe_requested_vocab_sizes']
          assert 2 <= len(selected) <= 3
          assert data['truth_boundary']['representative_corpus_available'] is False
          PY
      - name: Upload TOK-37 evidence and tokenizer artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: tok37-bpe-vocab-sweep
          path: |
            tok37-bpe-sweep.json
            tok37-artifacts/
            requirements/profiles/linux-x86_64-tokenizer-experiment/profile.json
            requirements/profiles/linux-x86_64-tokenizer-experiment/overlay.lock.txt
          if-no-files-found: error
          retention-days: 30
