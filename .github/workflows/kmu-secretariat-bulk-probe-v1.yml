name: KMu Secretariat Bulk Capacity Probe V1

on:
  push:
    branches:
      - data/kmu-secretariat-bulk-probe-20260907
  pull_request:
    paths:
      - "tools/probe_kmu_secretariat_bulk_v1.py"
      - "tests/test_probe_kmu_secretariat_bulk_v1.py"
      - ".github/workflows/kmu-secretariat-bulk-probe-v1.yml"
      - "docs/KMU_SECRETARIAT_BULK_PROBE_V1.md"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: kmu-secretariat-bulk-probe-${{ github.ref }}
  cancel-in-progress: true

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Assert exact checkout
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"

      - name: Set up CPython 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Verify terminal NEXT100-026 parent authority
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p kmu-probe-evidence
          parent_url="https://raw.githubusercontent.com/Oleksii-debug/12-6-ai./40950a950b60921fd856af2719e1ae2486d9e892/configs/data/next100_026_kmu_source_audit_v1.json"
          python - "${parent_url}" <<'PY'
          import json
          import sys
          import urllib.request
          url = sys.argv[1]
          request = urllib.request.Request(url, headers={"User-Agent": "12-6-ai-kmu-capacity-probe/1.0"})
          with urllib.request.urlopen(request, timeout=20) as response:
              data = response.read()
          payload = json.loads(data)
          assert payload["verdict"] == "ADMIT"
          assert payload["manifest_identity_sha256"] == "1f068e6cc5ce3fc4a51d8477acee31fab5a0178e15f49225b57de94c5178f7d9"
          assert payload["source_family"]["family_id"] == "ua.kmu.portal.secretariat-news"
          assert payload["rights"]["license_id"] == "CC-BY-4.0"
          assert payload["rights"]["training"] == "ALLOWED_PRETRAINING"
          assert payload["selection"]["exclude_ministry_syndication"] is True
          assert payload["selection"]["exclude_normative_acts"] is True
          assert payload["purpose"]["final_test"] == "PROHIBITED"
          open("kmu-probe-evidence/parent-authority.json", "wb").write(data)
          PY

      - name: Compile and run adversarial tests
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile tools/probe_kmu_secretariat_bulk_v1.py tests/test_probe_kmu_secretariat_bulk_v1.py
          python tests/test_probe_kmu_secretariat_bulk_v1.py -v

      - name: Execute robots-compliant bounded network probe
        shell: bash
        run: |
          set -euo pipefail
          python tools/probe_kmu_secretariat_bulk_v1.py \
            --max-fetches 120 \
            --delay-seconds 1.05 \
            --output kmu-probe-evidence/report.json

      - name: Check fail-closed truth boundary
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path("kmu-probe-evidence/report.json").read_text())
          boundary = report["probe_boundary"]
          assert boundary["training_authorized_bytes"] == 0
          assert boundary["family_count_credit_added"] == 0
          assert boundary["tokenizer_fit_executed"] is False
          assert boundary["optimizer_updates"] == 0
          assert boundary["final_test_accessed"] is False
          assert boundary["paid_compute_used"] is False
          assert boundary["canonical_registry_mutated"] is False
          assert report["robots_policy"]["configured_delay_seconds"] >= 1.0
          assert report["sample"]["family_cap_bytes"] == 5_400_000
          print(json.dumps({
              "verdict": report["verdict"],
              "news_urls": report["sitemap"]["discovered_news_url_count"],
              "attempted": report["sample"]["attempted_pages"],
              "eligible": report["sample"]["eligible_pages"],
              "observed_unique_probe_bytes": report["sample"]["observed_unique_probe_bytes"],
              "probe_identity_sha256": report["probe_identity_sha256"],
          }, sort_keys=True))
          PY

      - name: Publish probe evidence
        uses: actions/upload-artifact@v4
        with:
          name: kmu-secretariat-bulk-probe-${{ github.sha }}
          path: kmu-probe-evidence/
          if-no-files-found: error
          retention-days: 14
