name: MODEL-19 Init Seeds

on:
  pull_request:
    paths:
      - "src/twelve_six/training/init_seed_experiment.py"
      - "tools/run_init_seed_experiment.py"
      - "configs/experiments/model19_init_seeds_100k_500k.json"
      - "tests/test_init_seed_experiment.py"
      - ".github/workflows/model19-init-seeds.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  local-free-init-seeds:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Prove exact source checkout
        env:
          SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11.16"
      - name: Verify exact D08 locked environment
        env:
          SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: >-
          python tools/verify_locked_environment.py
          --profile linux-x86_64
          --source-sha "$SOURCE_SHA"
          --evidence-out locked-environment-linux-x86_64.json
      - name: Create exact locked MODEL-19 environment
        run: |
          python -m venv .model19-locked
          .model19-locked/bin/python -m pip install --disable-pip-version-check --require-hashes --no-deps -r requirements/locks/linux-x86_64/toolchain.lock.txt
          .model19-locked/bin/python -m pip install --disable-pip-version-check --require-hashes --no-deps -r requirements/locks/linux-x86_64/runtime.lock.txt
          .model19-locked/bin/python -m pip install --disable-pip-version-check --require-hashes --no-deps -r requirements/locks/linux-x86_64/dev.lock.txt
          PIP_NO_INDEX=1 PIP_DISABLE_PIP_VERSION_CHECK=1 .model19-locked/bin/python -m pip install --no-deps --no-build-isolation -e .
      - name: Run MODEL-19 contract tests
        run: .model19-locked/bin/python -m pytest -q tests/test_init_seed_experiment.py
      - name: Execute real LOCAL_FREE init matrix
        env:
          SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          mkdir -p model19-evidence
          .model19-locked/bin/python tools/run_init_seed_experiment.py \
            --source-sha "$SOURCE_SHA" \
            --output model19-evidence/init_seeds_100k_500k.json
          cat model19-evidence/init_seeds_100k_500k.json
      - name: Upload MODEL-19 evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: model19-init-seeds-evidence
          path: |
            locked-environment-linux-x86_64.json
            model19-evidence/
          if-no-files-found: error
          retention-days: 30
