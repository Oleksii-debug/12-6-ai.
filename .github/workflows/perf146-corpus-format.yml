name: PERF-146 Corpus Format Benchmark

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: perf146-corpus-format-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  local-free-corpus-format:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11.16"
      - name: Bind exact source head
        env:
          EXPECTED_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SOURCE_SHA"
      - name: Install exact canonical runtime plus PERF-146 PyArrow overlay
        run: |
          python -m venv .perf146
          .perf146/bin/python -m pip install \
            --disable-pip-version-check --no-deps --require-hashes \
            -r requirements/locks/linux-x86_64/toolchain.lock.txt
          .perf146/bin/python -m pip install \
            --disable-pip-version-check --no-deps --require-hashes \
            -r requirements/locks/linux-x86_64/runtime.lock.txt
          .perf146/bin/python -m pip install \
            --disable-pip-version-check --no-deps --require-hashes \
            -r requirements/locks/linux-x86_64/dev.lock.txt
          .perf146/bin/python -m pip install \
            --disable-pip-version-check --no-deps --require-hashes \
            -r requirements/experiments/perf146-pyarrow-linux-x86_64.lock.txt
          .perf146/bin/python -c \
            'import pyarrow; assert pyarrow.__version__ == "25.0.1", pyarrow.__version__'
      - name: Run focused format invariance tests
        env:
          PYTHONPATH: src
        run: .perf146/bin/python -m pytest -q tests/test_corpus_format.py
      - name: Lint PERF-146 changes
        run: >-
          .perf146/bin/python -m ruff check
          src/twelve_six/data/corpus_format.py
          tools/benchmark_corpus_format.py
          tools/migrate_corpus_format.py
          tests/test_corpus_format.py
      - name: Run real-corpus and larger-scale LOCAL_FREE benchmark
        env:
          PYTHONPATH: src
          PERF146_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: >-
          .perf146/bin/python tools/benchmark_corpus_format.py
          --output perf146-corpus-format-benchmark.json
          --work-dir "${RUNNER_TEMP}/perf146-work"
          --scale-records 12000
          --scale-text-bytes 4096
          --scale-input-parts 12
          --trainer-steps 5
          --loader-workers 2
      - name: Emit retained benchmark evidence to log
        run: cat perf146-corpus-format-benchmark.json
      - name: Upload exact benchmark evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: perf146-corpus-format-benchmark
          path: perf146-corpus-format-benchmark.json
          if-no-files-found: error
          retention-days: 30
