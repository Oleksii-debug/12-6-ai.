name: DATA-228 Source Probe Execution Harness

on:
  pull_request:
    paths:
      - configs/data/data228_probe_trigger.txt

permissions:
  contents: write

jobs:
  execute-probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: data228/real-ua-en-diversity-v2
          fetch-depth: 0

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11.16"

      - name: Run deterministic immutable-source probe
        env:
          PYTHONPATH: src
        run: |
          python tools/run_data228_source_probe.py \
            --config configs/data/data228_source_probe_v1.json \
            --report reports/data228/source-probe.json \
            --evidence-dir data/external/rights-evidence/data228 \
            --max-bytes 2000000

      - name: Commit probe identities to DATA-228 feature branch
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/data228/source-probe.json data/external/rights-evidence/data228
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "DATA-228: record immutable source probe evidence [skip ci]"
          git push origin HEAD:data228/real-ua-en-diversity-v2
