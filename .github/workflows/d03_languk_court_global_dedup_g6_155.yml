name: D03 Lang-UK court global dedup G6 155

on:
  pull_request:
    branches:
      - execution/languk-court-privacy-retest-g6-143-20261006

permissions:
  actions: read
  contents: read

concurrency:
  group: d03-languk-court-global-dedup-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: false

jobs:
  languk-global-dedup:
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.head_ref == 'execution/languk-court-global-dedup-g6-155-20261006'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        pass_id: [1, 2]
    env:
      EXECUTION_HEAD: ${{ github.event.pull_request.head.sha }}
      PARENT_SOURCE_HEAD: "c0c39803063b44b87b5256ca8934345b3af0dc9e"
      RUNNER_BLOB: "14e455cb5eb3b103bef669a8364429dd12018b33"
      SOURCE_RUNNER_BLOB: "c0527b5b9e51c84549eaf757e274a02c677ab5b2"
      V7_HEAD: "d3333ec1b4a508df232a5aefccd6686adda745fb"
      EVAL290_HEAD: "029514654829cebc149cff6fc1fea2a8ba4fa566"
      EVAL290_LOCK_BLOB: "6b9f6d3105333681f2db17e399805bac92ad2615"
      SOURCE_SHA256: "9b8870d10695715e4a0540c6f8fdca381599c0e6cdbaf3ecdf3c0782207b6597"
      SOURCE_BYTES: "20220778"
      SOURCE_URL: "https://huggingface.co/datasets/lang-uk/court-decisions-uk/resolve/289c0316fc076db3e1607db6776a29df42f4ffc5/2024-5K-supreme-court-decisions-deduplicated.parquet?download=true"
      SOURCE_REPORT_IDENTITY: "0860d85ef0c04699d91d0c06ac2cae4aad810050bfb98446014fa980239ec338"
      SELECTED_MANIFEST_IDENTITY: "ea7452115377a85124b935377016e88269793dafb99a8aeec154ae741cc47586"
      PRIVACY_IDENTITY: "f1c64058aaa9a2cc5be895f8d7a4eb644901b7d6bbcf2ae30868c94292af8109"
      QUALITY_IDENTITY: "c1c2bbe6dc9ef0447a7ad4e9490c9bab867d823d98609e7e6fb722fb78741efc"
      CANDIDATE_RECORDS: "256"
      CANDIDATE_BYTES: "2880510"
      PYTHONPATH: "src:tools"
      TWELVE_SIX_EXECUTION_PROFILE: LOCAL_FREE

    steps:
      - name: Checkout exact execution head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set exact CPython
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11.16"

      - name: Bind exact carrier closure
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXECUTION_HEAD"
          test "$(git merge-base "$PARENT_SOURCE_HEAD" HEAD)" = "$PARENT_SOURCE_HEAD"
          git diff --quiet HEAD --
          git diff --cached --quiet HEAD --
          mapfile -t changed < <(git diff --name-only "$PARENT_SOURCE_HEAD"..HEAD | sort)
          test "${#changed[@]}" -eq 2
          test "${changed[0]}" =             ".github/workflows/d03_languk_court_global_dedup_g6_155.yml"
          test "${changed[1]}" =             "tools/run_d03_languk_court_global_dedup_v1.py"
          test "$(git hash-object tools/run_d03_languk_court_global_dedup_v1.py)" =             "$RUNNER_BLOB"
          test "$(git hash-object tools/run_d03_languk_court_privacy_retest_v1.py)" =             "$SOURCE_RUNNER_BLOB"
          git cat-file -e "$V7_HEAD^{commit}"
          python -m py_compile             tools/run_d03_languk_court_global_dedup_v1.py             tools/run_d03_languk_court_privacy_retest_v1.py             tools/retest_d03_languk_supreme_court.py
          python -m pip install --disable-pip-version-check "ruff>=0.12"
          ruff check tools/run_d03_languk_court_global_dedup_v1.py

      - name: Prepare exact EVAL-290 PyArrow runtime
        shell: bash
        run: |
          set -euo pipefail
          src="$RUNNER_TEMP/eval290-src-${{ matrix.pass_id }}"
          venv="$RUNNER_TEMP/eval290-venv-${{ matrix.pass_id }}"
          manifest="$RUNNER_TEMP/eval290-environment-${{ matrix.pass_id }}.json"
          lock="$RUNNER_TEMP/eval290-extra-${{ matrix.pass_id }}.lock.txt"
          git fetch --no-tags origin refs/pull/402/head
          test "$(git rev-parse FETCH_HEAD)" = "$EVAL290_HEAD"
          git worktree add --detach "$src" "$EVAL290_HEAD"
          test "$(git -C "$src" rev-parse HEAD)" = "$EVAL290_HEAD"
          test "$(git -C "$src" hash-object requirements/locks/linux-x86_64/eval290-extra.lock.txt)" =             "$EVAL290_LOCK_BLOB"
          python "$src/tools/execution_bootstrap.py" bootstrap             --repo-root "$src"             --capabilities "runtime,tests"             --venv "$venv"             --manifest "$manifest"             --command "python -m pytest -q tests/test_eval290_ua_selection.py"
          cp "$src/requirements/locks/linux-x86_64/eval290-extra.lock.txt" "$lock"
          "$venv/bin/python" -m pip install             --disable-pip-version-check --require-hashes --no-deps -r "$lock"
          "$venv/bin/python" -c             'import numpy, pyarrow; assert numpy.__version__ == "2.4.6"; assert pyarrow.__version__ == "25.0.1"'

      - name: Download exact pinned source
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/pass-${{ matrix.pass_id }}"
          mkdir -p "$root"
          target="$root/court.parquet"
          curl --fail --location --retry 5 --retry-all-errors             --connect-timeout 30 --max-time 600             "$SOURCE_URL" -o "$target"
          test "$(stat -c %s "$target")" = "$SOURCE_BYTES"
          test "$(sha256sum "$target" | cut -d' ' -f1)" = "$SOURCE_SHA256"

      - name: Execute incumbent indexed global dedup
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/pass-${{ matrix.pass_id }}"
          venv="$RUNNER_TEMP/eval290-venv-${{ matrix.pass_id }}"
          git worktree add --detach "$root/v7" "$V7_HEAD"
          test "$(git -C "$root/v7" rev-parse HEAD)" = "$V7_HEAD"
          test -z "$(git -C "$root/v7" status --porcelain=v1 --untracked-files=all)"
          PYTHONPATH="$GITHUB_WORKSPACE/src:$GITHUB_WORKSPACE/tools"             "$venv/bin/python" tools/run_d03_languk_court_global_dedup_v1.py               --source-parquet "$root/court.parquet"               --v7-root "$root/v7"               --bulk-workspace "$root/bulk"               --expected-execution-head "$EXECUTION_HEAD"               --output-base-report "$root/base.json"               --output-combined-report "$root/combined.json"               --output-survivors "$root/survivors.json"               --output-evidence "$root/evidence.json"
          for output in base.json combined.json survivors.json evidence.json; do
            test -s "$root/$output"
          done

      - name: Verify text-free zero-credit authority
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/pass-${{ matrix.pass_id }}"
          "$RUNNER_TEMP/eval290-venv-${{ matrix.pass_id }}/bin/python" -             "$root/evidence.json" "$EXECUTION_HEAD" <<'PY'
          import json
          import os
          import sys
          from pathlib import Path

          evidence = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          assert evidence["execution_head_sha"] == sys.argv[2]
          assert evidence["parent_source_head_sha"] == os.environ["PARENT_SOURCE_HEAD"]
          source = evidence["languk_supreme_court"]
          assert source["source_sha256"] == os.environ["SOURCE_SHA256"]
          assert source["source_report_identity_sha256"] == os.environ[
              "SOURCE_REPORT_IDENTITY"
          ]
          assert source["selected_manifest_identity_sha256"] == os.environ[
              "SELECTED_MANIFEST_IDENTITY"
          ]
          assert source["privacy_execution_identity_sha256"] == os.environ[
              "PRIVACY_IDENTITY"
          ]
          assert source["quality_execution_identity_sha256"] == os.environ[
              "QUALITY_IDENTITY"
          ]
          assert source["candidate_source_object_count"] == int(
              os.environ["CANDIDATE_RECORDS"]
          )
          assert source["candidate_payload_utf8_bytes"] == int(
              os.environ["CANDIDATE_BYTES"]
          )
          marginal = source["marginal_global_unique_capacity_bytes"]
          assert type(marginal) is int and 0 <= marginal <= int(
              os.environ["CANDIDATE_BYTES"]
          )
          boundary = evidence["content_boundary"]
          assert boundary["source_parquet_uploaded"] is False
          assert boundary["source_text_emitted_in_evidence"] is False
          truth = evidence["truth_boundary"]
          assert truth["global_dedup_execution_complete"] is True
          for key in (
              "canonical_capacity_credited",
              "training_authorized_bytes",
              "authorized_unique_loss_positions",
              "authorized_optimized_target_exposure",
              "optimizer_updates",
          ):
              assert truth[key] == 0
          for key in (
              "reserved_evaluation_decontamination_complete",
              "post_dedup_quality_privacy_complete",
              "late_registry_refresh_complete",
              "family_caps_complete",
              "cluster_safe_split_complete",
              "packing_complete",
              "tokenizer_fit_authorized",
              "model_training_authorized",
              "training_executed",
              "learned_weights_created",
              "final_test_outcomes_read",
              "paid_compute_used",
              "scale_promotion_authorized",
          ):
              assert truth[key] is False
          print(json.dumps({
              "status": "PASS_ZERO_CREDIT_GLOBAL_DEDUP",
              "marginal_global_unique_capacity_bytes": marginal,
              "survivor_authority_sha256": evidence["survivor_authority_sha256"],
          }, sort_keys=True))
          PY

      - name: Remove exact source payload
        if: always()
        shell: bash
        run: |
          rm -f "$RUNNER_TEMP/pass-${{ matrix.pass_id }}/court.parquet"

      - name: Upload text-free pass authority
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: languk-court-global-dedup-pass-${{ matrix.pass_id }}-${{ github.event.pull_request.head.sha }}
          path: |
            ${{ runner.temp }}/pass-${{ matrix.pass_id }}/base.json
            ${{ runner.temp }}/pass-${{ matrix.pass_id }}/combined.json
            ${{ runner.temp }}/pass-${{ matrix.pass_id }}/survivors.json
            ${{ runner.temp }}/pass-${{ matrix.pass_id }}/evidence.json
          if-no-files-found: error
          retention-days: 90

  languk-two-clean-compare:
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.head_ref == 'execution/languk-court-global-dedup-g6-155-20261006'
    needs: languk-global-dedup
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}

    steps:
      - name: Download pass 1
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: languk-court-global-dedup-pass-1-${{ github.event.pull_request.head.sha }}
          path: artifacts/pass-1

      - name: Download pass 2
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: languk-court-global-dedup-pass-2-${{ github.event.pull_request.head.sha }}
          path: artifacts/pass-2

      - name: Require deterministic text-free two-clean result
        shell: bash
        run: |
          set -euo pipefail
          for file in base.json combined.json survivors.json evidence.json; do
            cmp "artifacts/pass-1/$file" "artifacts/pass-2/$file"
          done
          python - "$HEAD_SHA" <<'PY'
          import hashlib
          import json
          import sys
          from pathlib import Path

          head = sys.argv[1]
          root = Path("artifacts/pass-1")
          evidence = json.loads((root / "evidence.json").read_text(encoding="utf-8"))
          survivors = json.loads((root / "survivors.json").read_text(encoding="utf-8"))
          assert evidence["execution_head_sha"] == head
          source = evidence["languk_supreme_court"]
          marginal = source["marginal_global_unique_capacity_bytes"]
          assert 0 <= marginal <= 2880510
          assert evidence["survivor_authority_sha256"] == survivors[
              "survivor_authority_sha256"
          ]
          proof = {
              "schema_version": (
                  "12-6.d03-languk-court-global-dedup-two-clean-proof.v1"
              ),
              "execution_head_sha": head,
              "parent_source_head_sha": evidence["parent_source_head_sha"],
              "source_sha256": source["source_sha256"],
              "source_report_identity_sha256": source[
                  "source_report_identity_sha256"
              ],
              "selected_manifest_identity_sha256": source[
                  "selected_manifest_identity_sha256"
              ],
              "candidate_records": source["candidate_source_object_count"],
              "candidate_payload_utf8_bytes": source[
                  "candidate_payload_utf8_bytes"
              ],
              "base_report_sha256": evidence["base"]["report_sha256"],
              "combined_report_sha256": evidence["combined"]["report_sha256"],
              "survivor_authority_sha256": evidence[
                  "survivor_authority_sha256"
              ],
              "marginal_global_unique_capacity_bytes": marginal,
              "two_fresh_executions_converged": True,
              "source_payload_retained": False,
              "canonical_capacity_credited": 0,
              "authorized_optimized_target_exposure": 0,
              "tokenizer_fit_authorized": False,
              "training_executed": False,
              "final_test_outcomes_read": False,
              "paid_compute_used": False,
          }
          raw = json.dumps(
              proof,
              ensure_ascii=False,
              sort_keys=True,
              separators=(",", ":"),
          ).encode("utf-8")
          proof["proof_identity_sha256"] = hashlib.sha256(raw).hexdigest()
          Path("languk-court-global-dedup-two-clean-proof.json").write_text(
              json.dumps(proof, sort_keys=True, separators=(",", ":")) + "\n",
              encoding="utf-8",
          )
          print(json.dumps(proof, sort_keys=True))
          PY

      - name: Upload two-clean proof
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: languk-court-global-dedup-two-clean-${{ github.event.pull_request.head.sha }}
          path: languk-court-global-dedup-two-clean-proof.json
          if-no-files-found: error
          retention-days: 90
