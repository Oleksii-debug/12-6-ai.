name: TRAIN-56 checkpoint cadence

on:
  push:
    branches:
      - train56/checkpoint-cadence-20260825
  pull_request:
    branches:
      - train56/checkpoint-cadence-20260825
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checkpoint-cadence:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python 3.11.16
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11.16'

      - name: Install locked x86-64 environment
        run: |
          python -m pip install --disable-pip-version-check --require-hashes --no-deps -r requirements/locks/linux-x86_64/toolchain.lock.txt
          python -m pip install --disable-pip-version-check --require-hashes --no-deps -r requirements/locks/linux-x86_64/runtime.lock.txt
          python -m pip install --disable-pip-version-check --require-hashes --no-deps -r requirements/locks/linux-x86_64/dev.lock.txt
          PIP_NO_INDEX=1 python -m pip install --no-deps --no-build-isolation -e .

      - name: Run checkpoint incumbent and cadence tests
        run: python -m pytest -q tests/test_checkpoint_cadence.py tests/test_trainer_checkpoint_adapter.py tests/test_checkpointing.py

      - name: Run measured checkpoint cadence experiment
        run: python tools/run_checkpoint_cadence_experiment.py

      - name: Upload machine report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: train56-checkpoint-cadence-report
          path: reports/train56/checkpoint_cadence_runtime.json
          if-no-files-found: error
          retention-days: 30
