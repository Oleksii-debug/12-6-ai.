name: RESEARCH06-07 Fixed Budget Scaling

on:
  pull_request:

permissions:
  contents: read

jobs:
  fixed-budget-scaling-cpu:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Prove exact source checkout
        env:
          SOURCE_SHA: ${{ github.event.pull_request.head.sha }}
        run: test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11.16"
      - name: Verify exact locked environment inputs
        env:
          SOURCE_SHA: ${{ github.event.pull_request.head.sha }}
        run: >-
          python tools/verify_locked_environment.py
          --profile linux-x86_64
          --source-sha "$SOURCE_SHA"
          --evidence-out research-fixed-budget-locked-environment.json
      - name: Create locked LOCAL_FREE execution environment
        run: |
          python -m venv .research-fixed-budget-locked
          .research-fixed-budget-locked/bin/python -m pip install --disable-pip-version-check --require-hashes --no-deps -r requirements/locks/linux-x86_64/toolchain.lock.txt
          .research-fixed-budget-locked/bin/python -m pip install --disable-pip-version-check --require-hashes --no-deps -r requirements/locks/linux-x86_64/runtime.lock.txt
          .research-fixed-budget-locked/bin/python -m pip install --disable-pip-version-check --require-hashes --no-deps -r requirements/locks/linux-x86_64/dev.lock.txt
          PIP_NO_INDEX=1 PIP_DISABLE_PIP_VERSION_CHECK=1 .research-fixed-budget-locked/bin/python -m pip install --no-deps --no-build-isolation -e .
      - name: Check strict budget controller
        run: |
          .research-fixed-budget-locked/bin/ruff check src/twelve_six/scaling_budget.py tests/test_scaling_budget.py
          .research-fixed-budget-locked/bin/pytest -q tests/test_scaling_experiment.py tests/test_scaling_budget.py
      - name: Execute fixed-token and fixed-compute matrices
        env:
          SOURCE_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          .research-fixed-budget-locked/bin/python -m twelve_six.scaling_budget run \
            --repo-root . \
            --source-sha "$SOURCE_SHA" \
            --output research-fixed-budget-results.json \
            --evidence-root research-fixed-budget-evidence \
            --fixed-token-budget 65772 \
            --fixed-compute-budget 105000000000 \
            --torch-threads 2
          .research-fixed-budget-locked/bin/python -m twelve_six.scaling_budget validate \
            research-fixed-budget-results.json \
            --expected-source-sha "$SOURCE_SHA"
      - name: Print retained decision matrix
        run: |
          .research-fixed-budget-locked/bin/python - <<'PY'
          import json
          report = json.load(open("research-fixed-budget-results.json", encoding="utf-8"))
          print(json.dumps({
              "fixed_tokens": {
                  "matrix": report["fixed_tokens"]["matrix"],
                  "rankings": report["fixed_tokens"]["rankings"],
              },
              "fixed_compute": {
                  "matrix": report["fixed_compute"]["matrix"],
                  "rankings": report["fixed_compute"]["rankings"],
              },
              "report_sha256": report["report_sha256"],
          }, indent=2, sort_keys=True))
          PY
      - name: Upload fixed-budget evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: research06-07-fixed-budget-evidence
          path: |
            research-fixed-budget-locked-environment.json
            research-fixed-budget-results.json
            research-fixed-budget-evidence/
          if-no-files-found: error
          retention-days: 30
