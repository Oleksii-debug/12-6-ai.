name: POSTBASE-357 Verifier Ensemble Convergence

on:
  push:
    branches: [postbase357/verifier-ensemble-convergence-20260826]
  workflow_dispatch:

concurrency:
  group: postbase357-verifier-convergence-${{ github.ref }}
  cancel-in-progress: true

permissions: {contents: read}

env:
  PYTHONPATH: src
  POSTBASE357_EXECUTION_PROFILE: LOCAL_FREE

jobs:
  independent-local-free-convergence:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: "${{ github.sha }}"
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with: {python-version: "3.11.16"}

      - name: Bind exact POSTBASE-257 candidate and immutable production source
        run: |
          set -euo pipefail
          candidate=8744c8ab4c21299ed5fd12e937ab2dadb92d574e
          source_blob=e3c0504c1a6b3768c8aaea1aaaa3b3eb637eaab7
          git merge-base --is-ancestor "$candidate" "$GITHUB_SHA"
          test "$(git rev-parse "$candidate:src/twelve_six/postbase/verification.py")" = "$source_blob"
          test "$(git rev-parse "$GITHUB_SHA:src/twelve_six/postbase/verification.py")" = "$source_blob"
          changed="$(git diff --name-only "$candidate" "$GITHUB_SHA")"
          printf '%s\n' "$changed"
          invalid="$(printf '%s\n' "$changed" | grep -Ev '^$|^tools/verify_postbase357_convergence\.py$|^tests/test_postbase357_verifier_convergence\.py$|^docs/POSTBASE357_VERIFIER_ENSEMBLE_CONVERGENCE\.md$|^\.github/workflows/postbase357-verifier-ensemble-convergence\.yml$' || true)"
          if [[ -n "$invalid" ]]; then
            echo "POSTBASE-357 changed candidate production or unrelated files:" >&2
            printf '%s\n' "$invalid" >&2
            exit 1
          fi

      - name: Universal bootstrap and independent convergence tests
        uses: ./.github/actions/execution-bootstrap
        with:
          capabilities: runtime,tests,lint
          venv: .postbase357
          command: python -m pytest -q tests/test_postbase357_verifier_convergence.py
          manifest: reports/postbase357/environment.json

      - name: Ruff independent verification surface
        run: >-
          .postbase357/bin/ruff check
          tools/verify_postbase357_convergence.py
          tests/test_postbase357_verifier_convergence.py

      - name: Build deterministic convergence evidence twice
        run: |
          set -euo pipefail
          .postbase357/bin/python tools/verify_postbase357_convergence.py --output reports/postbase357/convergence-a.json
          .postbase357/bin/python tools/verify_postbase357_convergence.py --output reports/postbase357/convergence-b.json
          cmp reports/postbase357/convergence-a.json reports/postbase357/convergence-b.json
          cp reports/postbase357/convergence-a.json reports/postbase357/convergence.json
          cat reports/postbase357/convergence.json

      - name: Prove verifier path has no external LLM or network client dependency
        run: |
          set -euo pipefail
          .postbase357/bin/python - <<'PY'
          import ast
          from pathlib import Path

          forbidden = {'openai', 'anthropic', 'requests', 'httpx', 'aiohttp'}
          paths = (
              Path('src/twelve_six/postbase/verification.py'),
              Path('tools/verify_postbase357_convergence.py'),
              Path('tests/test_postbase357_verifier_convergence.py'),
          )
          imports = set()
          for path in paths:
              tree = ast.parse(path.read_text(encoding='utf-8'))
              for node in ast.walk(tree):
                  if isinstance(node, ast.Import):
                      imports.update(alias.name.split('.')[0] for alias in node.names)
                  elif isinstance(node, ast.ImportFrom) and node.module:
                      imports.add(node.module.split('.')[0])
          overlap = imports & forbidden
          assert not overlap, f'external LLM/network dependency present: {sorted(overlap)}'
          print({'execution_profile': 'LOCAL_FREE', 'external_llm_called': False, 'forbidden_imports': sorted(overlap)})
          PY

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: postbase357-verifier-ensemble-convergence-${{ github.sha }}
          path: |
            reports/postbase357/environment.json
            reports/postbase357/convergence.json
          if-no-files-found: warn
