name: NEXT100-029 Lang-UK rights audit

on:
  pull_request:
    paths:
      - "configs/data/next100_029_languk_rights_audit_v1.json"
      - "configs/data/next100_029_languk_concurrency_refresh_v1.json"
      - "configs/data/d03_languk_supreme_court_retest_v1.json"
      - "docs/NEXT100_029_DATA_UA_LANGUK_RIGHTS_AUDIT.md"
      - "tools/validate_next100_029_languk_rights_audit.py"
      - "tools/retest_d03_languk_supreme_court.py"
      - "tests/test_next100_029_languk_rights_audit.py"
      - "tests/test_d03_languk_supreme_court_retest.py"
      - ".github/workflows/next100-029-languk-rights-audit.yml"
  workflow_dispatch:

concurrency:
  group: next100-029-languk-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Prove exact source checkout
        env:
          EXPECTED_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SOURCE_SHA"

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11.16"

      - name: Validate machine evidence
        run: python tools/validate_next100_029_languk_rights_audit.py

      - name: Materialize exact test environment and run focused tests
        uses: ./.github/actions/execution-bootstrap
        with:
          capabilities: tests
          venv: .next100-029
          command: python -m pytest -q tests/test_next100_029_languk_rights_audit.py tests/test_d03_languk_supreme_court_retest.py
          manifest: next100-029-execution-environment.json

      - name: Install pinned parquet runtime
        run: python -m pip install --only-binary=:all: pyarrow==17.0.0

      - name: Download exact Supreme Court parquet and materialize twice
        run: |
          mkdir -p artifacts/languk/run-a artifacts/languk/run-b
          python tools/retest_d03_languk_supreme_court.py \
            --download \
            --parquet artifacts/languk/source.parquet \
            --output-jsonl artifacts/languk/run-a/retained.jsonl \
            --report artifacts/languk/run-a/report.json
          python tools/retest_d03_languk_supreme_court.py \
            --parquet artifacts/languk/source.parquet \
            --output-jsonl artifacts/languk/run-b/retained.jsonl \
            --report artifacts/languk/run-b/report.json
          cmp artifacts/languk/run-a/retained.jsonl artifacts/languk/run-b/retained.jsonl
          cmp artifacts/languk/run-a/report.json artifacts/languk/run-b/report.json
          python - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path("artifacts/languk/run-a/report.json").read_text())
          assert 0 < report["retained_records"] <= 256
          assert report["retained_normalized_bytes"] > 0
          assert report["exact_schema_validated"] is True
          assert report["occurrence_spans_validated"] is True
          assert report["complete_placeholder_annotation_validated"] is True
          assert report["universal_pii_absence_claimed"] is False
          assert report["training_authorized_bytes"] == 0
          assert report["canonical_capacity_credited"] == 0
          assert report["family_credit_added"] == 0
          assert report["tokenizer_fit_authorized"] is False
          assert report["model_training_executed"] is False
          assert report["optimizer_updates"] == 0
          assert report["final_test_accessed"] is False
          assert report["paid_compute_used"] is False
          assert report["rejected_text_emitted"] is False
          assert report["rejected_hashes_emitted"] is False
          print(json.dumps(report, ensure_ascii=False, sort_keys=True))
          PY

      - name: Retain text-free exact retest report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: next100-029-languk-court-retest-report
          path: artifacts/languk/run-a/report.json
          if-no-files-found: error
          retention-days: 30
