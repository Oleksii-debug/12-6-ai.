name: NEXT100-029 Lang-UK rights audit

on:
  pull_request:
    paths:
      - "configs/data/next100_029_languk_rights_audit_v1.json"
      - "configs/data/next100_029_languk_concurrency_refresh_v1.json"
      - "docs/NEXT100_029_DATA_UA_LANGUK_RIGHTS_AUDIT.md"
      - "tools/validate_next100_029_languk_rights_audit.py"
      - "tests/test_next100_029_languk_rights_audit.py"
      - ".github/workflows/next100-029-languk-rights-audit.yml"
  workflow_dispatch:

concurrency:
  group: next100-029-languk-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Prove exact source checkout
        env:
          EXPECTED_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SOURCE_SHA"

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11.16"

      - name: Validate machine evidence
        run: python tools/validate_next100_029_languk_rights_audit.py

      - name: Materialize exact test environment and run focused tests
        uses: ./.github/actions/execution-bootstrap
        with:
          capabilities: tests
          venv: .next100-029
          command: python -m pytest -q tests/test_next100_029_languk_rights_audit.py
          manifest: next100-029-execution-environment.json
