name: TEMP D03 eCFR real execution 1103

on:
  push:
    branches:
      - d03/ecfr-real-exec-1103

permissions:
  contents: read

jobs:
  execute:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Focused fail-closed tests
        run: |
          python -m pip install --disable-pip-version-check pytest
          python -m pytest -q \
            tests/test_materialize_d03_ecfr_point_in_time.py \
            tests/test_d03_ecfr_incumbent_hardening.py \
            tests/test_d03_ecfr_acquisition_probe.py
      - name: Diagnose exact eCFR 406 header contract without retention
        run: |
          python - <<'PY'
          import hashlib
          import urllib.error
          import urllib.request

          url = 'https://www.ecfr.gov/api/versioner/v1/full/2026-09-03/title-1.xml'
          max_bytes = 8 * 1024 * 1024
          variants = {
              'canonical': {
                  'Accept': 'application/xml,text/xml;q=0.9,application/octet-stream;q=0.5',
                  'User-Agent': '12-6-ai-d03-ecfr-materializer/1.0',
              },
              'wildcard_accept_same_ua': {
                  'Accept': '*/*',
                  'User-Agent': '12-6-ai-d03-ecfr-materializer/1.0',
              },
              'canonical_accept_neutral_ua': {
                  'Accept': 'application/xml,text/xml;q=0.9,application/octet-stream;q=0.5',
                  'User-Agent': '12-6-ecfr-research/1.0',
              },
              'wildcard_accept_neutral_ua': {
                  'Accept': '*/*',
                  'User-Agent': '12-6-ecfr-research/1.0',
              },
          }
          for name, headers in variants.items():
              req = urllib.request.Request(url, headers=headers, method='GET')
              try:
                  with urllib.request.urlopen(req, timeout=60) as response:
                      body = response.read(max_bytes + 1)
                      if len(body) > max_bytes:
                          raise RuntimeError(f'{name}: response exceeds byte bound')
                      print(
                          f'{name}: status={response.getcode()} '
                          f'final_url={response.geturl()} '
                          f'content_type={response.headers.get_content_type().lower()} '
                          f'bytes={len(body)} sha256={hashlib.sha256(body).hexdigest()}'
                      )
              except urllib.error.HTTPError as exc:
                  print(f'{name}: HTTP={exc.code}')
              except urllib.error.URLError as exc:
                  print(f'{name}: URLERROR={exc.reason}')
          PY
      - name: Canonical materialization after diagnostics
        run: |
          set -euo pipefail
          mkdir -p /tmp/ecfr execution-evidence
          if ! python tools/materialize_d03_ecfr_point_in_time.py \
            --output-dir /tmp/ecfr \
            > /tmp/ecfr/stdout.json 2>&1; then
            cat /tmp/ecfr/stdout.json
            exit 1
          fi
          cat /tmp/ecfr/stdout.json
          rm -rf /tmp/ecfr
