name: LEARN03 Real 500K Fixed-Control Evidence

on:
  pull_request:

permissions:
  contents: read

jobs:
  real-500k-cpu:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Prove exact source checkout
        env:
          SOURCE_SHA: ${{ github.event.pull_request.head.sha }}
        run: test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11.16"
      - name: Verify exact locked environment inputs
        env:
          SOURCE_SHA: ${{ github.event.pull_request.head.sha }}
        run: >-
          python tools/verify_locked_environment.py
          --profile linux-x86_64
          --source-sha "$SOURCE_SHA"
          --evidence-out learn03-locked-environment.json
      - name: Create locked LOCAL_FREE execution environment
        run: |
          python -m venv .learn03-locked
          .learn03-locked/bin/python -m pip install --disable-pip-version-check --require-hashes --no-deps -r requirements/locks/linux-x86_64/toolchain.lock.txt
          .learn03-locked/bin/python -m pip install --disable-pip-version-check --require-hashes --no-deps -r requirements/locks/linux-x86_64/runtime.lock.txt
          PIP_NO_INDEX=1 PIP_DISABLE_PIP_VERSION_CHECK=1 .learn03-locked/bin/python -m pip install --no-deps --no-build-isolation -e .
      - name: Focused contract tests
        run: .learn03-locked/bin/python -m pytest -q tests/test_scaling_500k_evidence.py
      - name: Reproduce current-head 95K/268K/468K/1M baseline
        env:
          SOURCE_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          .learn03-locked/bin/python -m twelve_six.scaling_experiment run \
            --repo-root . \
            --source-sha "$SOURCE_SHA" \
            --output research41-current-head-baseline.json \
            --torch-threads 2
          .learn03-locked/bin/python -m twelve_six.scaling_experiment validate \
            research41-current-head-baseline.json \
            --expected-source-sha "$SOURCE_SHA"
      - name: Train two 467,808-parameter seeds with deep evidence
        env:
          SOURCE_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          .learn03-locked/bin/python -m twelve_six.scaling_500k_evidence run \
            --repo-root . \
            --source-sha "$SOURCE_SHA" \
            --baseline research41-current-head-baseline.json \
            --output learn03-real-500k-results.json \
            --checkpoint-root learn03-checkpoints \
            --seeds 1337 1338 \
            --token-budgets 4096 16384 65536 131072 262144 \
            --torch-threads 2
          .learn03-locked/bin/python -m twelve_six.scaling_500k_evidence validate \
            learn03-real-500k-results.json \
            --expected-source-sha "$SOURCE_SHA"
      - name: Print compact scientific summary
        run: |
          .learn03-locked/bin/python - <<'PY'
          import json
          report = json.load(open("learn03-real-500k-results.json", encoding="utf-8"))
          print(json.dumps({
              "source": report["source"],
              "parameters": report["parameters"],
              "parameter_efficiency": report["parameter_efficiency"],
              "seeds": [
                  {
                      "seed": run["seed"],
                      "final_held_out": run["held_out_curve"][-1],
                      "final_movement": run["final_parameter_movement"],
                      "optimizer_only_tokens_per_second": run["optimizer_only_tokens_per_second"],
                      "end_to_end_tokens_per_second": run["end_to_end_tokens_per_second"],
                      "peak_rss_bytes": run["peak_rss_bytes"],
                  }
                  for run in report["seed_runs"]
              ],
              "report_sha256": report["report_sha256"],
          }, indent=2, sort_keys=True))
          PY
      - name: Upload retained training evidence and checkpoints
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: learn03-real-500k-evidence
          path: |
            learn03-locked-environment.json
            research41-current-head-baseline.json
            learn03-real-500k-results.json
            learn03-checkpoints/
          if-no-files-found: error
          retention-days: 30
