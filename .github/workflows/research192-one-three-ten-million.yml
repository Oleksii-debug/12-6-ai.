name: RESEARCH-192 One Three Ten Million

on:
  pull_request:
    branches: [env151/universal-execution-bootstrap-20260826]
  workflow_dispatch:
    inputs:
      run_scale_matrix:
        description: "Explicitly authorize the full 1M/3M/10M training matrix"
        required: true
        default: false
        type: boolean

concurrency:
  group: research192-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

jobs:
  contract:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.11.16"
      - uses: ./.github/actions/execution-bootstrap
        with:
          capabilities: runtime,tests
          venv: .research192-contract
          command: python -m pytest -q tests/test_research192_scaling_transfer.py
          manifest: research192-contract/environment.json
      - name: Validate frozen scientific contract
        env:
          PYTHONPATH: src
        run: |
          set -euo pipefail
          .research192-contract/bin/python -m py_compile src/twelve_six/research192_scaling_transfer.py
          .research192-contract/bin/python -m pytest -q tests/test_research192_scaling_transfer.py
          .research192-contract/bin/python -m twelve_six.research192_scaling_transfer validate-static
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: research192-contract
          path: research192-contract/environment.json
          if-no-files-found: error
          retention-days: 30

  train:
    needs: contract
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_scale_matrix }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - {scale: 1m, seed: 1337, arm: 1m-seed1337}
          - {scale: 1m, seed: 1338, arm: 1m-seed1338}
          - {scale: 3m, seed: 1337, arm: 3m-seed1337}
          - {scale: 3m, seed: 1338, arm: 3m-seed1338}
          - {scale: 10m, seed: 1337, arm: 10m-seed1337}
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.11.16"
      - name: Create evidence directory
        run: mkdir -p research192-evidence/${{ matrix.arm }}
      - uses: ./.github/actions/execution-bootstrap
        with:
          capabilities: runtime,tests
          venv: .research192
          command: python -m pytest -q tests/test_research192_scaling_transfer.py
          manifest: research192-evidence/${{ matrix.arm }}/environment.json
      - name: Run exact arm with midpoint fresh-process resume
        env:
          PYTHONPATH: src
          SCALE: ${{ matrix.scale }}
          SEED: ${{ matrix.seed }}
          ARM: ${{ matrix.arm }}
          SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          OUT="research192-evidence/${ARM}"
          PY=.research192/bin/python
          "$PY" -m twelve_six.research192_scaling_transfer prepare \
            --repo . --source-sha "$SOURCE_SHA" --out "$OUT" --scale "$SCALE" --seed "$SEED"
          "$PY" -m twelve_six.research192_scaling_transfer phase1 \
            --repo . --source-sha "$SOURCE_SHA" --out "$OUT" --scale "$SCALE" --seed "$SEED"
          "$PY" -m twelve_six.research192_scaling_transfer resume \
            --repo . --source-sha "$SOURCE_SHA" --out "$OUT" --scale "$SCALE" --seed "$SEED"
          "$PY" -m twelve_six.research192_scaling_transfer verify \
            --repo . --source-sha "$SOURCE_SHA" --out "$OUT" --scale "$SCALE" --seed "$SEED"
          "$PY" -m twelve_six.research192_scaling_transfer summarize \
            --out "$OUT" --scale "$SCALE" --seed "$SEED"
      - name: Preserve comparison evidence only
        env:
          SCALE: ${{ matrix.scale }}
          ARM: ${{ matrix.arm }}
        run: |
          set -euo pipefail
          ROOT="research192-evidence/${ARM}"
          mkdir -p "research192-upload/${ARM}/${SCALE}"
          cp "$ROOT/environment.json" "research192-upload/${ARM}/environment.json"
          cp "$ROOT/ladder-truth.json" "research192-upload/${ARM]/ladder-truth.json"
          cp "$ROOT/research192-arm.json" "research192-upload/${ARM}/research192-arm.json"
          cp "$ROOT/${SCALE}/report.json" "research192-upload/${ARM}/${SCALE}/report.json"
          cp "$ROOT/${SCALE}/run-manifest.json" "research192-upload/${ARM}/${SCALE}/run-manifest.json"
          cp "$ROOT/${SCALE}/phase1.json" "research192-upload/${ARM}/${SCALE}/phase1.json"
          cp "$ROOT/${SCALE}/train-curve.jsonl" "research192-upload/${ARM}/${SCALE}/train-curve.jsonl"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: research192-${{ matrix.arm }}
          path: research192-upload/${{ matrix.arm }}
          if-no-files-found: error
          retention-days: 30

  compare:
    needs: train
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.11.16"
      - uses: ./.github/actions/execution-bootstrap
        with:
          capabilities: runtime
          venv: .research192-compare
          manifest: research192-final/environment.json
      - uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16
        with:
          pattern: research192-*-seed*
          path: research192-collected
      - name: Download and bind accepted M150 incumbent artifact
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p m150-incumbent
          curl --fail --location --silent --show-error \
            -H "Authorization: Bearer ${GITHUB_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/Oleksii-debug/12-6-ai./actions/artifacts/9595677772/zip" \
            -o m150.zip
          echo "c00b7e9006320f8916c739a3311e8cc47ad0d0b16957f8ebd7d19233fd9f1c71  m150.zip" | sha256sum -c -
          unzip -q m150.zip -d m150-incumbent
      - name: Build first clean empirical scaling comparison
        env:
          PYTHONPATH: src
        run: |
          set -euo pipefail
          .research192-compare/bin/python -m twelve_six.research192_scaling_transfer compare \
            --arms-root research192-collected \
            --m150-root m150-incumbent \
            --out research192-final
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: research192-one-three-ten-million
          path: research192-final
          if-no-files-found: error
          retention-days: 30
