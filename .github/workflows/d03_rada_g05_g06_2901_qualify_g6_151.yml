name: D03 Rada G05 G06 2901 qualify G6 151

on:
  pull_request:
    branches:
      - execution/rada-current-postdata232-g05-g06-2901-g6-151-20261006
    paths:
      - ".github/workflows/d03_rada_g05_g06_2901_qualify_g6_151.yml"
      - "tools/run_d03_rada_current_postdata232_g05_g06_v1.py"
      - "tests/test_rada_current_postdata232_g05_g06_v1.py"

permissions:
  contents: read

concurrency:
  group: d03-rada-g05-g06-2901-qualify-g6-151-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  qualify:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.head_ref == 'qualification/rada-g05-g06-2901-g6-151-20261006'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      EXECUTION_HEAD: ${{ github.event.pull_request.head.sha }}
      PARENT_HEAD: "669b6922d3606a721a8b0a55d32d58373310f32a"
      RUNNER_BLOB: "38d4567007047cbde783322a6bfa3269c9679f6a"
      TEST_BLOB: "ff344c0bd88971c812e9c59f5928ca3e8b5a4dab"
    steps:
      - name: Checkout exact qualification head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Set Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.11.16"
          cache: pip
      - name: Bind exact parent and scope
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXECUTION_HEAD"
          test "$(git merge-base "$PARENT_HEAD" HEAD)" = "$PARENT_HEAD"
          git diff --quiet HEAD --
          git diff --cached --quiet HEAD --
          git diff --name-only "$PARENT_HEAD"..HEAD | sort > "$RUNNER_TEMP/changed.txt"
          cat > "$RUNNER_TEMP/expected.txt" <<'EOF'
          .github/workflows/d03_rada_g05_g06_2901_qualify_g6_151.yml
          EOF
          sort -o "$RUNNER_TEMP/expected.txt" "$RUNNER_TEMP/expected.txt"
          cmp "$RUNNER_TEMP/expected.txt" "$RUNNER_TEMP/changed.txt"
          test "$(git hash-object tools/run_d03_rada_current_postdata232_g05_g06_v1.py)" = "$RUNNER_BLOB"
          test "$(git hash-object tests/test_rada_current_postdata232_g05_g06_v1.py)" = "$TEST_BLOB"
      - name: Install canonical dev environment
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check -e '.[dev]'
      - name: Compile focused files
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile \
            tools/run_d03_rada_current_postdata232_g05_g06_v1.py \
            tests/test_rada_current_postdata232_g05_g06_v1.py
      - name: Lint focused files
        shell: bash
        run: |
          set -euo pipefail
          ruff check \
            tools/run_d03_rada_current_postdata232_g05_g06_v1.py \
            tests/test_rada_current_postdata232_g05_g06_v1.py
      - name: Run focused G05 G06 tests
        shell: bash
        env:
          PYTHONPATH: src
          TWELVE_SIX_EXECUTION_PROFILE: LOCAL_FREE
        run: |
          set -euo pipefail
          python -m pytest -q tests/test_rada_current_postdata232_g05_g06_v1.py
