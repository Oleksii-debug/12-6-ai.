name: DATA-10 Multilingual Pretraining Evidence

on:
  pull_request:
    paths:
      - ".github/workflows/data10-multilingual-pretraining.yml"
      - "tools/benchmark_multilingual_pretraining.py"
      - "configs/data/multilingual_uk_en_code_v1.experimental.json"
      - "src/twelve_six/tokenization/**"
      - "src/twelve_six/data/**"
      - "src/twelve_six/model/**"
      - "src/twelve_six/training/**"
      - "data/s0/packaged/**"
      - "requirements/experiments/tokenizers-linux-x86_64.lock.txt"
      - "requirements/locks/linux-x86_64/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  multilingual-local-free-probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11.16"
      - name: Bind exact source head
        env:
          EXPECTED_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SOURCE_SHA"
      - name: Install locked runtime and tokenizer experiment backend
        run: |
          python -m venv .data10
          .data10/bin/python -m pip install \
            --disable-pip-version-check --no-deps --require-hashes \
            -r requirements/locks/linux-x86_64/toolchain.lock.txt
          .data10/bin/python -m pip install \
            --disable-pip-version-check --no-deps --require-hashes \
            -r requirements/locks/linux-x86_64/runtime.lock.txt
          .data10/bin/python -m pip install \
            --disable-pip-version-check --no-deps --require-hashes --only-binary=:all: \
            -r requirements/experiments/tokenizers-linux-x86_64.lock.txt
      - name: Run multilingual tokenizer mixture packing and S2 evidence
        env:
          EXPECTED_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          PYTHONPATH: src
        run: |
          .data10/bin/python tools/benchmark_multilingual_pretraining.py \
            --source-sha "$EXPECTED_SOURCE_SHA" \
            --output data10-multilingual-evidence.json
      - name: Upload DATA-10 evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: data10-multilingual-pretraining
          path: |
            data10-multilingual-evidence.json
            configs/data/multilingual_uk_en_code_v1.experimental.json
            requirements/experiments/tokenizers-linux-x86_64.lock.txt
          if-no-files-found: error
          retention-days: 30
