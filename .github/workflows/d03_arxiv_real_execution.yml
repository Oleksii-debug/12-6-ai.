name: D03 ArXiv real LOCAL_FREE execution

on:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/d03_arxiv_real_execution.yml"
      - "tools/materialize_d03_common_pile_arxiv_abstracts_v1.py"
      - "configs/data/d03_common_pile_arxiv_abstracts_bounded_v1.json"
      - "configs/data/common_pile_source_rights_v1.json"
      - "src/twelve_six/common_pile_rights.py"

permissions:
  contents: read

concurrency:
  group: d03-arxiv-real-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  execute-a:
    name: independent execution A
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      source_sha256: ${{ steps.evidence.outputs.source_sha256 }}
      source_bytes: ${{ steps.evidence.outputs.source_bytes }}
      candidate_sha256: ${{ steps.evidence.outputs.candidate_sha256 }}
      report_file_sha256: ${{ steps.evidence.outputs.report_file_sha256 }}
      report_identity_sha256: ${{ steps.evidence.outputs.report_identity_sha256 }}
      disposition_sha256: ${{ steps.evidence.outputs.disposition_sha256 }}
      rows_scanned: ${{ steps.evidence.outputs.rows_scanned }}
      retained_records: ${{ steps.evidence.outputs.retained_records }}
      retained_bytes: ${{ steps.evidence.outputs.retained_bytes }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Bind exact Product head
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
      - name: Run exact immutable-source materialization
        run: |
          mkdir -p /tmp/arxiv-a
          python tools/materialize_d03_common_pile_arxiv_abstracts_v1.py \
            --shard /tmp/arxiv-a/00003_arxiv-abstracts.jsonl.gz \
            --output-jsonl /tmp/arxiv-a/candidate.jsonl \
            --report /tmp/arxiv-a/report.json \
            --download > /tmp/arxiv-a/stdout.json
      - name: Emit text-free hash-safe evidence
        id: evidence
        run: |
          python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          root = Path('/tmp/arxiv-a')
          shard = root / '00003_arxiv-abstracts.jsonl.gz'
          candidate = root / 'candidate.jsonl'
          report_path = root / 'report.json'
          report = json.loads(report_path.read_text(encoding='utf-8'))

          def sha_file(path: Path) -> str:
              h = hashlib.sha256()
              with path.open('rb') as f:
                  for chunk in iter(lambda: f.read(1024 * 1024), b''):
                      h.update(chunk)
              return h.hexdigest()

          source_sha = sha_file(shard)
          source_bytes = shard.stat().st_size
          candidate_sha = sha_file(candidate)
          report_file_sha = sha_file(report_path)
          disposition_sha = hashlib.sha256(
              json.dumps(report['disposition_counts'], sort_keys=True, separators=(',', ':')).encode('utf-8')
          ).hexdigest()

          assert source_sha == '3d781bf7617fd9a6840211227c6c8831280dba457a6d9c79a2a5a357e025a8b7'
          assert source_bytes == 232616926
          assert report['source_revision'] == '46de78c48636c0b46f60049dfd1c5a3710d233f9'
          assert report['source_file'] == '00003_arxiv-abstracts.jsonl.gz'
          assert report['source_sha256'] == source_sha
          assert report['source_bytes'] == source_bytes
          assert report['source_key'] == 'arxiv_abstracts'
          assert report['hf_dataset'] == 'common-pile/arxiv_abstracts'
          assert report['candidate_jsonl_sha256'] == candidate_sha
          assert report['rows_scanned'] == 4096
          assert report['retained_records'] > 0
          assert report['retained_records'] <= 1024
          assert report['retained_normalized_bytes'] > 0
          assert report['source_level_rights_basis_checked'] is True
          assert report['per_record_cc0_metadata_required'] is True
          assert report['universal_pii_absence_claimed'] is False
          assert report['rejected_text_emitted'] is False
          assert report['rejected_hashes_emitted'] is False
          assert report['training_authorized_bytes'] == 0
          assert report['canonical_capacity_credited'] == 0
          assert report['family_credit_added'] == 0
          assert report['unique_causal_loss_positions_authorized'] == 0
          assert report['tokenizer_fit_authorized'] is False
          assert report['optimizer_updates'] == 0
          assert report['model_training_executed'] is False
          assert report['final_test_accessed'] is False
          assert report['paid_compute_used'] is False
          assert report['research_corpus_v1_released'] is False

          fields = {
              'source_sha256': source_sha,
              'source_bytes': str(source_bytes),
              'candidate_sha256': candidate_sha,
              'report_file_sha256': report_file_sha,
              'report_identity_sha256': report['report_identity_sha256'],
              'disposition_sha256': disposition_sha,
              'rows_scanned': str(report['rows_scanned']),
              'retained_records': str(report['retained_records']),
              'retained_bytes': str(report['retained_normalized_bytes']),
          }
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as h:
              for key, value in fields.items():
                  h.write(f'{key}={value}\n')
          print('TEXT_FREE_EVIDENCE ' + json.dumps(fields, sort_keys=True))
          print('DISPOSITION_COUNTS ' + json.dumps(report['disposition_counts'], sort_keys=True))
          PY
      - name: Delete source and candidate payloads
        if: always()
        run: rm -rf /tmp/arxiv-a
      - name: Ensure tracked repository stayed clean
        run: test -z "$(git status --porcelain --untracked-files=no)"

  execute-b:
    name: independent execution B
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      source_sha256: ${{ steps.evidence.outputs.source_sha256 }}
      source_bytes: ${{ steps.evidence.outputs.source_bytes }}
      candidate_sha256: ${{ steps.evidence.outputs.candidate_sha256 }}
      report_file_sha256: ${{ steps.evidence.outputs.report_file_sha256 }}
      report_identity_sha256: ${{ steps.evidence.outputs.report_identity_sha256 }}
      disposition_sha256: ${{ steps.evidence.outputs.disposition_sha256 }}
      rows_scanned: ${{ steps.evidence.outputs.rows_scanned }}
      retained_records: ${{ steps.evidence.outputs.retained_records }}
      retained_bytes: ${{ steps.evidence.outputs.retained_bytes }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Bind exact Product head
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
      - name: Run exact immutable-source materialization
        run: |
          mkdir -p /tmp/arxiv-b
          python tools/materialize_d03_common_pile_arxiv_abstracts_v1.py \
            --shard /tmp/arxiv-b/00003_arxiv-abstracts.jsonl.gz \
            --output-jsonl /tmp/arxiv-b/candidate.jsonl \
            --report /tmp/arxiv-b/report.json \
            --download > /tmp/arxiv-b/stdout.json
      - name: Emit text-free hash-safe evidence
        id: evidence
        run: |
          python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          root = Path('/tmp/arxiv-b')
          shard = root / '00003_arxiv-abstracts.jsonl.gz'
          candidate = root / 'candidate.jsonl'
          report_path = root / 'report.json'
          report = json.loads(report_path.read_text(encoding='utf-8'))

          def sha_file(path: Path) -> str:
              h = hashlib.sha256()
              with path.open('rb') as f:
                  for chunk in iter(lambda: f.read(1024 * 1024), b''):
                      h.update(chunk)
              return h.hexdigest()

          source_sha = sha_file(shard)
          source_bytes = shard.stat().st_size
          candidate_sha = sha_file(candidate)
          report_file_sha = sha_file(report_path)
          disposition_sha = hashlib.sha256(
              json.dumps(report['disposition_counts'], sort_keys=True, separators=(',', ':')).encode('utf-8')
          ).hexdigest()

          assert source_sha == '3d781bf7617fd9a6840211227c6c8831280dba457a6d9c79a2a5a357e025a8b7'
          assert source_bytes == 232616926
          assert report['source_revision'] == '46de78c48636c0b46f60049dfd1c5a3710d233f9'
          assert report['source_file'] == '00003_arxiv-abstracts.jsonl.gz'
          assert report['source_sha256'] == source_sha
          assert report['source_bytes'] == source_bytes
          assert report['source_key'] == 'arxiv_abstracts'
          assert report['hf_dataset'] == 'common-pile/arxiv_abstracts'
          assert report['candidate_jsonl_sha256'] == candidate_sha
          assert report['rows_scanned'] == 4096
          assert report['retained_records'] > 0
          assert report['retained_records'] <= 1024
          assert report['retained_normalized_bytes'] > 0
          assert report['source_level_rights_basis_checked'] is True
          assert report['per_record_cc0_metadata_required'] is True
          assert report['universal_pii_absence_claimed'] is False
          assert report['rejected_text_emitted'] is False
          assert report['rejected_hashes_emitted'] is False
          assert report['training_authorized_bytes'] == 0
          assert report['canonical_capacity_credited'] == 0
          assert report['family_credit_added'] == 0
          assert report['unique_causal_loss_positions_authorized'] == 0
          assert report['tokenizer_fit_authorized'] is False
          assert report['optimizer_updates'] == 0
          assert report['model_training_executed'] is False
          assert report['final_test_accessed'] is False
          assert report['paid_compute_used'] is False
          assert report['research_corpus_v1_released'] is False

          fields = {
              'source_sha256': source_sha,
              'source_bytes': str(source_bytes),
              'candidate_sha256': candidate_sha,
              'report_file_sha256': report_file_sha,
              'report_identity_sha256': report['report_identity_sha256'],
              'disposition_sha256': disposition_sha,
              'rows_scanned': str(report['rows_scanned']),
              'retained_records': str(report['retained_records']),
              'retained_bytes': str(report['retained_normalized_bytes']),
          }
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as h:
              for key, value in fields.items():
                  h.write(f'{key}={value}\n')
          print('TEXT_FREE_EVIDENCE ' + json.dumps(fields, sort_keys=True))
          print('DISPOSITION_COUNTS ' + json.dumps(report['disposition_counts'], sort_keys=True))
          PY
      - name: Delete source and candidate payloads
        if: always()
        run: rm -rf /tmp/arxiv-b
      - name: Ensure tracked repository stayed clean
        run: test -z "$(git status --porcelain --untracked-files=no)"

  compare-independent-executions:
    name: compare independent executions
    needs: [execute-a, execute-b]
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - name: Require byte-identical deterministic evidence
        env:
          A_SOURCE_SHA: ${{ needs.execute-a.outputs.source_sha256 }}
          B_SOURCE_SHA: ${{ needs.execute-b.outputs.source_sha256 }}
          A_SOURCE_BYTES: ${{ needs.execute-a.outputs.source_bytes }}
          B_SOURCE_BYTES: ${{ needs.execute-b.outputs.source_bytes }}
          A_CANDIDATE: ${{ needs.execute-a.outputs.candidate_sha256 }}
          B_CANDIDATE: ${{ needs.execute-b.outputs.candidate_sha256 }}
          A_REPORT_FILE: ${{ needs.execute-a.outputs.report_file_sha256 }}
          B_REPORT_FILE: ${{ needs.execute-b.outputs.report_file_sha256 }}
          A_REPORT_ID: ${{ needs.execute-a.outputs.report_identity_sha256 }}
          B_REPORT_ID: ${{ needs.execute-b.outputs.report_identity_sha256 }}
          A_DISPOSITION: ${{ needs.execute-a.outputs.disposition_sha256 }}
          B_DISPOSITION: ${{ needs.execute-b.outputs.disposition_sha256 }}
          A_SCANNED: ${{ needs.execute-a.outputs.rows_scanned }}
          B_SCANNED: ${{ needs.execute-b.outputs.rows_scanned }}
          A_RECORDS: ${{ needs.execute-a.outputs.retained_records }}
          B_RECORDS: ${{ needs.execute-b.outputs.retained_records }}
          A_BYTES: ${{ needs.execute-a.outputs.retained_bytes }}
          B_BYTES: ${{ needs.execute-b.outputs.retained_bytes }}
        run: |
          test -n "$A_SOURCE_SHA" && test "$A_SOURCE_SHA" = "$B_SOURCE_SHA"
          test "$A_SOURCE_SHA" = "3d781bf7617fd9a6840211227c6c8831280dba457a6d9c79a2a5a357e025a8b7"
          test -n "$A_SOURCE_BYTES" && test "$A_SOURCE_BYTES" = "$B_SOURCE_BYTES"
          test "$A_SOURCE_BYTES" = "232616926"
          test -n "$A_CANDIDATE" && test "$A_CANDIDATE" = "$B_CANDIDATE"
          test -n "$A_REPORT_FILE" && test "$A_REPORT_FILE" = "$B_REPORT_FILE"
          test -n "$A_REPORT_ID" && test "$A_REPORT_ID" = "$B_REPORT_ID"
          test -n "$A_DISPOSITION" && test "$A_DISPOSITION" = "$B_DISPOSITION"
          test -n "$A_SCANNED" && test "$A_SCANNED" = "$B_SCANNED"
          test "$A_SCANNED" = "4096"
          test -n "$A_RECORDS" && test "$A_RECORDS" = "$B_RECORDS"
          test -n "$A_BYTES" && test "$A_BYTES" = "$B_BYTES"
          printf 'DETERMINISTIC_REAL_EXECUTION source_sha256=%s source_bytes=%s candidate_sha256=%s report_file_sha256=%s report_identity_sha256=%s disposition_sha256=%s rows_scanned=%s retained_records=%s retained_bytes=%s\n' \
            "$A_SOURCE_SHA" "$A_SOURCE_BYTES" "$A_CANDIDATE" "$A_REPORT_FILE" "$A_REPORT_ID" "$A_DISPOSITION" "$A_SCANNED" "$A_RECORDS" "$A_BYTES"
