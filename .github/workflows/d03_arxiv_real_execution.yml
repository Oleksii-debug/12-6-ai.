              },
          }
          (root / 'evidence.json').write_text(
              json.dumps(evidence, ensure_ascii=False, sort_keys=True, separators=(',', ':')) + '\n',
              encoding='utf-8',
          )
          PY
      - name: Upload text-free execution B evidence
        id: upload
        uses: actions/upload-artifact@v4
        with:
          name: d03-arxiv-evidence-b-${{ github.run_id }}
          path: /tmp/arxiv-b/evidence.json
          if-no-files-found: error
          retention-days: 30
      - name: Delete source and candidate payloads
        if: always()
        run: rm -rf /tmp/arxiv-b
      - name: Ensure tracked repository stayed clean
        run: test -z "$(git status --porcelain --untracked-files=no)"

  compare-independent-executions:
    name: compare independent executions
    needs: [execute-a, execute-b]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      artifact_id: ${{ steps.upload.outputs.artifact-id }}
      artifact_digest: ${{ steps.upload.outputs.artifact-digest }}
    steps:
      - name: Download execution A evidence
        uses: actions/download-artifact@v4
        with:
          name: d03-arxiv-evidence-a-${{ github.run_id }}
          path: /tmp/compare/a
      - name: Download execution B evidence
        uses: actions/download-artifact@v4
        with:
          name: d03-arxiv-evidence-b-${{ github.run_id }}
          path: /tmp/compare/b
      - name: Require deterministic evidence and build run-bound compare manifest
        env:
          EXECUTION_HEAD: ${{ github.event.pull_request.head.sha }}
          A_ARTIFACT_ID: ${{ needs.execute-a.outputs.artifact_id }}
          A_ARTIFACT_DIGEST: ${{ needs.execute-a.outputs.artifact_digest }}
          B_ARTIFACT_ID: ${{ needs.execute-b.outputs.artifact_id }}
          B_ARTIFACT_DIGEST: ${{ needs.execute-b.outputs.artifact_digest }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          a_path = Path('/tmp/compare/a/evidence.json')
          b_path = Path('/tmp/compare/b/evidence.json')
          a_raw = a_path.read_bytes()
          b_raw = b_path.read_bytes()
          a = json.loads(a_raw)
          b = json.loads(b_raw)
          assert a['execution_slot'] == 'A'
          assert b['execution_slot'] == 'B'
          a_cmp = dict(a); b_cmp = dict(b)
          a_cmp.pop('execution_slot'); b_cmp.pop('execution_slot')
          assert a_cmp == b_cmp
          assert a_cmp['source'] == {
              'dataset': 'common-pile/arxiv_abstracts',
              'revision': '46de78c48636c0b46f60049dfd1c5a3710d233f9',
              'file': '00003_arxiv-abstracts.jsonl.gz',
              'bytes': 232616926,
              'sha256': '3d781bf7617fd9a6840211227c6c8831280dba457a6d9c79a2a5a357e025a8b7',
          }
          assert a_cmp['rows_scanned'] == 4096
          assert a_cmp['retained_records'] > 0
          assert a_cmp['retained_normalized_bytes'] > 0
          for key in ('canonical_capacity_credited','training_authorized_bytes','authorized_unique_loss_positions','family_credit_added','optimizer_updates'):
              value = a_cmp['claim_boundary'][key]
              assert type(value) is int and value == 0
          for key in ('tokenizer_fit_authorized','model_training_executed','final_test_accessed','paid_compute_used','foreign_pretrained_weights_used'):
              assert a_cmp['claim_boundary'][key] is False

          manifest = {
              'schema_version': '12-6.d03-arxiv-run-bound-compare.v1',
              'run_id': int(os.environ['RUN_ID']),
              'run_attempt': int(os.environ['RUN_ATTEMPT']),
              'execution_head_sha': os.environ['EXECUTION_HEAD'],
              'execution_a_artifact': {
                  'id': int(os.environ['A_ARTIFACT_ID']),
                  'digest': os.environ['A_ARTIFACT_DIGEST'],
                  'evidence_sha256': hashlib.sha256(a_raw).hexdigest(),
              },
              'execution_b_artifact': {
                  'id': int(os.environ['B_ARTIFACT_ID']),
                  'digest': os.environ['B_ARTIFACT_DIGEST'],
                  'evidence_sha256': hashlib.sha256(b_raw).hexdigest(),
              },
              'deterministic_evidence': a_cmp,
              'claim_boundary': {
                  'canonical_capacity_credited': 0,
                  'training_authorized_bytes': 0,
                  'authorized_optimized_target_exposure': 0,
                  'optimizer_updates': 0,
                  'training_executed': False,
                  'learned_weights_created': False,
                  'final_test_accessed': False,
                  'paid_compute_used': False,
                  'foreign_pretrained_weights_used': False,
              },
          }
          out = Path('/tmp/compare/compare-manifest.json')
          out.write_text(json.dumps(manifest, ensure_ascii=False, sort_keys=True, separators=(',', ':')) + '\n', encoding='utf-8')
          print('RUN_BOUND_COMPARE ' + json.dumps(manifest, sort_keys=True))
          PY
      - name: Upload run-bound compare manifest
        id: upload
        uses: actions/upload-artifact@v4
        with:
          name: d03-arxiv-compare-${{ github.run_id }}
          path: /tmp/compare/compare-manifest.json
          if-no-files-found: error
          retention-days: 30
