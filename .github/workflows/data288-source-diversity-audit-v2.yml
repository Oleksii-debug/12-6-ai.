name: DATA-288 Source Diversity Audit V2

on:
  pull_request:
    paths:
      - ".github/workflows/data288-source-diversity-audit-v2.yml"
      - "configs/data/data288_source_diversity_inputs_v2.json"
      - "evidence/data288/source_diversity_audit_v2.json"
      - "tools/validate_data288_source_diversity.py"
      - "tests/test_data288_source_diversity.py"
      - "docs/DATA288_SOURCE_DIVERSITY_AUDIT_V2.md"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      TWELVE_SIX_EXECUTION_PROFILE: LOCAL_FREE
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.11.16"

      - name: Bind exact source head
        env:
          EXPECTED_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SOURCE_SHA"

      - name: Universal exact LOCAL_FREE bootstrap
        uses: ./.github/actions/execution-bootstrap
        with:
          capabilities: tests,lint
          venv: .data288
          command: python -m pytest -q tests/test_data288_source_diversity.py
          manifest: data288-execution-environment.json

      - name: Compile deterministic audit
        run: .data288/bin/python -m compileall -q tools/validate_data288_source_diversity.py

      - name: Focused audit contracts
        run: .data288/bin/python -m pytest -q tests/test_data288_source_diversity.py

      - name: Focused audit lint
        run: |
          set -o pipefail
          .data288/bin/ruff check \
            tools/validate_data288_source_diversity.py \
            tests/test_data288_source_diversity.py \
            2>&1 | tee data288-ruff.txt

      - name: Upload lint diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: data288-ruff-${{ github.event.pull_request.head.sha || github.sha }}
          if-no-files-found: error
          retention-days: 7
          path: data288-ruff.txt

      - name: Rebuild audit byte-identically
        run: |
          .data288/bin/python tools/validate_data288_source_diversity.py --verify
          .data288/bin/python - <<'PY'
          import json
          report = json.load(open("evidence/data288/source_diversity_audit_v2.json"))
          assert report["training_executed"] is False
          assert report["next_corpus_diversity_status"] == "BLOCKED_SOURCE_DIVERSITY"
          assert report["independent_family_count"] == 4
          assert report["normalized_unique_bytes"] == 183061
          PY

      - name: Upload hash-only audit evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: data288-source-diversity-audit-${{ github.event.pull_request.head.sha || github.sha }}
          if-no-files-found: error
          retention-days: 90
          path: |
            configs/data/data288_source_diversity_inputs_v2.json
            evidence/data288/source_diversity_audit_v2.json
            data288-execution-environment.json
