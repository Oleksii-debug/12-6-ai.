name: POSTBASE-355 Tool Protocol Integration

on:
  push:
    branches:
      - postbase355/tool-protocol-integration-20260826
  pull_request:
    branches:
      - postbase254/tool-use-protocol-20260826
  workflow_dispatch:

permissions:
  contents: read

jobs:
  integration-gates:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact head
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Verify exact checkout
        shell: bash
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          test "$actual" = "$EXPECTED_HEAD"

      - name: Set up exact Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11.16"

      - name: Universal execution bootstrap
        uses: ./.github/actions/execution-bootstrap
        with:
          capabilities: runtime,tests,lint
          venv: .venv-postbase355
          manifest: postbase355-bootstrap.json

      - name: Focused integration tests
        shell: bash
        env:
          PYTHONPATH: src
        run: |
          set -euo pipefail
          .venv-postbase355/bin/python -m pytest -q \
            tests/test_postbase355_tool_protocol_integration.py

      - name: Compile integration surfaces
        shell: bash
        run: |
          set -euo pipefail
          .venv-postbase355/bin/python -m compileall -q \
            src/twelve_six/postbase/model_tool_integration.py \
            tests/test_postbase355_tool_protocol_integration.py

      - name: Lint integration surfaces
        shell: bash
        run: |
          set -euo pipefail
          .venv-postbase355/bin/ruff check \
            src/twelve_six/postbase/model_tool_integration.py \
            tests/test_postbase355_tool_protocol_integration.py

      - name: Verify fail-closed tool boundary
        shell: bash
        env:
          PYTHONPATH: src
        run: |
          set -euo pipefail
          .venv-postbase355/bin/python - <<'PY'
          from twelve_six.postbase.tool_protocol import MockExecutor, ToolName

          registered = {tool.value for tool in ToolName}
          assert "shell.exec" not in registered
          executor = MockExecutor()
          assert executor.filesystem == {}
          PY