name: DATA-27 Ukrainian Normalization Evidence

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  normalization-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11.16"
      - name: Bind exact source head
        env:
          EXPECTED_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SOURCE_SHA"
      - name: Install locked runtime and test tooling
        run: |
          python -m venv .data27
          .data27/bin/python -m pip install \
            --disable-pip-version-check --no-deps --require-hashes \
            -r requirements/locks/linux-x86_64/toolchain.lock.txt
          .data27/bin/python -m pip install \
            --disable-pip-version-check --no-deps --require-hashes \
            -r requirements/locks/linux-x86_64/runtime.lock.txt
          .data27/bin/python -m pip install \
            --disable-pip-version-check --no-deps --require-hashes \
            -r requirements/locks/linux-x86_64/dev.lock.txt
      - name: Run normalization and integration regression tests
        env:
          PYTHONPATH: src
        run: >-
          .data27/bin/python -m pytest -q
          tests/test_ukrainian_normalization.py
          tests/test_d03_s0_data_pipeline.py
          tests/test_multilingual_pretraining.py
      - name: Reproduce current Ukrainian S0 normalization audit
        env:
          PYTHONPATH: src
        run: |
          .data27/bin/python tools/audit_ukrainian_normalization.py \
            --input data/s0/raw/project_authored.jsonl \
            --source-id project-authored-s0-fixture-v1 \
            --source-version project-authored-s0-fixture-v1 \
            --language-hint uk \
            --output data27-normalization-audit.json
          python - <<'PY'
          import json
          from pathlib import Path
          payload = json.loads(Path('data27-normalization-audit.json').read_text(encoding='utf-8'))
          summary = payload['summary']
          assert summary['documents'] == 6
          assert summary['changed_documents'] == 0
          assert summary['raw_codepoints'] == 811
          assert summary['normalized_codepoints'] == 811
          assert summary['raw_byte_tokens'] == 1515
          assert summary['normalized_byte_tokens'] == 1515
          assert summary['reason_counts'] == {}
          PY
      - name: Upload exact audit evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: data27-ua-normalization-evidence
          path: |
            docs/evidence/DATA27_UA_NORMALIZATION_AUDIT.json
            docs/evidence/DATA27_UA_REAL_SAMPLE_AUDIT.json
            tests/fixtures/ukrainian_normalization_regression_v1.jsonl
            data27-normalization-audit.json
          if-no-files-found: error
          retention-days: 30
