name: MODEL-16 Weight Tying LOCAL_FREE

on:
  pull_request:

permissions:
  contents: read

jobs:
  tied-vs-untied-cpu:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Prove exact source checkout
        env:
          SOURCE_SHA: ${{ github.event.pull_request.head.sha }}
        run: test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11.16"
      - name: Verify exact locked environment inputs
        env:
          SOURCE_SHA: ${{ github.event.pull_request.head.sha }}
        run: >-
          python tools/verify_locked_environment.py
          --profile linux-x86_64
          --source-sha "$SOURCE_SHA"
          --evidence-out model16-locked-environment.json
      - name: Create locked LOCAL_FREE environment
        run: |
          python -m venv .model16-locked
          .model16-locked/bin/python -m pip install --disable-pip-version-check --require-hashes --no-deps -r requirements/locks/linux-x86_64/toolchain.lock.txt
          .model16-locked/bin/python -m pip install --disable-pip-version-check --require-hashes --no-deps -r requirements/locks/linux-x86_64/runtime.lock.txt
          .model16-locked/bin/python -m pip install --disable-pip-version-check --require-hashes --no-deps -r requirements/locks/linux-x86_64/dev.lock.txt
          PIP_NO_INDEX=1 PIP_DISABLE_PIP_VERSION_CHECK=1 .model16-locked/bin/python -m pip install --no-deps --no-build-isolation -e .
      - name: Verify MODEL-16 geometry and identity contract
        run: .model16-locked/bin/python -m pytest -q tests/test_weight_tying_experiment.py
      - name: Execute matched tied-vs-untied training
        env:
          SOURCE_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          .model16-locked/bin/python -m twelve_six.weight_tying_experiment run \
            --repo-root . \
            --source-sha "$SOURCE_SHA" \
            --output model16-weight-tying-results.json
          .model16-locked/bin/python -m twelve_six.weight_tying_experiment validate \
            model16-weight-tying-results.json \
            --expected-source-sha "$SOURCE_SHA"
      - name: Upload executed evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: model16-weight-tying-evidence
          path: |
            model16-locked-environment.json
            model16-weight-tying-results.json
            configs/research/model16_weight_tying_250k.json
          if-no-files-found: error
          retention-days: 30
