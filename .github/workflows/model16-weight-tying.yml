name: MODEL16 Weight Tying Experiment

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  weight-tying-250k:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11.16"
      - name: Bind exact source head
        env:
          EXPECTED_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SOURCE_SHA"
      - name: Install exact runtime
        run: |
          python -m venv .model16
          .model16/bin/python -m pip install \
            --disable-pip-version-check --no-deps --require-hashes \
            -r requirements/locks/linux-x86_64/toolchain.lock.txt
          .model16/bin/python -m pip install \
            --disable-pip-version-check --no-deps --require-hashes \
            -r requirements/locks/linux-x86_64/runtime.lock.txt
      - name: Execute matched tied-vs-untied training
        env:
          EXPECTED_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          PYTHONPATH: src
        run: |
          mkdir -p model16-evidence
          .model16/bin/python -m twelve_six.weight_tying_experiment run \
            --repo-root . --source-sha "$EXPECTED_SOURCE_SHA" \
            --output model16-evidence/weight-tying.json
          .model16/bin/python -m twelve_six.weight_tying_experiment validate \
            model16-evidence/weight-tying.json --expected-source-sha "$EXPECTED_SOURCE_SHA"
          .model16/bin/python - <<'PY'
          import json
          r=json.load(open('model16-evidence/weight-tying.json', encoding='utf-8'))
          print('MODEL16_SUMMARY=' + json.dumps({
              'parameter_delta_fraction': r['parameter_delta_fraction'],
              'aggregates': r['aggregates'],
              'decision': r['decision'],
          }, sort_keys=True))
          PY
      - name: Upload MODEL-16 evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: model16-weight-tying-evidence
          path: model16-evidence
          if-no-files-found: error
          retention-days: 30
