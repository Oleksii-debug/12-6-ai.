name: MODEL-16 Weight Tying

on:
  pull_request:
    paths:
      - "src/twelve_six/weight_tying_experiment.py"
      - "tools/run_weight_tying_experiment.py"
      - "configs/experiments/model16_weight_tying_500k.json"
      - "tests/test_weight_tying_experiment.py"
      - ".github/workflows/model16-weight-tying.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  local-free-weight-tying:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Prove exact source checkout
        env:
          SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11.16"
      - name: Verify exact D08 locked environment
        env:
          SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: >-
          python tools/verify_locked_environment.py
          --profile linux-x86_64
          --source-sha "$SOURCE_SHA"
          --evidence-out locked-environment-linux-x86_64.json
      - name: Create exact locked MODEL-16 environment
        run: |
          python -m venv .model16-locked
          .model16-locked/bin/python -m pip install --disable-pip-version-check --require-hashes --no-deps -r requirements/locks/linux-x86_64/toolchain.lock.txt
          .model16-locked/bin/python -m pip install --disable-pip-version-check --require-hashes --no-deps -r requirements/locks/linux-x86_64/runtime.lock.txt
          .model16-locked/bin/python -m pip install --disable-pip-version-check --require-hashes --no-deps -r requirements/locks/linux-x86_64/dev.lock.txt
          PIP_NO_INDEX=1 PIP_DISABLE_PIP_VERSION_CHECK=1 .model16-locked/bin/python -m pip install --no-deps --no-build-isolation -e .
      - name: Run MODEL-16 contract tests
        run: .model16-locked/bin/python -m pytest -q tests/test_weight_tying_experiment.py
      - name: Execute matched-capacity LOCAL_FREE training
        env:
          SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          mkdir -p model16-evidence
          .model16-locked/bin/python tools/run_weight_tying_experiment.py \
            --source-sha "$SOURCE_SHA" \
            --output model16-evidence/weight_tying_500k.json
          test ! -e model16-evidence/model16-checkpoints-tmp
      - name: Upload MODEL-16 evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: model16-weight-tying-evidence
          path: |
            locked-environment-linux-x86_64.json
            model16-evidence/weight_tying_500k.json
          if-no-files-found: error
          retention-days: 30
