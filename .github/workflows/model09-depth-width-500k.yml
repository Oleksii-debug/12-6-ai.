name: MODEL09 Depth Width 500K

on:
  pull_request:

permissions:
  contents: read

jobs:
  depth-width-500k-cpu:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Prove exact source checkout
        env:
          SOURCE_SHA: ${{ github.event.pull_request.head.sha }}
        run: test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11.16"
      - name: Verify locked environment inputs
        env:
          SOURCE_SHA: ${{ github.event.pull_request.head.sha }}
        run: >-
          python tools/verify_locked_environment.py
          --profile linux-x86_64
          --source-sha "$SOURCE_SHA"
          --evidence-out model09-locked-environment.json
      - name: Create locked LOCAL_FREE execution environment
        run: |
          python -m venv .model09-locked
          .model09-locked/bin/python -m pip install --disable-pip-version-check --require-hashes --no-deps -r requirements/locks/linux-x86_64/toolchain.lock.txt
          .model09-locked/bin/python -m pip install --disable-pip-version-check --require-hashes --no-deps -r requirements/locks/linux-x86_64/runtime.lock.txt
          .model09-locked/bin/python -m pip install --disable-pip-version-check --require-hashes --no-deps -r requirements/locks/linux-x86_64/dev.lock.txt
          PIP_NO_INDEX=1 PIP_DISABLE_PIP_VERSION_CHECK=1 .model09-locked/bin/python -m pip install --no-deps --no-build-isolation -e .
      - name: Focused source and contract tests
        run: |
          .model09-locked/bin/ruff check src/twelve_six/depth_width_500k.py tests/test_depth_width_500k.py
          .model09-locked/bin/python -m pytest -q tests/test_fixed_token_research.py tests/test_depth_width_500k.py
      - name: Prove generated config equals committed candidate identities
        run: |
          .model09-locked/bin/python -m twelve_six.depth_width_500k write-config --output generated-model09.json
          cmp generated-model09.json configs/experiments/model09_depth_width_500k.v1.json
      - name: Execute five-candidate exact-token matrix
        env:
          SOURCE_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          mkdir -p evidence/model09 checkpoints/model09
          for CANDIDATE in shallow_wide mid_shallow balanced deep_narrow very_deep_narrow; do
            .model09-locked/bin/python -m twelve_six.depth_width_500k run-candidate \
              --repo-root . \
              --source-sha "$SOURCE_SHA" \
              --candidate-id "$CANDIDATE" \
              --token-budgets 16384 65536 \
              --torch-threads 2 \
              --checkpoint-dir checkpoints/model09 \
              --output "evidence/model09/candidate-${CANDIDATE}.json"
          done
          .model09-locked/bin/python -m twelve_six.depth_width_500k collect \
            --expected-source-sha "$SOURCE_SHA" \
            --output model09-depth-width-500k-matrix.json \
            evidence/model09/candidate-*.json
          .model09-locked/bin/python -m twelve_six.depth_width_500k validate \
            model09-depth-width-500k-matrix.json --expected-source-sha "$SOURCE_SHA"
      - name: Print measured recommendation
        run: |
          .model09-locked/bin/python - <<'PY'
          import json
          report = json.load(open("model09-depth-width-500k-matrix.json", encoding="utf-8"))
          print(json.dumps({
              "source_sha": report["source_sha"],
              "fixed_token_budget": report["fixed_token_budget"],
              "ranking": report["ranking"],
              "recommended_500k_geometry": report["recommended_500k_geometry"],
              "candidate_parameter_span": report["candidate_parameter_span"],
              "report_sha256": report["report_sha256"],
          }, indent=2, sort_keys=True))
          PY
      - name: Upload retained MODEL09 evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: model09-depth-width-500k-evidence
          path: |
            model09-locked-environment.json
            model09-depth-width-500k-matrix.json
            evidence/model09/*.json
            checkpoints/model09/*.pt
          if-no-files-found: error
          retention-days: 30
