name: TRAIN52 Update Ratio Observability

on:
  push:
    branches:
      - train52/update-ratio-20260825
  workflow_dispatch:

permissions:
  contents: read

jobs:
  update-ratio-cpu:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11.16"
      - name: Verify locked environment inputs
        env:
          SOURCE_SHA: ${{ github.sha }}
        run: >-
          python tools/verify_locked_environment.py
          --profile linux-x86_64
          --source-sha "$SOURCE_SHA"
          --evidence-out train52-locked-environment.json
      - name: Create locked LOCAL_FREE environment
        run: |
          python -m venv .train52-locked
          .train52-locked/bin/python -m pip install --disable-pip-version-check --require-hashes --no-deps -r requirements/locks/linux-x86_64/toolchain.lock.txt
          .train52-locked/bin/python -m pip install --disable-pip-version-check --require-hashes --no-deps -r requirements/locks/linux-x86_64/runtime.lock.txt
          .train52-locked/bin/python -m pip install --disable-pip-version-check --require-hashes --no-deps -r requirements/locks/linux-x86_64/dev.lock.txt
          PIP_NO_INDEX=1 PIP_DISABLE_PIP_VERSION_CHECK=1 .train52-locked/bin/python -m pip install --no-deps --no-build-isolation -e .
      - name: Focused numerical and incumbent-regression tests
        run: >-
          .train52-locked/bin/python -m pytest -q
          tests/test_update_ratio_observability.py
          tests/test_training_observability.py
      - name: Run real 100K 500K 1M update-ratio probe
        env:
          SOURCE_SHA: ${{ github.sha }}
        run: |
          .train52-locked/bin/python -m twelve_six.training.update_ratio_probe run \
            --repo-root . \
            --source-sha "$SOURCE_SHA" \
            --output train52-update-ratio-evidence.json \
            --steps 12 \
            --seed 1337 \
            --batch-size 2 \
            --sequence-length 64 \
            --torch-threads 2
          .train52-locked/bin/python -m twelve_six.training.update_ratio_probe validate \
            train52-update-ratio-evidence.json \
            --expected-source-sha "$SOURCE_SHA"
      - name: Print compact evidence summary
        run: |
          .train52-locked/bin/python - <<'PY'
          import json
          report = json.load(open("train52-update-ratio-evidence.json", encoding="utf-8"))
          for scale in report["scales"]:
              print(json.dumps({
                  "scale": scale["scale"],
                  "parameters": scale["parameters"],
                  "determinism": scale["determinism"],
                  "overhead": scale["overhead"],
                  "worst_observed_update": scale["worst_observed_update"],
                  "pathology_candidates": scale["pathology_candidates"],
              }, sort_keys=True))
          PY
      - name: Upload TRAIN52 evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: train52-update-ratio-evidence
          path: |
            train52-locked-environment.json
            train52-update-ratio-evidence.json
          if-no-files-found: error
          retention-days: 30
