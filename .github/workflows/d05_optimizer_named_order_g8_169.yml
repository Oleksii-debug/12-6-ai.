name: D05 optimizer named-order G8-169

on:
  pull_request:
    branches:
      - repair/2940-core-rng-failure-note-g8-168-20261006
    paths:
      - ".github/workflows/d05_optimizer_named_order_g8_169.yml"
      - "tools/run_d05_optimizer_named_order_fresh_process_g8_169.py"

permissions:
  contents: read

concurrency:
  group: d05-optimizer-named-order-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  SOURCE_SHA: "1927c304e14bc09e3cb18f10c2c338c5c18b0ee9"
  EVENT_BASE_SHA: ${{ github.event.pull_request.base.sha }}
  QUALIFICATION_CARRIER_SHA: ${{ github.event.pull_request.head.sha }}
  PYTHONUTF8: "1"

jobs:
  linux-named-order:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.head_ref == 'qualification/2941-optimizer-named-order-g8-169-20261006'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Checkout exact qualification carrier
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.QUALIFICATION_CARRIER_SHA }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set exact CPython 3.11.16
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.11.16"

      - name: Bind exact source and optimizer identity closure
        shell: bash
        run: |
          set -euo pipefail
          test "$EVENT_BASE_SHA" = "$SOURCE_SHA"
          test "$(git rev-parse HEAD)" = "$QUALIFICATION_CARRIER_SHA"
          test "$(git merge-base "$SOURCE_SHA" HEAD)" = "$SOURCE_SHA"
          git diff --name-only "$SOURCE_SHA"..HEAD | sort > /tmp/changed.txt
          cat >/tmp/expected.txt <<'EOF'
          .github/workflows/d05_optimizer_named_order_g8_169.yml
          tools/run_d05_optimizer_named_order_fresh_process_g8_169.py
          EOF
          sort -o /tmp/expected.txt /tmp/expected.txt
          cmp /tmp/expected.txt /tmp/changed.txt
          test "$(git rev-parse "$SOURCE_SHA:src/twelve_six/training/trainer.py")" = "493b482bf9d87533790fd4cd3087269a7062c3ba"
          test "$(git rev-parse "$SOURCE_SHA:src/twelve_six/checkpoint/trainer_adapter.py")" = "a42da63f2688b8ec4405e8f21ede1c17313422c8"
          test "$(git rev-parse "$SOURCE_SHA:tests/test_checkpoint_optimizer_named_order.py")" = "70927e234609c095fc38a1a90eb60a6c34549cb6"
          test "$(git rev-parse "$SOURCE_SHA:tests/test_checkpoint_optimizer_ownership_preio.py")" = "f869db7b43b715428be8417331db63771624be7e"
          test "$(git rev-parse "$SOURCE_SHA:tests/test_trainer_direct_restore_binding.py")" = "c02e9c2453493cc463f0e020a342e4eb14a5c5b6"
          test "$(git rev-parse "$SOURCE_SHA:tests/test_checkpoint_model_loader_single_call.py")" = "6aa1b729a5dcee0cdc692698ad5c881127470ad2"
          python -m py_compile \
            src/twelve_six/training/trainer.py \
            src/twelve_six/checkpoint/trainer_adapter.py \
            tests/test_checkpoint_optimizer_named_order.py \
            tests/test_checkpoint_optimizer_ownership_preio.py \
            tests/test_trainer_direct_restore_binding.py \
            tests/test_checkpoint_model_loader_single_call.py \
            tools/run_d05_optimizer_named_order_fresh_process_g8_169.py
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

      - name: Install focused test dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'

      - name: Lint exact optimizer-order closure
        shell: bash
        run: |
          set -euo pipefail
          python -m ruff check \
            src/twelve_six/training/trainer.py \
            src/twelve_six/checkpoint/trainer_adapter.py \
            tests/test_checkpoint_optimizer_named_order.py \
            tests/test_checkpoint_optimizer_ownership_preio.py \
            tests/test_trainer_direct_restore_binding.py \
            tests/test_checkpoint_model_loader_single_call.py \
            tools/run_d05_optimizer_named_order_fresh_process_g8_169.py

      - name: Execute current-head optimizer-order regressions
        shell: bash
        run: |
          set -euo pipefail
          python -m pytest -q \
            tests/test_checkpoint_optimizer_named_order.py \
            tests/test_checkpoint_optimizer_ownership_preio.py \
            tests/test_trainer_direct_restore_binding.py \
            tests/test_checkpoint_model_loader_single_call.py

      - name: Execute fresh-process save and resume proof
        shell: bash
        run: |
          set -euo pipefail
          python tools/run_d05_optimizer_named_order_fresh_process_g8_169.py \
            --output d05-optimizer-named-order-linux.json
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          report = json.loads(
              Path("d05-optimizer-named-order-linux.json").read_text(encoding="utf-8")
          )
          assert report["verdict"] == (
              "PASS_D05_OPTIMIZER_NAMED_ORDER_FRESH_PROCESS_ZERO_CREDIT"
          )
          assert report["source_sha"] == "1927c304e14bc09e3cb18f10c2c338c5c18b0ee9"
          assert report["qualification_carrier_sha"] == os.environ[
              "QUALIFICATION_CARRIER_SHA"
          ]
          assert report["scientific_credit"]["optimized_target_exposure"] == 0
          assert report["scientific_credit"]["real_target_optimizer_updates"] == 0
          default = report["modes"]["default-one-group"]
          assert default["same_optimizer_moments"] is True
          assert default["same_next_update"] is True
          assert default["expected_names"] == [["left", "right"]]
          for mode in ("one-group", "two-groups"):
              item = report["modes"][mode]
              assert item["same_optimizer_moments"] is True
              assert item["same_next_update"] is True
              assert item["reversed_order_failed_closed"] is True
              assert item["reversed_rng_unchanged"] is True
              assert item["reversed_target_unchanged"] is True
          print("LINUX_NAMED_ORDER_FRESH_PROCESS=PASS_ZERO_CREDIT")
          PY

      - name: Prove carrier remains clean
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$QUALIFICATION_CARRIER_SHA"
          test -z "$(git status --porcelain=v1 --untracked-files=no)"
          test "$(git ls-files --others --exclude-standard)" = "d05-optimizer-named-order-linux.json"

      - name: Upload Linux evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: d05-optimizer-named-order-linux-${{ github.event.pull_request.head.sha }}
          path: d05-optimizer-named-order-linux.json
          retention-days: 30
          compression-level: 9
          if-no-files-found: error

  windows-named-order:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.head_ref == 'qualification/2941-optimizer-named-order-g8-169-20261006'
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - name: Checkout exact qualification carrier
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.QUALIFICATION_CARRIER_SHA }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set exact CPython 3.11.16
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.11.16"

      - name: Bind exact source and Windows closure
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          if ($env:EVENT_BASE_SHA -ne $env:SOURCE_SHA) { throw "base SHA drifted" }
          if ((git rev-parse HEAD).Trim() -ne $env:QUALIFICATION_CARRIER_SHA) { throw "carrier SHA drifted" }
          if ((git merge-base $env:SOURCE_SHA HEAD).Trim() -ne $env:SOURCE_SHA) { throw "carrier ancestry drifted" }
          $trainerBlob = (git rev-parse "$($env:SOURCE_SHA):src/twelve_six/training/trainer.py").Trim()
          if ($trainerBlob -ne "493b482bf9d87533790fd4cd3087269a7062c3ba") { throw "trainer blob drifted" }
          $adapterBlob = (git rev-parse "$($env:SOURCE_SHA):src/twelve_six/checkpoint/trainer_adapter.py").Trim()
          if ($adapterBlob -ne "a42da63f2688b8ec4405e8f21ede1c17313422c8") { throw "adapter blob drifted" }
          $testBlob = (git rev-parse "$($env:SOURCE_SHA):tests/test_checkpoint_optimizer_named_order.py").Trim()
          if ($testBlob -ne "70927e234609c095fc38a1a90eb60a6c34549cb6") { throw "named-order test blob drifted" }
          python -m py_compile src/twelve_six/training/trainer.py src/twelve_six/checkpoint/trainer_adapter.py tests/test_checkpoint_optimizer_named_order.py tests/test_checkpoint_optimizer_ownership_preio.py tools/run_d05_optimizer_named_order_fresh_process_g8_169.py
          $dirty = git status --porcelain=v1 --untracked-files=all
          if ($dirty) { throw "carrier dirty before execution: $dirty" }

      - name: Install focused test dependencies
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Execute Windows optimizer-order regressions
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          python -m pytest -q tests/test_checkpoint_optimizer_named_order.py tests/test_checkpoint_optimizer_ownership_preio.py

      - name: Execute Windows fresh-process save and resume proof
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          python tools/run_d05_optimizer_named_order_fresh_process_g8_169.py --output d05-optimizer-named-order-windows.json
          @'
          import json
          import os
          from pathlib import Path

          report = json.loads(
              Path("d05-optimizer-named-order-windows.json").read_text(encoding="utf-8")
          )
          assert report["verdict"] == (
              "PASS_D05_OPTIMIZER_NAMED_ORDER_FRESH_PROCESS_ZERO_CREDIT"
          )
          assert report["source_sha"] == "1927c304e14bc09e3cb18f10c2c338c5c18b0ee9"
          assert report["qualification_carrier_sha"] == os.environ[
              "QUALIFICATION_CARRIER_SHA"
          ]
          assert report["scientific_credit"]["optimized_target_exposure"] == 0
          assert report["scientific_credit"]["real_target_optimizer_updates"] == 0
          default = report["modes"]["default-one-group"]
          assert default["same_optimizer_moments"] is True
          assert default["same_next_update"] is True
          assert default["expected_names"] == [["left", "right"]]
          for mode in ("one-group", "two-groups"):
              item = report["modes"][mode]
              assert item["same_optimizer_moments"] is True
              assert item["same_next_update"] is True
              assert item["reversed_order_failed_closed"] is True
              assert item["reversed_rng_unchanged"] is True
              assert item["reversed_target_unchanged"] is True
          print("WINDOWS_NAMED_ORDER_FRESH_PROCESS=PASS_ZERO_CREDIT")
          '@ | python -

      - name: Prove Windows carrier remains clean
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          if ((git rev-parse HEAD).Trim() -ne $env:QUALIFICATION_CARRIER_SHA) { throw "carrier SHA changed" }
          $trackedDirty = git status --porcelain=v1 --untracked-files=no
          if ($trackedDirty) { throw "tracked carrier dirty after execution: $trackedDirty" }
          $untracked = @(git ls-files --others --exclude-standard)
          if ($untracked.Count -ne 1 -or $untracked[0].Trim() -ne "d05-optimizer-named-order-windows.json") {
            throw "unexpected untracked files after execution: $untracked"
          }

      - name: Upload Windows evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: d05-optimizer-named-order-windows-${{ github.event.pull_request.head.sha }}
          path: d05-optimizer-named-order-windows.json
          retention-days: 30
          compression-level: 9
          if-no-files-found: error
