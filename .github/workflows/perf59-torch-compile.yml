name: PERF59 torch.compile training evidence

on:
  pull_request:

permissions:
  contents: read

jobs:
  compile-training-cpu:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Prove exact source checkout
        env:
          SOURCE_SHA: ${{ github.event.pull_request.head.sha }}
        run: test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11.16"
      - name: Verify locked runtime inputs
        env:
          SOURCE_SHA: ${{ github.event.pull_request.head.sha }}
        run: >-
          python tools/verify_locked_environment.py
          --profile linux-x86_64
          --source-sha "$SOURCE_SHA"
          --evidence-out perf59-locked-environment.json
      - name: Create locked LOCAL_FREE environment
        run: |
          python -m venv .perf59-locked
          .perf59-locked/bin/python -m pip install --disable-pip-version-check --require-hashes --no-deps -r requirements/locks/linux-x86_64/toolchain.lock.txt
          .perf59-locked/bin/python -m pip install --disable-pip-version-check --require-hashes --no-deps -r requirements/locks/linux-x86_64/runtime.lock.txt
          .perf59-locked/bin/python -m pip install --disable-pip-version-check --require-hashes --no-deps -r requirements/locks/linux-x86_64/dev.lock.txt
          PIP_NO_INDEX=1 PIP_DISABLE_PIP_VERSION_CHECK=1 .perf59-locked/bin/python -m pip install --no-deps --no-build-isolation -e .
      - name: Focused lint and tests
        run: |
          .perf59-locked/bin/ruff check \
            src/twelve_six/training/compile_backend.py \
            tests/test_training_compile_backend.py \
            tools/benchmark_training_compile.py
          .perf59-locked/bin/pytest -q tests/test_training_compile_backend.py
      - name: Execute fresh-cache CPU compile benchmark
        env:
          SOURCE_SHA: ${{ github.event.pull_request.head.sha }}
          TORCHINDUCTOR_CACHE_DIR: ${{ runner.temp }}/perf59-inductor-cache
        run: |
          rm -rf "$TORCHINDUCTOR_CACHE_DIR"
          .perf59-locked/bin/python tools/benchmark_training_compile.py \
            --repo-root . \
            --output perf59-torch-compile-report.json \
            --expected-source-sha "$SOURCE_SHA" \
            --torch-threads 2 \
            --batch-size 4 \
            --sequence-length 64 \
            --steady-steps 5
      - name: Upload machine-readable compile evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: perf59-torch-compile-evidence
          path: |
            perf59-locked-environment.json
            perf59-torch-compile-report.json
          if-no-files-found: error
          retention-days: 30
