name: CI
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -e .[dev]
      - name: Enforce shared CI workflow budget
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: python -m twelve_six.ci_workflow_policy --base "$BASE_SHA" --head "$HEAD_SHA"
      - run: ruff check src tests
      - run: pytest -q

  d03-common-pile-arxiv-abstracts-scientific:
    if: >-
      github.event_name == 'pull_request' &&
      github.head_ref == 'd03/common-pile-arxiv-abstracts-bounded-20260907'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11.16"
      - name: Bind exact execution head
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
      - name: Focused source-intake tests
        run: |
          python -m pip install -e .[dev]
          python -m pytest -q tests/test_d03_common_pile_arxiv_abstracts_v1.py
          ruff check \
            tools/materialize_d03_common_pile_arxiv_abstracts_v1.py \
            tests/test_d03_common_pile_arxiv_abstracts_v1.py
      - name: Exact source fetch and deterministic double materialization
        run: |
          set -euo pipefail
          SHARD="$RUNNER_TEMP/00003_arxiv-abstracts.jsonl.gz"
          mkdir -p "$RUNNER_TEMP/arxiv-a" "$RUNNER_TEMP/arxiv-b"
          python tools/materialize_d03_common_pile_arxiv_abstracts_v1.py \
            --shard "$SHARD" \
            --download \
            --output-jsonl "$RUNNER_TEMP/arxiv-a/candidate.jsonl" \
            --report "$RUNNER_TEMP/arxiv-a/report.json"
          python tools/materialize_d03_common_pile_arxiv_abstracts_v1.py \
            --shard "$SHARD" \
            --output-jsonl "$RUNNER_TEMP/arxiv-b/candidate.jsonl" \
            --report "$RUNNER_TEMP/arxiv-b/report.json"
          cmp "$RUNNER_TEMP/arxiv-a/candidate.jsonl" "$RUNNER_TEMP/arxiv-b/candidate.jsonl"
          cmp "$RUNNER_TEMP/arxiv-a/report.json" "$RUNNER_TEMP/arxiv-b/report.json"
          sha256sum \
            "$RUNNER_TEMP/arxiv-a/candidate.jsonl" \
            "$RUNNER_TEMP/arxiv-a/report.json" \
            > "$RUNNER_TEMP/arxiv-a/execution-digests.txt"
      - name: Assert bounded zero-authority evidence
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          report = json.loads(
              (Path(os.environ["RUNNER_TEMP"]) / "arxiv-a/report.json").read_text()
          )
          assert report["retained_records"] > 0
          assert report["retained_normalized_bytes"] <= 4_900_000
          assert report["training_authorized_bytes"] == 0
          assert report["canonical_capacity_credited"] == 0
          assert report["family_credit_added"] == 0
          assert report["unique_causal_loss_positions_authorized"] == 0
          assert report["tokenizer_fit_authorized"] is False
          assert report["model_training_executed"] is False
          assert report["final_test_accessed"] is False
          assert report["paid_compute_used"] is False
          assert report["universal_pii_absence_claimed"] is False
          PY
      - name: Remove raw and text-bearing candidate before artifact retention
        run: |
          rm -f "$RUNNER_TEMP/00003_arxiv-abstracts.jsonl.gz"
          rm -f "$RUNNER_TEMP/arxiv-a/candidate.jsonl" "$RUNNER_TEMP/arxiv-b/candidate.jsonl"
          test ! -e "$RUNNER_TEMP/00003_arxiv-abstracts.jsonl.gz"
          test ! -e "$RUNNER_TEMP/arxiv-a/candidate.jsonl"
          test ! -e "$RUNNER_TEMP/arxiv-b/candidate.jsonl"
      - name: Upload text-free source evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: d03-common-pile-arxiv-abstracts-${{ github.event.pull_request.head.sha }}
          path: |
            ${{ runner.temp }}/arxiv-a/report.json
            ${{ runner.temp }}/arxiv-a/execution-digests.txt
          if-no-files-found: error
          retention-days: 30
