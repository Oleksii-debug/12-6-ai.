          python -I - <<'PY'
          from __future__ import annotations

          import hashlib
          import json
          import math
          import os
          from pathlib import Path

          def reject_pairs(pairs):
              result = {}
              for key, value in pairs:
                  if key in result:
                      raise ValueError(f"duplicate JSON key: {key}")
                  result[key] = value
              return result

          def finite_float(token: str) -> float:
              value = float(token)
              if not math.isfinite(value):
                  raise ValueError(f"non-finite JSON number: {token}")
              return value

          def load(path: str) -> dict:
              value = json.loads(
                  Path(path).read_text(encoding="utf-8"),
                  object_pairs_hook=reject_pairs,
                  parse_float=finite_float,
                  parse_constant=lambda token: (_ for _ in ()).throw(
                      ValueError(f"non-finite JSON constant: {token}")
                  ),
              )
              assert type(value) is dict, path
              return value

          def sha256(payload: bytes) -> str:
              return hashlib.sha256(payload).hexdigest()

          def canonical(value: dict, *, ascii_only: bool = False, newline: bool = False) -> bytes:
              raw = json.dumps(
                  value,
                  ensure_ascii=ascii_only,
                  sort_keys=True,
                  separators=(",", ":"),
                  allow_nan=False,
              ).encode("utf-8")
              return raw + (b"\n" if newline else b"")

          def verify_self_hash(
              value: dict,
              field: str,
              *,
              ascii_only: bool = False,
              newline: bool = False,
          ) -> None:
              identity = value.get(field)
              assert (
                  type(identity) is str
                  and len(identity) == 64
                  and all(char in "0123456789abcdef" for char in identity)
              ), field
              core = dict(value)
              core.pop(field)
              assert identity == sha256(
                  canonical(core, ascii_only=ascii_only, newline=newline)
              ), field

          discoveries = [
              load(str(Path(os.environ["P1_DIR"]) / "nbu-discovery-evidence.json")),
              load(str(Path(os.environ["P2_DIR"]) / "nbu-discovery-evidence.json")),
          ]
          pins = [
              load(str(Path(os.environ["P1_DIR"]) / "nbu-pdf-pin-evidence.json")),
              load(str(Path(os.environ["P2_DIR"]) / "nbu-pdf-pin-evidence.json")),
          ]
          reports = [
              load(str(Path(os.environ["P1_DIR"]) / "global-dedup-report.json")),
              load(str(Path(os.environ["P2_DIR"]) / "global-dedup-report.json")),
          ]
          survivors = [
              load(str(Path(os.environ["P1_DIR"]) / "survivor-authority.json")),
              load(str(Path(os.environ["P2_DIR"]) / "survivor-authority.json")),
          ]
          executions = [
              load(str(Path(os.environ["P1_DIR"]) / "execution-evidence.json")),
              load(str(Path(os.environ["P2_DIR"]) / "execution-evidence.json")),
          ]
          pass_summaries = [
              load(str(Path(os.environ["P1_DIR"]) / "physical-pass-summary.json")),
              load(str(Path(os.environ["P2_DIR"]) / "physical-pass-summary.json")),
          ]
          texts = [
              load(str(Path(os.environ["P1_DIR"]) / "nbu-text-evidence-a.json")),
              load(str(Path(os.environ["P2_DIR"]) / "nbu-text-evidence-a.json")),
          ]

          for discovery in discoveries:
              verify_self_hash(discovery, "evidence_identity_sha256", newline=True)
          for pin in pins:
              verify_self_hash(pin, "evidence_identity_sha256", newline=True)
          for text in texts:
              verify_self_hash(text, "evidence_identity_sha256", newline=True)
          for report in reports:
              verify_self_hash(report, "report_sha256", ascii_only=True, newline=True)
          for survivor in survivors:
              verify_self_hash(survivor, "survivor_authority_sha256")
          for execution in executions:
              verify_self_hash(execution, "evidence_identity_sha256")
          for pass_summary in pass_summaries:
              verify_self_hash(pass_summary, "summary_identity_sha256")

          assert reports[0]["report_sha256"] == reports[1]["report_sha256"]
