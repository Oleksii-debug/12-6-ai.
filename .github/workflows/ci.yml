name: CI
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  actions: read
  contents: read

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -e .[dev]
      - name: Enforce shared CI workflow budget
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: python -m twelve_six.ci_workflow_policy --base "$BASE_SHA" --head "$HEAD_SHA"
      - name: Checkout frozen Plan 8 Section 3 PR head
        if: github.event_name == 'pull_request' && (github.event.pull_request.number == 3096 || github.event.pull_request.number == 3207)
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
          fetch-depth: 0
      - name: Plan 8 Section 3 exact-head AI-QA scoped qualification
        if: github.event_name == 'pull_request' && github.event.pull_request.number == 3096
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
          PYTHONPATH: src
          TWELVE_SIX_EXECUTION_PROFILE: LOCAL_FREE
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          git diff --quiet HEAD --
          git diff --cached --quiet HEAD --
          python -m ruff check src/twelve_six/ai_qa_control.py src/twelve_six/sil_qualification.py src/twelve_six/capability_map.py tests/test_ai_qa_control_section4.py tests/test_sil_qualification_section3.py tests/test_capability_map_section2.py
          python -m pytest -q tests/test_ai_qa_control_section4.py tests/test_sil_qualification_section3.py tests/test_capability_map_section2.py
      - name: Plan 8 Section 3 recovery exact-head qualification
        if: github.event_name == 'pull_request' && github.event.pull_request.number == 3207
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
          PYTHONPATH: src
          TWELVE_SIX_EXECUTION_PROFILE: LOCAL_FREE
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          git diff --quiet HEAD --
          git diff --cached --quiet HEAD --
          python -m ruff check src/twelve_six/ai_qa_control.py src/twelve_six/sil_qualification.py src/twelve_six/capability_map.py tools/validate_section2_repository_surface_coverage.py tests/test_ai_qa_control_section4.py tests/test_sil_qualification_section3.py tests/test_capability_map_section2.py tests/test_repository_surface_inventory_section2.py
          python tools/validate_section2_repository_surface_coverage.py
          python -m pytest -q tests/test_ai_qa_control_section4.py tests/test_sil_qualification_section3.py tests/test_capability_map_section2.py tests/test_repository_surface_inventory_section2.py
      - name: Plan 7 S12 LOCAL_FREE exact-head component qualification
        if: github.event_name == 'pull_request' && github.head_ref == 'plan7/s12-terminal-scaling-qualification-20261008'
        run: |
          python -m ruff check tests/test_plan7_terminal_scaling_qualification.py
          python -m pytest -q tests/test_plan7_*.py
      - name: Plan 1 Section 3 exact-head scoped qualification
        if: github.event_name == 'pull_request' && github.event.pull_request.number == 3103
        run: |
          ruff check src/twelve_six/third_party_reuse.py tests/test_plan1_section3_reuse.py tools/plan1_dependency_inventory.py tests/test_plan1_dependency_inventory.py
          pytest -q tests/test_plan1_section3_reuse.py tests/test_plan1_dependency_inventory.py
      - name: Plan 1 Section 5 contract and fixture qualification
        if: github.event_name == 'pull_request' && github.event.pull_request.number == 3202
        run: |
          python -m ruff check src/twelve_six/integration/dependency_security.py src/twelve_six/integration/release_fixture.py tests/test_dependency_security.py tests/test_plan1_section5_release_fixture.py tests/test_plan1_section5_notices.py
          python -m pytest -q tests/test_dependency_security.py tests/test_plan1_section5_release_fixture.py tests/test_plan1_section5_notices.py tests/test_dependency_lock.py
      - name: Plan 1 Section 8 exact PR-head checkout
        if: github.event_name == 'pull_request' && github.head_ref == 'plan1/section8-terminal-foundation-20261008-gpt6'
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
          fetch-depth: 1
      - name: Plan 1 Section 8 LOCAL_FREE exact-head foundation qualification
        if: github.event_name == 'pull_request' && github.head_ref == 'plan1/section8-terminal-foundation-20261008-gpt6'
        env:
          PLAN1_S8_EXPECTED_SHA: ${{ github.event.pull_request.head.sha }}
        run: python tools/plan1_section8_qualify.py
      - run: ruff check src tests
      - run: pytest -q
      - name: "#1801 — execute EVAL-647 overlap on exact retained corpus"
        if: github.event_name == 'pull_request' && github.head_ref == 'd06/eval647-code-selection-1640'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          export EVAL647_REAL_PYTHON="$(command -v python)"
          export PATH="$GITHUB_WORKSPACE/tools/eval647_transport_bin:$PATH"
          bash tools/run_eval647_real_overlap_ci_v1.sh
      - name: "#1801 — upload hash-only EVAL-647 overlap evidence"
        if: always() && github.event_name == 'pull_request' && github.head_ref == 'd06/eval647-code-selection-1640'
        uses: actions/upload-artifact@v4
        with:
          name: eval647-current-corpus-overlap-${{ github.event.pull_request.head.sha }}
          if-no-files-found: error
          retention-days: 90
          path: artifacts/eval647/current_corpus_overlap_v1.json

  d03-current-clean-physical:
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.number == 2211 &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.head_ref == 'd03/2023-clean-current-main-execution-2210'
    needs: bootstrap
    env:
      D03_EXECUTION_SHA: ${{ github.event.pull_request.head.sha }}
      PYTHONPATH: src
      TWELVE_SIX_EXECUTION_PROFILE: LOCAL_FREE
      CLEAN_ARTIFACT_ID: "10820342689"
      CLEAN_ARTIFACT_ZIP_SHA256: "99069ce2183abbbc374749cca5c538efa259df0c64658a9b88cc96b25c0fbba0"
      CLEAN_RECORDS_SHA256: "bbeb43b3b8e3e4b0e2631c16895d700896f3733d6cd6fe3833fe678594bc86d8"
      CLEAN_INVENTORY_SHA256: "3804a43eba5e0bfa6ce2568782cb03bf681e53a68808742874cf89139488c69e"
      CLEAN_EVIDENCE_SHA256: "877b6233738e0ca6593acbbf9922f5f178ec8456bf101b95f2f4a300805509e4"
      CLEAN_PROOF_SHA256: "16260584c5c2bb7d8eab7a16e1b5260300e9cd2b67e9110282287e619013078f"
      EXPECTED_TRAINING_RECORDS_SHA256: "3458afe0380ea45d328ad3f004b21845a188ca69f2f7a83c24999e9e53268e53"
      EXPECTED_TRAINING_HANDOFF_SHA256: "80bcf2dd28f0d13795ceea01b358c7149b636f55f17b29575d14313b5cee99ee"
      EXPECTED_INVENTORY_ID: "7061d74db13bf45a9a7a1266ebe50feab8e7d22c32fba7a81dd91c2be4135ade"
      EXPECTED_SURVIVOR_AUTHORITY: "1b3adfffab2a9d65af78e88b805ef221714a0cc94fca4055105665a6a155ce95"
      EXPECTED_SELECTION_ID: "7b97a9ab04469236dc5bc17fc80155cb43430b01c443bb6209fac090557258fd"
      EXPECTED_FINAL_ID: "86d51eb106524cd8e4d0f94d4ff6e2e3426c6321e0698279877dfc4d5fce3116"
      EXPECTED_EVAL647_EVIDENCE_ID: "3401db10bad35fd1c6fac2839413fc6afffac58fa5f2135d2202b944bc2fda82"
      EXPECTED_EVAL647_OBJECT_SET_ID: "0557410622403b411ac9d6d8fb01a57ef461617c19d06f112aa61dd57f670048"
      EVAL290_HEAD_SHA: "029514654829cebc149cff6fc1fea2a8ba4fa566"
      EVAL290_DATA_SHA256: "5400e37b8e8ddfdb9516a8b6eaa6fc01a8c5ec41811385d9f6907e6ef6d9614f"
      EVAL290_MANIFEST_SHA256: "d0f8cf208724c80bda7b92aed54e10bea1492fa5bb3511a7e0fd828fc881e14a"
      EVAL291_HEAD_SHA: "fb268061300127b62cc2a262664b30c614559dac"
      EVAL291_DATA_SHA256: "df20e3d3ec75208399039a283487c3b8958c80ec3f119cee278fcc09948c6bfb"
      EVAL291_AUTHORITY_SHA256: "493be56b8189325d122868ca778733676cc2143d24d121fb63f6b1b62a977177"
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.11.16"

      - name: Bind exact execution checkout
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$D03_EXECUTION_SHA"
          git diff --quiet HEAD --
          git diff --cached --quiet HEAD --
          python -m py_compile             tools/prepare_data232_ephemeral_handoff_v1.py             tools/execute_current_clean_composition_v1.py             src/twelve_six/data/current_clean_execution_v1.py

      - name: Fetch independently qualified clean physical artifact
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/clean"
          mkdir -p "$work/artifact"
          curl --fail --location --retry 5 --retry-all-errors             -H "Authorization: Bearer $GH_TOKEN"             -H "Accept: application/vnd.github+json"             -H "X-GitHub-Api-Version: 2022-11-28"             -o "$work/clean.zip"             "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${CLEAN_ARTIFACT_ID}/zip"
          test "$(sha256sum "$work/clean.zip" | cut -d' ' -f1)" = "$CLEAN_ARTIFACT_ZIP_SHA256"
          unzip -q "$work/clean.zip" -d "$work/artifact"
          test "$(sha256sum "$work/artifact/records.jsonl" | cut -d' ' -f1)" = "$CLEAN_RECORDS_SHA256"
          test "$(sha256sum "$work/artifact/inventory.json" | cut -d' ' -f1)" = "$CLEAN_INVENTORY_SHA256"
          test "$(sha256sum "$work/artifact/evidence.json" | cut -d' ' -f1)" = "$CLEAN_EVIDENCE_SHA256"
          test "$(sha256sum "$work/artifact/proof.json" | cut -d' ' -f1)" = "$CLEAN_PROOF_SHA256"
          test "$(wc -l < "$work/artifact/records.jsonl" | tr -d ' ')" = "257"

      - name: Rebuild exact DATA-232 clean handoff
        shell: bash
        run: |
          set -euo pipefail
          python tools/prepare_data232_ephemeral_handoff_v1.py             --repo-root .             --records-jsonl "$RUNNER_TEMP/clean/artifact/records.jsonl"             --record-inventory-json "$RUNNER_TEMP/clean/artifact/inventory.json"             --materialization-evidence-json "$RUNNER_TEMP/clean/artifact/evidence.json"             --output-dir "$RUNNER_TEMP/handoff"             --expected-carrier-git-sha "$D03_EXECUTION_SHA"
          test "$(sha256sum "$RUNNER_TEMP/handoff/training_records.jsonl" | cut -d' ' -f1)" = "$EXPECTED_TRAINING_RECORDS_SHA256"
          test "$(sha256sum "$RUNNER_TEMP/handoff/training_handoff.json" | cut -d' ' -f1)" = "$EXPECTED_TRAINING_HANDOFF_SHA256"

      - name: Reconstruct immutable selection-validation payloads from exact heads
        shell: bash
        run: |
          set -euo pipefail
          eval290_src="$RUNNER_TEMP/eval290-src"
          eval290_out_a="$RUNNER_TEMP/eval290-out-a"
          eval290_out_b="$RUNNER_TEMP/eval290-out-b"
          eval290_lock="$RUNNER_TEMP/eval290-extra.lock.txt"
          eval290_venv="$RUNNER_TEMP/eval290-venv"
          eval290_environment="$RUNNER_TEMP/eval290-environment.json"
          eval291_src="$RUNNER_TEMP/eval291-src"
          eval291_venv="$RUNNER_TEMP/eval291-venv"
          eval291_environment="$RUNNER_TEMP/eval291-environment.json"
          rm -rf "$eval290_src" "$eval290_out_a" "$eval290_out_b" "$eval291_src" "$eval290_venv" "$eval291_venv"
          rm -f "$eval290_environment" "$eval291_environment"

          # Historical Actions artifacts were retention-bounded. Recover authority
          # from immutable Git roots instead of weakening to a newer/unbound payload.
          git fetch --no-tags origin refs/pull/402/head
          test "$(git rev-parse FETCH_HEAD)" = "$EVAL290_HEAD_SHA"
          git worktree add --detach "$eval290_src" "$EVAL290_HEAD_SHA"
          test "$(git -C "$eval290_src" rev-parse HEAD)" = "$EVAL290_HEAD_SHA"
          git -C "$eval290_src" diff --quiet HEAD --
          git -C "$eval290_src" diff --cached --quiet HEAD --

          # Reproduce the frozen producer environment before installing its EVAL290 extra.
          python "$eval290_src/tools/execution_bootstrap.py" bootstrap \
            --repo-root "$eval290_src" \
            --capabilities "runtime,tests" \
            --venv "$eval290_venv" \
            --manifest "$eval290_environment" \
            --command "python -m pytest -q tests/test_eval290_ua_selection.py"

          git -C "$eval290_src" show             "$EVAL290_HEAD_SHA:requirements/locks/linux-x86_64/eval290-extra.lock.txt"             > "$eval290_lock"
          "$eval290_venv/bin/python" -m pip install             --disable-pip-version-check             --require-hashes             --no-deps             -r "$eval290_lock"
          "$eval290_venv/bin/python" -c 'import numpy, pyarrow; assert numpy.__version__ == "2.4.6"; assert pyarrow.__version__ == "25.0.1"'
          for out in "$eval290_out_a" "$eval290_out_b"; do
            PYTHONPATH="$eval290_src/src" "$eval290_venv/bin/python" -m twelve_six.eval290_ua_selection               build --repo-root "$eval290_src" --output-dir "$out"
          done
          diff -ru "$eval290_out_a" "$eval290_out_b"
          PYTHONPATH="$eval290_src/src" "$eval290_venv/bin/python" -m twelve_six.eval290_ua_selection             verify --repo-root "$eval290_src" --output-dir "$eval290_out_a"
          test "$(sha256sum "$eval290_out_a/eval290_ua_selection_validation_v1.jsonl" | cut -d' ' -f1)" = "$EVAL290_DATA_SHA256"
          test "$(sha256sum "$eval290_out_a/eval290_ua_selection_validation_manifest_v1.json" | cut -d' ' -f1)" = "$EVAL290_MANIFEST_SHA256"

          git fetch --no-tags origin refs/pull/395/head
          test "$(git rev-parse FETCH_HEAD)" = "$EVAL291_HEAD_SHA"
          git worktree add --detach "$eval291_src" "$EVAL291_HEAD_SHA"
          test "$(git -C "$eval291_src" rev-parse HEAD)" = "$EVAL291_HEAD_SHA"
          git -C "$eval291_src" diff --quiet HEAD --
          git -C "$eval291_src" diff --cached --quiet HEAD --

          # Reproduce EVAL291's own frozen producer runtime. Do not rely on
          # packages incidentally installed in the outer CI interpreter.
          python "$eval291_src/tools/execution_bootstrap.py" bootstrap \
            --repo-root "$eval291_src" \
            --capabilities "runtime,tests" \
            --venv "$eval291_venv" \
            --manifest "$eval291_environment" \
            --command "python -m pytest -q tests/test_eval291_en_selection_validation.py"

          cp "$eval291_src/data/evaluation/eval291/selection-validation/en.jsonl"             "$RUNNER_TEMP/eval291-en.jsonl"
          cp "$eval291_src/evidence/eval291/en-selection-validation-v1-authority.json"             "$RUNNER_TEMP/eval291-authority.json"
          test "$(sha256sum "$RUNNER_TEMP/eval291-en.jsonl" | cut -d' ' -f1)" = "$EVAL291_DATA_SHA256"
          test "$(sha256sum "$RUNNER_TEMP/eval291-authority.json" | cut -d' ' -f1)" = "$EVAL291_AUTHORITY_SHA256"
          PYTHONPATH="$eval291_src/src" "$eval291_venv/bin/python" -m twelve_six.eval291_en_selection_validation             build --repo-root "$eval291_src"
          cmp "$RUNNER_TEMP/eval291-en.jsonl"             "$eval291_src/data/evaluation/eval291/selection-validation/en.jsonl"
          cmp "$RUNNER_TEMP/eval291-authority.json"             "$eval291_src/evidence/eval291/en-selection-validation-v1-authority.json"
          PYTHONPATH="$eval291_src/src" "$eval291_venv/bin/python" -m twelve_six.eval291_en_selection_validation             verify --repo-root "$eval291_src"

      - name: Build complete ephemeral reserved-evaluation universe
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib
          import importlib.util
          import json
          import os
          from pathlib import Path

          from twelve_six.data.current_reserved_decontamination_v1 import (
              build_reserved_payload_binding,
          )
          from twelve_six.data.eval233_final_test_resolver_v1 import (
              DATA232_FINAL_TEST_ID,
              resolve_eval233_final_test,
          )
          from twelve_six.data.eval303_selection_payload_resolver_v1 import (
              EVAL303_SELECTION_ID,
              resolve_eval303_selection_payloads_from_reconstructed,
          )
          from twelve_six.data.eval647_future_training_exclusion_v1 import (
              build_eval647_auxiliary_reserved_set,
              compose_eval647_future_training_exclusion,
          )

          root = Path(os.environ["GITHUB_WORKSPACE"])
          tmp = Path(os.environ["RUNNER_TEMP"])

          def canonical(value):
              return json.dumps(
                  value,
                  ensure_ascii=False,
                  sort_keys=True,
                  separators=(",", ":"),
              ).encode("utf-8")

          def write_json(path, value):
              Path(path).write_bytes(canonical(value) + b"\n")

          def write_jsonl(path, rows):
              Path(path).write_bytes(b"".join(canonical(row) + b"\n" for row in rows))

          selection_rows, selection_set, selection_evidence = (
              resolve_eval303_selection_payloads_from_reconstructed(
                  eval290_data_jsonl=(
                      tmp / "eval290-out-a/eval290_ua_selection_validation_v1.jsonl"
                  ),
                  eval290_manifest_json=(
                      tmp / "eval290-out-a/eval290_ua_selection_validation_manifest_v1.json"
                  ),
                  eval291_data_jsonl=tmp / "eval291-en.jsonl",
                  eval291_authority_json=tmp / "eval291-authority.json",
                  eval303_membership_jsonl=(
                      root
                      / "data/evaluation/eval303/selection-validation/composite-membership.jsonl"
                  ),
              )
          )
          resolver_identity = selection_evidence.get("resolver_identity_sha256")
          if not isinstance(resolver_identity, str) or len(resolver_identity) != 64:
              raise RuntimeError("EVAL-303 resolver identity malformed")
          final_rows, final_set, _ = resolve_eval233_final_test(root)
          if EVAL303_SELECTION_ID != os.environ["EXPECTED_SELECTION_ID"]:
              raise RuntimeError("selection identity drift")
          if DATA232_FINAL_TEST_ID != os.environ["EXPECTED_FINAL_ID"]:
              raise RuntimeError("final-test identity drift")

          manifest = json.loads(
              (root / "configs/evaluation/eval_code_reserve_v1.json").read_text(
                  encoding="utf-8"
              )
          )
          evidence = json.loads(
              (root / "evidence/eval647/code_selection_source_materialization_v1.json").read_text(
                  encoding="utf-8"
              )
          )
          if evidence["evidence_identity_sha256"] != os.environ["EXPECTED_EVAL647_EVIDENCE_ID"]:
              raise RuntimeError("EVAL-647 evidence identity drift")
          if evidence["object_set_identity_sha256"] != os.environ["EXPECTED_EVAL647_OBJECT_SET_ID"]:
              raise RuntimeError("EVAL-647 object-set identity drift")

          spec = importlib.util.spec_from_file_location(
              "eval647_source_materializer",
              root / "tools/materialize_eval_code_reserve_v1.py",
          )
          if spec is None or spec.loader is None:
              raise RuntimeError("cannot load EVAL-647 materializer")
          materializer = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(materializer)
          observed = materializer.materialize(manifest, timeout=60)
          if observed["object_set_identity_sha256"] != os.environ["EXPECTED_EVAL647_OBJECT_SET_ID"]:
              raise RuntimeError("fresh EVAL-647 materialization membership drift")

          auxiliary = build_eval647_auxiliary_reserved_set(manifest, evidence)
          member_by_source = {
              member["source_id"]: member for member in auxiliary["members"]
          }
          eval647_rows = []
          for obj in manifest["objects"]:
              payload = materializer._fetch(materializer._raw_url(obj), 60)
              if len(payload) != obj["expected_raw_bytes"]:
                  raise RuntimeError("EVAL-647 raw byte count drift")
              if hashlib.sha256(payload).hexdigest() != obj["raw_sha256"]:
                  raise RuntimeError("EVAL-647 raw SHA drift")
              source_id = f"{obj['repository']}@{obj['revision']}:{obj['path']}"
              member = member_by_source[source_id]
              if member["content_sha256"] != obj["raw_sha256"]:
                  raise RuntimeError("EVAL-647 member/content binding drift")
              eval647_rows.append(
                  {
                      "record_id": member["record_id"],
                      "source_id": member["source_id"],
                      "source_family": member["source_family"],
                      "modality": "code",
                      "text": payload.decode("utf-8", errors="strict"),
                  }
              )

          base_binding = build_reserved_payload_binding([selection_set, final_set])
          composed, _ = compose_eval647_future_training_exclusion(
              base_binding,
              manifest,
              evidence,
          )
          expected_members = sum(
              len(item["members"]) for item in composed["reserved_sets"]
          )
          evaluation_rows = [*selection_rows, *final_rows, *eval647_rows]
          if len(evaluation_rows) != expected_members:
              raise RuntimeError("reserved evaluation payload coverage drift")

          handoff = json.loads(
              (tmp / "handoff/training_handoff.json").read_text(encoding="utf-8")
          )
          if handoff["postdedup_inventory_identity_sha256"] != os.environ["EXPECTED_INVENTORY_ID"]:
              raise RuntimeError("clean inventory identity drift")
          if handoff["input_survivor_authority_sha256"] != os.environ["EXPECTED_SURVIVOR_AUTHORITY"]:
              raise RuntimeError("clean survivor authority drift")

          write_json(tmp / "base_reserved_binding.json", base_binding)
          write_jsonl(tmp / "evaluation_records.jsonl", evaluation_rows)
          with (tmp / "execution.env").open("w", encoding="utf-8") as out:
              values = {
                  "BASE_BINDING_ID": base_binding["binding_identity_sha256"],
                  "COMPOSED_BINDING_ID": composed["binding_identity_sha256"],
                  "TRAINING_HANDOFF_ID": handoff["handoff_identity_sha256"],
              }
              for key, value in values.items():
                  if not isinstance(value, str) or len(value) != 64:
                      raise RuntimeError(f"invalid derived identity: {key}")
                  out.write(f"{key}={value}\n")
          print(json.dumps({
              "base_binding_identity_sha256": base_binding["binding_identity_sha256"],
              "composed_binding_identity_sha256": composed["binding_identity_sha256"],
              "training_handoff_identity_sha256": handoff["handoff_identity_sha256"],
              "evaluation_records": len(evaluation_rows),
          }, sort_keys=True))
          PY
          cat "$RUNNER_TEMP/execution.env" >> "$GITHUB_ENV"

      - name: Execute current clean composition twice
        shell: bash
        run: |
          set -euo pipefail
          run_once() {
            out="$1"
            python tools/execute_current_clean_composition_v1.py               --repo-root .               --expected-carrier-git-sha "$D03_EXECUTION_SHA"               --training-records-jsonl "$RUNNER_TEMP/handoff/training_records.jsonl"               --training-handoff-json "$RUNNER_TEMP/handoff/training_handoff.json"               --evaluation-records-jsonl "$RUNNER_TEMP/evaluation_records.jsonl"               --base-reserved-binding-json "$RUNNER_TEMP/base_reserved_binding.json"               --eval647-manifest-json configs/evaluation/eval_code_reserve_v1.json               --eval647-materialization-evidence-json evidence/eval647/code_selection_source_materialization_v1.json               --expected-base-reserved-binding-identity-sha256 "$BASE_BINDING_ID"               --expected-composed-reserved-binding-identity-sha256 "$COMPOSED_BINDING_ID"               --expected-eval647-materialization-evidence-identity-sha256 "$EXPECTED_EVAL647_EVIDENCE_ID"               --expected-eval647-object-set-identity-sha256 "$EXPECTED_EVAL647_OBJECT_SET_ID"               --expected-inventory-identity-sha256 "$EXPECTED_INVENTORY_ID"               --expected-survivor-authority-sha256 "$EXPECTED_SURVIVOR_AUTHORITY"               --expected-training-handoff-identity-sha256 "$TRAINING_HANDOFF_ID"               --expected-selection-validation-identity-sha256 "$EXPECTED_SELECTION_ID"               --expected-final-test-identity-sha256 "$EXPECTED_FINAL_ID"               --output-dir "$out"
          }
          run_once "$RUNNER_TEMP/output-a"
          run_once "$RUNNER_TEMP/output-b"
          diff -qr "$RUNNER_TEMP/output-a" "$RUNNER_TEMP/output-b"

      - name: Qualify zero-credit physical result and build repeat proof
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          tmp = Path(os.environ["RUNNER_TEMP"])
          a = tmp / "output-a"
          b = tmp / "output-b"

          def load(name):
              return json.loads((a / name).read_text(encoding="utf-8"))

          composition = load("composition_receipt.json")
          inventory = load("survivor_inventory.json")
          survivor = (a / "survivor_records.jsonl").read_bytes()
          if hashlib.sha256(survivor).hexdigest() != composition["survivor_jsonl_sha256"]:
              raise RuntimeError("physical survivor JSONL identity mismatch")
          if inventory["record_count"] != composition["survivor_records"]:
              raise RuntimeError("survivor count mismatch")
          if inventory["total_payload_bytes"] != composition["survivor_payload_bytes"]:
              raise RuntimeError("survivor byte count mismatch")
          for key in (
              "current_corpus_launch_authority_promoted",
              "tokenizer_fit_authorized",
              "training_executed",
              "learned_weights_created",
              "final_test_outcomes_read",
              "paid_compute_used",
              "foreign_pretrained_weights",
          ):
              if composition.get(key) is not False:
                  raise RuntimeError(f"scientific boundary widened: {key}")
          if (
              type(composition.get("authorized_optimized_target_exposure")) is not int
              or composition.get("authorized_optimized_target_exposure") != 0
          ):
              raise RuntimeError("optimized target exposure widened")
          if (
              type(composition.get("optimizer_updates_executed_on_real_targets")) is not int
              or composition.get("optimizer_updates_executed_on_real_targets") != 0
          ):
              raise RuntimeError("optimizer execution widened")
          if composition.get("terminal_post_g05_g06_authority") is not False:
              raise RuntimeError("independent qualification was bypassed")
          if composition.get("independent_qualification_required") is not True:
              raise RuntimeError("independent qualification requirement erased")

          files = sorted(p.name for p in a.iterdir() if p.is_file())
          roots = {
              name: hashlib.sha256((a / name).read_bytes()).hexdigest()
              for name in files
          }
          repeat_roots = {
              name: hashlib.sha256((b / name).read_bytes()).hexdigest()
              for name in files
          }
          if roots != repeat_roots:
              raise RuntimeError("two fresh executions are not byte-identical")
          proof = {
              "schema_version": "12-6.d03-current-clean-composition-physical-repeat.v1",
              "status": "PHYSICAL_EXECUTION_COMPLETE_PENDING_INDEPENDENT_QUALIFICATION",
              "execution_head_sha": os.environ["D03_EXECUTION_SHA"],
              "execution_profile": "LOCAL_FREE",
              "output_files_sha256": roots,
              "survivor_jsonl_sha256": composition["survivor_jsonl_sha256"],
              "survivor_record_inventory_digest_sha256": composition[
                  "survivor_record_inventory_digest_sha256"
              ],
              "survivor_payload_inventory_digest_sha256": composition[
                  "survivor_payload_inventory_digest_sha256"
              ],
              "survivor_records": composition["survivor_records"],
              "survivor_payload_bytes": composition["survivor_payload_bytes"],
              "two_fresh_executions_byte_identical": True,
              "terminal_post_g05_g06_authority": False,
              "independent_qualification_required": True,
              "authorized_optimized_target_exposure": 0,
              "tokenizer_fit_authorized": False,
              "optimizer_updates_executed_on_real_targets": 0,
              "training_executed": False,
              "learned_weights_created": False,
              "final_test_outcomes_read": False,
              "paid_compute_used": False,
              "foreign_pretrained_weights": False,
          }
          raw = json.dumps(
              proof,
              ensure_ascii=False,
              sort_keys=True,
              separators=(",", ":"),
          ).encode("utf-8")
          proof["proof_identity_sha256"] = hashlib.sha256(raw).hexdigest()
          (a / "repeat_proof.json").write_text(
              json.dumps(proof, sort_keys=True, separators=(",", ":")) + "\n",
              encoding="utf-8",
          )
          print(json.dumps(proof, sort_keys=True))
          PY

      - name: Upload physical survivor and hash-only evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: d03-2023-current-clean-physical-${{ github.event.pull_request.head.sha }}
          path: ${{ runner.temp }}/output-a
          if-no-files-found: error
          retention-days: 90

  d03-rada-fresh-snapshot-v2:
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.head_ref == 'swarm/2477-rada-laws-fresh-snapshot-v2'
    needs: bootstrap
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      RADA_CAPTURE_SHA: ${{ github.event.pull_request.head.sha }}
      PYTHONPATH: src
      TWELVE_SIX_EXECUTION_PROFILE: LOCAL_FREE
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.11.16"

      - name: Bind exact Rada fresh-snapshot checkout
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$RADA_CAPTURE_SHA"
          git diff --quiet HEAD --
          git diff --cached --quiet HEAD --
          python -m py_compile \
            tools/probe_d03_rada_bulk_source.py \
            tools/qualify_d03_rada_bulk_fresh_snapshot_v2.py \
            tools/pin_d03_rada_bulk_fresh_snapshot_v2.py

      - name: Probe current Rada archive — clean run A
        shell: bash
        run: |
          set -euo pipefail
          python tools/probe_d03_rada_bulk_source.py \
            --config configs/data/d03_rada_bulk_source_probe_v1.json \
            --accept-current-upstream \
            --archive-output "$RUNNER_TEMP/rada-source-a.zip" \
            --output "$RUNNER_TEMP/rada-probe-a.json"

      - name: Probe current Rada archive — clean run B
        shell: bash
        run: |
          set -euo pipefail
          python tools/probe_d03_rada_bulk_source.py \
            --config configs/data/d03_rada_bulk_source_probe_v1.json \
            --accept-current-upstream \
            --archive-output "$RUNNER_TEMP/rada-source-b.zip" \
            --output "$RUNNER_TEMP/rada-probe-b.json"

      - name: Qualify two-clean exact snapshot and attributed retention
        shell: bash
        run: |
          set -euo pipefail
          python tools/qualify_d03_rada_bulk_fresh_snapshot_v2.py \
            --config configs/data/d03_rada_bulk_fresh_snapshot_v2.json \
            --rights-policy configs/data/d03_rada_bulk_fresh_snapshot_rights_v2.json \
            --probe-a "$RUNNER_TEMP/rada-probe-a.json" \
            --probe-b "$RUNNER_TEMP/rada-probe-b.json" \
            --output "$RUNNER_TEMP/rada-fresh-snapshot-qualification-v2.json" \
            --attribution-output "$RUNNER_TEMP/ATTRIBUTION.txt"
          captured_sha="$(python -c 'import json,sys; print(json.load(open(sys.argv[1]))["archive_sha256"])' "$RUNNER_TEMP/rada-fresh-snapshot-qualification-v2.json")"
          captured_bytes="$(python -c 'import json,sys; print(json.load(open(sys.argv[1]))["archive_bytes"])' "$RUNNER_TEMP/rada-fresh-snapshot-qualification-v2.json")"
          test "$(sha256sum "$RUNNER_TEMP/rada-source-a.zip" | cut -d' ' -f1)" = "$captured_sha"
          test "$(sha256sum "$RUNNER_TEMP/rada-source-b.zip" | cut -d' ' -f1)" = "$captured_sha"
          test "$(stat -c %s "$RUNNER_TEMP/rada-source-a.zip")" = "$captured_bytes"
          test "$(stat -c %s "$RUNNER_TEMP/rada-source-b.zip")" = "$captured_bytes"
          cmp "$RUNNER_TEMP/rada-source-a.zip" "$RUNNER_TEMP/rada-source-b.zip"
          test -s "$RUNNER_TEMP/ATTRIBUTION.txt"

      - name: Verify and pin retained Rada snapshot to exact run
        shell: bash
        run: |
          set -euo pipefail
          python tools/pin_d03_rada_bulk_fresh_snapshot_v2.py \
            --archive "$RUNNER_TEMP/rada-source-a.zip" \
            --probe-report "$RUNNER_TEMP/rada-probe-a.json" \
            --probe-b "$RUNNER_TEMP/rada-probe-b.json" \
            --qualification "$RUNNER_TEMP/rada-fresh-snapshot-qualification-v2.json" \
            --attribution "$RUNNER_TEMP/ATTRIBUTION.txt" \
            --config configs/data/d03_rada_bulk_fresh_snapshot_v2.json \
            --rights-policy configs/data/d03_rada_bulk_fresh_snapshot_rights_v2.json \
            --execution-head-sha "$RADA_CAPTURE_SHA" \
            --output "$RUNNER_TEMP/rada-successor-pin-v2.json"
          test -s "$RUNNER_TEMP/rada-successor-pin-v2.json"

      - name: Upload attributed exact Rada snapshot and qualification evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: d03-rada-fresh-snapshot-v2-${{ github.event.pull_request.head.sha }}
          path: |
            ${{ runner.temp }}/rada-source-a.zip
            ${{ runner.temp }}/ATTRIBUTION.txt
            ${{ runner.temp }}/rada-probe-a.json
            ${{ runner.temp }}/rada-probe-b.json
            ${{ runner.temp }}/rada-fresh-snapshot-qualification-v2.json
            ${{ runner.temp }}/rada-successor-pin-v2.json
          if-no-files-found: error
          retention-days: 90

      - name: Upload Rada probe metadata on qualification failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: d03-rada-fresh-snapshot-failure-${{ github.event.pull_request.head.sha }}
          path: |
            ${{ runner.temp }}/rada-probe-a.json
            ${{ runner.temp }}/rada-probe-b.json
          if-no-files-found: warn
          retention-days: 30

  sil-current-capability-journeys:
    needs: bootstrap
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      SIL_EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.11.16"

      - name: Bind exact SIL checkout
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SIL_EXPECTED_SHA"
          git diff --quiet HEAD --
          git diff --cached --quiet HEAD --

      - name: Reconstruct deterministic SIL environment from pinned lock source
        shell: bash
        env:
          SIL_ENV_LOCK_SOURCE_COMMIT: "029514654829cebc149cff6fc1fea2a8ba4fa566"
        run: |
          set -euo pipefail
          lock_dir="$RUNNER_TEMP/sil-locks"
          venv_dir="$RUNNER_TEMP/sil-venv"
          mkdir -p "$lock_dir"
          git fetch --no-tags origin refs/pull/402/head
          test "$(git rev-parse FETCH_HEAD)" = "$SIL_ENV_LOCK_SOURCE_COMMIT"

          git show "$SIL_ENV_LOCK_SOURCE_COMMIT:requirements/locks/linux-x86_64/toolchain.lock.txt" \
            > "$lock_dir/toolchain.lock.txt"
          git show "$SIL_ENV_LOCK_SOURCE_COMMIT:requirements/execution/linux-x86_64/cpu-runtime.lock.txt" \
            > "$lock_dir/cpu-runtime.lock.txt"
          git show "$SIL_ENV_LOCK_SOURCE_COMMIT:requirements/locks/linux-x86_64/dev.lock.txt" \
            > "$lock_dir/dev.lock.txt"

          test "$(sha256sum "$lock_dir/toolchain.lock.txt" | cut -d' ' -f1)" = \
            "06b3f872e648e0b7f3cc33a92bd8b04709dea5d9a9821df4f2e8141f646cdcf3"
          test "$(sha256sum "$lock_dir/cpu-runtime.lock.txt" | cut -d' ' -f1)" = \
            "03e08dd06ff446651dcc6950d0f433325bb32261d3e2406b34506cd00e1be52a"
          test "$(sha256sum "$lock_dir/dev.lock.txt" | cut -d' ' -f1)" = \
            "1869e05c5eeaf056813df1c99dc63c7e5febb9794351ec640d265f62efaeac28"

          python -m venv "$venv_dir"
          sil_python="$venv_dir/bin/python"
          "$sil_python" -m pip install --disable-pip-version-check \
            --require-hashes --no-deps -r "$lock_dir/toolchain.lock.txt"
          "$sil_python" -m pip install --disable-pip-version-check \
            --require-hashes --no-deps \
            --index-url https://download.pytorch.org/whl/cpu \
            --extra-index-url https://pypi.org/simple \
            -r "$lock_dir/cpu-runtime.lock.txt"
          "$sil_python" -m pip install --disable-pip-version-check \
            --require-hashes --no-deps -r "$lock_dir/dev.lock.txt"
          "$sil_python" -m pip install --disable-pip-version-check \
            --no-deps --no-build-isolation .
          "$sil_python" -m twelve_six.sil_qualification environment-receipt \
            --output "$RUNNER_TEMP/sil-environment.json"

      - name: Execute all currently AVAILABLE capability journeys
        id: sil
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/sil-venv/bin/python" -m twelve_six.sil_qualification run \
            --repo-root . \
            --expected-git-sha "$SIL_EXPECTED_SHA" \
            --capability-registry configs/control/product_capabilities_v1.json \
            --scenario configs/control/sil_scenario_v1.json \
            --environment-receipt "$RUNNER_TEMP/sil-environment.json" \
            --evidence-output "$RUNNER_TEMP/sil-evidence.json" \
            --log-output "$RUNNER_TEMP/sil.log"

      - name: Independently verify SIL evidence and log binding
        if: steps.sil.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/sil-venv/bin/python" -m twelve_six.sil_qualification verify \
            --repo-root . \
            --capability-registry configs/control/product_capabilities_v1.json \
            --scenario configs/control/sil_scenario_v1.json \
            --environment-receipt "$RUNNER_TEMP/sil-environment.json" \
            --evidence "$RUNNER_TEMP/sil-evidence.json" \
            --log "$RUNNER_TEMP/sil.log" \
            --expected-git-sha "$SIL_EXPECTED_SHA"

      - name: Upload exact-head SIL evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: section3-sil-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            ${{ runner.temp }}/sil-environment.json
            ${{ runner.temp }}/sil-evidence.json
            ${{ runner.temp }}/sil.log
          if-no-files-found: warn
          retention-days: 90

      - name: Enforce SIL verdict
        if: always() && steps.sil.outcome != 'success'
        shell: bash
        run: |
          echo "Exact-head SIL execution did not PASS." >&2
          exit 1

