          RUN_DIR="$RUNNER_TEMP/nbu-audited-pin-replay"
          NBU_ROOT="$RUNNER_TEMP/nbu-historical-audited-pin"
          (
            cd "$NBU_ROOT"
            PYTHONPATH="$NBU_ROOT/src" python tools/materialize_d03_ua_nbu_pdftotext_v1.py \
              "$RUN_DIR/historical-artifact/nbu-discovery-evidence.json" \
              "$RUN_DIR/historical-artifact/nbu-pdf-pin-evidence.json" \
              --text-output "$RUN_DIR/nbu-text-a.jsonl" \
              --evidence-output "$RUN_DIR/nbu-text-evidence-a.json"
            PYTHONPATH="$NBU_ROOT/src" python tools/materialize_d03_ua_nbu_pdftotext_v1.py \
              "$RUN_DIR/historical-artifact/nbu-discovery-evidence.json" \
              "$RUN_DIR/historical-artifact/nbu-pdf-pin-evidence.json" \
              --text-output "$RUN_DIR/nbu-text-b.jsonl" \
              --evidence-output "$RUN_DIR/nbu-text-evidence-b.json"
          )
          cmp "$RUN_DIR/nbu-text-a.jsonl" "$RUN_DIR/nbu-text-b.jsonl"
          cmp "$RUN_DIR/nbu-text-evidence-a.json" "$RUN_DIR/nbu-text-evidence-b.json"
          test "$(sha256sum "$RUN_DIR/nbu-text-a.jsonl" | cut -d' ' -f1)" = "$EXPECTED_CANDIDATE_SHA256"

      - name: Execute incumbent indexed global dedup over audited-pin replay
        run: |
          set -euo pipefail
          RUN_DIR="$RUNNER_TEMP/nbu-audited-pin-replay"
          V7_ROOT="$RUNNER_TEMP/v7-audited-pin"
          python tools/run_d03_nbu_global_dedup_execution_v1.py \
            --v7-root "$V7_ROOT" \
            --bulk-workspace "$RUN_DIR/bulk-workspace" \
            --candidate-jsonl "$RUN_DIR/nbu-text-a.jsonl" \
            --materialization-evidence-json "$RUN_DIR/nbu-text-evidence-a.json" \
            --output-report "$RUN_DIR/global-dedup-report.json" \
            --output-survivors "$RUN_DIR/survivor-authority.json" \
            --output-evidence "$RUN_DIR/execution-evidence.json" \
            --expected-execution-head "$HEAD_SHA" \
            --max-candidate-pairs 5000000 \
            --max-index-postings 50000000 \
            --max-pair-expansions 50000000

      - name: Write zero-credit audited-pin replay summary
        run: |
          set -euo pipefail
          RUN_DIR="$RUNNER_TEMP/nbu-audited-pin-replay"
          python -I - "$RUN_DIR" <<'PY'
          import hashlib
          import json
          import os
          import sys
          from pathlib import Path

          root = Path(sys.argv[1])
          def load(name):
              value = json.loads((root / name).read_text(encoding="utf-8"))
              assert type(value) is dict
              return value

          report = load("global-dedup-report.json")
          survivors = load("survivor-authority.json")
          execution = load("execution-evidence.json")
          text = load("nbu-text-evidence-a.json")
          core = {
              "schema_version": "12-6.d03-nbu-audited-pin-replay-dedup.v1",
              "status": "AUDITED_PIN_REPLAY_GLOBAL_DEDUP_ZERO_CREDIT",
              "execution_head_sha": os.environ["HEAD_SHA"],
              "historical_materialization_run_id": int(os.environ["HISTORICAL_RUN_ID"]),
              "historical_materialization_artifact_id": int(os.environ["HISTORICAL_ARTIFACT_ID"]),
              "historical_artifact_zip_sha256": os.environ["HISTORICAL_ARTIFACT_ZIP_SHA256"],
              "fresh_catalog_discovery_executed": False,
              "historical_discovery_evidence_identity_sha256": os.environ["EXPECTED_DISCOVERY_SHA256"],
              "historical_pdf_pin_evidence_identity_sha256": os.environ["EXPECTED_PDF_PIN_SHA256"],
              "fresh_pinned_pdf_text_materialization_executed": True,
              "candidate_sha256": text["text_artifact_sha256"],
              "materialized_records": text["materialized_records"],
              "observed_text_bytes": text["observed_text_bytes"],
              "matcher_report_sha256": report["report_sha256"],
              "survivor_authority_sha256": survivors["survivor_authority_sha256"],
              "execution_evidence_identity_sha256": execution["evidence_identity_sha256"],
              "truth_boundary": execution["truth_boundary"],
              "raw_text_persisted_in_durable_evidence": False,
          }
          assert core["candidate_sha256"] == os.environ["EXPECTED_CANDIDATE_SHA256"]
          value = {
              **core,
              "summary_identity_sha256": hashlib.sha256(
                  json.dumps(core, ensure_ascii=False, sort_keys=True, separators=(",", ":")).encode("utf-8")
              ).hexdigest(),
          }
          (root / "audited-pin-replay-summary.json").write_text(
              json.dumps(value, ensure_ascii=False, sort_keys=True, separators=(",", ":")) + "\n",
              encoding="utf-8",
          )
          PY

      - name: Remove raw materialized text before artifact publication
        if: always()
        run: |
          RUN_DIR="$RUNNER_TEMP/nbu-audited-pin-replay"
          rm -f "$RUN_DIR/nbu-text-a.jsonl" "$RUN_DIR/nbu-text-b.jsonl"

      - name: Upload body-free audited-pin replay evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: nbu-audited-pin-replay-${{ github.event.pull_request.head.sha }}
          if-no-files-found: warn
          retention-days: 14
          path: |
            ${{ runner.temp }}/nbu-audited-pin-replay/nbu-text-evidence-a.json
            ${{ runner.temp }}/nbu-audited-pin-replay/nbu-text-evidence-b.json
            ${{ runner.temp }}/nbu-audited-pin-replay/global-dedup-report.json
            ${{ runner.temp }}/nbu-audited-pin-replay/survivor-authority.json
            ${{ runner.temp }}/nbu-audited-pin-replay/execution-evidence.json
            ${{ runner.temp }}/nbu-audited-pin-replay/audited-pin-replay-summary.json

  nbu-global-dedup-two-clean:
    if: github.event_name == 'pull_request' && github.event.pull_request.number == 2454 && github.head_ref == 'swarm/2398-nbu-indexed-dedup-execution-v1' && github.event.pull_request.head.repo.full_name == github.repository
    needs: nbu-global-dedup-pass
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      EXPECTED_MAIN: "ba9e49cedba4a110e1c4f7d83702e8fcf8a42461"
      EXPECTED_CANDIDATE_SHA256: "bf48a0b540a1c069a6afa14f5ea24077aeea466a0f376c94c902ea175e7037d2"
      EXPECTED_TEXT_EVIDENCE_SHA256: "700756dd7afebfbcc663cf503e015ec221e2e9e64717762feda4f8b05610c5a0"

    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: nbu-global-dedup-pass-1-${{ github.event.pull_request.head.sha }}
          path: artifacts/pass-1

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: nbu-global-dedup-pass-2-${{ github.event.pull_request.head.sha }}
          path: artifacts/pass-2

      - name: Require two independent source/materialization/dedup convergences
        run: |
          set -euxo pipefail

          resolve_pass_dir() {
            local root="$1"
            mapfile -t matches < <(find "$root" -type f -name global-dedup-report.json -print)
            test "${#matches[@]}" -eq 1
            dirname "${matches[0]}"
          }

          P1_DIR="$(resolve_pass_dir artifacts/pass-1)"
          P2_DIR="$(resolve_pass_dir artifacts/pass-2)"
          export P1_DIR P2_DIR

          cmp "$P1_DIR/nbu-discovery-evidence.json" "$P2_DIR/nbu-discovery-evidence.json"
          cmp "$P1_DIR/nbu-pdf-pin-evidence.json" "$P2_DIR/nbu-pdf-pin-evidence.json"
          cmp "$P1_DIR/nbu-text-evidence-a.json" "$P2_DIR/nbu-text-evidence-a.json"
          cmp "$P1_DIR/global-dedup-report.json" "$P2_DIR/global-dedup-report.json"
          cmp "$P1_DIR/survivor-authority.json" "$P2_DIR/survivor-authority.json"

          python -I - <<'PY'
          from __future__ import annotations

          import hashlib
          import json
          import math
          import os
          from pathlib import Path

          def reject_pairs(pairs):
              result = {}
              for key, value in pairs:
                  if key in result:
                      raise ValueError(f"duplicate JSON key: {key}")
                  result[key] = value
              return result

          def finite_float(token: str) -> float:
              value = float(token)
              if not math.isfinite(value):
                  raise ValueError(f"non-finite JSON number: {token}")
              return value

          def load(path: str) -> dict:
              value = json.loads(
                  Path(path).read_text(encoding="utf-8"),
                  object_pairs_hook=reject_pairs,
                  parse_float=finite_float,
                  parse_constant=lambda token: (_ for _ in ()).throw(
                      ValueError(f"non-finite JSON constant: {token}")
                  ),
              )
              assert type(value) is dict, path
              return value

          def sha256(payload: bytes) -> str:
              return hashlib.sha256(payload).hexdigest()

          def canonical(value: dict, *, ascii_only: bool = False, newline: bool = False) -> bytes:
              raw = json.dumps(
                  value,
                  ensure_ascii=ascii_only,
                  sort_keys=True,
                  separators=(",", ":"),
                  allow_nan=False,
              ).encode("utf-8")
              return raw + (b"\n" if newline else b"")

          def verify_self_hash(
              value: dict,
              field: str,
              *,
              ascii_only: bool = False,
              newline: bool = False,
          ) -> None:
              identity = value.get(field)
              assert (
                  type(identity) is str
                  and len(identity) == 64
                  and all(char in "0123456789abcdef" for char in identity)
              ), field
              core = dict(value)
              core.pop(field)
              assert identity == sha256(
                  canonical(core, ascii_only=ascii_only, newline=newline)
              ), field

          discoveries = [
              load(str(Path(os.environ["P1_DIR"]) / "nbu-discovery-evidence.json")),
              load(str(Path(os.environ["P2_DIR"]) / "nbu-discovery-evidence.json")),
          ]
          pins = [
              load(str(Path(os.environ["P1_DIR"]) / "nbu-pdf-pin-evidence.json")),
              load(str(Path(os.environ["P2_DIR"]) / "nbu-pdf-pin-evidence.json")),
          ]
          reports = [
              load(str(Path(os.environ["P1_DIR"]) / "global-dedup-report.json")),
              load(str(Path(os.environ["P2_DIR"]) / "global-dedup-report.json")),
          ]
          survivors = [
              load(str(Path(os.environ["P1_DIR"]) / "survivor-authority.json")),
              load(str(Path(os.environ["P2_DIR"]) / "survivor-authority.json")),
          ]
          executions = [
              load(str(Path(os.environ["P1_DIR"]) / "execution-evidence.json")),
              load(str(Path(os.environ["P2_DIR"]) / "execution-evidence.json")),
          ]
          pass_summaries = [
              load(str(Path(os.environ["P1_DIR"]) / "physical-pass-summary.json")),
              load(str(Path(os.environ["P2_DIR"]) / "physical-pass-summary.json")),
          ]
          texts = [
              load(str(Path(os.environ["P1_DIR"]) / "nbu-text-evidence-a.json")),
              load(str(Path(os.environ["P2_DIR"]) / "nbu-text-evidence-a.json")),
          ]

          for discovery in discoveries:
              verify_self_hash(discovery, "evidence_identity_sha256", newline=True)
          for pin in pins:
              verify_self_hash(pin, "evidence_identity_sha256", newline=True)
          for text in texts:
              verify_self_hash(text, "evidence_identity_sha256", newline=True)
          for report in reports:
              verify_self_hash(report, "report_sha256", ascii_only=True, newline=True)
          for survivor in survivors:
              verify_self_hash(survivor, "survivor_authority_sha256")
          for execution in executions:
              verify_self_hash(execution, "evidence_identity_sha256")
          for pass_summary in pass_summaries:
              verify_self_hash(pass_summary, "summary_identity_sha256")

          assert reports[0]["report_sha256"] == reports[1]["report_sha256"]
          assert survivors[0]["survivor_authority_sha256"] == survivors[1]["survivor_authority_sha256"]

          for discovery, pin, text in zip(discoveries, pins, texts, strict=True):
              assert (
                  pin["parent_discovery_evidence_identity_sha256"]
                  == discovery["evidence_identity_sha256"]
              )
              assert (
                  text["discovery_evidence_identity_sha256"]
                  == discovery["evidence_identity_sha256"]
              )
              assert (
                  text["pdf_pin_evidence_identity_sha256"]
                  == pin["evidence_identity_sha256"]
              )
              assert text["text_artifact_sha256"] == os.environ["EXPECTED_CANDIDATE_SHA256"]
              assert text["evidence_identity_sha256"] == os.environ["EXPECTED_TEXT_EVIDENCE_SHA256"]
              assert text["materialized_records"] == 40
              assert text["observed_text_bytes"] == 794091

          expected_matcher = {
              "engine": "MERGED_PR_1459",
              "performance_equivalence_authority": "MERGED_PR_1459",
              "incumbent_runtime_attested": True,
              "max_candidate_pairs": 5_000_000,
              "max_index_postings": 50_000_000,
              "max_pair_expansions": 50_000_000,
              "all_pairs_reference_executed": False,
          }
          expected_runtime = {
              "github_actions": True,
              "runner_environment": "github-hosted",
              "runner_os": "Linux",
              "runner_arch": "X64",
          }

          expected_truth = {
              "canonical_capacity_credited": 0,
              "training_authorized_bytes": 0,
              "authorized_unique_loss_positions": 0,
              "authorized_optimized_target_exposure": 0,
              "tokenizer_fit_authorized": False,
              "optimizer_updates_executed_on_real_targets": 0,
              "training_executed": False,
              "learned_weights_created": False,
              "final_test_outcomes_read": False,
              "paid_compute_used": False,
              "foreign_pretrained_weights_used": False,
              "whole_corpus_external_llm_cleanliness_claimed": False,
          }
          expected_content_boundary = {
              "raw_text_emitted": False,
              "raw_candidate_written_to_durable_evidence": False,
              "dedup_report_text_free": True,
              "survivor_authority_text_free": True,
          }

          for execution in executions:
              assert execution["schema_version"] == "12-6.d03-nbu-global-dedup-execution.v1"
              assert execution["execution_profile"] == "LOCAL_FREE"
              assert execution["execution_claim_issue"] == 2398
              assert execution["execution_pr"] == 2454
              assert execution["execution_head_sha"] == os.environ["HEAD_SHA"]
              assert execution["pinned_main_sha"] == os.environ["EXPECTED_MAIN"]

              runtime = execution["runtime_environment"]
              assert type(runtime) is dict
