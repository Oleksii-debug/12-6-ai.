                  assert type(runtime.get(key)) is type(expected), key
                  assert runtime.get(key) == expected, key

              baseline = execution["baseline_v8"]
              assert baseline["source_object_count"] == 264
              assert baseline["payload_bytes"] == 6_095_624

              nbu_execution = execution["nbu"]
              assert nbu_execution["candidate_sha256"] == os.environ["EXPECTED_CANDIDATE_SHA256"]
              assert nbu_execution["source_object_count"] == 40
              assert nbu_execution["payload_bytes"] == 794_091

              combined = execution["combined"]
              assert combined["source_object_count"] == 304
              assert combined["payload_bytes"] == 6_889_715
              assert combined["indexed_report_sha256"] == reports[0]["report_sha256"]

              matcher = execution["matcher_execution"]
              assert type(matcher) is dict
              for key, expected in expected_matcher.items():
                  assert type(matcher.get(key)) is type(expected), key
                  assert matcher.get(key) == expected, key

              assert execution["survivor_authority_sha256"] == survivors[0]["survivor_authority_sha256"]
              truth = execution["truth_boundary"]
