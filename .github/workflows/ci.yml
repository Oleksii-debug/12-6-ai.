name: CI
on:
  push:
    branches: [main]
  pull_request:
    paths-ignore:
      - "docs/**"
      - "reports/**"
      - "**/*.md"

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: read

jobs:
  preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      run_arm: ${{ steps.scope.outputs.run_arm }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11.16"
      - name: Dependency and tool preflight before tests
        env:
          SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: >-
          python tools/ci_dependency_preflight.py
          --profile linux-x86_64
          --source-sha "$SOURCE_SHA"
          --output ci-dependency-preflight.json
      - id: scope
        name: Classify portability-sensitive changes
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          run_arm=true
          if [[ "$BASE_SHA" =~ ^[0-9a-f]{40}$ ]] && [[ ! "$BASE_SHA" =~ ^0+$ ]]; then
            git diff --name-only "$BASE_SHA" "$HEAD_SHA" > changed-paths.txt
            if ! grep -Eq '^(requirements/|pyproject\.toml$|src/twelve_six/integration/dependency_lock\.py$|tools/verify_locked_environment\.py$|\.github/workflows/ci\.yml$)' changed-paths.txt; then
              run_arm=false
            fi
          fi
          echo "run_arm=$run_arm" >> "$GITHUB_OUTPUT"
          cat changed-paths.txt 2>/dev/null || true

  locked-x86-64:
    needs: preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Scan Git history for secrets
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: "false"
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "false"
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11.16"
      - name: Locked clean install, package smoke and full checks
        run: >-
          python tools/verify_locked_environment.py
          --profile linux-x86_64
          --source-sha "${{ github.event.pull_request.head.sha || github.sha }}"
          --evidence-out locked-environment-linux-x86_64.json
          --run-repo-checks
      - name: Upload locked environment evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: locked-environment-linux-x86_64
          path: locked-environment-linux-x86_64.json
          if-no-files-found: error
          retention-days: 30

  locked-arm64:
    needs: preflight
    if: needs.preflight.outputs.run_arm == 'true'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11.16"
      - name: Locked clean install and package smoke
        run: >-
          python tools/verify_locked_environment.py
          --profile linux-aarch64
          --source-sha "${{ github.event.pull_request.head.sha || github.sha }}"
          --evidence-out locked-environment-linux-aarch64.json
      - name: Upload locked environment evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: locked-environment-linux-aarch64
          path: locked-environment-linux-aarch64.json
          if-no-files-found: error
          retention-days: 30

  verify219-exact-artifact:
    if: github.event_name == 'pull_request' && github.head_ref == 'verify219/learned-3m-independent-20260826'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      PYTHONPATH: src
      VERIFY219_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      PRODUCER_SHA: a75920cef8bde37a8c590e34095be83c97b75f1d
      PRODUCER_ARTIFACT_ID: "9597788382"
      PRODUCER_ARTIFACT_ZIP_SHA256: f57bf36113a68fffd4bfcf877bf08762393479b9c09e6fd0fd613fbb91f044ee
    steps:
      - name: Checkout exact verifier head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.11.16"
      - name: Universal hash-locked bootstrap
        run: |
          set -euo pipefail
          mkdir -p reports/verify219
          python tools/bootstrap_universal_environment.py \
            --venv .verify219 \
            --lock requirements/locks/linux-x86_64/toolchain.lock.txt \
            --lock requirements/locks/linux-x86_64/runtime.lock.txt \
            --lock requirements/locks/linux-x86_64/dev.lock.txt \
            --evidence-out reports/verify219/environment.json
      - name: Verification-only source guard and tests
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$VERIFY219_HEAD_SHA"
          test "$VERIFY219_HEAD_SHA" != "$PRODUCER_SHA"
          .verify219/bin/python -m compileall -q \
            src/twelve_six/verify219_learned_3m.py \
            src/twelve_six/verify219_artifact_contract.py \
            tests/test_verify219_learned_3m.py
          if grep -En '\b(optimizer\.step|backward|save_checkpoint|save_trainer_checkpoint)\b' \
            src/twelve_six/verify219_learned_3m.py \
            src/twelve_six/verify219_artifact_contract.py; then
            echo "VERIFY-219 must remain verification-only" >&2
            exit 1
          fi
          .verify219/bin/python -m pytest -q tests/test_verify219_learned_3m.py
      - name: Download exact immutable LEARN-191 artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p learned-artifacts/zips learned-artifacts/learn191 reports/verify219
          gh api "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${PRODUCER_ARTIFACT_ID}/zip" \
            > learned-artifacts/zips/learn191.zip
          echo "${PRODUCER_ARTIFACT_ZIP_SHA256}  learned-artifacts/zips/learn191.zip" | sha256sum -c -
          unzip -q learned-artifacts/zips/learn191.zip -d learned-artifacts/learn191
      - name: Preflight immutable producer contract
        run: |
          set -euo pipefail
          .verify219/bin/python - <<'PY'
          import json
          from pathlib import Path
          from twelve_six.verify219_artifact_contract import validate_artifact_contract

          value = validate_artifact_contract(Path('learned-artifacts/learn191'))
          path = Path('reports/verify219/artifact-contract.json')
          path.write_text(json.dumps(value, ensure_ascii=False, sort_keys=True, indent=2) + '\n', encoding='utf-8')
          assert value['final_checkpoint_id'] == '920283a052c6c7fbd2b66f8ce5f775e4747c3d459e539b3625e4bebf1b9a7a59'
          assert value['final_optimizer_step'] == 139
          assert value['final_optimized_tokens'] == 131938
          PY
      - name: Execute independent scientific verifier
        run: |
          set -euo pipefail
          .verify219/bin/python -m twelve_six.verify219_learned_3m \
            --repo-root . \
            --artifact-root learned-artifacts/learn191 \
            --verifier-head-sha "$VERIFY219_HEAD_SHA" \
            --output reports/verify219/authority.json
      - name: Enforce terminal authority contract
        run: |
          set -euo pipefail
          .verify219/bin/python - <<'PY'
          import json
          import math
          from pathlib import Path
          from twelve_six.checkpoint import hash_json

          value = json.loads(Path('reports/verify219/authority.json').read_text(encoding='utf-8'))
          supplied = value.pop('identity_sha256')
          assert supplied == hash_json(value)
          assert value['worker'] == 'VERIFY-219-LEARNED-3M-INDEPENDENT'
          assert value['state'] == 'VERIFIED_LEARNED_3M'
          assert value['producer']['git_sha'] == 'a75920cef8bde37a8c590e34095be83c97b75f1d'
          assert value['producer']['artifact_id'] == 9597788382
          assert value['producer']['artifact_zip_sha256'] == 'f57bf36113a68fffd4bfcf877bf08762393479b9c09e6fd0fd613fbb91f044ee'
          assert value['model']['parameter_count'] == 3213120
          assert value['model']['model_spec_sha256'] == '462c85da80a3c0d7d6a4f1a570b87d208b1847d8a57b12a4d9be7e36846b65dc'
          assert value['data_and_eval']['corpus_identity_sha256'] == '422f545da93526ceba2c0ff738e0b9deac65f35bfb31d87d2aab068cda091fc8'
          assert value['data_and_eval']['m150_common_evaluation_identity_sha256'] == '7189e6df053574beb686727c94e684cdbaf08a34ef33aa953eff7cdae0320113'
          assert value['data_and_eval']['final_m150_common_improved_over_random_init'] is True
          assert value['measured_best_target_optimized_tokens'] == 131292
          expected_boundaries = {
              '16632': (18, 17125),
              '65772': (70, 66417),
              '131292': (139, 131938),
          }
          for target, (step, tokens) in expected_boundaries.items():
              identity = value['checkpoints'][target]['identity']
              assert identity['step'] == step
              assert identity['tokens_seen'] == tokens
              assert value['checkpoints'][target]['checkpoint_tree_sha256_before'] == value['checkpoints'][target]['checkpoint_tree_sha256_after']
          assert value['checkpoints']['131292']['checkpoint_id'] == '920283a052c6c7fbd2b66f8ce5f775e4747c3d459e539b3625e4bebf1b9a7a59'
          assert math.isclose(value['checkpoints']['131292']['selection_validation']['bits_per_byte'], 2.2859499700392583, rel_tol=0.0, abs_tol=1e-7)
          assert value['boundaries']['training_executed'] is False
          assert value['boundaries']['optimizer_updates'] == 0
          assert value['boundaries']['paid_compute'] is False
          assert value['boundaries']['foreign_pretrained_weights'] is False
          assert value['boundaries']['evaluation_mutated_model'] is False
          print(supplied)
          PY
      - name: Upload independent VERIFY-219 authority
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: verify219-learned-3m-independent
          retention-days: 30
          if-no-files-found: warn
          path: |
            reports/verify219/environment.json
            reports/verify219/artifact-contract.json
            reports/verify219/authority.json
