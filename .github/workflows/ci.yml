name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  bootstrap:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Scan Git history for secrets
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: "false"
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "false"
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11.16"
      - run: python -m pip --version
      - run: python -m pip install --disable-pip-version-check -e .[dev]
      - run: python tools/check_repo_policy.py
      - run: python tools/check_workflow_policy.py
      - name: Capture exact CI environment inventory
        env:
          SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: python tools/capture_environment_inventory.py --output /tmp/ci_environment_inventory.json
      - name: Retain CI environment inventory
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ci-environment-inventory
          path: /tmp/ci_environment_inventory.json
          if-no-files-found: error
          retention-days: 30
      - run: ruff check src tests tools
      - run: pytest -q
      - run: python tools/validate_stage_candidate.py configs/releases/s0_candidate.template.json
