                  assert content_boundary.get(key) is expected, key

          assert executions[0]["main_authority_path_blobs"] == executions[1]["main_authority_path_blobs"]
          assert executions[0]["product_path_blobs"] == executions[1]["product_path_blobs"]
          assert executions[0]["nbu"]["intake_receipt_identity_sha256"] == executions[1]["nbu"]["intake_receipt_identity_sha256"]

          runtime_a = executions[0]["runtime_environment"]
          runtime_b = executions[1]["runtime_environment"]
          for key in ("python_version", "python_implementation", "python_platform"):
              assert type(runtime_a.get(key)) is str and runtime_a.get(key), key
              assert runtime_a.get(key) == runtime_b.get(key), key

          for expected_pass_id, summary, discovery, pin, execution, report, survivor in zip(
              (1, 2),
              pass_summaries,
              discoveries,
              pins,
              executions,
              reports,
              survivors,
              strict=True,
          ):
              assert summary["schema_version"] == "12-6.d03-nbu-global-dedup-physical-pass.v1"
              assert summary["execution_head_sha"] == os.environ["HEAD_SHA"]
              assert type(summary["pass_id"]) is int
              assert summary["pass_id"] == expected_pass_id
              source = summary["source_materialization"]
              assert type(source) is dict
              assert (
                  source["discovery_evidence_identity_sha256"]
                  == discovery["evidence_identity_sha256"]
              )
              assert (
                  source["pdf_pin_evidence_identity_sha256"]
                  == pin["evidence_identity_sha256"]
              )
              assert source["candidate_sha256"] == os.environ["EXPECTED_CANDIDATE_SHA256"]
              assert source["evidence_identity_sha256"] == os.environ["EXPECTED_TEXT_EVIDENCE_SHA256"]
              assert source["record_count"] == 40
              assert source["text_bytes"] == 794091
              dedup = summary["global_dedup"]
              assert type(dedup) is dict
              assert dedup["report_sha256"] == report["report_sha256"]
              assert dedup["survivor_authority_sha256"] == survivor["survivor_authority_sha256"]
              assert (
                  dedup["execution_evidence_identity_sha256"]
                  == execution["evidence_identity_sha256"]
              )
              assert summary["truth_boundary"] == execution["truth_boundary"]
              assert summary["raw_text_persisted_in_durable_evidence"] is False

          assert (
              pass_summaries[0]["summary_identity_sha256"]
              != pass_summaries[1]["summary_identity_sha256"]
          )

          core = {
