          test "$(git rev-parse HEAD)" = "$HEAD_SHA"

          git fetch --no-tags origin "$NBU_BRANCH"
          test "$(git rev-parse FETCH_HEAD)" = "$NBU_HEAD"
          NBU_ROOT="$RUNNER_TEMP/nbu-historical-$PASS_ID"
          git worktree add --detach "$NBU_ROOT" "$NBU_HEAD"
          test "$(git -C "$NBU_ROOT" rev-parse HEAD)" = "$NBU_HEAD"
          test -z "$(git -C "$NBU_ROOT" status --porcelain=v1 --untracked-files=all)"

          git fetch --no-tags origin "$V7_BRANCH"
          test "$(git rev-parse FETCH_HEAD)" = "$V7_HEAD"
          V7_ROOT="$RUNNER_TEMP/v7-$PASS_ID"
          git worktree add --detach "$V7_ROOT" "$V7_HEAD"
          test "$(git -C "$V7_ROOT" rev-parse HEAD)" = "$V7_HEAD"
          test -z "$(git -C "$V7_ROOT" status --porcelain=v1 --untracked-files=all)"

      - name: Re-qualify exact historical NBU contracts
        run: |
          set -euxo pipefail
          NBU_ROOT="$RUNNER_TEMP/nbu-historical-$PASS_ID"
          (
            cd "$NBU_ROOT"
            PYTHONPATH="$NBU_ROOT/src" python -m pytest -q \
              tests/test_d03_ua_nbu_official_resolutions_intake_v1.py \
              tests/test_d03_ua_nbu_official_pdf_pins_v1.py \
              tests/test_d03_ua_nbu_pdftotext_materialization_v1.py \
              tests/test_d03_ua_nbu_pdftotext_authority_hardening.py
          )

      - name: Execute exact historical bounded live discovery
        run: |
          set -euxo pipefail
          RUN_DIR="$RUNNER_TEMP/nbu-global-dedup-pass-$PASS_ID"
          NBU_ROOT="$RUNNER_TEMP/nbu-historical-$PASS_ID"
          mkdir -p "$RUN_DIR"
          (
            cd "$NBU_ROOT"
            python - "$NBU_ROOT" <<'PY'
          from __future__ import annotations

          import os
          import sys
          import textwrap
          from pathlib import Path

          root = Path(sys.argv[1]).resolve(strict=True)
          workflow = root / ".github/workflows/d03_nbu_pdftotext_real_execution.yml"
          raw = workflow.read_text(encoding="utf-8")
          step = "      - name: Build stable bounded live NBU discovery evidence\n"
          begin = raw.index(step)
          end = raw.index("\n      - name: Pin exact official NBU PDF bytes", begin)
          section = raw[begin:end]
          marker = "        run: |\n          python3 - <<'PY'\n"
          script_begin = section.index(marker) + len(marker)
          script_end = section.rindex("\n          PY")
          script = textwrap.dedent(section[script_begin:script_end])
          os.chdir(root)
          exec(compile(script, str(workflow) + "#exact-discovery-heredoc", "exec"), {"__name__": "__main__"})
          PY
          )
          mv /tmp/nbu-discovery-evidence.json "$RUN_DIR/nbu-discovery-evidence.json"
          mv /tmp/nbu-catalog-pages.json "$RUN_DIR/nbu-catalog-pages.json"

      - name: Build exact pinned Poppler pdftotext
        run: |
          set -euxo pipefail
          curl --fail --location --retry 3 --retry-delay 2 \
            "https://poppler.freedesktop.org/poppler-${POPPLER_VERSION}.tar.xz" \
            --output /tmp/poppler.tar.xz
          echo "${POPPLER_TARBALL_SHA256}  /tmp/poppler.tar.xz" | sha256sum --check --strict
          tar -C /tmp -xf /tmp/poppler.tar.xz
          cmake -S "/tmp/poppler-${POPPLER_VERSION}" -B /tmp/poppler-build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX=/usr/local \
            -DENABLE_UTILS=ON \
            -DENABLE_CPP=OFF \
            -DENABLE_GLIB=OFF \
            -DENABLE_QT5=OFF \
            -DENABLE_QT6=OFF \
            -DENABLE_BOOST=OFF \
            -DENABLE_LIBCURL=OFF \
            -DENABLE_NSS3=OFF \
            -DENABLE_GPGME=OFF \
            -DBUILD_GTK_TESTS=OFF \
            -DBUILD_QT5_TESTS=OFF \
            -DBUILD_QT6_TESTS=OFF \
            -DBUILD_CPP_TESTS=OFF \
            -DBUILD_MANUAL_TESTS=OFF
          cmake --build /tmp/poppler-build --parallel 2
          sudo cmake --install /tmp/poppler-build
          sudo ldconfig
          RUN_DIR="$RUNNER_TEMP/nbu-global-dedup-pass-$PASS_ID"
          pdftotext -v 2>&1 | tee "$RUN_DIR/pdftotext-version.txt"
          grep -F "pdftotext version ${POPPLER_VERSION}" "$RUN_DIR/pdftotext-version.txt"

      - name: Pin PDFs and materialize exact NBU text twice
        run: |
          set -euxo pipefail
          RUN_DIR="$RUNNER_TEMP/nbu-global-dedup-pass-$PASS_ID"
          NBU_ROOT="$RUNNER_TEMP/nbu-historical-$PASS_ID"
          (
            cd "$NBU_ROOT"
            PYTHONPATH="$NBU_ROOT/src" python tools/materialize_d03_ua_nbu_official_pdf_pins_v1.py \
              "$RUN_DIR/nbu-discovery-evidence.json" \
              --output "$RUN_DIR/nbu-pdf-pin-evidence.json"

            PYTHONPATH="$NBU_ROOT/src" python tools/materialize_d03_ua_nbu_pdftotext_v1.py \
              "$RUN_DIR/nbu-discovery-evidence.json" \
              "$RUN_DIR/nbu-pdf-pin-evidence.json" \
              --text-output "$RUN_DIR/nbu-text-a.jsonl" \
              --evidence-output "$RUN_DIR/nbu-text-evidence-a.json"

            PYTHONPATH="$NBU_ROOT/src" python tools/materialize_d03_ua_nbu_pdftotext_v1.py \
              "$RUN_DIR/nbu-discovery-evidence.json" \
              "$RUN_DIR/nbu-pdf-pin-evidence.json" \
              --text-output "$RUN_DIR/nbu-text-b.jsonl" \
              --evidence-output "$RUN_DIR/nbu-text-evidence-b.json"
          )
          cmp "$RUN_DIR/nbu-text-a.jsonl" "$RUN_DIR/nbu-text-b.jsonl"
          cmp "$RUN_DIR/nbu-text-evidence-a.json" "$RUN_DIR/nbu-text-evidence-b.json"
          test "$(sha256sum "$RUN_DIR/nbu-text-a.jsonl" | cut -d' ' -f1)" = "$EXPECTED_CANDIDATE_SHA256"
          python -I - "$RUN_DIR/nbu-text-evidence-a.json" <<'PY'
          import json
          import os
          import sys
          value = json.load(open(sys.argv[1], encoding="utf-8"))
          assert value["evidence_identity_sha256"] == os.environ["EXPECTED_TEXT_EVIDENCE_SHA256"]
          assert value["materialized_records"] == 40
          assert value["observed_text_bytes"] == 794091
          assert value["canonical_capacity_credit_bytes"] == 0
          assert value["model_training_executed"] is False
          PY

      - name: Execute current incumbent indexed global dedup
        run: |
          set -euxo pipefail
          RUN_DIR="$RUNNER_TEMP/nbu-global-dedup-pass-$PASS_ID"
          V7_ROOT="$RUNNER_TEMP/v7-$PASS_ID"
          python tools/run_d03_nbu_global_dedup_execution_v1.py \
            --v7-root "$V7_ROOT" \
            --bulk-workspace "$RUN_DIR/bulk-workspace" \
            --candidate-jsonl "$RUN_DIR/nbu-text-a.jsonl" \
