          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            build-essential ca-certificates cmake curl libfontconfig1-dev libfreetype6-dev \
            libharfbuzz-dev libjpeg-dev liblcms2-dev libopenjp2-7-dev libpng-dev \
            libtiff-dev ninja-build pkg-config zlib1g-dev

      - name: Build exact Poppler pdftotext from pinned upstream source
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --retry-delay 2 \
            "https://poppler.freedesktop.org/poppler-${POPPLER_VERSION}.tar.xz" \
            --output /tmp/poppler-caselaw.tar.xz
          echo "${POPPLER_TARBALL_SHA256}  /tmp/poppler-caselaw.tar.xz" | sha256sum --check --strict
          tar -C /tmp -xf /tmp/poppler-caselaw.tar.xz
          cmake -S "/tmp/poppler-${POPPLER_VERSION}" -B /tmp/poppler-caselaw-build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX=/usr/local \
            -DENABLE_UTILS=ON -DENABLE_CPP=OFF -DENABLE_GLIB=OFF \
            -DENABLE_QT5=OFF -DENABLE_QT6=OFF -DENABLE_BOOST=OFF \
            -DENABLE_LIBCURL=OFF -DENABLE_NSS3=OFF -DENABLE_GPGME=OFF \
            -DBUILD_GTK_TESTS=OFF -DBUILD_QT5_TESTS=OFF -DBUILD_QT6_TESTS=OFF \
            -DBUILD_CPP_TESTS=OFF -DBUILD_MANUAL_TESTS=OFF
          cmake --build /tmp/poppler-caselaw-build --parallel 2
          sudo cmake --install /tmp/poppler-caselaw-build
          sudo ldconfig
          command -v pdftotext
          pdftotext -v 2>&1 | tee /tmp/pdftotext-version.txt
          grep -F "pdftotext version ${POPPLER_VERSION}" /tmp/pdftotext-version.txt

      - name: Prepare exact historical authority worktrees
        run: |
          set -euxo pipefail
          test "$(git rev-parse HEAD)" = "$HEAD_SHA"
          git fetch --no-tags origin "$CASELAW_BRANCH"
          test "$(git rev-parse FETCH_HEAD)" = "$CASELAW_HEAD"
          PR1347="$RUNNER_TEMP/caselaw-pr1347-$PASS_ID"
