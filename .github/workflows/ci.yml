name: CI
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  actions: read
  contents: read

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -e .[dev]
      - name: Enforce shared CI workflow budget
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: python -m twelve_six.ci_workflow_policy --base "$BASE_SHA" --head "$HEAD_SHA"
      - run: ruff check src tests
      - run: pytest -q

      - name: "#2049 — prove execution-only carrier and exact Product bytes"
        if: github.event_name == 'pull_request' && github.head_ref == 'exec/2049-clean-post-g05-g06-physical-v1'
        env:
          AUTHORITATIVE_MAIN_SHA: eb2e0395d41518f5039541587c28a6318e761b14
        run: |
          set -euo pipefail
          # actions/checkout uses the synthetic PR merge ref by default. Detach to the
          # immutable PR head before proving the execution-only carrier boundary.
          git checkout --detach "${{ github.event.pull_request.head.sha }}"
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
          test "$(git diff --name-only "$AUTHORITATIVE_MAIN_SHA" HEAD)" = ".github/workflows/ci.yml"
          git merge-base --is-ancestor 4d3d9f12ce8136d73da8343015acb9e79925dc44 "$AUTHORITATIVE_MAIN_SHA"
          test "$(git show "$AUTHORITATIVE_MAIN_SHA":src/twelve_six/data/post_g05_g06_materialization_v1.py | git hash-object --stdin)" = "830087f91d1fa24385c5cbc8d2f687e4cc46b419"
          test "$(git show "$AUTHORITATIVE_MAIN_SHA":src/twelve_six/data/post_g05_g06_materialization_v2.py | git hash-object --stdin)" = "a4de33f1e225ab8598197e4c1cba28480180d575"
          test "$(git show "$AUTHORITATIVE_MAIN_SHA":src/twelve_six/data/privacy_filter_v3.py | git hash-object --stdin)" = "bcc5938395724f6728ab212f98b39f2334b0f37d"

      - name: "#2049 — checkout exact authoritative Product and immutable clean payload lineage"
        if: github.event_name == 'pull_request' && github.head_ref == 'exec/2049-clean-post-g05-g06-physical-v1'
        env:
          AUTHORITATIVE_MAIN_SHA: eb2e0395d41518f5039541587c28a6318e761b14
          CLEAN_SOURCE_SHA: 3d7dd363f6b1701694c00c76c6353077f80d1492
        run: |
          set -euo pipefail
          git clone --no-checkout --filter=blob:none https://github.com/Oleksii-debug/12-6-ai..git _exec_product
          git -C _exec_product fetch --depth=1 origin "$AUTHORITATIVE_MAIN_SHA"
          git -C _exec_product checkout --detach FETCH_HEAD
          test "$(git -C _exec_product rev-parse HEAD)" = "$AUTHORITATIVE_MAIN_SHA"

          git clone --no-checkout --filter=blob:none https://github.com/Oleksii-debug/12-6-ai..git _clean_authority
          git -C _clean_authority fetch --depth=1 origin "$CLEAN_SOURCE_SHA"
          git -C _clean_authority checkout --detach FETCH_HEAD
          test "$(git -C _clean_authority rev-parse HEAD)" = "$CLEAN_SOURCE_SHA"

          git clone --no-checkout --filter=blob:none https://github.com/Oleksii-debug/12-6-ai..git _clean_authority/_terminal_v7
          git -C _clean_authority/_terminal_v7 fetch --depth=1 origin d3333ec1b4a508df232a5aefccd6686adda745fb
          git -C _clean_authority/_terminal_v7 checkout --detach FETCH_HEAD
          test "$(git -C _clean_authority/_terminal_v7 rev-parse HEAD)" = "d3333ec1b4a508df232a5aefccd6686adda745fb"

          git clone --no-checkout --filter=blob:none https://github.com/Oleksii-debug/12-6-ai..git _clean_authority/_pr623
          git -C _clean_authority/_pr623 fetch --depth=1 origin 70d6ccc87396d129d00771bbf0b6b29bc673bfc4
          git -C _clean_authority/_pr623 checkout --detach FETCH_HEAD
          test "$(git -C _clean_authority/_pr623 rev-parse HEAD)" = "70d6ccc87396d129d00771bbf0b6b29bc673bfc4"

          python -m pip install -e _exec_product
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends poppler-utils
          pdftotext -v

      - name: "#2049 — retrieve immutable DATA-213 input and reconstruct clean DATA526 bytes"
        if: github.event_name == 'pull_request' && github.head_ref == 'exec/2049-clean-post-g05-g06-physical-v1'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          CLEAN_SOURCE_SHA: 3d7dd363f6b1701694c00c76c6353077f80d1492
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location --retry 5 --retry-all-errors \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/Oleksii-debug/12-6-ai./actions/artifacts/9600107886/zip" \
            -o "$RUNNER_TEMP/data213.zip"
          test "$(sha256sum "$RUNNER_TEMP/data213.zip" | cut -d' ' -f1)" = "927e10ccb83f919d57a8b78e3ea9cae72f9d4e0232401043234a35eec150074d"

          (
            cd _clean_authority
            SOURCE_SHA="$CLEAN_SOURCE_SHA" python tools/run_d03_nomis_free_v7_data_only_v1.py _terminal_v7 \
              tools/run_d03_nomis_free_clean_successor_v1.py run \
              --current-root . \
              --v7-root _terminal_v7 \
              --workspace "$RUNNER_TEMP/source-work" \
              --report "$RUNNER_TEMP/source.json" \
              --survivor "$RUNNER_TEMP/survivor.json"
            SOURCE_SHA="$CLEAN_SOURCE_SHA" python tools/run_d03_nomis_free_v7_data_only_v1.py _terminal_v7 \
              tools/materialize_d03_nomis_free_data526_successor_v1.py \
              --current-root . \
              --execution-head-sha "$CLEAN_SOURCE_SHA" \
              --v7-root _terminal_v7 \
              --historical-materializer-root _pr623 \
              --data213-zip "$RUNNER_TEMP/data213.zip" \
              --bulk-workspace "$RUNNER_TEMP/data526-bulk" \
              --source-report "$RUNNER_TEMP/source.json" \
              --survivor "$RUNNER_TEMP/survivor.json" \
              --historical-records-jsonl "$RUNNER_TEMP/historical.jsonl" \
              --records-jsonl "$RUNNER_TEMP/records.jsonl" \
              --inventory-json "$RUNNER_TEMP/inventory.json" \
              --evidence-json "$RUNNER_TEMP/evidence.json"
          )

          test "$(sha256sum "$RUNNER_TEMP/records.jsonl" | cut -d' ' -f1)" = "dc22d829921890ea8c5b51cbedaae099688c37c3cb624a597973305c7fa5b2c3"
          python - <<'PY'
          import json, os
          from pathlib import Path
          root = Path(os.environ['RUNNER_TEMP'])
          inv = json.loads((root / 'inventory.json').read_text())
          ev = json.loads((root / 'evidence.json').read_text())
          assert inv['record_count'] == 274
          assert inv['total_payload_bytes'] == 6093662
          assert inv['record_inventory_digest_sha256'] == '7d6782e91243505c01b0f2f6d6f85b5bbe3a6abf628d73721b1e0c1c77e4f352'
          assert inv['payload_inventory_digest_sha256'] == '59f9c5a7b5db9e45fcde2e3bab10a4adc97cb6832f906fc241edc3e35248b576'
          assert ev['evidence_identity_sha256'] == '45ac421c9e4a5930330c1516af79e1b67d0535fc90b768ecfe9df54dd0a86c5c'
          PY

      - name: "#2049 — execute incumbent clean G05/G06 and late-bind released terminal qualification"
        if: github.event_name == 'pull_request' && github.head_ref == 'exec/2049-clean-post-g05-g06-physical-v1'
        env:
          AUTHORITATIVE_MAIN_SHA: eb2e0395d41518f5039541587c28a6318e761b14
          EXPECTED_G05_ID: b0eea4c1190cef898af60b8227dce1f0acd041da142245df5cfb21d2d670e7f3
          EXPECTED_G06_ID: 31fb3daf889f4568fb11fac65357a80716e658279a4726bc654db609696e617c
          EXPECTED_G06_ENVELOPE_ID: fd7f9eef40e3241ececd4c2d7ee0a468a52a8ebdb3ae962ed8a6c46a04fa038a
          EXPECTED_G06_QUALIFICATION_ID: 75359b5450271cffbcee9563a4ba524992d451d488a1509a11251d6e7b98fa41
        run: |
          set -euo pipefail
          (
            cd _exec_product
            GITHUB_SHA="$AUTHORITATIVE_MAIN_SHA" python tools/run_d03_clean_g05_g06_replay_v1.py \
              --records-jsonl "$RUNNER_TEMP/records.jsonl" \
              --inventory-json "$RUNNER_TEMP/inventory.json" \
              --data526-evidence-json "$RUNNER_TEMP/evidence.json" \
              --output "$RUNNER_TEMP/current-clean-replay.json"
          )
          python - <<'PY'
          import hashlib, json, os
          from pathlib import Path

          root = Path(os.environ['RUNNER_TEMP'])
          receipt = json.loads((root / 'current-clean-replay.json').read_text())
          g05 = receipt['g05']['authority']
          g06 = receipt['g06']['authority']
          assert g05['execution_identity_sha256'] == os.environ['EXPECTED_G05_ID']
          assert g06['execution_identity_sha256'] == os.environ['EXPECTED_G06_ID']
          physical = receipt['physical_clean_reconstruction']
          assert physical == {
              'evidence_identity_sha256': '45ac421c9e4a5930330c1516af79e1b67d0535fc90b768ecfe9df54dd0a86c5c',
              'materialization_authority_head_sha': '3d7dd363f6b1701694c00c76c6353077f80d1492',
              'payload_inventory_digest_sha256': '59f9c5a7b5db9e45fcde2e3bab10a4adc97cb6832f906fc241edc3e35248b576',
              'physical_reconstruction_verified': True,
              'record_count': 274,
              'record_inventory_digest_sha256': '7d6782e91243505c01b0f2f6d6f85b5bbe3a6abf628d73721b1e0c1c77e4f352',
              'record_payload_jsonl_sha256': 'dc22d829921890ea8c5b51cbedaae099688c37c3cb624a597973305c7fa5b2c3',
              'source_object_count': 261,
              'total_payload_bytes': 6093662,
          }

          def cjson(value):
              return (json.dumps(value, ensure_ascii=False, sort_keys=True, separators=(',', ':')) + '\n').encode()
          def write(path, value):
              path.write_bytes(cjson(value))

          write(root / 'g05-authority.json', g05)
          envelope_truth = {
              'dependency_bound_g06_executed': True,
              'canonical_current_corpus_g06': False,
              'current_corpus_eligible': False,
              'training_authorized_bytes': 0,
              'authorized_unique_loss_positions': 0,
              'authorized_optimized_target_exposure': 0,
              'tokenizer_fit_authorized': False,
              'optimizer_updates_executed': 0,
              'training_executed': False,
              'learned_weights_created': False,
              'final_test_outcomes_read': False,
              'paid_compute_used': False,
              'foreign_pretrained_weights': False,
              'external_llm_or_api_used_for_data_or_intelligence': False,
              'raw_payloads_retained_in_output': False,
          }
          envelope_core = {
              'schema_version': '12-6.current-survivor-g06-dependency-bound-execution.v1',
              'execution_profile': 'LOCAL_FREE',
              'dependency': {
                  'survivor_pr': 2107,
                  'survivor_terminal_product_head': '07754c5a1d61669061e608323ea35ddc093bb946',
                  'survivor_real_execution_head': '3d7dd363f6b1701694c00c76c6353077f80d1492',
                  'survivor_real_execution_run': 34911721640,
                  'survivor_real_execution_job': 104200523132,
                  'survivor_artifact_id': 10374891614,
                  'survivor_artifact_zip_sha256': '663eec03d04252b6de574bf97ea0975703e0ba25779ca27340cb3acea941943a',
                  'survivor_materialization_evidence_identity_sha256': '45ac421c9e4a5930330c1516af79e1b67d0535fc90b768ecfe9df54dd0a86c5c',
                  'survivor_record_payload_jsonl_sha256': 'dc22d829921890ea8c5b51cbedaae099688c37c3cb624a597973305c7fa5b2c3',
                  'survivor_record_inventory_digest_sha256': '7d6782e91243505c01b0f2f6d6f85b5bbe3a6abf628d73721b1e0c1c77e4f352',
                  'survivor_payload_inventory_digest_sha256': '59f9c5a7b5db9e45fcde2e3bab10a4adc97cb6832f906fc241edc3e35248b576',
                  'survivor_record_count': 274,
                  'survivor_total_payload_bytes': 6093662,
                  'survivor_source_object_count': 261,
              },
              'g06_input_rows_sha256': 'dcc64560dc677b7c138905a0bd6407c95d9d7a1e01178817eb54dab90ee68910',
              'privacy_execution_authority': g06,
              'truth_boundary': envelope_truth,
          }
          envelope_id = hashlib.sha256(cjson(envelope_core)).hexdigest()
          assert envelope_id == os.environ['EXPECTED_G06_ENVELOPE_ID']
          envelope = {**envelope_core, 'evidence_identity_sha256': envelope_id}
          write(root / 'g06-envelope.json', envelope)

          terminal_truth = {
              'current_corpus_eligible': False,
              'training_authorized_bytes': 0,
              'authorized_optimized_target_exposure': 0,
              'tokenizer_fit_authorized': False,
              'optimizer_updates_executed': 0,
              'training_executed': False,
              'learned_weights_created': False,
              'final_test_outcomes_read': False,
              'paid_compute_used': False,
          }
          qualification_core = {
              'schema': '12-6.g06-exact-byte-terminal-qualification.v1',
              'status': 'PASS_FOR_G06_TERMINAL_CONSUMPTION',
              'target_pr_number': 2136,
              'target_head_git_sha': '4d3d9f12ce8136d73da8343015acb9e79925dc44',
              'real_replay_head_git_sha': 'fee405d02f7d4bc62e9371b80243c749597ca592',
              'real_replay_run_id': 34918860094,
              'real_replay_job_id': 104222729218,
              'final_head_ci_run_id': 34919192773,
              'final_head_ci_job_id': 104223268857,
              'g06_envelope_identity_sha256': envelope_id,
              'g06_execution_identity_sha256': g06['execution_identity_sha256'],
              'input_rows_sha256': 'dcc64560dc677b7c138905a0bd6407c95d9d7a1e01178817eb54dab90ee68910',
              'repeated_execution_evidence_sha256': envelope_id,
              'artifact_id': 10377640986,
              'artifact_zip_sha256': '01f883c10c59ad641d65320a6b763c7f230137700bb154866ca77b6cf083a5bf',
              'replay_record_count': 274,
              'replay_utf8_bytes': 6093662,
              'replay_count': 2,
              'independent_audit_issue_number': 2147,
              'independent_audit_status': 'PASS_FOR_INTEGRATION_RELEASED',
              'local_free_only': True,
              'head_change_invalidates': True,
              'truth_boundary': terminal_truth,
          }
          qualification_id = hashlib.sha256(cjson(qualification_core)).hexdigest()
          assert qualification_id == os.environ['EXPECTED_G06_QUALIFICATION_ID']
          qualification = {**qualification_core, 'qualification_identity_sha256': qualification_id}
          write(root / 'g06-terminal-qualification.json', qualification)
          PY

      - name: "#2049 — build exact native composition preflight"
        if: github.event_name == 'pull_request' && github.head_ref == 'exec/2049-clean-post-g05-g06-physical-v1'
        env:
          EXPECTED_G05_ID: b0eea4c1190cef898af60b8227dce1f0acd041da142245df5cfb21d2d670e7f3
          EXPECTED_G06_ID: 31fb3daf889f4568fb11fac65357a80716e658279a4726bc654db609696e617c
          EXPECTED_G06_ENVELOPE_ID: fd7f9eef40e3241ececd4c2d7ee0a468a52a8ebdb3ae962ed8a6c46a04fa038a
          EXPECTED_G06_QUALIFICATION_ID: 75359b5450271cffbcee9563a4ba524992d451d488a1509a11251d6e7b98fa41
          EXPECTED_PREFLIGHT_ID: b43185014994a4a4250ed8c715067d21d2531d768273b41acc011f0be67b1cb0
        run: |
          set -euo pipefail
          identity="$(
            cd _exec_product
            python tools/materialize_d03_final_g05_g06_coverage_v1.py \
              --native-current-execution-preflight \
              --g05-authority "$RUNNER_TEMP/g05-authority.json" \
              --expected-g05-execution-identity "$EXPECTED_G05_ID" \
              --g06-execution-envelope "$RUNNER_TEMP/g06-envelope.json" \
              --expected-g06-envelope-identity "$EXPECTED_G06_ENVELOPE_ID" \
              --expected-g06-execution-identity "$EXPECTED_G06_ID" \
              --g06-terminal-qualification "$RUNNER_TEMP/g06-terminal-qualification.json" \
              --expected-g06-terminal-qualification-identity "$EXPECTED_G06_QUALIFICATION_ID" \
              --expected-input-rows-sha256 dcc64560dc677b7c138905a0bd6407c95d9d7a1e01178817eb54dab90ee68910 \
              --expected-survivor-evidence-identity 45ac421c9e4a5930330c1516af79e1b67d0535fc90b768ecfe9df54dd0a86c5c \
              --expected-survivor-jsonl-sha256 dc22d829921890ea8c5b51cbedaae099688c37c3cb624a597973305c7fa5b2c3 \
              --expected-survivor-record-inventory-sha256 7d6782e91243505c01b0f2f6d6f85b5bbe3a6abf628d73721b1e0c1c77e4f352 \
              --expected-survivor-payload-inventory-sha256 59f9c5a7b5db9e45fcde2e3bab10a4adc97cb6832f906fc241edc3e35248b576 \
              --expected-survivor-record-count 274 \
              --expected-survivor-payload-bytes 6093662 \
              --expected-survivor-source-object-count 261 \
              --expected-privacy-policy-sha256 66f94332ecc6fd59727b8a840e458255b65566b4cc6ca3f149586ac4232eaf90 \
              --expected-privacy-implementation-git-blob-sha1 bcc5938395724f6728ab212f98b39f2334b0f37d \
              --output "$RUNNER_TEMP/current-preflight.json"
          )"
          test "$identity" = "$EXPECTED_PREFLIGHT_ID"
          python - <<'PY'
          import json, os
          from pathlib import Path
          p = json.loads((Path(os.environ['RUNNER_TEMP']) / 'current-preflight.json').read_text())
          assert p['composition_preflight_identity_sha256'] == os.environ['EXPECTED_PREFLIGHT_ID']
          assert p['drop_record_count'] == 17
          assert p['g05_partial_record_count'] == 0
          assert p['g06_redaction_record_count'] == 9
          assert p['unchanged_allow_record_count'] == 248
          assert p['blockers'] == ['G06_REDACTION_MATERIALIZATION_REQUIRED', 'POST_G05_G06_EXCLUSION_MATERIALIZATION_REQUIRED']
          PY

      - name: "#2049 — materialize clean post-G05/G06 payload twice in fresh processes"
        if: github.event_name == 'pull_request' && github.head_ref == 'exec/2049-clean-post-g05-g06-physical-v1'
        env:
          AUTHORITATIVE_MAIN_SHA: eb2e0395d41518f5039541587c28a6318e761b14
          EXPECTED_G05_ID: b0eea4c1190cef898af60b8227dce1f0acd041da142245df5cfb21d2d670e7f3
          EXPECTED_G06_ID: 31fb3daf889f4568fb11fac65357a80716e658279a4726bc654db609696e617c
          EXPECTED_G06_ENVELOPE_ID: fd7f9eef40e3241ececd4c2d7ee0a468a52a8ebdb3ae962ed8a6c46a04fa038a
          EXPECTED_G06_QUALIFICATION_ID: 75359b5450271cffbcee9563a4ba524992d451d488a1509a11251d6e7b98fa41
          EXPECTED_PREFLIGHT_ID: b43185014994a4a4250ed8c715067d21d2531d768273b41acc011f0be67b1cb0
        run: |
          set -euo pipefail
          rm -rf "$RUNNER_TEMP/post-g05-g06-a" "$RUNNER_TEMP/post-g05-g06-b" artifacts/post-g05-g06-2049
          mkdir -p "$RUNNER_TEMP/post-g05-g06-a" "$RUNNER_TEMP/post-g05-g06-b" artifacts/post-g05-g06-2049

          for build in a b; do
            (
              cd _exec_product
              python tools/materialize_post_g05_g06_payload_v1.py \
                --input-jsonl "$RUNNER_TEMP/records.jsonl" \
                --composition-preflight "$RUNNER_TEMP/current-preflight.json" \
                --expected-composition-preflight-identity "$EXPECTED_PREFLIGHT_ID" \
                --g05-authority "$RUNNER_TEMP/g05-authority.json" \
                --expected-g05-execution-identity "$EXPECTED_G05_ID" \
                --g06-execution-envelope "$RUNNER_TEMP/g06-envelope.json" \
                --expected-g06-envelope-identity "$EXPECTED_G06_ENVELOPE_ID" \
                --expected-g06-execution-identity "$EXPECTED_G06_ID" \
                --g06-terminal-qualification "$RUNNER_TEMP/g06-terminal-qualification.json" \
                --expected-g06-terminal-qualification-identity "$EXPECTED_G06_QUALIFICATION_ID" \
                --privacy-source src/twelve_six/data/privacy_filter_v3.py \
                --execution-head-sha "$AUTHORITATIVE_MAIN_SHA" \
                --expected-materializer-implementation-git-blob-sha1 830087f91d1fa24385c5cbc8d2f687e4cc46b419 \
                --expected-materializer-v2-implementation-git-blob-sha1 a4de33f1e225ab8598197e4c1cba28480180d575 \
                --output-jsonl "$RUNNER_TEMP/post-g05-g06-${build}/records.jsonl" \
                --output-inventory "$RUNNER_TEMP/post-g05-g06-${build}/inventory.json" \
                --output-evidence "$RUNNER_TEMP/post-g05-g06-${build}/evidence.json"
            )
          done

          cmp "$RUNNER_TEMP/post-g05-g06-a/records.jsonl" "$RUNNER_TEMP/post-g05-g06-b/records.jsonl"
          cmp "$RUNNER_TEMP/post-g05-g06-a/inventory.json" "$RUNNER_TEMP/post-g05-g06-b/inventory.json"
          cmp "$RUNNER_TEMP/post-g05-g06-a/evidence.json" "$RUNNER_TEMP/post-g05-g06-b/evidence.json"

          python - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          root = Path(os.environ['RUNNER_TEMP'])
          out = Path('artifacts/post-g05-g06-2049')
          raw = (root / 'post-g05-g06-a/records.jsonl').read_bytes()
          inv_raw = (root / 'post-g05-g06-a/inventory.json').read_bytes()
          ev_raw = (root / 'post-g05-g06-a/evidence.json').read_bytes()
          inv = json.loads(inv_raw)
          ev = json.loads(ev_raw)
          assert ev['repeat_materialization_byte_identical'] is True
