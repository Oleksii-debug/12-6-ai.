name: CI
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  actions: read
  contents: read

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -e .[dev]
      - name: Enforce shared CI workflow budget
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: python -m twelve_six.ci_workflow_policy --base "$BASE_SHA" --head "$HEAD_SHA"
      - run: ruff check src tests
      - run: pytest -q
      - name: "#1801 — execute EVAL-647 overlap on exact retained corpus"
        if: github.event_name == 'pull_request' && github.head_ref == 'd06/eval647-code-selection-1640'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          export EVAL647_REAL_PYTHON="$(command -v python)"
          export PATH="$GITHUB_WORKSPACE/tools/eval647_transport_bin:$PATH"
          bash tools/run_eval647_real_overlap_ci_v1.sh
      - name: "#1801 — upload hash-only EVAL-647 overlap evidence"
        if: always() && github.event_name == 'pull_request' && github.head_ref == 'd06/eval647-code-selection-1640'
        uses: actions/upload-artifact@v4
        with:
          name: eval647-current-corpus-overlap-${{ github.event.pull_request.head.sha }}
          if-no-files-found: error
          retention-days: 90
          path: artifacts/eval647/current_corpus_overlap_v1.json
  nbu-global-dedup-pass:
    if: github.event_name == 'pull_request' && github.event.pull_request.number == 2454 && github.head_ref == 'swarm/2398-nbu-indexed-dedup-execution-v1' && github.event.pull_request.head.repo.full_name == github.repository
    needs: bootstrap
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        pass: [1, 2]
    env:
      PASS_ID: ${{ matrix.pass }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      NBU_HEAD: "13be2b000804b410aed7ba759a663408429f60f6"
      NBU_BRANCH: "d03/nbu-pdftotext-materialization-20260907"
      V7_HEAD: "d3333ec1b4a508df232a5aefccd6686adda745fb"
      V7_BRANCH: "next100-065c/crosssource-dedup-v5-20260826"
      POPPLER_VERSION: "25.06.0"
      POPPLER_TARBALL_SHA256: "8199532d38984fab46dbd0020ec9c40f20e928e33e9b4cc6043572603a821d83"
      NBU_TARGET_DOCUMENTS: "40"
      NBU_SEARCH_PER_PAGE: "100"
      EXPECTED_CANDIDATE_SHA256: "bf48a0b540a1c069a6afa14f5ea24077aeea466a0f376c94c902ea175e7037d2"
      EXPECTED_TEXT_EVIDENCE_SHA256: "700756dd7afebfbcc663cf503e015ec221e2e9e64717762feda4f8b05610c5a0"

    steps:
      - name: Checkout exact execution carrier head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"

      - name: Install current local-free qualification dependencies
        run: |
          set -euxo pipefail
          python -m pip install --upgrade pip
          python -m pip install "pytest>=8"
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            build-essential ca-certificates cmake curl libfontconfig1-dev libfreetype6-dev \
            libharfbuzz-dev libjpeg-dev liblcms2-dev libopenjp2-7-dev libpng-dev \
            libtiff-dev ninja-build pkg-config zlib1g-dev

      - name: Prepare exact historical NBU and V7 authority worktrees
        run: |
          set -euxo pipefail
          test "$(git rev-parse HEAD)" = "$HEAD_SHA"

          git fetch --no-tags origin "$NBU_BRANCH"
          test "$(git rev-parse FETCH_HEAD)" = "$NBU_HEAD"
          NBU_ROOT="$RUNNER_TEMP/nbu-historical-$PASS_ID"
          git worktree add --detach "$NBU_ROOT" "$NBU_HEAD"
          test "$(git -C "$NBU_ROOT" rev-parse HEAD)" = "$NBU_HEAD"
          test -z "$(git -C "$NBU_ROOT" status --porcelain=v1 --untracked-files=all)"

          git fetch --no-tags origin "$V7_BRANCH"
          test "$(git rev-parse FETCH_HEAD)" = "$V7_HEAD"
          V7_ROOT="$RUNNER_TEMP/v7-$PASS_ID"
          git worktree add --detach "$V7_ROOT" "$V7_HEAD"
          test "$(git -C "$V7_ROOT" rev-parse HEAD)" = "$V7_HEAD"
          test -z "$(git -C "$V7_ROOT" status --porcelain=v1 --untracked-files=all)"

      - name: Re-qualify exact historical NBU contracts
        run: |
          set -euxo pipefail
          NBU_ROOT="$RUNNER_TEMP/nbu-historical-$PASS_ID"
          (
            cd "$NBU_ROOT"
            PYTHONPATH="$NBU_ROOT/src" python -m pytest -q \
              tests/test_d03_ua_nbu_official_resolutions_intake_v1.py \
              tests/test_d03_ua_nbu_official_pdf_pins_v1.py \
              tests/test_d03_ua_nbu_pdftotext_materialization_v1.py \
              tests/test_d03_ua_nbu_pdftotext_authority_hardening.py
          )

      - name: Execute exact historical bounded live discovery
        run: |
          set -euxo pipefail
          RUN_DIR="$RUNNER_TEMP/nbu-global-dedup-pass-$PASS_ID"
          NBU_ROOT="$RUNNER_TEMP/nbu-historical-$PASS_ID"
          mkdir -p "$RUN_DIR"
          (
            cd "$NBU_ROOT"
            python - "$NBU_ROOT" <<'PY'
          from __future__ import annotations

          import os
          import sys
          import textwrap
          from pathlib import Path

          root = Path(sys.argv[1]).resolve(strict=True)
          workflow = root / ".github/workflows/d03_nbu_pdftotext_real_execution.yml"
          raw = workflow.read_text(encoding="utf-8")
          step = "      - name: Build stable bounded live NBU discovery evidence\n"
          begin = raw.index(step)
          end = raw.index("\n      - name: Pin exact official NBU PDF bytes", begin)
          section = raw[begin:end]
          marker = "        run: |\n          python3 - <<'PY'\n"
          script_begin = section.index(marker) + len(marker)
          script_end = section.rindex("\n          PY")
          script = textwrap.dedent(section[script_begin:script_end])
          os.chdir(root)
          exec(compile(script, str(workflow) + "#exact-discovery-heredoc", "exec"), {"__name__": "__main__"})
          PY
          )
          mv /tmp/nbu-discovery-evidence.json "$RUN_DIR/nbu-discovery-evidence.json"
          mv /tmp/nbu-catalog-pages.json "$RUN_DIR/nbu-catalog-pages.json"

      - name: Build exact pinned Poppler pdftotext
        run: |
          set -euxo pipefail
          curl --fail --location --retry 3 --retry-delay 2 \
            "https://poppler.freedesktop.org/poppler-${POPPLER_VERSION}.tar.xz" \
            --output /tmp/poppler.tar.xz
          echo "${POPPLER_TARBALL_SHA256}  /tmp/poppler.tar.xz" | sha256sum --check --strict
          tar -C /tmp -xf /tmp/poppler.tar.xz
          cmake -S "/tmp/poppler-${POPPLER_VERSION}" -B /tmp/poppler-build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX=/usr/local \
            -DENABLE_UTILS=ON \
            -DENABLE_CPP=OFF \
            -DENABLE_GLIB=OFF \
            -DENABLE_QT5=OFF \
            -DENABLE_QT6=OFF \
            -DENABLE_BOOST=OFF \
            -DENABLE_LIBCURL=OFF \
            -DENABLE_NSS3=OFF \
            -DENABLE_GPGME=OFF \
            -DBUILD_GTK_TESTS=OFF \
            -DBUILD_QT5_TESTS=OFF \
            -DBUILD_QT6_TESTS=OFF \
            -DBUILD_CPP_TESTS=OFF \
            -DBUILD_MANUAL_TESTS=OFF
          cmake --build /tmp/poppler-build --parallel 2
          sudo cmake --install /tmp/poppler-build
          sudo ldconfig
          RUN_DIR="$RUNNER_TEMP/nbu-global-dedup-pass-$PASS_ID"
          pdftotext -v 2>&1 | tee "$RUN_DIR/pdftotext-version.txt"
          grep -F "pdftotext version ${POPPLER_VERSION}" "$RUN_DIR/pdftotext-version.txt"

      - name: Pin PDFs and materialize exact NBU text twice
        run: |
          set -euxo pipefail
          RUN_DIR="$RUNNER_TEMP/nbu-global-dedup-pass-$PASS_ID"
          NBU_ROOT="$RUNNER_TEMP/nbu-historical-$PASS_ID"
          (
            cd "$NBU_ROOT"
            PYTHONPATH="$NBU_ROOT/src" python tools/materialize_d03_ua_nbu_official_pdf_pins_v1.py \
              "$RUN_DIR/nbu-discovery-evidence.json" \
              --output "$RUN_DIR/nbu-pdf-pin-evidence.json"

            PYTHONPATH="$NBU_ROOT/src" python tools/materialize_d03_ua_nbu_pdftotext_v1.py \
              "$RUN_DIR/nbu-discovery-evidence.json" \
              "$RUN_DIR/nbu-pdf-pin-evidence.json" \
              --text-output "$RUN_DIR/nbu-text-a.jsonl" \
              --evidence-output "$RUN_DIR/nbu-text-evidence-a.json"

            PYTHONPATH="$NBU_ROOT/src" python tools/materialize_d03_ua_nbu_pdftotext_v1.py \
              "$RUN_DIR/nbu-discovery-evidence.json" \
              "$RUN_DIR/nbu-pdf-pin-evidence.json" \
              --text-output "$RUN_DIR/nbu-text-b.jsonl" \
              --evidence-output "$RUN_DIR/nbu-text-evidence-b.json"
          )
          cmp "$RUN_DIR/nbu-text-a.jsonl" "$RUN_DIR/nbu-text-b.jsonl"
          cmp "$RUN_DIR/nbu-text-evidence-a.json" "$RUN_DIR/nbu-text-evidence-b.json"
          test "$(sha256sum "$RUN_DIR/nbu-text-a.jsonl" | cut -d' ' -f1)" = "$EXPECTED_CANDIDATE_SHA256"
          python -I - "$RUN_DIR/nbu-text-evidence-a.json" <<'PY'
          import json
          import os
          import sys
          value = json.load(open(sys.argv[1], encoding="utf-8"))
          assert value["evidence_identity_sha256"] == os.environ["EXPECTED_TEXT_EVIDENCE_SHA256"]
          assert value["materialized_records"] == 40
          assert value["observed_text_bytes"] == 794091
          assert value["canonical_capacity_credit_bytes"] == 0
          assert value["model_training_executed"] is False
          PY

      - name: Execute current incumbent indexed global dedup
        run: |
          set -euxo pipefail
          RUN_DIR="$RUNNER_TEMP/nbu-global-dedup-pass-$PASS_ID"
          V7_ROOT="$RUNNER_TEMP/v7-$PASS_ID"
          python tools/run_d03_nbu_global_dedup_execution_v1.py \
            --v7-root "$V7_ROOT" \
            --bulk-workspace "$RUN_DIR/bulk-workspace" \
            --candidate-jsonl "$RUN_DIR/nbu-text-a.jsonl" \
            --materialization-evidence-json "$RUN_DIR/nbu-text-evidence-a.json" \
            --output-report "$RUN_DIR/global-dedup-report.json" \
            --output-survivors "$RUN_DIR/survivor-authority.json" \
            --output-evidence "$RUN_DIR/execution-evidence.json" \
            --expected-execution-head "$HEAD_SHA" \
            --max-candidate-pairs 5000000 \
            --max-index-postings 50000000 \
            --max-pair-expansions 50000000

      - name: Write body-free pass summary
        run: |
          set -euxo pipefail
          RUN_DIR="$RUNNER_TEMP/nbu-global-dedup-pass-$PASS_ID"
          python -I - "$RUN_DIR" <<'PY'
          from __future__ import annotations

          import hashlib
          import json
          import os
          import sys
          from pathlib import Path

          root = Path(sys.argv[1])
          def load(name: str) -> dict:
              value = json.loads((root / name).read_text(encoding="utf-8"))
              assert type(value) is dict
              return value

          discovery_evidence = load("nbu-discovery-evidence.json")
          pdf_pin_evidence = load("nbu-pdf-pin-evidence.json")
          text_evidence = load("nbu-text-evidence-a.json")
          execution = load("execution-evidence.json")
          report = load("global-dedup-report.json")
          survivors = load("survivor-authority.json")
          core = {
              "schema_version": "12-6.d03-nbu-global-dedup-physical-pass.v1",
              "execution_head_sha": os.environ["HEAD_SHA"],
              "pass_id": int(os.environ["PASS_ID"]),
              "historical_nbu_head_sha": os.environ["NBU_HEAD"],
              "v7_head_sha": os.environ["V7_HEAD"],
              "source_materialization": {
                  "discovery_evidence_identity_sha256": discovery_evidence["evidence_identity_sha256"],
                  "pdf_pin_evidence_identity_sha256": pdf_pin_evidence["evidence_identity_sha256"],
                  "candidate_sha256": text_evidence["text_artifact_sha256"],
                  "evidence_identity_sha256": text_evidence["evidence_identity_sha256"],
                  "record_count": text_evidence["materialized_records"],
                  "text_bytes": text_evidence["observed_text_bytes"],
              },
              "global_dedup": {
                  "report_sha256": report["report_sha256"],
                  "survivor_authority_sha256": survivors["survivor_authority_sha256"],
                  "execution_evidence_identity_sha256": execution["evidence_identity_sha256"],
              },
              "truth_boundary": execution["truth_boundary"],
              "raw_text_persisted_in_durable_evidence": False,
          }
          canonical = json.dumps(
              core, ensure_ascii=False, sort_keys=True, separators=(",", ":")
          ).encode("utf-8")
          value = {**core, "summary_identity_sha256": hashlib.sha256(canonical).hexdigest()}
          (root / "physical-pass-summary.json").write_text(
              json.dumps(value, ensure_ascii=False, sort_keys=True, separators=(",", ":")) + "\n",
              encoding="utf-8",
          )
          PY

      - name: Remove raw materialized text before artifact publication
        if: always()
        run: |
          RUN_DIR="$RUNNER_TEMP/nbu-global-dedup-pass-$PASS_ID"
          rm -f "$RUN_DIR/nbu-text-a.jsonl" "$RUN_DIR/nbu-text-b.jsonl"

      - name: Upload body-free pass evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: nbu-global-dedup-pass-${{ matrix.pass }}-${{ github.event.pull_request.head.sha }}
          if-no-files-found: warn
          retention-days: 14
          path: |
            ${{ runner.temp }}/nbu-global-dedup-pass-${{ matrix.pass }}/pdftotext-version.txt
            ${{ runner.temp }}/nbu-global-dedup-pass-${{ matrix.pass }}/nbu-discovery-evidence.json
            ${{ runner.temp }}/nbu-global-dedup-pass-${{ matrix.pass }}/nbu-catalog-pages.json
            ${{ runner.temp }}/nbu-global-dedup-pass-${{ matrix.pass }}/nbu-pdf-pin-evidence.json
            ${{ runner.temp }}/nbu-global-dedup-pass-${{ matrix.pass }}/nbu-text-evidence-a.json
            ${{ runner.temp }}/nbu-global-dedup-pass-${{ matrix.pass }}/nbu-text-evidence-b.json
            ${{ runner.temp }}/nbu-global-dedup-pass-${{ matrix.pass }}/global-dedup-report.json
            ${{ runner.temp }}/nbu-global-dedup-pass-${{ matrix.pass }}/survivor-authority.json
            ${{ runner.temp }}/nbu-global-dedup-pass-${{ matrix.pass }}/execution-evidence.json
            ${{ runner.temp }}/nbu-global-dedup-pass-${{ matrix.pass }}/physical-pass-summary.json

  nbu-global-dedup-audited-pin-replay:
    if: github.event_name == 'pull_request' && github.event.pull_request.number == 2454 && github.head_ref == 'swarm/2398-nbu-indexed-dedup-execution-v1' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      NBU_HEAD: "13be2b000804b410aed7ba759a663408429f60f6"
      NBU_BRANCH: "d03/nbu-pdftotext-materialization-20260907"
      V7_HEAD: "d3333ec1b4a508df232a5aefccd6686adda745fb"
      V7_BRANCH: "next100-065c/crosssource-dedup-v5-20260826"
      HISTORICAL_RUN_ID: "36531989330"
      HISTORICAL_ARTIFACT_ID: "11017211425"
      HISTORICAL_ARTIFACT_ZIP_SHA256: "0993874b3b89ebd9f108c50bc0cb6c66f778c23999f230cc88a3eed893061e60"
      EXPECTED_DISCOVERY_SHA256: "f34f2f86816996397cf7ec4feb9c6e4fa509982c4256f626192944d67dbf33f5"
      EXPECTED_PDF_PIN_SHA256: "1330e82e9bec19d77dff0893daf08f0c4e9b8e1f8c55485380e297176f54c492"
      EXPECTED_TEXT_EVIDENCE_SHA256: "700756dd7afebfbcc663cf503e015ec221e2e9e64717762feda4f8b05610c5a0"
      EXPECTED_CANDIDATE_SHA256: "bf48a0b540a1c069a6afa14f5ea24077aeea466a0f376c94c902ea175e7037d2"
      POPPLER_VERSION: "25.06.0"
      POPPLER_TARBALL_SHA256: "8199532d38984fab46dbd0020ec9c40f20e928e33e9b4cc6043572603a821d83"

    steps:
      - name: Checkout exact execution carrier head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"

      - name: Install current local-free qualification dependencies
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$HEAD_SHA"
          python -m pip install --upgrade pip
          python -m pip install "pytest>=8" "ruff>=0.12"
          ruff check src/twelve_six/data/nbu_dedup_intake.py tests/test_nbu_dedup_intake.py tests/test_d03_nbu_global_dedup_execution_v1.py
          PYTHONPATH="$GITHUB_WORKSPACE/src:$GITHUB_WORKSPACE/tools" \
            pytest -q tests/test_nbu_dedup_intake.py tests/test_d03_nbu_global_dedup_execution_v1.py
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            build-essential ca-certificates cmake curl libfontconfig1-dev libfreetype6-dev \
            libharfbuzz-dev libjpeg-dev liblcms2-dev libopenjp2-7-dev libpng-dev \
            libtiff-dev ninja-build pkg-config unzip zlib1g-dev

      - name: Download exact audited body-free NBU artifact by ID
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          RUN_DIR="$RUNNER_TEMP/nbu-audited-pin-replay"
          mkdir -p "$RUN_DIR/historical-artifact"
          curl --fail --location --retry 3 --retry-delay 2 \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${HISTORICAL_ARTIFACT_ID}/zip" \
            --output "$RUN_DIR/historical-artifact.zip"
          echo "${HISTORICAL_ARTIFACT_ZIP_SHA256}  $RUN_DIR/historical-artifact.zip" | sha256sum --check --strict
          unzip -q "$RUN_DIR/historical-artifact.zip" -d "$RUN_DIR/historical-artifact"
          test -f "$RUN_DIR/historical-artifact/nbu-discovery-evidence.json"
          test -f "$RUN_DIR/historical-artifact/nbu-pdf-pin-evidence.json"
          test -f "$RUN_DIR/historical-artifact/nbu-text-evidence-a.json"
          test ! -e "$RUN_DIR/historical-artifact/nbu-text-a.jsonl"
          test ! -e "$RUN_DIR/historical-artifact/nbu-text-b.jsonl"

      - name: Verify exact historical body-free evidence identities
        run: |
          set -euo pipefail
          RUN_DIR="$RUNNER_TEMP/nbu-audited-pin-replay"
          python -I - "$RUN_DIR/historical-artifact" <<'PY'
          import hashlib
          import json
          import os
          import sys
          from pathlib import Path

          root = Path(sys.argv[1])
          expected = {
              "nbu-discovery-evidence.json": os.environ["EXPECTED_DISCOVERY_SHA256"],
              "nbu-pdf-pin-evidence.json": os.environ["EXPECTED_PDF_PIN_SHA256"],
              "nbu-text-evidence-a.json": os.environ["EXPECTED_TEXT_EVIDENCE_SHA256"],
          }
          for name, identity in expected.items():
              value = json.loads((root / name).read_text(encoding="utf-8"))
              assert type(value) is dict
              observed = value.get("evidence_identity_sha256")
              assert observed == identity
              core = dict(value)
              core.pop("evidence_identity_sha256")
              payload = (
                  json.dumps(
                      core,
                      ensure_ascii=False,
                      sort_keys=True,
                      separators=(",", ":"),
                      allow_nan=False,
                  )
                  + "\n"
              ).encode("utf-8")
              assert hashlib.sha256(payload).hexdigest() == identity
          text = json.loads((root / "nbu-text-evidence-a.json").read_text(encoding="utf-8"))
          assert text["text_artifact_sha256"] == os.environ["EXPECTED_CANDIDATE_SHA256"]
          assert text["materialized_records"] == 40
          assert text["observed_text_bytes"] == 794091
          PY

      - name: Prepare exact historical NBU and V7 authority worktrees
        run: |
          set -euo pipefail
          git fetch --no-tags origin "$NBU_BRANCH"
          test "$(git rev-parse FETCH_HEAD)" = "$NBU_HEAD"
          NBU_ROOT="$RUNNER_TEMP/nbu-historical-audited-pin"
          git worktree add --detach "$NBU_ROOT" "$NBU_HEAD"
          test "$(git -C "$NBU_ROOT" rev-parse HEAD)" = "$NBU_HEAD"

          git fetch --no-tags origin "$V7_BRANCH"
          test "$(git rev-parse FETCH_HEAD)" = "$V7_HEAD"
          V7_ROOT="$RUNNER_TEMP/v7-audited-pin"
          git worktree add --detach "$V7_ROOT" "$V7_HEAD"
          test "$(git -C "$V7_ROOT" rev-parse HEAD)" = "$V7_HEAD"

      - name: Build exact pinned Poppler pdftotext
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --retry-delay 2 \
            "https://poppler.freedesktop.org/poppler-${POPPLER_VERSION}.tar.xz" \
            --output /tmp/poppler-audited-pin.tar.xz
          echo "${POPPLER_TARBALL_SHA256}  /tmp/poppler-audited-pin.tar.xz" | sha256sum --check --strict
          tar -C /tmp -xf /tmp/poppler-audited-pin.tar.xz
          cmake -S "/tmp/poppler-${POPPLER_VERSION}" -B /tmp/poppler-audited-pin-build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX=/usr/local \
            -DENABLE_UTILS=ON -DENABLE_CPP=OFF -DENABLE_GLIB=OFF \
            -DENABLE_QT5=OFF -DENABLE_QT6=OFF -DENABLE_BOOST=OFF \
            -DENABLE_LIBCURL=OFF -DENABLE_NSS3=OFF -DENABLE_GPGME=OFF \
            -DBUILD_GTK_TESTS=OFF -DBUILD_QT5_TESTS=OFF -DBUILD_QT6_TESTS=OFF \
            -DBUILD_CPP_TESTS=OFF -DBUILD_MANUAL_TESTS=OFF
          cmake --build /tmp/poppler-audited-pin-build --parallel 2
          sudo cmake --install /tmp/poppler-audited-pin-build
          sudo ldconfig
          pdftotext -v 2>&1 | grep -F "pdftotext version ${POPPLER_VERSION}"

