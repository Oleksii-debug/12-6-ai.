          from __future__ import annotations

          import hashlib
          import importlib.util
          import json
          import sys
          from pathlib import Path

          root = Path(sys.argv[1])
          evidence_path = Path(sys.argv[2])
          tool = root / "tools/_materialize_d03_ua_nbu_pdftotext_v1_impl.py"
          spec = importlib.util.spec_from_file_location("nbu_pdftotext_probe", tool)
          if spec is None or spec.loader is None:
              raise RuntimeError("cannot load exact historical NBU materializer")
          module = importlib.util.module_from_spec(spec)
          sys.modules[spec.name] = module
          spec.loader.exec_module(module)
          config = module.load_config()
          evidence = json.loads(evidence_path.read_text(encoding="utf-8"))
          pins = module.validate_pin_evidence(evidence, config)
          url = sorted(pins)[0]
          pin = pins[url]
          raw = module.network_fetch_pdf(url, int(pin["pdf_bytes"]), config)
          if hashlib.sha256(raw).hexdigest() != pin["pdf_sha256"]:
              raise RuntimeError("pinned PDF preflight SHA drift")
          print(
              "PINNED_PDF_ACCESS_PASS "
              f"url={url} bytes={len(raw)} sha256={pin['pdf_sha256']}"
          )
          PY
