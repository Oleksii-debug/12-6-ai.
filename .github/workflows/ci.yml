              "status": "AUDITED_PIN_REPLAY_GLOBAL_DEDUP_ZERO_CREDIT",
              "execution_head_sha": os.environ["HEAD_SHA"],
              "historical_materialization_run_id": int(os.environ["HISTORICAL_RUN_ID"]),
              "historical_materialization_artifact_id": int(os.environ["HISTORICAL_ARTIFACT_ID"]),
              "historical_artifact_zip_sha256": os.environ["HISTORICAL_ARTIFACT_ZIP_SHA256"],
              "fresh_catalog_discovery_executed": False,
              "historical_discovery_evidence_identity_sha256": os.environ["EXPECTED_DISCOVERY_SHA256"],
              "historical_pdf_pin_evidence_identity_sha256": os.environ["EXPECTED_PDF_PIN_SHA256"],
              "fresh_pinned_pdf_text_materialization_executed": True,
              "candidate_sha256": text["text_artifact_sha256"],
              "materialized_records": text["materialized_records"],
              "observed_text_bytes": text["observed_text_bytes"],
              "matcher_report_sha256": report["report_sha256"],
              "survivor_authority_sha256": survivors["survivor_authority_sha256"],
              "execution_evidence_identity_sha256": execution["evidence_identity_sha256"],
              "truth_boundary": execution["truth_boundary"],
              "raw_text_persisted_in_durable_evidence": False,
          }
          assert core["candidate_sha256"] == os.environ["EXPECTED_CANDIDATE_SHA256"]
          value = {
              **core,
              "summary_identity_sha256": hashlib.sha256(
                  json.dumps(core, ensure_ascii=False, sort_keys=True, separators=(",", ":")).encode("utf-8")
              ).hexdigest(),
