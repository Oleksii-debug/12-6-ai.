name: CI
on:
  push:
    branches: [main]
  pull_request:
    paths-ignore:
      - "docs/**"
      - "reports/**"
      - "**/*.md"

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      run_arm: ${{ steps.scope.outputs.run_arm }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11.16"
      - name: Enforce workflow queue policy
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: >-
          PYTHONPATH=src python tools/check_workflow_queue_policy.py
          --base-sha "$BASE_SHA"
          --head-sha "$HEAD_SHA"
      - name: Dependency and tool preflight before tests
        env:
          SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: >-
          python tools/ci_dependency_preflight.py
          --profile linux-x86_64
          --source-sha "$SOURCE_SHA"
          --output ci-dependency-preflight.json
      - id: scope
        name: Classify portability-sensitive changes
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          run_arm=true
          if [[ "$BASE_SHA" =~ ^[0-9a-f]{40}$ ]] && [[ ! "$BASE_SHA" =~ ^0+$ ]]; then
            git diff --name-only "$BASE_SHA" "$HEAD_SHA" > changed-paths.txt
            if ! grep -Eq '^(requirements/|pyproject\.toml$|src/twelve_six/integration/dependency_lock\.py$|tools/verify_locked_environment\.py$|\.github/workflows/ci\.yml$)' changed-paths.txt; then
              run_arm=false
            fi
          fi
          echo "run_arm=$run_arm" >> "$GITHUB_OUTPUT"
          cat changed-paths.txt 2>/dev/null || true

  locked-x86-64:
    needs: preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Scan Git history for secrets
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: "false"
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "false"
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11.16"
      - name: Locked clean install, package smoke and full checks
        run: >-
          python tools/verify_locked_environment.py
          --profile linux-x86_64
          --source-sha "${{ github.event.pull_request.head.sha || github.sha }}"
          --evidence-out locked-environment-linux-x86_64.json
          --run-repo-checks
      - name: Upload locked environment evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: locked-environment-linux-x86_64
          path: locked-environment-linux-x86_64.json
          if-no-files-found: error
          retention-days: 30

  locked-arm64:
    needs: preflight
    if: needs.preflight.outputs.run_arm == 'true'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11.16"
      - name: Locked clean install and package smoke
        run: >-
          python tools/verify_locked_environment.py
          --profile linux-aarch64
          --source-sha "${{ github.event.pull_request.head.sha || github.sha }}"
          --evidence-out locked-environment-linux-aarch64.json
      - name: Upload locked environment evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: locked-environment-linux-aarch64
          path: locked-environment-linux-aarch64.json
          if-no-files-found: error
          retention-days: 30
