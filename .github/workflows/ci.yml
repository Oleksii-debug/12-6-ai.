name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
  actions: read
jobs:
  locked-x86-64:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Scan Git history for secrets
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: "false"
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "false"
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11.16"
      - name: Locked clean install, package smoke and full checks
        run: >-
          python tools/verify_locked_environment.py
          --profile linux-x86_64
          --source-sha "${{ github.event.pull_request.head.sha || github.sha }}"
          --evidence-out locked-environment-linux-x86_64.json
          --run-repo-checks
      - name: Upload locked environment evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: locked-environment-linux-x86_64
          path: locked-environment-linux-x86_64.json
          if-no-files-found: error
          retention-days: 30

  locked-arm64:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11.16"
      - name: Locked clean install and package smoke
        run: >-
          python tools/verify_locked_environment.py
          --profile linux-aarch64
          --source-sha "${{ github.event.pull_request.head.sha || github.sha }}"
          --evidence-out locked-environment-linux-aarch64.json
      - name: Upload locked environment evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: locked-environment-linux-aarch64
          path: locked-environment-linux-aarch64.json
          if-no-files-found: error
          retention-days: 30

  verify218-exact-artifact:
    if: github.event_name == 'pull_request' && github.head_ref == 'verify218/learned-10m-independent-20260826'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      PYTHONPATH: src
      VERIFY218_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      PRODUCER_SHA: c02c8aa38e691521ae2ab6a4ff3ea1d643efd6ef
      PRODUCER_ARTIFACT_ID: "9602650341"
      PRODUCER_ARTIFACT_ZIP_SHA256: 8631e90417e40365b3fc0d6bc98ee6adda5a4ed24530e675d9a91c93219537ee
    steps:
      - name: Checkout exact verifier head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.11.16"
      - name: Universal exact execution bootstrap
        uses: ./.github/actions/execution-bootstrap
        with:
          capabilities: runtime,tests,lint
          venv: .verify218
          manifest: reports/verify218/environment.json
          command: python -m pytest -q tests/test_verify218_learned_10m.py tests/test_verify218_authority_bridge.py
      - name: Bind exact verifier source and no-training surface
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$VERIFY218_HEAD_SHA"
          test "$VERIFY218_HEAD_SHA" != "$PRODUCER_SHA"
          .verify218/bin/ruff check \
            src/twelve_six/verify218_learned_10m.py \
            src/twelve_six/verify218_resume_probe.py \
            src/twelve_six/verify218_authority_bridge.py \
            tests/test_verify218_learned_10m.py \
            tests/test_verify218_authority_bridge.py
          .verify218/bin/python -m compileall -q \
            src/twelve_six/verify218_learned_10m.py \
            src/twelve_six/verify218_resume_probe.py \
            src/twelve_six/verify218_authority_bridge.py \
            tests/test_verify218_learned_10m.py \
            tests/test_verify218_authority_bridge.py
          if grep -En '\b(Trainer|optimizer\.step|backward|save_checkpoint|save_trainer_checkpoint)\b' src/twelve_six/verify218_learned_10m.py; then
            echo "VERIFY-218 scientific evaluator must contain no trainer or update path" >&2
            exit 1
          fi
          if grep -En '(optimizer\.step|scheduler\.step|\.backward\(|train_microbatch\(|trainer\.run\()' \
            src/twelve_six/verify218_resume_probe.py src/twelve_six/verify218_authority_bridge.py; then
            echo "VERIFY-218 recovery/authority probes must restore only and never update" >&2
            exit 1
          fi
      - name: Download exact immutable LEARN-217 artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p learned-artifacts/zips learned-artifacts/learn217 reports/verify218
          gh api "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${PRODUCER_ARTIFACT_ID}/zip" > learned-artifacts/zips/learn217.zip
          echo "${PRODUCER_ARTIFACT_ZIP_SHA256}  learned-artifacts/zips/learn217.zip" | sha256sum -c -
          unzip -q learned-artifacts/zips/learn217.zip -d learned-artifacts/learn217
      - name: Execute independent scientific verifier
        run: |
          set -euo pipefail
          .verify218/bin/python -m twelve_six.verify218_learned_10m \
            --repo-root . \
            --artifact-root learned-artifacts/learn217 \
            --verifier-head-sha "$VERIFY218_HEAD_SHA" \
            --output reports/verify218/detailed-authority.json
      - name: Execute recovery and terminal authority bridge
        run: |
          set -euo pipefail
          .verify218/bin/python -m twelve_six.verify218_authority_bridge \
            --detailed reports/verify218/detailed-authority.json \
            --artifact-root learned-artifacts/learn217 \
            --output reports/verify218/authority.json
      - name: Enforce terminal authority contract
        run: |
          set -euo pipefail
          .verify218/bin/python - <<'PY'
          import json
          from pathlib import Path
          from twelve_six.checkpoint import hash_json

          value = json.loads(Path('reports/verify218/authority.json').read_text(encoding='utf-8'))
          supplied = value.pop('identity_sha256')
          assert supplied == hash_json(value)
          assert value['worker_id'] == 'VERIFY-218-LEARNED-10M-INDEPENDENT'
          assert value['status'] == 'VERIFIED_LEARNED_10M'
          assert value['verified_learned_10m'] is True
          assert value['producer']['git_sha'] == 'c02c8aa38e691521ae2ab6a4ff3ea1d643efd6ef'
          assert value['producer']['artifact_id'] == 9602650341
          assert value['producer']['artifact_zip_sha256'] == '8631e90417e40365b3fc0d6bc98ee6adda5a4ed24530e675d9a91c93219537ee'
          assert value['model']['parameter_count'] == 10000640
          assert value['model']['model_spec_sha256'] == '61caa5469123e23b9b72fc2024140bfca84c4c480dcb0a7e712ba800a4f22998'
          assert value['corpus_identity_sha256'] == '422f545da93526ceba2c0ff738e0b9deac65f35bfb31d87d2aab068cda091fc8'
          assert value['source']['artifact_id'] == 9602650341
          assert value['source']['workflow_run_id'] == 32952787070
          for gate in (
              'checkpoint_integrity',
              'fresh_process_resume',
              'finite_first_party_logits',
              'heldout_bpb',
              'evaluation_non_mutation',
              'greedy_generation',
              'best_final_role_resolution',
          ):
              assert value['gates'][gate] is True
          assert value['fresh_process_resume']['training_executed'] is False
          assert value['fresh_process_resume']['optimizer_updates'] == 0
          assert value['boundaries']['training_executed'] is False
          assert value['boundaries']['optimizer_updates'] == 0
          assert value['boundaries']['paid_compute'] is False
          assert value['boundaries']['foreign_pretrained_weights'] is False
          assert value['boundaries']['evaluation_mutated_model'] is False
          print(supplied)
          PY
      - name: Upload independent VERIFY-218 authority
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: verify218-learned-10m-independent
          if-no-files-found: warn
          retention-days: 30
          path: |
            reports/verify218/environment.json
            reports/verify218/detailed-authority.json
            reports/verify218/authority.json
