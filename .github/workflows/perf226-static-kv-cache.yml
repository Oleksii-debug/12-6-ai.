name: PERF-226 Static KV Cache V1

on:
  push:
    branches: [perf226/static-kv-cache-v1-20260826]
  workflow_dispatch:

concurrency:
  group: perf226-static-kv-${{ github.ref }}
  cancel-in-progress: true

permissions: {contents: read}

jobs:
  local-free-cpu:
    runs-on: ubuntu-24.04
    env:
      PYTHONPATH: src
      PERF226_EXECUTION_PROFILE: LOCAL_FREE
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: "${{ github.sha }}"
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with: {python-version: "3.11.16"}

      - name: Universal bootstrap exact CPU runtime tests and lint
        uses: ./.github/actions/execution-bootstrap
        with:
          capabilities: runtime,tests,lint
          venv: .perf226-cpu
          command: >-
            python -m pytest -q tests/test_static_kv_cache.py
            tests/test_kv_cache_generation.py tests/test_cached_batched_generation.py
          manifest: reports/perf226/environment.json

      - name: Verify LOCAL_FREE CPU-only bootstrap boundary
        run: |
          set -euo pipefail
          .perf226-cpu/bin/python - <<'PY'
          import json
          from pathlib import Path
          import torch

          manifest = json.loads(Path('reports/perf226/environment.json').read_text())
          assert manifest['preflight']['status'] == 'PASS'
          assert manifest['plan']['capabilities'] == ['runtime', 'tests', 'lint']
          assert manifest['plan']['cuda_packages_present'] is False
          assert torch.__version__ == '2.13.0+cpu'
          assert torch.version.cuda is None
          assert torch.cuda.is_available() is False
          print(json.dumps({'bootstrap': 'PASS', 'profile': 'LOCAL_FREE', 'device': 'cpu'}))
          PY

      - name: Run static KV parity and retained dynamic-cache regressions
        run: >-
          .perf226-cpu/bin/python -m pytest -q
          tests/test_static_kv_cache.py
          tests/test_kv_cache_generation.py
          tests/test_cached_batched_generation.py

      - name: Prove accepted static module contains no torch.cat cache growth
        run: |
          set -euo pipefail
          if grep -n "torch\.cat" src/twelve_six/inference/static_kv.py; then
            echo "accepted static KV module must not contain torch.cat" >&2
            exit 1
          fi

      - name: Ruff focused implementation
        run: >-
          .perf226-cpu/bin/ruff check
          src/twelve_six/inference/static_kv.py
          src/twelve_six/integration/s0_runtime.py
          src/twelve_six/integration/torch_batching.py
          tests/test_static_kv_cache.py
          tests/test_cached_batched_generation.py
          tools/benchmark_static_kv_cache.py

      - name: Measure cache bytes allocation growth model work and CPU decode
        run: >-
          .perf226-cpu/bin/python tools/benchmark_static_kv_cache.py
          --repetitions 7
          --output reports/perf226/static_kv_benchmark.json

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: perf226-static-kv-local-free
          path: |
            reports/perf226/environment.json
            reports/perf226/static_kv_benchmark.json
          if-no-files-found: warn
