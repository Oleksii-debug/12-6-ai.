name: TRAIN-43-45 Stability Study

on:
  pull_request:

permissions:
  contents: read

jobs:
  locked-local-free-stability-study:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Prove exact source checkout
        env:
          SOURCE_SHA: ${{ github.event.pull_request.head.sha }}
        run: test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11.16"
      - name: Verify exact D08 locked environment and repository checks
        env:
          SOURCE_SHA: ${{ github.event.pull_request.head.sha }}
        run: >-
          python tools/verify_locked_environment.py
          --profile linux-x86_64
          --source-sha "$SOURCE_SHA"
          --evidence-out locked-environment-linux-x86_64.json
          --run-repo-checks
      - name: Create exact locked experiment environment
        run: |
          python -m venv .train43-45-locked
          .train43-45-locked/bin/python -m pip install --disable-pip-version-check --require-hashes --no-deps -r requirements/locks/linux-x86_64/toolchain.lock.txt
          .train43-45-locked/bin/python -m pip install --disable-pip-version-check --require-hashes --no-deps -r requirements/locks/linux-x86_64/runtime.lock.txt
          PIP_NO_INDEX=1 PIP_DISABLE_PIP_VERSION_CHECK=1 .train43-45-locked/bin/python -m pip install --no-deps --no-build-isolation -e .
          .train43-45-locked/bin/python -c "import torch,twelve_six; print(torch.__version__, twelve_six.__version__)"
      - name: Run focused TRAIN-43-45 tests
        run: .train43-45-locked/bin/python -m pytest -q tests/test_stability_schedule_experiments.py
      - name: Execute S1 and S2 warmup then clipping study
        env:
          SOURCE_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          .train43-45-locked/bin/python tools/run_train43_45_stability.py \
            --source-sha "$SOURCE_SHA" \
            --locked-environment-evidence locked-environment-linux-x86_64.json \
            --plan configs/runs/train43_45_stability.experimental.json \
            --output train43-45-stability-evidence.json \
            --summary-output train43-45-stability-summary.json
      - name: Show retained summary
        run: cat train43-45-stability-summary.json
      - name: Upload stability evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: train43-45-stability-evidence
          path: |
            locked-environment-linux-x86_64.json
            train43-45-stability-evidence.json
            train43-45-stability-summary.json
          if-no-files-found: error
          retention-days: 30
