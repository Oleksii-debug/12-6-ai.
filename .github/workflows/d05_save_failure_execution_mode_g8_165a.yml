name: D05 save failure execution-mode seal G8-165a

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  focused-linux:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exact qualification carrier
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 2

      - name: Set exact CPython 3.11.16
        uses: actions/setup-python@v5
        with:
          python-version: "3.11.16"
          cache: pip

      - name: Bind exact source and focused closure
        env:
          SOURCE_SHA: 32b6711810a5d9728b5ccf64b3b4848fe699754c
          TRAINER_ADAPTER_BLOB: fa35d377ba68ce6fac50780b8443875824e22447
          PROGRESS_TRAINER_BLOB: 194549e472e4973e69d56d4b03710f10e65c739e
          TEST_BLOB: edd84b3905003af10f7b01c5c90aed2354993962
        run: |
          set -euxo pipefail
          test "$(git rev-parse HEAD^)" = "$SOURCE_SHA"
          test "$(git hash-object src/twelve_six/checkpoint/trainer_adapter.py)" = "$TRAINER_ADAPTER_BLOB"
          test "$(git hash-object src/twelve_six/checkpoint/progress_trainer.py)" = "$PROGRESS_TRAINER_BLOB"
          test "$(git hash-object tests/test_checkpoint_rng_completeness_d02.py)" = "$TEST_BLOB"

      - name: Install focused test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Compile focused Python paths
        run: |
          python -m py_compile \
            src/twelve_six/checkpoint/trainer_adapter.py \
            src/twelve_six/checkpoint/progress_trainer.py \
            tests/test_checkpoint_rng_completeness_d02.py

      - name: Lint exact stacked closure
        run: |
          python -m ruff check \
            src/twelve_six/checkpoint/trainer_adapter.py \
            src/twelve_six/checkpoint/progress_trainer.py \
            tests/test_checkpoint_rng_completeness_d02.py

      - name: Execute checkpoint execution-mode regressions
        run: |
          python -m pytest -q tests/test_checkpoint_rng_completeness_d02.py

      - name: Prove carrier remains clean
        run: |
          test -z "$(git status --porcelain)"
