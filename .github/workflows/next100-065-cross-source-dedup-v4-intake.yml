name: NEXT100-065 Cross-Source Dedup V4 Intake

on:
  pull_request:
    paths:
      - ".github/workflows/next100-065-cross-source-dedup-v4-intake.yml"
      - "configs/data/next100_065_cross_source_dedup_v4_intake_v1.json"
      - "configs/data/next100_063_source_registry_convergence_v1.json"
      - "docs/NEXT100_065_CROSS_SOURCE_DEDUP_V4_INTAKE.md"
      - "src/twelve_six/data/cross_source_dedup_v4_intake.py"
      - "tests/test_next100_065_cross_source_dedup_v4_intake.py"
      - "tools/validate_next100_065_cross_source_dedup_v4_intake.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  object-level-handoff:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      TWELVE_SIX_EXECUTION_PROFILE: LOCAL_FREE
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Prove exact source checkout
        env:
          EXPECTED_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SOURCE_SHA"

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11.16"

      - name: Universal exact LOCAL_FREE bootstrap
        uses: ./.github/actions/execution-bootstrap
        with:
          capabilities: runtime,tests,lint
          venv: .next100-065-v4
          command: python -m pytest -q tests/test_next100_065_cross_source_dedup_v4_intake.py
          manifest: next100-065-v4-execution-environment.json

      - name: Compile focused implementation
        run: >-
          PYTHONPATH=src .next100-065-v4/bin/python -m compileall -q
          src/twelve_six/data/cross_source_dedup_v4_intake.py
          tools/validate_next100_065_cross_source_dedup_v4_intake.py

      - name: Focused regression tests
        run: >-
          PYTHONPATH=src .next100-065-v4/bin/python -m pytest -q
          tests/test_next100_065_cross_source_dedup_v4_intake.py

      - name: Focused lint
        run: >-
          .next100-065-v4/bin/ruff check --select E4,E9,F
          src/twelve_six/data/cross_source_dedup_v4_intake.py
          tools/validate_next100_065_cross_source_dedup_v4_intake.py
          tests/test_next100_065_cross_source_dedup_v4_intake.py

      - name: Materialize deterministic intake report twice
        env:
          PYTHONPATH: src
        run: |
          mkdir -p evidence/next100_065_v4/a evidence/next100_065_v4/b
          .next100-065-v4/bin/python tools/validate_next100_065_cross_source_dedup_v4_intake.py \
            --expect-status BLOCKED_UPSTREAM_SOURCE_CONVERGENCE_NONTERMINAL \
            > evidence/next100_065_v4/a/report.json
          .next100-065-v4/bin/python tools/validate_next100_065_cross_source_dedup_v4_intake.py \
            --expect-status BLOCKED_UPSTREAM_SOURCE_CONVERGENCE_NONTERMINAL \
            > evidence/next100_065_v4/b/report.json
          cmp evidence/next100_065_v4/a/report.json evidence/next100_065_v4/b/report.json

      - name: Verify exact object handoff and no-training boundary
        run: |
          .next100-065-v4/bin/python - <<'PY'
          import json
          from pathlib import Path

          report = json.loads(Path("evidence/next100_065_v4/a/report.json").read_text())
          assert report["status"] == "BLOCKED_UPSTREAM_SOURCE_CONVERGENCE_NONTERMINAL"
          assert report["blockers"] == ["upstream_source_convergence_ci_not_terminal_success"]
          assert report["validated_positive_credit_authority_count"] == 4
          assert report["validated_object_manifest_count"] == 4
          assert report["validated_object_count"] == 11
          assert report["validated_object_capacity_bytes"] == 76662
          assert report["post_dedup_capacity_claimed"] is False
          assert report["corpus_identity_claimed"] is False
          assert report["tokenizer_fit_authorized"] is False
          assert report["training_authorized"] is False
          PY

      - name: Upload immutable V4 intake evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: next100-065-v4-intake-${{ github.event.pull_request.head.sha || github.sha }}
          if-no-files-found: error
          retention-days: 90
          path: |
            configs/data/next100_065_cross_source_dedup_v4_intake_v1.json
            next100-065-v4-execution-environment.json
            evidence/next100_065_v4/a/report.json
