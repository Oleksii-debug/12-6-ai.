name: DATA-526 V8 evidence finalizer temporary

on:
  pull_request:
    paths:
      - ".github/workflows/data526-v8-evidence-finalizer-temporary.yml"

concurrency:
  group: data526-v8-evidence-finalizer-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

permissions:
  actions: read
  contents: write

jobs:
  finalize-existing-success:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      TWELVE_SIX_EXECUTION_PROFILE: LOCAL_FREE
      GITHUB_TOKEN: ${{ github.token }}
      SCIENTIFIC_HEAD: da0d4cd32a08774967fed97592a1add29da51daf
      SCIENTIFIC_RUN: "34344420230"
      ARTIFACT_ID: "10101207959"
      ARTIFACT_DIGEST: 2fdb61fc82061ab20c6fac372fa59968ffd2b43afad2e6ad9835c20320b687c0
      INVENTORY_SHA256: ff56b94c5afbe463ad403a629d17303d031e10d298d3c75496f5006ca209a0b3
      EVIDENCE_SHA256: 020aa304e34df473952448ca3851a64960d704a2058de7d96745dfef94361f3d
      CONFIG_SHA256: e747c2875b224c7d30ca7afb5eb7eaf3dd3dd4dc4ebbc447c8af20d8416f0664
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1
          persist-credentials: true

      - name: Validate immutable successful scientific run and artifact metadata
        run: |
          set -euo pipefail
          curl --fail --silent --show-error \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/runs/${SCIENTIFIC_RUN}" \
            -o /tmp/run.json
          curl --fail --silent --show-error \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${ARTIFACT_ID}" \
            -o /tmp/artifact.json
          python - <<'PY'
          import json, os
          from pathlib import Path
          run = json.loads(Path('/tmp/run.json').read_text())
          artifact = json.loads(Path('/tmp/artifact.json').read_text())
          assert run['id'] == int(os.environ['SCIENTIFIC_RUN'])
          assert run['head_sha'] == os.environ['SCIENTIFIC_HEAD']
          assert run['status'] == 'completed'
          assert run['conclusion'] == 'success'
          assert run['event'] == 'pull_request'
          assert artifact['id'] == int(os.environ['ARTIFACT_ID'])
          assert artifact['name'] == f"data526-v8-record-composition-{os.environ['SCIENTIFIC_HEAD']}"
          assert artifact['digest'] == f"sha256:{os.environ['ARTIFACT_DIGEST']}"
          assert artifact['expired'] is False
          assert artifact['workflow_run']['id'] == int(os.environ['SCIENTIFIC_RUN'])
          assert artifact['workflow_run']['head_sha'] == os.environ['SCIENTIFIC_HEAD']
          PY

      - name: Download and verify exact text-free artifact members
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${ARTIFACT_ID}/zip" \
            -o /tmp/data526-v8.zip
          test "$(sha256sum /tmp/data526-v8.zip | cut -d' ' -f1)" = "$ARTIFACT_DIGEST"
          rm -rf /tmp/data526-v8-artifact
          mkdir -p /tmp/data526-v8-artifact
          unzip -q /tmp/data526-v8.zip -d /tmp/data526-v8-artifact
          test "$(sha256sum /tmp/data526-v8-artifact/evidence/data526/v8/record_inventory.json | cut -d' ' -f1)" = "$INVENTORY_SHA256"
          test "$(sha256sum /tmp/data526-v8-artifact/evidence/data526/v8/materialization_evidence.json | cut -d' ' -f1)" = "$EVIDENCE_SHA256"
          test "$(sha256sum /tmp/data526-v8-artifact/configs/data/data526_v8_record_composition_v1.json | cut -d' ' -f1)" = "$CONFIG_SHA256"
          cmp configs/data/data526_v8_record_composition_v1.json /tmp/data526-v8-artifact/configs/data/data526_v8_record_composition_v1.json
          mkdir -p evidence/data526/v8
          cp /tmp/data526-v8-artifact/evidence/data526/v8/record_inventory.json evidence/data526/v8/record_inventory.json
          cp /tmp/data526-v8-artifact/evidence/data526/v8/materialization_evidence.json evidence/data526/v8/materialization_evidence.json

      - name: Create durable run receipt and fail-closed regression
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          receipt = {
              'schema_version': '12-6.data526-v8-terminal-materialization.v1',
              'worker_id': 'DATA-526-CURRENT-MAIN-V8-RECORD-COMPOSER',
              'issue': 896,
              'pull_request': 924,
              'execution_profile': 'LOCAL_FREE',
              'scientific_execution_head_sha': 'da0d4cd32a08774967fed97592a1add29da51daf',
              'workflow_run_id': 34344420230,
              'workflow_conclusion': 'success',
              'artifact': {
                  'id': 10101207959,
                  'name': 'data526-v8-record-composition-da0d4cd32a08774967fed97592a1add29da51daf',
                  'digest': 'sha256:2fdb61fc82061ab20c6fac372fa59968ffd2b43afad2e6ad9835c20320b687c0',
                  'record_inventory_file_sha256': 'ff56b94c5afbe463ad403a629d17303d031e10d298d3c75496f5006ca209a0b3',
                  'materialization_evidence_file_sha256': '020aa304e34df473952448ca3851a64960d704a2058de7d96745dfef94361f3d',
                  'execution_config_file_sha256': 'e747c2875b224c7d30ca7afb5eb7eaf3dd3dd4dc4ebbc447c8af20d8416f0664',
              },
              'execution': {
                  'independent_materializations': 2,
                  'historical_record_graphs_byte_identical': True,
                  'fresh_bulk_reports_byte_identical': True,
                  'composed_records_inventories_and_evidence_byte_identical': True,
                  'text_free_public_evidence_only': True,
              },
              'result': {
                  'record_count': 275,
                  'source_object_count': 262,
                  'total_payload_bytes': 6095321,
                  'record_payload_jsonl_sha256': '18a933b2e637b4cff497f4acfbff31041d4c0ba21fba397af53d213edfd7a1b7',
                  'record_inventory_digest_sha256': '766cc01d610373183e73a632e18674b1d7afc5aaa7e3888638029e0044b26103',
                  'payload_inventory_digest_sha256': '56ef7a457f4c4f649ad97359c2a177131632d838756d769e4b1a2ec3f3a2a278',
                  'materialization_evidence_identity_sha256': 'cd50f0af39c549d4dd543ccb2323106e3ee2a945025b85115ea06c1abf55eefa',
                  'v8_report_sha256': '942cc15af60ee36a79345beba77fec347e33ee919d8148fb319b19d9ee072e5a',
                  'v8_survivor_authority_sha256': '8115b35662fa89900b37f54f7cffd5f2fa8b2f8c60a72bcb18b89c92aaade0cf',
              },
              'claim_boundary': {
                  'exact_record_materialization_terminal': True,
                  'pre_decontamination_record_authority_only': True,
                  'raw_payloads_committed_to_repository': False,
                  'decontamination_executed': False,
                  'tokenizer_fit_executed': False,
                  'authorized_unique_optimized_targets': 0,
                  'optimizer_updates': 0,
                  'training_executed': False,
                  'final_test_payload_accessed': False,
                  'paid_compute_used': False,
              },
              'required_successors': [
                  'fresh_reserved_evaluation_decontamination',
                  'post_composition_quality_privacy',
                  'balance_and_family_caps',
                  'cluster_safe_split',
                  'deterministic_packing_and_two_clean_builds',
                  'positive_exact_post_pack_unique_loss_ledger',
              ],
          }
          Path('evidence/data526/v8/terminal_materialization_v1.json').write_text(
              json.dumps(receipt, indent=2, sort_keys=True) + '\n', encoding='utf-8'
          )
          PY
          cat > tests/test_data526_v8_terminal_evidence.py <<'PYTEST'
          from __future__ import annotations

          import hashlib
          import json
          from pathlib import Path

          ROOT = Path(__file__).resolve().parents[1]
          EVIDENCE_ROOT = ROOT / "evidence" / "data526" / "v8"
          INVENTORY_PATH = EVIDENCE_ROOT / "record_inventory.json"
          MATERIALIZATION_PATH = EVIDENCE_ROOT / "materialization_evidence.json"
          TERMINAL_PATH = EVIDENCE_ROOT / "terminal_materialization_v1.json"
          CONFIG_PATH = ROOT / "configs" / "data" / "data526_v8_record_composition_v1.json"

          def _load(path: Path) -> dict[str, object]:
              return json.loads(path.read_text(encoding="utf-8"))

          def _sha256(path: Path) -> str:
              return hashlib.sha256(path.read_bytes()).hexdigest()

          def test_terminal_receipt_binds_exact_successful_execution_and_artifact() -> None:
              terminal = _load(TERMINAL_PATH)
              assert terminal["scientific_execution_head_sha"] == "da0d4cd32a08774967fed97592a1add29da51daf"
              assert terminal["workflow_run_id"] == 34344420230
              assert terminal["workflow_conclusion"] == "success"
              artifact = terminal["artifact"]
              assert artifact["id"] == 10101207959
              assert artifact["digest"] == "sha256:2fdb61fc82061ab20c6fac372fa59968ffd2b43afad2e6ad9835c20320b687c0"
              assert _sha256(INVENTORY_PATH) == artifact["record_inventory_file_sha256"]
              assert _sha256(MATERIALIZATION_PATH) == artifact["materialization_evidence_file_sha256"]
              assert _sha256(CONFIG_PATH) == artifact["execution_config_file_sha256"]

          def test_terminal_result_matches_text_free_artifact_evidence() -> None:
              terminal = _load(TERMINAL_PATH)
              inventory = _load(INVENTORY_PATH)
              evidence = _load(MATERIALIZATION_PATH)
              result = terminal["result"]
              assert result["record_count"] == inventory["record_count"] == evidence["record_count"] == 275
              assert result["source_object_count"] == evidence["source_object_count"] == 262
              assert result["total_payload_bytes"] == inventory["total_payload_bytes"] == evidence["total_payload_bytes"] == 6_095_321
              assert result["record_payload_jsonl_sha256"] == evidence["record_payload_jsonl_sha256"]
              assert result["record_inventory_digest_sha256"] == inventory["record_inventory_digest_sha256"] == evidence["record_inventory_digest_sha256"]
              assert result["payload_inventory_digest_sha256"] == inventory["payload_inventory_digest_sha256"] == evidence["payload_inventory_digest_sha256"]
              assert result["materialization_evidence_identity_sha256"] == evidence["evidence_identity_sha256"]
              assert "normalized_payload" not in INVENTORY_PATH.read_text(encoding="utf-8")
              assert "normalized_payload" not in MATERIALIZATION_PATH.read_text(encoding="utf-8")

          def test_terminal_receipt_preserves_zero_training_credit() -> None:
              terminal = _load(TERMINAL_PATH)
              evidence = _load(MATERIALIZATION_PATH)
              boundary = terminal["claim_boundary"]
              assert boundary["exact_record_materialization_terminal"] is True
              assert boundary["pre_decontamination_record_authority_only"] is True
              assert boundary["raw_payloads_committed_to_repository"] is False
              assert boundary["decontamination_executed"] is False
              assert boundary["tokenizer_fit_executed"] is False
              assert boundary["authorized_unique_optimized_targets"] == 0
              assert boundary["optimizer_updates"] == 0
              assert boundary["training_executed"] is False
              assert boundary["final_test_payload_accessed"] is False
              assert boundary["paid_compute_used"] is False
              assert evidence["authorized_unique_optimized_targets"] == 0
              assert evidence["decontamination_executed"] is False
              assert evidence["tokenizer_fit_executed"] is False
              assert evidence["optimizer_updates"] == 0
              assert evidence["training_executed"] is False
              assert evidence["final_test_payload_accessed"] is False
              assert evidence["paid_compute_used"] is False
          PYTEST
          python -m pytest -q tests/test_data526_v8_terminal_evidence.py
          git diff --check

      - name: Persist exact text-free terminal evidence
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add evidence/data526/v8/record_inventory.json \
            evidence/data526/v8/materialization_evidence.json \
            evidence/data526/v8/terminal_materialization_v1.json \
            tests/test_data526_v8_terminal_evidence.py
          git diff --cached --quiet && { echo "expected evidence finalization delta missing" >&2; exit 1; }
          git commit -m "DATA-526: retain exact terminal V8 record authority"
          git fetch --no-tags origin "$GITHUB_HEAD_REF"
          test "$(git rev-parse FETCH_HEAD)" = "${{ github.event.pull_request.head.sha }}"
          git push origin "HEAD:$GITHUB_HEAD_REF"
