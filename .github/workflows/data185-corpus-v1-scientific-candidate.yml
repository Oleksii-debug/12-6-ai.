name: DATA-185 Corpus V1 Scientific Candidate

on:
  pull_request:
    branches:
      - data110/corpus-v1-rc-20260826
  workflow_dispatch:

permissions:
  contents: read

jobs:
  corpus-v1-scientific-candidate:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      PYTHONPATH: src
      OMP_NUM_THREADS: "2"
      MKL_NUM_THREADS: "2"
      TWELVE_SIX_EXECUTION_PROFILE: LOCAL_FREE
    steps:
      - name: Universal bootstrap checkout exact head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Universal bootstrap exact Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11.16"

      - name: Bind exact source and LOCAL_FREE profile
        env:
          EXPECTED_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SOURCE_SHA"
          test "$TWELVE_SIX_EXECUTION_PROFILE" = "LOCAL_FREE"

      - name: Universal bootstrap hash-locked runtime
        run: |
          set -euo pipefail
          python -m venv .data185
          .data185/bin/python -m pip install \
            --disable-pip-version-check --no-deps --require-hashes \
            -r requirements/locks/linux-x86_64/toolchain.lock.txt
          .data185/bin/python -m pip install \
            --disable-pip-version-check --no-deps --require-hashes \
            -r requirements/locks/linux-x86_64/runtime.lock.txt
          .data185/bin/python -m pip install \
            --disable-pip-version-check --no-deps --require-hashes \
            -r requirements/locks/linux-x86_64/dev.lock.txt

      - name: Reuse exact DATA-31 DataTrove experiment runtime
        run: |
          set -euo pipefail
          mkdir -p /tmp/datatrove-wheel /tmp/tokenizers-wheel
          .data185/bin/python -m pip download --no-deps datatrove==0.10.0 -d /tmp/datatrove-wheel
          WHEEL="$(find /tmp/datatrove-wheel -name 'datatrove-0.10.0-*.whl' -print -quit)"
          test -n "$WHEEL"
          test "$(sha256sum "$WHEEL" | awk '{print $1}')" = "c7bb75deed2c3e88fb5138f8ea075a170ee98d6c94fc263829609091ea9c2b5d"
          .data185/bin/python -m pip download --no-deps tokenizers==0.23.1 -d /tmp/tokenizers-wheel
          TOKENIZERS_WHEEL="$(find /tmp/tokenizers-wheel -name 'tokenizers-0.23.1-*.whl' -print -quit)"
          test -n "$TOKENIZERS_WHEEL"
          test "$(sha256sum "$TOKENIZERS_WHEEL" | awk '{print $1}')" = "5075b405006415ea148a992d093699c66eb01952bf59f4d5727089a98bda45a4"
          .data185/bin/python -m pip install "$WHEEL" orjson regex "xxhash==3.8.1"
          .data185/bin/python -m pip install --no-deps "$TOKENIZERS_WHEEL"
          .data185/bin/python -m pip check

      - name: Compile and test convergence contracts
        run: |
          set -euo pipefail
          .data185/bin/python -m compileall -q src/twelve_six
          .data185/bin/python -m ruff check --select E4,E7,E9,F \
            src/twelve_six/data185_scientific_candidate.py \
            src/twelve_six/data110_entrypoint.py \
            tests/test_data185_scientific_candidate.py \
            tests/test_data110_entrypoint.py
          .data185/bin/python -m pytest -q \
            tests/test_data185_scientific_candidate.py \
            tests/test_data110_release_candidate.py \
            tests/test_data110_entrypoint.py \
            tests/test_data25_corpus_v01.py \
            tests/test_document_quality.py \
            tests/test_privacy_filter.py \
            tests/test_benchmark_decontamination.py \
            tests/test_split_robustness.py

      - name: Reacquire bounded rights-approved real UA and EN inputs
        run: |
          set -euo pipefail
          .data185/bin/python tools/run_external_source_intake.py \
            --output data110-external-intake \
            --max-download-bytes 2000000 \
            --max-normalized-chars 50000 \
            | tee data110-external-intake.stdout.json

      - name: Rebuild DATA-110 candidate twice
        env:
          EXPECTED_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          .data185/bin/python -m twelve_six.data110_entrypoint build \
            --repo-root . \
            --source-sha "$EXPECTED_SOURCE_SHA" \
            --external-intake data110-external-intake \
            --output-dir data110-evidence

      - name: Run fixed approx 1M candidate learning trajectory phase 1
        env:
          EXPECTED_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          .data185/bin/python -m twelve_six.data110_entrypoint phase1 \
            --repo-root . \
            --source-sha "$EXPECTED_SOURCE_SHA" \
            --output-dir data110-evidence

      - name: Fresh-process resume candidate to step 512
        env:
          EXPECTED_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          .data185/bin/python -m twelve_six.data110_entrypoint resume \
            --repo-root . \
            --source-sha "$EXPECTED_SOURCE_SHA" \
            --output-dir data110-evidence
          .data185/bin/python -m twelve_six.data110_entrypoint validate \
            data110-evidence/report.json \
            --expected-source-sha "$EXPECTED_SOURCE_SHA"

      - name: Compare against previous DATA-25 identity and qualify
        env:
          EXPECTED_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          .data185/bin/python -m twelve_six.data185_scientific_candidate qualify \
            --repo-root . \
            --source-sha "$EXPECTED_SOURCE_SHA" \
            --data110-evidence data110-evidence \
            --output-dir data185-evidence \
            | tee data185-evidence.stdout.json
          .data185/bin/python -m twelve_six.data185_scientific_candidate validate \
            data185-evidence/data185-scientific-candidate.json \
            --expected-source-sha "$EXPECTED_SOURCE_SHA"

      - name: Assert current fail-closed scientific decision
        run: |
          set -euo pipefail
          .data185/bin/python - <<'PY'
          import json
          from pathlib import Path
          path = Path("data185-evidence/data185-scientific-candidate.json")
          report = json.loads(path.read_text(encoding="utf-8"))
          assert report["status"] == "RETEST_REQUIRED", report["status"]
          assert report["requirements"]["two_build_determinism"]["passed"] is True
          assert report["requirements"]["zero_train_validation_cluster_leakage"]["passed"] is True
          assert report["requirements"]["reserved_eval_exclusion"]["passed"] is True
          assert report["requirements"]["streaming_trainer_proof"]["passed"] is True
          assert report["requirements"]["real_code"]["passed"] is False
          assert report["fixed_approx_1m_comparison"]["research140_decision"]["decision"] == "INSUFFICIENT_REPEATS"
          print(json.dumps({
              "status": report["status"],
              "machine_reasons": report["machine_reasons"],
              "candidate_identity": report["candidate"]["corpus_identity_sha256"],
              "previous_identity": report["fixed_approx_1m_comparison"]["previous_dataset_identity_sha256"],
              "candidate_bpb": report["fixed_approx_1m_comparison"]["candidate"]["aggregate_and_stratum_bpb"]["bits_per_byte"],
              "previous_bpb": report["fixed_approx_1m_comparison"]["previous_data25"]["final_common_eval"]["bits_per_byte"],
              "report_sha256": report["report_sha256"],
          }, ensure_ascii=False, indent=2, sort_keys=True))
          PY

      - name: Upload scientific-candidate evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: data185-corpus-v1-scientific-candidate
          path: |
            data110-external-intake/manifest.json
            data110-external-intake/records.jsonl
            data110-external-intake.stdout.json
            data110-evidence/release-manifest.json
            data110-evidence/report.json
            data110-evidence/run-manifest.json
            data110-evidence/train-curve.jsonl
            data110-evidence/checkpoint-0512/
            data185-evidence/data185-scientific-candidate.json
            data185-evidence.stdout.json
          if-no-files-found: warn
          retention-days: 30
