name: D03 Rada Trees quality-window real replay

on:
  pull_request:
    paths:
      - ".github/workflows/d03-rada-trees-quality-window-real-replay.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality-window-replay:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.ref == 'work/925-rada-quality-window-real-replay-20260910'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Bind canonical privacy V3 implementation
        run: |
          set -euo pipefail
          test "$(git hash-object src/twelve_six/data/privacy_filter_v3.py)" = "a84395daf6f07726d6a730cf6ccb04c35bdc4e67"
      - name: Install data-only runtime
        run: |
          sudo apt-get update
          sudo apt-get install -y p7zip-full
      - name: Acquire exact immutable Rada_Trees archive
        run: |
          set -euo pipefail
          curl --fail --location --retry 4 --retry-all-errors \
            --output "$RUNNER_TEMP/rada_xtag_texts.7z" \
            "https://huggingface.co/datasets/uacorpus/Rada_Trees/resolve/1b994a5804dcda122721e8d33a03fd172cf8d867/rada_xtag_texts.7z?download=true"
          test "$(stat -c %s "$RUNNER_TEMP/rada_xtag_texts.7z")" = "697768591"
          echo "737fa5df061c55555a8c761023559a206cbcabf0299ae52d1ccae387f685803e  $RUNNER_TEMP/rada_xtag_texts.7z" | sha256sum -c -
      - name: Materialize exact rights-scoped candidate
        env:
          PYTHONPATH: src
        run: |
          set -euo pipefail
          python tools/materialize_d03_rada_trees_rights_scoped_handoff.py \
            --archive "$RUNNER_TEMP/rada_xtag_texts.7z" \
            --candidate-jsonl "$RUNNER_TEMP/rada-candidate.jsonl" \
            --report "$RUNNER_TEMP/rada-handoff-report.json"
          test "$(wc -l < "$RUNNER_TEMP/rada-candidate.jsonl")" = "4384"
          sha256sum "$RUNNER_TEMP/rada-candidate.jsonl"
      - name: Execute merged quality-window and privacy-V3 materializer
        env:
          PYTHONPATH: src
        run: |
          set -euo pipefail
          CANDIDATE_SHA="$(sha256sum "$RUNNER_TEMP/rada-candidate.jsonl" | awk '{print $1}')"
          python tools/materialize_d03_rada_trees_quality_windows.py \
            --candidate-jsonl "$RUNNER_TEMP/rada-candidate.jsonl" \
            --expected-candidate-sha256 "$CANDIDATE_SHA" \
            --output-jsonl "$RUNNER_TEMP/rada-quality-window-survivors.jsonl" \
            --report "$RUNNER_TEMP/rada-quality-window-report.json"
      - name: Verify terminal zero-credit accounting and build hash-safe execution summary
        env:
          SUMMARY_PATH: ${{ runner.temp }}/rada-quality-window-execution-summary.json
          REPORT_PATH: ${{ runner.temp }}/rada-quality-window-report.json
          HANDOFF_REPORT_PATH: ${{ runner.temp }}/rada-handoff-report.json
          OUTPUT_PATH: ${{ runner.temp }}/rada-quality-window-survivors.jsonl
          CANDIDATE_PATH: ${{ runner.temp }}/rada-candidate.jsonl
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          def canonical(value):
              return (json.dumps(value, ensure_ascii=False, sort_keys=True, separators=(",", ":")) + "\n").encode("utf-8")

          def file_sha(path):
              h = hashlib.sha256()
              with Path(path).open("rb") as handle:
                  while chunk := handle.read(8 * 1024 * 1024):
                      h.update(chunk)
              return h.hexdigest()

          report_path = Path(os.environ["REPORT_PATH"])
          report = json.loads(report_path.read_bytes())
          quality = report["quality"]
          claim = report["claim_boundary"]
          assert report["execution_profile"] == "LOCAL_FREE"
          assert report["input_records"] == 4384
          assert quality["statuses"] == {"REJECT_DOCUMENT": 1, "RETAIN_ALL": 4359, "RETAIN_PARTIAL": 24}
          assert claim["training_authorized_bytes"] == 0
          assert claim["unique_causal_loss_positions_authorized"] == 0
          assert claim["tokenizer_fit_authorized"] is False
          assert claim["optimizer_updates"] == 0
          assert claim["model_training_executed"] is False
          assert claim["final_test_payload_accessed"] is False
          assert claim["paid_compute_used"] is False
          assert report["output_jsonl_sha256"] == file_sha(os.environ["OUTPUT_PATH"])
          assert report["input_candidate_jsonl_sha256"] == file_sha(os.environ["CANDIDATE_PATH"])

          core = {
              "schema_version": "12-6.d03-rada-trees-quality-window-real-replay.v1",
              "execution_profile": "LOCAL_FREE",
              "execution_head_sha": os.environ["GITHUB_SHA"],
              "workflow_run_id": int(os.environ["GITHUB_RUN_ID"]),
              "required_privacy_repair_main_sha": "82a2cacfec2670feff957d64904f1b8fe310dbd4",
              "privacy_filter_v3_blob_sha": "a84395daf6f07726d6a730cf6ccb04c35bdc4e67",
              "source_archive_sha256": "737fa5df061c55555a8c761023559a206cbcabf0299ae52d1ccae387f685803e",
              "source_archive_bytes": 697768591,
              "candidate_jsonl_sha256": report["input_candidate_jsonl_sha256"],
              "candidate_records": report["input_records"],
              "candidate_text_utf8_bytes": report["input_text_utf8_bytes"],
              "handoff_report_file_sha256": file_sha(os.environ["HANDOFF_REPORT_PATH"]),
              "quality_window_report_sha256": report["report_sha256"],
              "quality_window_report_file_sha256": file_sha(report_path),
              "survivor_jsonl_sha256": report["output_jsonl_sha256"],
              "survivor_records": report["output_records"],
              "survivor_text_utf8_bytes": report["output_text_utf8_bytes"],
              "quality_statuses": quality["statuses"],
              "quality_partial_records_materialized": quality["partial_records_materialized"],
              "quality_partial_units_materialized_before_privacy": quality["partial_units_materialized_before_privacy"],
              "privacy_actions": report["privacy"]["actions"],
              "privacy_held_units": report["privacy"]["held_units"],
              "privacy_held_utf8_bytes": report["privacy"]["held_utf8_bytes"],
              "language_authority_bound": claim["language_authority_bound"],
              "global_dedup_complete": claim["global_dedup_complete"],
              "reserved_evaluation_decontamination_complete": claim["reserved_evaluation_decontamination_complete"],
              "training_authorized_bytes": claim["training_authorized_bytes"],
              "unique_causal_loss_positions_authorized": claim["unique_causal_loss_positions_authorized"],
              "tokenizer_fit_authorized": claim["tokenizer_fit_authorized"],
              "optimizer_updates": claim["optimizer_updates"],
              "model_training_executed": claim["model_training_executed"],
              "final_test_payload_accessed": claim["final_test_payload_accessed"],
              "paid_compute_used": claim["paid_compute_used"],
          }
          summary = {**core, "summary_sha256": hashlib.sha256(canonical(core)).hexdigest()}
          Path(os.environ["SUMMARY_PATH"]).write_bytes(canonical(summary))
          print("RADA_QUALITY_WINDOW_REAL_REPLAY=PASS_ZERO_CREDIT")
          print("SURVIVOR_RECORDS=" + str(summary["survivor_records"]))
          print("SURVIVOR_TEXT_UTF8_BYTES=" + str(summary["survivor_text_utf8_bytes"]))
          print("SURVIVOR_JSONL_SHA256=" + summary["survivor_jsonl_sha256"])
          print("REPORT_SHA256=" + summary["quality_window_report_sha256"])
          print("SUMMARY_SHA256=" + summary["summary_sha256"])
          PY
      - name: Stage exact survivor artifact
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/rada-quality-window-artifact"
          cp "$RUNNER_TEMP/rada-quality-window-survivors.jsonl" "$RUNNER_TEMP/rada-quality-window-artifact/"
          cp "$RUNNER_TEMP/rada-quality-window-report.json" "$RUNNER_TEMP/rada-quality-window-artifact/"
          cp "$RUNNER_TEMP/rada-handoff-report.json" "$RUNNER_TEMP/rada-quality-window-artifact/"
          cp "$RUNNER_TEMP/rada-quality-window-execution-summary.json" "$RUNNER_TEMP/rada-quality-window-artifact/"
          sha256sum "$RUNNER_TEMP/rada-quality-window-artifact/"* > "$RUNNER_TEMP/rada-quality-window-artifact/SHA256SUMS"
      - name: Upload ephemeral exact composite survivor artifact
        uses: actions/upload-artifact@v4
        with:
          name: d03-rada-trees-quality-window-composite-survivors
          path: ${{ runner.temp }}/rada-quality-window-artifact
          retention-days: 1
          compression-level: 9
          if-no-files-found: error
