name: D04 Streaming Packing Benchmark

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  local-free-streaming:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11.16"
      - name: Bind exact source head
        env:
          EXPECTED_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SOURCE_SHA"
      - name: Install exact locked x86-64 runtime
        run: |
          python -m venv .streaming-bench
          .streaming-bench/bin/python -m pip install \
            --disable-pip-version-check --no-deps --require-hashes \
            -r requirements/locks/linux-x86_64/toolchain.lock.txt
          .streaming-bench/bin/python -m pip install \
            --disable-pip-version-check --no-deps --require-hashes \
            -r requirements/locks/linux-x86_64/runtime.lock.txt
          .streaming-bench/bin/python -m pip install \
            --disable-pip-version-check --no-deps --require-hashes \
            -r requirements/locks/linux-x86_64/dev.lock.txt
      - name: Run focused streaming, mixture and Trainer integration tests
        env:
          PYTHONPATH: src
        run: >-
          .streaming-bench/bin/python -m pytest -q
          tests/test_streaming_packing_dataloader.py
          tests/test_streaming_mixture_runtime.py
      - name: Run materially larger synthetic streaming benchmark
        env:
          PYTHONPATH: src
        run: >-
          .streaming-bench/bin/python -m twelve_six.packing.streaming_benchmark
          --documents 50000
          --output streaming-packing-benchmark.json
      - name: Upload exact benchmark evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: d04-streaming-packing-benchmark
          path: streaming-packing-benchmark.json
          if-no-files-found: error
          retention-days: 30
