name: D03 Rada V2 publication durability qualify G6 151

on:
  pull_request:
    branches:
      - repair/rada-v2-publication-durability-g6-151-20261006
    paths:
      - ".github/workflows/d03_rada_v2_publication_durability_qualify_g6_151.yml"
      - "tools/run_d03_rada_postg06_next100_106_balance_v2.py"
      - "tests/test_rada_postg06_next100_106_balance_v2.py"

permissions:
  contents: read

concurrency:
  group: d03-rada-v2-publication-durability-g6-151-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  qualify:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.head_ref == 'qualification/rada-v2-publication-durability-g6-151-20261006'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      EXECUTION_HEAD: ${{ github.event.pull_request.head.sha }}
      PARENT_HEAD: "b46ed7ed8273e08fd78a0abd22ebc103f391cc42"
      RUNNER_BLOB: "aa59da47a906fb532806a864e6a08a0c0778d468"
      TEST_BLOB: "cab7197ed05af0e487edb61f4ce7c0af911e5cfd"
    steps:
      - name: Checkout exact qualification head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Set Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.11.16"
          cache: pip
      - name: Bind exact parent and scope
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXECUTION_HEAD"
          test "$(git merge-base "$PARENT_HEAD" HEAD)" = "$PARENT_HEAD"
          git diff --quiet HEAD --
          git diff --cached --quiet HEAD --
          git diff --name-only "$PARENT_HEAD"..HEAD | sort > "$RUNNER_TEMP/changed.txt"
          cat > "$RUNNER_TEMP/expected.txt" <<'EOF'
          .github/workflows/d03_rada_v2_publication_durability_qualify_g6_151.yml
          EOF
          sort -o "$RUNNER_TEMP/expected.txt" "$RUNNER_TEMP/expected.txt"
          cmp "$RUNNER_TEMP/expected.txt" "$RUNNER_TEMP/changed.txt"
          test "$(git hash-object tools/run_d03_rada_postg06_next100_106_balance_v2.py)" = "$RUNNER_BLOB"
          test "$(git hash-object tests/test_rada_postg06_next100_106_balance_v2.py)" = "$TEST_BLOB"
      - name: Install canonical current test environment
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check -e '.[dev]'
      - name: Compile focused files
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile \
            tools/run_d03_rada_postg06_next100_106_balance_v2.py \
            tests/test_rada_postg06_next100_106_balance_v2.py
      - name: Lint focused files
        shell: bash
        run: |
          set -euo pipefail
          ruff check \
            tools/run_d03_rada_postg06_next100_106_balance_v2.py \
            tests/test_rada_postg06_next100_106_balance_v2.py
      - name: Run focused V2 tests
        shell: bash
        env:
          PYTHONPATH: src
          TWELVE_SIX_EXECUTION_PROFILE: LOCAL_FREE
        run: |
          set -euo pipefail
          python -m pytest -q tests/test_rada_postg06_next100_106_balance_v2.py
