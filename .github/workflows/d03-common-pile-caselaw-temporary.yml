name: D03 Common Pile Caselaw Temporary

on:
  push:
    branches:
      - d03/common-pile-caselaw-zero-credit-20260907
    paths:
      - ".github/workflows/d03-common-pile-caselaw-temporary.yml"

permissions:
  contents: read

concurrency:
  group: d03-common-pile-caselaw-${{ github.ref }}
  cancel-in-progress: true

jobs:
  vector-capacity-diagnostic:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      SOURCE_SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11.16"
          cache: pip
      - name: Install project dev environment
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]
      - name: Focused product regression
        run: pytest -q tests/test_d03_common_pile_caselaw.py
      - name: Measure both source orders at unchanged product gates
        run: |
          python - <<'PY'
          import gzip
          import hashlib
          import importlib.util
          import json
          import os
          import urllib.request
          from pathlib import Path

          p = Path("tools/materialize_d03_common_pile_caselaw.py")
          spec = importlib.util.spec_from_file_location("caselaw", p)
          assert spec and spec.loader
          mod = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(mod)
          cfg = mod.load_config()
          revision = mod.SOURCE_REVISION
          dataset = mod.SOURCE_DATASET
          objects = [
              {"file": "cap_00044.jsonl.gz", "bytes": 9441419,
               "sha256": "e04bdff817b34d5fd2ab0b4aff272adfe6e863aacef7d4cd24db47e4b7c8db33"},
              {"file": "cap_00043.jsonl.gz", "bytes": 10476512,
               "sha256": "f299c45effc957e1e02d3930e68c5d6dc643eb9d585093ff7445f36095c8531f"},
          ]
          root = Path(os.environ["RUNNER_TEMP"])

          def download(obj, suffix):
              out = root / f"{obj['file']}.{suffix}"
              url = f"https://huggingface.co/datasets/{dataset}/resolve/{revision}/{obj['file']}"
              req = urllib.request.Request(url, headers={"User-Agent": "12-6-ai-D03-CaselawOrder/1"})
              h = hashlib.sha256(); n = 0
              with urllib.request.urlopen(req, timeout=120) as r, out.open("wb") as f:
                  while True:
                      chunk = r.read(1024 * 1024)
                      if not chunk:
                          break
                      n += len(chunk); h.update(chunk); f.write(chunk)
              assert n == obj["bytes"], ("source_size", obj["file"], n)
              assert h.hexdigest() == obj["sha256"], ("source_sha256", obj["file"])
              return out

          paths_a = {o["file"]: download(o, "a") for o in objects}
          paths_b = {o["file"]: download(o, "b") for o in objects}
          for obj in objects:
              name = obj["file"]
              assert paths_a[name].read_bytes() == paths_b[name].read_bytes(), ("download_mismatch", name)

          by_name = {o["file"]: o for o in objects}

          def scan(order):
              seen_ids = set(); seen_hashes = set(); retained = []
              dispositions = {}; per_source = {}; candidate_bytes = 0
              decompressed = 0; rows = 0; candidate_cap_reached = False
              scan_budget_reached = False; stop = False; next_scan_bytes = None
              for name in order:
                  obj = by_name[name]; path = paths_a[name]
                  src = {"rows": 0, "decompressed_bytes": 0, "accepted": 0,
                         "accepted_normalized_utf8_bytes": 0}
                  with gzip.open(path, "rb") as handle:
                      while not stop:
                          line = handle.readline(mod.MAX_LINE_BYTES + 1)
                          if not line:
                              break
                          assert len(line) <= mod.MAX_LINE_BYTES, ("line_budget", name, src["rows"] + 1)
                          prospective = decompressed + len(line)
                          if prospective > mod.MAX_SCANNED_BYTES:
                              scan_budget_reached = True; next_scan_bytes = prospective; stop = True; break
                          rows += 1; src["rows"] += 1
                          decompressed = prospective; src["decompressed_bytes"] += len(line)
                          record = json.loads(line.decode("utf-8"))
                          rid = record.get("id")
                          assert isinstance(rid, str), ("missing_id", name, src["rows"])
                          assert rid not in seen_ids, ("duplicate_id", name, src["rows"])
                          seen_ids.add(rid)
                          ok, reason, candidate = mod.assess_record(record, cfg)
                          if not ok:
                              dispositions[reason] = dispositions.get(reason, 0) + 1
                              continue
                          assert candidate is not None
                          digest = candidate["normalized_sha256"]
                          if digest in seen_hashes:
                              dispositions["exact_normalized_duplicate"] = dispositions.get(
                                  "exact_normalized_duplicate", 0) + 1
                              continue
                          next_bytes = candidate_bytes + candidate["normalized_utf8_bytes"]
                          if next_bytes > mod.MAX_CANDIDATE_BYTES:
                              candidate_cap_reached = True; stop = True; break
                          seen_hashes.add(digest); retained.append(candidate)
                          candidate_bytes = next_bytes
                          src["accepted"] += 1
                          src["accepted_normalized_utf8_bytes"] += candidate["normalized_utf8_bytes"]
                          dispositions["accepted"] = dispositions.get("accepted", 0) + 1
                          if candidate_bytes >= mod.MAX_CANDIDATE_BYTES - 8192:
                              candidate_cap_reached = True; stop = True; break
                  per_source[name] = src
                  if stop:
                      break
              payload = b"".join(mod.canonical(row) for row in retained)
              return {
                  "source_order": order,
                  "rows_scanned": rows,
                  "decompressed_bytes_scanned": decompressed,
                  "next_scan_bytes_if_budget_exceeded": next_scan_bytes,
                  "scan_budget_reached": scan_budget_reached,
                  "retained_records": len(retained),
                  "retained_normalized_utf8_bytes": candidate_bytes,
                  "candidate_jsonl_sha256": hashlib.sha256(payload).hexdigest(),
                  "candidate_cap_reached": candidate_cap_reached,
                  "candidate_floor_reached": candidate_bytes >= mod.MIN_CANDIDATE_BYTES,
                  "disposition_counts": dict(sorted(dispositions.items())),
                  "per_source": per_source,
              }

          order_44_43 = scan(["cap_00044.jsonl.gz", "cap_00043.jsonl.gz"])
          order_43_44 = scan(["cap_00043.jsonl.gz", "cap_00044.jsonl.gz"])
          evidence = {
              "schema_version": "12-6.d03-common-pile-caselaw-order-capacity-diagnostic.v1",
              "execution_profile": "LOCAL_FREE",
              "source_git_sha": os.environ["SOURCE_SHA"],
              "dataset": dataset,
              "revision": revision,
              "source_objects": objects,
              "two_independent_downloads_per_object_byte_identical": True,
              "existing_filter_module": "tools/materialize_d03_common_pile_caselaw.py",
              "existing_min_candidate_bytes": mod.MIN_CANDIDATE_BYTES,
              "existing_max_candidate_bytes": mod.MAX_CANDIDATE_BYTES,
              "existing_max_scanned_decompressed_bytes": mod.MAX_SCANNED_BYTES,
              "order_44_then_43": order_44_43,
              "order_43_then_44": order_43_44,
              "any_order_reaches_candidate_floor": (
                  order_44_43["candidate_floor_reached"] or order_43_44["candidate_floor_reached"]),
              "source_level_project_review_complete": False,
              "canonical_capacity_credited": 0,
              "family_credit_added": 0,
              "training_authorized_bytes": 0,
              "tokenizer_fit_authorized": False,
              "optimizer_updates": 0,
              "model_training_executed": False,
              "final_test_accessed": False,
              "paid_compute_used": False,
          }
          raw = (json.dumps(evidence, sort_keys=True, separators=(",", ":")) + "\n").encode()
          evidence["evidence_identity_sha256"] = hashlib.sha256(raw).hexdigest()
          print(json.dumps(evidence, sort_keys=True))
          out = root / "caselaw-order-evidence"; out.mkdir()
          (out / "order_capacity_diagnostic.json").write_text(
              json.dumps(evidence, indent=2, sort_keys=True) + "\n", encoding="utf-8")
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: d03-common-pile-caselaw-order-diagnostic-${{ env.SOURCE_SHA }}
          path: ${{ runner.temp }}/caselaw-order-evidence/
          if-no-files-found: error
          retention-days: 30
