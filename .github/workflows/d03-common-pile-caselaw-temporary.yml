name: D03 Common Pile Caselaw Temporary

on:
  push:
    branches:
      - d03/common-pile-caselaw-zero-credit-20260907
    paths:
      - "configs/data/d03_common_pile_caselaw_zero_credit_v1.json"
      - "tools/materialize_d03_common_pile_caselaw.py"
      - "tests/test_d03_common_pile_caselaw.py"
      - ".github/workflows/d03-common-pile-caselaw-temporary.yml"

permissions:
  contents: read

concurrency:
  group: d03-common-pile-caselaw-${{ github.ref }}
  cancel-in-progress: true

jobs:
  exact-capacity-diagnostic:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      SOURCE_SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Prove exact checkout
        run: test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11.16"
          cache: pip
      - name: Install project dev environment
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]
      - name: Run focused adversarial suite
        run: pytest -q tests/test_d03_common_pile_caselaw.py
      - name: Download exact source twice and measure below-floor capacity
        run: |
          python - <<'PY'
          import hashlib
          import importlib.util
          import json
          import os
          from pathlib import Path

          module_path = Path("tools/materialize_d03_common_pile_caselaw.py")
          spec = importlib.util.spec_from_file_location("caselaw", module_path)
          assert spec and spec.loader
          mod = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(mod)
          cfg = mod.load_config()
          pinned_floor = mod.MIN_CANDIDATE_BYTES
          root = Path(os.environ["RUNNER_TEMP"])

          reports = []
          for label in ("a", "b"):
              out = root / f"caselaw-{label}"
              source = out / "source.jsonl.gz"
              candidate = out / "candidate.jsonl"
              report_path = out / "report.json"
              mod.download_exact(cfg, source)
              original_floor = mod.MIN_CANDIDATE_BYTES
              mod.MIN_CANDIDATE_BYTES = 0
              try:
                  report = mod.materialize(source, candidate, report_path, cfg)
              finally:
                  mod.MIN_CANDIDATE_BYTES = original_floor
              reports.append(report)

          a = root / "caselaw-a"
          b = root / "caselaw-b"
          assert (a / "source.jsonl.gz").read_bytes() == (b / "source.jsonl.gz").read_bytes()
          assert (a / "candidate.jsonl").read_bytes() == (b / "candidate.jsonl").read_bytes()
          assert (a / "report.json").read_bytes() == (b / "report.json").read_bytes()
          report = reports[0]
          assert report == reports[1]
          assert report["source_sha256"] == mod.SOURCE_SHA256
          assert report["source_bytes"] == mod.SOURCE_BYTES
          assert report["retained_normalized_utf8_bytes"] < pinned_floor
          assert report["canonical_capacity_credited"] == 0
          assert report["training_authorized_bytes"] == 0
          assert report["model_training_executed"] is False
          assert report["paid_compute_used"] is False

          evidence = {
              "schema_version": "12-6.d03-common-pile-caselaw-capacity-diagnostic.v1",
              "execution_profile": "LOCAL_FREE",
              "source_git_sha": os.environ["SOURCE_SHA"],
              "source_dataset": report["source_dataset"],
              "source_revision": report["source_revision"],
              "source_file": report["source_file"],
              "source_bytes": report["source_bytes"],
              "source_sha256": report["source_sha256"],
              "two_independent_downloads_byte_identical": True,
              "two_diagnostic_materializations_byte_identical": True,
              "pinned_min_candidate_bytes": pinned_floor,
              "terminal_materialization_pass": False,
              "terminal_failure": "candidate byte floor not reached",
              "diagnostic_floor_override_bytes": 0,
              "diagnostic_override_is_training_authority": False,
              "retained_records": report["retained_records"],
              "retained_normalized_utf8_bytes": report["retained_normalized_utf8_bytes"],
              "candidate_jsonl_sha256": report["candidate_jsonl_sha256"],
              "report_identity_sha256": report["report_identity_sha256"],
              "source_rows_scanned": report["source_rows_scanned"],
              "decompressed_bytes_scanned": report["decompressed_bytes_scanned"],
              "candidate_cap_reached": report["candidate_cap_reached"],
              "source_kind_counts": report["source_kind_counts"],
              "disposition_counts": report["disposition_counts"],
              "raw_source_uploaded": False,
              "candidate_payload_uploaded": False,
              "source_level_project_review_complete": False,
              "canonical_capacity_credited": 0,
              "family_credit_added": 0,
              "training_authorized_bytes": 0,
              "tokenizer_fit_authorized": False,
              "optimizer_updates": 0,
              "model_training_executed": False,
              "final_test_accessed": False,
              "paid_compute_used": False,
          }
          canonical = (json.dumps(evidence, sort_keys=True, separators=(",", ":")) + "\n").encode()
          evidence["evidence_identity_sha256"] = hashlib.sha256(canonical).hexdigest()
          out = root / "caselaw-evidence"
          out.mkdir()
          (out / "capacity_diagnostic.json").write_text(
              json.dumps(evidence, indent=2, sort_keys=True) + "\n", encoding="utf-8"
          )
          (out / "diagnostic_report.json").write_bytes((a / "report.json").read_bytes())
          print(json.dumps(evidence, sort_keys=True))
          PY
      - name: Prove unchanged terminal materializer still fails closed
        run: |
          set +e
          python tools/materialize_d03_common_pile_caselaw.py \
            --source-gzip "$RUNNER_TEMP/caselaw-a/source.jsonl.gz" \
            --candidate-jsonl "$RUNNER_TEMP/terminal/candidate.jsonl" \
            --report "$RUNNER_TEMP/terminal/report.json" \
            > "$RUNNER_TEMP/terminal.log" 2>&1
          status=$?
          set -e
          test "$status" -ne 0
          grep -F "CandidateError: candidate byte floor not reached" "$RUNNER_TEMP/terminal.log"
          test ! -e "$RUNNER_TEMP/terminal/report.json"
      - name: Upload text-free diagnostic evidence only
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: d03-common-pile-caselaw-diagnostic-${{ env.SOURCE_SHA }}
          path: ${{ runner.temp }}/caselaw-evidence/
          if-no-files-found: error
          retention-days: 30
