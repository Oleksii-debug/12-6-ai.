name: D03 Common Pile Caselaw Temporary

on:
  push:
    branches:
      - d03/common-pile-caselaw-zero-credit-20260907
    paths:
      - ".github/workflows/d03-common-pile-caselaw-temporary.yml"
      - "configs/data/d03_common_pile_caselaw_zero_credit_v1.json"
      - "tools/materialize_d03_common_pile_caselaw.py"
      - "tests/test_d03_common_pile_caselaw.py"

permissions:
  contents: read

concurrency:
  group: d03-common-pile-caselaw-${{ github.ref }}
  cancel-in-progress: true

jobs:
  product-replay:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      SOURCE_SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11.16"
          cache: pip
      - name: Install project dev environment
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]
      - name: Focused product regression
        run: pytest -q tests/test_d03_common_pile_caselaw.py
      - name: Independent real materialization A
        run: |
          mkdir -p "$RUNNER_TEMP/a"
          python tools/materialize_d03_common_pile_caselaw.py \
            --download \
            --source-gzip "$RUNNER_TEMP/a/cap_00044.jsonl.gz" \
            --source-gzip "$RUNNER_TEMP/a/cap_00043.jsonl.gz" \
            --candidate-jsonl "$RUNNER_TEMP/a/candidate.jsonl" \
            --report "$RUNNER_TEMP/a/report.json"
      - name: Independent real materialization B
        run: |
          mkdir -p "$RUNNER_TEMP/b"
          python tools/materialize_d03_common_pile_caselaw.py \
            --download \
            --source-gzip "$RUNNER_TEMP/b/cap_00044.jsonl.gz" \
            --source-gzip "$RUNNER_TEMP/b/cap_00043.jsonl.gz" \
            --candidate-jsonl "$RUNNER_TEMP/b/candidate.jsonl" \
            --report "$RUNNER_TEMP/b/report.json"
      - name: Verify exact replay and produce text-free evidence
        run: |
          cmp "$RUNNER_TEMP/a/cap_00044.jsonl.gz" "$RUNNER_TEMP/b/cap_00044.jsonl.gz"
          cmp "$RUNNER_TEMP/a/cap_00043.jsonl.gz" "$RUNNER_TEMP/b/cap_00043.jsonl.gz"
          cmp "$RUNNER_TEMP/a/candidate.jsonl" "$RUNNER_TEMP/b/candidate.jsonl"
          cmp "$RUNNER_TEMP/a/report.json" "$RUNNER_TEMP/b/report.json"
          python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          root = Path(os.environ["RUNNER_TEMP"])
          report_path = root / "a" / "report.json"
          report = json.loads(report_path.read_text(encoding="utf-8"))

          expected_order = ["cap_00044.jsonl.gz", "cap_00043.jsonl.gz"]
          expected_sources = [
              {
                  "file": "cap_00044.jsonl.gz",
                  "bytes": 9441419,
                  "sha256": "e04bdff817b34d5fd2ab0b4aff272adfe6e863aacef7d4cd24db47e4b7c8db33",
              },
              {
                  "file": "cap_00043.jsonl.gz",
                  "bytes": 10476512,
                  "sha256": "f299c45effc957e1e02d3930e68c5d6dc643eb9d585093ff7445f36095c8531f",
              },
          ]
          assert report["source_objects"] == expected_sources
          assert [row["file"] for row in report["source_objects"]] == expected_order
          # These values are the first exact Product-path observation from
          # e63f2fd4eddbd348b57a42e1fb41cb658d0c3a82.  This run is a
          # reproducibility replay; selection/filter thresholds are unchanged.
          assert report["source_rows_scanned"] == 75518
          assert report["decompressed_bytes_scanned"] == 79993495
          assert report["next_scan_bytes_if_budget_exceeded"] == 80045392
          assert report["scan_budget_reached"] is True
          assert report["candidate_cap_reached"] is False
          assert report["retained_records"] == 5658
          assert report["retained_normalized_utf8_bytes"] == 5962147
          assert report["candidate_jsonl_sha256"] == (
              "45043f528ee83cb87a94f42ca9164c16463502308bf849a6736498d3b8caa273"
          )
          assert report["per_source"]["cap_00044.jsonl.gz"] == {
              "rows": 40000,
              "decompressed_bytes": 40760649,
              "accepted": 2745,
              "accepted_normalized_utf8_bytes": 3567518,
          }
          assert report["per_source"]["cap_00043.jsonl.gz"] == {
              "rows": 35518,
              "decompressed_bytes": 39232846,
              "accepted": 2913,
              "accepted_normalized_utf8_bytes": 2394629,
          }
          assert report["source_level_project_review_complete"] is False
          assert report["global_dedup_completed"] is False
          assert report["reserved_evaluation_decontamination_completed"] is False
          assert report["post_composition_privacy_complete"] is False
          assert report["canonical_capacity_credited"] == 0
          assert report["family_credit_added"] == 0
          assert report["training_authorized_bytes"] == 0
          assert report["training_eligible"] is False
          assert report["evaluation_eligible"] is False
          assert report["tokenizer_fit_authorized"] is False
          assert report["optimizer_updates"] == 0
          assert report["model_training_executed"] is False
          assert report["final_test_accessed"] is False
          assert report["paid_compute_used"] is False

          def file_sha(path: Path) -> str:
              return hashlib.sha256(path.read_bytes()).hexdigest()

          evidence = {
              "schema_version": "12-6.d03-common-pile-caselaw-real-replay.v1",
              "execution_profile": "LOCAL_FREE",
              "source_git_sha": os.environ["SOURCE_SHA"],
              "source_objects": expected_sources,
              "source_order": expected_order,
              "ordering_policy": report["source_ordering_policy"],
              "two_independent_downloads_per_object_byte_identical": True,
              "two_independent_materializations_byte_identical": True,
              "source_rows_scanned": report["source_rows_scanned"],
              "decompressed_bytes_scanned": report["decompressed_bytes_scanned"],
              "next_scan_bytes_if_budget_exceeded": report[
                  "next_scan_bytes_if_budget_exceeded"
              ],
              "scan_budget_reached": report["scan_budget_reached"],
              "retained_records": report["retained_records"],
              "retained_normalized_utf8_bytes": report[
                  "retained_normalized_utf8_bytes"
              ],
              "candidate_jsonl_sha256": report["candidate_jsonl_sha256"],
              "report_file_sha256": file_sha(report_path),
              "report_identity_sha256": report["report_identity_sha256"],
              "per_source": report["per_source"],
              "source_level_project_review_complete": False,
              "global_dedup_completed": False,
              "reserved_evaluation_decontamination_completed": False,
              "post_composition_privacy_complete": False,
              "canonical_capacity_credited": 0,
              "family_credit_added": 0,
              "training_authorized_bytes": 0,
              "training_eligible": False,
              "evaluation_eligible": False,
              "tokenizer_fit_authorized": False,
              "optimizer_updates": 0,
              "model_training_executed": False,
              "final_test_accessed": False,
              "paid_compute_used": False,
          }
          raw = (
              json.dumps(evidence, sort_keys=True, separators=(",", ":")) + "\n"
          ).encode("utf-8")
          evidence["evidence_identity_sha256"] = hashlib.sha256(raw).hexdigest()

          out = root / "caselaw-real-replay-evidence"
          out.mkdir()
          (out / "product_replay_evidence.json").write_text(
              json.dumps(evidence, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          (out / "report.json").write_bytes(report_path.read_bytes())
          print(json.dumps(evidence, sort_keys=True))
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: d03-common-pile-caselaw-real-replay-${{ env.SOURCE_SHA }}
          path: ${{ runner.temp }}/caselaw-real-replay-evidence/
          if-no-files-found: error
          retention-days: 30
