name: MILESTONE-150 Learned Base Ladder V1

on:
  pull_request:
    branches:
      - milestone100/first-learned-base-20260826
    paths:
      - ".github/workflows/milestone150-learned-base-ladder-v1.yml"
      - "src/twelve_six/milestone150*.py"
      - "src/twelve_six/milestone100_first_learned.py"
      - "src/twelve_six/model/**"
      - "src/twelve_six/model.py"
      - "src/twelve_six/training/**"
      - "src/twelve_six/checkpoint/**"
      - "src/twelve_six/checkpoint.py"
      - "src/twelve_six/tokenization/**"
      - "src/twelve_six/inference/**"
      - "data/corpus_v01/**"
      - "configs/data/corpus_v01.json"
      - "requirements/locks/linux-x86_64/**"
      - "tools/ci_dependency_preflight.py"
      - "tools/evidence_finalizer.py"
      - "tests/test_milestone100*.py"
      - "tests/test_milestone150*.py"
      - "tests/test_data25_corpus_v01.py"
  workflow_dispatch:

concurrency:
  group: milestone150-ladder-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  pull-requests: write

jobs:
  learned-base-ladder-v1:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      PYTHONPATH: src
      OMP_NUM_THREADS: "2"
      MKL_NUM_THREADS: "2"
    steps:
      - name: Checkout exact milestone head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Bootstrap durable ladder evidence contract
        env:
          EXPECTED_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          python3 tools/evidence_finalizer.py bootstrap \
            --output milestone150-evidence/ci-diagnostics/bootstrap.json \
            --source-sha "$EXPECTED_SOURCE_SHA" \
            --label milestone150-learned-base-ladder-v1
          python3 tools/evidence_finalizer.py mark-phase \
            --state milestone150-evidence/.ci162-phase.json \
            --source-sha "$EXPECTED_SOURCE_SHA" \
            --phase source_binding

      - name: Set up exact Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11.16"

      - name: Bind exact source
        env:
          EXPECTED_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SOURCE_SHA"

      - name: Dependency and tool preflight before tests or runtime install
        env:
          EXPECTED_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          python3 tools/evidence_finalizer.py mark-phase \
            --state milestone150-evidence/.ci162-phase.json \
            --source-sha "$EXPECTED_SOURCE_SHA" \
            --phase dependency_preflight
          python tools/ci_dependency_preflight.py \
            --profile linux-x86_64 \
            --source-sha "$EXPECTED_SOURCE_SHA" \
            --output milestone150-evidence/machine-ci-preflight.json

      - name: Install hash-locked CPU runtime and test tooling
        env:
          EXPECTED_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          python3 tools/evidence_finalizer.py mark-phase \
            --state milestone150-evidence/.ci162-phase.json \
            --source-sha "$EXPECTED_SOURCE_SHA" \
            --phase environment_install
          python -m venv .m150
          .m150/bin/python -m pip install \
            --disable-pip-version-check --no-deps --require-hashes \
            -r requirements/locks/linux-x86_64/toolchain.lock.txt
          .m150/bin/python -m pip install \
            --disable-pip-version-check --no-deps --require-hashes \
            -r requirements/locks/linux-x86_64/runtime.lock.txt
          .m150/bin/python -m pip install \
            --disable-pip-version-check --no-deps --require-hashes \
            -r requirements/locks/linux-x86_64/dev.lock.txt

      - name: Compile and test convergence contracts
        env:
          EXPECTED_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -uo pipefail
          mkdir -p milestone150-evidence/ci-diagnostics
          python3 tools/evidence_finalizer.py mark-phase \
            --state milestone150-evidence/.ci162-phase.json \
            --source-sha "$EXPECTED_SOURCE_SHA" \
            --phase focused_tests
          test_code=0
          .m150/bin/python -m compileall -q src/twelve_six || test_code=$?
          if [ "$test_code" -eq 0 ]; then
            .m150/bin/python -m pytest -q \
              tests/test_data25_corpus_v01.py \
              tests/test_milestone100_first_learned.py \
              tests/test_milestone100_one_m.py \
              tests/test_milestone150_learned_base_ladder.py \
              --junitxml=milestone150-evidence/ci-diagnostics/focused-tests.xml || test_code=$?
          fi
          python3 tools/evidence_finalizer.py test-status \
            --output milestone150-evidence/ci-diagnostics/focused-test-status.json \
            --source-sha "$EXPECTED_SOURCE_SHA" \
            --exit-code "$test_code" \
            --label milestone150-convergence-contracts
          exit "$test_code"

      - name: Prepare one corpus tokenizer evaluation truth
        env:
          EXPECTED_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          python3 tools/evidence_finalizer.py mark-phase \
            --state milestone150-evidence/.ci162-phase.json \
            --source-sha "$EXPECTED_SOURCE_SHA" \
            --phase truth_prepare
          .m150/bin/python -m twelve_six.milestone150_entrypoint \
            prepare \
            --repo-root . \
            --source-sha "$EXPECTED_SOURCE_SHA" \
            --output-dir milestone150-evidence

      - name: Execute comparable learned 100K rung
        env:
          EXPECTED_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          python3 tools/evidence_finalizer.py mark-phase --state milestone150-evidence/.ci162-phase.json --source-sha "$EXPECTED_SOURCE_SHA" --phase 100k_phase1
          .m150/bin/python -m twelve_six.milestone150_entrypoint phase1 \
            --repo-root . --source-sha "$EXPECTED_SOURCE_SHA" \
            --output-dir milestone150-evidence --scale 100k
          python3 tools/evidence_finalizer.py mark-phase --state milestone150-evidence/.ci162-phase.json --source-sha "$EXPECTED_SOURCE_SHA" --phase 100k_resume
          .m150/bin/python -m twelve_six.milestone150_entrypoint resume \
            --repo-root . --source-sha "$EXPECTED_SOURCE_SHA" \
            --output-dir milestone150-evidence --scale 100k
          python3 tools/evidence_finalizer.py mark-phase --state milestone150-evidence/.ci162-phase.json --source-sha "$EXPECTED_SOURCE_SHA" --phase 100k_verify
          .m150/bin/python -m twelve_six.milestone150_entrypoint verify-scale \
            --repo-root . --source-sha "$EXPECTED_SOURCE_SHA" \
            --output-dir milestone150-evidence --scale 100k

      - name: Execute comparable learned 500K rung
        env:
          EXPECTED_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          python3 tools/evidence_finalizer.py mark-phase --state milestone150-evidence/.ci162-phase.json --source-sha "$EXPECTED_SOURCE_SHA" --phase 500k_phase1
          .m150/bin/python -m twelve_six.milestone150_entrypoint phase1 \
            --repo-root . --source-sha "$EXPECTED_SOURCE_SHA" \
            --output-dir milestone150-evidence --scale 500k
          python3 tools/evidence_finalizer.py mark-phase --state milestone150-evidence/.ci162-phase.json --source-sha "$EXPECTED_SOURCE_SHA" --phase 500k_resume
          .m150/bin/python -m twelve_six.milestone150_entrypoint resume \
            --repo-root . --source-sha "$EXPECTED_SOURCE_SHA" \
            --output-dir milestone150-evidence --scale 500k
          python3 tools/evidence_finalizer.py mark-phase --state milestone150-evidence/.ci162-phase.json --source-sha "$EXPECTED_SOURCE_SHA" --phase 500k_verify
          .m150/bin/python -m twelve_six.milestone150_entrypoint verify-scale \
            --repo-root . --source-sha "$EXPECTED_SOURCE_SHA" \
            --output-dir milestone150-evidence --scale 500k

      - name: Execute comparable learned 1M rung
        env:
          EXPECTED_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          python3 tools/evidence_finalizer.py mark-phase --state milestone150-evidence/.ci162-phase.json --source-sha "$EXPECTED_SOURCE_SHA" --phase 1m_phase1
          .m150/bin/python -m twelve_six.milestone150_entrypoint phase1 \
            --repo-root . --source-sha "$EXPECTED_SOURCE_SHA" \
            --output-dir milestone150-evidence --scale 1m
          python3 tools/evidence_finalizer.py mark-phase --state milestone150-evidence/.ci162-phase.json --source-sha "$EXPECTED_SOURCE_SHA" --phase 1m_resume
          .m150/bin/python -m twelve_six.milestone150_entrypoint resume \
            --repo-root . --source-sha "$EXPECTED_SOURCE_SHA" \
            --output-dir milestone150-evidence --scale 1m
          python3 tools/evidence_finalizer.py mark-phase --state milestone150-evidence/.ci162-phase.json --source-sha "$EXPECTED_SOURCE_SHA" --phase 1m_verify
          .m150/bin/python -m twelve_six.milestone150_entrypoint verify-scale \
            --repo-root . --source-sha "$EXPECTED_SOURCE_SHA" \
            --output-dir milestone150-evidence --scale 1m

      - name: Assemble and validate machine-readable ladder
        env:
          EXPECTED_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          python3 tools/evidence_finalizer.py mark-phase --state milestone150-evidence/.ci162-phase.json --source-sha "$EXPECTED_SOURCE_SHA" --phase ladder_finalize
          .m150/bin/python -m twelve_six.milestone150_entrypoint finalize \
            --repo-root . --source-sha "$EXPECTED_SOURCE_SHA" \
            --output-dir milestone150-evidence
          python3 tools/evidence_finalizer.py mark-phase --state milestone150-evidence/.ci162-phase.json --source-sha "$EXPECTED_SOURCE_SHA" --phase ladder_validate
          .m150/bin/python -m twelve_six.milestone150_entrypoint validate \
            milestone150-evidence/ladder-report.json \
            --expected-source-sha "$EXPECTED_SOURCE_SHA"
          .m150/bin/python - <<'PY'
          import json
          from pathlib import Path
          r = json.loads(Path("milestone150-evidence/ladder-report.json").read_text(encoding="utf-8"))
          print(json.dumps({
              "source_sha": r["source"]["git_sha"],
              "truth_identity": r["truth_model"]["identity_sha256"],
              "evaluation_identity": r["truth_model"]["evaluation_identity"]["identity_sha256"],
              "quality_rank": r["rankings"]["quality"],
              "efficiency_rank": r["rankings"]["efficiency"],
              "scaling_improvement": r["rankings"]["scaling_improvement"],
              "ten_million": r["ten_million"]["status"],
              "report_sha256": r["report_sha256"],
          }, ensure_ascii=False, indent=2, sort_keys=True))
          PY

      - name: Publish exact-head ladder evidence to PR
        if: github.event_name == 'pull_request'
        env:
          EXPECTED_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          python3 tools/evidence_finalizer.py mark-phase --state milestone150-evidence/.ci162-phase.json --source-sha "$EXPECTED_SOURCE_SHA" --phase pr_publish
          .m150/bin/python - <<'PY'
          import json
          from pathlib import Path
          r = json.loads(Path("milestone150-evidence/ladder-report.json").read_text(encoding="utf-8"))
          lines = [
              "### MILESTONE-150 exact-head LEARNED BASE LADDER V1 evidence",
              "",
              f"- source SHA: `{r['source']['git_sha']}`",
              f"- corpus identity: `{r['truth_model']['corpus_identity_sha256']}`",
              f"- evaluation identity: `{r['truth_model']['evaluation_identity']['identity_sha256']}`",
              f"- tokenizer: `{r['truth_model']['tokenizer']['version']}` / `{r['truth_model']['tokenizer']['config_sha256']}`",
              "- retained comparable rungs: `100k`, `500k`, `1m`",
              f"- 10M: `{r['ten_million']['status']}`",
              f"- report SHA-256: `{r['report_sha256']}`",
              "",
              "| scale | params | best step | best BPB | final BPB | optimized tokens | fresh verify |",
              "|---|---:|---:|---:|---:|---:|---|",
          ]
          for scale in ("100k", "500k", "1m"):
              s = r["scales"][scale]
              lines.append(
                  f"| {scale} | {s['model']['parameter_count']} | {s['evaluation']['best_step']} | "
                  f"{s['evaluation']['best_bits_per_byte']:.6f} | {s['evaluation']['final_bits_per_byte']:.6f} | "
                  f"{s['training']['optimized_tokens']} | {s['fresh_verification']['status']} |"
              )
          lines += [
              "",
              "Truth boundary: learned scratch Base checkpoints only; no foreign pretrained weights, SFT, RLHF, DPO or paid compute. No intelligence, production-readiness, alignment or instruction-following claim is made. DATA-25 remains project-authored and is not claimed to be externally representative.",
          ]
          Path("milestone150-evidence/pr-comment.md").write_text("\n".join(lines) + "\n", encoding="utf-8")
          PY
          gh pr comment "$PR_NUMBER" --repo "$GH_REPO" --body-file milestone150-evidence/pr-comment.md

      - name: Mark ladder workflow completion
        if: success()
        env:
          EXPECTED_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          python3 tools/evidence_finalizer.py mark-phase \
            --state milestone150-evidence/.ci162-phase.json \
            --source-sha "$EXPECTED_SOURCE_SHA" \
            --phase complete

      - name: Finalize fail-closed ladder evidence bundle
        id: evidence_finalizer
        if: always()
        env:
          EXPECTED_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          PRIOR_JOB_STATUS: ${{ job.status }}
        run: |
          set -euo pipefail
          python3 tools/evidence_finalizer.py finalize \
            --workspace milestone150-evidence \
            --artifact-dir milestone150-durable-artifact \
            --phase-file milestone150-evidence/.ci162-phase.json \
            --source-sha "$EXPECTED_SOURCE_SHA" \
            --verifier-python .m150/bin/python \
            --repo-root . \
            --job-status "$PRIOR_JOB_STATUS" \
            --retention-days 30

      - name: Upload durable learned ladder evidence
        if: always() && steps.evidence_finalizer.outcome == 'success'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: milestone150-learned-base-ladder-v1
          path: milestone150-durable-artifact/
          if-no-files-found: error
          retention-days: 30
