name: D05 Checkpoint Corruption Focused

on:
  pull_request:
    paths:
      - "src/twelve_six/checkpoint/core.py"
      - "src/twelve_six/checkpoint/trainer_adapter.py"
      - "tests/test_checkpoint_corruption_hardening.py"
      - "tests/test_checkpointing.py"
      - "tests/test_checkpoint_transactional_safety.py"
      - "tests/test_trainer_checkpoint_corruption_preflight.py"
      - ".github/workflows/d05-checkpoint-corruption-focused.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  corruption-matrix:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      TWELVE_SIX_EXECUTION_PROFILE: LOCAL_FREE
      SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      PYTHONPATH: ${{ github.workspace }}/src
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Prove exact source checkout
        run: test "$(git rev-parse HEAD)" = "$SOURCE_SHA"

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11.16"

      - name: Create focused locked checkpoint environment
        uses: ./.github/actions/execution-bootstrap
        with:
          capabilities: runtime,tests
          venv: .d05-corruption
          command: >-
            python -m pytest -q
            tests/test_checkpoint_corruption_hardening.py
            tests/test_checkpoint_transactional_safety.py
            tests/test_checkpointing.py
            tests/test_trainer_checkpoint_corruption_preflight.py
          manifest: d05-corruption-execution-environment.json

      - name: Compile checkpoint module
        run: .d05-corruption/bin/python -m compileall -q src/twelve_six/checkpoint

      - name: Run production checkpoint corruption regressions
        run: >-
          .d05-corruption/bin/python -m pytest -q
          tests/test_checkpoint_corruption_hardening.py
          tests/test_checkpoint_transactional_safety.py
          tests/test_checkpointing.py
          tests/test_trainer_checkpoint_corruption_preflight.py