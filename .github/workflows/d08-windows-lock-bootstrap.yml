name: D08 Windows Lock Profile Guard

on:
  pull_request:
    paths:
      - "requirements/locks/windows-x86_64/**"
      - ".github/workflows/d08-windows-lock-bootstrap.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-committed-windows-profile:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11.16"
      - name: Verify exact Windows profile and lock identities without resolution
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          root = Path("requirements/locks/windows-x86_64")
          profile = json.loads((root / "profile.json").read_text(encoding="utf-8"))
          claimed = profile.pop("manifest_sha256")
          actual = hashlib.sha256(
              json.dumps(profile, sort_keys=True, separators=(",", ":"), ensure_ascii=True).encode()
          ).hexdigest()
          if actual != claimed:
              raise RuntimeError("Windows profile self-hash mismatch")
          if profile["profile_id"] != "windows-x86_64":
              raise RuntimeError("unexpected Windows profile id")
          if profile["python"]["version"] != "3.11.9":
              raise RuntimeError("unexpected Windows runtime Python version")
          for group, record in profile["locks"].items():
              path = Path(record["path"])
              digest = hashlib.sha256(path.read_bytes()).hexdigest()
              count = sum(
                  1 for line in path.read_text(encoding="utf-8").splitlines()
                  if line.strip() and not line.strip().startswith("#")
              )
              if digest != record["sha256"] or count != record["package_count"]:
                  raise RuntimeError(f"{group} lock identity mismatch")
          print(json.dumps({"manifest_sha256": claimed, "verified": True}, sort_keys=True))
          PY
