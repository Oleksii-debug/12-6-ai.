name: Plan 4 Reference Inference
on:
  pull_request:
    paths:
      - "tools/inference_runtime.py"
      - "tests/test_inference_runtime_plan4.py"
      - "docs/PLAN4_SECTION3_REFERENCE_INFERENCE.md"
      - ".github/workflows/plan4-inference.yml"
  push:
    branches: [main]
    paths:
      - "tools/inference_runtime.py"
      - "tests/test_inference_runtime_plan4.py"
      - "docs/PLAN4_SECTION3_REFERENCE_INFERENCE.md"
      - ".github/workflows/plan4-inference.yml"

permissions:
  contents: read

jobs:
  reference-inference:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install exact repository Python dependencies
        run: python -m pip install -e ".[dev]"
      - name: Lint canonical Plan 4 reference inference
        run: ruff check tools/inference_runtime.py tests/test_inference_runtime_plan4.py
      - name: Check Plan 4 inference and guarded evaluation integration
        run: |
          python -m py_compile tools/inference_runtime.py
          python -m pytest -q tests/test_inference_runtime_plan4.py tests/test_evaluation_harness_plan4.py tests/test_evaluation_vault_plan4.py
