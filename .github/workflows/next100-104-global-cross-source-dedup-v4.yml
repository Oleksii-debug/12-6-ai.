name: NEXT100-104 Global Cross-Source Dedup V4

on:
  pull_request:
    paths:
      - ".github/workflows/next100-104-global-cross-source-dedup-v4.yml"
      - "configs/data/next100_063_source_registry_convergence_v1.json"
      - "configs/data/next100_065_cross_source_dedup_v3.json"
      - "configs/data/next100_104_global_cross_source_dedup_v4_extension.json"
      - "src/twelve_six/data/cross_source_capacity_audit.py"
      - "src/twelve_six/data/cross_source_capacity_audit_v3.py"
      - "tests/test_next100_104_global_cross_source_dedup_v4.py"
      - "tools/run_next100_104_global_cross_source_dedup_v4.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  successor-global-dedup:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      TWELVE_SIX_EXECUTION_PROFILE: LOCAL_FREE
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Prove exact source checkout
        env:
          EXPECTED_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SOURCE_SHA"

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11.16"

      - name: Prove exact NIST extractor is available
        run: |
          command -v pdftotext
          pdftotext -v

      - name: Universal exact LOCAL_FREE bootstrap
        uses: ./.github/actions/execution-bootstrap
        with:
          capabilities: runtime,tests,lint
          venv: .next100-104
          command: python -m pytest -q tests/test_data298_cross_source_capacity_audit.py tests/test_next100_065_cross_source_dedup_v3.py tests/test_next100_104_global_cross_source_dedup_v4.py
          manifest: next100-104-execution-environment.json

      - name: Compile successor implementation
        run: >-
          PYTHONPATH=src .next100-104/bin/python -m compileall -q
          src/twelve_six/data/cross_source_capacity_audit.py
          src/twelve_six/data/cross_source_capacity_audit_v3.py
          tools/run_next100_104_global_cross_source_dedup_v4.py

      - name: Inherited plus successor adversarial tests
        run: >-
          PYTHONPATH=src .next100-104/bin/python -m pytest -q
          tests/test_data298_cross_source_capacity_audit.py
          tests/test_next100_065_cross_source_dedup_v3.py
          tests/test_next100_104_global_cross_source_dedup_v4.py

      - name: Focused lint
        run: >-
          .next100-104/bin/ruff check --select E4,E9,F
          tools/run_next100_104_global_cross_source_dedup_v4.py
          tests/test_next100_104_global_cross_source_dedup_v4.py

      - name: Materialize exact 21-object audit twice
        env:
          PYTHONPATH: src
        run: |
          mkdir -p evidence/next100_104/a evidence/next100_104/b
          .next100-104/bin/python tools/run_next100_104_global_cross_source_dedup_v4.py run \
            --base-inventory configs/data/next100_065_cross_source_dedup_v3.json \
            --convergence configs/data/next100_063_source_registry_convergence_v1.json \
            --extension configs/data/next100_104_global_cross_source_dedup_v4_extension.json \
            --report evidence/next100_104/a/report.json
          .next100-104/bin/python tools/run_next100_104_global_cross_source_dedup_v4.py run \
            --base-inventory configs/data/next100_065_cross_source_dedup_v3.json \
            --convergence configs/data/next100_063_source_registry_convergence_v1.json \
            --extension configs/data/next100_104_global_cross_source_dedup_v4_extension.json \
            --report evidence/next100_104/b/report.json
          cmp evidence/next100_104/a/report.json evidence/next100_104/b/report.json

      - name: Verify post-dedup gate and no-training boundary
        env:
          PYTHONPATH: src
        run: |
          .next100-104/bin/python tools/run_next100_104_global_cross_source_dedup_v4.py verify \
            --report evidence/next100_104/a/report.json
          .next100-104/bin/python - <<'PY'
          import json
          from pathlib import Path

          report = json.loads(Path("evidence/next100_104/a/report.json").read_text())
          assert report["source_object_count"] == 21
          assert report["model_training_executed"] is False
          assert report["tokenizer_fit_executed"] is False
          assert report["paid_compute_used"] is False
          assert report["pre_dedup_capacity_bytes"] == {
              "uk": 100856,
              "en": 144151,
              "code": 69133,
              "total": 314140,
          }
          assert report["pre_dedup_family_counts"] == {
              "uk": 4,
              "en": 2,
              "code": 4,
              "total": 10,
          }
          for key in ("uk", "en", "code", "total"):
              assert 0 <= report["post_dedup_capacity_bytes"][key] <= report["pre_dedup_capacity_bytes"][key]
          assert report["next_gate"] in {"BALANCE_DIVERSITY_RETEST", "SOURCE_ACQUISITION_REQUIRED"}
          PY

      - name: Prove text-free public evidence
        run: |
          ! grep -q '"text"' evidence/next100_104/a/report.json
          ! grep -q '"acquisition_url"' evidence/next100_104/a/report.json

      - name: Upload immutable NEXT100-104 evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: next100-104-global-cross-source-dedup-${{ github.event.pull_request.head.sha || github.sha }}
          if-no-files-found: error
          retention-days: 90
          path: |
            configs/data/next100_104_global_cross_source_dedup_v4_extension.json
            next100-104-execution-environment.json
            evidence/next100_104/a/report.json
