name: LEARN-234 External Real 500K Gate

on:
  pull_request:
    branches: [milestone221/learned-base-ladder-v3-20260826]
  workflow_dispatch:

concurrency:
  group: learn234-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  authority-gate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.11.16"
      - uses: ./.github/actions/execution-bootstrap
        with:
          capabilities: runtime,tests
          venv: .learn234
          command: python tools/validate_learn234_authority_gate.py evidence/learn234/authority-gate.json
          manifest: learn234-environment.json
      - name: Revalidate fail-closed gate
        run: |
          set -euo pipefail
          .learn234/bin/python tools/validate_learn234_authority_gate.py \
            evidence/learn234/authority-gate.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: learn234-authority-gate
          path: |
            evidence/learn234/authority-gate.json
            learn234-environment.json
            docs/LEARN234_EXTERNAL_REAL_500K.md
          if-no-files-found: error
          retention-days: 30
