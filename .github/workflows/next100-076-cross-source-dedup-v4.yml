name: NEXT100-076 Cross-Source Dedup V4

on:
  pull_request:
    paths:
      - ".github/workflows/next100-076-cross-source-dedup-v4.yml"
      - "configs/data/next100_076_cross_source_dedup_v4.json"
      - "src/twelve_six/data/cross_source_capacity_audit_v4.py"
      - "tests/test_next100_076_cross_source_dedup_v4.py"
      - "tools/run_next100_076_cross_source_dedup_v4.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  successor-convergence:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      TWELVE_SIX_EXECUTION_PROFILE: LOCAL_FREE
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Prove exact source checkout
        env:
          EXPECTED_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SOURCE_SHA"

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11.16"

      - name: Prove sealed NIST extractor version
        run: |
          pdftotext -v 2>&1 | head -1 | grep -F "pdftotext version 24.02.0"

      - name: Universal exact LOCAL_FREE bootstrap
        uses: ./.github/actions/execution-bootstrap
        with:
          capabilities: runtime,tests,lint
          venv: .next100-076
          command: python -m pytest -q tests/test_next100_076_cross_source_dedup_v4.py
          manifest: next100-076-execution-environment.json

      - name: Compile focused implementation
        run: >-
          PYTHONPATH=src .next100-076/bin/python -m compileall -q
          src/twelve_six/data/cross_source_capacity_audit_v4.py
          tools/run_next100_076_cross_source_dedup_v4.py

      - name: Focused successor tests
        run: >-
          PYTHONPATH=src .next100-076/bin/python -m pytest -q
          tests/test_data298_cross_source_capacity_audit.py
          tests/test_next100_065_cross_source_dedup_v3.py
          tests/test_next100_076_cross_source_dedup_v4.py

      - name: Focused lint
        run: >-
          .next100-076/bin/ruff check --select E4,E9,F
          src/twelve_six/data/cross_source_capacity_audit_v4.py
          tools/run_next100_076_cross_source_dedup_v4.py
          tests/test_next100_076_cross_source_dedup_v4.py

      - name: Materialize converged live audit twice
        env:
          PYTHONPATH: src
        run: |
          mkdir -p evidence/next100_076/a evidence/next100_076/b
          .next100-076/bin/python tools/run_next100_076_cross_source_dedup_v4.py run \
            --inventory configs/data/next100_076_cross_source_dedup_v4.json \
            --report evidence/next100_076/a/report.json
          .next100-076/bin/python tools/run_next100_076_cross_source_dedup_v4.py run \
            --inventory configs/data/next100_076_cross_source_dedup_v4.json \
            --report evidence/next100_076/b/report.json
          cmp evidence/next100_076/a/report.json evidence/next100_076/b/report.json

      - name: Prove NIST removes the English-family blocker without authorizing training
        env:
          PYTHONPATH: src
        run: |
          .next100-076/bin/python tools/run_next100_076_cross_source_dedup_v4.py verify \
            --report evidence/next100_076/a/report.json
          .next100-076/bin/python - <<'PY'
          import json
          from pathlib import Path

          report = json.loads(Path("evidence/next100_076/a/report.json").read_text())
          scope = report["terminal_candidates"]
          en = scope["by_modality"]["en"]
          assert report["source_count"] == 14
          assert report["model_training_executed"] is False
          assert scope["declared_capacity_bytes_before"] == 303328
          assert 0 < scope["conservative_unique_capacity_bytes_after"] <= 303328
          assert scope["stable_origin_count"] == 8
          assert scope["effective_independent_origin_count"] == 8
          assert en["declared_capacity_bytes_before"] == 144151
          assert en["declared_source_family_count"] == 2
          assert en["effective_independent_origin_count"] == 2
          assert scope["by_modality"]["uk"]["declared_capacity_bytes_before"] == 90044
          assert scope["by_modality"]["code"]["declared_capacity_bytes_before"] == 69133
          assert len(report["late_terminal_materialization"]) == 3
          assert sum(item["materialized_bytes"] for item in report["late_terminal_materialization"]) == 59358
          PY

      - name: Prove text-free public evidence
        run: |
          ! grep -q '"text"' evidence/next100_076/a/report.json
          ! grep -q '"acquisition_url"' evidence/next100_076/a/report.json

      - name: Upload immutable NEXT100-076 evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: next100-076-cross-source-dedup-${{ github.event.pull_request.head.sha || github.sha }}
          if-no-files-found: error
          retention-days: 90
          path: |
            configs/data/next100_076_cross_source_dedup_v4.json
            next100-076-execution-environment.json
            evidence/next100_076/a/report.json
