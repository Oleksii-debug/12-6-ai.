name: D03 20M whole-record realization G6 159

on:
  pull_request:
    branches:
      - execution/languk-court-balance-g6-159-20261006
    paths:
      - ".github/workflows/d03_balance_record_realization_g6_159.yml"
      - "tools/run_d03_balance_record_realization_v1.py"

permissions:
  actions: read
  contents: read

concurrency:
  group: d03-record-realization-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  diagnose-two-clean:
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.head_ref == 'execution/languk-court-record-realization-g6-159-20261006'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      EXECUTION_HEAD: ${{ github.event.pull_request.head.sha }}
      PARENT_HEAD: "2419da879af2f293a94f6507871fe2ed109f6ecb"
      RUNNER_BLOB: "2c172e56d82920997c045b54bae6b5b3b2b5b8f9"
      BALANCE_ARTIFACT_ID: "11441000276"
      BALANCE_ARTIFACT_ZIP_SHA256: "85ae6ace4914cd8fae86cef71b8ac63cf73c97b1386ff7e01a716692ddce6c10"
      COMPOSITION_FILE_SHA256: "8a737ca830d0e98095b258c31bb1fc6f5e0c294384484b3f266dad654522850e"
      BALANCE_FILE_SHA256: "655eee7aa4fd0aeb7d124405a420a7148efb0474951f9843e0476bc4f05b56d4"
      SELECTION_HEAD: "8e4efd89dbace1931032dc4283bb5c22cdeda597"
      SELECTION_BLOB: "08fbc509e2acd4913e62ecfc83d8312ebfc2313f"
      SELECTION_PATH: "src/twelve_six/data/current_clean_balanced_selection_v1.py"
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Checkout exact diagnostic head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set exact CPython
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11.16"

      - name: Bind exact execution closure
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXECUTION_HEAD"
          test "$(git merge-base "$PARENT_HEAD" HEAD)" = "$PARENT_HEAD"
          mapfile -t changed < <(git diff --name-only "$PARENT_HEAD"..HEAD | sort)
          test "${#changed[@]}" -eq 2
          test "${changed[0]}" = ".github/workflows/d03_balance_record_realization_g6_159.yml"
          test "${changed[1]}" = "tools/run_d03_balance_record_realization_v1.py"
          test "$(git hash-object tools/run_d03_balance_record_realization_v1.py)" = "$RUNNER_BLOB"
          git diff --quiet HEAD --
          git diff --cached --quiet HEAD --
          python -m py_compile tools/run_d03_balance_record_realization_v1.py
          python -m pip install --disable-pip-version-check "ruff>=0.12"
          ruff check tools/run_d03_balance_record_realization_v1.py

      - name: Bind exact current selection implementation authority
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location --retry 5 --retry-all-errors             -H "Authorization: Bearer $GH_TOKEN"             -H "Accept: application/vnd.github+json"             -H "X-GitHub-Api-Version: 2022-11-28"             -o "$RUNNER_TEMP/selection-authority.json"             "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/contents/${SELECTION_PATH}?ref=${SELECTION_HEAD}"
          python - "$RUNNER_TEMP/selection-authority.json" "$SELECTION_BLOB" "$SELECTION_PATH" <<'PY'
          import json
          import sys
          from pathlib import Path

          value = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          if value.get("sha") != sys.argv[2]:
              raise SystemExit("selection implementation blob drift")
          if value.get("path") != sys.argv[3]:
              raise SystemExit("selection implementation path drift")
          print("SELECTION_IMPLEMENTATION_AUTHORITY_BOUND")
          PY

      - name: Fetch exact qualified 20M balance artifact
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/balance"
          mkdir -p "$root"
          curl --fail --location --retry 5 --retry-all-errors             -H "Authorization: Bearer $GH_TOKEN"             -H "Accept: application/vnd.github+json"             -H "X-GitHub-Api-Version: 2022-11-28"             -o "$RUNNER_TEMP/balance.zip"             "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/actions/artifacts/${BALANCE_ARTIFACT_ID}/zip"
          test "$(sha256sum "$RUNNER_TEMP/balance.zip" | cut -d' ' -f1)" = "$BALANCE_ARTIFACT_ZIP_SHA256"
          unzip -q "$RUNNER_TEMP/balance.zip" -d "$root"
          test "$(sha256sum "$root/composition.json" | cut -d' ' -f1)" = "$COMPOSITION_FILE_SHA256"
          test "$(sha256sum "$root/balance-result.json" | cut -d' ' -f1)" = "$BALANCE_FILE_SHA256"

      - name: Execute two fresh record-realization diagnostics
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/balance"
          for pass_id in 1 2; do
            python tools/run_d03_balance_record_realization_v1.py               --composition-json "$root/composition.json"               --balance-result-json "$root/balance-result.json"               --output "$RUNNER_TEMP/record-realization-${pass_id}.json"
          done
          cmp "$RUNNER_TEMP/record-realization-1.json" "$RUNNER_TEMP/record-realization-2.json"

      - name: Require fail-closed rejection of mutated authorities
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/balance"
          python - "$root/composition.json" "$RUNNER_TEMP/mutated-composition.json" <<'PY'
          import json
          import sys
          from pathlib import Path

          value = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          value["combined_inventory"]["records"][0]["payload_bytes"] += 1
          Path(sys.argv[2]).write_text(
              json.dumps(value, ensure_ascii=False, sort_keys=True, separators=(",", ":")) + "\n",
              encoding="utf-8",
          )
          PY
          if python tools/run_d03_balance_record_realization_v1.py             --composition-json "$RUNNER_TEMP/mutated-composition.json"             --balance-result-json "$root/balance-result.json"             --output "$RUNNER_TEMP/mutated-composition-output.json"; then
            echo "mutated composition unexpectedly accepted" >&2
            exit 1
          fi
          test ! -e "$RUNNER_TEMP/mutated-composition-output.json"

          python - "$root/balance-result.json" "$RUNNER_TEMP/mutated-balance.json" <<'PY'
          import json
          import sys
          from pathlib import Path

          value = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          value["maximum_feasible_total_source_bytes"] -= 100
          Path(sys.argv[2]).write_text(
              json.dumps(value, ensure_ascii=False, sort_keys=True, separators=(",", ":")) + "\n",
              encoding="utf-8",
          )
          PY
          if python tools/run_d03_balance_record_realization_v1.py             --composition-json "$root/composition.json"             --balance-result-json "$RUNNER_TEMP/mutated-balance.json"             --output "$RUNNER_TEMP/mutated-balance-output.json"; then
            echo "mutated balance unexpectedly accepted" >&2
            exit 1
          fi
          test ! -e "$RUNNER_TEMP/mutated-balance-output.json"

      - name: Independently qualify blocker classification
        shell: bash
        run: |
          set -euo pipefail
          python - "$RUNNER_TEMP/record-realization-1.json" <<'PY'
          import hashlib
          import json
          import sys
          from pathlib import Path

          value = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          canonical = lambda item: json.dumps(
              item,
              ensure_ascii=False,
              sort_keys=True,
              separators=(",", ":"),
              allow_nan=False,
          ).encode("utf-8")
          claimed = value["diagnostic_identity_sha256"]
          core = dict(value)
          del core["diagnostic_identity_sha256"]
          assert hashlib.sha256(canonical(core)).hexdigest() == claimed

          assert value["terminal_verdict"] == "BLOCKED_CURRENT_SELECTION_IMPLEMENTATION"
          assert value["current_sparse_selection_can_materialize_exact_balance"] is False
          assert value["reference_policy_compliant_20m_record_selection_exists"] is True
          assert value["target_total_source_bytes"] == 20_000_000
          assert value["target_stratum_bytes"] == {
              "ua": 9_000_000,
              "en": 7_000_000,
              "code": 4_000_000,
          }
          assert value["hard_impossible_canonical_family_allocations"] == [
              "github:numpy/numpy"
          ]
          assert value["budget_blocked_but_reference_exact_families"] == [
              "common-pile/ubuntu_irc",
              "en.loc.selected-digitized-books",
              "ua.rada.open-data.laws-texts",
          ]
          by_family = {
              row["family_id"]: row for row in value["family_diagnostics"]
          }
          assert by_family["github:numpy/numpy"]["allocated_bytes"] == 12_440
          assert by_family["github:numpy/numpy"]["sparse_selector"]["outcome"] == "NO_EXACT_SUBSET"
          assert by_family["github:numpy/numpy"]["reference_bitset_exact_exists"] is False

          expected_budget = {
              "common-pile/ubuntu_irc": "EXPANSION_BUDGET_EXCEEDED",
              "en.loc.selected-digitized-books": "STATE_BUDGET_EXCEEDED",
              "ua.rada.open-data.laws-texts": "EXPANSION_BUDGET_EXCEEDED",
          }
          for family, outcome in expected_budget.items():
              assert by_family[family]["sparse_selector"]["outcome"] == outcome
              assert by_family[family]["reference_bitset_exact_exists"] is True

          assert value["reference_ua_canonical_family_witness_exact"] is True
          assert value["reference_en_canonical_family_witness_exact"] is True
          assert value["reference_code_stratum_exact_whole_record_subset_exists"] is True
          assert value["reference_code_all_family_cap_safe_by_full_capacity"] is True

          zero = {
              "canonical_capacity_credited": 0,
              "training_authorized_bytes": 0,
              "authorized_unique_loss_positions": 0,
              "authorized_optimized_target_exposure": 0,
              "tokenizer_fit_authorized": False,
              "model_training_authorized": False,
              "optimizer_updates_executed_on_real_targets": 0,
              "training_executed": False,
              "learned_weights_created": False,
              "final_test_outcomes_read": False,
              "paid_compute_used": False,
              "scale_promotion_authorized": False,
          }
          for key, expected in zero.items():
              assert value[key] == expected
          print("D03_RECORD_REALIZATION_BLOCKER_QUALIFIED")
          print(json.dumps({
              "diagnostic_identity_sha256": claimed,
              "verdict": value["terminal_verdict"],
              "hard_impossible": value["hard_impossible_canonical_family_allocations"],
              "budget_blocked": value["budget_blocked_but_reference_exact_families"],
              "record_level_20m_exists": value["reference_policy_compliant_20m_record_selection_exists"],
          }, sort_keys=True))
          PY

      - name: Upload text-free diagnostic authority
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: d03-record-realization-${{ github.event.pull_request.head.sha }}
          path: ${{ runner.temp }}/record-realization-1.json
          if-no-files-found: error
          retention-days: 90
