name: D03 preserve probe drift diagnostics repair

on:
  pull_request:
    paths:
      - ".github/workflows/d03-rada-laws-normalization-real.yml"

permissions:
  contents: write

jobs:
  repair-diagnostic-order:
    if: github.event.pull_request.head.ref == 'd03/rada-bulk-normalization-current-main-20260907'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout incumbent branch
        uses: actions/checkout@v4
        with:
          ref: d03/rada-bulk-normalization-current-main-20260907
          fetch-depth: 0
      - name: Preserve legacy structural drift diagnostics
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('tools/normalize_d03_rada_bulk_html.py')
          text = path.read_text(encoding='utf-8')
          old = '''    observed_probe_report_sha256 = _sha256(_serialized_probe_report_bytes(probe))
    if probe_report_sha256 != observed_probe_report_sha256:
        raise NormalizationError(
            "probe report identity does not match deterministic report bytes"
        )
    expected = _validate_probe(probe, config, archive)
'''
          new = '''    expected = _validate_probe(probe, config, archive)
    observed_probe_report_sha256 = _sha256(_serialized_probe_report_bytes(probe))
    if probe_report_sha256 != observed_probe_report_sha256:
        raise NormalizationError(
            "probe report identity does not match deterministic report bytes"
        )
'''
          if old in text:
              path.write_text(text.replace(old, new, 1), encoding='utf-8')
          elif new not in text:
              raise SystemExit('expected diagnostic-order anchor not found')
          PY
      - name: Validate repaired semantics
        run: |
          python -m pip install pytest
          PYTHONPATH=. pytest -q tests/test_d03_rada_bulk_observation_pin.py tests/test_d03_rada_bulk_normalization.py tests/test_d03_rada_bulk_probe_inventory_integrity.py
      - name: Commit product repair if changed
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add tools/normalize_d03_rada_bulk_html.py
          git diff --cached --quiet && exit 0
          git commit -m "D03: preserve probe drift diagnostics under successor binding"
          git push origin HEAD:d03/rada-bulk-normalization-current-main-20260907
