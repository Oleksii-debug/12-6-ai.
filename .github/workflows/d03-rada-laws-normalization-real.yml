name: D03 Rada laws current-source observation

on:
  pull_request:
    paths:
      - ".github/workflows/d03-rada-laws-normalization-real.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  observe-current-source:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.ref == 'd03/rada-bulk-normalization-current-main-20260907'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact incumbent head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Re-acquire current official archive
        run: |
          set -euo pipefail
          curl --fail --location --retry 4 --retry-all-errors \
            --output "$RUNNER_TEMP/texts.zip" \
            "https://data.rada.gov.ua/ogd/zak/perv/text/texts.zip"
          echo "LIVE_ARCHIVE_BYTES=$(stat -c %s "$RUNNER_TEMP/texts.zip")"
          echo "LIVE_ARCHIVE_MD5=$(md5sum "$RUNNER_TEMP/texts.zip" | awk '{print $1}')"
          echo "LIVE_ARCHIVE_SHA256=$(sha256sum "$RUNNER_TEMP/texts.zip" | awk '{print $1}')"

      - name: Observe current archive without granting corpus or training credit
        run: |
          set -euo pipefail
          python tools/probe_d03_rada_bulk_source.py \
            --archive "$RUNNER_TEMP/texts.zip" \
            --accept-current-upstream \
            --output "$RUNNER_TEMP/current-observation.json"

      - name: Prove zero-credit observation and publish exact identities
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib, json, os, subprocess
          from pathlib import Path
          p = Path(os.environ["RUNNER_TEMP"]) / "current-observation.json"
          raw = p.read_bytes()
          r = json.loads(raw)
          assert r["gates"]["exact_archive_identity"] == "OBSERVED_UNPINNED"
          assert r["gates"]["safe_zip_inventory"] == "PASS"
          assert r["training_authorized_bytes"] == 0
          assert r["corpus_admitted"] is False
          assert r["tokenizer_fit_authorized"] is False
          assert r["model_training_executed"] is False
          assert r["paid_compute_used"] is False
          for gate in ("canonical_normalization", "quality", "privacy", "global_cross_source_dedup", "evaluation_decontamination", "balance_diversity", "corpus_materialization", "unique_loss_ledger"):
              assert r["gates"][gate] == "NOT_RUN"
          print("OBSERVATION_EXECUTION_HEAD=" + subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip())
          print("OBSERVATION_REPORT_SHA256=" + hashlib.sha256(raw).hexdigest())
          print("ARCHIVE_BYTES=" + str(r["archive"]["bytes"]))
          print("ARCHIVE_MD5=" + r["archive"]["md5"])
          print("ARCHIVE_SHA256=" + r["archive"]["sha256"])
          print("CANONICAL_ENTRY_COUNT=" + str(r["inventory"]["canonical_entry_count"]))
          print("CANONICAL_RAW_BYTES=" + str(r["inventory"]["canonical_raw_bytes"]))
          print("ENTRY_IDENTITY_SHA256=" + r["inventory"]["entry_identity_sha256"])
          print("DISCOVERY_CAPACITY_GATE=" + r["gates"]["discovery_capacity_threshold"])
          print("SAFE_RESULT=" + r["safe_result"])
          PY

      - name: Upload text-free current observation
        uses: actions/upload-artifact@v4
        with:
          name: d03-rada-laws-current-observation-zero-credit
          path: ${{ runner.temp }}/current-observation.json
          retention-days: 2
          compression-level: 9
          if-no-files-found: error
