name: D03 Rada laws pinned normalization real execution

on:
  pull_request:
    paths:
      - ".github/workflows/d03-rada-laws-normalization-real.yml"

permissions:
  contents: read
  actions: read

jobs:
  execute-pinned-normalization-twice:
    if: github.event.pull_request.head.ref == 'd03/rada-bulk-normalization-current-main-20260907'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exact Product head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Retrieve exact live observation authority
        uses: actions/download-artifact@v4
        with:
          name: d03-rada-laws-current-observation-zero-credit
          github-token: ${{ github.token }}
          repository: Oleksii-debug/12-6-ai.
          run-id: 34535608294
          path: ${{ runner.temp }}/observation

      - name: Verify authority and focused mechanics
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib, json
          from pathlib import Path

          path = Path("${{ runner.temp }}/observation/current-observation.json")
          raw = path.read_bytes()
          report = json.loads(raw)
          assert hashlib.sha256(raw).hexdigest() == "e2ad0d8a4fce01d2da03fc93d636354253beaaf563db43968b11b600e26d0cdf"
          assert report["archive"] == {
              "bytes": 46709153,
              "md5": "7ca9726549958ed8b8b54e6562c15da5",
              "sha256": "0b9e8ed8fe8aa663a68d2bc4eba858a754c626391dd7b5c461d50c3b6260df63",
              "url": "https://data.rada.gov.ua/ogd/zak/perv/text/texts.zip",
          }
          assert report["inventory"]["canonical_entry_count"] == 3052
          assert report["inventory"]["canonical_raw_bytes"] == 353426370
          assert report["inventory"]["entry_identity_sha256"] == "3939c8a407a910222173bba5a2df1b9c7d2edce1503c13b31a9c293d61c3a603"
          assert report["gates"]["discovery_capacity_threshold"] == "FAIL_BELOW_MINIMUM"
          assert report["training_authorized_bytes"] == 0
          assert report["corpus_admitted"] is False
          assert report["tokenizer_fit_authorized"] is False
          assert report["model_training_executed"] is False
          assert report["paid_compute_used"] is False
          PY
          python -m pip install pytest
          python -m py_compile tools/pin_d03_rada_bulk_observation.py tools/normalize_d03_rada_bulk_html.py
          PYTHONPATH=. pytest -q \
            tests/test_d03_rada_bulk_observation_pin.py \
            tests/test_d03_rada_bulk_normalization.py \
            tests/test_d03_rada_bulk_probe_inventory_integrity.py
          git diff --check

      - name: Acquire exact current archive twice
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --retry-all-errors \
            --output "${RUNNER_TEMP}/source-a.zip" \
            "https://data.rada.gov.ua/ogd/zak/perv/text/texts.zip"
          curl --fail --location --retry 3 --retry-all-errors \
            --output "${RUNNER_TEMP}/source-b.zip" \
            "https://data.rada.gov.ua/ogd/zak/perv/text/texts.zip"
          python - <<'PY'
          import hashlib, os
          from pathlib import Path

          expected_bytes = 46709153
          expected_sha = "0b9e8ed8fe8aa663a68d2bc4eba858a754c626391dd7b5c461d50c3b6260df63"
          expected_md5 = "7ca9726549958ed8b8b54e6562c15da5"
          for name in ("source-a.zip", "source-b.zip"):
              raw = (Path(os.environ["RUNNER_TEMP"]) / name).read_bytes()
              assert len(raw) == expected_bytes, (name, len(raw))
              assert hashlib.sha256(raw).hexdigest() == expected_sha, name
              assert hashlib.md5(raw, usedforsecurity=False).hexdigest() == expected_md5, name
          assert (Path(os.environ["RUNNER_TEMP"]) / "source-a.zip").read_bytes() == (Path(os.environ["RUNNER_TEMP"]) / "source-b.zip").read_bytes()
          PY

      - name: Pin and normalize two clean acquisitions independently
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/run-a" "${RUNNER_TEMP}/run-b"
          for run in a b; do
            python tools/pin_d03_rada_bulk_observation.py \
              --archive "${RUNNER_TEMP}/source-${run}.zip" \
              --probe-report "${RUNNER_TEMP}/observation/current-observation.json" \
              --config configs/data/d03_rada_bulk_observation_pin_v1.json \
              --output "${RUNNER_TEMP}/run-${run}/pinned-report.json"
            python tools/normalize_d03_rada_bulk_html.py \
              --archive "${RUNNER_TEMP}/source-${run}.zip" \
              --probe-report "${RUNNER_TEMP}/run-${run}/pinned-report.json" \
              --config configs/data/d03_rada_bulk_normalization_v1.json \
              --output-jsonl "${RUNNER_TEMP}/run-${run}/normalized.jsonl" \
              --output-manifest "${RUNNER_TEMP}/run-${run}/manifest.json"
          done
          cmp "${RUNNER_TEMP}/run-a/pinned-report.json" "${RUNNER_TEMP}/run-b/pinned-report.json"
          cmp "${RUNNER_TEMP}/run-a/normalized.jsonl" "${RUNNER_TEMP}/run-b/normalized.jsonl"
          cmp "${RUNNER_TEMP}/run-a/manifest.json" "${RUNNER_TEMP}/run-b/manifest.json"

      - name: Build compact text-free execution evidence
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib, json, os, platform, sys
          from pathlib import Path

          root = Path(os.environ["RUNNER_TEMP"])
          manifest_raw_a = (root / "run-a/manifest.json").read_bytes()
          manifest_raw_b = (root / "run-b/manifest.json").read_bytes()
          manifest_a = json.loads(manifest_raw_a)
          manifest_b = json.loads(manifest_raw_b)
          assert manifest_a == manifest_b
          assert manifest_a["training_authorized_bytes"] == 0
          assert manifest_a["normalized_capacity_credited"] == 0
          assert manifest_a["tokenizer_fit_authorized"] is False
          assert manifest_a["model_training_executed"] is False
          assert manifest_a["paid_compute_used"] is False
          assert all(manifest_a["gates"][gate] == "NOT_RUN" for gate in (
              "quality", "privacy", "global_cross_source_dedup",
              "evaluation_decontamination", "balance_diversity",
              "corpus_materialization", "unique_loss_ledger",
          ))

          def sha(path: Path) -> str:
              return hashlib.sha256(path.read_bytes()).hexdigest()

          source_a = root / "source-a.zip"
          source_b = root / "source-b.zip"
          pin_a = root / "run-a/pinned-report.json"
          pin_b = root / "run-b/pinned-report.json"
          jsonl_a = root / "run-a/normalized.jsonl"
          jsonl_b = root / "run-b/normalized.jsonl"

          evidence = {
              "schema_version": "12-6.d03-rada-bulk-normalization-real-execution-evidence.v1",
              "execution_class": "LOCAL_FREE_GITHUB_HOSTED_ACTIONS",
              "product_head_sha": os.environ["GITHUB_SHA"],
              "workflow_run_id": int(os.environ["GITHUB_RUN_ID"]),
              "workflow_run_attempt": int(os.environ["GITHUB_RUN_ATTEMPT"]),
              "source_authority": {
                  "observation_run_id": 34535608294,
                  "observation_artifact_id": 10175280333,
                  "observation_artifact_digest": "sha256:dba1429ae36456a8cb080ef7f42648b643c45bbc2585fcc133051bdf79632b32",
                  "observation_report_sha256": "e2ad0d8a4fce01d2da03fc93d636354253beaaf563db43968b11b600e26d0cdf",
                  "archive_bytes": source_a.stat().st_size,
                  "archive_sha256": sha(source_a),
                  "archive_md5": hashlib.md5(source_a.read_bytes(), usedforsecurity=False).hexdigest(),
                  "canonical_entry_count": 3052,
                  "canonical_raw_bytes": 353426370,
                  "entry_identity_sha256": "3939c8a407a910222173bba5a2df1b9c7d2edce1503c13b31a9c293d61c3a603",
              },
              "two_clean_reproducibility": {
                  "independent_source_downloads_identical": sha(source_a) == sha(source_b),
                  "pinned_reports_identical": sha(pin_a) == sha(pin_b),
                  "normalized_jsonl_identical": sha(jsonl_a) == sha(jsonl_b),
                  "manifests_identical": sha(root / "run-a/manifest.json") == sha(root / "run-b/manifest.json"),
                  "pinned_report_sha256": sha(pin_a),
                  "normalized_jsonl_sha256": sha(jsonl_a),
                  "manifest_file_sha256": sha(root / "run-a/manifest.json"),
                  "manifest_identity_sha256": manifest_a["manifest_identity_sha256"],
              },
              "observed_normalization": {
                  "record_count": manifest_a["normalization"]["record_count"],
                  "nonempty_record_count": manifest_a["normalization"]["nonempty_record_count"],
                  "raw_bytes": manifest_a["normalization"]["raw_bytes"],
                  "normalized_bytes_observed_not_credited": manifest_a["normalization"]["normalized_bytes_observed_not_credited"],
                  "source_encoding_counts": manifest_a["normalization"]["source_encoding_counts"],
                  "normalized_record_inventory_sha256": manifest_a["normalization"]["normalized_record_inventory_sha256"],
              },
              "environment": {
                  "python": sys.version.split()[0],
                  "platform": platform.platform(),
                  "runner_os": os.environ.get("RUNNER_OS"),
                  "runner_arch": os.environ.get("RUNNER_ARCH"),
              },
              "truth_boundary": {
                  "current_corpus_eligible": False,
                  "training_authorized": False,
                  "training_authorized_bytes": 0,
                  "tokenizer_fit_authorized": False,
                  "authorized_optimized_target_exposure": 0,
                  "model_training_executed": False,
                  "learned_weights_created": False,
                  "final_test_accessed": False,
                  "paid_compute_used": False,
                  "foreign_pretrained_weights": False,
              },
              "safe_result": "NORMALIZED_CANDIDATE_ZERO_CREDIT_TWO_CLEAN_REAL_EXECUTION",
          }
          canonical = json.dumps(evidence, ensure_ascii=False, sort_keys=True, separators=(",", ":")).encode("utf-8")
          evidence["evidence_identity_sha256"] = hashlib.sha256(canonical).hexdigest()
          out = root / "d03-rada-laws-normalization-real-execution-v1.json"
          out.write_text(json.dumps(evidence, ensure_ascii=False, sort_keys=True, indent=2) + "\n", encoding="utf-8")
          print("EVIDENCE_JSON=" + json.dumps(evidence, ensure_ascii=False, sort_keys=True, separators=(",", ":")))
          PY

      - name: Upload text-free execution evidence only
        uses: actions/upload-artifact@v4
        with:
          name: d03-rada-laws-normalization-real-zero-credit
          path: ${{ runner.temp }}/d03-rada-laws-normalization-real-execution-v1.json
          if-no-files-found: error
          retention-days: 2
