name: DATA34 Fixed-Control Mixture Experiment

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mixture-268k-local-free:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11.16"
      - name: Bind exact source head
        env:
          EXPECTED_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SOURCE_SHA"
      - name: Install hash-locked LOCAL_FREE runtime
        run: |
          python -m venv .data34
          .data34/bin/python -m pip install \
            --disable-pip-version-check --no-deps --require-hashes \
            -r requirements/locks/linux-x86_64/toolchain.lock.txt
          .data34/bin/python -m pip install \
            --disable-pip-version-check --no-deps --require-hashes \
            -r requirements/locks/linux-x86_64/runtime.lock.txt
      - name: Run focused deterministic contract tests
        env:
          PYTHONPATH: src
        run: |
          .data34/bin/python -m pytest -q \
            tests/test_mixture_experiment.py \
            tests/test_scaling_experiment.py
      - name: Run four fixed-control mixture trainings
        env:
          EXPECTED_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          PYTHONPATH: src
        run: |
          .data34/bin/python -m twelve_six.mixture_experiment \
            --source-sha "$EXPECTED_SOURCE_SHA" \
            --config configs/experiments/data34_mixture_268k_v1.json \
            --output data34-mixture-evidence.json
      - name: Validate retained report identity
        env:
          EXPECTED_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          PYTHONPATH: src
        run: |
          .data34/bin/python - <<'PY'
          import json, os
          from pathlib import Path
          from twelve_six.mixture_experiment import validate_report
          report = json.loads(Path("data34-mixture-evidence.json").read_text(encoding="utf-8"))
          validate_report(report, expected_source_sha=os.environ["EXPECTED_SOURCE_SHA"])
          print(report["report_sha256"])
          PY
      - name: Upload DATA34 evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: data34-mixture-268k-evidence
          path: |
            data34-mixture-evidence.json
            configs/experiments/data34_mixture_268k_v1.json
          if-no-files-found: error
          retention-days: 30
