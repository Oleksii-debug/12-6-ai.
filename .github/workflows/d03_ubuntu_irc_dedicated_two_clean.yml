name: D03 Ubuntu IRC dedicated two-clean

on:
  pull_request:
    branches:
      - integration/ubuntu-irc-current-main-g8-132-20261005

permissions:
  actions: read
  contents: read

concurrency:
  group: d03-ubuntu-irc-dedicated-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: false

jobs:
  ubuntu-irc-global-dedup:
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.head_ref == 'execution/ubuntu-irc-global-dedup-g8-132-20261005'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        pass_id: [1, 2]
    env:
      EXECUTION_SHA: ${{ github.event.pull_request.head.sha }}
      PARENT_SHA: e0bbcbce07a480651be0d16f3be8c1782fc699ca
      V7_HEAD: d3333ec1b4a508df232a5aefccd6686adda745fb
      POPPLER_VERSION: "25.06.0"
      POPPLER_TARBALL_SHA256: 8199532d38984fab46dbd0020ec9c40f20e928e33e9b4cc6043572603a821d83
      CANDIDATE_SHA256: d6a0eaea27313e0d5146bc2a0624104541923ef06b12f01c22b3ccf6956eb6c2
      CANDIDATE_RECORDS: "972"
      CANDIDATE_TEXT_BYTES: "4799981"
      PYTHONPATH: src
      TWELVE_SIX_EXECUTION_PROFILE: LOCAL_FREE

    steps:
      - name: Checkout exact execution head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set exact CPython
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.11.16"

      - name: Bind parent and executable closure
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXECUTION_SHA"
          test "$(git merge-base "$PARENT_SHA" HEAD)" = "$PARENT_SHA"
          mapfile -t changed < <(git diff --name-only "$PARENT_SHA"..HEAD | sort)
          expected=(
            ".github/workflows/d03_ubuntu_irc_dedicated_two_clean.yml"
            "tools/run_d03_ubuntu_irc_global_dedup_execution_v1.py"
          )
          test "${#changed[@]}" -eq "${#expected[@]}"
          test "${changed[0]}" = "${expected[0]}"
          test "${changed[1]}" = "${expected[1]}"
          git diff --quiet HEAD --
          git diff --cached --quiet HEAD --
          git cat-file -e "$V7_HEAD^{commit}"
          python -m py_compile \
            tools/materialize_d03_common_pile_ubuntu_irc_v1.py \
            tools/run_d03_ubuntu_irc_global_dedup_execution_v1.py \
            src/twelve_six/data/ubuntu_irc_v9_intake.py

      - name: Install canonical runtime and Poppler build dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --upgrade pip
          python -m pip install --disable-pip-version-check -e .
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            build-essential ca-certificates cmake curl libfontconfig1-dev \
            libfreetype6-dev libharfbuzz-dev libjpeg-dev liblcms2-dev \
            libopenjp2-7-dev libpng-dev libtiff-dev ninja-build pkg-config zlib1g-dev

      - name: Build exact pinned Poppler pdftotext
        shell: bash
        env:
          PASS_ID: ${{ matrix.pass_id }}
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --retry-delay 2 \
            "https://poppler.freedesktop.org/poppler-${POPPLER_VERSION}.tar.xz" \
            --output /tmp/poppler.tar.xz
          echo "${POPPLER_TARBALL_SHA256}  /tmp/poppler.tar.xz" | \
            sha256sum --check --strict
          tar -C /tmp -xf /tmp/poppler.tar.xz
