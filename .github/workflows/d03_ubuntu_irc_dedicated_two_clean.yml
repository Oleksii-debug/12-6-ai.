name: D03 Ubuntu IRC dedicated two-clean

on:
  pull_request:
    branches:
      - integration/ubuntu-irc-current-main-g8-132-20261005

permissions:
  actions: read
  contents: read

concurrency:
  group: d03-ubuntu-irc-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: false

jobs:
  ubuntu-irc-two-clean:
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.head_ref == 'execution/ubuntu-irc-global-dedup-g8-132-20261005'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      EXECUTION_SHA: ${{ github.event.pull_request.head.sha }}
      PARENT_SHA: e0bbcbce07a480651be0d16f3be8c1782fc699ca
      V7_HEAD: d3333ec1b4a508df232a5aefccd6686adda745fb
      POPPLER_VERSION: "25.06.0"
      POPPLER_TARBALL_SHA256: 8199532d38984fab46dbd0020ec9c40f20e928e33e9b4cc6043572603a821d83
      CANDIDATE_SHA256: d6a0eaea27313e0d5146bc2a0624104541923ef06b12f01c22b3ccf6956eb6c2
      PYTHONPATH: src
      TWELVE_SIX_EXECUTION_PROFILE: LOCAL_FREE

    steps:
      - name: Checkout exact execution head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set exact CPython
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.11.16"

      - name: Bind branch and syntax
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXECUTION_SHA"
          test "$(git merge-base "$PARENT_SHA" HEAD)" = "$PARENT_SHA"
          mapfile -t changed < <(git diff --name-only "$PARENT_SHA"..HEAD | sort)
          test "@@BASH#changed[@]@@" -eq 2
          test "${changed[0]}" = ".github/workflows/d03_ubuntu_irc_dedicated_two_clean.yml"
          test "${changed[1]}" = "tools/run_d03_ubuntu_irc_global_dedup_execution_v1.py"
          git diff --quiet HEAD --
          git diff --cached --quiet HEAD --
          git cat-file -e "$V7_HEAD^{commit}"
          python -m py_compile             tools/materialize_d03_common_pile_ubuntu_irc_v1.py             tools/run_d03_ubuntu_irc_global_dedup_execution_v1.py             src/twelve_six/data/ubuntu_irc_v9_intake.py

      - name: Install runtime and exact Poppler
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check -e .
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends             build-essential ca-certificates cmake curl libfontconfig1-dev             libfreetype6-dev libharfbuzz-dev libjpeg-dev liblcms2-dev             libopenjp2-7-dev libpng-dev libtiff-dev ninja-build pkg-config zlib1g-dev
          curl --fail --location --retry 3 --retry-delay 2             "https://poppler.freedesktop.org/poppler-${POPPLER_VERSION}.tar.xz"             --output /tmp/poppler.tar.xz
          echo "${POPPLER_TARBALL_SHA256}  /tmp/poppler.tar.xz" | sha256sum --check --strict
          tar -C /tmp -xf /tmp/poppler.tar.xz
          cmake -S "/tmp/poppler-${POPPLER_VERSION}" -B /tmp/poppler-build -G Ninja             -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=/usr/local             -DENABLE_UTILS=ON -DENABLE_CPP=OFF -DENABLE_GLIB=OFF             -DENABLE_QT5=OFF -DENABLE_QT6=OFF -DENABLE_BOOST=OFF             -DENABLE_LIBCURL=OFF -DENABLE_NSS3=OFF -DENABLE_GPGME=OFF             -DBUILD_GTK_TESTS=OFF -DBUILD_QT5_TESTS=OFF -DBUILD_QT6_TESTS=OFF             -DBUILD_CPP_TESTS=OFF -DBUILD_MANUAL_TESTS=OFF
          cmake --build /tmp/poppler-build --parallel 2
          sudo cmake --install /tmp/poppler-build
          sudo ldconfig
          pdftotext -v 2>&1 | tee "$RUNNER_TEMP/pdftotext-version.txt"
          grep -F "pdftotext version ${POPPLER_VERSION}" "$RUNNER_TEMP/pdftotext-version.txt"

      - name: Execute two fresh materialization and dedup passes
        shell: bash
        run: |
          set -euo pipefail
          for pass_id in 1 2; do
            root="$RUNNER_TEMP/pass-$pass_id"
            mkdir -p "$root"
            git worktree add --detach "$root/v7" "$V7_HEAD"
            test -z "$(git -C "$root/v7" status --porcelain=v1 --untracked-files=all)"
            python tools/materialize_d03_common_pile_ubuntu_irc_v1.py               --shard "$root/source.jsonl.gz"               --output-jsonl "$root/candidate.jsonl"               --report "$root/materialization.json"               --download
            test "$(sha256sum "$root/candidate.jsonl" | cut -d' ' -f1)" = "$CANDIDATE_SHA256"
            test "$(wc -l < "$root/candidate.jsonl" | tr -d ' ')" = 972
            python tools/run_d03_ubuntu_irc_global_dedup_execution_v1.py               --v7-root "$root/v7"               --bulk-workspace "$root/bulk"               --candidate-jsonl "$root/candidate.jsonl"               --expected-execution-head "$EXECUTION_SHA"               --output-base-report "$root/base.json"               --output-combined-report "$root/combined.json"               --output-survivors "$root/survivors.json"               --output-evidence "$root/evidence.json"
            rm -f "$root/candidate.jsonl" "$root/source.jsonl.gz"
          done

      - name: Require deterministic text-free two-clean result
        shell: bash
        run: |
          set -euo pipefail
          for file in materialization.json base.json combined.json survivors.json evidence.json; do
            cmp "$RUNNER_TEMP/pass-1/$file" "$RUNNER_TEMP/pass-2/$file"
          done
          python - "$RUNNER_TEMP/pass-1" "$EXECUTION_SHA" <<'PY'
          import hashlib
          import json
          import sys
          from pathlib import Path

          root = Path(sys.argv[1])
          head = sys.argv[2]
          evidence = json.loads((root / "evidence.json").read_text(encoding="utf-8"))
          assert evidence["execution_head_sha"] == head
          assert evidence["ubuntu_irc"]["candidate_sha256"] == (
              "d6a0eaea27313e0d5146bc2a0624104541923ef06b12f01c22b3ccf6956eb6c2"
          )
          assert evidence["ubuntu_irc"]["candidate_source_object_count"] == 972
          assert evidence["ubuntu_irc"]["candidate_normalized_utf8_bytes"] == 4_799_981
          marginal = evidence["ubuntu_irc"]["marginal_global_unique_capacity_bytes"]
          assert type(marginal) is int and 0 <= marginal <= 4_799_981
          truth = evidence["truth_boundary"]
          assert truth["canonical_capacity_credited"] == 0
          assert truth["training_authorized_bytes"] == 0
          assert truth["authorized_optimized_target_exposure"] == 0
          assert truth["tokenizer_fit_authorized"] is False
          assert truth["model_training_authorized"] is False
          assert truth["optimizer_updates"] == 0
          assert truth["training_executed"] is False
          assert truth["learned_weights_created"] is False
          assert truth["final_test_outcomes_read"] is False
          assert truth["paid_compute_used"] is False
          proof = {
              "schema_version": "12-6.d03-ubuntu-irc-global-dedup-two-clean-proof.v1",
              "execution_head_sha": head,
              "parent_convergence_head_sha": evidence["parent_convergence_head_sha"],
              "candidate_sha256": evidence["ubuntu_irc"]["candidate_sha256"],
              "candidate_records": 972,
              "candidate_normalized_utf8_bytes": 4_799_981,
              "base_report_sha256": evidence["base"]["report_sha256"],
              "combined_report_sha256": evidence["combined"]["report_sha256"],
              "survivor_authority_sha256": evidence["survivor_authority_sha256"],
              "marginal_global_unique_capacity_bytes": marginal,
              "two_fresh_executions_converged": True,
              "raw_candidate_retained": False,
              "canonical_capacity_credited": 0,
              "tokenizer_fit_authorized": False,
              "training_executed": False,
              "final_test_outcomes_read": False,
              "paid_compute_used": False,
          }
          raw = json.dumps(
              proof, ensure_ascii=False, sort_keys=True, separators=(",", ":")
          ).encode("utf-8")
          proof["proof_identity_sha256"] = hashlib.sha256(raw).hexdigest()
          Path("ubuntu-irc-two-clean-proof.json").write_text(
              json.dumps(proof, sort_keys=True, separators=(",", ":")) + "
",
              encoding="utf-8",
          )
          print(json.dumps(proof, sort_keys=True))
          PY

      - name: Upload text-free authorities
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ubuntu-irc-two-clean-${{ github.event.pull_request.head.sha }}
          path: |
            ${{ runner.temp }}/pass-1/materialization.json
            ${{ runner.temp }}/pass-1/base.json
            ${{ runner.temp }}/pass-1/combined.json
            ${{ runner.temp }}/pass-1/survivors.json
            ${{ runner.temp }}/pass-1/evidence.json
            ${{ runner.temp }}/pdftotext-version.txt
            ubuntu-irc-two-clean-proof.json
          if-no-files-found: error
          retention-days: 90
