name: VERIFY-218 Independent Learned 10M
run-name: VERIFY-218 exact-artifact independent learned-10M proof

on:
  push:
    branches: [verify218/learned-10m-independent-20260826]
  workflow_dispatch:

concurrency:
  group: verify218-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: read

jobs:
  independent-learned-10m:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      PYTHONPATH: src
      VERIFY218_HEAD_SHA: ${{ github.sha }}
      PRODUCER_SHA: c02c8aa38e691521ae2ab6a4ff3ea1d643efd6ef
      PRODUCER_ARTIFACT_ID: "9602650341"
      PRODUCER_ARTIFACT_ZIP_SHA256: 8631e90417e40365b3fc0d6bc98ee6adda5a4ed24530e675d9a91c93219537ee

    steps:
      - name: Checkout exact verifier head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set exact CPython 3.11.16
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.11.16"

      - name: Universal exact execution bootstrap
        uses: ./.github/actions/execution-bootstrap
        with:
          capabilities: runtime,tests,lint
          venv: .verify218
          manifest: reports/verify218/environment.json
          command: python -m pytest -q tests/test_verify218_learned_10m.py

      - name: Bind exact verifier source and no-training surface
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$VERIFY218_HEAD_SHA"
          test "$VERIFY218_HEAD_SHA" != "$PRODUCER_SHA"
          .verify218/bin/ruff check \
            src/twelve_six/verify218_learned_10m.py \
            tests/test_verify218_learned_10m.py
          .verify218/bin/python -m compileall -q \
            src/twelve_six/verify218_learned_10m.py \
            tests/test_verify218_learned_10m.py
          if grep -En '\b(Trainer|optimizer\.step|backward|save_checkpoint|save_trainer_checkpoint)\b' \
            src/twelve_six/verify218_learned_10m.py; then
            echo "VERIFY-218 must remain verification-only and contain no training mutation path" >&2
            exit 1
          fi

      - name: Run verifier unit and fail-closed tests
        run: |
          set -euo pipefail
          .verify218/bin/python -m pytest -q tests/test_verify218_learned_10m.py

      - name: Download exact immutable LEARN-217 artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p learned-artifacts/zips learned-artifacts/learn217 reports/verify218
          gh api "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${PRODUCER_ARTIFACT_ID}/zip" \
            > learned-artifacts/zips/learn217.zip
          echo "${PRODUCER_ARTIFACT_ZIP_SHA256}  learned-artifacts/zips/learn217.zip" \
            | sha256sum -c -
          unzip -q learned-artifacts/zips/learn217.zip -d learned-artifacts/learn217

      - name: Execute independent scientific verifier
        run: |
          set -euo pipefail
          .verify218/bin/python -m twelve_six.verify218_learned_10m \
            --repo-root . \
            --artifact-root learned-artifacts/learn217 \
            --verifier-head-sha "$VERIFY218_HEAD_SHA" \
            --output reports/verify218/authority.json

      - name: Enforce terminal authority contract
        run: |
          set -euo pipefail
          .verify218/bin/python - <<'PY'
          import json
          from pathlib import Path
          from twelve_six.checkpoint import hash_json

          path = Path('reports/verify218/authority.json')
          value = json.loads(path.read_text(encoding='utf-8'))
          supplied = value.pop('identity_sha256')
          assert supplied == hash_json(value)
          assert value['worker'] == 'VERIFY-218-LEARNED-10M-INDEPENDENT'
          assert value['state'] == 'VERIFIED_LEARNED_10M'
          assert value['producer']['git_sha'] == 'c02c8aa38e691521ae2ab6a4ff3ea1d643efd6ef'
          assert value['producer']['artifact_id'] == 9602650341
          assert value['producer']['artifact_zip_sha256'] == '8631e90417e40365b3fc0d6bc98ee6adda5a4ed24530e675d9a91c93219537ee'
          assert value['model']['parameter_count'] == 10000640
          assert value['model']['model_spec_sha256'] == '61caa5469123e23b9b72fc2024140bfca84c4c480dcb0a7e712ba800a4f22998'
          assert value['data_and_eval']['corpus_identity_sha256'] == '422f545da93526ceba2c0ff738e0b9deac65f35bfb31d87d2aab068cda091fc8'
          assert value['data_and_eval']['ladder_common_evaluation_identity_sha256'] == '7189e6df053574beb686727c94e684cdbaf08a34ef33aa953eff7cdae0320113'
          assert value['data_and_eval']['best_improved_over_reconstructed_random_init'] is True
          assert value['data_and_eval']['final_improved_over_reconstructed_random_init'] is True
          assert value['boundaries']['training_executed'] is False
          assert value['boundaries']['optimizer_updates'] == 0
          assert value['boundaries']['paid_compute'] is False
          assert value['boundaries']['foreign_pretrained_weights'] is False
          assert value['boundaries']['evaluation_mutated_model'] is False
          print(supplied)
          PY

      - name: Upload independent VERIFY-218 authority
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: verify218-learned-10m-independent
          if-no-files-found: warn
          retention-days: 30
          path: |
            reports/verify218/environment.json
            reports/verify218/authority.json
