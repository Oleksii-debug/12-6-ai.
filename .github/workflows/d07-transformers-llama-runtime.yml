name: D07 Transformers Llama Runtime

on:
  pull_request:

permissions:
  contents: read
  actions: read

concurrency:
  group: d07-transformers-llama-runtime-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  locked-transformers-runtime:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Prove exact source checkout
        env:
          SOURCE_SHA: ${{ github.event.pull_request.head.sha }}
        run: test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11.16"
      - name: Verify canonical D08 locked environment
        env:
          SOURCE_SHA: ${{ github.event.pull_request.head.sha }}
        run: >-
          python tools/verify_locked_environment.py
          --profile linux-x86_64
          --source-sha "$SOURCE_SHA"
          --evidence-out locked-environment-linux-x86_64.json
      - name: Create exact Transformers 5.15 runtime
        run: |
          python -m venv .d07-transformers-locked
          .d07-transformers-locked/bin/python -m pip install --disable-pip-version-check --require-hashes --no-deps -r requirements/locks/linux-x86_64/toolchain.lock.txt
          .d07-transformers-locked/bin/python -m pip install --disable-pip-version-check --require-hashes --no-deps -r requirements/locks/linux-x86_64/runtime.lock.txt
          .d07-transformers-locked/bin/python -m pip install --disable-pip-version-check --require-hashes --no-deps -r requirements/locks/linux-x86_64/dev.lock.txt
          .d07-transformers-locked/bin/python -m pip install --disable-pip-version-check --require-hashes --no-deps -r requirements/locks/transformers-linux-x86_64/runtime.lock.txt
          PIP_NO_INDEX=1 PIP_DISABLE_PIP_VERSION_CHECK=1 .d07-transformers-locked/bin/python -m pip install --no-deps --no-build-isolation -e .
          .d07-transformers-locked/bin/python -m pip check
          .d07-transformers-locked/bin/python - <<'PY'
          import transformers
          import torch
          import twelve_six
          assert transformers.__version__ == "5.15.0", transformers.__version__
          # PyTorch CUDA wheels expose a PEP 440 local build suffix (for example
          # 2.13.0+cu130) even though the exact locked distribution version is
          # torch==2.13.0. Validate the locked public version without rejecting
          # the truthful CUDA build identity retained in runtime evidence below.
          assert torch.__version__.split("+", 1)[0] == "2.13.0", torch.__version__
          print("transformers", transformers.__version__)
          print("torch", torch.__version__)
          print("twelve_six", twelve_six.__version__)
          PY
      - name: Execute actual exported-byte Llama parity and standard-directory load
        env:
          HF_HUB_OFFLINE: "1"
          TRANSFORMERS_OFFLINE: "1"
          HF_HOME: ${{ runner.temp }}/d07-transformers-hf-home
          RUNTIME24_SOURCE_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          PY=.d07-transformers-locked/bin/python
          "$PY" -m ruff check \
            src/twelve_six/inference/transformers_llama.py \
            src/twelve_six/inference/transformers_llama_runtime.py \
            src/twelve_six/inference/llama_runtime_export.py \
            tests/test_transformers_llama_interop.py \
            tests/test_transformers_llama_runtime.py \
            tests/test_transformers_llama_runtime_locked.py \
            tests/test_llama_runtime_export_locked.py
          "$PY" -m pytest -s -q \
            tests/test_transformers_llama_interop.py \
            tests/test_transformers_llama_runtime.py \
            tests/test_transformers_llama_runtime_locked.py \
            tests/test_llama_runtime_export_locked.py \
            | tee runtime24-transformers-evidence.log
      - name: Record runtime identity
        env:
          SOURCE_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          .d07-transformers-locked/bin/python - <<'PY'
          import hashlib
          import json
          import os
          import platform
          from pathlib import Path
          import torch
          import transformers

          overlay = Path("requirements/locks/transformers-linux-x86_64/runtime.lock.txt").read_bytes()
          payload = {
              "schema": "12-6.transformers-llama-runtime-execution.v1",
              "authority": "LOCAL_FREE_LOCKED_TRANSFORMERS_RUNTIME_NOT_PROMOTION",
              "source_sha": os.environ["SOURCE_SHA"],
              "platform": platform.platform(),
              "python": platform.python_version(),
              "torch": torch.__version__,
              "transformers": transformers.__version__,
              "transformers_overlay_lock_sha256": hashlib.sha256(overlay).hexdigest(),
              "actual_exported_byte_runtime_tests": "PASS",
              "standard_llama_directory_from_pretrained": "PASS",
              "foreign_pretrained_weights": False,
              "model_downloaded": False,
              "raw_base_only": True,
              "paid_compute": False,
              "promotion_authority": False,
          }
          canonical = json.dumps(payload, sort_keys=True, separators=(",", ":"), ensure_ascii=False).encode()
          payload["evidence_sha256"] = hashlib.sha256(canonical).hexdigest()
          Path("transformers-llama-runtime-evidence.json").write_text(
              json.dumps(payload, sort_keys=True, indent=2, ensure_ascii=False) + "\n",
              encoding="utf-8",
          )
          PY
          cat transformers-llama-runtime-evidence.json
      - name: Upload runtime evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: d07-transformers-llama-runtime-${{ github.event.pull_request.head.sha }}
          path: |
            locked-environment-linux-x86_64.json
            transformers-llama-runtime-evidence.json
            runtime24-transformers-evidence.log
          if-no-files-found: error
          retention-days: 30

  learned-transformers-d08-runtime:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      LEARNED_ARTIFACT_ID: "9558539580"
      LEARNED_ARTIFACT_DIGEST: "sha256:aa57a7ebd96929fa8fd7eb28b7232de84f00c1062e9550b1237bd931eb60068a"
      LEARNED_RUN_ID: "32835548366"
      LEARNED_SOURCE_SHA: "003e268655b672df9df00afb8a32dbec4db5d2e1"
      D08_SOURCE_SHA: "10da7d4c1d2fe5a229659143877ad82d3739bed9"
      D08_PROFILE_SHA256: "d54843c76befcd0e8a1703f8d34c822fdbf3085351d1d357661b91265148a039"
      D08_OVERLAY_SHA256: "68f73eaac9e3a9418e85e54a3170d1378c51af0161138d0f4f8667c595deb0b0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Prove exact bridge successor checkout
        env:
          SOURCE_SHA: ${{ github.event.pull_request.head.sha }}
        run: test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
      - name: Checkout exact D08 purpose-runtime authority
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: Oleksii-debug/12-6-ai.
          ref: 10da7d4c1d2fe5a229659143877ad82d3739bed9
          path: .runtime97-d08
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11.16"
      - name: Validate exact D08 Transformers purpose profile
        run: |
          set -euo pipefail
          test "$(git -C .runtime97-d08 rev-parse HEAD)" = "$D08_SOURCE_SHA"
          python .runtime97-d08/tools/verify_purpose_environment.py \
            --root .runtime97-d08 \
            --profile linux-x86_64-transformers-interop \
            --validate-only
          python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          root = Path('.runtime97-d08')
          profile_path = root / 'requirements/profiles/linux-x86_64-transformers-interop/profile.json'
          profile = json.loads(profile_path.read_text(encoding='utf-8'))
          overlay_path = root / profile['locks']['overlay']['path']
          assert profile['profile_sha256'] == os.environ['D08_PROFILE_SHA256']
          assert hashlib.sha256(overlay_path.read_bytes()).hexdigest() == os.environ['D08_OVERLAY_SHA256']
          assert profile['python']['version'] == '3.11.16'
          assert profile['direct_requirements'] == ['transformers==5.15.1']
          PY
      - name: Create exact D08 Transformers execution environment
        run: |
          set -euo pipefail
          python -m venv .runtime97
          PY=.runtime97/bin/python
          "$PY" -m pip install --disable-pip-version-check --require-hashes --no-deps -r .runtime97-d08/requirements/locks/linux-x86_64/toolchain.lock.txt
          "$PY" -m pip install --disable-pip-version-check --require-hashes --no-deps -r .runtime97-d08/requirements/locks/linux-x86_64/runtime.lock.txt
          "$PY" -m pip install --disable-pip-version-check --require-hashes --no-deps -r .runtime97-d08/requirements/locks/linux-x86_64/dev.lock.txt
          "$PY" -m pip install --disable-pip-version-check --require-hashes --no-deps -r .runtime97-d08/requirements/profiles/linux-x86_64-transformers-interop/overlay.lock.txt
          PIP_NO_INDEX=1 PIP_DISABLE_PIP_VERSION_CHECK=1 "$PY" -m pip install --no-deps --no-build-isolation -e .
          "$PY" -m pip check
          "$PY" - <<'PY'
          import platform
          import torch
          import transformers
          assert platform.python_version() == '3.11.16', platform.python_version()
          assert torch.__version__.split('+', 1)[0] == '2.13.0', torch.__version__
          assert transformers.__version__ == '5.15.1', transformers.__version__
          print('python', platform.python_version())
          print('torch', torch.__version__)
          print('transformers', transformers.__version__)
          PY
      - name: Verify retained learned artifact identity
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api "repos/${{ github.repository }}/actions/artifacts/$LEARNED_ARTIFACT_ID" > runtime97-source-artifact.json
          test "$(jq -r .id runtime97-source-artifact.json)" = "$LEARNED_ARTIFACT_ID"
          test "$(jq -r .digest runtime97-source-artifact.json)" = "$LEARNED_ARTIFACT_DIGEST"
          test "$(jq -r .workflow_run.id runtime97-source-artifact.json)" = "$LEARNED_RUN_ID"
          test "$(jq -r .workflow_run.head_sha runtime97-source-artifact.json)" = "$LEARNED_SOURCE_SHA"
          test "$(jq -r .expired runtime97-source-artifact.json)" = "false"
      - name: Download exact learned ~1M checkpoint artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          artifact-ids: "9558539580"
          github-token: ${{ github.token }}
          repository: Oleksii-debug/12-6-ai.
          run-id: "32835548366"
          path: runtime97-source
          merge-multiple: true
      - name: Execute learned LlamaForCausalLM parity
        env:
          BRIDGE_SOURCE_SHA: ${{ github.event.pull_request.head.sha }}
          HF_HUB_OFFLINE: "1"
          TRANSFORMERS_OFFLINE: "1"
          HF_HOME: ${{ runner.temp }}/runtime97-hf-home
        run: |
          set -euo pipefail
          PY=.runtime97/bin/python
          find runtime97-source -maxdepth 4 -type f -print | sort
          test -d runtime97-source/scale02-s2-1m-evidence/checkpoint
          test -f runtime97-source/scale02-s2-1m-evidence/s2-1m-executable-preflight.json
          "$PY" -m ruff check tools/runtime97_transformers_learned.py
          "$PY" tools/runtime97_transformers_learned.py \
            --repo-root . \
            --checkpoint-dir runtime97-source/scale02-s2-1m-evidence/checkpoint \
            --training-evidence runtime97-source/scale02-s2-1m-evidence/s2-1m-executable-preflight.json \
            --output-dir runtime97-evidence \
            --bridge-source-sha "$BRIDGE_SOURCE_SHA" \
            --source-artifact-id "$LEARNED_ARTIFACT_ID" \
            --source-artifact-digest "$LEARNED_ARTIFACT_DIGEST" \
            --d08-source-sha "$D08_SOURCE_SHA" \
            --d08-profile-sha256 "$D08_PROFILE_SHA256" \
            --d08-overlay-sha256 "$D08_OVERLAY_SHA256" \
            --max-new-tokens 8 \
            | tee runtime97-execution.log
          cat runtime97-evidence/runtime97-transformers-learned-parity.json
      - name: Upload exact learned parity evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: runtime97-transformers-learned-${{ github.event.pull_request.head.sha }}
          path: |
            runtime97-source-artifact.json
            runtime97-source/locked-environment-linux-x86_64.json
            runtime97-source/scale02-s2-1m-evidence/s2-1m-executable-preflight.json
            runtime97-evidence/runtime97-transformers-learned-parity.json
            runtime97-evidence/canonical-hf-export
            runtime97-evidence/llama-runtime
            runtime97-execution.log
          if-no-files-found: error
          retention-days: 30
