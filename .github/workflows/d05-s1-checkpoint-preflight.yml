name: D05 S1 Checkpoint Preflight

on:
  pull_request:
    paths:
      - "src/twelve_six/checkpoint/s1_preflight.py"
      - "tests/test_s1_checkpoint_preflight.py"
      - "tests/test_checkpoint_integrity_hardening.py"
      - "tests/test_checkpoint_progress_binding.py"
      - "configs/stages/s1_100k.json"
      - "src/twelve_six/checkpoint/**"
      - "src/twelve_six/model.py"
      - "src/twelve_six/training/**"
      - "src/twelve_six/tokenization/**"
      - "src/twelve_six/packing/**"
      - "data/s0/**"
      - "requirements/locks/**"
      - "docs/S1_CHECKPOINT_PREFLIGHT_D05.md"
      - ".github/workflows/d05-s1-checkpoint-preflight.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  s1-checkpoint-preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Prove exact source checkout
        run: test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11.16"
      - name: Verify exact D08 locked environment
        run: >-
          python tools/verify_locked_environment.py
          --profile linux-x86_64
          --source-sha "$SOURCE_SHA"
          --evidence-out locked-environment-linux-x86_64.json
      - name: Create exact locked D05 execution environment
        run: |
          python -m venv .d05-s1-locked
          .d05-s1-locked/bin/python -m pip install --disable-pip-version-check --require-hashes --no-deps -r requirements/locks/linux-x86_64/toolchain.lock.txt
          .d05-s1-locked/bin/python -m pip install --disable-pip-version-check --require-hashes --no-deps -r requirements/locks/linux-x86_64/runtime.lock.txt
          .d05-s1-locked/bin/python -m pip install --disable-pip-version-check --require-hashes --no-deps -r requirements/locks/linux-x86_64/dev.lock.txt
          PIP_NO_INDEX=1 PIP_DISABLE_PIP_VERSION_CHECK=1 .d05-s1-locked/bin/python -m pip install --no-deps --no-build-isolation -e .
      - name: Focused D05 lint and compile gate
        run: |
          .d05-s1-locked/bin/python -m ruff check \
            src/twelve_six/checkpoint/__init__.py \
            src/twelve_six/checkpoint/integrity_hardening.py \
            src/twelve_six/checkpoint/progress_binding.py \
            src/twelve_six/checkpoint/s1_preflight.py \
            tests/test_checkpoint_integrity_hardening.py \
            tests/test_checkpoint_progress_binding.py \
            tests/test_s1_checkpoint_preflight.py
          .d05-s1-locked/bin/python -m compileall -q \
            src/twelve_six/checkpoint \
            tests/test_checkpoint_integrity_hardening.py \
            tests/test_checkpoint_progress_binding.py \
            tests/test_s1_checkpoint_preflight.py
      - name: Focused S1 checkpoint and corruption regression
        run: >-
          .d05-s1-locked/bin/python -m pytest -q
          tests/test_s1_checkpoint_preflight.py
          tests/test_checkpoint_integrity_hardening.py
          tests/test_checkpoint_progress_binding.py
      - name: Execute real S1-shaped checkpoint/resume preflight
        run: |
          .d05-s1-locked/bin/python -m twelve_six.checkpoint.s1_preflight \
            --repo-root . \
            --candidate-sha "$SOURCE_SHA" \
            --output-dir "$RUNNER_TEMP/d05-s1-checkpoint-preflight" \
            --total-steps 4 \
            --split-step 2 \
            --seed 20260825
      - name: Validate non-canonical truth boundary and exact resume
        run: |
          .d05-s1-locked/bin/python - <<'PY'
          import json
          import os
          from pathlib import Path

          from twelve_six.checkpoint.s1_preflight import validate_s1_checkpoint_preflight

          root = Path(os.environ["RUNNER_TEMP"]) / "d05-s1-checkpoint-preflight"
          payload = json.loads(
              (root / "s1-checkpoint-preflight.json").read_text(encoding="utf-8")
          )
          validate_s1_checkpoint_preflight(
              payload,
              expected_candidate_sha=os.environ["SOURCE_SHA"],
          )
          assert payload["canonical_binding"]["accepted"] is False
          assert payload["canonical_binding"]["rejected_as_expected"] is True
          assert payload["resume"]["model_state_exact"] is True
          assert payload["resume"]["trainer_state_exact"] is True
          assert payload["s1_tokenizer_selected"] is False
          assert payload["s1_data_selected"] is False
          assert payload["constraints"]["promotion_claimed"] is False
          assert payload["constraints"]["s1_quality_claimed"] is False
          PY
      - name: Upload S1 engineering checkpoint preflight evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: d05-s1-checkpoint-preflight-${{ env.SOURCE_SHA }}
          path: |
            locked-environment-linux-x86_64.json
            ${{ runner.temp }}/d05-s1-checkpoint-preflight/s1-checkpoint-preflight.json
            ${{ runner.temp }}/d05-s1-checkpoint-preflight/checkpoint/
          if-no-files-found: error
          retention-days: 30
