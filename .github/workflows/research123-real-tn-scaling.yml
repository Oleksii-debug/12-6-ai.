name: RESEARCH-123 Real T/N Scaling

on:
  pull_request:
    paths:
      - "tools/research123_real_tn_scaling.py"
      - "tools/run_research123_real_tn_scaling.py"
      - ".github/workflows/research123-real-tn-scaling.yml"

permissions:
  contents: read

jobs:
  real-bounded-tn-matrix:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Prove exact source checkout
        env:
          SOURCE_SHA: ${{ github.event.pull_request.head.sha }}
        run: test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11.16"
      - name: Verify exact locked runtime identity
        env:
          SOURCE_SHA: ${{ github.event.pull_request.head.sha }}
        run: >-
          python tools/verify_locked_environment.py
          --profile linux-x86_64
          --source-sha "$SOURCE_SHA"
          --evidence-out locked-environment-linux-x86_64.json
      - name: Create exact locked experiment environment
        run: |
          python -m venv .research123-locked
          .research123-locked/bin/python -m pip install --disable-pip-version-check --require-hashes --no-deps -r requirements/locks/linux-x86_64/toolchain.lock.txt
          .research123-locked/bin/python -m pip install --disable-pip-version-check --require-hashes --no-deps -r requirements/locks/linux-x86_64/runtime.lock.txt
          .research123-locked/bin/python -m pip install --disable-pip-version-check --require-hashes --no-deps -r requirements/locks/linux-x86_64/dev.lock.txt
          PIP_NO_INDEX=1 PIP_DISABLE_PIP_VERSION_CHECK=1 .research123-locked/bin/python -m pip install --no-deps --no-build-isolation -e .
      - name: Scope-check only the new orchestration harness
        run: |
          .research123-locked/bin/python -m py_compile tools/research123_real_tn_scaling.py tools/run_research123_real_tn_scaling.py
          .research123-locked/bin/ruff check tools/research123_real_tn_scaling.py tools/run_research123_real_tn_scaling.py
      - name: Execute fixed-family real bounded T/N matrix
        env:
          SOURCE_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          .research123-locked/bin/python tools/run_research123_real_tn_scaling.py \
            --source-sha "$SOURCE_SHA" \
            --output-dir evidence/research123 \
            --output evidence/research123/research123-real-tn-scaling.json \
            --torch-threads 2
          .research123-locked/bin/python tools/run_research123_real_tn_scaling.py \
            --validate evidence/research123/research123-real-tn-scaling.json
      - name: Print decision ledger
        run: |
          .research123-locked/bin/python - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path("evidence/research123/research123-real-tn-scaling.json").read_text())
          print(json.dumps({
              "source": report["source"],
              "data_truth_boundary": {
                  "real_external_source_bytes": report["data"]["real_external_source_bytes"],
                  "representative_broad_pretraining_corpus": report["data"]["representative_broad_pretraining_corpus"],
                  "dataset_identity_sha256": report["data"]["dataset_identity_sha256"],
                  "intake_manifest_sha256": report["data"]["intake_manifest_sha256"],
              },
              "models": [
                  {
                      "label": candidate["label"],
                      "parameters": candidate["parameter_count"],
                      "baseline_train_bpb": candidate["baseline"]["training_eval"]["bpb"],
                      "baseline_val_bpb": candidate["baseline"]["validation_eval"]["bpb"],
                      "points": [
                          {
                              "T_over_N": point["realized_t_per_n"],
                              "optimized_tokens": point["optimized_tokens"],
                              "train_bpb": point["training_eval"]["bpb"],
                              "val_bpb": point["validation_eval"]["bpb"],
                              "gap_bpb": point["generalization_gap_bpb"],
                              "recycle_factor": point["memorization"]["corpus_recycle_factor"],
                          }
                          for point in candidate["points"]
                      ],
                      "overfit_reversals": candidate["overfit_reversals"],
                  }
                  for candidate in report["candidates"]
              ],
              "resume": report["fresh_process_resume"],
              "selected": report["selected_learned_base_checkpoint"],
              "recommendation": report["recommendation"],
              "milestone100": report["milestone100_status"],
              "machine": report["machine_manifest"],
              "report_sha256": report["report_sha256"],
          }, indent=2, sort_keys=True))
          PY
      - name: Upload exact RESEARCH-123 evidence and checkpoints
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: research123-real-tn-scaling
          path: |
            locked-environment-linux-x86_64.json
            evidence/research123/
          if-no-files-found: error
          retention-days: 30
