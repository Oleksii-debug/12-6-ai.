name: RUNTIME-225 VERIFY-218 Consumer Convergence
run-name: RUNTIME-225 exact terminal LEARN-217 source binding

on:
  push:
    branches:
      - runtime225/verify218-consumer-convergence-20260826
  pull_request:
    branches:
      - runtime225/transformers-learned-10m-v2-20260826
  workflow_dispatch:

concurrency:
  group: runtime225-consumer-convergence-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PYTHONPATH: src
      EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Checkout exact consumer head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.EXPECTED_HEAD }}
          fetch-depth: 1
          persist-credentials: false

      - name: Set exact CPython 3.11.16
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11.16"

      - name: Universal exact execution bootstrap
        uses: ./.github/actions/execution-bootstrap
        with:
          capabilities: runtime,tests,lint
          venv: .runtime225-gate
          manifest: runtime225-consumer-environment.json
          command: >-
            python -m pytest -q
            tests/test_runtime225_verify218_authority.py
            tests/test_runtime225_verify218_authority_v2.py

      - name: Execute V1 plus V2 fail-closed consumer contracts
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          .runtime225-gate/bin/python -m ruff check \
            src/twelve_six/inference/verify218_authority.py \
            src/twelve_six/inference/verify218_authority_v2.py \
            tools/runtime225_verify218_gate.py \
            tests/test_runtime225_verify218_authority.py \
            tests/test_runtime225_verify218_authority_v2.py
          .runtime225-gate/bin/python -m pytest -q \
            tests/test_runtime225_verify218_authority.py \
            tests/test_runtime225_verify218_authority_v2.py

      - name: Emit prepared exact-source consumer proof
        run: |
          set -euo pipefail
          .runtime225-gate/bin/python - <<'PY'
          import json
          import os
          from pathlib import Path
          from twelve_six.inference.verify218_authority_v2 import (
              EXPECTED_SOURCE_ARTIFACT_DIGEST,
              EXPECTED_SOURCE_ARTIFACT_ID,
              EXPECTED_SOURCE_ARTIFACT_NAME,
              EXPECTED_SOURCE_SHA,
              EXPECTED_SOURCE_WORKFLOW_RUN_ID,
          )

          proof = {
              'schema': '12-6.runtime225-verify218-consumer-convergence.v1',
              'status': 'PREPARED_EXACT_SOURCE_CONSUMER_PASS',
              'consumer_head_sha': os.environ['EXPECTED_HEAD'],
              'source': {
                  'artifact_id': EXPECTED_SOURCE_ARTIFACT_ID,
                  'artifact_name': EXPECTED_SOURCE_ARTIFACT_NAME,
                  'artifact_digest': EXPECTED_SOURCE_ARTIFACT_DIGEST,
                  'workflow_run_id': EXPECTED_SOURCE_WORKFLOW_RUN_ID,
                  'source_sha': EXPECTED_SOURCE_SHA,
              },
              'source_substitution_allowed': False,
              'learned_parity_executed': False,
              'training_executed': False,
              'paid_compute': False,
          }
          Path('runtime225-consumer-convergence.json').write_text(
              json.dumps(proof, sort_keys=True, indent=2) + '\n', encoding='utf-8'
          )
          print(json.dumps(proof, sort_keys=True))
          PY

      - name: Upload prepared exact-source consumer proof
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: runtime225-verify218-consumer-convergence
          path: |
            runtime225-consumer-environment.json
            runtime225-consumer-convergence.json
          if-no-files-found: error
          retention-days: 30
