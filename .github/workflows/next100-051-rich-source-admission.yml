name: NEXT100-051 Rich Source Admission

on:
  pull_request:
    paths:
      - ".github/workflows/next100-051-rich-source-admission.yml"
      - "configs/data/next100_051_rich_code_rights_v1.json"
      - "evidence/next100-051/**"
  workflow_dispatch:

permissions:
  contents: read

env:
  TWELVE_SIX_EXECUTION_PROFILE: LOCAL_FREE

jobs:
  qualify-rich:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11.16"

      - name: Bind exact worker head
        env:
          EXPECTED_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SOURCE_SHA"

      - name: Qualify exact Rich objects
        env:
          EXPECTED_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          mkdir -p evidence/next100-051
          python - <<'PY' | tee evidence/next100-051/rich-source-admission-v1.json
          from __future__ import annotations

          import ast
          import hashlib
          import json
          import os
          import re
          import urllib.request
          from pathlib import Path

          WORKER = "NEXT100-051-CODE-RICH"
          SCHEMA = "12-6.next100-051-rich-source-admission.v1"
          POLICY = Path("configs/data/next100_051_rich_code_rights_v1.json")
          DATA227_HEAD = "8ebdb2e132ed7bae5245e9d4c140752640ab9885"
          DATA287_HEAD = "b0523ccbc4b957615aac849d476cfa851be87578"
          DATA287_REGISTRY_ID = "917e9bc31b2fa040d25e807ae3c01aa2cce32420752a891caacfb6c830e6632c"
          EVAL289_HEAD = "1c870e5e02bf48891ca599b0b3f3bfe6e84425bc"
          UPSTREAM_COMMIT = "6ac483cbea39cab124dfd3483bba70ffafb71050"
          UPSTREAM_TREE = "3b564e8788a0dec98e2a9f6558ee978ce00689a0"
          LICENSE_BLOB = "4415505566f261c802b671426be529a31f914137"
          LICENSE_SHA256 = "deed7c17a4318158190a3ea239cc879a5a50271cebb98ae7025f48fbe58dca15"
          NEAR_THRESHOLD = 0.85
          SHINGLE_SIZE = 5

          SECRET_PATTERNS = (
              re.compile(rb"-----BEGIN (?:RSA |EC |OPENSSH )?PRIVATE KEY-----"),
              re.compile(rb"\bgh[pousr]_[A-Za-z0-9_]{20,}\b"),
              re.compile(rb"\bsk-[A-Za-z0-9_-]{20,}\b"),
              re.compile(rb"\bAKIA[0-9A-Z]{16}\b"),
              re.compile(rb"\bAIza[0-9A-Za-z_-]{30,}\b"),
          )
          PRIVACY_CREDENTIAL_PATTERNS = (
              re.compile(rb"(?i)https?://[^/\s:@]+:[^/\s@]+@"),
              re.compile(rb"(?i)\b(?:password|passwd|api[_-]?key|secret|access[_-]?token)\s*=\s*['\"][A-Za-z0-9_+./=-]{20,}['\"]"),
              re.compile(rb"(?i)\b[A-Z0-9._%+-]+@[A-Z0-9.-]+\.[A-Z]{2,}\b"),
              re.compile(rb"\b\d{3}-\d{2}-\d{4}\b"),
          )
          GENERATED_PATTERNS = (
              re.compile(r"(?i)\bcode generated\b.{0,120}\bdo not edit\b"),
              re.compile(r"(?i)<auto-generated(?:\s|>)"),
              re.compile(r"(?i)\bautomatically generated\b"),
              re.compile(r"(?i)\bthis file (?:is|was) generated\b"),
              re.compile(r"(?i)(?:^|\s)@generated(?:\s|$)"),
          )
          FORBIDDEN_SELECTED_NAMES = {"_emoji_codes.py", "_spinners.py", "_palettes.py"}

          def download(url: str, max_bytes: int = 350_000) -> bytes:
              req = urllib.request.Request(url, headers={"User-Agent": "12-6-NEXT100-051-Rich/1"})
              with urllib.request.urlopen(req, timeout=30) as response:
                  data = response.read(max_bytes + 1)
              if len(data) > max_bytes:
                  raise RuntimeError(f"bounded download exceeded {max_bytes}: {url}")
              return data

          def load_json(url: str) -> dict:
              return json.loads(download(url, 200_000))

          def git_blob_sha1(data: bytes) -> str:
              return hashlib.sha1(f"blob {len(data)}\0".encode("ascii") + data).hexdigest()

          def sha256(data: bytes) -> str:
              return hashlib.sha256(data).hexdigest()

          def token_shingles(text: str) -> set[tuple[str, ...]]:
              tokens = re.findall(r"[A-Za-z_][A-Za-z0-9_]*|\d+|[^\s]", text.casefold())
              if len(tokens) < SHINGLE_SIZE:
                  return set()
              return {tuple(tokens[i:i + SHINGLE_SIZE]) for i in range(len(tokens) - SHINGLE_SIZE + 1)}

          def near_jaccard(left: str, right: str) -> float:
              a, b = token_shingles(left), token_shingles(right)
              if not a or not b:
                  return 0.0
              return len(a & b) / len(a | b)

          policy = json.loads(POLICY.read_text(encoding="utf-8"))
          assert policy["schema_version"] == "12-6.next100-051-rich-code-rights.v1"
          assert policy["worker_id"] == WORKER
          assert policy["policy_ref"] == "policy://12-6/data/explicit-model-training-evidence-v1"
          assert policy["source_family"] == "github:Textualize/rich"
          assert policy["canonical_repository_id"] == 220809393
          assert policy["upstream_tag"] == "v15.0.0"
          assert policy["upstream_commit"] == UPSTREAM_COMMIT
          assert policy["upstream_tree"] == UPSTREAM_TREE
          assert policy["license"]["blob_sha1"] == LICENSE_BLOB
          assert policy["license"]["sha256"] == LICENSE_SHA256
          assert len(policy["decisions"]) == 6
          assert sum(x["size_bytes"] for x in policy["decisions"]) == 46162
          assert all(x["capacity_counted"] is True for x in policy["decisions"])
          assert all(x["authorship_class"] == "UPSTREAM_AUTHORED_IMPLEMENTATION" for x in policy["decisions"])
          assert policy["uses"]["evaluation"] == "NOT_SEPARATELY_ADMITTED"

          repo_meta = load_json("https://api.github.com/repos/Textualize/rich")
          assert repo_meta["id"] == 220809393
          assert repo_meta["html_url"] == "https://github.com/Textualize/rich"
          assert repo_meta["fork"] is False
          assert repo_meta["mirror_url"] is None

          tag_ref = load_json("https://api.github.com/repos/Textualize/rich/git/ref/tags/v15.0.0")
          assert tag_ref["object"]["type"] == "commit"
          assert tag_ref["object"]["sha"] == UPSTREAM_COMMIT
          upstream_commit = load_json(f"https://api.github.com/repos/Textualize/rich/git/commits/{UPSTREAM_COMMIT}")
          assert upstream_commit["tree"]["sha"] == UPSTREAM_TREE

          license_bytes = download(policy["license"]["url"])
          assert len(license_bytes) == policy["license"]["size_bytes"]
          assert git_blob_sha1(license_bytes) == LICENSE_BLOB
          assert sha256(license_bytes) == LICENSE_SHA256
          license_text = license_bytes.decode("utf-8", errors="strict")
          for phrase in (
              "deal in the Software without restriction",
              "use, copy, modify, merge, publish, distribute, sublicense, and/or sell",
              "copyright notice and this permission notice shall be included",
              'THE SOFTWARE IS PROVIDED "AS IS"',
          ):
              assert phrase in license_text

          objects = []
          texts: dict[str, str] = {}
          raw_hash_set: set[str] = set()
          for decision in policy["decisions"]:
              path = decision["path"]
              assert path.startswith("rich/") and path.endswith(".py")
              assert "/tests/" not in f"/{path}" and "/examples/" not in f"/{path}"
              assert Path(path).name not in FORBIDDEN_SELECTED_NAMES
              assert "_unicode_data/" not in path
              raw = download(decision["raw_url"])
              assert len(raw) == decision["size_bytes"], decision["source_id"]
              assert git_blob_sha1(raw) == decision["blob_sha1"], decision["source_id"]
              assert b"\x00" not in raw
              text = raw.decode("utf-8", errors="strict")
              assert "\ufffd" not in text
              assert not any(0xD800 <= ord(ch) <= 0xDFFF for ch in text)
              assert not any(p.search(text[:8192]) for p in GENERATED_PATTERNS), decision["source_id"]
              assert not any(p.search(raw) for p in SECRET_PATTERNS), decision["source_id"]
              assert not any(p.search(raw) for p in PRIVACY_CREDENTIAL_PATTERNS), decision["source_id"]
              tree = ast.parse(text, filename=path)
              compile(tree, path, "exec")
              definitions = sum(isinstance(n, (ast.FunctionDef, ast.AsyncFunctionDef, ast.ClassDef)) for n in ast.walk(tree))
              nonblank_lines = sum(bool(line.strip()) for line in text.splitlines())
              assert definitions >= 1, decision["source_id"]
              assert nonblank_lines >= 40, decision["source_id"]
              raw_sha = sha256(raw)
              assert raw_sha not in raw_hash_set
              raw_hash_set.add(raw_sha)
              objects.append({
                  "source_id": decision["source_id"],
                  "source_family": decision["source_family"],
                  "commit": decision["commit"],
                  "path": path,
                  "git_blob_sha1": decision["blob_sha1"],
                  "size_bytes": len(raw),
                  "raw_sha256": raw_sha,
                  "normalized_sha256": raw_sha,
                  "normalization_policy": "STRICT_UTF8_IDENTITY_PRESERVE_V1",
                  "parse_validity": "PASS_AST_PARSE_AND_COMPILE_PY311",
                  "quality": {"nonblank_lines": nonblank_lines, "definition_count": definitions, "substantive_implementation": True},
                  "secret_scan": "PASS_SUPPORTED_CREDENTIAL_PATTERNS",
                  "privacy_scan": "PASS_NO_EMAIL_SSN_OR_CREDENTIAL_BEARING_LITERAL_PATTERN",
                  "generated_material": False,
                  "authorship_class": decision["authorship_class"],
                  "capacity_counted": True,
                  "training_purpose_decision": "ALLOWED",
                  "redistribution_decision": "ALLOWED_WITH_MIT_NOTICE",
                  "evaluation_use": "NOT_ADMITTED",
              })
              texts[decision["source_id"]] = text

          prior_policy = json.loads(Path("configs/data/data227_code_rights_policy_v1.json").read_text(encoding="utf-8"))
          prior_families = sorted({x["source_family"] for x in prior_policy["decisions"]})
          assert prior_families == ["github:encode/httpx", "github:psf/requests"]
          comparison_texts: dict[str, str] = dict(texts)
          prior_raw_hashes: set[str] = set()
          for prior in prior_policy["decisions"]:
              raw = download(prior["raw_url"])
              assert len(raw) == prior["size_bytes"]
              assert git_blob_sha1(raw) == prior["blob_sha1"]
              prior_raw_hashes.add(sha256(raw))
              comparison_texts[prior["source_id"]] = raw.decode("utf-8", errors="strict")
          assert not (raw_hash_set & prior_raw_hashes)

          registry = load_json(
              "https://raw.githubusercontent.com/Oleksii-debug/12-6-ai./"
              + DATA287_HEAD
              + "/data/registry/external_snapshots.v2.json"
          )
          assert registry["registry_identity_sha256"] == DATA287_REGISTRY_ID
          registry_code = [x for x in registry["sources"] if x["modality"] == "code"]
          assert sorted(x["independent_source_family"]["family_id"] for x in registry_code) == prior_families
          registry_raw_hashes = {x["snapshot"]["raw_sha256"] for x in registry_code}
          assert not (raw_hash_set & registry_raw_hashes)
          assert policy["source_family"] not in {x["independent_source_family"]["family_id"] for x in registry["sources"]}

          ids = sorted(comparison_texts)
          near_pairs = []
          max_pair = None
          max_score = -1.0
          for i, left in enumerate(ids):
              for right in ids[i + 1:]:
                  score = near_jaccard(comparison_texts[left], comparison_texts[right])
                  if score > max_score:
                      max_score = score
                      max_pair = [left, right]
                  if score >= NEAR_THRESHOLD:
                      near_pairs.append({"left": left, "right": right, "jaccard": score})
          assert not near_pairs, near_pairs

          eval289 = load_json(
              "https://raw.githubusercontent.com/Oleksii-debug/12-6-ai./"
              + EVAL289_HEAD
              + "/evidence/eval289/code-evaluation-rights-reservation.json"
          )
          assert eval289["reservation"]["active"] is False
          assert eval289["reservation"]["objects"] == []

          core = {
              "schema_version": SCHEMA,
              "worker_id": WORKER,
              "status": "ADMIT",
              "authority": "EXTERNAL_REAL_CODE_SOURCE_TERMINAL_LOCAL_FREE",
              "worker_source_sha": os.environ["EXPECTED_SOURCE_SHA"],
              "predecessor_code_authority": {"data227_head_sha": DATA227_HEAD, "policy_git_blob_sha1": "0ce5223a1cade10031899bf27348a1a65121d4c6", "source_family_count": 2, "source_families": prior_families},
              "registry_binding": {"data287_head_sha": DATA287_HEAD, "registry_identity_sha256": DATA287_REGISTRY_ID, "terminal_code_family_count": len(registry_code), "selected_exact_hash_overlap": False, "selected_family_collision": False},
              "upstream": {"repository": "https://github.com/Textualize/rich", "repository_id": 220809393, "tag": "v15.0.0", "tag_object_type": "commit", "commit": UPSTREAM_COMMIT, "tree": UPSTREAM_TREE, "repository_fork": False, "repository_mirror": False},
              "license": {"license_id": "MIT", "path": "LICENSE", "git_blob_sha1": LICENSE_BLOB, "sha256": LICENSE_SHA256, "model_training": "ALLOWED_BY_REVIEWED_MIT_GRANT", "derivatives": "ALLOWED", "redistribution": "ALLOWED_WITH_NOTICE", "notice_required": True},
              "objects": objects,
              "checks": {"strict_utf8_identity_normalization": "PASS", "parse_validity": "PASS_6_OF_6_AST_AND_COMPILE", "quality": "PASS_6_OF_6_SUBSTANTIVE_IMPLEMENTATION", "secret_privacy": "PASS_6_OF_6", "generated_selected_count": 0, "generated_selected_bytes": 0, "examples_selected_count": 0, "evaluation_fixtures_selected_count": 0, "exact_duplicate_sha256": [], "predecessor_exact_overlap": False, "registry_exact_overlap": False, "near_duplicate_threshold": NEAR_THRESHOLD, "near_duplicate_pairs": near_pairs, "max_observed_pair": max_pair, "max_observed_jaccard": max_score, "current_eval_reservation_active_at_eval289_head": False},
              "source_family_accounting": {"new_source_family": policy["source_family"], "canonical_repository_id": 220809393, "independent_new_family_count": 1, "predecessor_code_family_count": 2, "resulting_code_family_count_if_registered": 3, "selected_implementation_object_count": 6, "selected_authored_capacity_bytes": 46162, "generated_capacity_bytes": 0, "generated_capacity_objects": 0},
              "excluded_capacity": policy["excluded_capacity"],
              "evaluation_boundary": {"eval289_head_sha": EVAL289_HEAD, "active_reserved_objects": 0, "selected_objects_overlap_active_reservation": False, "evaluation_use": "NOT_ADMITTED"},
              "execution": {"class": "LOCAL_FREE", "paid_compute_used": False, "model_training_executed": False, "optimizer_updates": 0, "network_use": "bounded immutable-source qualification only"},
              "terminal_decision": "ADMIT exact six-object Rich v15.0.0 implementation snapshot for training-source registration; examples, tests, docs, known generated tables, vendored/binary/build material and evaluation-purpose objects remain excluded and contribute zero capacity.",
          }
          canonical = (json.dumps(core, ensure_ascii=False, sort_keys=True, separators=(",", ":")) + "\n").encode("utf-8")
          evidence = {**core, "authority_identity_sha256": sha256(canonical)}
          print(json.dumps(evidence, ensure_ascii=False, sort_keys=True, separators=(",", ":")))
          PY

      - name: Validate terminal evidence
        run: |
          python - <<'PY'
          import hashlib
          import json

          p = "evidence/next100-051/rich-source-admission-v1.json"
          evidence = json.load(open(p, encoding="utf-8"))
          digest = evidence.pop("authority_identity_sha256")
          canonical = (json.dumps(evidence, ensure_ascii=False, sort_keys=True, separators=(",", ":")) + "\n").encode("utf-8")
          assert hashlib.sha256(canonical).hexdigest() == digest
          assert evidence["status"] == "ADMIT"
          assert evidence["execution"]["class"] == "LOCAL_FREE"
          assert evidence["execution"]["paid_compute_used"] is False
          assert evidence["execution"]["model_training_executed"] is False
          assert evidence["execution"]["optimizer_updates"] == 0
          assert evidence["source_family_accounting"]["selected_implementation_object_count"] == 6
          assert evidence["source_family_accounting"]["selected_authored_capacity_bytes"] == 46162
          assert evidence["source_family_accounting"]["generated_capacity_bytes"] == 0
          assert evidence["source_family_accounting"]["resulting_code_family_count_if_registered"] == 3
          assert evidence["checks"]["parse_validity"] == "PASS_6_OF_6_AST_AND_COMPILE"
          assert evidence["checks"]["quality"] == "PASS_6_OF_6_SUBSTANTIVE_IMPLEMENTATION"
          assert evidence["checks"]["secret_privacy"] == "PASS_6_OF_6"
          assert evidence["checks"]["exact_duplicate_sha256"] == []
          assert evidence["checks"]["near_duplicate_pairs"] == []
          assert evidence["checks"]["examples_selected_count"] == 0
          assert evidence["evaluation_boundary"]["selected_objects_overlap_active_reservation"] is False
          PY

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: next100-051-rich-source-admission-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            configs/data/next100_051_rich_code_rights_v1.json
            evidence/next100-051/rich-source-admission-v1.json
          if-no-files-found: error
          retention-days: 90
