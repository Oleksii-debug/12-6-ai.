name: Plan 5 task-state scoped qualification

on:
  pull_request:
    paths:
      - 'src/twelve_six_agent_runtime/**'
      - 'tests/test_agent_task_state_section2*.py'
      - '.github/workflows/plan5_task_state.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  task-state:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v4
      - name: Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install local-free qualification tools
        run: python -m pip install 'pytest>=8,<10' 'ruff>=0.12,<1'
      - name: Plan 5 state and adversarial / restart tests
        run: PYTHONPATH=src python -m pytest -q tests/test_agent_task_state_section2.py tests/test_agent_task_state_section2_adversarial.py
      - name: Focused static qualification
        run: ruff check src/twelve_six_agent_runtime/task_state.py tests/test_agent_task_state_section2.py tests/test_agent_task_state_section2_adversarial.py
