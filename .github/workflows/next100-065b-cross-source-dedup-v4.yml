name: NEXT100-065B Cross-Source Dedup V4

on:
  pull_request:
    paths:
      - ".github/workflows/next100-065b-cross-source-dedup-v4.yml"
      - "configs/data/next100_065b_cross_source_dedup_v4.json"
      - "src/twelve_six/data/cross_source_capacity_audit_v4.py"
      - "tests/test_next100_065b_cross_source_dedup_v4.py"
      - "tools/run_next100_065b_cross_source_dedup_v4.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  converged-dedup:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      TWELVE_SIX_EXECUTION_PROFILE: LOCAL_FREE
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Prove exact source checkout
        env:
          EXPECTED_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SOURCE_SHA"

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11.16"

      - name: Install deterministic PDF extractor
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends poppler-utils
          pdftotext -v

      - name: Universal exact LOCAL_FREE bootstrap
        uses: ./.github/actions/execution-bootstrap
        with:
          capabilities: runtime,tests,lint
          venv: .next100-065b
          command: python -m pytest -q tests/test_data298_cross_source_capacity_audit.py tests/test_next100_065_cross_source_dedup_v3.py tests/test_next100_065b_cross_source_dedup_v4.py
          manifest: next100-065b-execution-environment.json

      - name: Compile focused implementation
        run: >-
          PYTHONPATH=src .next100-065b/bin/python -m compileall -q
          src/twelve_six/data/cross_source_capacity_audit.py
          src/twelve_six/data/cross_source_capacity_audit_v3.py
          src/twelve_six/data/cross_source_capacity_audit_v4.py
          tools/run_next100_065b_cross_source_dedup_v4.py

      - name: Inherited V3 plus V4 adversarial tests
        run: >-
          PYTHONPATH=src .next100-065b/bin/python -m pytest -q
          tests/test_data298_cross_source_capacity_audit.py
          tests/test_next100_065_cross_source_dedup_v3.py
          tests/test_next100_065b_cross_source_dedup_v4.py

      - name: Focused lint
        run: >-
          .next100-065b/bin/ruff check --select E4,E9,F
          src/twelve_six/data/cross_source_capacity_audit_v4.py
          tools/run_next100_065b_cross_source_dedup_v4.py
          tests/test_next100_065b_cross_source_dedup_v4.py

      - name: Materialize full converged source audit twice
        env:
          PYTHONPATH: src
        run: |
          mkdir -p evidence/next100_065b/a evidence/next100_065b/b
          .next100-065b/bin/python tools/run_next100_065b_cross_source_dedup_v4.py run \
            --base-inventory configs/data/next100_065_cross_source_dedup_v3.json \
            --extension configs/data/next100_065b_cross_source_dedup_v4.json \
            --report evidence/next100_065b/a/report.json
          .next100-065b/bin/python tools/run_next100_065b_cross_source_dedup_v4.py run \
            --base-inventory configs/data/next100_065_cross_source_dedup_v3.json \
            --extension configs/data/next100_065b_cross_source_dedup_v4.json \
            --report evidence/next100_065b/b/report.json
          cmp evidence/next100_065b/a/report.json evidence/next100_065b/b/report.json

      - name: Verify source capacity and no-training boundary
        env:
          PYTHONPATH: src
        run: |
          .next100-065b/bin/python tools/run_next100_065b_cross_source_dedup_v4.py verify \
            --report evidence/next100_065b/a/report.json
          .next100-065b/bin/python - <<'PY'
          import json
          from pathlib import Path

          report = json.loads(Path("evidence/next100_065b/a/report.json").read_text())
          dedup = report["dedup_v3"]
          scope = dedup["terminal_candidates"]
          assert dedup["source_count"] == 21
          assert report["model_training_executed"] is False
          assert report["tokenizer_fit_executed"] is False
          assert report["paid_compute_used"] is False
          assert report["final_test_payload_read"] is False
          assert scope["declared_capacity_bytes_before"] == 314140
          assert 0 <= scope["conservative_unique_capacity_bytes_after"] <= 314140
          assert scope["stable_origin_count"] == 10
          assert 1 <= scope["effective_independent_origin_count"] <= 10
          assert scope["by_modality"]["uk"]["declared_capacity_bytes_before"] == 100856
          assert scope["by_modality"]["en"]["declared_capacity_bytes_before"] == 144151
          assert scope["by_modality"]["code"]["declared_capacity_bytes_before"] == 69133
          assert report["claim_boundary"]["training_authorized"] is False
          PY

      - name: Prove text-free public evidence
        run: |
          ! grep -q '"text"' evidence/next100_065b/a/report.json
          ! grep -q '"acquisition_url"' evidence/next100_065b/a/report.json

      - name: Upload immutable NEXT100-065B evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: next100-065b-cross-source-dedup-${{ github.event.pull_request.head.sha || github.sha }}
          if-no-files-found: error
          retention-days: 90
          path: |
            configs/data/next100_065b_cross_source_dedup_v4.json
            next100-065b-execution-environment.json
            evidence/next100_065b/a/report.json
