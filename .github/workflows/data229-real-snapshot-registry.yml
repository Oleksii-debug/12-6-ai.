name: DATA-229 Real Snapshot Registry

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-real-snapshot-registry:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11.16"

      - name: Bind exact source head
        env:
          EXPECTED_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SOURCE_SHA"

      - name: Bootstrap universal exact LOCAL_FREE environment
        uses: ./.github/actions/execution-bootstrap
        with:
          capabilities: runtime,tests
          venv: .data229
          command: python -m pytest
          manifest: data229-execution-environment.json

      - name: Verify canonical registry is a deterministic rebuild
        env:
          PYTHONPATH: src
        run: .data229/bin/python tools/build_real_snapshot_registry.py --verify

      - name: Run focused registry contracts
        env:
          PYTHONPATH: src
        run: .data229/bin/python -m pytest -q tests/test_real_snapshot_registry.py
