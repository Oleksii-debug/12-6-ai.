name: MILESTONE-221 Learned Base Ladder V3

on:
  pull_request:
    branches: [milestone210/learned-base-ladder-v2-20260826]
  workflow_dispatch:

concurrency:
  group: milestone221-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

jobs:
  validate-terminal-ladder-v3:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.11.16"
      - uses: ./.github/actions/execution-bootstrap
        with:
          capabilities: runtime,tests
          venv: .milestone221
          command: python -m pytest -q tests/test_milestone221_ladder_v3.py
          manifest: milestone221-environment.json

      - name: Download exact terminal evidence artifacts
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          api=https://api.github.com/repos/Oleksii-debug/12-6-ai./actions/artifacts
          curl --fail --location --silent --show-error \
            -H "Authorization: Bearer ${GITHUB_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "${api}/9595677772/zip" -o m150.zip
          echo "c00b7e9006320f8916c739a3311e8cc47ad0d0b16957f8ebd7d19233fd9f1c71  m150.zip" | sha256sum -c -
          curl --fail --location --silent --show-error \
            -H "Authorization: Bearer ${GITHUB_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "${api}/9597643947/zip" -o recover178.zip
          echo "bba24085b45f1c73f7f4735b7cbef9994d4c1a6f1d585921641a2a271375b665  recover178.zip" | sha256sum -c -
          curl --fail --location --silent --show-error \
            -H "Authorization: Bearer ${GITHUB_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "${api}/9597788382/zip" -o learn191.zip
          echo "f57bf36113a68fffd4bfcf877bf08762393479b9c09e6fd0fd613fbb91f044ee  learn191.zip" | sha256sum -c -
          mkdir m150 recover178 learn191
          unzip -q m150.zip -d m150
          unzip -q recover178.zip -d recover178
          unzip -q learn191.zip -d learn191
          test -f m150/ladder-report.json
          test -f recover178/recover178-evidence/memorization-report.json
          test -f learn191/learn191-evidence/learn191-real-3m-report.json

      - name: Cross-validate V3 against terminal producers
        run: |
          set -euo pipefail
          .milestone221/bin/python tools/validate_milestone221.py \
            --m150-report m150/ladder-report.json \
            --recover178-report recover178/recover178-evidence/memorization-report.json \
            --learn191-report learn191/learn191-evidence/learn191-real-3m-report.json
          .milestone221/bin/python -m pytest -q tests/test_milestone221_ladder_v3.py

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: milestone221-terminal-ladder-v3
          path: |
            evidence/milestone221/learned-base-ladder-v3.json
            docs/MILESTONE221_LEARNED_BASE_LADDER_V3.md
            milestone221-environment.json
            m150/ladder-report.json
            recover178/recover178-evidence/memorization-report.json
            learn191/learn191-evidence/learn191-real-3m-report.json
          if-no-files-found: error
          retention-days: 30
