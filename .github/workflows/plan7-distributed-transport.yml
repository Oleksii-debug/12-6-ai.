name: Plan 7 Section 11 LOCAL_FREE artifact transport
on:
  pull_request:
    paths:
      - 'src/twelve_six/distributed_transport.py'
      - 'tests/test_plan7_distributed_transport.py'
      - '.github/workflows/plan7-distributed-transport.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  plan7-s11:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e '.[dev]'
      - run: python -m ruff check src/twelve_six/distributed_transport.py tests/test_plan7_distributed_transport.py
      - run: python -m pytest -q tests/test_plan7_distributed_transport.py tests/test_plan7_distributed_control.py
