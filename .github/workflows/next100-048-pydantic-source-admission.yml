name: NEXT100-048 Pydantic Source Admission

on:
  pull_request:
    paths:
      - ".github/workflows/next100-048-pydantic-source-admission.yml"
      - "configs/data/next100_048_pydantic_code_rights_v1.json"
      - "tools/qualify_next100_048_pydantic.py"
  workflow_dispatch:

permissions:
  contents: read

env:
  TWELVE_SIX_EXECUTION_PROFILE: LOCAL_FREE

jobs:
  qualify-pydantic:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact worker head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set exact CPython
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11.16"

      - name: Bind exact worker head
        env:
          EXPECTED_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SOURCE_SHA"

      - name: Compile reusable verifier
        run: python -m compileall -q tools/qualify_next100_048_pydantic.py

      - name: Qualify exact Pydantic objects with authenticated GitHub API
        env:
          EXPECTED_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p evidence/next100-048/runtime
          python tools/qualify_next100_048_pydantic.py \
            --source-sha "$EXPECTED_SOURCE_SHA" \
            --output evidence/next100-048/runtime/pydantic-source-admission-v1.json

      - name: Enforce terminal source authority boundary
        run: |
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          path = Path("evidence/next100-048/runtime/pydantic-source-admission-v1.json")
          value = json.loads(path.read_text(encoding="utf-8"))
          supplied = value.pop("authority_identity_sha256")
          canonical = (json.dumps(value, ensure_ascii=False, sort_keys=True, separators=(",", ":")) + "\n").encode("utf-8")
          assert hashlib.sha256(canonical).hexdigest() == supplied
          assert value["worker_id"] == "NEXT100-048-CODE-PYDANTIC"
          assert value["status"] == "ADMIT"
          assert value["worker_source_sha"] == "${{ github.event.pull_request.head.sha || github.sha }}"
          assert value["source_family_accounting"]["selected_implementation_object_count"] == 4
          assert value["source_family_accounting"]["selected_authored_capacity_bytes"] == 235204
          assert value["execution"]["class"] == "LOCAL_FREE"
          assert value["execution"]["github_api_authenticated"] is True
          assert value["execution"]["paid_compute_used"] is False
          assert value["execution"]["model_training_executed"] is False
          PY

      - name: Upload exact-head source authority evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: next100-048-pydantic-source-admission-${{ github.event.pull_request.head.sha || github.sha }}
          if-no-files-found: error
          retention-days: 90
          path: evidence/next100-048/runtime/pydantic-source-admission-v1.json
