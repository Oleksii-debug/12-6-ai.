name: NEXT100-048 Pydantic Source Admission

on:
  pull_request:
    paths:
      - ".github/workflows/next100-048-pydantic-source-admission.yml"
      - "configs/data/next100_048_pydantic_code_rights_v1.json"
      - "evidence/next100-048/**"
  workflow_dispatch:

permissions:
  contents: read

env:
  TWELVE_SIX_EXECUTION_PROFILE: LOCAL_FREE

jobs:
  qualify-pydantic:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11.16"

      - name: Bind exact worker head
        env:
          EXPECTED_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SOURCE_SHA"

      - name: Qualify exact Pydantic objects
        env:
          EXPECTED_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          mkdir -p evidence/next100-048
          python - <<'PY' | tee evidence/next100-048/pydantic-source-admission-v1.json
          from __future__ import annotations

          import ast
          import hashlib
          import json
          import re
          import urllib.request
          from pathlib import Path

          WORKER = "NEXT100-048-CODE-PYDANTIC"
          SCHEMA = "12-6.next100-048-pydantic-source-admission.v1"
          POLICY = Path("configs/data/next100_048_pydantic_code_rights_v1.json")
          DATA227_HEAD = "8ebdb2e132ed7bae5245e9d4c140752640ab9885"
          EVAL289_HEAD = "1c870e5e02bf48891ca599b0b3f3bfe6e84425bc"
          UPSTREAM_COMMIT = "cf67d4b3193c3fe43ede18612ed62785eee11382"
          TAG_OBJECT = "07b73712023f052c7c008c4a9c5121b4894e44ec"
          LICENSE_BLOB = "488c6260c10f2e88fa1fae58a63fccec8d600cd1"
          NEAR_THRESHOLD = 0.85
          SHINGLE_SIZE = 5

          SECRET_PATTERNS = (
              re.compile(rb"-----BEGIN (?:RSA |EC |OPENSSH )?PRIVATE KEY-----"),
              re.compile(rb"\bgh[pousr]_[A-Za-z0-9_]{20,}\b"),
              re.compile(rb"\bsk-[A-Za-z0-9_-]{20,}\b"),
              re.compile(rb"\bAKIA[0-9A-Z]{16}\b"),
          )
          PRIVACY_CREDENTIAL_PATTERNS = (
              re.compile(rb"(?i)https?://[^/\s:@]+:[^/\s@]+@"),
              re.compile(rb"(?i)\b(?:password|passwd|api[_-]?key|secret)\s*=\s*['\"][A-Za-z0-9_+./=-]{24,}['\"]"),
          )
          GENERATED_PATTERNS = (
              re.compile(r"(?i)\bcode generated\b.{0,120}\bdo not edit\b"),
              re.compile(r"(?i)<auto-generated(?:\s|>)"),
              re.compile(r"(?i)\bautomatically generated\b"),
              re.compile(r"(?i)\bthis file (?:is|was) generated\b"),
              re.compile(r"(?i)(?:^|\s)@generated(?:\s|$)"),
          )

          def download(url: str, max_bytes: int = 300_000) -> bytes:
              req = urllib.request.Request(url, headers={"User-Agent": "12-6-NEXT100-048-Pydantic/1"})
              with urllib.request.urlopen(req, timeout=30) as response:
                  data = response.read(max_bytes + 1)
              if len(data) > max_bytes:
                  raise RuntimeError(f"bounded download exceeded {max_bytes}: {url}")
              return data

          def load_json(url: str) -> dict:
              return json.loads(download(url, 150_000))

          def git_blob_sha1(data: bytes) -> str:
              return hashlib.sha1(f"blob {len(data)}\0".encode("ascii") + data).hexdigest()

          def sha256(data: bytes) -> str:
              return hashlib.sha256(data).hexdigest()

          def token_shingles(text: str) -> set[tuple[str, ...]]:
              tokens = re.findall(r"[A-Za-z_][A-Za-z0-9_]*|\d+|[^\s]", text.casefold())
              if len(tokens) < SHINGLE_SIZE:
                  return set()
              return {tuple(tokens[i:i + SHINGLE_SIZE]) for i in range(len(tokens) - SHINGLE_SIZE + 1)}

          def near_jaccard(left: str, right: str) -> float:
              a, b = token_shingles(left), token_shingles(right)
              if not a or not b:
                  return 0.0
              return len(a & b) / len(a | b)

          policy_bytes = POLICY.read_bytes()
          policy = json.loads(policy_bytes)
          assert policy["schema_version"] == "12-6.next100-048-pydantic-code-rights.v1"
          assert policy["policy_ref"] == "policy://12-6/data/explicit-model-training-evidence-v1"
          assert policy["source_family"] == "github:pydantic/pydantic"
          assert policy["upstream_commit"] == UPSTREAM_COMMIT
          assert policy["license"]["blob_sha1"] == LICENSE_BLOB
          assert len(policy["decisions"]) == 4
          assert sum(x["size_bytes"] for x in policy["decisions"]) == 235204
          assert all(x["capacity_counted"] is True for x in policy["decisions"])
          assert all(x["authorship_class"] == "UPSTREAM_AUTHORED_IMPLEMENTATION" for x in policy["decisions"])

          repo_meta = load_json("https://api.github.com/repos/pydantic/pydantic")
          assert repo_meta["html_url"] == "https://github.com/pydantic/pydantic"
          assert repo_meta["fork"] is False
          assert repo_meta["mirror_url"] is None

          tag_ref = load_json("https://api.github.com/repos/pydantic/pydantic/git/ref/tags/v2.13.4")
          assert tag_ref["object"]["sha"] == TAG_OBJECT
          assert tag_ref["object"]["type"] == "tag"
          tag = load_json(f"https://api.github.com/repos/pydantic/pydantic/git/tags/{TAG_OBJECT}")
          assert tag["object"]["sha"] == UPSTREAM_COMMIT
          assert tag["object"]["type"] == "commit"
          assert tag["verification"]["verified"] is False

          license_bytes = download(policy["license"]["url"])
          assert git_blob_sha1(license_bytes) == LICENSE_BLOB
          license_text = license_bytes.decode("utf-8", errors="strict")
          for phrase in (
              "The MIT License (MIT)",
              "deal in the Software without restriction",
              "use, copy, modify, merge, publish, distribute, sublicense, and/or sell",
              "copyright notice and this permission notice shall be included",
          ):
              assert phrase in license_text

          objects = []
          texts: dict[str, str] = {}
          for decision in policy["decisions"]:
              raw = download(decision["raw_url"])
              assert len(raw) == decision["size_bytes"], decision["source_id"]
              assert git_blob_sha1(raw) == decision["blob_sha1"], decision["source_id"]
              assert b"\x00" not in raw
              text = raw.decode("utf-8", errors="strict")
              assert "\ufffd" not in text
              assert not any(0xD800 <= ord(ch) <= 0xDFFF for ch in text)
              header = text[:8192]
              assert not any(p.search(header) for p in GENERATED_PATTERNS), decision["source_id"]
              assert not any(p.search(raw) for p in SECRET_PATTERNS), decision["source_id"]
              assert not any(p.search(raw) for p in PRIVACY_CREDENTIAL_PATTERNS), decision["source_id"]
              ast.parse(text, filename=decision["path"])
              raw_sha = sha256(raw)
              objects.append({
                  "source_id": decision["source_id"],
                  "source_family": decision["source_family"],
                  "commit": decision["commit"],
                  "path": decision["path"],
                  "git_blob_sha1": decision["blob_sha1"],
                  "size_bytes": len(raw),
                  "raw_sha256": raw_sha,
                  "normalized_sha256": raw_sha,
                  "normalization_policy": "STRICT_UTF8_IDENTITY_PRESERVE_V1",
                  "parse_validity": "PASS_AST_PARSE_PY311",
                  "secret_scan": "PASS_DATA227_SECRET_PATTERNS",
                  "privacy_credential_scan": "PASS_NO_CREDENTIAL_BEARING_LITERAL_PATTERN",
                  "generated_material": False,
                  "authorship_class": decision["authorship_class"],
                  "capacity_counted": True,
                  "training_purpose_decision": "ALLOWED",
                  "redistribution_decision": "ALLOWED_WITH_MIT_NOTICE",
              })
              texts[decision["source_id"]] = text

          raw_hashes = [x["raw_sha256"] for x in objects]
          exact_duplicates = sorted({h for h in raw_hashes if raw_hashes.count(h) > 1})
          assert not exact_duplicates

          prior_policy = json.loads(Path("configs/data/data227_code_rights_policy_v1.json").read_text(encoding="utf-8"))
          prior_families = sorted({x["source_family"] for x in prior_policy["decisions"]})
          assert prior_families == ["github:encode/httpx", "github:psf/requests"]
          comparison_texts: dict[str, str] = dict(texts)
          for prior in prior_policy["decisions"]:
              raw = download(prior["raw_url"])
              assert len(raw) == prior["size_bytes"]
              assert git_blob_sha1(raw) == prior["blob_sha1"]
              comparison_texts[prior["source_id"]] = raw.decode("utf-8", errors="strict")

          ids = sorted(comparison_texts)
          near_pairs = []
          max_pair = None
          max_score = -1.0
          for i, left in enumerate(ids):
              for right in ids[i + 1:]:
                  score = near_jaccard(comparison_texts[left], comparison_texts[right])
                  if score > max_score:
                      max_score = score
                      max_pair = [left, right]
                  if score >= NEAR_THRESHOLD:
                      near_pairs.append({"left": left, "right": right, "jaccard": score})
          assert not near_pairs, near_pairs

          eval289 = load_json(
              "https://raw.githubusercontent.com/Oleksii-debug/12-6-ai./"
              + EVAL289_HEAD
              + "/evidence/eval289/code-evaluation-rights-reservation.json"
          )
          assert eval289["reservation"]["active"] is False
          assert eval289["reservation"]["objects"] == []

          core = {
              "schema_version": SCHEMA,
              "worker_id": WORKER,
              "status": "ADMIT",
              "authority": "EXTERNAL_REAL_CODE_SOURCE_TERMINAL_LOCAL_FREE",
              "worker_source_sha": __import__("os").environ["EXPECTED_SOURCE_SHA"],
              "predecessor_code_authority": {
                  "data227_head_sha": DATA227_HEAD,
                  "policy_git_blob_sha1": "0ce5223a1cade10031899bf27348a1a65121d4c6",
                  "source_family_count": 2,
                  "source_families": prior_families,
              },
              "upstream": {
                  "repository": "https://github.com/pydantic/pydantic",
                  "tag": "v2.13.4",
                  "tag_object_sha1": TAG_OBJECT,
                  "commit": UPSTREAM_COMMIT,
                  "tag_signature_status": "UNSIGNED",
                  "repository_fork": False,
                  "repository_mirror": False,
              },
              "license": {
                  "license_id": "MIT",
                  "path": "LICENSE",
                  "git_blob_sha1": LICENSE_BLOB,
                  "sha256": sha256(license_bytes),
                  "model_training": "ALLOWED_BY_REVIEWED_MIT_GRANT",
                  "derivatives": "ALLOWED",
                  "redistribution": "ALLOWED_WITH_NOTICE",
                  "notice_required": True,
              },
              "objects": objects,
              "checks": {
                  "strict_utf8_identity_normalization": "PASS",
                  "parse_validity": "PASS_4_OF_4",
                  "secret_privacy": "PASS_4_OF_4",
                  "generated_selected_count": 0,
                  "generated_selected_bytes": 0,
                  "exact_duplicate_sha256": exact_duplicates,
                  "near_duplicate_threshold": NEAR_THRESHOLD,
                  "near_duplicate_pairs": near_pairs,
                  "max_observed_pair": max_pair,
                  "max_observed_jaccard": max_score,
                  "current_eval_reservation_active_at_eval289_head": False,
              },
              "source_family_accounting": {
                  "new_source_family": "github:pydantic/pydantic",
                  "independent_new_family_count": 1,
                  "predecessor_family_count": 2,
                  "resulting_family_count_if_registered": 3,
                  "selected_implementation_object_count": 4,
                  "selected_authored_capacity_bytes": 235204,
                  "generated_capacity_bytes": 0,
                  "generated_capacity_objects": 0,
              },
              "excluded_capacity": policy["excluded_capacity"],
              "evaluation_boundary": {
                  "eval289_head_sha": EVAL289_HEAD,
                  "active_reserved_objects": 0,
                  "selected_objects_overlap_active_reservation": False,
              },
              "execution": {
                  "class": "LOCAL_FREE",
                  "paid_compute_used": False,
                  "model_training_executed": False,
                  "network_use": "bounded immutable-source qualification only",
              },
              "terminal_decision": "ADMIT exact four-object Pydantic v2.13.4 implementation snapshot for training-source registration; do not count generated, legacy v1, docs/tests/examples, stubs, or pydantic-core as this family capacity.",
          }
          canonical = (json.dumps(core, ensure_ascii=False, sort_keys=True, separators=(",", ":")) + "\n").encode("utf-8")
          evidence = {**core, "authority_identity_sha256": sha256(canonical)}
          print(json.dumps(evidence, ensure_ascii=False, sort_keys=True, separators=(",", ":")))
          PY

      - name: Validate terminal evidence
        run: |
          python - <<'PY'
          import hashlib, json
          p = "evidence/next100-048/pydantic-source-admission-v1.json"
          evidence = json.load(open(p, encoding="utf-8"))
          digest = evidence.pop("authority_identity_sha256")
          canonical = (json.dumps(evidence, ensure_ascii=False, sort_keys=True, separators=(",", ":")) + "\n").encode("utf-8")
          assert hashlib.sha256(canonical).hexdigest() == digest
          assert evidence["status"] == "ADMIT"
          assert evidence["execution"]["class"] == "LOCAL_FREE"
          assert evidence["execution"]["paid_compute_used"] is False
          assert evidence["execution"]["model_training_executed"] is False
          assert evidence["source_family_accounting"]["selected_implementation_object_count"] == 4
          assert evidence["source_family_accounting"]["selected_authored_capacity_bytes"] == 235204
          assert evidence["source_family_accounting"]["generated_capacity_bytes"] == 0
          assert evidence["source_family_accounting"]["resulting_family_count_if_registered"] == 3
          assert evidence["checks"]["parse_validity"] == "PASS_4_OF_4"
          assert evidence["checks"]["secret_privacy"] == "PASS_4_OF_4"
          assert evidence["checks"]["exact_duplicate_sha256"] == []
          assert evidence["checks"]["near_duplicate_pairs"] == []
          PY

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: next100-048-pydantic-source-admission-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            configs/data/next100_048_pydantic_code_rights_v1.json
            evidence/next100-048/pydantic-source-admission-v1.json
          if-no-files-found: error
          retention-days: 90
