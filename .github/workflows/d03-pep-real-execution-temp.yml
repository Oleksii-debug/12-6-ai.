name: D03 PEP real execution temporary

on:
  push:
    branches:
      - swarm/1229-pep-real-exec-v1

permissions:
  contents: read

concurrency:
  group: d03-pep-real-execution-${{ github.ref }}
  cancel-in-progress: true

jobs:
  materialize-twice:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PRODUCT_HEAD: 930471ef19c1afff70dee6ed46c4813ded035c9e
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Bind exact qualified Product bytes
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git merge-base --is-ancestor "$PRODUCT_HEAD" HEAD
          test "$(git rev-parse HEAD:configs/data/d03_pep_public_domain_intake_v1.json)" = "0fe71942aa1f61c870a290f23a4d9b2bbb405d70"
          test "$(git rev-parse HEAD:src/twelve_six/data/pep_intake.py)" = "d51e997059ed6a93667107062f4952e748a4dfa6"
          test "$(git rev-parse HEAD:tests/test_d03_pep_intake.py)" = "f750ad0f59c0d77a48adb9433f3b1caeb665918e"
          test "$(git rev-parse HEAD:tools/materialize_d03_peps.py)" = "310f5431dcad851c522d565d079513072ec9a1dc"
      - run: python -m pip install --upgrade pip
      - run: pip install -e .[dev]
      - name: Focused qualified mechanics regression
        run: pytest -q tests/test_d03_pep_intake.py
      - name: Independent materialization A
        shell: bash
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/pep-a"
          for attempt in 1 2 3; do
            rm -rf "$out"
            echo "A transport attempt ${attempt}/3"
            if python tools/materialize_d03_peps.py --repo-root . --output-dir "$out"; then
              echo "$attempt" > "$RUNNER_TEMP/pep-a-attempts"
              exit 0
            fi
            sleep $((attempt * 3))
          done
          exit 1
      - name: Independent materialization B
        shell: bash
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/pep-b"
          for attempt in 1 2 3; do
            rm -rf "$out"
            echo "B transport attempt ${attempt}/3"
            if python tools/materialize_d03_peps.py --repo-root . --output-dir "$out"; then
              echo "$attempt" > "$RUNNER_TEMP/pep-b-attempts"
              exit 0
            fi
            sleep $((attempt * 3))
          done
          exit 1
      - name: Verify two-clean equality and emit text-free evidence
        shell: bash
        run: |
          set -euo pipefail
          cmp "$RUNNER_TEMP/pep-a/pep-candidate.jsonl" "$RUNNER_TEMP/pep-b/pep-candidate.jsonl"
          cmp "$RUNNER_TEMP/pep-a/pep-report.json" "$RUNNER_TEMP/pep-b/pep-report.json"
          python - <<'PY'
          import hashlib
          import json
          import os
          import platform
          import subprocess
          import sys
          from pathlib import Path

          root = Path(os.environ["RUNNER_TEMP"])
          a = root / "pep-a"
          b = root / "pep-b"
          report_a_bytes = (a / "pep-report.json").read_bytes()
          report_b_bytes = (b / "pep-report.json").read_bytes()
          candidate_a = (a / "pep-candidate.jsonl").read_bytes()
          candidate_b = (b / "pep-candidate.jsonl").read_bytes()
          assert candidate_a == candidate_b
          assert report_a_bytes == report_b_bytes
          report = json.loads(report_a_bytes)
          assert report["status"] == "CANDIDATE_MATERIALIZED_ZERO_CREDIT"
          assert report["training_authorized_bytes"] == 0 and type(report["training_authorized_bytes"]) is int
          assert report["authorized_unique_loss_positions"] == 0 and type(report["authorized_unique_loss_positions"]) is int
          assert report["canonical_capacity_credit_bytes"] == 0 and type(report["canonical_capacity_credit_bytes"]) is int
          assert report["model_training_permitted"] is False
          assert report["paid_compute_used"] is False

          def sha256(data: bytes) -> str:
              return hashlib.sha256(data).hexdigest()

          product_paths = [
              "configs/data/d03_pep_public_domain_intake_v1.json",
              "src/twelve_six/data/pep_intake.py",
              "tests/test_d03_pep_intake.py",
              "tools/materialize_d03_peps.py",
          ]
          blobs = {
              path: subprocess.check_output(["git", "rev-parse", f"HEAD:{path}"], text=True).strip()
              for path in product_paths
          }
          evidence = {
              "schema_version": "12-6.d03-pep-real-execution-evidence.v1",
              "execution_class": "LOCAL_FREE",
              "execution_head": os.environ["GITHUB_SHA"],
              "qualified_product_head": os.environ["PRODUCT_HEAD"],
              "github_run_id": int(os.environ["GITHUB_RUN_ID"]),
              "github_run_attempt": int(os.environ["GITHUB_RUN_ATTEMPT"]),
              "github_job": os.environ["GITHUB_JOB"],
              "python_version": sys.version.split()[0],
              "platform": platform.platform(),
              "product_git_blobs": blobs,
              "acquisition_attempts_a": int((root / "pep-a-attempts").read_text().strip()),
              "acquisition_attempts_b": int((root / "pep-b-attempts").read_text().strip()),
              "two_independent_materializations_byte_identical": True,
              "candidate_file_bytes": len(candidate_a),
              "candidate_file_sha256": sha256(candidate_a),
              "report_file_bytes": len(report_a_bytes),
              "report_file_sha256": sha256(report_a_bytes),
              "materialization_report": report,
              "canonical_capacity_credited": 0,
              "training_authorized_bytes": 0,
              "authorized_optimized_target_exposure": 0,
              "tokenizer_fit_authorized": False,
              "training_executed": False,
              "learned_weights_created": False,
              "final_test_accessed": False,
              "paid_compute_used": False,
              "foreign_pretrained_weights": False,
              "external_llm_or_api_used_for_data_or_intelligence": False,
          }
          out = Path("pep-real-execution-evidence.json")
          out.write_text(json.dumps(evidence, sort_keys=True, indent=2) + "\n", encoding="utf-8")
          print(out.read_text(encoding="utf-8"))
          PY
      - name: Upload text-free execution evidence only
        uses: actions/upload-artifact@v4
        with:
          name: d03-pep-real-execution-evidence
          path: pep-real-execution-evidence.json
          if-no-files-found: error
          retention-days: 14
