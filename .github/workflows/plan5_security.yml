name: Plan 5 Trust Boundary Contract
on:
  push:
    paths:
      - 'src/twelve_six_agent_runtime/security.py'
      - 'tests/test_agent_security_section10.py'
      - '.github/workflows/plan5_security.yml'
  pull_request:
    paths:
      - 'src/twelve_six_agent_runtime/security.py'
      - 'tests/test_agent_security_section10.py'
      - '.github/workflows/plan5_security.yml'
jobs:
  local-free:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install pytest ruff
      - run: PYTHONPATH=src python -m pytest -q tests/test_agent_security_section10.py tests/test_agent_multimodal_section9.py tests/test_agent_tools_section7.py tests/test_agent_task_state_section2.py tests/test_agent_task_state_section2_adversarial.py tests/test_agent_context_section1.py
      - run: PYTHONPATH=src python -m compileall -q src/twelve_six_agent_runtime
      - run: ruff check src/twelve_six_agent_runtime/security.py tests/test_agent_security_section10.py
