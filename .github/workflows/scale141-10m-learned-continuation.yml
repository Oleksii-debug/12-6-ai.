name: SCALE-141 10M Learned Continuation

on:
  pull_request:
    branches:
      - milestone100/first-learned-base-20260826
      - scale141/10m-learned-fallback-20260826
    paths:
      - ".github/workflows/scale141-10m-learned-continuation.yml"
      - "src/twelve_six/scale141*.py"
      - "src/twelve_six/launch_gate.py"
      - "src/twelve_six/milestone100_first_learned.py"
      - "src/twelve_six/model/**"
      - "src/twelve_six/model.py"
      - "src/twelve_six/training/**"
      - "src/twelve_six/checkpoint/**"
      - "src/twelve_six/checkpoint.py"
      - "src/twelve_six/tokenization/**"
      - "src/twelve_six/inference/**"
      - "data/corpus_v01/**"
      - "configs/data/corpus_v01.json"
      - "configs/stages/alternatives/s3_10m_scale03_byte_gqa.execution.json"
      - "configs/runs/s3_10m_scale03_gpu_pilot.json"
      - "configs/launch/scale141-10m.json"
      - "requirements/locks/linux-x86_64/**"
      - "tests/test_ci165_scale141_gate.py"
      - "tests/test_scale141*.py"
      - "tests/test_checkpointing.py"
      - "tests/test_data25_corpus_v01.py"
  workflow_dispatch:

concurrency:
  group: scale141-10m-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  pull-requests: write

jobs:
  learned-10m-fallback:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    env:
      PYTHONPATH: src
      OMP_NUM_THREADS: "2"
      MKL_NUM_THREADS: "2"
    steps:
      - name: Checkout exact SCALE-141 head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up exact Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11.16"

      - name: Bind exact source
        env:
          EXPECTED_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SOURCE_SHA"

      - name: Install locked test tooling before model runtime
        run: |
          set -euo pipefail
          python -m venv .scale141
          .scale141/bin/python -m pip install \
            --disable-pip-version-check --no-deps --require-hashes \
            -r requirements/locks/linux-x86_64/toolchain.lock.txt
          .scale141/bin/python -m pip install \
            --disable-pip-version-check --no-deps --require-hashes \
            -r requirements/locks/linux-x86_64/dev.lock.txt
          .scale141/bin/python -m pytest --version
          .scale141/bin/ruff --version

      - name: Install hash-locked CPU runtime
        run: |
          set -euo pipefail
          .scale141/bin/python -m pip install \
            --disable-pip-version-check --no-deps --require-hashes \
            -r requirements/locks/linux-x86_64/runtime.lock.txt
          .scale141/bin/python -m pip check

      - name: Compile and test SCALE-141 plus launch-gate contracts
        run: |
          set -euo pipefail
          .scale141/bin/python -m compileall -q src/twelve_six
          .scale141/bin/python -m twelve_six.scale141_fresh_verify --help >/dev/null
          .scale141/bin/python -m pytest -q \
            tests/test_ci165_scale141_gate.py \
            tests/test_data25_corpus_v01.py \
            tests/test_checkpointing.py \
            tests/test_scale141_10m_continuation.py \
            tests/test_scale141_10m_runtime_v2.py \
            tests/test_scale141_10m_runtime_v3.py \
            tests/test_scale141_memorization.py

      - name: Materialize deterministic corpus identity for launch gate
        run: |
          set -euo pipefail
          .scale141/bin/python - <<'PY'
          from pathlib import Path
          from twelve_six.milestone100_first_learned import EXPECTED_CORPUS_ID, _build_corpus

          repo = Path(".").resolve()
          out = Path("scale141-evidence").resolve()
          out.mkdir(parents=True, exist_ok=True)
          manifest = _build_corpus(repo, out)
          if manifest["corpus_identity_sha256"] != EXPECTED_CORPUS_ID:
              raise SystemExit("DATA-25 corpus identity mismatch during launch materialization")
          print(manifest["corpus_identity_sha256"])
          PY

      - name: Create and verify mandatory cheap 10M launch envelope
        run: |
          set -euo pipefail
          .scale141/bin/python -m twelve_six.launch_gate create \
            --repo-root . \
            --request configs/launch/scale141-10m.json \
            --output scale141-evidence/launch-10m.json
          .scale141/bin/python -m twelve_six.launch_gate verify \
            --repo-root . \
            --request configs/launch/scale141-10m.json \
            --envelope scale141-evidence/launch-10m.json

      - name: Execute learned 10M fallback phase 1
        env:
          EXPECTED_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          TWELVE_SIX_LAUNCH_REQUEST: configs/launch/scale141-10m.json
          TWELVE_SIX_LAUNCH_ENVELOPE: scale141-evidence/launch-10m.json
        run: |
          set -euo pipefail
          .scale141/bin/python -m twelve_six.scale141_10m_runtime_v3 \
            phase1 \
            --repo-root . \
            --source-sha "$EXPECTED_SOURCE_SHA" \
            --output-dir scale141-evidence

      - name: Execute mandatory fresh-process resume
        env:
          EXPECTED_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          TWELVE_SIX_LAUNCH_REQUEST: configs/launch/scale141-10m.json
          TWELVE_SIX_LAUNCH_ENVELOPE: scale141-evidence/launch-10m.json
        run: |
          set -euo pipefail
          .scale141/bin/python -m twelve_six.scale141_10m_runtime_v3 \
            resume \
            --repo-root . \
            --source-sha "$EXPECTED_SOURCE_SHA" \
            --output-dir scale141-evidence

      - name: Validate scientific report
        env:
          EXPECTED_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          .scale141/bin/python -m twelve_six.scale141_10m_runtime_v3 \
            validate scale141-evidence/report.json \
            --expected-source-sha "$EXPECTED_SOURCE_SHA"
          .scale141/bin/python - <<'PY'
          import json
          from pathlib import Path
          r = json.loads(Path("scale141-evidence/report.json").read_text(encoding="utf-8"))
          points = r["scheduled"]
          print(json.dumps({
              "source_sha": r["source_sha"],
              "decision": r["incumbent_search_decision"],
              "parameter_count": r["model"]["parameter_count"],
              "executed_sequence_length": r["model"]["executed_sequence_length"],
              "optimized_tokens": r["corpus"]["optimized_tokens"],
              "optimized_tokens_by_modality": r["corpus"]["optimized_tokens_by_modality"],
              "corpus_fraction": r["corpus"]["fraction_of_one_train_corpus"],
              "heldout_bpb_by_token_target": {k: v["heldout"]["bits_per_byte"] for k, v in points.items()},
              "memorization_exact_rate_by_token_target": {k: v["memorization"]["hash_only_training_passage_probe"]["exact_short_continuation_rate"] for k, v in points.items()},
              "clip_rate_by_token_target": {k: v["training_interval"].get("clip_rate") for k, v in points.items()},
              "fresh_process_resume": r["fresh_process_resume"],
              "cadence": r["cadence"],
              "final_checkpoint_id": r["checkpoint_integrity"]["final_checkpoint_id"],
              "report_sha256": r["report_sha256"],
          }, ensure_ascii=False, indent=2, sort_keys=True))
          PY

      - name: Fresh-verify and retain best and final 10M checkpoints
        env:
          EXPECTED_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          .scale141/bin/python -m twelve_six.scale141_fresh_verify \
            --repo-root . \
            --source-sha "$EXPECTED_SOURCE_SHA" \
            --output-dir scale141-evidence
          .scale141/bin/python - <<'PY'
          import json
          import shutil
          from pathlib import Path

          root = Path("scale141-evidence")
          verification = json.loads((root / "fresh-verification.json").read_text(encoding="utf-8"))
          if verification["fresh_verification"]["status"] != "PASS":
              raise SystemExit("refusing retention without fresh verification PASS")
          retained = root / "retained"
          retained.mkdir(parents=True, exist_ok=True)
          index = {"schema": "12-6.scale141-retained-checkpoints.v1", "source_sha": verification["source_sha"], "roles": {}}
          for role in ("best", "final"):
              evidence = verification["evidence"][role]
              source = root / evidence["checkpoint_directory"]
              destination = retained / role
              if destination.exists():
                  shutil.rmtree(destination)
              shutil.copytree(source, destination)
              index["roles"][role] = {
                  "source_directory": evidence["checkpoint_directory"],
                  "target_optimized_tokens": evidence["target_optimized_tokens"],
                  "checkpoint_id": evidence["checkpoint_id"],
                  "fresh_verification": "PASS",
                  "ladder_common_evaluation_identity": verification["ladder_common_evaluation"]["identity"]["identity_sha256"],
              }
          (retained / "index.json").write_text(json.dumps(index, ensure_ascii=False, sort_keys=True, indent=2) + "\n", encoding="utf-8")
          PY

      - name: Publish compact evidence to PR
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          .scale141/bin/python - <<'PY'
          import json
          from pathlib import Path
          r = json.loads(Path("scale141-evidence/report.json").read_text(encoding="utf-8"))
          v = json.loads(Path("scale141-evidence/fresh-verification.json").read_text(encoding="utf-8"))
          s0 = r["scheduled"]["0"]
          sf = r["scheduled"]["2000000"]
          f = r["fresh_process_resume"]
          c = r["cadence"]
          mem = sf["memorization"]["hash_only_training_passage_probe"]
          common = v["ladder_common_evaluation"]
          lines = [
              "### SCALE-141 exact-head learned-10M evidence",
              "",
              f"- incumbent search: `{r['incumbent_search_decision']}` (no mechanics artifact was promoted to learned status)",
              f"- source SHA: `{r['source_sha']}`",
              f"- model: `{r['model']['parameter_count']}` parameters, exact S3 ModelSpec; executed seq `{r['model']['executed_sequence_length']}` within max `{r['model']['max_sequence_length']}`",
              f"- actual optimized bytes: `{r['corpus']['optimized_tokens']}` = `{r['corpus']['fraction_of_one_train_corpus']:.2%}` of one DATA-25 train corpus; replay=`{r['corpus']['corpus_replay']}`",
              f"- modality optimized bytes UK/EN/code: `{r['corpus']['optimized_tokens_by_modality']['uk']}` / `{r['corpus']['optimized_tokens_by_modality']['en']}` / `{r['corpus']['optimized_tokens_by_modality']['code']}`",
              f"- campaign held-out fixed-suite BPB token 0 → 2M: `{s0['heldout']['bits_per_byte']:.6f}` → `{sf['heldout']['bits_per_byte']:.6f}`",
              f"- M150 common evaluation identity: `{common['identity']['identity_sha256']}`; best target `{common['best_target_optimized_tokens']}` at BPB `{common['best_bits_per_byte']:.6f}`; final BPB `{common['final_bits_per_byte']:.6f}`",
              f"- M150-common best checkpoint fresh verify: `{v['fresh_verification']['status']}`",
              f"- held-out modality BPB final UK/EN/code: `{sf['heldout']['by_modality']['uk']['bits_per_byte']:.6f}` / `{sf['heldout']['by_modality']['en']['bits_per_byte']:.6f}` / `{sf['heldout']['by_modality']['code']['bits_per_byte']:.6f}`",
              f"- hash-only training-passage memorization probe final exact short-continuation rate: `{mem['exact_short_continuation_rate']:.4%}`; mean BPB `{mem['mean_bits_per_byte']:.6f}`",
              f"- final interval clip rate: `{sf['training_interval']['clip_rate']:.4%}`",
              f"- final interval throughput: `{sf['training_interval']['train_tokens_per_second_mean']:.2f}` optimized byte targets/s",
              f"- fresh-process resume: checkpoint step `{f['loaded_step']}` at `{f['loaded_optimized_tokens']}` optimized bytes → first resumed step `{f['first_resumed_step']}`; held-out reload check=`{f['metric_recheck_passed']}`",
              f"- measured recovery cadence: every `{c['checkpoint_every_optimizer_steps']}` optimizer steps; joint 5s/5% feasibility=`{c['five_second_and_overhead_constraints_jointly_feasible']}`",
              f"- final checkpoint id: `{r['checkpoint_integrity']['final_checkpoint_id']}`",
              f"- report SHA-256: `{r['report_sha256']}`",
              f"- fresh-verification SHA-256: `{v['identity_sha256']}`",
              "",
              "The retained best checkpoint is selected only on the exact M150 common evaluation identity. Memorization output contains hashes/metrics only and makes no privacy-leakage claim. Scaling-law values remain explicitly out-of-domain diagnostics, not success gates. DATA-25 is project-authored UK/EN/code evidence, not an external-corpus representativeness claim.",
          ]
          Path("scale141-evidence/pr-comment.md").write_text("\n".join(lines) + "\n", encoding="utf-8")
          PY
          gh pr comment "$PR_NUMBER" --repo "$GH_REPO" --body-file scale141-evidence/pr-comment.md

      - name: Upload retained SCALE-141 evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: scale141-10m-learned-fallback
          path: |
            scale141-evidence/launch-10m.json
            scale141-evidence/report.json
            scale141-evidence/fresh-verification.json
            scale141-evidence/phase1.json
            scale141-evidence/corpus-manifest.json
            scale141-evidence/run-manifest.json
            scale141-evidence/cadence-runtime.json
            scale141-evidence/machine-phase1.json
            scale141-evidence/machine-resume.json
            scale141-evidence/train-curve.jsonl
            scale141-evidence/retained/
          if-no-files-found: error
          retention-days: 14
