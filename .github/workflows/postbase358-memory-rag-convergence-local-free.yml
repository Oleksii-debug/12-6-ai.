name: POSTBASE-358 memory RAG convergence LOCAL_FREE

on:
  pull_request:
    paths:
      - "src/twelve_six/memory_rag/**"
      - "tests/test_memory_rag_postbase358.py"
      - "docs/POSTBASE358_MEMORY_RAG_CONVERGENCE.md"
      - ".github/workflows/postbase358-memory-rag-convergence-local-free.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  memory-rag-convergence:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11.16"
      - name: Run stdlib-only convergence suite
        env:
          PYTHONPATH: src
        run: python tests/test_memory_rag_postbase358.py -v
