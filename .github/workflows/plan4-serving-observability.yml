name: Plan 4 Serving Observability
on:
  pull_request:
    paths:
      - "tools/plan4_serving_observability.py"
      - "tests/test_plan4_serving_observability.py"
      - "docs/PLAN4_SECTION9_SERVING_OBSERVABILITY.md"
      - ".github/workflows/plan4-serving-observability.yml"
  push:
    branches: [main]
    paths:
      - "tools/plan4_serving_observability.py"
      - "tests/test_plan4_serving_observability.py"
      - "docs/PLAN4_SECTION9_SERVING_OBSERVABILITY.md"
      - ".github/workflows/plan4-serving-observability.yml"
permissions:
  contents: read
jobs:
  serving-observability:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install project test dependencies
        run: python -m pip install -e ".[dev]"
      - name: Lint observability source and tests
        run: ruff check --select E4,E7,E9,F tools/plan4_serving_observability.py tests/test_plan4_serving_observability.py
      - name: Run observability and serving integration fixtures
        run: |
          python -m py_compile tools/plan4_serving_observability.py
          python -m pytest -q tests/test_plan4_serving_observability.py tests/test_plan4_multimodel_serving.py tests/test_plan4_model_gateway.py tests/test_plan4_model_service.py
