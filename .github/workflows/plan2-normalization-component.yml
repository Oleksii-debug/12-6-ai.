name: Plan 2 Normalization Component Qualification

on:
  push:
    branches:
      - 'plan2/**'
    paths:
      - 'tools/plan2_normalization_evidence_v1.py'
      - 'tests/test_plan2_normalization_evidence_v1.py'
      - 'configs/data/plan2_normalization_policy_v1.json'
      - '.github/workflows/plan2-normalization-component.yml'
  pull_request:
    paths:
      - 'tools/plan2_normalization_evidence_v1.py'
      - 'tests/test_plan2_normalization_evidence_v1.py'
      - 'configs/data/plan2_normalization_policy_v1.json'
      - '.github/workflows/plan2-normalization-component.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  normalization:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Minimal LOCAL_FREE dependencies
        run: python -m pip install pytest ruff
      - name: Plan-2 S4 lint
        run: ruff check tools/plan2_normalization_evidence_v1.py tests/test_plan2_normalization_evidence_v1.py
      - name: Source rights acquisition and normalization regression
        run: PYTHONPATH=.:src pytest -q tests/test_plan2_source_inventory_v1.py tests/test_plan2_source_admissibility_v1.py tests/test_plan2_physical_materialization_v1.py tests/test_data324_current_main_port.py tests/test_plan2_normalization_evidence_v1.py
      - name: Replay exact normalized policy and records
        shell: bash
        run: |
          export PYTHONPATH=.:src
          python tools/plan2_normalization_evidence_v1.py --out-dir "${RUNNER_TEMP}/plan2-normalization" > "${RUNNER_TEMP}/plan2-first.json"
          python tools/plan2_normalization_evidence_v1.py --out-dir "${RUNNER_TEMP}/plan2-normalization" > "${RUNNER_TEMP}/plan2-restart.json"
          cmp "${RUNNER_TEMP}/plan2-first.json" "${RUNNER_TEMP}/plan2-restart.json"
