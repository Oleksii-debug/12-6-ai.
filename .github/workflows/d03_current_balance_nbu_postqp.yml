name: D03 current balance plus post-QP NBU canonical balance

on:
  pull_request:
    branches:
      - execution/d03-current-code-franko-ubuntu-pep-loc-balance-g8-140-20261005
    paths:
      - ".github/workflows/d03_current_balance_nbu_postqp.yml"
      - "tools/run_d03_current_balance_nbu_postqp_v1.py"

permissions:
  actions: read
  contents: read

concurrency:
  group: d03-current-balance-nbu-postqp-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  execute-canonical-balance:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.head_ref == 'execution/2792-nbu-current40-balance-g8-146-20261006'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      EXECUTION_HEAD: ${{ github.event.pull_request.head.sha }}
      GITHUB_TOKEN: ${{ github.token }}

      BASE_HEAD: 0c7423e3fe9d6bac0c1ba91294d0e6830490e820
      BASE_ARTIFACT_ID: "11361822117"
      BASE_ARTIFACT_NAME: d03-current-code-franko-ubuntu-pep-loc-balance-0c7423e3fe9d6bac0c1ba91294d0e6830490e820
      BASE_ARTIFACT_SHA256: 3434b443be51ab728ac6a224c5a04cbab7aaa9a7c09090c7ff14da80b0f1d4a9
      BASE_COMPOSITION_FILE_SHA256: 27ebecf4e9d3c6419d51039a30991cbd02231f83091b5980efde23c6df5d7934
      BASE_NEXT100_FILE_SHA256: e1cc496a16c239761e9268168bb4109e99a20218d98ce86e49c49c540f1b362b
      BASE_RECEIPT_FILE_SHA256: ebe428e18b22034162c1e602a9dccf4a590ac0721fceebecc369ebeffe49047c

      NBU_HEAD: dc4822ec1365494507bca1d67bab1b334a3fa143
      NBU_ARTIFACT_ID: "11379738251"
      NBU_ARTIFACT_NAME: d03-nbu-current40-decontam-qp-dc4822ec1365494507bca1d67bab1b334a3fa143
      NBU_ARTIFACT_SHA256: 5abfa5e8e880381b93e1c33c0a8c6713dbeab546835049482957b6b2c393d425
      NBU_EVIDENCE_FILE_SHA256: 6ac178e07964eb14683eb17a1c0a3a1329179240a66820e160a82cefd9a878d1

      NBU_INTAKE_HEAD: 86a8a2a6f91eb4093bee414aaa8e8bbd3d895761
      NBU_INTAKE_PATH: configs/data/d03_ua_nbu_official_resolutions_intake_v1.json
      NBU_INTAKE_BLOB: b883cbdb489058e005e83f64ce11a67505e03778

      RUNNER_BLOB: ca7264460db583b09c4bc4e466f06c24cc2f4a05
      GATE_BLOB: ae4f9ccdc3cfe3e053dd57d46f80aebe121268c5
      POLICY_BLOB: b5a2577aeb1a2e56ebff1a4b46ac325d99dd8f8f

    steps:
      - name: Checkout exact execution head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.EXECUTION_HEAD }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set exact CPython
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11.16"

      - name: Bind exact parent-relative execution closure
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXECUTION_HEAD"
          test "$(git merge-base "$BASE_HEAD" HEAD)" = "$BASE_HEAD"
          mapfile -t changed < <(git diff --name-only "$BASE_HEAD"..HEAD | sort)
          expected=(
            ".github/workflows/d03_current_balance_nbu_postqp.yml"
            "tools/run_d03_current_balance_nbu_postqp_v1.py"
          )
          mapfile -t wanted < <(printf '%s\n' "${expected[@]}" | sort)
          test "${#changed[@]}" -eq "${#wanted[@]}"
          for i in "${!wanted[@]}"; do
            test "${changed[$i]}" = "${wanted[$i]}"
          done
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          python -m py_compile \
            tools/run_d03_current_balance_nbu_postqp_v1.py \
            tools/next100_106_balance_gate.py
          test "$(git hash-object tools/run_d03_current_balance_nbu_postqp_v1.py)" = "$RUNNER_BLOB"
          test "$(git hash-object tools/next100_106_balance_gate.py)" = "$GATE_BLOB"
          test "$(git hash-object configs/data/next100_106_balance_gate_policy_v1.json)" = "$POLICY_BLOB"
          PYTHONPATH=. python tools/next100_106_balance_gate.py validate-policy

      - name: Fetch exact qualified artifacts
        shell: bash
        run: |
          set -euo pipefail
          fetch_artifact() {
            kind="$1"
            artifact_id="$2"
            expected_name="$3"
            expected_digest="$4"
            expected_head="$5"

            curl --fail --silent --show-error --retry 5 --retry-all-errors \
              -H "Authorization: Bearer $GITHUB_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${artifact_id}" \
              -o "$RUNNER_TEMP/${kind}-metadata.json"

            KIND="$kind" EXPECTED_NAME="$expected_name" EXPECTED_DIGEST="$expected_digest" \
              EXPECTED_HEAD="$expected_head" python - <<'PY'
          import json
          import os
          from pathlib import Path

          kind = os.environ["KIND"]
          path = Path(os.environ["RUNNER_TEMP"]) / f"{kind}-metadata.json"
          meta = json.loads(path.read_text(encoding="utf-8"))
          if meta.get("name") != os.environ["EXPECTED_NAME"]:
              raise SystemExit(f"{kind}: artifact name drift")
          if meta.get("expired") is not False:
              raise SystemExit(f"{kind}: artifact expired")
          if meta.get("digest") != "sha256:" + os.environ["EXPECTED_DIGEST"]:
              raise SystemExit(f"{kind}: artifact digest drift")
          workflow = meta.get("workflow_run")
          if not isinstance(workflow, dict):
              raise SystemExit(f"{kind}: workflow metadata missing")
          if workflow.get("head_sha") != os.environ["EXPECTED_HEAD"]:
              raise SystemExit(f"{kind}: workflow head drift")
          PY

            curl --fail --silent --show-error --location --retry 5 --retry-all-errors \
              -H "Authorization: Bearer $GITHUB_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${artifact_id}/zip" \
              -o "$RUNNER_TEMP/${kind}.zip"
            test "$(sha256sum "$RUNNER_TEMP/${kind}.zip" | cut -d' ' -f1)" = "$expected_digest"
          }

          fetch_artifact \
            base "$BASE_ARTIFACT_ID" "$BASE_ARTIFACT_NAME" \
            "$BASE_ARTIFACT_SHA256" "$BASE_HEAD"
          fetch_artifact \
            nbu "$NBU_ARTIFACT_ID" "$NBU_ARTIFACT_NAME" \
            "$NBU_ARTIFACT_SHA256" "$NBU_HEAD"

      - name: Extract allowlisted text-free authorities
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/inputs"
          python - <<'PY'
          import hashlib
          import os
          import stat
          import zipfile
          from pathlib import Path

          tmp = Path(os.environ["RUNNER_TEMP"])
          out = tmp / "inputs"
          specs = {
              "base": {
                  "expected": {
                      "combined-dedup-proof.json",
                      "composition.json",
                      "family-authority-extension.json",
                      "next100-input.json",
                      "balance-result.json",
                      "execution-receipt.json",
                  },
                  "wanted": {
                      "composition.json": (
                          "base-composition.json",
                          os.environ["BASE_COMPOSITION_FILE_SHA256"],
                      ),
                      "next100-input.json": (
                          "base-next100.json",
                          os.environ["BASE_NEXT100_FILE_SHA256"],
                      ),
                      "execution-receipt.json": (
                          "base-receipt.json",
                          os.environ["BASE_RECEIPT_FILE_SHA256"],
                      ),
                  },
              },
              "nbu": {
                  "expected": {
                      "output-a/evidence.json",
                      "nbu-current40-post-qp-two-clean-proof.json",
                  },
                  "wanted": {
                      "output-a/evidence.json": (
                          "nbu-evidence.json",
                          os.environ["NBU_EVIDENCE_FILE_SHA256"],
                      ),
                  },
              },
          }
          for kind, spec in specs.items():
              with zipfile.ZipFile(tmp / f"{kind}.zip") as bundle:
                  infos = bundle.infolist()
                  names = [info.filename for info in infos]
                  if len(names) != len(set(names)) or set(names) != spec["expected"]:
                      raise SystemExit(f"{kind}: artifact member allowlist drift")
                  by_name = {}
                  for info in infos:
                      path = Path(info.filename)
                      mode = (info.external_attr >> 16) & 0o170000
                      if (
                          info.is_dir()
                          or "\\" in info.filename
                          or info.filename.startswith("/")
                          or ".." in path.parts
                          or mode == stat.S_IFLNK
                      ):
                          raise SystemExit(f"{kind}: unsafe artifact member")
                      by_name[info.filename] = info
                  for source, (dest, digest) in spec["wanted"].items():
                      raw = bundle.read(by_name[source])
                      if hashlib.sha256(raw).hexdigest() != digest:
                          raise SystemExit(f"{kind}: member digest drift")
                      (out / dest).write_bytes(raw)
          PY

      - name: Fetch and bind exact NBU intake contract
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --retry 5 --retry-all-errors \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/contents/${NBU_INTAKE_PATH}?ref=${NBU_INTAKE_HEAD}" \
            -o "$RUNNER_TEMP/nbu-intake-api.json"

          python - <<'PY'
          import base64
          import json
          import os
          from pathlib import Path

          tmp = Path(os.environ["RUNNER_TEMP"])
          response = json.loads((tmp / "nbu-intake-api.json").read_text(encoding="utf-8"))
          if response.get("type") != "file":
              raise SystemExit("NBU intake authority is not a file")
          if response.get("path") != os.environ["NBU_INTAKE_PATH"]:
              raise SystemExit("NBU intake path drift")
          if response.get("sha") != os.environ["NBU_INTAKE_BLOB"]:
              raise SystemExit("NBU intake Git blob drift")
          if response.get("encoding") != "base64":
              raise SystemExit("NBU intake API encoding drift")
          encoded = "".join(response["content"].split())
          raw = base64.b64decode(encoded, validate=True)
          (tmp / "inputs" / "nbu-intake.json").write_bytes(raw)
          PY

          test "$(git hash-object "$RUNNER_TEMP/inputs/nbu-intake.json")" = "$NBU_INTAKE_BLOB"

      - name: Reject coherently resealed NBU evidence mutation
        shell: bash
        run: |
          set -euo pipefail
          cp "$RUNNER_TEMP/inputs/nbu-evidence.json" "$RUNNER_TEMP/mutated-nbu.json"
          python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          path = Path(os.environ["RUNNER_TEMP"]) / "mutated-nbu.json"
          value = json.loads(path.read_text(encoding="utf-8"))
          value["truth_boundary"]["training_executed"] = True
          core = dict(value)
          core.pop("evidence_identity_sha256")
          payload = json.dumps(
              core,
              ensure_ascii=False,
              sort_keys=True,
              separators=(",", ":"),
              allow_nan=False,
          ).encode("utf-8")
          value["evidence_identity_sha256"] = hashlib.sha256(payload).hexdigest()
          path.write_text(
              json.dumps(
                  value,
                  ensure_ascii=False,
                  sort_keys=True,
                  separators=(",", ":"),
                  allow_nan=False,
              )
              + "\n",
              encoding="utf-8",
          )
          PY

          if PYTHONPATH=. python tools/run_d03_current_balance_nbu_postqp_v1.py \
            --base-composition-json "$RUNNER_TEMP/inputs/base-composition.json" \
            --base-next100-json "$RUNNER_TEMP/inputs/base-next100.json" \
            --base-receipt-json "$RUNNER_TEMP/inputs/base-receipt.json" \
            --nbu-evidence-json "$RUNNER_TEMP/mutated-nbu.json" \
            --nbu-family-config-json "$RUNNER_TEMP/inputs/nbu-intake.json" \
            --execution-head "$EXECUTION_HEAD" \
            --output-dir "$RUNNER_TEMP/mutated-output"; then
            echo "coherently resealed NBU evidence mutation was accepted" >&2
            exit 1
          fi
          test ! -e "$RUNNER_TEMP/mutated-output"

      - name: Execute exact union and canonical balance twice
        shell: bash
        run: |
          set -euo pipefail
          for suffix in a b; do
            out="$RUNNER_TEMP/output-${suffix}"
            rm -rf "$out"
            PYTHONPATH=. python tools/run_d03_current_balance_nbu_postqp_v1.py \
              --base-composition-json "$RUNNER_TEMP/inputs/base-composition.json" \
              --base-next100-json "$RUNNER_TEMP/inputs/base-next100.json" \
              --base-receipt-json "$RUNNER_TEMP/inputs/base-receipt.json" \
              --nbu-evidence-json "$RUNNER_TEMP/inputs/nbu-evidence.json" \
              --nbu-family-config-json "$RUNNER_TEMP/inputs/nbu-intake.json" \
              --execution-head "$EXECUTION_HEAD" \
              --output-dir "$out"
          done

          for name in \
            nbu-family-authority combined-dedup-proof composition \
            next100-input balance-result execution-receipt; do
            cmp "$RUNNER_TEMP/output-a/${name}.json" "$RUNNER_TEMP/output-b/${name}.json"
          done

      - name: Qualify exact result and zero-credit boundary
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          root = Path(os.environ["RUNNER_TEMP"]) / "output-a"
          names = {
              "nbu-family-authority",
              "combined-dedup-proof",
              "composition",
              "next100-input",
              "balance-result",
              "execution-receipt",
          }
          docs = {
              name: json.loads((root / f"{name}.json").read_text(encoding="utf-8"))
              for name in names
          }
          receipt = docs["execution-receipt"]
          proof = docs["combined-dedup-proof"]
          composition = docs["composition"]
          balance = docs["balance-result"]
          authority = docs["nbu-family-authority"]

          expected_receipt = {
              "execution_head_sha": os.environ["EXECUTION_HEAD"],
              "discounted_exact_replay_records": 0,
              "discounted_exact_replay_payload_bytes": 0,
              "novel_nbu_records": 40,
              "novel_nbu_source_objects": 40,
              "novel_nbu_payload_bytes": 891322,
              "combined_record_count": 2751,
              "combined_source_object_count": 2670,
              "combined_total_payload_bytes": 20661232,
              "raw_capacity_by_stratum": {
                  "ua": 1096637,
                  "en": 15481867,
                  "code": 4082728,
              },
              "maximum_feasible_total_source_bytes": 1026500,
              "maximum_feasible_stratum_bytes": {
                  "ua": 461925,
                  "en": 359275,
                  "code": 205300,
              },
              "raw_gap_to_target_by_stratum": {
                  "ua": 7903363,
                  "en": 0,
                  "code": 0,
              },
              "balance_status": "PARTIAL_MIX_FEASIBLE_ACQUIRE_MORE_DATA",
              "canonical_capacity_credited": 0,
              "training_authorized_bytes": 0,
              "authorized_unique_loss_positions": 0,
              "authorized_optimized_target_exposure": 0,
              "tokenizer_fit_authorized": False,
              "model_training_authorized": False,
              "optimizer_updates_executed_on_real_targets": 0,
              "training_executed": False,
              "learned_weights_created": False,
              "final_test_outcomes_read": False,
              "paid_compute_used": False,
              "scale_promotion_authorized": False,
          }
          for field, expected in expected_receipt.items():
              observed = receipt.get(field)
              if type(observed) is not type(expected) or observed != expected:
                  raise SystemExit(f"receipt drift: {field}")

          expected_family_minimum = {
              "required_per_stratum": 2,
              "observed": {"ua": 4, "en": 7, "code": 18},
              "pass": True,
          }
          if receipt.get("family_minimum") != expected_family_minimum:
              raise SystemExit("receipt family minimum drift")
          if balance.get("family_minimum") != expected_family_minimum:
              raise SystemExit("balance family minimum drift")

          for field in (
              "cross_inventory_record_id_collision_free",
              "cross_inventory_source_id_collision_free",
              "cross_inventory_exact_payload_collision_free",
          ):
              if proof.get(field) is not True:
                  raise SystemExit(f"collision proof drift: {field}")
          if proof.get("terminal_verdict") != "PASS":
              raise SystemExit("combined dedup proof is not PASS")

          if authority.get("intake_authority_git_sha") != os.environ["NBU_INTAKE_HEAD"]:
              raise SystemExit("NBU intake head drift")
          if authority.get("intake_authority_git_blob_sha1") != os.environ["NBU_INTAKE_BLOB"]:
              raise SystemExit("NBU intake blob drift")
          if authority.get("family") != "ua.nbu.official-resolutions":
              raise SystemExit("NBU family drift")
          if authority.get("stratum") != "uk":
              raise SystemExit("NBU stratum drift")
          if authority.get("post_qp_unique_payload_bytes") != 891322:
              raise SystemExit("NBU family capacity drift")
          if authority.get("zero_credit") is not True:
              raise SystemExit("NBU family authority widened credit")

          inventory = composition.get("combined_inventory")
          rows = inventory.get("records")
          if len(rows) != 2751:
              raise SystemExit("combined inventory record drift")
          if len({row["record_id"] for row in rows}) != 2751:
              raise SystemExit("combined record IDs not unique")
          if len({row["source_id"] for row in rows}) != 2670:
              raise SystemExit("combined source IDs not unique")
          if len({row["payload_sha256"] for row in rows}) != 2751:
              raise SystemExit("combined exact payloads not unique")
          if sum(row["payload_bytes"] for row in rows) != 20661232:
              raise SystemExit("combined payload byte drift")

          canonical = lambda value: json.dumps(
              value,
              ensure_ascii=False,
              sort_keys=True,
              separators=(",", ":"),
              allow_nan=False,
          ).encode("utf-8")
          payload_projection = [
              {
                  "record_id": row["record_id"],
                  "payload_sha256": row["payload_sha256"],
                  "payload_bytes": row["payload_bytes"],
              }
              for row in rows
          ]
          if hashlib.sha256(canonical(rows)).hexdigest() != inventory.get(
              "record_inventory_digest_sha256"
          ):
              raise SystemExit("combined record root drift")
          if hashlib.sha256(canonical(payload_projection)).hexdigest() != inventory.get(
              "payload_inventory_digest_sha256"
          ):
              raise SystemExit("combined payload root drift")

          self_hashes = {
              "nbu-family-authority": "authority_identity_sha256",
              "combined-dedup-proof": "evidence_identity_sha256",
              "composition": "composition_identity_sha256",
              "balance-result": "result_identity_sha256",
              "execution-receipt": "receipt_identity_sha256",
          }
          for name, identity_field in self_hashes.items():
              value = dict(docs[name])
              claimed = value.pop(identity_field)
              if hashlib.sha256(canonical(value)).hexdigest() != claimed:
                  raise SystemExit(f"{name}: self-hash mismatch")

          forbidden = {
              "text",
              "raw_text",
              "content",
              "payload",
              "training_text",
              "evaluation_payload",
          }
          def walk(value):
              if isinstance(value, dict):
                  overlap = forbidden & set(value)
                  if overlap:
                      raise SystemExit(
                          "raw-content key persisted: " + ",".join(sorted(overlap))
                      )
                  for child in value.values():
                      walk(child)
              elif isinstance(value, list):
                  for child in value:
                      walk(child)
          for value in docs.values():
              walk(value)

          print("D03_NBU_CURRENT_BALANCE_QUALIFIED")
          print(json.dumps(receipt, sort_keys=True))
          PY

      - name: Upload text-free NBU-composed balance evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: d03-current-balance-nbu-postqp-${{ env.EXECUTION_HEAD }}
          path: |
            ${{ runner.temp }}/output-a/nbu-family-authority.json
            ${{ runner.temp }}/output-a/combined-dedup-proof.json
            ${{ runner.temp }}/output-a/composition.json
            ${{ runner.temp }}/output-a/next100-input.json
            ${{ runner.temp }}/output-a/balance-result.json
            ${{ runner.temp }}/output-a/execution-receipt.json
          if-no-files-found: error
          retention-days: 90
