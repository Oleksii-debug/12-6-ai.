name: MODEL37 Vocabulary Pareto

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  controlled-vocab-matrix:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11.16"
      - name: Bind exact source head
        env:
          EXPECTED_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SOURCE_SHA"
      - name: Install canonical runtime plus exact experiment backend
        run: |
          python -m venv .vocab-experiment
          .vocab-experiment/bin/python -m pip install \
            --disable-pip-version-check --no-deps --require-hashes \
            -r requirements/locks/linux-x86_64/toolchain.lock.txt
          .vocab-experiment/bin/python -m pip install \
            --disable-pip-version-check --no-deps --require-hashes \
            -r requirements/locks/linux-x86_64/runtime.lock.txt
          .vocab-experiment/bin/python -m pip install \
            --disable-pip-version-check --no-deps --require-hashes --only-binary=:all: \
            -r requirements/experiments/tokenizers-linux-x86_64.lock.txt
      - name: Run controlled real vocabulary matrix
        env:
          EXPECTED_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          PYTHONPATH: src
        run: |
          mkdir -p vocabulary-evidence
          for vocab in 320 384 448 512; do
            .vocab-experiment/bin/python -m twelve_six.tokenization.real_experiments \
              run --source-sha "$EXPECTED_SOURCE_SHA" \
              --output "vocabulary-evidence/real-${vocab}.json" --vocab-size "$vocab"
            .vocab-experiment/bin/python -m twelve_six.tokenization.real_experiments \
              validate --input "vocabulary-evidence/real-${vocab}.json" \
              --source-sha "$EXPECTED_SOURCE_SHA"
          done
          .vocab-experiment/bin/python -m twelve_six.vocabulary matrix \
            --stage-config configs/stages/s1_100k.json \
            --reports \
              vocabulary-evidence/real-320.json \
              vocabulary-evidence/real-384.json \
              vocabulary-evidence/real-448.json \
              vocabulary-evidence/real-512.json \
            --output vocabulary-evidence/vocabulary-pareto.json
      - name: Focused vocabulary allocation tests
        env:
          PYTHONPATH: src
        run: .vocab-experiment/bin/python -m pytest -q tests/test_vocabulary_allocation.py
      - name: Upload vocabulary evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: model37-vocabulary-pareto
          path: vocabulary-evidence
          if-no-files-found: error
          retention-days: 30
