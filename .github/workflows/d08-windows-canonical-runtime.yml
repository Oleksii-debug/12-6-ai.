name: D08 Windows Canonical Runtime

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  prepare-canonical-windows-input:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11.16"
      - name: Prove exact source and install Linux D08 authority runtime
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          python -m pip install --disable-pip-version-check --require-hashes --no-deps \
            -r requirements/locks/linux-x86_64/toolchain.lock.txt
          python -m pip install --disable-pip-version-check --require-hashes --no-deps \
            -r requirements/locks/linux-x86_64/runtime.lock.txt
      - name: Build exact project wheel and canonical retained checkpoint
        shell: bash
        run: |
          set -euo pipefail
          bundle="$RUNNER_TEMP/windows-canonical-input"
          mkdir -p "$bundle/project" "$bundle/source-metadata"
          python -m pip wheel --disable-pip-version-check --no-deps --no-build-isolation \
            --wheel-dir "$bundle/project" .
          project_wheel="$(find "$bundle/project" -maxdepth 1 -name 'twelve_six_ai-*.whl' -print -quit)"
          test -n "$project_wheel"
          python -m pip install --disable-pip-version-check --no-deps --no-build-isolation "$project_wheel"
          python -m twelve_six.inference.s0_artifact build \
            --repo-root . \
            --candidate-sha "$SOURCE_SHA" \
            --checkpoint-out "$bundle/checkpoint" \
            --evidence-out "$bundle/checkpoint-evidence.json" \
            --train-steps 40 \
            --seed 20260824
          cp pyproject.toml "$bundle/source-metadata/pyproject.toml"
          mkdir -p "$bundle/requirements/locks"
          cp -R requirements/locks/windows-x86_64 "$bundle/requirements/locks/windows-x86_64"
      - name: Build Windows wheelhouse strictly from committed hashes
        shell: bash
        run: |
          set -euo pipefail
          bundle="$RUNNER_TEMP/windows-canonical-input"
          mkdir -p "$bundle/wheelhouse/toolchain" "$bundle/wheelhouse/runtime"
          python -m pip download --disable-pip-version-check --only-binary=:all: \
            --platform win_amd64 --python-version 3.11 --implementation cp \
            --require-hashes --no-deps \
            --dest "$bundle/wheelhouse/toolchain" \
            -r requirements/locks/windows-x86_64/toolchain.lock.txt
          python -m pip download --disable-pip-version-check --only-binary=:all: \
            --platform win_amd64 --python-version 3.11 --implementation cp \
            --require-hashes --no-deps \
            --dest "$bundle/wheelhouse/runtime" \
            -r requirements/locks/windows-x86_64/runtime.lock.txt
      - name: Verify wheelhouse closure and seal input artifact
        shell: bash
        run: |
          set -euo pipefail
          export BUNDLE_ROOT="$RUNNER_TEMP/windows-canonical-input"
          python - <<'PY'
          import hashlib
          import json
          import os
          import re
          from pathlib import Path

          root = Path(os.environ["BUNDLE_ROOT"])
          source_sha = os.environ["SOURCE_SHA"]
          normalized = re.compile(r"[-_.]+")

          def sha(path: Path) -> str:
              return hashlib.sha256(path.read_bytes()).hexdigest()

          def locked(path: Path) -> dict[tuple[str, str], str]:
              result = {}
              for raw in path.read_text(encoding="utf-8").splitlines():
                  line = raw.strip()
                  if not line or line.startswith("#"):
                      continue
                  requirement, digest = line.split(" --hash=sha256:", 1)
                  name, version = requirement.split("==", 1)
                  key = (normalized.sub("-", name).lower(), version)
                  if key in result:
                      raise RuntimeError(f"duplicate lock requirement: {key}")
                  result[key] = digest
              return result

          profile_root = root / "requirements/locks/windows-x86_64"
          for group in ("toolchain", "runtime"):
              expected = locked(profile_root / f"{group}.lock.txt")
              found = {}
              for wheel in sorted((root / "wheelhouse" / group).glob("*.whl")):
                  parts = wheel.name.split("-")
                  if len(parts) < 5:
                      raise RuntimeError(f"malformed wheel filename: {wheel.name}")
                  key = (normalized.sub("-", parts[0]).lower(), parts[1])
                  found[key] = sha(wheel)
              if found != expected:
                  raise RuntimeError(f"{group} wheelhouse does not exactly match committed lock")

          profile_path = profile_root / "profile.json"
          profile = json.loads(profile_path.read_text(encoding="utf-8"))
          claimed = profile.pop("manifest_sha256")
          actual = hashlib.sha256(
              json.dumps(profile, sort_keys=True, separators=(",", ":"), ensure_ascii=True).encode()
          ).hexdigest()
          if actual != claimed:
              raise RuntimeError("Windows profile self-hash mismatch")
          profile["manifest_sha256"] = claimed

          checkpoint_evidence = json.loads((root / "checkpoint-evidence.json").read_text(encoding="utf-8"))
          project_wheels = sorted((root / "project").glob("twelve_six_ai-*.whl"))
          if len(project_wheels) != 1:
              raise RuntimeError("expected exactly one project wheel")

          files = {}
          for path in sorted(root.rglob("*")):
              if not path.is_file() or path.name == "artifact-manifest.json":
                  continue
              relative = path.relative_to(root).as_posix()
              files[relative] = {"sha256": sha(path), "size": path.stat().st_size}

          manifest = {
              "schema_version": "12-6.windows-canonical-runtime-input.v1",
              "authority": "FREE_HOSTED_CANONICAL_WINDOWS_EXECUTION_INPUT",
              "source_sha": source_sha,
              "repository": "Oleksii-debug/12-6-ai.",
              "physical_repository_trailing_dot_blocker": True,
              "windows_repository_checkout_required": False,
              "windows_python": "3.11.9",
              "windows_profile": {
                  "file_sha256": sha(profile_path),
                  "manifest_sha256": claimed,
              },
              "project_wheel": {
                  "filename": project_wheels[0].name,
                  "sha256": sha(project_wheels[0]),
              },
              "checkpoint": {
                  "checkpoint_id": checkpoint_evidence["checkpoint"]["checkpoint_id"],
                  "evidence_sha256": checkpoint_evidence["evidence_sha256"],
              },
              "files": files,
          }
          manifest["manifest_sha256"] = hashlib.sha256(
              json.dumps(manifest, sort_keys=True, separators=(",", ":"), ensure_ascii=True).encode()
          ).hexdigest()
          (root / "artifact-manifest.json").write_text(
              json.dumps(manifest, sort_keys=True, indent=2) + "\n", encoding="utf-8", newline="\n"
          )
          print(json.dumps({
              "checkpoint_id": manifest["checkpoint"]["checkpoint_id"],
              "manifest_sha256": manifest["manifest_sha256"],
              "project_wheel_sha256": manifest["project_wheel"]["sha256"],
              "windows_profile_sha256": manifest["windows_profile"]["file_sha256"],
          }, sort_keys=True))
          PY
      - name: Upload canonical Windows execution input
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: d08-windows-canonical-runtime-input
          path: ${{ runner.temp }}/windows-canonical-input
          if-no-files-found: error
          retention-days: 30

  windows-canonical-checkpoint:
    needs: prepare-canonical-windows-input
    runs-on: windows-2025
    timeout-minutes: 20
    env:
      SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      GH_TOKEN: ${{ github.token }}
      PYTHONUTF8: "1"
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11.9"
      - name: Download exact same-run input without repository checkout
        shell: pwsh
        working-directory: ${{ runner.temp }}
        run: |
          $ErrorActionPreference = "Stop"
          $headers = @{
            Authorization = "Bearer $env:GH_TOKEN"
            Accept = "application/vnd.github+json"
            "X-GitHub-Api-Version" = "2022-11-28"
          }
          $listUri = "https://api.github.com/repos/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID/artifacts?per_page=100"
          $response = Invoke-RestMethod -Uri $listUri -Headers $headers
          $artifact = $response.artifacts | Where-Object { $_.name -eq "d08-windows-canonical-runtime-input" } | Select-Object -First 1
          if ($null -eq $artifact) { throw "canonical Windows input artifact not found" }
          $outerZip = Join-Path $env:RUNNER_TEMP "windows-canonical-input.zip"
          Invoke-WebRequest -Uri $artifact.archive_download_url -Headers $headers -OutFile $outerZip
          $downloadRoot = Join-Path $env:RUNNER_TEMP "downloaded-windows-input"
          Expand-Archive -LiteralPath $outerZip -DestinationPath $downloadRoot -Force
          $manifest = Get-ChildItem -LiteralPath $downloadRoot -Filter artifact-manifest.json -Recurse | Select-Object -First 1
          if ($null -eq $manifest) { throw "artifact-manifest.json missing from downloaded input" }
          $sourceRoot = $manifest.Directory.FullName
          $safeRoot = Join-Path $env:RUNNER_TEMP "12-6 Windows Україна Path With Spaces"
          New-Item -ItemType Directory -Force -Path $safeRoot | Out-Null
          Copy-Item -LiteralPath (Join-Path $sourceRoot "*") -Destination $safeRoot -Recurse -Force
          "SAFE_ROOT=$safeRoot" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: Verify source, lock profile, hashes, Python, and Unicode path
        shell: pwsh
        working-directory: ${{ runner.temp }}
        run: |
          $ErrorActionPreference = "Stop"
          @'
          import hashlib
          import json
          import os
          import platform
          import sys
          from pathlib import Path

          root = Path(os.environ["SAFE_ROOT"])
          source_sha = os.environ["SOURCE_SHA"]
          if sys.implementation.name != "cpython" or platform.python_version() != "3.11.9":
              raise RuntimeError(f"expected CPython 3.11.9, got {sys.implementation.name} {platform.python_version()}")
          if platform.system() != "Windows" or platform.machine().lower() not in {"amd64", "x86_64"}:
              raise RuntimeError(f"unexpected Windows platform: {platform.system()} {platform.machine()}")
          if " " not in str(root) or not any(ord(ch) > 127 for ch in str(root)):
              raise RuntimeError("safe execution root must contain both spaces and Unicode")

          def sha(path: Path) -> str:
              return hashlib.sha256(path.read_bytes()).hexdigest()

          manifest_path = root / "artifact-manifest.json"
          manifest = json.loads(manifest_path.read_text(encoding="utf-8"))
          claimed = manifest.pop("manifest_sha256")
          actual = hashlib.sha256(
              json.dumps(manifest, sort_keys=True, separators=(",", ":"), ensure_ascii=True).encode()
          ).hexdigest()
          if actual != claimed:
              raise RuntimeError("input artifact manifest self-hash mismatch")
          manifest["manifest_sha256"] = claimed
          if manifest["source_sha"] != source_sha:
              raise RuntimeError("source SHA mismatch")
          if manifest["repository"] != "Oleksii-debug/12-6-ai.":
              raise RuntimeError("physical repository identity mismatch")
          if manifest["physical_repository_trailing_dot_blocker"] is not True:
              raise RuntimeError("trailing-dot repository blocker was not preserved")
          if manifest["windows_repository_checkout_required"] is not False:
              raise RuntimeError("Windows execution must not require repository checkout")
          for relative, record in manifest["files"].items():
              path = root / Path(relative)
              if not path.is_file() or path.stat().st_size != record["size"] or sha(path) != record["sha256"]:
                  raise RuntimeError(f"artifact file integrity mismatch: {relative}")

          profile_path = root / "requirements/locks/windows-x86_64/profile.json"
          if sha(profile_path) != manifest["windows_profile"]["file_sha256"]:
              raise RuntimeError("Windows profile file SHA mismatch")
          profile = json.loads(profile_path.read_text(encoding="utf-8"))
          profile_claimed = profile.pop("manifest_sha256")
          profile_actual = hashlib.sha256(
              json.dumps(profile, sort_keys=True, separators=(",", ":"), ensure_ascii=True).encode()
          ).hexdigest()
          if profile_actual != profile_claimed or profile_claimed != manifest["windows_profile"]["manifest_sha256"]:
              raise RuntimeError("Windows profile semantic hash mismatch")
          if profile["profile_id"] != "windows-x86_64" or profile["python"]["version"] != "3.11.9":
              raise RuntimeError("Windows profile identity/Python mismatch")
          pyproject = root / "source-metadata/pyproject.toml"
          if sha(pyproject) != profile["pyproject_sha256"]:
              raise RuntimeError("Windows profile pyproject binding mismatch")
          for group, record in profile["locks"].items():
              path = root / Path(record["path"])
              if sha(path) != record["sha256"]:
                  raise RuntimeError(f"{group} lock file hash mismatch")
              count = sum(
                  1 for line in path.read_text(encoding="utf-8").splitlines()
                  if line.strip() and not line.strip().startswith("#")
              )
              if count != record["package_count"]:
                  raise RuntimeError(f"{group} lock package-count mismatch")
          print(json.dumps({
              "input_manifest_sha256": claimed,
              "profile_manifest_sha256": profile_claimed,
              "python": platform.python_version(),
              "safe_path_has_spaces": True,
              "safe_path_has_unicode": True,
              "repository_checkout_used": False,
          }, sort_keys=True))
          '@ | python -
          if ($LASTEXITCODE -ne 0) { throw "Windows input verification failed" }
      - name: Install exact runtime offline from artifact wheelhouse
        shell: pwsh
        working-directory: ${{ runner.temp }}
        run: |
          $ErrorActionPreference = "Stop"
          $venvRoot = Join-Path $env:SAFE_ROOT "Виконання Python With Spaces"
          python -m venv $venvRoot
          $py = Join-Path $venvRoot "Scripts\python.exe"
          $profileRoot = Join-Path $env:SAFE_ROOT "requirements\locks\windows-x86_64"
          $toolchainWheels = Join-Path $env:SAFE_ROOT "wheelhouse\toolchain"
          $runtimeWheels = Join-Path $env:SAFE_ROOT "wheelhouse\runtime"
          & $py -m pip install --disable-pip-version-check --no-index --find-links $toolchainWheels `
            --require-hashes --no-deps -r (Join-Path $profileRoot "toolchain.lock.txt")
          if ($LASTEXITCODE -ne 0) { throw "offline toolchain install failed" }
          & $py -m pip install --disable-pip-version-check --no-index --find-links $runtimeWheels `
            --require-hashes --no-deps -r (Join-Path $profileRoot "runtime.lock.txt")
          if ($LASTEXITCODE -ne 0) { throw "offline runtime install failed" }
          $projectWheel = Get-ChildItem -LiteralPath (Join-Path $env:SAFE_ROOT "project") -Filter "twelve_six_ai-*.whl" | Select-Object -First 1
          if ($null -eq $projectWheel) { throw "project wheel missing" }
          & $py -m pip install --disable-pip-version-check --no-index --no-deps $projectWheel.FullName
          if ($LASTEXITCODE -ne 0) { throw "offline project wheel install failed" }
          & $py -m pip check
          if ($LASTEXITCODE -ne 0) { throw "installed Windows runtime failed pip check" }
          "VENV_PYTHON=$py" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "VENV_CLI=$(Join-Path $venvRoot 'Scripts\twelve-six-generate.exe')" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: Verify checkpoint and execute canonical Ukrainian stdin generation
        shell: pwsh
        working-directory: ${{ runner.temp }}
        run: |
          $ErrorActionPreference = "Stop"
          $checkpoint = Join-Path $env:SAFE_ROOT "checkpoint"
          $checkpointEvidence = Join-Path $env:SAFE_ROOT "checkpoint-evidence.json"
          & $env:VENV_PYTHON -m twelve_six.inference.s0_artifact validate `
            --checkpoint $checkpoint --evidence $checkpointEvidence
          if ($LASTEXITCODE -ne 0) { throw "canonical checkpoint verification failed on Windows" }
          @'
          import hashlib
          import importlib.metadata as metadata
          import json
          import os
          import platform
          import subprocess
          from pathlib import Path

          import torch

          root = Path(os.environ["SAFE_ROOT"])
          source_sha = os.environ["SOURCE_SHA"]
          cli = Path(os.environ["VENV_CLI"])
          checkpoint = root / "checkpoint"
          checkpoint_evidence = json.loads((root / "checkpoint-evidence.json").read_text(encoding="utf-8"))
          input_manifest = json.loads((root / "artifact-manifest.json").read_text(encoding="utf-8"))
          expected_versions = {
              "filelock": "3.32.4",
              "fsspec": "2026.7.0",
              "jinja2": "3.1.6",
              "markupsafe": "3.0.3",
              "mpmath": "1.3.0",
              "networkx": "3.6.1",
              "numpy": "2.4.6",
              "safetensors": "0.8.0",
              "setuptools": "84.0.0",
              "sympy": "1.14.0",
              "torch": "2.13.0",
              "typing-extensions": "4.16.0",
              "packaging": "26.3",
              "pip": "26.2.1",
              "wheel": "0.48.0",
              "twelve-six-ai": "0.2.0.dev0",
          }
          installed = {name: metadata.version(name) for name in expected_versions}
          if installed != expected_versions:
              raise RuntimeError(f"installed distribution mismatch: {installed}")
          project_wheel = next((root / "project").glob("twelve_six_ai-*.whl"))
          project_sha = hashlib.sha256(project_wheel.read_bytes()).hexdigest()
          if project_sha != input_manifest["project_wheel"]["sha256"]:
              raise RuntimeError("installed project wheel input SHA mismatch")

          prompt = "Україна — 12-6"
          command = [str(cli), "--checkpoint", str(checkpoint), "--greedy", "--max-new-tokens", "8"]
          plain = subprocess.run(
              command,
              input=prompt,
              capture_output=True,
              text=True,
              encoding="utf-8",
              errors="strict",
              env=os.environ.copy(),
              check=False,
          )
          if plain.returncode != 0:
              raise RuntimeError(f"plain canonical generation failed: {plain.stderr}")
          json_run = subprocess.run(
              [*command, "--json"],
              input=prompt,
              capture_output=True,
              text=True,
              encoding="utf-8",
              errors="strict",
              env=os.environ.copy(),
              check=False,
          )
          if json_run.returncode != 0:
              raise RuntimeError(f"JSON canonical generation failed: {json_run.stderr}")
          payload = json.loads(json_run.stdout)
          if payload["backend"]["backend"] != "first_party_torch":
              raise RuntimeError("Windows generation did not use first-party Torch backend")
          if payload["backend"]["git_sha"] != source_sha:
              raise RuntimeError("Windows backend source identity mismatch")
          if payload["backend"]["checkpoint_id"] != checkpoint_evidence["checkpoint"]["checkpoint_id"]:
              raise RuntimeError("Windows backend checkpoint identity mismatch")
          if list(payload["prompt_token_ids"]) != list(prompt.encode("utf-8")):
              raise RuntimeError("Ukrainian stdin UTF-8 token mapping mismatch")
          if payload["mode"] != "greedy" or not isinstance(payload["text"], str):
              raise RuntimeError("JSON generation diagnostics contract mismatch")

          results = root / "windows-results"
          results.mkdir(exist_ok=True)
          (results / "plain-output.txt").write_text(plain.stdout, encoding="utf-8", newline="")
          (results / "plain-diagnostics.txt").write_text(plain.stderr, encoding="utf-8", newline="")
          (results / "json-output.json").write_text(json_run.stdout, encoding="utf-8", newline="")
          (results / "json-diagnostics.txt").write_text(json_run.stderr, encoding="utf-8", newline="")

          def text_sha(value: str) -> str:
              return hashlib.sha256(value.encode("utf-8")).hexdigest()

          evidence = {
              "schema_version": "12-6.windows-canonical-checkpoint-execution.v1",
              "authority": "FREE_HOSTED_CPU_WINDOWS_RUNTIME_EVIDENCE_NOT_PROMOTION",
              "source_sha": source_sha,
              "repository": "Oleksii-debug/12-6-ai.",
              "physical_repository_checkout": {
                  "status": "BLOCKED_BY_TRAILING_DOT",
                  "repository_checkout_used": False,
                  "artifact_only_safe_path_used": True,
                  "safe_path_has_spaces": " " in str(root),
                  "safe_path_has_unicode": any(ord(ch) > 127 for ch in str(root)),
              },
              "runtime": {
                  "python": platform.python_version(),
                  "system": platform.system(),
                  "machine": platform.machine(),
                  "installed_distributions": installed,
                  "torch_distribution_version": metadata.version("torch"),
                  "torch_runtime_version": torch.__version__,
                  "torch_cuda_available": torch.cuda.is_available(),
                  "offline_install": True,
                  "pip_no_index": True,
                  "require_hashes": True,
                  "project_wheel_sha256": project_sha,
                  "windows_profile_file_sha256": input_manifest["windows_profile"]["file_sha256"],
              },
              "checkpoint": {
                  "validated_on_windows": True,
                  "checkpoint_id": checkpoint_evidence["checkpoint"]["checkpoint_id"],
                  "source_sha": checkpoint_evidence["candidate_sha"],
                  "first_party_backend": payload["backend"]["backend"],
              },
              "generation": {
                  "prompt": prompt,
                  "input_transport": "UTF-8_STDIN_PIPE",
                  "prompt_utf8_sha256": text_sha(prompt),
                  "plain_output_sha256": text_sha(plain.stdout),
                  "plain_diagnostics_sha256": text_sha(plain.stderr),
                  "json_output_sha256": text_sha(json_run.stdout),
                  "json_diagnostics_sha256": text_sha(json_run.stderr),
                  "json_backend": payload["backend"],
                  "mode": payload["mode"],
                  "stop_reason": payload["stop_reason"],
              },
              "accessibility_boundary": {
                  "keyboard_text_interface_suitability": "PASS_PIPE_STDIN_TEXT_STDOUT_NO_TTY_REQUIRED",
                  "manual_nvda_accessibility": "NOT_TESTED_REQUIRES_HUMAN",
              },
              "claims": {
                  "canonical_torch_checkpoint_executed_on_windows": True,
                  "foreign_pretrained_weights_used": False,
                  "instruction_or_chat_behavior_added": False,
                  "promotion_authority": False,
              },
          }
          evidence["evidence_sha256"] = hashlib.sha256(
              json.dumps(evidence, sort_keys=True, separators=(",", ":"), ensure_ascii=True).encode()
          ).hexdigest()
          (results / "windows-canonical-evidence.json").write_text(
              json.dumps(evidence, sort_keys=True, indent=2, ensure_ascii=False) + "\n",
              encoding="utf-8",
              newline="\n",
          )
          print(json.dumps({
              "checkpoint_id": evidence["checkpoint"]["checkpoint_id"],
              "evidence_sha256": evidence["evidence_sha256"],
              "first_party_backend": evidence["checkpoint"]["first_party_backend"],
              "manual_nvda_accessibility": evidence["accessibility_boundary"]["manual_nvda_accessibility"],
          }, sort_keys=True))
          '@ | & $env:VENV_PYTHON -
          if ($LASTEXITCODE -ne 0) { throw "canonical Windows generation evidence failed" }
      - name: Upload canonical Windows execution evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: d08-windows-canonical-runtime-evidence
          path: ${{ env.SAFE_ROOT }}/windows-results
          if-no-files-found: error
          retention-days: 30
