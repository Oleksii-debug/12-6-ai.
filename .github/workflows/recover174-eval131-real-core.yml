name: RECOVER-174 EVAL-131 Real Core

on:
  pull_request:
    branches:
      - eval131/real-corpus-core-20260826
    paths:
      - ".github/workflows/recover174-eval131-real-core.yml"
      - "configs/evaluation/recover174_source_authority_v1.json"
      - "data/evaluation/recover174_real_holdout_seed.jsonl.gz"
      - "src/twelve_six/recover174_real_core.py"
      - "src/twelve_six/real_corpus_evaluation.py"
      - "src/twelve_six/data/real_corpus_holdout.py"
      - "src/twelve_six/milestone150*.py"
      - "src/twelve_six/milestone100_first_learned.py"
      - "src/twelve_six/model/**"
      - "src/twelve_six/training/**"
      - "src/twelve_six/checkpoint/**"
      - "src/twelve_six/tokenization/**"
      - "data/corpus/v0.1/**"
      - "configs/data/corpus_v01.json"
      - "requirements/locks/linux-x86_64/**"
      - "tests/test_recover174_real_core.py"
      - "tests/test_real_corpus_*.py"
      - "tests/test_milestone150*.py"
  workflow_dispatch:

concurrency:
  group: recover174-eval131-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  pull-requests: write

jobs:
  recover174-real-core:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      PYTHONPATH: src
      OMP_NUM_THREADS: "2"
      MKL_NUM_THREADS: "2"
    steps:
      - name: Checkout exact recovery head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up exact Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11.16"

      - name: Bind exact source
        env:
          EXPECTED_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SOURCE_SHA"

      - name: Dependency preflight
        env:
          EXPECTED_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: >-
          python tools/ci_dependency_preflight.py
          --profile linux-x86_64
          --source-sha "$EXPECTED_SOURCE_SHA"
          --output recover174-ci-preflight.json

      - name: Universal hash-locked environment bootstrap
        run: |
          set -euo pipefail
          python -m venv .recover174
          .recover174/bin/python -m pip install \
            --disable-pip-version-check --no-deps --require-hashes \
            -r requirements/locks/linux-x86_64/toolchain.lock.txt
          .recover174/bin/python -m pip install \
            --disable-pip-version-check --no-deps --require-hashes \
            -r requirements/locks/linux-x86_64/runtime.lock.txt
          .recover174/bin/python -m pip install \
            --disable-pip-version-check --no-deps --require-hashes \
            -r requirements/locks/linux-x86_64/dev.lock.txt

      - name: Compile and test authority contracts
        run: |
          set -euo pipefail
          .recover174/bin/python -m compileall -q src/twelve_six
          .recover174/bin/python -m pytest -q \
            tests/test_real_corpus_holdout.py \
            tests/test_real_corpus_evaluation.py \
            tests/test_milestone150_learned_base_ladder.py \
            tests/test_recover174_real_core.py

      - name: Freeze admitted UA EN holdout
        run: |
          set -euo pipefail
          .recover174/bin/python -m twelve_six.recover174_real_core \
            build-holdout \
            --repo-root . \
            --output-dir recover174-evidence/heldout

      - name: Prepare common DATA-25 ladder truth without optimization
        env:
          EXPECTED_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          .recover174/bin/python -m twelve_six.milestone150_entrypoint \
            prepare \
            --repo-root . \
            --source-sha "$EXPECTED_SOURCE_SHA" \
            --output-dir milestone150-evidence

      - name: Prove heldout exclusion before optimizer step zero to one
        run: |
          set -euo pipefail
          .recover174/bin/python -m twelve_six.recover174_real_core \
            prove-exclusion \
            --repo-root . \
            --ladder-output milestone150-evidence \
            --output-dir recover174-evidence
          .recover174/bin/python - <<'PY'
          import json
          from pathlib import Path
          p = json.loads(
              Path("recover174-evidence/pretraining-exclusion.json").read_text(
                  encoding="utf-8"
              )
          )
          assert p["status"] == "PASS_EXCLUDED_BEFORE_MODEL_TRAINING"
          assert p["optimized_tokens_at_proof_time"] == 0
          print(json.dumps(p, ensure_ascii=False, indent=2, sort_keys=True))
          PY

      - name: Execute and freshly verify learned 100K rung
        env:
          EXPECTED_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          for phase in phase1 resume verify-scale; do
            .recover174/bin/python -m twelve_six.milestone150_entrypoint "$phase" \
              --repo-root . --source-sha "$EXPECTED_SOURCE_SHA" \
              --output-dir milestone150-evidence --scale 100k
          done

      - name: Execute and freshly verify learned 500K rung
        env:
          EXPECTED_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          for phase in phase1 resume verify-scale; do
            .recover174/bin/python -m twelve_six.milestone150_entrypoint "$phase" \
              --repo-root . --source-sha "$EXPECTED_SOURCE_SHA" \
              --output-dir milestone150-evidence --scale 500k
          done

      - name: Execute and freshly verify learned 1M rung
        env:
          EXPECTED_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          for phase in phase1 resume verify-scale; do
            .recover174/bin/python -m twelve_six.milestone150_entrypoint "$phase" \
              --repo-root . --source-sha "$EXPECTED_SOURCE_SHA" \
              --output-dir milestone150-evidence --scale 1m
          done

      - name: Assemble machine-readable learned Base ladder
        env:
          EXPECTED_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          .recover174/bin/python -m twelve_six.milestone150_entrypoint \
            finalize \
            --repo-root . --source-sha "$EXPECTED_SOURCE_SHA" \
            --output-dir milestone150-evidence
          .recover174/bin/python -m twelve_six.milestone150_entrypoint \
            validate milestone150-evidence/ladder-report.json \
            --expected-source-sha "$EXPECTED_SOURCE_SHA"

      - name: Evaluate random-init and learned finals on same real UA EN holdout
        env:
          EXPECTED_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          .recover174/bin/python -m twelve_six.recover174_real_core \
            run \
            --repo-root . \
            --source-sha "$EXPECTED_SOURCE_SHA" \
            --ladder-output milestone150-evidence \
            --output-dir recover174-evidence
          .recover174/bin/python -m twelve_six.recover174_real_core \
            validate \
            --output-dir recover174-evidence \
            --expected-source-sha "$EXPECTED_SOURCE_SHA"

      - name: Publish exact-head authority evidence to PR
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          .recover174/bin/python - <<'PY'
          import json
          from pathlib import Path

          real = json.loads(
              Path("recover174-evidence/ladder-report.json").read_text(encoding="utf-8")
          )
          learned = [
              row for row in real["checkpoint_reports"]
              if row["checkpoint"]["kind"] == "LEARNED"
          ]
          learned.sort(key=lambda row: row["checkpoint"]["parameter_count"])
          lines = [
              "### RECOVER-174 exact-head real-corpus held-out evidence",
              "",
              f"- authority: `{real['authority_completeness']['status']}`",
              f"- heldout identity: `{real['comparable_identity']['heldout_identity_sha256']}`",
              f"- DATA-25 training corpus: `{real['comparable_identity']['training_corpus_identity_sha256']}`",
              f"- DATA-31 report: `{real['comparable_identity']['decontamination_report_sha256']}`",
              "- admitted real modalities: `ua`, `en`",
              "- code: `BLOCKED_NO_EVALUATION_USE_AUTHORITY`",
              f"- report SHA-256: `{real['report_sha256']}`",
              "",
              "| learned checkpoint | params | optimized tokens | aggregate BPB | UA BPB | EN BPB | zero token delta |",
              "|---|---:|---:|---:|---:|---:|---|",
          ]
          for row in learned:
              cp = row["checkpoint"]
              metrics = row["metrics"]
              lines.append(
                  f"| {cp['label']} | {cp['parameter_count']} | "
                  f"{cp['optimized_tokens_at_checkpoint']} | "
                  f"{metrics['aggregate']['point']['bits_per_source_byte']:.6f} | "
                  f"{metrics['by_modality']['ua']['point']['bits_per_source_byte']:.6f} | "
                  f"{metrics['by_modality']['en']['point']['bits_per_source_byte']:.6f} | "
                  f"{row['non_mutation']['optimized_tokens_delta'] == 0} |"
              )
          lines += [
              "",
              "Boundary: these are first-party held-out quality numbers only for the exact admitted UA/EN snapshots. Code remains blocked. DATA-31 is consumed at its registered-exclusions boundary; no universal semantic-cleanliness claim is made. No train-loss quality authority, foreign pretrained weights, SFT, RLHF, DPO, paid compute, intelligence, production-readiness, alignment, or instruction-following claim is made.",
          ]
          Path("recover174-evidence/pr-comment.md").write_text(
              "\n".join(lines) + "\n", encoding="utf-8"
          )
          PY
          gh pr comment "$PR_NUMBER" --repo "$GH_REPO" \
            --body-file recover174-evidence/pr-comment.md

      - name: Upload convergence and real-corpus evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: recover174-eval131-real-core
          path: |
            recover174-ci-preflight.json
            recover174-evidence/
            milestone150-evidence/ladder-truth.json
            milestone150-evidence/ladder-report.json
            milestone150-evidence/corpus-manifest.json
            milestone150-evidence/100k/report.json
            milestone150-evidence/500k/report.json
            milestone150-evidence/1m/report.json
          if-no-files-found: error
          retention-days: 30
