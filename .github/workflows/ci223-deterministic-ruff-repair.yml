name: CI-223 Deterministic Ruff Repair

on:
  push:
    branches: [ci223/repository-release-gate-convergence-v2-20260826]

permissions:
  contents: write

concurrency:
  group: ci223-v2-ruff-repair
  cancel-in-progress: false

jobs:
  repair:
    if: ${{ !contains(github.event.head_commit.message, 'CI-223 apply deterministic Ruff repairs') }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ci223/repository-release-gate-convergence-v2-20260826
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.11.16"
      - uses: ./.github/actions/execution-bootstrap
        with:
          capabilities: runtime,tests,lint
          venv: .ci223-repair
          command: python -m pytest -q tests/test_execution_bootstrap.py
          manifest: ci223-repair-environment.json
      - name: Apply deterministic Ruff repairs
        run: |
          set -euo pipefail
          .ci223-repair/bin/python -m ruff check --fix --unsafe-fixes src tests tools
          .ci223-repair/bin/python -m ruff check src tests tools
          git diff --check
      - name: Prove convergence-sensitive contracts
        run: |
          set -euo pipefail
          .ci223-repair/bin/python -m pytest -q \
            tests/test_execution_bootstrap.py \
            tests/test_ci161_failure_classification.py \
            tests/test_ci165_launch_gate.py \
            tests/test_training_precision_runtime.py
      - name: Persist only tested repairs
        run: |
          set -euo pipefail
          if git diff --quiet -- src tests tools; then
            echo "No Ruff repair delta remains."
            exit 0
          fi
          git config user.name "CI-223 Repository Release Gate"
          git config user.email "ci223@users.noreply.github.com"
          git add src tests tools
          git commit -m "CI-223 apply deterministic Ruff repairs"
          git push origin HEAD:ci223/repository-release-gate-convergence-v2-20260826
