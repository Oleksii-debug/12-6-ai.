name: D03 current balance plus terminal Rada family

on:
  pull_request:
    branches:
      - execution/2816-lesia-postqp-balance-g8-162-20261006
    paths:
      - ".github/workflows/d03_current_balance_rada_family.yml"
      - "tools/run_d03_current_balance_rada_family_v1.py"

permissions:
  actions: read
  contents: read

concurrency:
  group: d03-current-balance-rada-family-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  execute-canonical-balance:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.head_ref == 'execution/2875-rada-family-balance-g6-153-20261006'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      EXECUTION_HEAD: ${{ github.event.pull_request.head.sha }}
      GITHUB_TOKEN: ${{ github.token }}

      BASE_HEAD: 06bfeb25c3620e0f610d28dae47f8f34a1c1bbff
      BASE_ARTIFACT_ID: "11406357309"
      BASE_ARTIFACT_NAME: d03-current-balance-lesia-postqp-06bfeb25c3620e0f610d28dae47f8f34a1c1bbff
      BASE_ARTIFACT_SHA256: a5856dd559bb78f6cd71064f6076a21edb00f8a2dbad34e92ada3e24eb1a4f06
      BASE_COMPOSITION_FILE_SHA256: 9dd70b448fd1e3cfcc1d98cf97ab27991d81803e64c50e0dfd533d3f36b64586
      BASE_NEXT100_FILE_SHA256: d5e6086710b04c4cd93bab4a256848e4da19803dcc3e7257307a67ff9754285a
      BASE_RECEIPT_FILE_SHA256: 3da83b2ddf9c47acd932005363131ae37223320dc5259ecb6c279b953e537dbb

      RADA_HEAD: a63d7c88ccb5fa380b7af4b44bde32433cf35877
      RADA_ARTIFACT_ID: "11419746210"
      RADA_ARTIFACT_NAME: d03-rada-g05-g06-a63d7c88ccb5fa380b7af4b44bde32433cf35877
      RADA_ARTIFACT_SHA256: b314d4e8359a146c8979282945f81bc7fdbe8f55c4eba36beaa7c6f4dada065a
      RADA_EVIDENCE_FILE_SHA256: 3a3ef8cd501fe30d5d0f0fa311c9483826646b4158fc77fabd55d9a08f263cbd
      RADA_INVENTORY_FILE_SHA256: b67e361f0029ae68d695374dacdb1773e64447c04b443759528e398020554fb5
      RADA_PROOF_FILE_SHA256: a6b150acc8063a6e5a1ddd00378952bbaf3b08621a1febd939d81fd177f68247
      RADA_EVIDENCE_ID: 8bf576920ade8ca864bc3a00a41888f05c1e16a191a5dd8aec3b95ce903a4163
      RADA_PROOF_ID: d716a9650ebfce142737188ec447834357e3881227fec43fcc38304964bac635

      RUNNER_BLOB: c6384991332dc95b76c8e61f2ac02b1b05d3cef7
      PARENT_RUNNER_BLOB: 37bc658af4a11fac478fc535a4bcf1c40eef20f6
      GATE_BLOB: ae4f9ccdc3cfe3e053dd57d46f80aebe121268c5
      POLICY_BLOB: b5a2577aeb1a2e56ebff1a4b46ac325d99dd8f8f

    steps:
      - name: Checkout exact execution head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.EXECUTION_HEAD }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set exact CPython
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11.16"

      - name: Bind exact parent-relative execution closure
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXECUTION_HEAD"
          test "$(git merge-base "$BASE_HEAD" HEAD)" = "$BASE_HEAD"
          mapfile -t changed < <(git diff --name-only "$BASE_HEAD"..HEAD | sort)
          expected=(
            ".github/workflows/d03_current_balance_rada_family.yml"
            "tools/run_d03_current_balance_rada_family_v1.py"
          )
          mapfile -t wanted < <(printf '%s\n' "${expected[@]}" | sort)
          test "${#changed[@]}" -eq "${#wanted[@]}"
          for i in "${!wanted[@]}"; do
            test "${changed[$i]}" = "${wanted[$i]}"
          done
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          python -m py_compile             tools/run_d03_current_balance_rada_family_v1.py             tools/run_d03_current_balance_lesia_postqp_v1.py             tools/next100_106_balance_gate.py
          test "$(git hash-object tools/run_d03_current_balance_rada_family_v1.py)" = "$RUNNER_BLOB"
          test "$(git hash-object tools/run_d03_current_balance_lesia_postqp_v1.py)" = "$PARENT_RUNNER_BLOB"
          test "$(git hash-object tools/next100_106_balance_gate.py)" = "$GATE_BLOB"
          test "$(git hash-object configs/data/next100_106_balance_gate_policy_v1.json)" = "$POLICY_BLOB"
          PYTHONPATH=. python tools/next100_106_balance_gate.py validate-policy

      - name: Fetch exact qualified artifacts
        shell: bash
        run: |
          set -euo pipefail
          fetch_artifact() {
            kind="$1"
            artifact_id="$2"
            expected_name="$3"
            expected_digest="$4"
            expected_head="$5"
            curl --fail --silent --show-error --retry 5 --retry-all-errors               -H "Authorization: Bearer $GITHUB_TOKEN"               -H "Accept: application/vnd.github+json"               -H "X-GitHub-Api-Version: 2022-11-28"               "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${artifact_id}"               -o "$RUNNER_TEMP/${kind}-metadata.json"
            KIND="$kind" EXPECTED_NAME="$expected_name" EXPECTED_DIGEST="$expected_digest"               EXPECTED_HEAD="$expected_head" python - <<'PY'
          import json
          import os
          from pathlib import Path

          meta = json.loads(
              (Path(os.environ["RUNNER_TEMP"]) / f'{os.environ["KIND"]}-metadata.json')
              .read_text(encoding="utf-8")
          )
          if meta.get("name") != os.environ["EXPECTED_NAME"]:
              raise SystemExit("artifact name drift")
          if meta.get("expired") is not False:
              raise SystemExit("artifact expired")
          if meta.get("digest") != "sha256:" + os.environ["EXPECTED_DIGEST"]:
              raise SystemExit("artifact digest drift")
          workflow = meta.get("workflow_run")
          if not isinstance(workflow, dict) or workflow.get("head_sha") != os.environ["EXPECTED_HEAD"]:
              raise SystemExit("artifact workflow head drift")
          PY
            curl --fail --silent --show-error --location --retry 5 --retry-all-errors               -H "Authorization: Bearer $GITHUB_TOKEN"               -H "Accept: application/vnd.github+json"               -H "X-GitHub-Api-Version: 2022-11-28"               "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${artifact_id}/zip"               -o "$RUNNER_TEMP/${kind}.zip"
            test "$(sha256sum "$RUNNER_TEMP/${kind}.zip" | cut -d' ' -f1)" = "$expected_digest"
          }
          fetch_artifact base "$BASE_ARTIFACT_ID" "$BASE_ARTIFACT_NAME" "$BASE_ARTIFACT_SHA256" "$BASE_HEAD"
          fetch_artifact rada "$RADA_ARTIFACT_ID" "$RADA_ARTIFACT_NAME" "$RADA_ARTIFACT_SHA256" "$RADA_HEAD"

      - name: Extract allowlisted text-free authorities
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/inputs"
          python - <<'PY'
          import hashlib
          import json
          import os
          import stat
          import zipfile
          from pathlib import Path

          tmp = Path(os.environ["RUNNER_TEMP"])
          out = tmp / "inputs"
          specs = {
              "base": {
                  "expected": {
                      "combined-dedup-proof.json",
                      "composition.json",
                      "next100-input.json",
                      "balance-result.json",
                      "execution-receipt.json",
                  },
                  "wanted": {
                      "composition.json": ("base-composition.json", os.environ["BASE_COMPOSITION_FILE_SHA256"]),
                      "next100-input.json": ("base-next100.json", os.environ["BASE_NEXT100_FILE_SHA256"]),
                      "execution-receipt.json": ("base-receipt.json", os.environ["BASE_RECEIPT_FILE_SHA256"]),
                  },
              },
              "rada": {
                  "expected": {
                      "pass-a/post-g05-g06-evidence.json",
                      "pass-a/g05-authority.json",
                      "pass-a/g06-authority.json",
                      "pass-a/survivor-inventory.json",
                      "two-clean-proof.json",
                  },
                  "wanted": {
                      "pass-a/post-g05-g06-evidence.json": ("rada-evidence.json", os.environ["RADA_EVIDENCE_FILE_SHA256"]),
                      "pass-a/survivor-inventory.json": ("rada-inventory.json", os.environ["RADA_INVENTORY_FILE_SHA256"]),
                      "two-clean-proof.json": ("rada-proof.json", os.environ["RADA_PROOF_FILE_SHA256"]),
                  },
              },
          }
          for kind, spec in specs.items():
              with zipfile.ZipFile(tmp / f"{kind}.zip") as bundle:
                  infos = bundle.infolist()
                  names = [info.filename for info in infos]
                  if len(names) != len(set(names)) or set(names) != spec["expected"]:
                      raise SystemExit(f"{kind}: artifact member allowlist drift")
                  by_name = {}
                  for info in infos:
                      path = Path(info.filename)
                      mode = (info.external_attr >> 16) & 0o170000
                      if (
                          info.is_dir()
                          or "\\" in info.filename
                          or info.filename.startswith("/")
                          or ".." in path.parts
                          or mode == stat.S_IFLNK
                      ):
                          raise SystemExit(f"{kind}: unsafe artifact member")
                      by_name[info.filename] = info
                  for source, (dest, digest) in spec["wanted"].items():
                      raw = bundle.read(by_name[source])
                      if hashlib.sha256(raw).hexdigest() != digest:
                          raise SystemExit(f"{kind}: member digest drift")
                      (out / dest).write_bytes(raw)

          def strict_object(pairs):
              value = {}
              for key, child in pairs:
                  if key in value:
                      raise ValueError(f"duplicate JSON key: {key}")
                  value[key] = child
              return value

          proof = json.loads(
              (out / "rada-proof.json").read_text(encoding="utf-8"),
              object_pairs_hook=strict_object,
          )
          core = dict(proof)
          claimed = core.pop("proof_identity_sha256", None)
          canonical = json.dumps(
              core, ensure_ascii=False, sort_keys=True, separators=(",", ":"), allow_nan=False
          ).encode("utf-8")
          if claimed != os.environ["RADA_PROOF_ID"] or hashlib.sha256(canonical).hexdigest() != claimed:
              raise SystemExit("Rada proof identity drift")
          if proof.get("execution_head_sha") != os.environ["RADA_HEAD"]:
              raise SystemExit("Rada proof head drift")
          if proof.get("evidence_identity_sha256") != os.environ["RADA_EVIDENCE_ID"]:
              raise SystemExit("Rada proof evidence binding drift")
          if proof.get("fresh_execution_count") != 2 or proof.get("independent_runner_jobs") is not True:
              raise SystemExit("Rada proof is not independent two-clean")
          PY

      - name: Reject mutated Rada survivor inventory
        shell: bash
        run: |
          set -euo pipefail
          cp "$RUNNER_TEMP/inputs/rada-inventory.json" "$RUNNER_TEMP/mutated-rada-inventory.json"
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          path = Path(os.environ["RUNNER_TEMP"]) / "mutated-rada-inventory.json"
          value = json.loads(path.read_text(encoding="utf-8"))
          target = next(
              row for row in value["records"]
              if row["family"] == "ua.rada.open-data.laws-texts"
          )
          target["payload_bytes"] += 1
          path.write_text(
              json.dumps(value, ensure_ascii=False, sort_keys=True, separators=(",", ":"), allow_nan=False) + "\n",
              encoding="utf-8",
          )
          PY
          if PYTHONPATH=. python tools/run_d03_current_balance_rada_family_v1.py             --base-composition-json "$RUNNER_TEMP/inputs/base-composition.json"             --base-next100-json "$RUNNER_TEMP/inputs/base-next100.json"             --base-receipt-json "$RUNNER_TEMP/inputs/base-receipt.json"             --rada-evidence-json "$RUNNER_TEMP/inputs/rada-evidence.json"             --rada-inventory-json "$RUNNER_TEMP/mutated-rada-inventory.json"             --rada-proof-json "$RUNNER_TEMP/inputs/rada-proof.json"             --execution-head "$EXECUTION_HEAD"             --output-dir "$RUNNER_TEMP/mutated-output"; then
            echo "mutated Rada inventory was accepted" >&2
            exit 1
          fi
          test ! -e "$RUNNER_TEMP/mutated-output"

      - name: Execute exact Rada-family union twice
        shell: bash
        run: |
          set -euo pipefail
          for suffix in a b; do
            out="$RUNNER_TEMP/output-${suffix}"
            rm -rf "$out"
            PYTHONPATH=. python tools/run_d03_current_balance_rada_family_v1.py               --base-composition-json "$RUNNER_TEMP/inputs/base-composition.json"               --base-next100-json "$RUNNER_TEMP/inputs/base-next100.json"               --base-receipt-json "$RUNNER_TEMP/inputs/base-receipt.json"               --rada-evidence-json "$RUNNER_TEMP/inputs/rada-evidence.json"               --rada-inventory-json "$RUNNER_TEMP/inputs/rada-inventory.json"               --rada-proof-json "$RUNNER_TEMP/inputs/rada-proof.json"               --execution-head "$EXECUTION_HEAD"               --output-dir "$out"
          done
          for name in combined-dedup-proof composition next100-input balance-result execution-receipt; do
            cmp "$RUNNER_TEMP/output-a/${name}.json" "$RUNNER_TEMP/output-b/${name}.json"
          done

      - name: Qualify exact result and zero-credit boundary
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          root = Path(os.environ["RUNNER_TEMP"]) / "output-a"
          names = {"combined-dedup-proof", "composition", "next100-input", "balance-result", "execution-receipt"}
          docs = {
              name: json.loads((root / f"{name}.json").read_text(encoding="utf-8"))
              for name in names
          }
          receipt = docs["execution-receipt"]
          proof = docs["combined-dedup-proof"]
          composition = docs["composition"]
          vector = docs["next100-input"]
          balance = docs["balance-result"]

          expected = {
              "execution_head_sha": os.environ["EXECUTION_HEAD"],
              "selected_rada_records": 97496,
              "selected_rada_source_objects": 97496,
              "selected_rada_payload_bytes": 185158183,
              "excluded_non_rada_records": 241,
              "excluded_non_rada_payload_bytes": 5428378,
              "combined_record_count": 100352,
              "combined_source_object_count": 100271,
              "combined_total_payload_bytes": 205979137,
              "raw_capacity_by_stratum": {"ua": 186414542, "en": 15481867, "code": 4082728},
              "maximum_feasible_total_source_bytes": 6281700,
              "maximum_feasible_stratum_bytes": {"ua": 2826765, "en": 2198595, "code": 1256340},
              "remaining_policy_mix_shortfall_bytes": 13718300,
              "raw_gap_to_target_by_stratum": {"ua": 0, "en": 0, "code": 0},
              "balance_status": "PARTIAL_MIX_FEASIBLE_ACQUIRE_MORE_DATA",
              "next_scientific_gate": "ACQUIRE_MORE_DIVERSE_LAWFUL_UA_SOURCE_CAPACITY",
              "canonical_capacity_credited": 0,
              "training_authorized_bytes": 0,
              "authorized_unique_loss_positions": 0,
              "authorized_optimized_target_exposure": 0,
              "tokenizer_fit_authorized": False,
              "model_training_authorized": False,
              "optimizer_updates_executed_on_real_targets": 0,
              "training_executed": False,
              "learned_weights_created": False,
              "final_test_outcomes_read": False,
              "paid_compute_used": False,
              "scale_promotion_authorized": False,
          }
          for field, wanted in expected.items():
              observed = receipt.get(field)
              if type(observed) is not type(wanted) or observed != wanted:
                  raise SystemExit(f"receipt drift: {field}: {observed!r}")

          proof_expected = {
              "terminal_verdict": "PASS",
              "full_rada_vs_base_record_id_overlap": 240,
              "full_rada_vs_base_source_id_overlap": 241,
              "full_rada_vs_base_exact_payload_overlap": 234,
              "full_rada_vs_base_record_id_conflicts": 6,
              "full_rada_vs_base_source_id_conflicts": 7,
              "selected_rada_record_id_collision_free": True,
              "selected_rada_source_id_collision_free": True,
              "selected_rada_exact_payload_collision_free": True,
          }
          for field, wanted in proof_expected.items():
              if proof.get(field) != wanted:
                  raise SystemExit(f"proof drift: {field}")

          rada_family = [
              row for row in vector["families"]
              if row["family_id"] == "ua.rada.open-data.laws-texts"
          ]
          if rada_family != [{
              "family_id": "ua.rada.open-data.laws-texts",
              "stratum": "ua",
              "unique_bytes": 185158183,
          }]:
              raise SystemExit("Rada family capacity drift")
          if vector["totals"] != {
              "total_unique_bytes": 205979137,
              "by_stratum": {"ua": 186414542, "en": 15481867, "code": 4082728},
              "family_count": {"ua": 5, "en": 7, "code": 18},
          }:
              raise SystemExit("combined vector totals drift")
          if balance.get("maximum_feasible_total_source_bytes") != 6281700:
              raise SystemExit("balance maximum drift")

          inventory = composition["combined_inventory"]
          rows = inventory["records"]
          if len(rows) != 100352 or len({r["record_id"] for r in rows}) != 100352:
              raise SystemExit("combined record uniqueness drift")
          if len({r["source_id"] for r in rows}) != 100271:
              raise SystemExit("combined source uniqueness drift")
          if len({r["payload_sha256"] for r in rows}) != 100352:
              raise SystemExit("combined payload uniqueness drift")
          if sum(r["payload_bytes"] for r in rows) != 205979137:
              raise SystemExit("combined payload sum drift")

          canonical = lambda value: json.dumps(
              value, ensure_ascii=False, sort_keys=True, separators=(",", ":"), allow_nan=False
          ).encode("utf-8")
          payload_projection = [
              {
                  "record_id": row["record_id"],
                  "payload_sha256": row["payload_sha256"],
                  "payload_bytes": row["payload_bytes"],
              }
              for row in rows
          ]
          if hashlib.sha256(canonical(rows)).hexdigest() != inventory["record_inventory_digest_sha256"]:
              raise SystemExit("combined record inventory root drift")
          if hashlib.sha256(canonical(payload_projection)).hexdigest() != inventory["payload_inventory_digest_sha256"]:
              raise SystemExit("combined payload inventory root drift")

          self_hashes = {
              "combined-dedup-proof": "evidence_identity_sha256",
              "composition": "composition_identity_sha256",
              "balance-result": "result_identity_sha256",
              "execution-receipt": "receipt_identity_sha256",
          }
          for name, identity_field in self_hashes.items():
              value = dict(docs[name])
              claimed = value.pop(identity_field)
              if hashlib.sha256(canonical(value)).hexdigest() != claimed:
                  raise SystemExit(f"{name}: self-hash mismatch")

          forbidden = {"text", "raw_text", "content", "payload", "training_text", "evaluation_payload"}
          def walk(value):
              if isinstance(value, dict):
                  overlap = forbidden & set(value)
                  if overlap:
                      raise SystemExit("raw-content key persisted: " + ",".join(sorted(overlap)))
                  for child in value.values():
                      walk(child)
              elif isinstance(value, list):
                  for child in value:
                      walk(child)
          for value in docs.values():
              walk(value)

          print("D03_RADA_FAMILY_CURRENT_BALANCE_QUALIFIED")
          print(json.dumps(receipt, sort_keys=True))
          PY

      - name: Upload text-free Rada-family composed balance evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: d03-current-balance-rada-family-${{ env.EXECUTION_HEAD }}
          path: |
            ${{ runner.temp }}/output-a/combined-dedup-proof.json
            ${{ runner.temp }}/output-a/composition.json
            ${{ runner.temp }}/output-a/next100-input.json
            ${{ runner.temp }}/output-a/balance-result.json
            ${{ runner.temp }}/output-a/execution-receipt.json
          if-no-files-found: error
          retention-days: 90
