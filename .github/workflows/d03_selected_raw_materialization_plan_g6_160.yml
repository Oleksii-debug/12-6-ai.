name: D03 selected raw materialization plan G6 160

on:
  pull_request:
    branches:
      - repair/2583-record-realization-bitset-g6-160-20261006
    paths:
      - ".github/workflows/d03_selected_raw_materialization_plan_g6_160.yml"
      - "tools/run_d03_selected_raw_materialization_plan_v1.py"

permissions:
  actions: read
  contents: read

concurrency:
  group: d03-selected-raw-plan-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  plan-selected-raw:
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.head_ref == 'execution/3063-selected-raw-plan-g6-160-20261006'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      EXECUTION_HEAD: ${{ github.event.pull_request.head.sha }}
      PRODUCT_HEAD: "efadbdac0c03e7c020501652f5624b96f289ec2e"
      SELECTOR_BLOB: "79eed6a6d3b941e89132f072593db1c74bd1d90d"
      RUNNER_BLOB: "5a24c137d6368538f170cdd6c8fdf8709a43f7c0"
      BALANCE_ARTIFACT_ID: "11441000276"
      BALANCE_ZIP_SHA256: "85ae6ace4914cd8fae86cef71b8ac63cf73c97b1386ff7e01a716692ddce6c10"
      COMPOSITION_FILE_SHA256: "8a737ca830d0e98095b258c31bb1fc6f5e0c294384484b3f266dad654522850e"
      BALANCE_FILE_SHA256: "655eee7aa4fd0aeb7d124405a420a7148efb0474951f9843e0476bc4f05b56d4"
      BASE_ARTIFACT_ID: "11181030848"
      BASE_ZIP_SHA256: "3eef740b52e9db962b01b63a0a48474f735694dca4c3848e3e9c53d8cd7f1988"
      BASE_RAW_SHA256: "3aa6235e07da4fa50c9642639cc0d93d7da22a6b602d822c7c7ca6e1f4a7486a"
      EXPECTED_PLAN_ID: "ddf42773bb7ac4856e07c7b8e22b137581f02b79e231f0740b12e867c0981400"
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Checkout exact execution head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set exact CPython
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11.16"

      - name: Bind exact Product child and execution-only scope
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXECUTION_HEAD"
          test "$(git merge-base "$PRODUCT_HEAD" HEAD)" = "$PRODUCT_HEAD"
          mapfile -t changed < <(git diff --name-only "$PRODUCT_HEAD"..HEAD | sort)
          test "${#changed[@]}" -eq 2
          test "${changed[0]}" = ".github/workflows/d03_selected_raw_materialization_plan_g6_160.yml"
          test "${changed[1]}" = "tools/run_d03_selected_raw_materialization_plan_v1.py"
          test "$(git hash-object src/twelve_six/data/current_clean_balanced_selection_v1.py)" = "$SELECTOR_BLOB"
          test "$(git hash-object tools/run_d03_selected_raw_materialization_plan_v1.py)" = "$RUNNER_BLOB"
          python -m py_compile             src/twelve_six/data/current_clean_balanced_selection_v1.py             tools/run_d03_selected_raw_materialization_plan_v1.py
          python -m pip install --disable-pip-version-check "ruff>=0.12"
          ruff check             src/twelve_six/data/current_clean_balanced_selection_v1.py             tools/run_d03_selected_raw_materialization_plan_v1.py

      - name: Fetch exact qualified balance authority
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/balance"
          mkdir -p "$root"
          curl --fail --location --retry 5 --retry-all-errors             -H "Authorization: Bearer $GH_TOKEN"             -H "Accept: application/vnd.github+json"             -H "X-GitHub-Api-Version: 2022-11-28"             -o "$root/artifact.zip"             "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/actions/artifacts/${BALANCE_ARTIFACT_ID}/zip"
          test "$(sha256sum "$root/artifact.zip" | cut -d' ' -f1)" = "$BALANCE_ZIP_SHA256"
          zipinfo -1 "$root/artifact.zip" | sort > "$root/members.txt"
          cat > "$root/expected.txt" <<'EOF'
          balance-result.json
          combined-dedup-proof.json
          composition.json
          execution-receipt.json
          next100-input.json
          EOF
          sort -o "$root/expected.txt" "$root/expected.txt"
          cmp "$root/expected.txt" "$root/members.txt"
          unzip -p "$root/artifact.zip" composition.json > "$root/composition.json"
          unzip -p "$root/artifact.zip" balance-result.json > "$root/balance-result.json"
          test "$(sha256sum "$root/composition.json" | cut -d' ' -f1)" = "$COMPOSITION_FILE_SHA256"
          test "$(sha256sum "$root/balance-result.json" | cut -d' ' -f1)" = "$BALANCE_FILE_SHA256"

      - name: Fetch exact retained base raw authority
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/base"
          mkdir -p "$root"
          curl --fail --location --retry 5 --retry-all-errors             -H "Authorization: Bearer $GH_TOKEN"             -H "Accept: application/vnd.github+json"             -H "X-GitHub-Api-Version: 2022-11-28"             -o "$root/artifact.zip"             "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/actions/artifacts/${BASE_ARTIFACT_ID}/zip"
          test "$(sha256sum "$root/artifact.zip" | cut -d' ' -f1)" = "$BASE_ZIP_SHA256"
          zipinfo -1 "$root/artifact.zip" | sort > "$root/members.txt"
          cat > "$root/expected.txt" <<'EOF'
          composition_receipt.json
          data232_report.json
          decontamination_execution.json
          eval647_execution_receipt.json
          privacy_execution.json
          quality_execution.json
          repeat_proof.json
          survivor_inventory.json
          survivor_records.jsonl
          EOF
          sort -o "$root/expected.txt" "$root/expected.txt"
          cmp "$root/expected.txt" "$root/members.txt"
          unzip -p "$root/artifact.zip" survivor_records.jsonl > "$root/survivor_records.jsonl"
          test "$(sha256sum "$root/survivor_records.jsonl" | cut -d' ' -f1)" = "$BASE_RAW_SHA256"

      - name: Execute exact materialization planning twice
        shell: bash
        run: |
          set -euo pipefail
          for pass_id in 1 2; do
            PYTHONPATH="$GITHUB_WORKSPACE/src"               python tools/run_d03_selected_raw_materialization_plan_v1.py                 --composition-json "$RUNNER_TEMP/balance/composition.json"                 --balance-result-json "$RUNNER_TEMP/balance/balance-result.json"                 --base-raw-jsonl "$RUNNER_TEMP/base/survivor_records.jsonl"                 --output "$RUNNER_TEMP/plan-${pass_id}.json"
          done
          cmp "$RUNNER_TEMP/plan-1.json" "$RUNNER_TEMP/plan-2.json"

      - name: Require raw payload mutation rejection
        shell: bash
        run: |
          set -euo pipefail
          python - "$RUNNER_TEMP/base/survivor_records.jsonl" "$RUNNER_TEMP/mutated.jsonl" <<'PY'
          import json
          import sys
          from pathlib import Path

          rows = Path(sys.argv[1]).read_text(encoding="utf-8").splitlines()
          first = json.loads(rows[0])
          first["normalized_payload"] += " "
          rows[0] = json.dumps(first, ensure_ascii=False, sort_keys=True, separators=(",", ":"))
          Path(sys.argv[2]).write_text("\n".join(rows) + "\n", encoding="utf-8")
          PY
          if PYTHONPATH="$GITHUB_WORKSPACE/src"             python tools/run_d03_selected_raw_materialization_plan_v1.py               --composition-json "$RUNNER_TEMP/balance/composition.json"               --balance-result-json "$RUNNER_TEMP/balance/balance-result.json"               --base-raw-jsonl "$RUNNER_TEMP/mutated.jsonl"               --output "$RUNNER_TEMP/mutated-plan.json"; then
            echo "mutated raw authority unexpectedly accepted" >&2
            exit 1
          fi
          test ! -e "$RUNNER_TEMP/mutated-plan.json"

      - name: Independently qualify text-free plan
        shell: bash
        run: |
          set -euo pipefail
          python - "$RUNNER_TEMP/plan-1.json" <<'PY'
          import hashlib
          import json
          import os
          import sys
          from pathlib import Path

          value = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          claimed = value["plan_identity_sha256"]
          core = dict(value)
          del core["plan_identity_sha256"]
          raw = json.dumps(
              core,
              ensure_ascii=False,
              sort_keys=True,
              separators=(",", ":"),
              allow_nan=False,
          ).encode("utf-8")
          assert hashlib.sha256(raw).hexdigest() == claimed
          assert claimed == os.environ["EXPECTED_PLAN_ID"]
          assert value["selected_record_count"] == 5294
          assert value["selected_source_bytes"] == 20_000_000
          assert value["base_raw_authority"]["selected_record_count"] == 211
          assert value["base_raw_authority"]["selected_payload_bytes"] == 3_582_998
          assert value["missing_record_count"] == 5083
          assert value["missing_payload_bytes"] == 16_417_002
          assert value["missing_family_count"] == 14
          assert sum(
              item["missing_record_count"]
              for item in value["family_materialization_plan"]
          ) == 5083
          assert sum(
              item["missing_payload_bytes"]
              for item in value["family_materialization_plan"]
          ) == 16_417_002
          assert value["selected_membership_sha256"] == "a00572acfb1033f7bfe55e7e1f53ae9eb44b6fa039f3f378a156bec6fd13615f"
          assert value["selected_payload_projection_sha256"] == "9bcfc6eb09418c93a00373df6d4c4cf3e5795d54e12c0e4bc106eaecbc89de82"
          forbidden = {
              "normalized_payload",
              "text",
              "raw_text",
              "content",
              "payload_text",
              "training_text",
              "evaluation_payload",
          }
          def walk(item):
              if isinstance(item, dict):
                  assert not (forbidden & set(item))
                  for child in item.values():
                      walk(child)
              elif isinstance(item, list):
                  for child in item:
                      walk(child)
          walk(value)
          zero = {
              "canonical_capacity_credited": 0,
              "training_authorized_bytes": 0,
              "authorized_unique_loss_positions": 0,
              "authorized_optimized_target_exposure": 0,
              "optimizer_updates_executed_on_real_targets": 0,
              "tokenizer_fit_authorized": False,
              "training_executed": False,
              "learned_weights_created": False,
              "final_test_outcomes_read": False,
              "paid_compute_used": False,
              "scale_promotion_authorized": False,
          }
          for key, expected in zero.items():
              assert value[key] == expected
          print("D03_SELECTED_RAW_PLAN_VERIFIED")
          print(claimed)
          PY

      - name: Remove raw inputs before publication
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$RUNNER_TEMP/base" "$RUNNER_TEMP/balance"
          rm -f "$RUNNER_TEMP/mutated.jsonl" "$RUNNER_TEMP/plan-2.json"
          test ! -e "$RUNNER_TEMP/base"
          test -s "$RUNNER_TEMP/plan-1.json"

      - name: Upload text-free selected raw plan
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: d03-selected-raw-plan-${{ github.event.pull_request.head.sha }}
          path: ${{ runner.temp }}/plan-1.json
          if-no-files-found: error
          retention-days: 90
