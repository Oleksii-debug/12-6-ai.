name: Plan 7 Section 6 local-free systems gate
on:
  pull_request:
    paths:
      - 'src/twelve_six/billion_systems_gate.py'
      - 'tests/test_plan7_billion_systems_gate.py'
      - 'docs/PLAN7_SECTION6_BILLION_SYSTEMS_GATE.md'
      - '.github/workflows/plan7-billion-systems-gate.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  plan7-s6-cpu:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e '.[dev]'
      - run: python -m ruff check src/twelve_six/billion_systems_gate.py tests/test_plan7_billion_systems_gate.py
      - run: python -m pytest -q tests/test_plan7_optional_risk_probes.py tests/test_plan7_product_scale_recipes.py tests/test_plan7_billion_systems_gate.py
