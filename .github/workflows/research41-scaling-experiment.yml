name: RESEARCH06 Fixed-Token Scaling and MODEL10 GQA 1M

on:
  pull_request:
    paths:
      - "src/twelve_six/scaling_experiment.py"
      - "src/twelve_six/fixed_token_experiment.py"
      - "configs/experiments/research06_fixed_token_scaling_v1.json"
      - "configs/experiments/model10_1m_mha_gqa_v1.json"
      - "tests/test_scaling_experiment.py"
      - "tests/test_fixed_token_experiment.py"
      - ".github/workflows/research41-scaling-experiment.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  strict-fixed-token-cpu:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Prove exact source checkout
        run: test "$(git rev-parse HEAD)" = "$SOURCE_SHA"

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11.16"

      - name: Verify exact locked environment inputs
        run: >-
          python tools/verify_locked_environment.py
          --profile linux-x86_64
          --source-sha "$SOURCE_SHA"
          --evidence-out research06-locked-environment.json

      - name: Create locked LOCAL_FREE execution environment
        run: |
          python -m venv .research06-locked
          .research06-locked/bin/python -m pip install --disable-pip-version-check --require-hashes --no-deps -r requirements/locks/linux-x86_64/toolchain.lock.txt
          .research06-locked/bin/python -m pip install --disable-pip-version-check --require-hashes --no-deps -r requirements/locks/linux-x86_64/runtime.lock.txt
          .research06-locked/bin/python -m pip install --disable-pip-version-check --require-hashes --no-deps -r requirements/locks/linux-x86_64/dev.lock.txt
          PIP_NO_INDEX=1 PIP_DISABLE_PIP_VERSION_CHECK=1 .research06-locked/bin/python -m pip install --no-deps --no-build-isolation -e .

      - name: Validate strict token accounting and matched GQA geometry
        run: >-
          .research06-locked/bin/python -m pytest -q
          tests/test_scaling_experiment.py
          tests/test_fixed_token_experiment.py

      - name: Execute fixed-token matrix with exact checkpoint resume
        run: |
          .research06-locked/bin/python -m twelve_six.fixed_token_experiment run \
            --repo-root . \
            --source-sha "$SOURCE_SHA" \
            --output-dir research06-evidence \
            --report research06-fixed-token-gqa-report.json \
            --torch-threads 2
          .research06-locked/bin/python -m twelve_six.fixed_token_experiment validate \
            research06-fixed-token-gqa-report.json \
            --expected-source-sha "$SOURCE_SHA"

      - name: Print measured decision matrix
        run: |
          .research06-locked/bin/python - <<'PY'
          import json
          report = json.load(open("research06-fixed-token-gqa-report.json", encoding="utf-8"))
          print(json.dumps({
              "source": report["source"],
              "candidate_summaries": report["candidate_summaries"],
              "rankings": report["rankings"],
              "primary_small_model_recommendation": report["primary_small_model_recommendation"],
              "model10_1m_attention": report["model10_1m_attention"],
              "report_sha256": report["report_sha256"],
          }, indent=2, sort_keys=True))
          PY

      - name: Upload exact-head retained evidence and resume checkpoints
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: research06-model10-fixed-token-${{ env.SOURCE_SHA }}
          path: |
            research06-locked-environment.json
            research06-fixed-token-gqa-report.json
            research06-evidence/**
          if-no-files-found: error
          retention-days: 30
