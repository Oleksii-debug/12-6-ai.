name: RESEARCH41 Controlled Scaling Experiment

on:
  pull_request:

permissions:
  contents: read

jobs:
  controlled-scaling-cpu:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Prove exact source checkout
        env:
          SOURCE_SHA: ${{ github.event.pull_request.head.sha }}
        run: test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11.16"
      - name: Verify exact locked environment inputs
        env:
          SOURCE_SHA: ${{ github.event.pull_request.head.sha }}
        run: >-
          python tools/verify_locked_environment.py
          --profile linux-x86_64
          --source-sha "$SOURCE_SHA"
          --evidence-out research41-locked-environment.json
      - name: Create locked LOCAL_FREE execution environment
        run: |
          python -m venv .research41-locked
          .research41-locked/bin/python -m pip install --disable-pip-version-check --require-hashes --no-deps -r requirements/locks/linux-x86_64/toolchain.lock.txt
          .research41-locked/bin/python -m pip install --disable-pip-version-check --require-hashes --no-deps -r requirements/locks/linux-x86_64/runtime.lock.txt
          PIP_NO_INDEX=1 PIP_DISABLE_PIP_VERSION_CHECK=1 .research41-locked/bin/python -m pip install --no-deps --no-build-isolation -e .
      - name: Execute 4-model x 3-token controlled sweep
        env:
          SOURCE_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          .research41-locked/bin/python -m twelve_six.scaling_experiment run \
            --repo-root . \
            --source-sha "$SOURCE_SHA" \
            --output research41-scaling-results.json \
            --torch-threads 2
          .research41-locked/bin/python -m twelve_six.scaling_experiment validate \
            research41-scaling-results.json \
            --expected-source-sha "$SOURCE_SHA"
          .research41-locked/bin/python - <<'PY'
          import json
          report = json.load(open("research41-scaling-results.json", encoding="utf-8"))
          print(json.dumps({
              "source": report["source"],
              "fit": report["fit"],
              "decision_signals": report["decision_signals"],
              "report_sha256": report["report_sha256"],
          }, indent=2, sort_keys=True))
          PY
      - name: Upload machine-readable scaling evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: research41-scaling-evidence
          path: |
            research41-locked-environment.json
            research41-scaling-results.json
          if-no-files-found: error
          retention-days: 30
