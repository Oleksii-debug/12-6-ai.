name: RESEARCH41 Learned-Base Scaling Experiment

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  learned-base-scaling-cpu:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Prove exact source checkout
        env:
          SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$SOURCE_SHA"

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11.16"

      - name: Verify canonical locked environment inputs
        env:
          SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: >-
          python tools/verify_locked_environment.py
          --profile linux-x86_64
          --source-sha "$SOURCE_SHA"
          --evidence-out research41-locked-environment.json

      - name: Create locked LOCAL_FREE runtime plus exact tokenizer overlay
        run: |
          python -m venv .research41-locked
          .research41-locked/bin/python -m pip install \
            --disable-pip-version-check --require-hashes --no-deps \
            -r requirements/locks/linux-x86_64/toolchain.lock.txt
          .research41-locked/bin/python -m pip install \
            --disable-pip-version-check --require-hashes --no-deps \
            -r requirements/locks/linux-x86_64/runtime.lock.txt
          .research41-locked/bin/python -m pip install \
            --disable-pip-version-check --require-hashes --no-deps --only-binary=:all: \
            -r requirements/experiments/tokenizers-linux-x86_64.lock.txt

      - name: Run focused learned-scaling control tests
        env:
          PYTHONPATH: src:.
        run: .research41-locked/bin/python -m pytest -q tests/test_scaling_experiment.py tests/test_research41_learned_scaling.py

      - name: Execute resumable 4-model learned-base matrix
        env:
          SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          PYTHONPATH: src:.
        run: |
          .research41-locked/bin/python tools/research41_learned_scaling.py run \
            --repo-root . \
            --source-sha "$SOURCE_SHA" \
            --work-dir research41-work \
            --output research41-scaling-results.json \
            --threads 2
          .research41-locked/bin/python tools/research41_learned_scaling.py validate \
            research41-scaling-results.json \
            --source-sha "$SOURCE_SHA"
          .research41-locked/bin/python - <<'PY'
          import json
          report = json.load(open("research41-scaling-results.json", encoding="utf-8"))
          print(json.dumps({
              "parameters": report["matrices"]["parameters"],
              "requested_token_budgets": report["matrices"]["requested_token_budgets"],
              "train_loss": report["matrices"]["train_loss"],
              "validation_loss": report["matrices"]["validation_loss"],
              "validation_bpb": report["matrices"]["validation_bpb"],
              "cost_by_model": report["cost_by_model"],
              "best_validation_improvement_per_compute": report["efficiency"]["best_validation_improvement_per_compute"],
              "fresh_process_resume": report["fresh_process_resume"],
              "fit": report["fit"],
              "report_sha256": report["report_sha256"],
          }, indent=2, sort_keys=True))
          PY

      - name: Upload partial resumability state
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: research41-cell-evidence
          path: |
            research41-work/cells/*/progress.json
            research41-work/cells/*/cell-report.json
          if-no-files-found: warn
          retention-days: 30

      - name: Upload machine-readable scaling evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: research41-scaling-evidence
          path: |
            research41-locked-environment.json
            research41-scaling-results.json
            configs/data/multilingual_uk_en_code_v1.experimental.json
            requirements/experiments/tokenizers-linux-x86_64.lock.txt
          if-no-files-found: error
          retention-days: 30
