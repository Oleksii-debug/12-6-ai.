name: CI-161 Failure Classification

on:
  pull_request:
    branches:
      - milestone150/learned-base-ladder-v1-20260826
  workflow_dispatch:

permissions:
  contents: read

jobs:
  failure-taxonomy:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PYTHONPATH: src
    steps:
      - name: Checkout exact CI-161 head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up exact Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11.16"

      - name: Bind exact source
        env:
          EXPECTED_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SOURCE_SHA"
          mkdir -p ci161-evidence

      - name: Prove classifier works before ML bootstrap
        env:
          EXPECTED_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          python -S tools/run_classified_phase.py \
            --phase bootstrap \
            --report ci161-evidence/pre-bootstrap-smoke.json \
            --source-sha "$EXPECTED_SOURCE_SHA" \
            --workflow "$GITHUB_WORKFLOW" \
            --run-id "$GITHUB_RUN_ID" \
            -- python -S -c 'print("ci161-stdlib-bootstrap-ok")'

      - name: Install mandatory exact locked runtime and dev layer
        env:
          EXPECTED_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          python tools/run_classified_phase.py \
            --phase bootstrap \
            --report ci161-evidence/bootstrap-install.json \
            --source-sha "$EXPECTED_SOURCE_SHA" \
            --workflow "$GITHUB_WORKFLOW" \
            --run-id "$GITHUB_RUN_ID" \
            -- bash -lc '
              set -euo pipefail
              python -m venv .ci161
              .ci161/bin/python -m pip install --disable-pip-version-check --no-deps --require-hashes -r requirements/locks/linux-x86_64/toolchain.lock.txt
              .ci161/bin/python -m pip install --disable-pip-version-check --no-deps --require-hashes -r requirements/locks/linux-x86_64/runtime.lock.txt
              .ci161/bin/python -m pip install --disable-pip-version-check --no-deps --require-hashes -r requirements/locks/linux-x86_64/dev.lock.txt
            '

      - name: Static-check CI-161 implementation
        env:
          EXPECTED_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          .ci161/bin/python tools/run_classified_phase.py \
            --phase static_check \
            --report ci161-evidence/static-check.json \
            --source-sha "$EXPECTED_SOURCE_SHA" \
            --workflow "$GITHUB_WORKFLOW" \
            --run-id "$GITHUB_RUN_ID" \
            -- .ci161/bin/python -m compileall -q \
              src/twelve_six/experiment_failure.py \
              tools/run_classified_phase.py \
              tools/build_ci161_historical_report.py \
              tests/test_ci161_failure_classification.py
          .ci161/bin/python -m ruff check \
            src/twelve_six/experiment_failure.py \
            tools/run_classified_phase.py \
            tools/build_ci161_historical_report.py \
            tests/test_ci161_failure_classification.py

      - name: Run focused failure-classification tests
        env:
          EXPECTED_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          .ci161/bin/python tools/run_classified_phase.py \
            --phase focused_test \
            --report ci161-evidence/focused-tests.json \
            --source-sha "$EXPECTED_SOURCE_SHA" \
            --workflow "$GITHUB_WORKFLOW" \
            --run-id "$GITHUB_RUN_ID" \
            --required-module pytest \
            -- .ci161/bin/python -m pytest -q tests/test_ci161_failure_classification.py

      - name: Rebuild and validate historical classifications
        env:
          EXPECTED_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          .ci161/bin/python tools/run_classified_phase.py \
            --phase finalize \
            --report ci161-evidence/historical-build.json \
            --source-sha "$EXPECTED_SOURCE_SHA" \
            --workflow "$GITHUB_WORKFLOW" \
            --run-id "$GITHUB_RUN_ID" \
            -- .ci161/bin/python tools/build_ci161_historical_report.py \
              --output ci161-evidence/historical_failure_sample.json
          cmp reports/ci161/historical_failure_sample.json ci161-evidence/historical_failure_sample.json
          .ci161/bin/python - <<'PY'
          import json
          from pathlib import Path
          from twelve_six.experiment_failure import validate_report

          retained = json.loads(
              Path("ci161-evidence/historical_failure_sample.json").read_text(encoding="utf-8")
          )
          for case in retained["cases"]:
              validate_report(case)
          by_workflow = {case["source"]["workflow"]: case for case in retained["cases"]}
          assert by_workflow["MILESTONE-100 First Learned ~1M Base"]["failure_class"] == "BOOTSTRAP_DEPENDENCY_MISSING"
          assert by_workflow["SCALE-141 10M Learned Continuation"]["failure_class"] == "BOOTSTRAP_DEPENDENCY_MISSING"
          assert all(case["experiment_started"] is False for case in retained["cases"])
          PY

      - name: Upload CI-161 machine reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ci161-failure-classification
          path: ci161-evidence/
          if-no-files-found: warn
          retention-days: 14
