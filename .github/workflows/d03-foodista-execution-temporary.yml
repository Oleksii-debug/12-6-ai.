name: TEMP D03 Foodista real execution

on:
  push:
    branches:
      - d03/foodista-bounded-1168

permissions:
  contents: write

jobs:
  execute-two-clean-acquisitions:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Execute exact immutable source twice
        id: execute
        shell: bash
        run: |
          set +e
          mkdir -p "$RUNNER_TEMP/foodista-a" "$RUNNER_TEMP/foodista-b" evidence
          python tools/materialize_d03_common_pile_foodista_v1.py \
            --shard "$RUNNER_TEMP/foodista-a/source.jsonl.gz" \
            --output-jsonl "$RUNNER_TEMP/foodista-a/candidate.jsonl" \
            --report "$RUNNER_TEMP/foodista-a/report.json" \
            --download \
            >"$RUNNER_TEMP/foodista-a/stdout.json" \
            2>"$RUNNER_TEMP/foodista-a/stderr.txt"
          A_STATUS=$?
          python tools/materialize_d03_common_pile_foodista_v1.py \
            --shard "$RUNNER_TEMP/foodista-b/source.jsonl.gz" \
            --output-jsonl "$RUNNER_TEMP/foodista-b/candidate.jsonl" \
            --report "$RUNNER_TEMP/foodista-b/report.json" \
            --download \
            >"$RUNNER_TEMP/foodista-b/stdout.json" \
            2>"$RUNNER_TEMP/foodista-b/stderr.txt"
          B_STATUS=$?
          export A_STATUS B_STATUS
          python - <<'PY'
          import hashlib
          import json
          import os
          import platform
          from pathlib import Path

          temp = Path(os.environ["RUNNER_TEMP"])
          expected_sha = "286b801bc826f161efad892af5529b201f91f42c5a932e3962d74d24037fe087"
          expected_bytes = 6_760_466

          def identity(path: Path):
              if not path.exists():
                  return {"exists": False, "bytes": 0, "sha256": None}
              raw = path.read_bytes()
              return {
                  "exists": True,
                  "bytes": len(raw),
                  "sha256": hashlib.sha256(raw).hexdigest(),
              }

          def load_report(path: Path):
              if not path.exists():
                  return None
              return json.loads(path.read_text(encoding="utf-8"))

          a = temp / "foodista-a"
          b = temp / "foodista-b"
          source_a = identity(a / "source.jsonl.gz")
          source_b = identity(b / "source.jsonl.gz")
          candidate_a = identity(a / "candidate.jsonl")
          candidate_b = identity(b / "candidate.jsonl")
          report_file_a = identity(a / "report.json")
          report_file_b = identity(b / "report.json")
          report_a = load_report(a / "report.json")
          report_b = load_report(b / "report.json")
          a_status = int(os.environ["A_STATUS"])
          b_status = int(os.environ["B_STATUS"])
          source_identity_ok = (
              source_a["sha256"] == expected_sha
              and source_b["sha256"] == expected_sha
              and source_a["bytes"] == expected_bytes
              and source_b["bytes"] == expected_bytes
          )
          source_byte_identical = source_a == source_b and source_a["exists"]
          candidate_byte_identical = candidate_a == candidate_b and candidate_a["exists"]
          report_byte_identical = report_file_a == report_file_b and report_file_a["exists"]
          report_truth_ok = bool(
              report_a
              and report_b
              and report_a.get("training_authorized_bytes") == 0
              and report_a.get("training_eligible") is False
              and report_a.get("evaluation_eligible") is False
              and report_a.get("optimizer_updates") == 0
              and report_a.get("final_test_accessed") is False
              and report_a.get("paid_compute_used") is False
              and report_a.get("retained_records", 0) > 0
              and report_a == report_b
          )
          success = bool(
              a_status == 0
              and b_status == 0
              and source_identity_ok
              and source_byte_identical
              and candidate_byte_identical
              and report_byte_identical
              and report_truth_ok
          )
          evidence = {
              "schema_version": "12-6.d03-common-pile-foodista-real-execution.v1",
              "status": (
                  "SUCCESS_TWO_CLEAN_REAL_ACQUISITIONS"
                  if success
                  else "BLOCKED_OR_FAILED_REAL_EXECUTION"
              ),
              "claim_issue": 1168,
              "pr": 1174,
              "executed_product_head": os.environ["GITHUB_SHA"],
              "github_run_id": int(os.environ["GITHUB_RUN_ID"]),
              "github_run_attempt": int(os.environ["GITHUB_RUN_ATTEMPT"]),
              "execution_profile": "LOCAL_FREE_GITHUB_HOSTED_PUBLIC_REPO",
              "runner_os": os.environ.get("RUNNER_OS"),
              "python_version": platform.python_version(),
              "source_revision": "04d1b7a6562c6d6459426d2a3b88184b8a98f7b6",
              "source_file": "v0/documents/00000_foodista.jsonl.gz",
              "expected_source_sha256": expected_sha,
              "expected_source_bytes": expected_bytes,
              "acquisition_a_exit": a_status,
              "acquisition_b_exit": b_status,
              "source_a": source_a,
              "source_b": source_b,
              "source_identity_ok": source_identity_ok,
              "source_byte_identical": source_byte_identical,
              "candidate_a": candidate_a,
              "candidate_b": candidate_b,
              "candidate_byte_identical": candidate_byte_identical,
              "report_file_a": report_file_a,
              "report_file_b": report_file_b,
              "report_byte_identical": report_byte_identical,
              "report_truth_ok": report_truth_ok,
              "retained_records": report_a.get("retained_records", 0) if report_a else 0,
              "retained_normalized_bytes": (
                  report_a.get("retained_normalized_bytes", 0) if report_a else 0
              ),
              "scanned_records": report_a.get("scanned_records", 0) if report_a else 0,
              "selection_reasons": report_a.get("selection_reasons", {}) if report_a else {},
              "candidate_payload_sha256": (
                  report_a.get("candidate_payload_sha256") if report_a else None
              ),
              "real_data_executed": success,
              "training_executed": False,
              "learned_weights_created": False,
              "training_authorized_bytes": 0,
              "authorized_optimized_target_exposure": 0,
              "final_test_accessed": False,
              "paid_compute_used": False,
              "foreign_pretrained_weights": False,
              "stderr_a": (a / "stderr.txt").read_text(encoding="utf-8")[-1000:],
              "stderr_b": (b / "stderr.txt").read_text(encoding="utf-8")[-1000:],
          }
          Path("evidence/d03_common_pile_foodista_real_execution_v1.json").write_text(
              json.dumps(evidence, sort_keys=True, indent=2) + "\n",
              encoding="utf-8",
          )
          Path(os.environ["GITHUB_OUTPUT"]).open("a", encoding="utf-8").write(
              f"success={'true' if success else 'false'}\n"
          )
          print(json.dumps(evidence, sort_keys=True))
          PY
      - name: Retain text-free evidence and remove temporary workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add evidence/d03_common_pile_foodista_real_execution_v1.json
          git rm .github/workflows/d03-foodista-execution-temporary.yml
          git commit -m "[foodista-evidence] D03: retain real execution evidence and remove temporary workflow"
          git push origin HEAD:d03/foodista-bounded-1168
      - name: Require scientific execution success
        if: steps.execute.outputs.success != 'true'
        run: exit 1
