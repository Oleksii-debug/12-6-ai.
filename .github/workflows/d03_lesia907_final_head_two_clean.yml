name: D03 Lesia 1892 final-head two-clean physical execution

on:
  pull_request:
    branches:
      - d03/wikisource-lesia1892-current-main-20260907
    paths:
      - ".github/workflows/d03_lesia907_final_head_two_clean.yml"

permissions:
  contents: read

concurrency:
  group: d03-lesia907-final-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  acquire-a:
    name: independent acquisition A
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.head_ref == 'execution/d03-lesia907-final-head-two-clean-g8-138-20261005'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    outputs:
      candidate_sha256: ${{ steps.evidence.outputs.candidate_sha256 }}
      report_sha256: ${{ steps.evidence.outputs.report_sha256 }}
      inventory_sha256: ${{ steps.evidence.outputs.inventory_sha256 }}
      disposition_inventory_sha256: ${{ steps.evidence.outputs.disposition_inventory_sha256 }}
      rejected_page_count: ${{ steps.evidence.outputs.rejected_page_count }}
      page_count: ${{ steps.evidence.outputs.page_count }}
      normalized_utf8_bytes: ${{ steps.evidence.outputs.normalized_utf8_bytes }}

    steps:
      - name: Checkout exact child head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Set exact CPython
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11.16"

      - name: Bind unchanged final PR907 Product bytes
        shell: bash
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          test "$(git hash-object configs/data/d03_wikisource_lesia1892_current_main_v1.json)" = "82007262267450039875ba3e54822cf12da521a7"
          test "$(git hash-object src/twelve_six/data/wikisource_pd_api.py)" = "a64029493bf54aaeb2d1d13bf1b26421708e0501"
          test "$(git hash-object src/twelve_six/data/wikisource_pd_contract.py)" = "d7dead27e30b2716c77e05adbddf0c0638177ad3"
          test "$(git hash-object src/twelve_six/data/wikisource_pd_edition.py)" = "cdc4d5e004ee93d2f2c8a414d4f43b19ca8f6ea2"
          test "$(git hash-object tools/materialize_d03_wikisource_lesia1892.py)" = "7478e450fc106969fefda86b7dddb75692f9b88e"
          python -m py_compile             src/twelve_six/data/wikisource_pd_api.py             src/twelve_six/data/wikisource_pd_contract.py             src/twelve_six/data/wikisource_pd_edition.py             tools/materialize_d03_wikisource_lesia1892.py

      - name: Materialize pinned edition from official Wikisource
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/lesia-a"
          PYTHONPATH=src python tools/materialize_d03_wikisource_lesia1892.py             --candidate-out "$RUNNER_TEMP/lesia-a/candidate.jsonl"             --report-out "$RUNNER_TEMP/lesia-a/report.json"             --max-pages 112

      - name: Emit text-free cryptographic evidence
        id: evidence
        shell: bash
        run: |
          set -euo pipefail
          python - "$RUNNER_TEMP/lesia-a" <<'PY'
          import hashlib
          import json
          import os
          import sys
          from pathlib import Path

          root = Path(sys.argv[1])
          candidate_path = root / "candidate.jsonl"
          report_path = root / "report.json"
          report = json.loads(report_path.read_text(encoding="utf-8"))
          candidate_sha = hashlib.sha256(candidate_path.read_bytes()).hexdigest()
          inventory = report["candidate"]["inventory"]
          inventory_bytes = json.dumps(
              inventory,
              ensure_ascii=False,
              sort_keys=True,
              separators=(",", ":"),
              allow_nan=False,
          ).encode("utf-8")
          inventory_sha = hashlib.sha256(inventory_bytes).hexdigest()
          source = report["source_authority"]
          disposition = report["disposition"]
          truth = report["truth_boundary"]
          assert source["incumbent_next100022_authority_sha256"] == (
              "6b443faa7fef777214022028d5fdb356dae0ab1a9b71822b4e16bea8f92cd0d6"
          )
          assert source["index_revision_id"] == 729499
          assert source["source_family_id"] == (
              "ua.literature.lesia-ukrainka.na-krylah-pisen.1892-lviv"
          )
          assert source["family_credit_added"] is False
          assert disposition["accepted_page_count"] == report["candidate"]["page_count"]
          assert disposition["observed_page_count"] == (
              disposition["accepted_page_count"] + disposition["rejected_page_count"]
          )
          assert disposition["rejected_page_count"] == len(
              disposition["rejected_inventory"]
          )
          assert truth["canonical_capacity_credit_bytes"] == 0
          assert truth["training_authorized_bytes"] == 0
          assert truth["authorized_unique_loss_positions"] == 0
          assert truth["tokenizer_fit_authorized"] is False
          assert truth["optimizer_updates"] == 0
          assert truth["model_training_executed"] is False
          assert truth["final_test_outcomes_read"] is False
          assert truth["paid_compute_used"] is False

          def assert_text_free(value):
              if isinstance(value, dict):
                  assert "text" not in value
                  for child in value.values():
                      assert_text_free(child)
              elif isinstance(value, list):
                  for child in value:
                      assert_text_free(child)

          assert_text_free(report)
          fields = {
              "candidate_sha256": candidate_sha,
              "report_sha256": report["report_sha256"],
              "inventory_sha256": inventory_sha,
              "disposition_inventory_sha256": (
                  disposition["accepted_and_rejected_inventory_sha256"]
              ),
              "rejected_page_count": str(disposition["rejected_page_count"]),
              "page_count": str(report["candidate"]["page_count"]),
              "normalized_utf8_bytes": str(report["candidate"]["normalized_utf8_bytes"]),
          }
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as handle:
              for key, value in fields.items():
                  handle.write(f"{key}={value}\n")
          print("TEXT_FREE_LESIA_A " + json.dumps(fields, sort_keys=True))
          PY

      - name: Remove raw candidate after hashing
        shell: bash
        run: rm -f "$RUNNER_TEMP/lesia-a/candidate.jsonl"

      - name: Upload text-free A report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: d03-lesia907-final-a-${{ github.event.pull_request.head.sha }}
          path: ${{ runner.temp }}/lesia-a/report.json
          if-no-files-found: error
          retention-days: 90

  acquire-b:
    name: independent acquisition B
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.head_ref == 'execution/d03-lesia907-final-head-two-clean-g8-138-20261005'
    needs: acquire-a
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    outputs:
      candidate_sha256: ${{ steps.evidence.outputs.candidate_sha256 }}
      report_sha256: ${{ steps.evidence.outputs.report_sha256 }}
      inventory_sha256: ${{ steps.evidence.outputs.inventory_sha256 }}
      disposition_inventory_sha256: ${{ steps.evidence.outputs.disposition_inventory_sha256 }}
      rejected_page_count: ${{ steps.evidence.outputs.rejected_page_count }}
      page_count: ${{ steps.evidence.outputs.page_count }}
      normalized_utf8_bytes: ${{ steps.evidence.outputs.normalized_utf8_bytes }}

    steps:
      - name: Checkout exact child head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Set exact CPython
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11.16"

      - name: Bind unchanged final PR907 Product bytes
        shell: bash
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          test "$(git hash-object configs/data/d03_wikisource_lesia1892_current_main_v1.json)" = "82007262267450039875ba3e54822cf12da521a7"
          test "$(git hash-object src/twelve_six/data/wikisource_pd_api.py)" = "a64029493bf54aaeb2d1d13bf1b26421708e0501"
          test "$(git hash-object src/twelve_six/data/wikisource_pd_contract.py)" = "d7dead27e30b2716c77e05adbddf0c0638177ad3"
          test "$(git hash-object src/twelve_six/data/wikisource_pd_edition.py)" = "cdc4d5e004ee93d2f2c8a414d4f43b19ca8f6ea2"
          test "$(git hash-object tools/materialize_d03_wikisource_lesia1892.py)" = "7478e450fc106969fefda86b7dddb75692f9b88e"

      - name: Materialize pinned edition from official Wikisource
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/lesia-b"
          PYTHONPATH=src python tools/materialize_d03_wikisource_lesia1892.py             --candidate-out "$RUNNER_TEMP/lesia-b/candidate.jsonl"             --report-out "$RUNNER_TEMP/lesia-b/report.json"             --max-pages 112

      - name: Emit text-free cryptographic evidence
        id: evidence
        shell: bash
        run: |
          set -euo pipefail
          python - "$RUNNER_TEMP/lesia-b" <<'PY'
          import hashlib
          import json
          import os
          import sys
          from pathlib import Path

          root = Path(sys.argv[1])
          candidate_path = root / "candidate.jsonl"
          report_path = root / "report.json"
          report = json.loads(report_path.read_text(encoding="utf-8"))
          candidate_sha = hashlib.sha256(candidate_path.read_bytes()).hexdigest()
          inventory = report["candidate"]["inventory"]
          inventory_bytes = json.dumps(
              inventory,
              ensure_ascii=False,
              sort_keys=True,
              separators=(",", ":"),
              allow_nan=False,
          ).encode("utf-8")
          inventory_sha = hashlib.sha256(inventory_bytes).hexdigest()
          source = report["source_authority"]
          disposition = report["disposition"]
          truth = report["truth_boundary"]
          assert source["incumbent_next100022_authority_sha256"] == (
              "6b443faa7fef777214022028d5fdb356dae0ab1a9b71822b4e16bea8f92cd0d6"
          )
          assert source["index_revision_id"] == 729499
          assert source["source_family_id"] == (
              "ua.literature.lesia-ukrainka.na-krylah-pisen.1892-lviv"
          )
          assert source["family_credit_added"] is False
          assert disposition["accepted_page_count"] == report["candidate"]["page_count"]
          assert disposition["observed_page_count"] == (
              disposition["accepted_page_count"] + disposition["rejected_page_count"]
          )
          assert disposition["rejected_page_count"] == len(
              disposition["rejected_inventory"]
          )
          assert truth["canonical_capacity_credit_bytes"] == 0
          assert truth["training_authorized_bytes"] == 0
          assert truth["authorized_unique_loss_positions"] == 0
          assert truth["tokenizer_fit_authorized"] is False
          assert truth["optimizer_updates"] == 0
          assert truth["model_training_executed"] is False
          assert truth["final_test_outcomes_read"] is False
          assert truth["paid_compute_used"] is False

          def assert_text_free(value):
              if isinstance(value, dict):
                  assert "text" not in value
                  for child in value.values():
                      assert_text_free(child)
              elif isinstance(value, list):
                  for child in value:
                      assert_text_free(child)

          assert_text_free(report)
          fields = {
              "candidate_sha256": candidate_sha,
              "report_sha256": report["report_sha256"],
              "inventory_sha256": inventory_sha,
              "disposition_inventory_sha256": (
                  disposition["accepted_and_rejected_inventory_sha256"]
              ),
              "rejected_page_count": str(disposition["rejected_page_count"]),
              "page_count": str(report["candidate"]["page_count"]),
              "normalized_utf8_bytes": str(report["candidate"]["normalized_utf8_bytes"]),
          }
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as handle:
              for key, value in fields.items():
                  handle.write(f"{key}={value}\n")
          print("TEXT_FREE_LESIA_B " + json.dumps(fields, sort_keys=True))
          PY

      - name: Remove raw candidate after hashing
        shell: bash
        run: rm -f "$RUNNER_TEMP/lesia-b/candidate.jsonl"

      - name: Upload text-free B report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: d03-lesia907-final-b-${{ github.event.pull_request.head.sha }}
          path: ${{ runner.temp }}/lesia-b/report.json
          if-no-files-found: error
          retention-days: 90

  compare-independent-acquisitions:
    name: compare independent acquisitions
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.head_ref == 'execution/d03-lesia907-final-head-two-clean-g8-138-20261005'
    needs: [acquire-a, acquire-b]
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:
      - name: Require deterministic two-clean evidence
        shell: bash
        env:
          EXECUTION_SHA: ${{ github.event.pull_request.head.sha }}
          A_CANDIDATE: ${{ needs.acquire-a.outputs.candidate_sha256 }}
          B_CANDIDATE: ${{ needs.acquire-b.outputs.candidate_sha256 }}
          A_REPORT: ${{ needs.acquire-a.outputs.report_sha256 }}
          B_REPORT: ${{ needs.acquire-b.outputs.report_sha256 }}
          A_INVENTORY: ${{ needs.acquire-a.outputs.inventory_sha256 }}
          B_INVENTORY: ${{ needs.acquire-b.outputs.inventory_sha256 }}
          A_DISPOSITION: ${{ needs.acquire-a.outputs.disposition_inventory_sha256 }}
          B_DISPOSITION: ${{ needs.acquire-b.outputs.disposition_inventory_sha256 }}
          A_REJECTED: ${{ needs.acquire-a.outputs.rejected_page_count }}
          B_REJECTED: ${{ needs.acquire-b.outputs.rejected_page_count }}
          A_PAGES: ${{ needs.acquire-a.outputs.page_count }}
          B_PAGES: ${{ needs.acquire-b.outputs.page_count }}
          A_BYTES: ${{ needs.acquire-a.outputs.normalized_utf8_bytes }}
          B_BYTES: ${{ needs.acquire-b.outputs.normalized_utf8_bytes }}
        run: |
          set -euo pipefail
          test -n "$A_CANDIDATE" && test "$A_CANDIDATE" = "$B_CANDIDATE"
          test -n "$A_REPORT" && test "$A_REPORT" = "$B_REPORT"
          test -n "$A_INVENTORY" && test "$A_INVENTORY" = "$B_INVENTORY"
          test -n "$A_DISPOSITION" && test "$A_DISPOSITION" = "$B_DISPOSITION"
          test -n "$A_REJECTED" && test "$A_REJECTED" = "$B_REJECTED"
          test -n "$A_PAGES" && test "$A_PAGES" = "$B_PAGES"
          test -n "$A_BYTES" && test "$A_BYTES" = "$B_BYTES"
          python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          proof = {
              "schema_version": "12-6.d03-lesia907-final-head-two-clean.v1",
              "execution_head_sha": os.environ["EXECUTION_SHA"],
              "parent_product_head_sha": "dc3f849a3ed1cfaf069336032dc5cab01f4688cf",
              "candidate_sha256": os.environ["A_CANDIDATE"],
              "report_sha256": os.environ["A_REPORT"],
              "inventory_sha256": os.environ["A_INVENTORY"],
              "disposition_inventory_sha256": os.environ["A_DISPOSITION"],
              "rejected_page_count": int(os.environ["A_REJECTED"]),
              "page_count": int(os.environ["A_PAGES"]),
              "normalized_utf8_bytes": int(os.environ["A_BYTES"]),
              "two_fresh_physical_executions_converged": True,
              "canonical_capacity_credit_bytes": 0,
              "training_authorized_bytes": 0,
              "authorized_optimized_target_exposure": 0,
              "tokenizer_fit_authorized": False,
              "optimizer_updates": 0,
              "model_training_executed": False,
              "learned_weights_created": False,
              "final_test_outcomes_read": False,
              "paid_compute_used": False,
          }
          canonical = json.dumps(
              proof, sort_keys=True, separators=(",", ":"), allow_nan=False
          ).encode("utf-8")
          proof["proof_identity_sha256"] = hashlib.sha256(canonical).hexdigest()
          Path("d03-lesia907-final-head-two-clean-proof.json").write_text(
              json.dumps(proof, sort_keys=True, separators=(",", ":")) + "\n",
              encoding="utf-8",
          )
          print(json.dumps(proof, sort_keys=True))
          PY

      - name: Upload final text-free proof
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: d03-lesia907-final-two-clean-${{ github.event.pull_request.head.sha }}
          path: d03-lesia907-final-head-two-clean-proof.json
          if-no-files-found: error
          retention-days: 90
