name: Plan 7 Section 8 local-free very-large multi-node path
on:
  pull_request:
    paths:
      - 'src/twelve_six/very_large_scale_paths.py'
      - 'tests/test_plan7_very_large_scale_paths.py'
      - '.github/workflows/plan7-very-large-paths.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  plan7-s8-fixture:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e '.[dev]'
      - run: python -m ruff check src/twelve_six/very_large_scale_paths.py tests/test_plan7_very_large_scale_paths.py
      - run: python -m pytest -q tests/test_plan7_large_scale_paths.py tests/test_plan7_very_large_scale_paths.py
