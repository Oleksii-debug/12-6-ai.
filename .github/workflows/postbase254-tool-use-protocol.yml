name: POSTBASE-254 Tool-Use Protocol

on:
  push:
    branches:
      - postbase254/tool-use-protocol-20260826
  pull_request:
    branches:
      - integrate222/learned-execution-spine-20260826
  workflow_dispatch:

permissions:
  contents: read

jobs:
  protocol-gates:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact head
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up exact Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11.16"

      - name: Universal execution bootstrap
        uses: ./.github/actions/execution-bootstrap
        with:
          capabilities: runtime,tests,lint
          venv: .venv-postbase254
          manifest: postbase254-bootstrap.json

      - name: Focused protocol tests
        shell: bash
        run: |
          set -euo pipefail
          .venv-postbase254/bin/python -m pytest -q tests/test_postbase254_tool_protocol.py

      - name: Compile protocol surfaces
        shell: bash
        run: |
          set -euo pipefail
          .venv-postbase254/bin/python -m compileall -q src/twelve_six/postbase \
            tests/test_postbase254_tool_protocol.py

      - name: Lint protocol surfaces
        shell: bash
        run: |
          set -euo pipefail
          .venv-postbase254/bin/ruff check src/twelve_six/postbase \
            tests/test_postbase254_tool_protocol.py

      - name: Verify machine manifest safety boundary
        shell: bash
        run: |
          set -euo pipefail
          .venv-postbase254/bin/python - <<'PY'
          import json
          from pathlib import Path

          report = json.loads(Path("reports/postbase254/protocol_manifest.json").read_text())
          assert report["canonical_base_modified"] is False
          assert report["external_llm_calls"] is False
          assert report["safety"]["shell_tool_registered"] is False
          assert report["safety"]["tool_observation_training_eligible"] is False
          assert report["safety"]["tool_observation_weight_update_eligible"] is False
          PY
