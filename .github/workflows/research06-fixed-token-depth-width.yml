name: RESEARCH06 Fixed Tokens and MODEL09 Depth Width

on:
  pull_request:

permissions:
  contents: read

jobs:
  fixed-token-depth-width-cpu:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Prove exact source checkout
        env:
          SOURCE_SHA: ${{ github.event.pull_request.head.sha }}
        run: test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11.16"
      - name: Verify locked environment inputs
        env:
          SOURCE_SHA: ${{ github.event.pull_request.head.sha }}
        run: >-
          python tools/verify_locked_environment.py
          --profile linux-x86_64
          --source-sha "$SOURCE_SHA"
          --evidence-out research06-locked-environment.json
      - name: Create locked LOCAL_FREE execution environment
        run: |
          python -m venv .research06-locked
          .research06-locked/bin/python -m pip install --disable-pip-version-check --require-hashes --no-deps -r requirements/locks/linux-x86_64/toolchain.lock.txt
          .research06-locked/bin/python -m pip install --disable-pip-version-check --require-hashes --no-deps -r requirements/locks/linux-x86_64/runtime.lock.txt
          .research06-locked/bin/python -m pip install --disable-pip-version-check --require-hashes --no-deps -r requirements/locks/linux-x86_64/dev.lock.txt
          PIP_NO_INDEX=1 PIP_DISABLE_PIP_VERSION_CHECK=1 .research06-locked/bin/python -m pip install --no-deps --no-build-isolation -e .
      - name: Focused contract tests
        run: |
          .research06-locked/bin/python -m pytest -q tests/test_scaling_experiment.py tests/test_fixed_token_research.py
      - name: Execute strict four-size fixed-token matrix
        env:
          SOURCE_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          .research06-locked/bin/python -m twelve_six.fixed_token_research scaling \
            --repo-root . \
            --source-sha "$SOURCE_SHA" \
            --output research06-fixed-token-results.json \
            --torch-threads 2
          .research06-locked/bin/python -m twelve_six.fixed_token_research validate \
            research06-fixed-token-results.json \
            --expected-source-sha "$SOURCE_SHA"
      - name: Execute predeclared iso-parameter 500K depth-width matrix
        env:
          SOURCE_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          .research06-locked/bin/python -m twelve_six.fixed_token_research depth-width \
            --repo-root . \
            --source-sha "$SOURCE_SHA" \
            --output model09-depth-width-results.json \
            --torch-threads 2
          .research06-locked/bin/python -m twelve_six.fixed_token_research validate \
            model09-depth-width-results.json \
            --expected-source-sha "$SOURCE_SHA"
      - name: Print machine decisions
        run: |
          .research06-locked/bin/python - <<'PY'
          import json
          fixed = json.load(open("research06-fixed-token-results.json", encoding="utf-8"))
          depth = json.load(open("model09-depth-width-results.json", encoding="utf-8"))
          print(json.dumps({
              "fixed_token_recommendation": fixed["ranking"]["recommended_primary_small_model"],
              "fixed_token_rank_best_validation": fixed["ranking"]["best_validation"],
              "depth_width_recommendation": depth["ranking"]["recommended_500k_geometry"],
              "fixed_report_sha256": fixed["report_sha256"],
              "depth_width_report_sha256": depth["report_sha256"],
          }, indent=2, sort_keys=True))
          PY
      - name: Upload retained machine evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: research06-model09-fixed-token-depth-width-evidence
          path: |
            research06-locked-environment.json
            research06-fixed-token-results.json
            model09-depth-width-results.json
          if-no-files-found: error
          retention-days: 30
