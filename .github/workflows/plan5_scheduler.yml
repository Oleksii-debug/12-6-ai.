name: Plan 5 autonomous scheduler scoped qualification

on:
  pull_request:
    paths:
      - 'src/twelve_six_agent_runtime/scheduler.py'
      - 'tests/test_agent_scheduler_section6.py'
      - 'docs/PLAN5_SCHEDULER_REFERENCE_CONTRACT.md'
      - '.github/workflows/plan5_scheduler.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scheduler:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v4
      - name: Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install LOCAL_FREE test tools
        run: python -m pip install 'pytest>=8,<10' 'ruff>=0.12,<1'
      - name: Scoped Plan 5 S2 S5 S6 integration
        run: >-
          PYTHONPATH=src python -m pytest -q
          tests/test_agent_task_state_section2.py
          tests/test_agent_task_state_section2_adversarial.py
          tests/test_agent_self_model_section5.py
          tests/test_agent_scheduler_section6.py
      - name: Focused Ruff
        run: >-
          ruff check src/twelve_six_agent_runtime/task_state.py
          src/twelve_six_agent_runtime/self_model.py
          src/twelve_six_agent_runtime/scheduler.py
          tests/test_agent_self_model_section5.py
          tests/test_agent_scheduler_section6.py
