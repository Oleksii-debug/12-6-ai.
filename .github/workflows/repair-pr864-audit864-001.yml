name: Repair PR864 AUDIT864-001

on:
  push:
    branches:
      - d03/rada-bulk-normalization-current-main-20260907
    paths:
      - .github/workflows/repair-pr864-audit864-001.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: d03/rada-bulk-normalization-current-main-20260907
          fetch-depth: 0
      - name: Bootstrap repository dev tools
        run: python -m pip install -e '.[dev]'
      - name: Apply exact in-place repair
        run: python tools/_repair_pr864_audit864_001.py
      - name: Focused validation
        run: |
          python -m pytest tests/test_d03_rada_bulk_normalization.py -q
          python -m ruff check --ignore EXE001 tools/normalize_d03_rada_bulk_html.py tests/test_d03_rada_bulk_normalization.py
      - name: Commit repaired product head
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add tools/normalize_d03_rada_bulk_html.py tests/test_d03_rada_bulk_normalization.py
          git diff --cached --quiet && exit 0
          git commit -m "D03: bind Rada normalizer to successor observation pin"
          git push origin HEAD:d03/rada-bulk-normalization-current-main-20260907
