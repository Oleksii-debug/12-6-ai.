name: NEXT100-063 Source Registry Convergence

on:
  push:
    branches:
      - next100-063/source-registry-convergence-20260826
    paths:
      - configs/data/next100_063_source_registry_convergence_v1.json
      - docs/NEXT100_063_SOURCE_REGISTRY_CONVERGENCE.md
      - tools/validate_next100_063_source_registry_convergence.py
      - tests/test_next100_063_source_registry_convergence.py
      - .github/workflows/next100-063-source-registry-convergence.yml
  pull_request:
    paths:
      - configs/data/next100_063_source_registry_convergence_v1.json
      - docs/NEXT100_063_SOURCE_REGISTRY_CONVERGENCE.md
      - tools/validate_next100_063_source_registry_convergence.py
      - tests/test_next100_063_source_registry_convergence.py
      - .github/workflows/next100-063-source-registry-convergence.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: next100-063-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  TWELVE_SIX_EXECUTION_PROFILE: LOCAL_FREE

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Bind exact source head
        env:
          EXPECTED_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SOURCE_SHA"

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.11.16"

      - name: Compile focused validator and tests
        run: >-
          python -m py_compile
          tools/validate_next100_063_source_registry_convergence.py
          tests/test_next100_063_source_registry_convergence.py

      - name: Validate converged authority vector twice
        run: |
          set -euo pipefail
          python tools/validate_next100_063_source_registry_convergence.py > /tmp/next100-063-a.json
          python tools/validate_next100_063_source_registry_convergence.py > /tmp/next100-063-b.json
          cmp /tmp/next100-063-a.json /tmp/next100-063-b.json
          cat /tmp/next100-063-a.json

      - name: Run focused fail-closed regressions
        run: >-
          python -m unittest discover -s tests
          -p 'test_next100_063_source_registry_convergence.py' -v
