name: TRAIN-54 Layer Health Diagnostics

on:
  pull_request:

permissions:
  contents: read

jobs:
  locked-layer-health:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Prove exact source checkout
        env:
          SOURCE_SHA: ${{ github.event.pull_request.head.sha }}
        run: test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11.16"
      - name: Verify exact D08 locked environment and repository checks
        env:
          SOURCE_SHA: ${{ github.event.pull_request.head.sha }}
        run: >-
          python tools/verify_locked_environment.py
          --profile linux-x86_64
          --source-sha "$SOURCE_SHA"
          --evidence-out locked-environment-linux-x86_64.json
          --run-repo-checks
      - name: Create exact locked TRAIN-54 execution environment
        run: |
          python -m venv .train54-locked
          .train54-locked/bin/python -m pip install --disable-pip-version-check --require-hashes --no-deps -r requirements/locks/linux-x86_64/toolchain.lock.txt
          .train54-locked/bin/python -m pip install --disable-pip-version-check --require-hashes --no-deps -r requirements/locks/linux-x86_64/runtime.lock.txt
          .train54-locked/bin/python -m pip install --disable-pip-version-check --require-hashes --no-deps -r requirements/locks/linux-x86_64/dev.lock.txt
          PIP_NO_INDEX=1 PIP_DISABLE_PIP_VERSION_CHECK=1 .train54-locked/bin/python -m pip install --no-deps --no-build-isolation -e .
      - name: Exercise layer-health contracts
        run: .train54-locked/bin/python -m pytest -q tests/test_layer_health.py
      - name: Execute 100K 500K 1M layer-health matrix
        env:
          SOURCE_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          .train54-locked/bin/python tools/run_layer_health_probe.py \
            --source-sha "$SOURCE_SHA" \
            --locked-environment-evidence locked-environment-linux-x86_64.json \
            --output layer-health-report.json \
            --seed 1337 \
            --max-steps 64 \
            --diagnostic-steps 0 4 16 64 \
            --batch-size 4 \
            --sequence-length 64
          .train54-locked/bin/python tools/validate_layer_health_report.py \
            layer-health-report.json \
            --expected-source-sha "$SOURCE_SHA"
      - name: Print diagnostic summary
        run: |
          .train54-locked/bin/python - <<'PY'
          import json
          from pathlib import Path

          report = json.loads(Path("layer-health-report.json").read_text())
          print(json.dumps({
              "report_sha256": report["report_sha256"],
              "init_spec": report["controls"]["init_spec"],
              "gradient_clip_norm": report["controls"]["gradient_clip_norm"],
              "cross_scale": report["cross_scale"],
              "hook_cleanup": [run["hook_cleanup_all_windows"] for run in report["runs"]],
          }, indent=2, sort_keys=True))
          PY
      - name: Upload TRAIN-54 machine evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: train54-layer-health-evidence
          path: |
            locked-environment-linux-x86_64.json
            layer-health-report.json
          if-no-files-found: error
          retention-days: 30
