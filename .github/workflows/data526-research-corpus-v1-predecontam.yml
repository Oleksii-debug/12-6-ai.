name: DATA-526 Research Corpus V1 pre-decontam

on:
  pull_request:
    paths:
      - "configs/data/research_corpus_v1_predecontam_blocker_v1.json"
      - "configs/data/research_corpus_v1_predecontam_blocker_v2.json"
      - "configs/data/research_corpus_v1_predecontam_blocker_v3.json"
      - "configs/data/research_corpus_v1_predecontam_blocker_v4.json"
      - "configs/data/research_corpus_v1_predecontam_freeze_v4.json"
      - "configs/data/data526_record_materialization_v5.json"
      - "tools/materialize_data526_record_inventory_v1.py"
      - "tools/materialize_data526_records_from_v7.py"
      - "tools/run_data526_materializer_data_only.py"
      - "tools/validate_data526_record_payload_gate_v4.py"
      - "tools/validate_data526_research_corpus_predecontam.py"
      - "tools/validate_data526_research_corpus_predecontam_v2.py"
      - "tools/validate_data526_research_corpus_predecontam_v3.py"
      - "tools/validate_data526_research_corpus_predecontam_v4.py"
      - "tests/test_data526_record_inventory_materializer_v1.py"
      - "tests/test_data526_record_materialization_v5.py"
      - "tests/test_data526_record_payload_gate_v4.py"
      - "tests/test_data526_research_corpus_predecontam.py"
      - "tests/test_data526_research_corpus_predecontam_v2.py"
      - "tests/test_data526_research_corpus_predecontam_v3.py"
      - "tests/test_data526_research_corpus_predecontam_v4.py"
      - "docs/DATA526_RESEARCH_CORPUS_V1_PREDECONTAM.md"
      - "docs/DATA526_RESEARCH_CORPUS_V1_PREDECONTAM_V2.md"
      - ".github/workflows/data526-research-corpus-v1-predecontam.yml"
  workflow_dispatch:

concurrency:
  group: data526-predecontam-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  actions: read
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      TWELVE_SIX_EXECUTION_PROFILE: LOCAL_FREE
      SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.SOURCE_SHA }}
          fetch-depth: 1
          persist-credentials: false

      - name: Prove exact checkout
        run: test "$(git rev-parse HEAD)" = "$SOURCE_SHA"

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11.16"

      - name: Install locked dev test dependencies
        run: python -m pip install --require-hashes --no-deps -r requirements/locks/linux-x86_64/dev.lock.txt

      - name: Validate historical V1 blocker authority
        run: python tools/validate_data526_research_corpus_predecontam.py

      - name: Validate historical V2 blocker authority
        run: python tools/validate_data526_research_corpus_predecontam_v2.py

      - name: Validate historical V3 blocker authority
        run: python tools/validate_data526_research_corpus_predecontam_v3.py

      - name: Validate current V4 frozen candidate authority
        run: |
          set -euo pipefail
          python tools/validate_data526_research_corpus_predecontam_v4.py
          python tools/validate_data526_record_payload_gate_v4.py
          curl --fail --silent --show-error --location \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/Oleksii-debug/12-6-ai./actions/artifacts/9635595510/zip" \
            -o /tmp/next100-065e.zip
          python - <<'PY'
          import hashlib
          import json
          import zipfile
          from pathlib import Path

          archive = Path("/tmp/next100-065e.zip").read_bytes()
          assert hashlib.sha256(archive).hexdigest() == "cca6921a2093d4e033976b23b0af180e9dc1945b624b82e218780f8d20bafd18"
          with zipfile.ZipFile("/tmp/next100-065e.zip") as package:
              report_bytes = package.read("evidence/next100_065e/a/report.json")
          assert hashlib.sha256(report_bytes).hexdigest() == "a917a5f240e2eda0015fd09564b29430ca8c95a9916a03f734a4463fe458c08f"
          report = json.loads(report_bytes.decode("utf-8"))
          assert report["report_sha256"] == "80997ac88b9d604afaf652807cda2a2d9fd0f6cb75754460ae6f4aa7af6e0267"
          assert report["dedup_v3"]["report_sha256"] == "c33e0d06a469473aac191e9b5bf7baec23322cd3e9200f0caab2633c921afd84"
          sources = report["dedup_v3"]["sources"]
          canonical = json.dumps(sources, sort_keys=True, separators=(",", ":"), ensure_ascii=False).encode("utf-8")
          assert len(sources) == 35
          assert hashlib.sha256(canonical).hexdigest() == "5e54c3587d6d2c0a7d540a1e8aefae77522c97a41c0033a05e78ce22a8e7c617"
          assert report["source_vector"]["conservative_unique_capacity_bytes_after_global_dedup"] == 2_215_615
          PY

      - name: Run fail-closed mutation tests
        run: >-
          python -m unittest -v
          tests.test_data526_record_inventory_materializer_v1
          tests.test_data526_record_materialization_v5
          tests.test_data526_record_payload_gate_v4
          tests.test_data526_research_corpus_predecontam
          tests.test_data526_research_corpus_predecontam_v2
          tests.test_data526_research_corpus_predecontam_v3
          tests.test_data526_research_corpus_predecontam_v4

      - name: Checkout exact terminal V7 materializer
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: d3333ec1b4a508df232a5aefccd6686adda745fb
          path: _data526_v7
          fetch-depth: 1
          persist-credentials: false

      - name: Install deterministic NIST PDF extractor
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends poppler-utils
          pdftotext -v

      - name: Retrieve immutable DATA-213 normalized artifacts twice
        run: |
          set -euo pipefail
          for build in a b; do
            curl --fail --silent --show-error --location \
              -H "Authorization: Bearer $GITHUB_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/Oleksii-debug/12-6-ai./actions/artifacts/9600107886/zip" \
              -o "/tmp/data213-${build}.zip"
          done
          cmp /tmp/data213-a.zip /tmp/data213-b.zip

      - name: Materialize exact 48-record graph twice
        run: |
          set -euo pipefail
          rm -rf /tmp/data526-a /tmp/data526-b
          mkdir -p /tmp/data526-a /tmp/data526-b evidence/data526/v5
          python tools/run_data526_materializer_data_only.py \
            --v7-root _data526_v7 \
            --data213-zip /tmp/data213-a.zip \
            --records-jsonl /tmp/data526-a/records.jsonl \
            --inventory-json /tmp/data526-a/inventory.json \
            --evidence-json /tmp/data526-a/evidence.json
          python tools/run_data526_materializer_data_only.py \
            --v7-root _data526_v7 \
            --data213-zip /tmp/data213-b.zip \
            --records-jsonl /tmp/data526-b/records.jsonl \
            --inventory-json /tmp/data526-b/inventory.json \
            --evidence-json /tmp/data526-b/evidence.json
          cmp /tmp/data526-a/records.jsonl /tmp/data526-b/records.jsonl
          cmp /tmp/data526-a/inventory.json /tmp/data526-b/inventory.json
          cmp /tmp/data526-a/evidence.json /tmp/data526-b/evidence.json
          cp /tmp/data526-a/inventory.json evidence/data526/v5/record_inventory.json
          cp /tmp/data526-a/evidence.json evidence/data526/v5/materialization_evidence.json
          rm -f /tmp/data526-a/records.jsonl /tmp/data526-b/records.jsonl

      - name: Assert V5 payload graph is text-free in durable evidence
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          config = json.loads(Path("configs/data/data526_record_materialization_v5.json").read_text())
          inventory = json.loads(Path("evidence/data526/v5/record_inventory.json").read_text())
          evidence = json.loads(Path("evidence/data526/v5/materialization_evidence.json").read_text())
          assert inventory["record_count"] == config["expected_materialization"]["record_count"] == 48
          assert inventory["total_payload_bytes"] == config["expected_materialization"]["total_payload_bytes"] == 2_215_615
          assert evidence["record_count"] == 48
          assert evidence["total_payload_bytes"] == 2_215_615
          assert evidence["authorized_unique_optimized_targets"] == 0
          assert evidence["decontamination_executed"] is False
          assert evidence["tokenizer_fit_executed"] is False
          assert evidence["training_executed"] is False
          assert evidence["final_test_payload_accessed"] is False
          assert "normalized_payload" not in Path("evidence/data526/v5/record_inventory.json").read_text()
          assert "normalized_payload" not in Path("evidence/data526/v5/materialization_evidence.json").read_text()
          PY

      - name: Assert V4 does not promote training or final-test access
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          doc = json.loads(Path("configs/data/research_corpus_v1_predecontam_freeze_v4.json").read_text())
          assert doc["status"] == "FROZEN_POST_GLOBAL_DEDUP_PREDECONTAM_CANDIDATE"
          assert doc["candidate_freeze"]["frozen"] is True
          assert doc["claim_boundary"]["global_dedup_terminal"] is True
          assert doc["claim_boundary"]["authorized_unique_optimized_targets"] == 0
          assert doc["claim_boundary"]["decontamination_executed"] is False
          assert doc["claim_boundary"]["final_test_payload_accessed"] is False
          assert doc["claim_boundary"]["tokenizer_fit_executed"] is False
          assert doc["claim_boundary"]["training_executed"] is False
          assert doc["claim_boundary"]["paid_compute_used"] is False
          assert doc["claim_boundary"]["long_training_authorized"] is False
          PY

      - name: Upload text-free DATA-526 V5 record authority candidate
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: data526-record-materialization-${{ env.SOURCE_SHA }}
          if-no-files-found: error
          retention-days: 90
          path: |
            configs/data/data526_record_materialization_v5.json
            evidence/data526/v5/record_inventory.json
            evidence/data526/v5/materialization_evidence.json
