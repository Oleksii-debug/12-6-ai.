name: D06 Evaluation Stage Gates

on:
  pull_request:
    paths:
      - "src/twelve_six/evaluation.py"
      - "src/twelve_six/stage_gates.py"
      - "tests/test_evaluation_stage_gates.py"
      - "tests/test_integrated_stage_gates.py"
      - "tests/fixtures/s0_complete_evidence.json"
      - "configs/stages/s0_eval_gate.json"
      - "docs/EVALUATION_AND_STAGE_GATES.md"
      - "pyproject.toml"
      - ".github/workflows/d06-evaluation.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  evaluation-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip
      - run: pip install -e .[dev]
      - run: ruff check src tests
      - run: pytest -q tests/test_evaluation_stage_gates.py tests/test_integrated_stage_gates.py
      - name: Produce machine-readable synthetic integrated gate result
        run: |
          python -m twelve_six.stage_gates \
            tests/fixtures/s0_complete_evidence.json \
            --policy configs/stages/s0_eval_gate.json \
            --output /tmp/s0_gate_result.json \
            --fail-on-incomplete
          python - <<'PY'
          import json
          from pathlib import Path

          result = json.loads(Path('/tmp/s0_gate_result.json').read_text(encoding='utf-8'))
          assert result['schema_version'] == '12-6.integrated-stage-gate-result.v2'
          assert result['summary']['evaluation_complete'] is True
          assert result['summary']['promotion_eligible'] is False
          assert result['summary']['promotion_authority_status'] == 'NOT_TESTED'
          assert result['summary']['counts'] == {'FAIL': 0, 'NOT_TESTED': 0, 'PASS': 15}
          PY
