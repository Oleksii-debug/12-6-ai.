name: NEXT100-065C Cross-Source Dedup V5

on:
  pull_request:
    paths:
      - ".github/workflows/next100-065c-cross-source-dedup-v5.yml"
      - "configs/data/next100_065c_cross_source_dedup_v5.json"
      - "src/twelve_six/data/cross_source_capacity_audit_v5.py"
      - "tests/test_next100_065c_cross_source_dedup_v5.py"
      - "tools/run_next100_065c_cross_source_dedup_v5.py"
      - "tools/validate_next100_065c_authority_bindings.py"
      - "docs/NEXT100_065C_CROSS_SOURCE_DEDUP_V5.md"
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pull-requests: read

jobs:
  exact-global-dedup:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      TWELVE_SIX_EXECUTION_PROFILE: LOCAL_FREE
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Prove exact source checkout and V4 ancestry
        env:
          EXPECTED_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_SOURCE_SHA"
          git merge-base --is-ancestor 5738bb8bac8fda058d5ae9c1361c4a0c3756f360 HEAD

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11.16"

      - name: Install deterministic NIST PDF extractor
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends poppler-utils
          pdftotext -v

      - name: Hard-bind static and live terminal authorities
        run: |
          python tools/validate_next100_065c_authority_bindings.py
          python tools/validate_next100_065c_authority_bindings.py --github-live

      - name: Universal exact LOCAL_FREE bootstrap
        uses: ./.github/actions/execution-bootstrap
        with:
          capabilities: runtime,tests,lint
          venv: .next100-065c
          command: python -m pytest -q tests/test_data298_cross_source_capacity_audit.py tests/test_next100_065_cross_source_dedup_v3.py tests/test_next100_065b_cross_source_dedup_v4.py tests/test_next100_065c_cross_source_dedup_v5.py
          manifest: next100-065c-execution-environment.json

      - name: Compile focused implementation
        run: >-
          PYTHONPATH=src .next100-065c/bin/python -m compileall -q
          src/twelve_six/data/cross_source_capacity_audit.py
          src/twelve_six/data/cross_source_capacity_audit_v3.py
          src/twelve_six/data/cross_source_capacity_audit_v4.py
          src/twelve_six/data/cross_source_capacity_audit_v5.py
          tools/run_next100_065c_cross_source_dedup_v5.py
          tools/validate_next100_065c_authority_bindings.py
          tests/test_next100_065c_cross_source_dedup_v5.py

      - name: Inherited plus V5 adversarial tests
        run: >-
          PYTHONPATH=src .next100-065c/bin/python -m pytest -q
          tests/test_data298_cross_source_capacity_audit.py
          tests/test_next100_065_cross_source_dedup_v3.py
          tests/test_next100_065b_cross_source_dedup_v4.py
          tests/test_next100_065c_cross_source_dedup_v5.py

      - name: Focused lint
        run: >-
          .next100-065c/bin/ruff check --select E4,E9,F
          src/twelve_six/data/cross_source_capacity_audit_v5.py
          tools/run_next100_065c_cross_source_dedup_v5.py
          tools/validate_next100_065c_authority_bindings.py
          tests/test_next100_065c_cross_source_dedup_v5.py

      - name: Materialize full 23-object audit twice
        env:
          PYTHONPATH: src
        run: |
          mkdir -p evidence/next100_065c/a evidence/next100_065c/b
          .next100-065c/bin/python tools/run_next100_065c_cross_source_dedup_v5.py run \
            --base-inventory configs/data/next100_065_cross_source_dedup_v3.json \
            --v4-extension configs/data/next100_065b_cross_source_dedup_v4.json \
            --v5-config configs/data/next100_065c_cross_source_dedup_v5.json \
            --report evidence/next100_065c/a/report.json
          .next100-065c/bin/python tools/run_next100_065c_cross_source_dedup_v5.py run \
            --base-inventory configs/data/next100_065_cross_source_dedup_v3.json \
            --v4-extension configs/data/next100_065b_cross_source_dedup_v4.json \
            --v5-config configs/data/next100_065c_cross_source_dedup_v5.json \
            --report evidence/next100_065c/b/report.json
          cmp evidence/next100_065c/a/report.json evidence/next100_065c/b/report.json

      - name: Verify exact capacity, privacy and truth boundaries
        env:
          PYTHONPATH: src
        run: |
          .next100-065c/bin/python tools/run_next100_065c_cross_source_dedup_v5.py verify \
            --report evidence/next100_065c/a/report.json
          .next100-065c/bin/python - <<'PY'
          import json
          from pathlib import Path

          report = json.loads(Path("evidence/next100_065c/a/report.json").read_text())
          vector = report["source_vector"]
          dedup = report["dedup_v3"]
          scope = dedup["terminal_candidates"]
          cp = next(
              item for item in report["materialization_evidence"]
              if item["source_id"] == "en.python.docs.tutorial-introduction"
          )

          assert vector["source_object_count"] == 23
          assert vector["source_family_counts"] == {"code": 4, "en": 4, "uk": 4}
          assert 0 < vector["cpython_accepted_capacity_bytes"] < 17901
          assert vector["source_capacity_bytes_before_global_dedup"] == (
              320632 + vector["cpython_accepted_capacity_bytes"]
          )
          assert scope["declared_capacity_bytes_before"] == vector["source_capacity_bytes_before_global_dedup"]
          assert 0 <= vector["conservative_unique_capacity_bytes_after_global_dedup"] <= scope["declared_capacity_bytes_before"]
          assert scope["by_modality"]["uk"]["declared_source_family_count"] == 4
          assert scope["by_modality"]["en"]["declared_source_family_count"] == 4
          assert scope["by_modality"]["code"]["declared_source_family_count"] == 4
          assert cp["normalized_source_bytes"] == 17901
          assert cp["accepted_chunk_count"] == 14
          assert cp["rejected_chunk_count"] == 2
          assert cp["rejection_reasons"] == {"pii_phone": 2}
          assert cp["accepted_capacity_bytes"] == vector["cpython_accepted_capacity_bytes"]
          assert cp["accepted_capacity_bytes"] < cp["normalized_source_bytes"]
          assert report["model_training_executed"] is False
          assert report["tokenizer_fit_executed"] is False
          assert report["paid_compute_used"] is False
          assert report["final_test_payload_read"] is False
          for value in report["claim_boundary"].values():
              assert value is False
          PY

      - name: Prove public evidence is text-free
        run: |
          ! grep -q '"text"' evidence/next100_065c/a/report.json
          ! grep -q 'raw.githubusercontent.com' evidence/next100_065c/a/report.json
          ! grep -q '380 50 123 4567' evidence/next100_065c/a/report.json

      - name: Upload immutable NEXT100-065C evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: next100-065c-cross-source-dedup-${{ github.event.pull_request.head.sha || github.sha }}
          if-no-files-found: error
          retention-days: 90
          path: |
            configs/data/next100_065c_cross_source_dedup_v5.json
            next100-065c-execution-environment.json
            evidence/next100_065c/a/report.json
