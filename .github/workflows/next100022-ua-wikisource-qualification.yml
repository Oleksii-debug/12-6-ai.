name: NEXT100-022 Ukrainian Wikisource Qualification

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qualify-ua-wikisource:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      TWELVE_SIX_EXECUTION_PROFILE: LOCAL_FREE
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11.16"

      - name: Bind exact source head
        env:
          EXPECTED_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SOURCE_SHA"

      - name: Validate immutable rights and snapshot authority
        run: |
          python -m json.tool configs/data/next100022_ua_wikisource_candidate_v1.json >/dev/null
          python -m compileall -q tools/validate_next100022_ua_wikisource.py tests/test_next100022_ua_wikisource.py
          python tools/validate_next100022_ua_wikisource.py
          python -m unittest -v tests.test_next100022_ua_wikisource

      - name: Verify validation is non-mutating
        run: test -z "$(git status --porcelain --untracked-files=no)"
