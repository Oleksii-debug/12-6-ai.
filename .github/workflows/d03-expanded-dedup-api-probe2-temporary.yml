name: D03 expanded dedup API probe2 temporary

on:
  pull_request:
    paths:
      - ".github/workflows/d03-expanded-dedup-api-probe2-temporary.yml"

permissions:
  contents: write
  pull-requests: write

jobs:
  probe:
    if: github.event.pull_request.head.ref == 'd03/expanded-dedup-api-probe-20260910'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      GITHUB_TOKEN: ${{ github.token }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
      SOURCE_SHA: ${{ github.event.pull_request.head.sha }}
      HEAD_REF: ${{ github.event.pull_request.head.ref }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.SOURCE_SHA }}
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11.16"
      - name: Discover incumbent dedup implementation paths and callable contract
        run: |
          set -euo pipefail
          python - <<'PY'
          import ast, json, os, re
          from pathlib import Path

          roots = [Path('src'), Path('tools'), Path('configs'), Path('tests')]
          candidates = []
          markers = (
              'data232-byte-near-copy-plus-lineage-connected-components-v3',
              'NEXT100-065F',
              'next100_065',
              'global_dedup',
              'global-dedup',
              'survivor_authority_sha256',
          )
          for root in roots:
              if not root.exists():
                  continue
              for p in root.rglob('*'):
                  if not p.is_file() or p.suffix not in {'.py','.json','.md','.yml','.yaml'}:
                      continue
                  try:
                      text=p.read_text(errors='replace')
                  except OSError:
                      continue
                  name=p.as_posix().casefold()
                  if 'dedup' in name or '065' in name or any(m.casefold() in text.casefold() for m in markers):
                      candidates.append((p,text))

          lines = [
              '# D03 incumbent global-dedup API probe v2', '',
              f'Probe source head: `{os.environ["SOURCE_SHA"]}`.', '',
              'Broad repository-local discovery for the already-merged dedup lineage. No matcher semantics are changed.', '',
              '## Matching paths', '```text',
          ]
          lines += [p.as_posix() for p,_ in candidates]
          lines += ['```','']

          def sig(n):
              try:
                  return ast.unparse(n).split(':',1)[0]
              except Exception:
                  return n.name

          budget = 56000
          for p,text in candidates:
              if len('\n'.join(lines)) > budget:
                  break
              if p.suffix == '.py':
                  try: tree=ast.parse(text)
                  except SyntaxError: continue
                  funcs=[n for n in tree.body if isinstance(n,(ast.FunctionDef,ast.AsyncFunctionDef))]
                  classes=[n for n in tree.body if isinstance(n,ast.ClassDef)]
                  constants=[]
                  for n in tree.body:
                      if isinstance(n,(ast.Assign,ast.AnnAssign)):
                          targets = n.targets if isinstance(n,ast.Assign) else [n.target]
                          value = n.value
                          if value is None: continue
                          for t in targets:
                              if isinstance(t,ast.Name) and t.id.isupper():
                                  try: val=ast.literal_eval(value)
                                  except Exception: continue
                                  if isinstance(val,(str,int,float,bool,type(None),tuple,list,dict)) and len(repr(val)) < 1200:
                                      constants.append((t.id,val))
                  lines += [f'## `{p.as_posix()}`','', 'Top-level callables/classes:', '```text']
                  for n in funcs: lines.append(sig(n))
                  for c in classes: lines.append('class '+c.name)
                  lines += ['```','']
                  if constants:
                      lines += ['Selected constants:','```json',json.dumps(dict(constants),indent=2,sort_keys=True,default=str),'```','']
                  # Include focused source only for public-ish functions that can reveal reuse contract.
                  selected=[n for n in funcs if any(k in n.name.casefold() for k in ('dedup','audit','material','report','verify','surviv','source','build','main'))]
                  for n in selected[:10]:
                      src=ast.get_source_segment(text,n) or ''
                      if len(src)>4500: src=src[:4500]+'\n# ... truncated ...'
                      lines += [f'### `{n.name}`','```python',src,'```','']
                  # Extract argparse options even when main is not selected.
                  opts=[]
                  for n in ast.walk(tree):
                      if isinstance(n,ast.Call) and isinstance(n.func,ast.Attribute) and n.func.attr=='add_argument':
                          names=[]
                          for a in n.args:
                              if isinstance(a,ast.Constant) and isinstance(a.value,str): names.append(a.value)
                          if names:
                              opts.append(names)
                  if opts:
                      lines += ['Argparse options:','```json',json.dumps(opts,indent=2),'```','']
              elif p.suffix == '.json' and any(m.casefold() in text.casefold() for m in markers):
                  try: d=json.loads(text)
                  except Exception: continue
                  lines += [f'## `{p.as_posix()}` top-level schema','```json',json.dumps({k:v for k,v in d.items() if k in {"schema_version","worker_id","execution_profile","claim_boundary","remaining_blockers","dedup_v3","expected_terminal_composition"}},indent=2,sort_keys=True)[:7000],'```','']

          body='\n'.join(lines)
          if len(body)>60000: body=body[:59500]+'\n\n[probe truncated]\n'
          Path('/tmp/request.json').write_text(json.dumps({'body':body}))
          print('paths=',len(candidates),'chars=',len(body))
          PY
      - name: Publish probe result
        run: |
          set -euo pipefail
          curl --fail --silent --show-error -X PATCH \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}" \
            --data-binary @/tmp/request.json >/dev/null
      - name: Retire probe workflow
        run: |
          set -euo pipefail
          git rm .github/workflows/d03-expanded-dedup-api-probe2-temporary.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "D03: retire broadened dedup API probe"
          git fetch --no-tags origin "refs/heads/${HEAD_REF}"
          test "$(git rev-parse FETCH_HEAD)" = "$SOURCE_SHA"
          git push origin "HEAD:refs/heads/${HEAD_REF}"
