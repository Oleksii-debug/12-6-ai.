name: D03 President Decrees Temporary

on:
  pull_request:
    branches: [main]
    paths:
      - "configs/data/d03_ua_president_decrees_intake_v1.json"
      - "tools/materialize_d03_ua_president_decrees_v1.py"
      - "tools/validate_d03_ua_president_decrees_v1.py"
      - "tools/replay_d03_ua_president_decrees_v1.py"
      - "tests/test_d03_ua_president_decrees_intake_v1.py"
      - "tests/test_d03_ua_president_decrees_replay_v1.py"
      - ".github/workflows/d03-president-decrees-temporary.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: d03-president-decrees-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  bounded-intake:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Prove exact checkout
        run: test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install focused test dependency
        run: python -m pip install --disable-pip-version-check pytest==8.4.2
      - name: Run focused adversarial suites
        run: >-
          PYTHONPATH=. pytest -q
          tests/test_d03_ua_president_decrees_intake_v1.py
          tests/test_d03_ua_president_decrees_replay_v1.py
      - name: Independent bounded materialization A
        run: >-
          python tools/materialize_d03_ua_president_decrees_v1.py
          --output "$RUNNER_TEMP/president-a.json"
          --max-pages 4
          --max-documents 60
          --request-delay 1.05
      - name: Validate materialization A
        run: >-
          python tools/validate_d03_ua_president_decrees_v1.py
          "$RUNNER_TEMP/president-a.json"
      - name: Independent bounded materialization B
        run: >-
          python tools/materialize_d03_ua_president_decrees_v1.py
          --output "$RUNNER_TEMP/president-b.json"
          --max-pages 4
          --max-documents 60
          --request-delay 1.05
      - name: Validate materialization B and require stable identity
        run: |
          python tools/validate_d03_ua_president_decrees_v1.py "$RUNNER_TEMP/president-b.json"
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          root = Path(os.environ["RUNNER_TEMP"])
          a = json.loads((root / "president-a.json").read_text(encoding="utf-8"))
          b = json.loads((root / "president-b.json").read_text(encoding="utf-8"))
          assert a["materialization_identity_sha256"] == b["materialization_identity_sha256"]
          assert a["observed_yield"] == b["observed_yield"]
          for evidence in (a, b):
              assert evidence["execution"]["class"] == "LOCAL_FREE"
              assert evidence["execution"]["paid_compute_used"] is False
              assert evidence["execution"]["model_training_executed"] is False
              assert evidence["execution"]["final_test_accessed"] is False
              assert evidence["claims"]["training_authorized_bytes"] == 0
              assert evidence["claims"]["canonical_capacity_credit_bytes"] == 0
          print("status=", a["status"])
          print("accepted_documents=", a["observed_yield"]["accepted_documents"])
          print("accepted_normalized_bytes=", a["observed_yield"]["accepted_normalized_bytes"])
          print("materialization_identity_sha256=", a["materialization_identity_sha256"])
          PY
      - name: Replay accepted payloads into ephemeral dedup graph
        run: >-
          python tools/replay_d03_ua_president_decrees_v1.py
          "$RUNNER_TEMP/president-a.json"
          --output-proof "$RUNNER_TEMP/president-replay-proof.json"
          --request-delay 1.05
      - name: Require replay proof to remain text-free and zero-credit
        run: |
          python - <<'PY'
          import importlib.util
          import json
          import os
          import sys
          from pathlib import Path

          root = Path(os.environ["GITHUB_WORKSPACE"])
          path = root / "tools" / "replay_d03_ua_president_decrees_v1.py"
          spec = importlib.util.spec_from_file_location("president_replay_verify", path)
          assert spec is not None and spec.loader is not None
          module = importlib.util.module_from_spec(spec)
          sys.modules[spec.name] = module
          spec.loader.exec_module(module)
          proof_path = Path(os.environ["RUNNER_TEMP"]) / "president-replay-proof.json"
          proof = json.loads(proof_path.read_text(encoding="utf-8"))
          module.verify_proof(proof)
          assert proof["raw_text_emitted"] is False
          assert proof["durable_payload_bytes_emitted"] == 0
          assert proof["training_authorized_bytes"] == 0
          print("replayed_source_count=", proof["replayed_source_count"])
          print("replayed_normalized_bytes=", proof["replayed_normalized_bytes"])
          print("proof_sha256=", proof["proof_sha256"])
          PY
      - name: Upload body-free evidence
        uses: actions/upload-artifact@v4
        with:
          name: d03-president-decrees-${{ env.SOURCE_SHA }}
          path: |
            ${{ runner.temp }}/president-a.json
            ${{ runner.temp }}/president-b.json
            ${{ runner.temp }}/president-replay-proof.json
          if-no-files-found: error
          retention-days: 30
