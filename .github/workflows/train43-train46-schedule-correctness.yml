name: TRAIN-43 TRAIN-46 Schedule Correctness

on:
  pull_request:
    paths:
      - "src/twelve_six/schedule_batch_experiment.py"
      - "tools/run_train46_grad_accum_evidence.py"
      - "tests/test_schedule_batch_experiment.py"
      - "src/twelve_six/training/**"
      - ".github/workflows/train43-train46-schedule-correctness.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  local-free-cpu-evidence:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Checkout exact source head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.SOURCE_SHA }}
          fetch-depth: 0
          persist-credentials: false

      - name: Prove exact source checkout
        run: test "$(git rev-parse HEAD)" = "$SOURCE_SHA"

      - name: Set up locked Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.11.16"
          check-latest: false

      - name: Create purpose-locked experiment environment
        run: |
          python -m venv .train-schedule-locked
          .train-schedule-locked/bin/python -m pip install --disable-pip-version-check --require-hashes --no-deps -r requirements/locks/linux-x86_64/toolchain.lock.txt
          .train-schedule-locked/bin/python -m pip install --disable-pip-version-check --require-hashes --no-deps -r requirements/locks/linux-x86_64/runtime.lock.txt
          .train-schedule-locked/bin/python -m pip install --disable-pip-version-check --require-hashes --no-deps -r requirements/locks/linux-x86_64/dev.lock.txt
          PIP_NO_INDEX=1 PIP_DISABLE_PIP_VERSION_CHECK=1 .train-schedule-locked/bin/python -m pip install --no-deps --no-build-isolation -e .
          .train-schedule-locked/bin/python -c "import torch,twelve_six; print(torch.__version__, twelve_six.__version__)"

      - name: Run focused trainer semantics and lint
        run: |
          .train-schedule-locked/bin/python -m ruff check src/twelve_six/schedule_batch_experiment.py tools/run_train46_grad_accum_evidence.py tests/test_schedule_batch_experiment.py
          .train-schedule-locked/bin/python -m pytest -q tests/test_schedule_batch_experiment.py tests/test_training_engine.py -k "schedule_batch or gradient_accumulation or variable_token_accumulation or partial_accumulation"

      - name: Execute TRAIN-43 warmup matrix
        run: |
          .train-schedule-locked/bin/python -m twelve_six.schedule_batch_experiment \
            --repo-root . \
            --output train43-warmup-evidence.json

      - name: Execute TRAIN-46 accumulation correctness
        run: |
          .train-schedule-locked/bin/python tools/run_train46_grad_accum_evidence.py \
            --repo-root . \
            --output train46-grad-accum-evidence.json

      - name: Print compact executed evidence summary
        run: |
          .train-schedule-locked/bin/python - <<'PY'
          import json

          warmup = json.load(open("train43-warmup-evidence.json", encoding="utf-8"))
          accum = json.load(open("train46-grad-accum-evidence.json", encoding="utf-8"))
          warmup_keys = (
              "parameters",
              "warmup_steps",
              "warmup_fraction_of_scheduler_horizon",
              "initial_validation_loss",
              "final_validation_loss",
              "tokens_to_recover_initial_validation",
              "early_max_update_loss",
              "early_max_grad_norm",
              "early_clip_frequency",
              "overall_clip_frequency",
              "early_max_update_ratio",
              "early_validation_spike_above_initial",
          )
          summary = {
              "train43": {
                  "controls": warmup["controls"],
                  "decision": warmup["warmup"]["decision"],
                  "runs": [
                      {key: run[key] for key in warmup_keys}
                      for run in warmup["warmup"]["runs"]
                  ],
                  "report_sha256": warmup["report_sha256"],
              },
              "train46": {
                  "controls": accum["controls"],
                  "equivalence": accum["equivalence"],
                  "resource_comparison": accum["resource_comparison"],
                  "checkpoint_boundary": accum["checkpoint_boundary"],
                  "decision": accum["decision"],
                  "report_sha256": accum["report_sha256"],
              },
          }
          print("EXECUTED_EVIDENCE_SUMMARY=" + json.dumps(summary, sort_keys=True))
          PY

      - name: Upload retained evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: train43-train46-schedule-correctness-evidence
          path: |
            train43-warmup-evidence.json
            train46-grad-accum-evidence.json
          if-no-files-found: error
          retention-days: 30
