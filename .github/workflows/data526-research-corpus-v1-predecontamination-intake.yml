name: DATA-526 Research Corpus V1 pre-decontamination intake

on:
  pull_request:
    paths:
      - "configs/data/data526_research_corpus_v1_predecontamination_intake_v1.json"
      - "tools/validate_data526_predecontamination_intake.py"
      - "tests/test_data526_predecontamination_intake.py"
      - "docs/DATA526_RESEARCH_CORPUS_V1_PREDECONTAMINATION_INTAKE.md"
      - ".github/workflows/data526-research-corpus-v1-predecontamination-intake.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Validate immutable intake
        run: python tools/validate_data526_predecontamination_intake.py
      - name: Run fail-closed regressions
        run: python -m unittest tests/test_data526_predecontamination_intake.py -v
