name: DATA-294 Unique Loss Position Accounting

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-unique-loss-position-accounting:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11.16"

      - name: Bind exact source head
        env:
          EXPECTED_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SOURCE_SHA"

      - name: Bootstrap universal exact LOCAL_FREE environment
        uses: ./.github/actions/execution-bootstrap
        with:
          capabilities: runtime,tests
          venv: .data294
          command: python -m pytest
          manifest: data294-execution-environment.json

      - name: Compile DATA-294 surfaces
        env:
          PYTHONPATH: src
        run: >-
          .data294/bin/python -m compileall -q
          src/twelve_six/data/unique_loss_ledger.py
          src/twelve_six/training/exposure.py
          tools/build_unique_loss_ledger.py

      - name: Verify committed ledger is a deterministic rebuild
        env:
          PYTHONPATH: src
        run: .data294/bin/python tools/build_unique_loss_ledger.py --verify

      - name: Run focused exposure contracts
        env:
          PYTHONPATH: src
        run: .data294/bin/python -m pytest -q tests/test_unique_loss_ledger.py
