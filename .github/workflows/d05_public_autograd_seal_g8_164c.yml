name: D05 public autograd seal G8-164c

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  focused-linux:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exact qualification carrier
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 2

      - name: Set exact CPython 3.11.16
        uses: actions/setup-python@v5
        with:
          python-version: "3.11.16"
          cache: pip

      - name: Bind exact stacked source and focused closure
        env:
          SOURCE_SHA: 0dee513702858146ada052b02904f20bfb0f1614
          TRAINER_ADAPTER_BLOB: 1b2facc0f8c2e9535a924f18ec1b77c769e65829
          PROGRESS_TRAINER_BLOB: 194549e472e4973e69d56d4b03710f10e65c739e
          TEST_BLOB: 11730b31d518fa4f4ab10a61a7a116366afc11dd
        run: |
          set -euxo pipefail
          test "$(git rev-parse HEAD^)" = "$SOURCE_SHA"
          test "$(git hash-object src/twelve_six/checkpoint/trainer_adapter.py)" = "$TRAINER_ADAPTER_BLOB"
          test "$(git hash-object src/twelve_six/checkpoint/progress_trainer.py)" = "$PROGRESS_TRAINER_BLOB"
          test "$(git hash-object tests/test_checkpoint_rng_completeness_d02.py)" = "$TEST_BLOB"

      - name: Install focused test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Compile focused Python paths
        run: |
          python -m py_compile             src/twelve_six/checkpoint/trainer_adapter.py             src/twelve_six/checkpoint/progress_trainer.py             tests/test_checkpoint_rng_completeness_d02.py

      - name: Lint exact stacked closure
        run: |
          python -m ruff check             src/twelve_six/checkpoint/trainer_adapter.py             src/twelve_six/checkpoint/progress_trainer.py             tests/test_checkpoint_rng_completeness_d02.py

      - name: Execute public autograd and RNG checkpoint regressions
        run: |
          python -m pytest -q tests/test_checkpoint_rng_completeness_d02.py

      - name: Prove carrier remains clean
        run: |
          test -z "$(git status --porcelain)"
