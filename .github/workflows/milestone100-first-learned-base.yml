name: MILESTONE-100 First Learned Base

on:
  pull_request:
    paths:
      - "tools/run_milestone100_first_learned_base.py"
      - "tests/test_milestone100_first_learned_base.py"
      - "configs/data/corpus_v02.json"
      - "src/twelve_six/data/corpus_v02.py"
      - ".github/workflows/milestone100-first-learned-base.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  learned-base-local-free:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    env:
      PYTHONPATH: src:.
      CUDA_VISIBLE_DEVICES: ""
      OMP_NUM_THREADS: "2"
      MKL_NUM_THREADS: "2"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11.16"
      - name: Bind exact experiment head
        env:
          EXPECTED_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SOURCE_SHA"
      - name: Install repository runtime and tests
        run: python -m pip install --disable-pip-version-check -e .[dev]
      - name: Verify and install exact DataTrove and tokenizer incumbents
        shell: bash
        run: |
          mkdir -p /tmp/datatrove-wheel /tmp/tokenizers-wheel
          python -m pip download --disable-pip-version-check --no-deps datatrove==0.10.0 -d /tmp/datatrove-wheel
          WHEEL="$(find /tmp/datatrove-wheel -name 'datatrove-0.10.0-*.whl' -print -quit)"
          test -n "$WHEEL"
          test "$(sha256sum "$WHEEL" | awk '{print $1}')" = "c7bb75deed2c3e88fb5138f8ea075a170ee98d6c94fc263829609091ea9c2b5d"
          python -m pip download --disable-pip-version-check --no-deps tokenizers==0.23.1 -d /tmp/tokenizers-wheel
          TOKENIZERS_WHEEL="$(find /tmp/tokenizers-wheel -name 'tokenizers-0.23.1-*.whl' -print -quit)"
          test -n "$TOKENIZERS_WHEEL"
          test "$(sha256sum "$TOKENIZERS_WHEEL" | awk '{print $1}')" = "5075b405006415ea148a992d093699c66eb01952bf59f4d5727089a98bda45a4"
          python -m pip install --disable-pip-version-check "$WHEEL" orjson regex "xxhash==3.8.1"
          python -m pip install --disable-pip-version-check --no-deps "$TOKENIZERS_WHEEL"
      - name: Static and orchestration tests
        run: |
          ruff check tools/run_milestone100_first_learned_base.py tests/test_milestone100_first_learned_base.py
          pytest -q tests/test_milestone100_first_learned_base.py
      - name: Build exact V0.2 corpus once for training
        run: |
          mkdir -p reports/milestone100
          /usr/bin/time -v python -m twelve_six.data.corpus_v02 \
            configs/data/corpus_v02.json \
            --output-dir /tmp/milestone100-corpus \
            > reports/milestone100/corpus-build.stdout.json \
            2> reports/milestone100/corpus-build.time.txt
      - name: Phase 1 scratch initialization and training to resume boundary
        run: |
          /usr/bin/time -v python tools/run_milestone100_first_learned_base.py prepare \
            --corpus-config configs/data/corpus_v02.json \
            --corpus-dir /tmp/milestone100-corpus \
            --output reports/milestone100/run \
            > reports/milestone100/prepare.stdout.txt \
            2> reports/milestone100/prepare.time.txt
      - name: Phase 2 fresh-process verified resume and training to final step
        run: |
          /usr/bin/time -v python tools/run_milestone100_first_learned_base.py resume \
            --corpus-dir /tmp/milestone100-corpus \
            --output reports/milestone100/run \
            > reports/milestone100/resume.stdout.txt \
            2> reports/milestone100/resume.time.txt
      - name: Phase 3 fresh-process final evaluation and artifact proof
        run: |
          /usr/bin/time -v python tools/run_milestone100_first_learned_base.py verify \
            --corpus-dir /tmp/milestone100-corpus \
            --output reports/milestone100/run \
            > reports/milestone100/verify.stdout.json \
            2> reports/milestone100/verify.time.txt
      - name: Assert complete learned Base evidence
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          evidence = json.loads(Path('reports/milestone100/run/evidence.json').read_text())
          assert evidence['status'] == 'PASS_LEARNED_BASE_ARTIFACT_WITH_EXPLICIT_CORPUS_LIMITATION'
          assert evidence['model']['parameter_count'] == 107856
          assert evidence['model']['random_initialization']['kind'] == 'RANDOM_FROM_SCRATCH'
          assert evidence['model']['random_initialization']['foreign_pretrained_weights'] is False
          assert evidence['training']['train_loss_last_64_mean'] < evidence['training']['train_loss_first_64_mean']
          assert evidence['heldout_evaluation']['bpb_decreased'] is True
          assert evidence['heldout_evaluation']['evaluation_non_mutation'] is True
          assert evidence['checkpoint_resume']['checkpoint_count'] >= 6
          assert evidence['checkpoint_resume']['fresh_process_resume'] is True
          assert evidence['checkpoint_resume']['resume_checkpoint_verified'] is True
          assert evidence['checkpoint_resume']['resume_data_cursor_verified'] is True
          assert evidence['corpus']['real_external_tokens_actually_optimized'] > 0
          assert evidence['truth_boundary']['foreign_pretrained_weights'] is False
          assert evidence['truth_boundary']['instruction_tuning'] is False
          assert evidence['truth_boundary']['paid_compute'] is False
          assert evidence['truth_boundary']['broad_intelligence_claim'] is False
          assert Path('reports/milestone100/run/checkpoints/step-001536/manifest.json').is_file()
          print(json.dumps({
              'evidence_sha256': evidence['evidence_sha256'],
              'parameter_count': evidence['model']['parameter_count'],
              'tokens_seen': evidence['training']['tokens_seen'],
              'train_loss_before': evidence['training']['train_loss_first_64_mean'],
              'train_loss_after': evidence['training']['train_loss_last_64_mean'],
              'heldout_bpb_before': evidence['heldout_evaluation']['before']['bpb'],
              'heldout_bpb_after': evidence['heldout_evaluation']['after']['bpb'],
              'final_checkpoint_id': evidence['checkpoint_resume']['retained_final_checkpoint_id'],
          }, sort_keys=True))
          PY
      - name: Upload exact learned Base artifact and execution evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: milestone100-first-learned-base-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            /tmp/milestone100-corpus/manifest.json
            /tmp/milestone100-corpus/tokenizer/*
            reports/milestone100/**
          if-no-files-found: warn
          retention-days: 30
