name: tmp-1131-ecfr-exec

on:
  push:
    branches:
      - swarm/1131-ecfr-exec-v2

permissions:
  contents: read

jobs:
  macos:
    runs-on: macos-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Verify canonical input blobs
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object configs/data/d03_ecfr_point_in_time_request_v1.json)" = "92fb471260020dffc3b9d53ca98581cf700b0916"
          test "$(git hash-object tools/materialize_d03_ecfr_point_in_time.py)" = "226fa5a089985451b49239e5e02b1fd059095fa7"
      - name: Execute canonical materializer twice without retaining XML
        shell: bash
        run: |
          set -euo pipefail
          out1="$RUNNER_TEMP/ecfr1"
          out2="$RUNNER_TEMP/ecfr2"
          python3 tools/materialize_d03_ecfr_point_in_time.py --output-dir "$out1"
          python3 tools/materialize_d03_ecfr_point_in_time.py --output-dir "$out2"
          evidence="ecfr-2026-09-03-title-1.evidence.json"
          cmp "$out1/$evidence" "$out2/$evidence"
          cat "$out1/$evidence"

  windows:
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Verify canonical input blobs
        shell: pwsh
        run: |
          $requestBlob = (git hash-object configs/data/d03_ecfr_point_in_time_request_v1.json).Trim()
          $toolBlob = (git hash-object tools/materialize_d03_ecfr_point_in_time.py).Trim()
          if ($requestBlob -ne "92fb471260020dffc3b9d53ca98581cf700b0916") { throw "request blob drift: $requestBlob" }
          if ($toolBlob -ne "226fa5a089985451b49239e5e02b1fd059095fa7") { throw "materializer blob drift: $toolBlob" }
      - name: Execute canonical materializer twice without retaining XML
        shell: pwsh
        run: |
          $out1 = Join-Path $env:RUNNER_TEMP "ecfr1"
          $out2 = Join-Path $env:RUNNER_TEMP "ecfr2"
          python tools/materialize_d03_ecfr_point_in_time.py --output-dir $out1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tools/materialize_d03_ecfr_point_in_time.py --output-dir $out2
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $evidence = "ecfr-2026-09-03-title-1.evidence.json"
          $p1 = Join-Path $out1 $evidence
          $p2 = Join-Path $out2 $evidence
          $h1 = (Get-FileHash -Algorithm SHA256 $p1).Hash
          $h2 = (Get-FileHash -Algorithm SHA256 $p2).Hash
          if ($h1 -ne $h2) { throw "evidence drift between repeated canonical runs" }
          Get-Content $p1
