name: D05 core/RNG failure note G8-168

on:
  pull_request:
    branches:
      - repair/2940-core-rng-failure-note-g8-168-20261006
    paths:
      - ".github/workflows/d05_core_rng_failure_note_g8_168.yml"

permissions:
  contents: read

concurrency:
  group: d05-core-rng-failure-note-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  SOURCE_SHA: "1927c304e14bc09e3cb18f10c2c338c5c18b0ee9"
  EVENT_BASE_SHA: ${{ github.event.pull_request.base.sha }}
  QUALIFICATION_CARRIER_SHA: ${{ github.event.pull_request.head.sha }}
  PYTHONUTF8: "1"

jobs:
  focused-linux:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.head_ref == 'qualification/2941-core-rng-failure-note-g8-168-20261006'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout exact qualification carrier
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.QUALIFICATION_CARRIER_SHA }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set exact CPython 3.11.16
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.11.16"

      - name: Bind exact source and qualification closure
        shell: bash
        run: |
          set -euo pipefail
          test "$EVENT_BASE_SHA" = "$SOURCE_SHA"
          test "$(git rev-parse HEAD)" = "$QUALIFICATION_CARRIER_SHA"
          test "$(git merge-base "$SOURCE_SHA" HEAD)" = "$SOURCE_SHA"
          changed="$(git diff --name-only "$SOURCE_SHA"..HEAD)"
          test "$changed" = ".github/workflows/d05_core_rng_failure_note_g8_168.yml"
          test "$(git rev-parse "$SOURCE_SHA:src/twelve_six/checkpoint/core.py")" = "bf50ded8b43b61236ff5dd2fc3856f5d876dcf7c"
          test "$(git rev-parse "$SOURCE_SHA:src/twelve_six/checkpoint/transactional_rng.py")" = "8c538670007b3a16a7be801b34e1a3ac3f170358"
          test "$(git rev-parse "$SOURCE_SHA:tests/test_checkpoint_failure_note_preservation.py")" = "8c2485445f45c9f4d945487ea2b0c2a210e375e2"
          python -m py_compile             src/twelve_six/checkpoint/core.py             src/twelve_six/checkpoint/transactional_rng.py             tests/test_checkpoint_failure_note_preservation.py
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

      - name: Install focused test dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'

      - name: Lint exact source closure
        shell: bash
        run: |
          set -euo pipefail
          python -m ruff check             src/twelve_six/checkpoint/core.py             src/twelve_six/checkpoint/transactional_rng.py             tests/test_checkpoint_failure_note_preservation.py

      - name: Execute rollback regressions
        shell: bash
        run: |
          set -euo pipefail
          python -m pytest -q             tests/test_checkpoint_failure_note_preservation.py             tests/test_checkpoint_ambient_rng_rollback_isolation.py             tests/test_checkpoint_cuda_rollback_fault_isolation.py             tests/test_checkpoint_rng_completeness_d02.py

      - name: Prove carrier remains clean
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$QUALIFICATION_CARRIER_SHA"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
