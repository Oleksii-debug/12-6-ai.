name: D03 PDR attributable subset replay temporary

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - d03/2324-pdr-attributable-subset-authority
    paths:
      - .github/workflows/d03_pdr_subset_replay_tmp.yml
      - tools/materialize_d03_common_pile_public_domain_review.py
      - tools/build_d03_pdr_attribution_sidecar_v1.py
      - tools/derive_d03_pdr_attributable_subset_authority_v1.py
      - configs/data/d03_common_pile_public_domain_review_v1.json
      - tests/test_d03_common_pile_public_domain_review.py
      - tests/test_d03_pdr_attribution_sidecar_v1.py
      - tests/test_d03_pdr_attributable_subset_authority_v1.py

permissions:
  contents: read

concurrency:
  group: d03-pdr-subset-replay-${{ github.ref }}
  cancel-in-progress: false

jobs:
  replay:
    name: independent subset replay ${{ matrix.slot }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        slot: [a, b]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Bind exact execution head
        run: test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - name: Focused and adversarial tests
        run: |
          python -m pip install pytest
          python -m pytest -q \
            tests/test_d03_common_pile_public_domain_review.py \
            tests/test_d03_pdr_attribution_sidecar_v1.py \
            tests/test_d03_pdr_attributable_subset_authority_v1.py
      - name: Download exact source snapshot
        env:
          SLOT: ${{ matrix.slot }}
        run: |
          set -euo pipefail
          root="/tmp/pdr-subset-${SLOT}"
          rm -rf "$root"
          mkdir -p "$root/src/v0" "$root/build"
          ROOT="$root" python - <<'PY'
          import hashlib
          import os
          import urllib.request
          from pathlib import Path

          revision = "177f70f044bd7a347616727c0f33ab4af9baa495"
          files = {
              "v0/00000_collections.jsonl.gz": (
                  "0a5cbe305d7f468aad95a8cfc4d5fae14132bc359ccf92fc3705072db33a46fd",
                  2_000_000,
              ),
              "v0/00000_essays.jsonl.gz": (
                  "825aed6a66ab14f89e1fe3110f67265d511994c52e5aed48b866a9e8a1bdeb4d",
                  2_500_000,
              ),
          }
          root = Path(os.environ["ROOT"]) / "src"
          for rel, (expected_sha, limit) in files.items():
              url = (
                  "https://huggingface.co/datasets/common-pile/public_domain_review/"
                  f"resolve/{revision}/{rel}?download=true"
              )
              request = urllib.request.Request(
                  url,
                  headers={
                      "User-Agent": "12-6-ai-D03-PDR-subset/1.0",
                      "Accept": "application/octet-stream",
                  },
              )
              with urllib.request.urlopen(request, timeout=120) as response:
                  payload = response.read(limit + 1)
              assert len(payload) <= limit
              assert hashlib.sha256(payload).hexdigest() == expected_sha
              target = root / rel
              target.parent.mkdir(parents=True, exist_ok=True)
              target.write_bytes(payload)
          PY
      - name: Reproduce candidate attribution and subset authority
        env:
          SLOT: ${{ matrix.slot }}
        run: |
          set -euo pipefail
          root="/tmp/pdr-subset-${SLOT}"
          python tools/materialize_d03_common_pile_public_domain_review.py \
            --config configs/data/d03_common_pile_public_domain_review_v1.json \
            --input-dir "$root/src" \
            --output "$root/build/materialized"
          python tools/build_d03_pdr_attribution_sidecar_v1.py \
            --config configs/data/d03_common_pile_public_domain_review_v1.json \
            --candidate "$root/build/materialized/candidate.jsonl" \
            --input-dir "$root/src" \
            --sidecar "$root/build/attribution.jsonl" \
            --report "$root/build/attribution-report.json"
          python tools/derive_d03_pdr_attributable_subset_authority_v1.py \
            --candidate "$root/build/materialized/candidate.jsonl" \
            --sidecar "$root/build/attribution.jsonl" \
            --attribution-report "$root/build/attribution-report.json" \
            --output "$root/build/subset-authority.json"
      - name: Build text-free replay evidence
        env:
          SLOT: ${{ matrix.slot }}
          EXECUTION_HEAD: ${{ github.sha }}
        run: |
          python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          slot = os.environ["SLOT"]
          root = Path(f"/tmp/pdr-subset-{slot}/build")
          authority_path = root / "subset-authority.json"
          authority = json.loads(authority_path.read_text(encoding="utf-8"))

          assert authority["attributable_record_count"] == 498
          assert authority["excluded_record_count"] == 668
          assert type(authority["attributable_normalized_utf8_bytes"]) is int
          assert 0 < authority["attributable_normalized_utf8_bytes"] < 4_795_007
          assert authority["source_rights_review_status"] == "REVIEW_REQUIRED"
          for key in (
              "pdr_source_admitted_records",
              "pdr_source_admitted_bytes",
              "canonical_capacity_credited",
              "training_authorized_bytes",
              "authorized_optimized_target_exposure",
              "optimizer_updates_executed_on_real_targets",
          ):
              assert type(authority[key]) is int and authority[key] == 0
          for key in (
              "tokenizer_fit_authorized",
              "training_executed",
              "learned_weights_created",
              "final_test_outcomes_read",
              "paid_compute_used",
              "foreign_pretrained_weights_used",
          ):
              assert authority[key] is False

          raw = authority_path.read_bytes()
          evidence = {
              "schema_version": "12-6.d03-pdr-attributable-subset-run.v1",
              "execution_slot": slot,
              "execution_head_sha": os.environ["EXECUTION_HEAD"],
              "source_revision": authority["source_revision"],
              "historical_candidate_jsonl_sha256": authority[
                  "historical_candidate_jsonl_sha256"
              ],
              "historical_attribution_sidecar_sha256": authority[
                  "historical_attribution_sidecar_sha256"
              ],
              "historical_exclusion_identity_sha256": authority[
                  "historical_exclusion_identity_sha256"
              ],
              "attributable_record_count": authority["attributable_record_count"],
              "excluded_record_count": authority["excluded_record_count"],
              "attributable_normalized_utf8_bytes": authority[
                  "attributable_normalized_utf8_bytes"
              ],
              "attributable_projection_identity_sha256": authority[
                  "attributable_projection_identity_sha256"
              ],
              "authority_identity_sha256": authority["authority_identity_sha256"],
              "authority_file_sha256": hashlib.sha256(raw).hexdigest(),
              "claim_boundary": {
                  "raw_text_persisted": False,
                  "record_ids_persisted": False,
                  "origin_urls_persisted": False,
                  "author_values_persisted": False,
                  "source_rights_review_status": "REVIEW_REQUIRED",
                  "pdr_source_admitted_records": 0,
                  "pdr_source_admitted_bytes": 0,
                  "canonical_capacity_credited": 0,
                  "training_authorized_bytes": 0,
                  "authorized_optimized_target_exposure": 0,
                  "tokenizer_fit_authorized": False,
                  "optimizer_updates_executed_on_real_targets": 0,
                  "training_executed": False,
                  "learned_weights_created": False,
                  "final_test_outcomes_read": False,
                  "paid_compute_used": False,
                  "foreign_pretrained_weights_used": False,
              },
          }
          Path(f"/tmp/pdr-subset-{slot}-evidence.json").write_text(
              json.dumps(evidence, sort_keys=True, separators=(",", ":")) + "\n",
              encoding="utf-8",
          )
          PY
      - name: Upload text-free replay evidence
        uses: actions/upload-artifact@v4
        with:
          name: d03-pdr-subset-evidence-${{ matrix.slot }}-${{ github.run_id }}
          path: /tmp/pdr-subset-${{ matrix.slot }}-evidence.json
          if-no-files-found: error
          retention-days: 30
      - name: Delete source candidate attribution and authority payloads
        if: always()
        env:
          SLOT: ${{ matrix.slot }}
        run: rm -rf "/tmp/pdr-subset-${SLOT}" "/tmp/pdr-subset-${SLOT}-evidence.json"
      - name: Keep tracked repository clean
        run: test -z "$(git status --porcelain --untracked-files=no)"

  compare:
    name: compare independent subset replays
    needs: replay
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Download replay evidence
        uses: actions/download-artifact@v4
        with:
          pattern: d03-pdr-subset-evidence-*-${{ github.run_id }}
          path: /tmp/compare
          merge-multiple: false
      - name: Require deterministic evidence
        env:
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          EXECUTION_HEAD: ${{ github.sha }}
        run: |
          python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          paths = sorted(Path("/tmp/compare").glob("**/*.json"))
          assert len(paths) == 2, paths
          rows = [json.loads(path.read_text(encoding="utf-8")) for path in paths]
          by_slot = {row["execution_slot"]: row for row in rows}
          assert set(by_slot) == {"a", "b"}
          a = dict(by_slot["a"])
          b = dict(by_slot["b"])
          a.pop("execution_slot")
          b.pop("execution_slot")
          assert a == b
          assert a["execution_head_sha"] == os.environ["EXECUTION_HEAD"]
          assert a["attributable_record_count"] == 498
          assert a["excluded_record_count"] == 668
          assert 0 < a["attributable_normalized_utf8_bytes"] < 4_795_007

          manifest = {
              "schema_version": "12-6.d03-pdr-attributable-subset-compare.v1",
              "run_id": int(os.environ["RUN_ID"]),
              "run_attempt": int(os.environ["RUN_ATTEMPT"]),
              "execution_head_sha": os.environ["EXECUTION_HEAD"],
              "execution_a_evidence_sha256": hashlib.sha256(paths[0].read_bytes()).hexdigest(),
              "execution_b_evidence_sha256": hashlib.sha256(paths[1].read_bytes()).hexdigest(),
              "deterministic_evidence": a,
          }
          Path("/tmp/compare-manifest.json").write_text(
              json.dumps(manifest, sort_keys=True, separators=(",", ":")) + "\n",
              encoding="utf-8",
          )
          print("PDR_SUBSET_COMPARE=" + json.dumps(manifest, sort_keys=True))
          PY
      - name: Upload compare manifest
        uses: actions/upload-artifact@v4
        with:
          name: d03-pdr-subset-compare-${{ github.run_id }}
          path: /tmp/compare-manifest.json
          if-no-files-found: error
          retention-days: 30
