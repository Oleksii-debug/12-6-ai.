name: Plan 4 Model Service
on:
  pull_request:
    paths:
      - "tools/plan4_model_service.py"
      - "tests/test_plan4_model_service.py"
      - "docs/PLAN4_SECTION6_MODEL_SERVICE.md"
      - ".github/workflows/plan4-model-service.yml"
  push:
    branches: [main]
    paths:
      - "tools/plan4_model_service.py"
      - "tests/test_plan4_model_service.py"
      - "docs/PLAN4_SECTION6_MODEL_SERVICE.md"
      - ".github/workflows/plan4-model-service.yml"

permissions:
  contents: read

jobs:
  stable-service:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install repository dependencies
        run: python -m pip install -e ".[dev]"
      - name: Lint canonical service adapter and fixture tests
        run: ruff check tools/plan4_model_service.py tests/test_plan4_model_service.py
      - name: Verify exact service and reference inference paths
        run: |
          python -m py_compile tools/plan4_model_service.py
          python -m pytest -q tests/test_plan4_model_service.py tests/test_inference_runtime_plan4.py
