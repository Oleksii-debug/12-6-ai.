name: NEXT100-063 Research Corpus V1 Intake

on:
  push:
    paths:
      - "configs/data/next100_063_research_corpus_v1_intake.json"
      - "tools/validate_next100_063_research_corpus_v1_intake.py"
      - "tests/test_next100_063_research_corpus_v1_intake.py"
      - ".github/workflows/next100-063-research-corpus-v1-intake.yml"
  pull_request:
    paths:
      - "configs/data/next100_063_research_corpus_v1_intake.json"
      - "tools/validate_next100_063_research_corpus_v1_intake.py"
      - "tests/test_next100_063_research_corpus_v1_intake.py"
      - ".github/workflows/next100-063-research-corpus-v1-intake.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Validate frozen intake
        run: python tools/validate_next100_063_research_corpus_v1_intake.py
      - name: Run adversarial tests
        run: python -m pytest -q tests/test_next100_063_research_corpus_v1_intake.py
