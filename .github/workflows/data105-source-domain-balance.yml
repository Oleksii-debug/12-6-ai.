name: DATA-105 Source Domain Balance

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-domain-balance-local-free:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11.16"
      - name: Bind exact source head
        env:
          EXPECTED_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SOURCE_SHA"
      - name: Install locked LOCAL_FREE runtime
        run: |
          python -m venv .data105
          .data105/bin/python -m pip install \
            --disable-pip-version-check --no-deps --require-hashes \
            -r requirements/locks/linux-x86_64/toolchain.lock.txt
          .data105/bin/python -m pip install \
            --disable-pip-version-check --no-deps --require-hashes \
            -r requirements/locks/linux-x86_64/runtime.lock.txt
          .data105/bin/python -m pip install \
            --disable-pip-version-check --no-deps --require-hashes \
            -r requirements/locks/linux-x86_64/dev.lock.txt
      - name: Focused source-balance static and contract tests
        env:
          PYTHONPATH: src
        run: |
          .data105/bin/python -m ruff check \
            src/twelve_six/data/source_balance.py \
            tests/test_data105_source_balance.py \
            tools/run_source_domain_balance.py
          .data105/bin/python -m pytest -q tests/test_data105_source_balance.py
      - name: Execute equal-budget DATA-105 experiment
        env:
          PYTHONPATH: src
        run: |
          .data105/bin/python tools/run_source_domain_balance.py \
            --config configs/data/corpus_v01.json \
            --out data105-source-domain-balance.json
          cat data105-source-domain-balance.json
      - name: Upload DATA-105 evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: data105-source-domain-balance
          path: |
            data105-source-domain-balance.json
            configs/data/source_domain_balance_v1.experimental.json
          if-no-files-found: error
          retention-days: 30
