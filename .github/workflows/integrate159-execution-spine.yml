name: INTEGRATE-159 Execution Spine Convergence

on:
  pull_request:
    branches:
      - milestone150/learned-base-ladder-v1-20260826
  workflow_dispatch:

permissions:
  contents: read

jobs:
  execution-spine:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      PYTHONPATH: src
      OMP_NUM_THREADS: "2"
      MKL_NUM_THREADS: "2"
    steps:
      - name: Checkout exact integration head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up exact Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11.16"

      - name: Bind exact source
        env:
          EXPECTED_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SOURCE_SHA"

      - name: Cheap execution and metadata preflight
        run: |
          set -euo pipefail
          python tools/converge_environment_metadata.py --check
          python tools/execution_bootstrap.py plan \
            --capabilities runtime,tests,lint \
            --command "python -m pytest -q"
          python tools/execution_bootstrap.py plan --capabilities tokenizer
          python tools/execution_bootstrap.py plan --capabilities runtime,cuda

      - name: Audit centralized workflow dependency setup
        run: |
          set -euo pipefail
          mkdir -p evidence/integrate159
          python tools/audit_execution_workflows.py --strict \
            --output evidence/integrate159/workflow-audit.json \
            .github/workflows/integrate159-execution-spine.yml
          python tools/audit_execution_workflows.py \
            --output evidence/integrate159/legacy-workflow-audit.json \
            .github/workflows/milestone150-learned-base-ladder-v1.yml

      - name: Bootstrap exact CPU research environment
        uses: ./.github/actions/execution-bootstrap
        with:
          capabilities: runtime,tests,lint
          venv: .spine
          command: python -m pytest -q
          manifest: evidence/integrate159/base-bootstrap.json

      - name: Environment self-test and CPU/CUDA separation
        run: |
          set -euo pipefail
          .spine/bin/python -m pip check
          .spine/bin/python -m pytest --version
          .spine/bin/python -m ruff --version
          .spine/bin/python - <<'PY'
          import importlib.metadata as metadata
          import json
          from pathlib import Path
          import torch

          manifest = json.loads(
              Path("evidence/integrate159/base-bootstrap.json").read_text(encoding="utf-8")
          )
          names = {
              (dist.metadata.get("Name") or "").lower().replace("_", "-").replace(".", "-")
              for dist in metadata.distributions()
          }
          forbidden = sorted(
              name
              for name in names
              if name.startswith("nvidia-") or name.startswith("cuda-") or name == "triton"
          )
          assert manifest["plan"]["cuda_packages_present"] is False
          assert forbidden == []
          assert torch.__version__ == "2.13.0+cpu"
          assert torch.version.cuda is None
          assert not torch.cuda.is_available()
          print("cpu_runtime_no_cuda_payloads=PASS")
          PY

      - name: Scoped scientific CI
        run: |
          set -euo pipefail
          .spine/bin/python -m compileall -q \
            tools/execution_bootstrap.py \
            tools/converge_environment_metadata.py \
            tools/audit_execution_workflows.py \
            src/twelve_six/integration/dependency_lock.py
          .spine/bin/python -m ruff check \
            tools/audit_execution_workflows.py \
            tests/test_execution_spine.py
          .spine/bin/python -m pytest -q \
            tests/test_execution_spine.py \
            tests/test_dependency_lock.py \
            tests/test_training_engine.py::test_optimizer_step_changes_weights_with_finite_metrics \
            tests/test_checkpointing.py::test_save_load_roundtrip_and_manifest

      - name: Tokenizer purpose runtime probe
        uses: ./.github/actions/execution-bootstrap
        with:
          capabilities: tokenizer
          venv: .tokenizer-role
          manifest: evidence/integrate159/tokenizer-bootstrap.json

      - name: Verify tokenizer purpose behavior
        run: |
          set -euo pipefail
          .tokenizer-role/bin/python - <<'PY'
          from tokenizers import Tokenizer
          from tokenizers.models import WordLevel

          tokenizer = Tokenizer(WordLevel({"[UNK]": 0, "hello": 1}, unk_token="[UNK]"))
          assert tokenizer.encode("hello").ids == [1]
          print("tokenizer_purpose_probe=PASS")
          PY

      - name: No-GPU CUDA-purpose preflight
        uses: ./.github/actions/execution-bootstrap
        with:
          capabilities: runtime,cuda
          venv: .cuda-role
          manifest: evidence/integrate159/cuda-bootstrap.json
          allow-no-gpu: "true"

      - name: Verify CUDA role without hardware claim
        run: |
          set -euo pipefail
          .cuda-role/bin/python - <<'PY'
          import json
          from pathlib import Path
          import torch

          manifest = json.loads(
              Path("evidence/integrate159/cuda-bootstrap.json").read_text(encoding="utf-8")
          )
          assert manifest["plan"]["cuda_packages_present"] is True
          assert manifest["preflight"]["cuda"]["software_capability_declared"] is True
          assert manifest["preflight"]["cuda"]["hardware_visible"] is False
          assert manifest["preflight"]["cuda"]["hardware_claim"] is False
          assert manifest["preflight"]["cuda"]["no_gpu_preflight"] is True
          assert torch.version.cuda == "13.0"
          assert not torch.cuda.is_available()
          print("cuda_no_gpu_preflight=PASS")
          PY

      - name: Formerly failing learned workflow pre-training section
        env:
          EXPECTED_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          .spine/bin/python -m twelve_six.milestone150_entrypoint \
            prepare \
            --repo-root . \
            --source-sha "$EXPECTED_SOURCE_SHA" \
            --output-dir evidence/integrate159/m150-preflight
          test -f evidence/integrate159/m150-preflight/ladder-truth.json
          echo "m150_pretraining_prepare=PASS"

      - name: Summarize execution-spine evidence
        run: |
          set -euo pipefail
          .spine/bin/python - <<'PY'
          import json
          from pathlib import Path

          root = Path("evidence/integrate159")
          for name in ("base-bootstrap.json", "tokenizer-bootstrap.json", "cuda-bootstrap.json"):
              data = json.loads((root / name).read_text(encoding="utf-8"))
              print(json.dumps({
                  "file": name,
                  "capabilities": data["plan"]["capabilities"],
                  "plan_sha256": data["plan"]["identity_sha256"],
                  "environment_sha256": data["identity_sha256"],
                  "cuda_packages_present": data["plan"]["cuda_packages_present"],
                  "cuda": data["preflight"]["cuda"],
              }, sort_keys=True))
          PY
