name: Research Corpus V1 intake

on:
  pull_request:
    paths:
      - "configs/data/research_corpus_v1_intake_v1.json"
      - "tools/validate_research_corpus_v1_intake.py"
      - "tests/test_research_corpus_v1_intake.py"
      - "docs/RESEARCH_CORPUS_V1_INTAKE_V1.md"
      - ".github/workflows/research-corpus-v1-intake.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Validate intake authority
        run: python tools/validate_research_corpus_v1_intake.py
      - name: Run focused fail-closed tests
        run: python -m unittest discover -s tests -p 'test_research_corpus_v1_intake.py' -v
      - name: Compile focused Python surfaces
        run: python -m compileall -q tools/validate_research_corpus_v1_intake.py tests/test_research_corpus_v1_intake.py
