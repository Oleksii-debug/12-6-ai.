name: Plan 4 ModelGateway
on:
  pull_request:
    paths:
      - "tools/plan4_model_gateway.py"
      - "tests/test_plan4_model_gateway.py"
      - "docs/PLAN4_SECTION7_MODELGATEWAY.md"
      - ".github/workflows/plan4-model-gateway.yml"
  push:
    branches: [main]
    paths:
      - "tools/plan4_model_gateway.py"
      - "tests/test_plan4_model_gateway.py"
      - "docs/PLAN4_SECTION7_MODELGATEWAY.md"
      - ".github/workflows/plan4-model-gateway.yml"
permissions:
  contents: read
jobs:
  gateway:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install repository dependencies
        run: python -m pip install -e ".[dev]"
      - name: Lint gateway and conformance
        run: ruff check tools/plan4_model_gateway.py tests/test_plan4_model_gateway.py
      - name: Verify gateway and incumbent serving semantics
        run: |
          python -m py_compile tools/plan4_model_gateway.py
          python -m pytest -q tests/test_plan4_model_gateway.py tests/test_plan4_model_service.py tests/test_inference_runtime_plan4.py
