name: Plan 1 Section 3 reuse admission qualification
on:
  pull_request:
    paths:
      - "src/twelve_six/third_party_reuse.py"
      - "tests/test_plan1_section3_reuse.py"
      - "configs/control/plan1_reuse_assets_v1.json"
      - ".github/workflows/plan1-section3.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reuse-and-lineage:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.11"
      - name: Run isolated Section 3 tests without dependency/runtime authority
        run: |
          python -m pip install --disable-pip-version-check pytest==8.4.2 ruff==0.12.12
          python -m compileall -q src/twelve_six/third_party_reuse.py tests/test_plan1_section3_reuse.py
          python -m ruff check src/twelve_six/third_party_reuse.py tests/test_plan1_section3_reuse.py
          PYTHONPATH=src python -m pytest -q tests/test_plan1_section3_reuse.py
