name: Plan 7 Section 12 LOCAL_FREE scaling qualification
on:
  pull_request:
    paths:
      - 'tests/test_plan7_terminal_scaling_qualification.py'
      - 'docs/PLAN7_SCALING_INFRASTRUCTURE_RELEASE.md'
      - '.github/workflows/plan7-terminal-qualification.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  plan7-s12:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e '.[dev]'
      - name: Scoped syntax and lint
        run: |
          python -m compileall -q src/twelve_six tests/test_plan7_terminal_scaling_qualification.py
          python -m ruff check tests/test_plan7_terminal_scaling_qualification.py
      - name: Integrated growth distributed transport and scale admission
        run: |
          python -m pytest -q \
            tests/test_plan7_terminal_scaling_qualification.py \
            tests/test_plan7_function_preserving_growth.py \
            tests/test_plan7_distributed_control.py \
            tests/test_plan7_distributed_transport.py \
            tests/test_plan7_product_scale_recipes.py \
            tests/test_plan7_billion_systems_gate.py
