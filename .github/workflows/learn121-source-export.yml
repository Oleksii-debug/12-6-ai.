name: LEARN-121 Exact Source Export

on:
  push:
    branches:
      - learn121/real-1m-long-20260826

permissions:
  contents: read

jobs:
  export-source:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Record exact source head
        run: |
          git rev-parse HEAD > LEARN121_SOURCE_SHA.txt
          git status --porcelain=v1
      - name: Package exact committed source
        run: git archive --format=tar.gz --output=learn121-source.tgz HEAD
      - name: Upload exact source package
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: learn121-exact-source
          path: learn121-source.tgz
          if-no-files-found: error
          retention-days: 7
