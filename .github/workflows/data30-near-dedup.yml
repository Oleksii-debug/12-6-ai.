name: DATA-30 Near Dedup Calibration

on:
  pull_request:
    paths:
      - "src/twelve_six/data/dedup_scale.py"
      - "src/twelve_six/data/near_dedup.py"
      - "tools/run_near_dedup_real_corpus.py"
      - "tests/test_near_dedup.py"
      - "configs/data/near_dedup_calibrated_v1.json"
      - "data/calibration/near_dedup_v1.json"
      - "data/synthetic/data10/uk-en-code-train.txt"
      - "docs/DATA30_NEAR_DEDUP.md"
      - ".github/workflows/data30-near-dedup.yml"
      - "pyproject.toml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  calibrated-near-dedup:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install repository dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]
      - name: Verify and install exact DataTrove incumbent
        shell: bash
        run: |
          mkdir -p /tmp/datatrove-wheel /tmp/tokenizers-wheel
          pip download --no-deps datatrove==0.10.0 -d /tmp/datatrove-wheel
          WHEEL="$(find /tmp/datatrove-wheel -name 'datatrove-0.10.0-*.whl' -print -quit)"
          test -n "$WHEEL"
          ACTUAL="$(sha256sum "$WHEEL" | awk '{print $1}')"
          EXPECTED="c7bb75deed2c3e88fb5138f8ea075a170ee98d6c94fc263829609091ea9c2b5d"
          echo "DataTrove wheel SHA256: $ACTUAL"
          test "$ACTUAL" = "$EXPECTED"

          pip download --no-deps tokenizers==0.23.1 -d /tmp/tokenizers-wheel
          TOKENIZERS_WHEEL="$(find /tmp/tokenizers-wheel -name 'tokenizers-0.23.1-*.whl' -print -quit)"
          test -n "$TOKENIZERS_WHEEL"
          TOKENIZERS_ACTUAL="$(sha256sum "$TOKENIZERS_WHEEL" | awk '{print $1}')"
          TOKENIZERS_EXPECTED="5075b405006415ea148a992d093699c66eb01952bf59f4d5727089a98bda45a4"
          echo "Tokenizers wheel SHA256: $TOKENIZERS_ACTUAL"
          test "$TOKENIZERS_ACTUAL" = "$TOKENIZERS_EXPECTED"

          pip install "$WHEEL" orjson regex "xxhash==3.8.1"
          pip install --no-deps "$TOKENIZERS_WHEEL"
      - name: Static and contract tests
        run: |
          ruff check src/twelve_six/data/near_dedup.py tests/test_near_dedup.py tools/run_near_dedup_real_corpus.py
          pytest -q tests/test_corpus_foundation.py tests/test_near_dedup.py
      - name: Execute calibration and bounded current-corpus pass
        shell: bash
        run: |
          mkdir -p reports/data30
          /usr/bin/time -v \
            env PYTHONPATH=src \
            python tools/run_near_dedup_real_corpus.py \
              --calibration data/calibration/near_dedup_v1.json \
              --data10-corpus data/synthetic/data10/uk-en-code-train.txt \
              --workspace /tmp/data30-near-dedup \
              --output reports/data30/near_dedup_report.json \
            2> reports/data30/usr_bin_time.txt
          cat reports/data30/usr_bin_time.txt >&2
      - name: Validate retained machine evidence
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          report = json.loads(Path("reports/data30/near_dedup_report.json").read_text())
          assert report["schema_version"] == "12-6.near-dedup-report.v1"
          assert report["engine"]["name"] == "DataTrove MinHash"
          assert report["engine"]["version"] == "0.10.0"
          assert report["engine"]["second_dedup_engine_created"] is False
          assert report["truth_boundary"]["semantic_deduplication_claimed"] is False
          assert report["truth_boundary"]["model_training_performed"] is False
          assert report["bounded_current_corpus_pass"]["input_records"] == 9
          assert report["bounded_current_corpus_pass"]["authority"] == "PROJECT_AUTHORED_SYNTHETIC_ONLY"
          assert report["real_candidate_corpus_gate"]["real_full_corpus_pass_claimed"] is False
          assert report["real_candidate_corpus_gate"]["status"] == "BLOCKED_NO_REAL_TRAINING_ELIGIBLE_UK_EN_CODE_CORPUS"
          for modality in ("natural", "code"):
              checks = report["calibration"]["determinism_and_restart"][modality]
              assert all(checks.values())
              selected = report["calibration"]["selected_policies"][modality]["name"]
              result = next(
                  item for item in report["calibration"]["candidate_results"][modality]
                  if item["policy"]["name"] == selected
              )
              assert result["metrics"]["recall"] >= 0.75
              assert result["metrics"]["false_removal_risk"] <= 0.25
          print(json.dumps({
              "report_sha256": report["report_sha256"],
              "selected_natural": report["calibration"]["selected_policies"]["natural"]["name"],
              "selected_code": report["calibration"]["selected_policies"]["code"]["name"],
              "current_removed_records": report["bounded_current_corpus_pass"]["removed_records"],
              "surviving_corpus_identity": report["bounded_current_corpus_pass"]["surviving_corpus"]["surviving_corpus_identity"],
              "real_corpus_status": report["real_candidate_corpus_gate"]["status"],
          }, sort_keys=True))
          PY
      - name: Upload DATA-30 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: data30-near-dedup-${{ github.sha }}
          path: |
            reports/data30/near_dedup_report.json
            reports/data30/usr_bin_time.txt
          if-no-files-found: warn
          retention-days: 30
