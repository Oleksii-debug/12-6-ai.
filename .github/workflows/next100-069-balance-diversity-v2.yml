name: NEXT100-069 Balance Diversity V2

on:
  pull_request:
    paths:
      - "configs/data/next100_069_balance_diversity_v2.json"
      - "configs/data/next100_065_cross_source_dedup_v3.json"
      - "tools/validate_next100_069_balance_diversity_v2.py"
      - "tests/test_next100_069_balance_diversity_v2.py"
      - "docs/NEXT100_069_BALANCE_DIVERSITY_V2.md"
      - ".github/workflows/next100-069-balance-diversity-v2.yml"
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      TWELVE_SIX_EXECUTION_PROFILE: LOCAL_FREE
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Validate frozen balance authority
        run: python tools/validate_next100_069_balance_diversity_v2.py
      - name: Run adversarial authority tests
        run: python -m unittest tests.test_next100_069_balance_diversity_v2 -v
