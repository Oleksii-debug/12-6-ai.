name: D05 HF metadata stability G8-171h

on:
  pull_request:
    branches:
      - repair/3049-hf-metadata-stability-g8-171g-20261006
    paths:
      - ".github/workflows/d05_hf_metadata_stability_g8_171h.yml"

permissions:
  contents: read

concurrency:
  group: d05-hf-metadata-stability-171h-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  SOURCE_SHA: "3e9db7244d80e16f1fcede8062f1ea0d690cea15"
  EVENT_BASE_SHA: ${{ github.event.pull_request.base.sha }}
  QUALIFICATION_CARRIER_SHA: ${{ github.event.pull_request.head.sha }}
  PYTHONUTF8: "1"

jobs:
  linux-hf-metadata-stability:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.head_ref == 'qualification/3058-hf-metadata-stability-g8-171h-20261006'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.QUALIFICATION_CARRIER_SHA }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.11.16"
      - name: Bind exact source
        shell: bash
        run: |
          set -euo pipefail
          test "$EVENT_BASE_SHA" = "$SOURCE_SHA"
          test "$(git rev-parse HEAD)" = "$QUALIFICATION_CARRIER_SHA"
          test "$(git merge-base "$SOURCE_SHA" HEAD)" = "$SOURCE_SHA"
          git diff --name-only "$SOURCE_SHA"..HEAD | sort > /tmp/changed.txt
          printf '%s\n' '.github/workflows/d05_hf_metadata_stability_g8_171h.yml' > /tmp/expected.txt
          cmp /tmp/expected.txt /tmp/changed.txt
          test "$(git rev-parse "$SOURCE_SHA:src/twelve_six/checkpoint/hf_export.py")" = "a7831cb2a27a3983796da3afaa876e01483a5aee"
          test "$(git rev-parse "$SOURCE_SHA:tests/test_hf_export_transactional.py")" = "cf39e14b62a8224f10d563d4ea1989c857e385b6"
          python -m py_compile src/twelve_six/checkpoint/hf_export.py tests/test_hf_export_transactional.py
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
      - name: Install focused dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'
      - name: Ruff
        shell: bash
        run: |
          set -euo pipefail
          python -m ruff check src/twelve_six/checkpoint/hf_export.py tests/test_hf_export_transactional.py
      - name: Pytest
        shell: bash
        run: |
          set -euo pipefail
          python -m pytest -q tests/test_hf_export_transactional.py
      - name: Clean-tree proof
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$QUALIFICATION_CARRIER_SHA"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          echo "D05_HF_METADATA_STABILITY_171H_LINUX=PASS_ZERO_SCIENTIFIC_CREDIT"

  windows-hf-metadata-stability:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.head_ref == 'qualification/3058-hf-metadata-stability-g8-171h-20261006'
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.QUALIFICATION_CARRIER_SHA }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.11.16"
      - name: Bind exact source
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          if ($env:EVENT_BASE_SHA -ne $env:SOURCE_SHA) { throw "base SHA drifted" }
          if ((git rev-parse HEAD).Trim() -ne $env:QUALIFICATION_CARRIER_SHA) { throw "carrier SHA drifted" }
          if ((git merge-base $env:SOURCE_SHA HEAD).Trim() -ne $env:SOURCE_SHA) { throw "carrier ancestry drifted" }
          $changed = @(git diff --name-only "$env:SOURCE_SHA..HEAD" | Sort-Object)
          $expected = @(".github/workflows/d05_hf_metadata_stability_g8_171h.yml")
          if ($changed.Count -ne $expected.Count -or (Compare-Object $expected $changed)) { throw "unexpected carrier delta: $changed" }
          if ((git rev-parse "$($env:SOURCE_SHA):src/twelve_six/checkpoint/hf_export.py").Trim() -ne "a7831cb2a27a3983796da3afaa876e01483a5aee") { throw "hf_export blob drifted" }
          if ((git rev-parse "$($env:SOURCE_SHA):tests/test_hf_export_transactional.py").Trim() -ne "cf39e14b62a8224f10d563d4ea1989c857e385b6") { throw "test blob drifted" }
          python -m py_compile src/twelve_six/checkpoint/hf_export.py tests/test_hf_export_transactional.py
          $dirty = git status --porcelain=v1 --untracked-files=all
          if ($dirty) { throw "carrier dirty before execution: $dirty" }
      - name: Install focused dependencies
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Ruff
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          python -m ruff check src/twelve_six/checkpoint/hf_export.py tests/test_hf_export_transactional.py
      - name: Pytest
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          python -m pytest -q tests/test_hf_export_transactional.py
      - name: Clean-tree proof
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          if ((git rev-parse HEAD).Trim() -ne $env:QUALIFICATION_CARRIER_SHA) { throw "carrier SHA changed" }
          $dirty = git status --porcelain=v1 --untracked-files=all
          if ($dirty) { throw "carrier dirty after execution: $dirty" }
          Write-Output "D05_HF_METADATA_STABILITY_171H_WINDOWS=PASS_ZERO_SCIENTIFIC_CREDIT"
