name: SCALE-03 S3 10M Runtime Probe

on:
  pull_request:
    paths:
      - "src/twelve_six/s3_engineering.py"
      - "tools/run_s3_10m_engineering_probe.py"
      - "tests/test_s3_10m_engineering.py"
      - "configs/runs/s3_10m_scale03_gpu_pilot.json"
      - "docs/S3_10M_SCALE03_ENGINEERING.md"
      - ".github/workflows/scale03-s3-10m-runtime.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  locked-cpu-s3-10m:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Prove exact source checkout
        run: test "$(git rev-parse HEAD)" = "$SOURCE_SHA"

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11.16"

      - name: Verify D08 locked environment and repository checks
        run: >-
          python tools/verify_locked_environment.py
          --profile linux-x86_64
          --source-sha "$SOURCE_SHA"
          --evidence-out locked-environment-linux-x86_64.json
          --run-repo-checks

      - name: Create exact locked execution environment
        run: |
          python -m venv .scale03-locked
          .scale03-locked/bin/python -m pip install --disable-pip-version-check --require-hashes --no-deps -r requirements/locks/linux-x86_64/toolchain.lock.txt
          .scale03-locked/bin/python -m pip install --disable-pip-version-check --require-hashes --no-deps -r requirements/locks/linux-x86_64/runtime.lock.txt
          .scale03-locked/bin/python -m pip install --disable-pip-version-check --require-hashes --no-deps -r requirements/locks/linux-x86_64/dev.lock.txt
          PIP_NO_INDEX=1 PIP_DISABLE_PIP_VERSION_CHECK=1 .scale03-locked/bin/python -m pip install --no-deps --no-build-isolation -e .

      - name: Focused exact geometry and tokenizer-boundary tests
        run: .scale03-locked/bin/python -m pytest -q tests/test_s3_10m_engineering.py

      - name: Execute real 9,999,680-param forward backward update checkpoint reload inference probe
        run: |
          .scale03-locked/bin/python tools/run_s3_10m_engineering_probe.py \
            --repo-root . \
            --source-sha "$SOURCE_SHA" \
            --output s3-10m-engineering-evidence.json \
            --device cpu \
            --precision fp32 \
            --batch-size 1 \
            --sequence-length 256 \
            --optimizer-steps 1 \
            --gradient-accumulation-steps 1 \
            --checkpoint-every 1 \
            --seed 20260825 \
            --cpu-threads 2

      - name: Validate evidence truth boundary
        run: |
          .scale03-locked/bin/python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          path = Path("s3-10m-engineering-evidence.json")
          report = json.loads(path.read_text(encoding="utf-8"))
          assert report["schema"] == "12-6.s3-10m-engineering-evidence.v1"
          assert report["source_sha"] == os.environ["SOURCE_SHA"]
          assert report["canonical_base"] == "random_init"
          assert report["paid_compute"] is False
          assert report["promotion_authority"] is False
          assert report["candidate"]["analytic_parameters"] == 9_999_680
          assert report["candidate"]["instantiated_trainable_parameters"] == 9_999_680
          assert report["execution"]["parameter_changed"] is True
          assert report["execution"]["optimizer_steps"] == 1
          assert report["checkpoint"]["format"] == "12-6-checkpoint"
          assert report["checkpoint"]["format_version"] == 1
          assert report["checkpoint"]["restored_optimizer_step"] == 1
          assert report["memory"]["snapshot_is_full_payload_in_memory"] is True
          assert report["memory"]["verified_snapshot_payload_bytes"] > report["memory"]["model_parameter_bytes"]
          assert report["inference"]["stateless_first_party_generation"] == "PASS_MECHANICS_ONLY"
          assert report["inference"]["canonical_tokenizer_bound_stage_inference"] == "BLOCKED_UNTIL_S3_TOKENIZER_FREEZE"
          assert report["inference"]["kv_cache"] == "NOT_ON_EXACT_GREEN_BASE__PR_138_CURRENT_HEAD_RED"
          assert report["truth_boundary"]["capability_evidence"] is False
          assert report["truth_boundary"]["gpu_execution"] is False
          expected = report.pop("report_sha256")
          encoded = json.dumps(
              report,
              sort_keys=True,
              separators=(",", ":"),
              ensure_ascii=False,
          ).encode("utf-8")
          assert hashlib.sha256(encoded).hexdigest() == expected
          PY

      - name: Show measured evidence
        run: cat s3-10m-engineering-evidence.json

      - name: Upload exact-head engineering evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: scale03-s3-10m-evidence-${{ env.SOURCE_SHA }}
          path: |
            locked-environment-linux-x86_64.json
            s3-10m-engineering-evidence.json
          if-no-files-found: error
          retention-days: 30
