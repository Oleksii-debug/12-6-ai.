          )
          args=()
          for fragment in "${fragments[@]}"; do
            test -s "$fragment"
            args+=(--rematerialized-jsonl "$fragment")
          done
          for pass_id in 1 2; do
            python tools/run_d03_selected_raw_assembly_v1.py               --plan-json "$RUNNER_TEMP/plan/plan.json"               --composition-json "$RUNNER_TEMP/balance/composition.json"               --balance-result-json "$RUNNER_TEMP/balance/balance-result.json"               --base-raw-jsonl "$RUNNER_TEMP/base/survivor_records.jsonl"               "${args[@]}"               --output-raw-jsonl "$RUNNER_TEMP/selected-20m-${pass_id}.jsonl"               --output-receipt "$RUNNER_TEMP/assembly-${pass_id}.json"
          done
          cmp "$RUNNER_TEMP/selected-20m-1.jsonl" "$RUNNER_TEMP/selected-20m-2.jsonl"
