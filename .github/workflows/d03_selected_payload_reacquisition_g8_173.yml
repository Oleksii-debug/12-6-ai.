name: D03 selected payload reacquisition G8 173

on:
  pull_request:
    branches:
      - execution/3068-selected-raw-rematerialization-g6-161-20261006
    paths:
      - ".github/workflows/d03_selected_payload_reacquisition_g8_173.yml"
      - "tools/run_d03_selected_payload_reacquisition_v1.py"
      - "tests/test_run_d03_selected_payload_reacquisition_v1.py"

permissions:
  actions: read
  contents: read

concurrency:
  group: d03-selected-payload-reacquisition-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  materialize-selected-20m:
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.head_ref == 'execution/3069-selected-payload-reacquire-g8-173-20261006'
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    env:
      EXECUTION_HEAD: ${{ github.event.pull_request.head.sha }}
      PARENT_HEAD: "cb119fec17184432b11fe0a0372b74022fbc996d"
      REACQUIRE_BLOB: "3b6c5fb3b12d7c7471ba4df469a214e022c9f746"
      REACQUIRE_TEST_BLOB: "7d7604dcf05966cd3cf482f556fa70d9c59ed8f5"
      ASSEMBLER_BLOB: "e1e428a6d26c96f52cf900018d4e3da3cd21963f"
      PLAN_RUNNER_BLOB: "5a24c137d6368538f170cdd6c8fdf8709a43f7c0"
      PLAN_ARTIFACT_ID: "11443423543"
      PLAN_ZIP_SHA256: "9717f36a4956aba5432f111a0bf58f6aa70dc752bcd28676203da825124eec01"
      PLAN_FILE_SHA256: "8e526a876ea2a2a05ee55847d5669b594acd6c72f13861b690a30b69ef42b996"
      BALANCE_ARTIFACT_ID: "11441000276"
      BALANCE_ZIP_SHA256: "85ae6ace4914cd8fae86cef71b8ac63cf73c97b1386ff7e01a716692ddce6c10"
      COMPOSITION_FILE_SHA256: "8a737ca830d0e98095b258c31bb1fc6f5e0c294384484b3f266dad654522850e"
      BALANCE_FILE_SHA256: "655eee7aa4fd0aeb7d124405a420a7148efb0474951f9843e0476bc4f05b56d4"
      BASE_ARTIFACT_ID: "11181030848"
      BASE_ZIP_SHA256: "3eef740b52e9db962b01b63a0a48474f735694dca4c3848e3e9c53d8cd7f1988"
      BASE_RAW_SHA256: "3aa6235e07da4fa50c9642639cc0d93d7da22a6b602d822c7c7ca6e1f4a7486a"
      UBUNTU_PARENT_ARTIFACT_ID: "11347350536"
      UBUNTU_PARENT_ZIP_SHA256: "24750d7f3d7f179f6632da142eeb76283ea6e96a20ba77f5d293c39ece1cb33c"
      LOC_CLEAN_ARTIFACT_ID: "10820342689"
      LOC_CLEAN_ZIP_SHA256: "99069ce2183abbbc374749cca5c538efa259df0c64658a9b88cc96b25c0fbba0"
      LOC_PARENT_ARTIFACT_ID: "11357173588"
      LOC_PARENT_ZIP_SHA256: "379a7984b86afde8ea3bf0d55ee9f3c19a045799b0ee106e8bb19bf4680054d5"
      LOC_PROOF_ARTIFACT_ID: "11357043314"
      LOC_PROOF_ZIP_SHA256: "befa277e2c624b7719295907c863db383a8bc2f206271b073447f2e4d95a254c"
      LANGUK_PARENT_ARTIFACT_ID: "11436803293"
      LANGUK_PARENT_ZIP_SHA256: "60e28a851ddadcee7eda44c827d70988004fff60d241da16e4f8acd89457c961"
      LANGUK_PROOF_ARTIFACT_ID: "11437337310"
      LANGUK_PROOF_ZIP_SHA256: "8135bb7e2d62a0a39e460dc72a735f7d8bdc8eb3ac8691e8074d47b7141b3a0e"
      LANGUK_SOURCE_URL: "https://huggingface.co/datasets/lang-uk/court-decisions-uk/resolve/289c0316fc076db3e1607db6776a29df42f4ffc5/2024-5K-supreme-court-decisions-deduplicated.parquet?download=true"
      LANGUK_SOURCE_SHA256: "9b8870d10695715e4a0540c6f8fdca381599c0e6cdbaf3ecdf3c0782207b6597"
      LANGUK_SOURCE_BYTES: "20220778"
      LESIA_PARENT_ARTIFACT_ID: "11373941621"
      LESIA_PARENT_ZIP_SHA256: "4d26bc6d451bf7765b341317ed73cf40ff24631ae02fbf2565b6b3b8a55bae80"
      LESIA_PROOF_ARTIFACT_ID: "11373372018"
      LESIA_PROOF_ZIP_SHA256: "e94814590131fddb0727b7afca763a006e69187d855dc7cf5d64074fc767be9d"
      NBU_PARENT_ARTIFACT_ID: "11375922011"
      NBU_PARENT_ZIP_SHA256: "8a5b5624d75caa57734d3efa86fb0a89f537a7e978bdd6edc4118be1d27ce744"
      NBU_PHYSICAL_ARTIFACT_ID: "11374275477"
      NBU_PHYSICAL_ZIP_SHA256: "ba7d7148a2fb4a389ad16396690bdcc72ccbf9077e5007b74d6cdca51cc24697"
      FRANKO_PARENT_ARTIFACT_ID: "11341482304"
      FRANKO_PARENT_ZIP_SHA256: "60cd01afb53bbec2f0b2cb66dbe2b299ffec60592a8e9c5fe75a178476f803ac"
      FRANKO_PROOF_ARTIFACT_ID: "11341042046"
      FRANKO_PROOF_ZIP_SHA256: "76d364aed9ea14fdde2d3ca1c5ddd932582434d80955d6bc132321e7282ea39f"
      RADA_RETAINED_ARTIFACT_ID: "11281540677"
      RADA_RETAINED_ZIP_SHA256: "2d0351a7ae6bbcd6ca5bc5d84c115717a467dbad51bd9b17e71072aed1827aeb"
      RADA_PARENT_ARTIFACT_ID: "11389910019"
      RADA_PARENT_ZIP_SHA256: "63f9e1bf5713989a155429c8862196cacaff3207a7e0fe97586f7dd2c98881f9"
      RADA_DATA232_ARTIFACT_ID: "11415639104"
      RADA_DATA232_ZIP_SHA256: "54f0c5729c2087e13400413acf63b1eabdaa7bd697c03bf967dc44978b05abb7"
      POPPLER_VERSION: "25.06.0"
      POPPLER_TARBALL_SHA256: "8199532d38984fab46dbd0020ec9c40f20e928e33e9b4cc6043572603a821d83"
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Checkout exact execution head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set exact CPython 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11.16"

      - name: Bind child scope and focused tests
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXECUTION_HEAD"
          test "$(git merge-base "$PARENT_HEAD" HEAD)" = "$PARENT_HEAD"
          mapfile -t changed < <(git diff --name-only "$PARENT_HEAD"..HEAD | sort)
          test "${#changed[@]}" -eq 3
          test "${changed[0]}" = ".github/workflows/d03_selected_payload_reacquisition_g8_173.yml"
          test "${changed[1]}" = "tests/test_run_d03_selected_payload_reacquisition_v1.py"
          test "${changed[2]}" = "tools/run_d03_selected_payload_reacquisition_v1.py"
          test "$(git hash-object tools/run_d03_selected_payload_reacquisition_v1.py)" = "$REACQUIRE_BLOB"
          test "$(git hash-object tests/test_run_d03_selected_payload_reacquisition_v1.py)" = "$REACQUIRE_TEST_BLOB"
          test "$(git hash-object tools/run_d03_selected_raw_assembly_v1.py)" = "$ASSEMBLER_BLOB"
          test "$(git hash-object tools/run_d03_selected_raw_materialization_plan_v1.py)" = "$PLAN_RUNNER_BLOB"
          python -m py_compile tools/run_d03_selected_payload_reacquisition_v1.py
          python -m pip install --disable-pip-version-check "ruff==0.16.10" "pytest>=8,<9"
          ruff check tools/run_d03_selected_payload_reacquisition_v1.py tests/test_run_d03_selected_payload_reacquisition_v1.py
          PYTHONPATH="$GITHUB_WORKSPACE/src:$GITHUB_WORKSPACE" pytest -q tests/test_run_d03_selected_payload_reacquisition_v1.py
          echo "PY311=$(command -v python)" >> "$GITHUB_ENV"

      - name: Fetch plan, balance and retained base raw
        shell: bash
        run: |
          set -euo pipefail
          fetch_artifact() {
            id="$1"
            expected="$2"
            output="$3"
            curl --fail --location --retry 5 --retry-all-errors               -H "Authorization: Bearer $GH_TOKEN"               -H "Accept: application/vnd.github+json"               -H "X-GitHub-Api-Version: 2022-11-28"               -o "$output"               "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/actions/artifacts/$id/zip"
            test "$(sha256sum "$output" | cut -d' ' -f1)" = "$expected"
          }
          mkdir -p "$RUNNER_TEMP/plan" "$RUNNER_TEMP/balance" "$RUNNER_TEMP/base" "$RUNNER_TEMP/fragments"
          fetch_artifact "$PLAN_ARTIFACT_ID" "$PLAN_ZIP_SHA256" "$RUNNER_TEMP/plan/artifact.zip"
          test "$(zipinfo -1 "$RUNNER_TEMP/plan/artifact.zip")" = "plan-1.json"
          unzip -p "$RUNNER_TEMP/plan/artifact.zip" plan-1.json > "$RUNNER_TEMP/plan/plan.json"
          test "$(sha256sum "$RUNNER_TEMP/plan/plan.json" | cut -d' ' -f1)" = "$PLAN_FILE_SHA256"

          fetch_artifact "$BALANCE_ARTIFACT_ID" "$BALANCE_ZIP_SHA256" "$RUNNER_TEMP/balance/artifact.zip"
          unzip -p "$RUNNER_TEMP/balance/artifact.zip" composition.json > "$RUNNER_TEMP/balance/composition.json"
          unzip -p "$RUNNER_TEMP/balance/artifact.zip" balance-result.json > "$RUNNER_TEMP/balance/balance-result.json"
          test "$(sha256sum "$RUNNER_TEMP/balance/composition.json" | cut -d' ' -f1)" = "$COMPOSITION_FILE_SHA256"
          test "$(sha256sum "$RUNNER_TEMP/balance/balance-result.json" | cut -d' ' -f1)" = "$BALANCE_FILE_SHA256"

          fetch_artifact "$BASE_ARTIFACT_ID" "$BASE_ZIP_SHA256" "$RUNNER_TEMP/base/artifact.zip"
          unzip -p "$RUNNER_TEMP/base/artifact.zip" survivor_records.jsonl > "$RUNNER_TEMP/base/survivor_records.jsonl"
          test "$(sha256sum "$RUNNER_TEMP/base/survivor_records.jsonl" | cut -d' ' -f1)" = "$BASE_RAW_SHA256"

      - name: Prepare exact source-lane worktrees
        shell: bash
        run: |
          set -euo pipefail
          add_lane() {
            key="$1"
            pr="$2"
            head="$3"
            root="$RUNNER_TEMP/lane-$key"
            git fetch --no-tags origin "refs/pull/$pr/head"
            test "$(git rev-parse FETCH_HEAD)" = "$head"
            git worktree add --detach "$root" "$head"
            test "$(git -C "$root" rev-parse HEAD)" = "$head"
            git -C "$root" diff --quiet HEAD --
            git -C "$root" diff --cached --quiet HEAD --
          }
          add_lane code 2752 62dc9f487e0b3dd9eb2a8367a01061f8f55799ef
          add_lane ubuntu 2780 fb9c3d9c137b0ccacf40dbee8d6dc75db7a2209f
          add_lane loc 2788 0aeddc6c32917dee110a669ffea55d55a399c1c9
          add_lane languk 3039 f6a2a440aacebec6a44a5f2ba955902970ff4d50
          add_lane lesia 2810 1d594e048365fd2121433210b83c0dc9069c50bf
          add_lane nbu 2815 dc4822ec1365494507bca1d67bab1b334a3fa143
          add_lane rada 2920 a63d7c88ccb5fa380b7af4b44bde32433cf35877
          add_lane franko 2766 4280ac3a6b901906b0b38b5ff0ce0e74a90dd154

      - name: Reacquire exact code delta
        shell: bash
        run: |
          set -euo pipefail
          "$PY311" tools/run_d03_selected_payload_reacquisition_v1.py code             --plan-json "$RUNNER_TEMP/plan/plan.json"             --composition-json "$RUNNER_TEMP/balance/composition.json"             --lane-root "$RUNNER_TEMP/lane-code"             --output-jsonl "$RUNNER_TEMP/fragments/code.jsonl"

      - name: Reacquire exact Ubuntu IRC survivors
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/ubuntu"
          mkdir -p "$root/parent" "$root/source"
          curl --fail --location --retry 5 --retry-all-errors             -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json"             -o "$root/parent.zip"             "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/actions/artifacts/$UBUNTU_PARENT_ARTIFACT_ID/zip"
          test "$(sha256sum "$root/parent.zip" | cut -d' ' -f1)" = "$UBUNTU_PARENT_ZIP_SHA256"
          unzip -q "$root/parent.zip" -d "$root/parent"
          test "$(sha256sum "$root/parent/_temp/pass-1/survivors.json" | cut -d' ' -f1)" = "6cd93687c6b1063f62c19fc7be90001bc06a87cc320b1cabaa1b31a3a59bbdb2"
          test "$(sha256sum "$root/parent/_temp/pass-1/evidence.json" | cut -d' ' -f1)" = "581ee1d16abed2542978300475f93b41f6ff386d9fcb6ab6fa97d12dd2a15705"
          test "$(sha256sum "$root/parent/12-6-ai./12-6-ai./ubuntu-irc-two-clean-proof.json" | cut -d' ' -f1)" = "27c7addb9897c1317eff260767ee67c6bd7761532e9ba2a9de5237c67efb7a18"
          PYTHONPATH="$RUNNER_TEMP/lane-ubuntu/src" "$PY311"             "$RUNNER_TEMP/lane-ubuntu/tools/materialize_d03_common_pile_ubuntu_irc_v1.py"             --shard "$root/source/source.jsonl.gz"             --output-jsonl "$root/source/candidate.jsonl"             --report "$root/source/materialization.json"             --download
          test "$(sha256sum "$root/source/candidate.jsonl" | cut -d' ' -f1)" = "d6a0eaea27313e0d5146bc2a0624104541923ef06b12f01c22b3ccf6956eb6c2"
          "$PY311" tools/run_d03_selected_payload_reacquisition_v1.py ubuntu             --plan-json "$RUNNER_TEMP/plan/plan.json"             --composition-json "$RUNNER_TEMP/balance/composition.json"             --lane-root "$RUNNER_TEMP/lane-ubuntu"             --parent-survivors "$root/parent/_temp/pass-1/survivors.json"             --parent-evidence "$root/parent/_temp/pass-1/evidence.json"             --parent-proof "$root/parent/12-6-ai./12-6-ai./ubuntu-irc-two-clean-proof.json"             --candidate-jsonl "$root/source/candidate.jsonl"             --output-jsonl "$RUNNER_TEMP/fragments/ubuntu.jsonl"

      - name: Reacquire exact PEP LoC survivor payloads
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/loc"
          mkdir -p "$root/parent-pass" "$root/parent-proof" "$root/clean" "$root/source"
          curl --fail --location --retry 5 --retry-all-errors -H "Authorization: Bearer $GH_TOKEN"             -o "$root/pass.zip"             "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/actions/artifacts/$LOC_PARENT_ARTIFACT_ID/zip"
          test "$(sha256sum "$root/pass.zip" | cut -d' ' -f1)" = "$LOC_PARENT_ZIP_SHA256"
          unzip -q "$root/pass.zip" -d "$root/parent-pass"
          test "$(sha256sum "$root/parent-pass/expanded-v10-survivors.json" | cut -d' ' -f1)" = "6f93ca5d730aaa1e07d8429f77606a43705697667e5a786bfda17506ac394d72"
          test "$(sha256sum "$root/parent-pass/evidence.json" | cut -d' ' -f1)" = "a7c57f08708b718833272b9d41a67e39cc679476661486a7689f96cb405615fd"
          curl --fail --location --retry 5 --retry-all-errors -H "Authorization: Bearer $GH_TOKEN"             -o "$root/proof.zip"             "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/actions/artifacts/$LOC_PROOF_ARTIFACT_ID/zip"
          test "$(sha256sum "$root/proof.zip" | cut -d' ' -f1)" = "$LOC_PROOF_ZIP_SHA256"
          unzip -q "$root/proof.zip" -d "$root/parent-proof"
          test "$(sha256sum "$root/parent-proof/d03-pep-loc-v10-two-clean-proof.json" | cut -d' ' -f1)" = "2f3ce844a8d62203fa1ef54407842ad474059640ef06444fa62bf83ea8b79400"

          curl --fail --location --retry 5 --retry-all-errors -H "Authorization: Bearer $GH_TOKEN"             -o "$root/clean.zip"             "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/actions/artifacts/$LOC_CLEAN_ARTIFACT_ID/zip"
          test "$(sha256sum "$root/clean.zip" | cut -d' ' -f1)" = "$LOC_CLEAN_ZIP_SHA256"
          unzip -q "$root/clean.zip" -d "$root/clean"
          PYTHONPATH="$RUNNER_TEMP/lane-loc/src:$RUNNER_TEMP/lane-loc/tools" "$PY311"             "$RUNNER_TEMP/lane-loc/tools/prepare_data232_ephemeral_handoff_v1.py"             --repo-root "$RUNNER_TEMP/lane-loc"             --records-jsonl "$root/clean/records.jsonl"             --record-inventory-json "$root/clean/inventory.json"             --materialization-evidence-json "$root/clean/evidence.json"             --output-dir "$root/clean-handoff"             --expected-carrier-git-sha "0aeddc6c32917dee110a669ffea55d55a399c1c9"
          test "$(sha256sum "$root/clean-handoff/training_records.jsonl" | cut -d' ' -f1)" = "3458afe0380ea45d328ad3f004b21845a188ca69f2f7a83c24999e9e53268e53"
          test "$(sha256sum "$root/clean-handoff/training_handoff.json" | cut -d' ' -f1)" = "80bcf2dd28f0d13795ceea01b358c7149b636f55f17b29575d14313b5cee99ee"

          PYTHONPATH="$RUNNER_TEMP/lane-loc/src" "$PY311" "$RUNNER_TEMP/lane-loc/tools/materialize_d03_peps.py"             --repo-root "$RUNNER_TEMP/lane-loc" --output-dir "$root/source/pep"
          test "$(sha256sum "$root/source/pep/pep-candidate.jsonl" | cut -d' ' -f1)" = "65d1cf23354efc5a66d7132b67602a7af1715e18a0fb77e729595866c25d33c3"
          test "$(sha256sum "$root/source/pep/pep-report.json" | cut -d' ' -f1)" = "bc217b3b795bfe5001b8ef266270eee10089c88bc148e8a8f0fa540c2451edcb"

          curl --fail --location --retry 3 --retry-all-errors             "https://huggingface.co/datasets/common-pile/library_of_congress/resolve/d31bdba02cdad5104ccec2c02ae799c0bcb5a9a7/data/00000_loc_books.jsonl.gz"             -o "$root/source/loc-shard.jsonl.gz"
          test "$(stat -c %s "$root/source/loc-shard.jsonl.gz")" = "358594502"
          test "$(sha256sum "$root/source/loc-shard.jsonl.gz" | cut -d' ' -f1)" = "a6a6023d9cae067b5531ba84537877c180ab3ff1579f99aeac446d65d465ae0f"
          PYTHONPATH="$RUNNER_TEMP/lane-loc/src" "$PY311" "$RUNNER_TEMP/lane-loc/tools/materialize_d03_common_pile_loc.py"             --repo-root "$RUNNER_TEMP/lane-loc"             --shard "$root/source/loc-shard.jsonl.gz"             --output-dir "$root/source/loc"
          test "$(sha256sum "$root/source/loc/loc-candidate.jsonl" | cut -d' ' -f1)" = "f87201d71eb8c3f2510cdf2c9b3ce1a32b83d1a11198e8a1ff0ad67d0a3fec20"
          test "$(sha256sum "$root/source/loc/loc-report.json" | cut -d' ' -f1)" = "ae8de852ffeea6d2f697641b2f941eeb044e3377565d0bc1b3b7ba8b6cf3133a"
          "$PY311" tools/run_d03_selected_payload_reacquisition_v1.py loc             --plan-json "$RUNNER_TEMP/plan/plan.json"             --composition-json "$RUNNER_TEMP/balance/composition.json"             --lane-root "$RUNNER_TEMP/lane-loc"             --parent-survivors "$root/parent-pass/expanded-v10-survivors.json"             --parent-evidence "$root/parent-pass/evidence.json"             --parent-proof "$root/parent-proof/d03-pep-loc-v10-two-clean-proof.json"             --clean-training-records "$root/clean-handoff/training_records.jsonl"             --clean-training-handoff "$root/clean-handoff/training_handoff.json"             --pep-candidate "$root/source/pep/pep-candidate.jsonl"             --pep-report "$root/source/pep/pep-report.json"             --loc-candidate "$root/source/loc/loc-candidate.jsonl"             --loc-report "$root/source/loc/loc-report.json"             --output-jsonl "$RUNNER_TEMP/fragments/loc.jsonl"

      - name: Build hash-locked PyArrow runtime
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/eval290-runtime"
          git fetch --no-tags origin refs/pull/402/head
          test "$(git rev-parse FETCH_HEAD)" = "029514654829cebc149cff6fc1fea2a8ba4fa566"
          git worktree add --detach "$root" 029514654829cebc149cff6fc1fea2a8ba4fa566
          "$PY311" "$root/tools/execution_bootstrap.py" bootstrap             --repo-root "$root"             --capabilities "runtime,tests"             --venv "$RUNNER_TEMP/eval290-venv"             --manifest "$RUNNER_TEMP/eval290-environment.json"             --command "python -m pytest -q tests/test_eval290_ua_selection.py"
          git -C "$root" show             "029514654829cebc149cff6fc1fea2a8ba4fa566:requirements/locks/linux-x86_64/eval290-extra.lock.txt"             > "$RUNNER_TEMP/eval290-extra.lock.txt"
          "$RUNNER_TEMP/eval290-venv/bin/python" -m pip install             --disable-pip-version-check --require-hashes --no-deps             -r "$RUNNER_TEMP/eval290-extra.lock.txt"
          "$RUNNER_TEMP/eval290-venv/bin/python" -c             'import numpy, pyarrow; assert numpy.__version__ == "2.4.6"; assert pyarrow.__version__ == "25.0.1"'

      - name: Reacquire exact Lang UK court survivors
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/languk"
          mkdir -p "$root/parent" "$root/proof"
          curl --fail --location --retry 5 --retry-all-errors -H "Authorization: Bearer $GH_TOKEN"             -o "$root/parent.zip"             "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/actions/artifacts/$LANGUK_PARENT_ARTIFACT_ID/zip"
          test "$(sha256sum "$root/parent.zip" | cut -d' ' -f1)" = "$LANGUK_PARENT_ZIP_SHA256"
          unzip -q "$root/parent.zip" -d "$root/parent"
          test "$(sha256sum "$root/parent/survivors.json" | cut -d' ' -f1)" = "b65c71e64345fbce0f7b6593acc5cc924696a1aba81861b3e49fc2138fd83a58"
          test "$(sha256sum "$root/parent/evidence.json" | cut -d' ' -f1)" = "2b758d3bd37913daad19c80e70e820218fd47578f910018c0d3f2c38cd5149aa"
