      - name: Independently require exact 20M raw assembly
        shell: bash
        run: |
          set -euo pipefail
          python - "$RUNNER_TEMP/assembly-1.json" "$RUNNER_TEMP/selected-20m-1.jsonl" <<'PY'
          import hashlib
          import json
          import sys
          from pathlib import Path

          receipt = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          core = dict(receipt)
          claimed = core.pop("assembly_identity_sha256")
          raw = json.dumps(
              core,
              ensure_ascii=False,
              sort_keys=True,
              separators=(",", ":"),
              allow_nan=False,
          ).encode("utf-8")
          assert hashlib.sha256(raw).hexdigest() == claimed
          assert receipt["selected_record_count"] == 5294
          assert receipt["selected_payload_bytes"] == 20_000_000
          assert receipt["base_selected_record_count"] == 211
          assert receipt["base_selected_payload_bytes"] == 3_582_998
          assert receipt["rematerialized_record_count"] == 5083
          assert receipt["rematerialized_payload_bytes"] == 16_417_002
          assert receipt["selected_membership_sha256"] == (
              "a00572acfb1033f7bfe55e7e1f53ae9eb44b6fa039f3f378a156bec6fd13615f"
          )
          assert receipt["selected_payload_projection_sha256"] == (
              "9bcfc6eb09418c93a00373df6d4c4cf3e5795d54e12c0e4bc106eaecbc89de82"
          )
          assert receipt["selected_family_bytes_sha256"] == (
              "f54dec34d6c86506d3321686e63af0c226f4f7adec6bffdf7a5d8d51133db280"
          )
          raw_bytes = Path(sys.argv[2]).read_bytes()
          assert hashlib.sha256(raw_bytes).hexdigest() == receipt["selected_raw_jsonl_sha256"]
          assert raw_bytes.count(b"\n") == 5294
          for key in (
              "training_authorized_bytes",
              "authorized_unique_loss_positions",
              "authorized_optimized_target_exposure",
              "optimizer_updates_executed_on_real_targets",
          ):
              assert receipt[key] == 0
          for key in (
              "tokenizer_fit_authorized",
              "training_executed",
              "learned_weights_created",
              "final_test_outcomes_read",
              "paid_compute_used",
              "scale_promotion_authorized",
          ):
              assert receipt[key] is False
          print("D03_SELECTED_20M_RAW_MATERIALIZATION_PASS")
          print(json.dumps({
              "assembly_identity_sha256": claimed,
              "selected_raw_jsonl_sha256": receipt["selected_raw_jsonl_sha256"],
              "records": receipt["selected_record_count"],
              "payload_bytes": receipt["selected_payload_bytes"],
          }, sort_keys=True))
          PY

      - name: Delete raw bytes and upload text-free receipt only
        shell: bash
        run: |
          set -euo pipefail
          cp "$RUNNER_TEMP/assembly-1.json" "$RUNNER_TEMP/durable-selected-20m-receipt.json"
          rm -f "$RUNNER_TEMP/selected-20m-1.jsonl" "$RUNNER_TEMP/selected-20m-2.jsonl"
          rm -rf "$RUNNER_TEMP/fragments"
          test ! -e "$RUNNER_TEMP/selected-20m-1.jsonl"
          test ! -e "$RUNNER_TEMP/selected-20m-2.jsonl"
          python - "$RUNNER_TEMP/durable-selected-20m-receipt.json" <<'PY'
          import json
          import sys
          from pathlib import Path
          value = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          assert value["durable_output_contains_raw_payload"] is False
          assert value["raw_output_is_ephemeral"] is True
          assert "normalized_payload" not in Path(sys.argv[1]).read_text(encoding="utf-8")
          PY

      - name: Upload text-free selected raw authority
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: d03-selected-20m-raw-receipt-${{ github.event.pull_request.head.sha }}
          path: ${{ runner.temp }}/durable-selected-20m-receipt.json
          if-no-files-found: error
          retention-days: 90
