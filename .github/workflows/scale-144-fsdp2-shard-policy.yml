name: SCALE-144 FSDP2 Shard Policy
on:
  pull_request:
    paths:
      - "src/twelve_six/distributed/fsdp2_policy.py"
      - "src/twelve_six/distributed/fsdp2_training.py"
      - "src/twelve_six/distributed/dcp_checkpoint.py"
      - "src/twelve_six/distributed/runtime.py"
      - "configs/stages/alternatives/s3_10m_scale03_byte_gqa.execution.json"
      - "configs/stages/s4_100m_accelerator.candidate.json"
      - "tools/run_fsdp2_shard_policy.py"
      - "tests/test_fsdp2_policy.py"
      - ".github/workflows/scale-144-fsdp2-shard-policy.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  local-free-cpu-gloo:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11.16"
      - name: Verify exact locked runtime
        run: >-
          python tools/verify_locked_environment.py
          --profile linux-x86_64
          --source-sha "${{ github.event.pull_request.head.sha || github.sha }}"
          --evidence-out locked-environment-scale-144.json
      - name: Materialize exact locked test environment
        run: |
          python -m pip install --disable-pip-version-check --require-hashes --no-deps -r requirements/locks/linux-x86_64/toolchain.lock.txt
          python -m pip install --disable-pip-version-check --require-hashes --no-deps -r requirements/locks/linux-x86_64/runtime.lock.txt
          python -m pip install --disable-pip-version-check --require-hashes --no-deps -r requirements/locks/linux-x86_64/dev.lock.txt
          PIP_NO_INDEX=1 python -m pip install --no-deps --no-build-isolation -e .
      - name: Focused lint
        run: >-
          python -m ruff check
          src/twelve_six/distributed/fsdp2_policy.py
          tools/run_fsdp2_shard_policy.py
          tests/test_fsdp2_policy.py
      - name: Policy binding tests
        run: python -m pytest -q tests/test_fsdp2_policy.py
      - name: Real two-rank CPU Gloo 10M policy and 100M boundary probe
        env:
          GITHUB_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: >-
          python tools/run_fsdp2_shard_policy.py
          --out scale-144-fsdp2-shard-policy.json
      - name: Upload SCALE-144 evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: scale-144-fsdp2-shard-policy-evidence
          path: |
            locked-environment-scale-144.json
            scale-144-fsdp2-shard-policy.json
          if-no-files-found: warn
          retention-days: 30
