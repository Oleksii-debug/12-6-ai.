name: D05 S0 Inference Acceptance

on:
  pull_request:
    paths:
      - "src/twelve_six/inference/**"
      - "src/twelve_six/checkpoint/**"
      - "src/twelve_six/model.py"
      - "src/twelve_six/training/**"
      - "src/twelve_six/tokenization.py"
      - "src/twelve_six/packing/**"
      - "data/s0/**"
      - "configs/stages/**"
      - "configs/runs/s0_10k.d05_inference_acceptance.json"
      - "requirements/locks/**"
      - "tests/test_s0_inference_acceptance.py"
      - ".github/workflows/d05-s0-inference-acceptance.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  locked-cpu-inference-acceptance:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Prove exact source checkout
        run: test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11.16"
      - name: Verify D08 locked environment and repository checks
        run: >-
          python tools/verify_locked_environment.py
          --profile linux-x86_64
          --source-sha "$SOURCE_SHA"
          --evidence-out locked-environment-linux-x86_64.json
          --run-repo-checks
      - name: Create exact locked D05 execution environment
        run: |
          python -m venv .d05-inference-locked
          .d05-inference-locked/bin/python -m pip install --disable-pip-version-check --require-hashes --no-deps -r requirements/locks/linux-x86_64/toolchain.lock.txt
          .d05-inference-locked/bin/python -m pip install --disable-pip-version-check --require-hashes --no-deps -r requirements/locks/linux-x86_64/runtime.lock.txt
          .d05-inference-locked/bin/python -m pip install --disable-pip-version-check --require-hashes --no-deps -r requirements/locks/linux-x86_64/dev.lock.txt
          PIP_NO_INDEX=1 PIP_DISABLE_PIP_VERSION_CHECK=1 .d05-inference-locked/bin/python -m pip install --no-deps --no-build-isolation -e .
          .d05-inference-locked/bin/python -c "import torch,twelve_six; assert torch.__version__; print(twelve_six.__version__)"
      - name: Run focused strict acceptance regressions
        run: .d05-inference-locked/bin/python -m pytest -q tests/test_s0_inference_acceptance.py
      - name: Execute exact-head 40-step inference acceptance
        run: |
          .d05-inference-locked/bin/python -m twelve_six.inference.acceptance \
            --repo-root . \
            --candidate-sha "$SOURCE_SHA" \
            --output-dir d05-inference-acceptance \
            --train-steps 40 \
            --seed 20260825
          cat d05-inference-acceptance/inference-acceptance.json
      - name: Revalidate machine evidence
        run: |
          .d05-inference-locked/bin/python - <<'PY'
          import json
          import os
          from pathlib import Path
          from twelve_six.inference.acceptance import validate_s0_inference_acceptance

          path = Path("d05-inference-acceptance/inference-acceptance.json")
          evidence = json.loads(path.read_text(encoding="utf-8"))
          validate_s0_inference_acceptance(evidence)
          assert evidence["candidate_sha"] == os.environ["SOURCE_SHA"]
          assert evidence["train_steps"] == 40
          assert evidence["identity"]["parameter_count"] == 10140
          assert evidence["parity"]["passed"] is True
          assert all(evidence["fail_closed"].values())
          assert evidence["server"]["matches_direct_generation"] is True
          assert evidence["promotion_eligible"] is False
          assert evidence["audits_pass"] is False
          PY
      - name: Upload exact-candidate inference evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: d05-s0-inference-acceptance-${{ env.SOURCE_SHA }}
          path: |
            locked-environment-linux-x86_64.json
            d05-inference-acceptance/inference-acceptance.json
            d05-inference-acceptance/checkpoint/**
          if-no-files-found: error
          retention-days: 30
