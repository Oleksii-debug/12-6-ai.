name: R01 Data Budget Focused

on:
  pull_request:
    paths:
      - "src/twelve_six/data_budget.py"
      - "tests/test_data_budget.py"
      - "tools/check_data_budget.py"
      - "configs/scaling/data_budget_v1.json"
      - ".github/workflows/r01-data-budget-focused.yml"
  push:
    branches:
      - "review/r01-data-budget-finite-inputs-20260826"
    paths:
      - "src/twelve_six/data_budget.py"
      - "tests/test_data_budget.py"
      - "tools/check_data_budget.py"
      - "configs/scaling/data_budget_v1.json"
      - ".github/workflows/r01-data-budget-focused.yml"

concurrency:
  group: r01-data-budget-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  focused:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install development dependencies
        run: python -m pip install -e '.[dev]'
      - name: Focused lint
        run: ruff check src/twelve_six/data_budget.py tests/test_data_budget.py tools/check_data_budget.py
      - name: Focused tests
        run: pytest -q tests/test_data_budget.py
