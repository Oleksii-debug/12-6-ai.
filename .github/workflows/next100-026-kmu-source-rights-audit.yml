name: NEXT100-026 KMu Source Rights Audit

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.11.16"
      - name: Validate immutable snapshot and rights contract
        run: python tools/validate_next100_026_kmu_source_audit.py
      - name: Run focused test
        run: python -m pytest -q tests/test_next100_026_kmu_source_audit.py
