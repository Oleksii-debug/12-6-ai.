name: D07 KV Cache Incremental Generation

on:
  pull_request:
    paths:
      - "src/twelve_six/model.py"
      - "src/twelve_six/integration/s0_runtime.py"
      - "src/twelve_six/inference/generation.py"
      - "tests/test_kv_cache_generation.py"
      - "tests/test_kv_cache_serving.py"
      - "tools/run_s0_kv_cache_evidence.py"
      - "tools/run_s3_kv_cache_cpu_benchmark.py"
      - "docs/D07_KV_CACHE_INCREMENTAL_GENERATION.md"
      - ".github/workflows/d07-kv-cache.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  locked-cpu-kv-cache:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Prove exact source checkout
        run: test "$(git rev-parse HEAD)" = "$SOURCE_SHA"

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11.16"

      - name: Verify exact D08 locked environment and repository checks
        run: >-
          python tools/verify_locked_environment.py
          --profile linux-x86_64
          --source-sha "$SOURCE_SHA"
          --evidence-out locked-environment-linux-x86_64.json
          --run-repo-checks

      - name: Create exact locked D07 execution environment
        run: |
          python -m venv .d07-kv-locked
          .d07-kv-locked/bin/python -m pip install --disable-pip-version-check --require-hashes --no-deps -r requirements/locks/linux-x86_64/toolchain.lock.txt
          .d07-kv-locked/bin/python -m pip install --disable-pip-version-check --require-hashes --no-deps -r requirements/locks/linux-x86_64/runtime.lock.txt
          .d07-kv-locked/bin/python -m pip install --disable-pip-version-check --require-hashes --no-deps -r requirements/locks/linux-x86_64/dev.lock.txt
          PIP_NO_INDEX=1 PIP_DISABLE_PIP_VERSION_CHECK=1 .d07-kv-locked/bin/python -m pip install --no-deps --no-build-isolation -e .

      - name: Focused KV-cache and serving regressions
        run: >-
          .d07-kv-locked/bin/python -m pytest -q
          tests/test_kv_cache_generation.py
          tests/test_kv_cache_serving.py

      - name: Collect exact-head S0 KV-cache mechanics evidence
        run: |
          .d07-kv-locked/bin/python tools/run_s0_kv_cache_evidence.py \
            --repo-root . \
            --source-sha "$SOURCE_SHA" \
            --steps 16 \
            --seed 20260825 \
            --output s0-kv-cache-evidence.json
          cat s0-kv-cache-evidence.json

      - name: Benchmark exact-head S3 CPU KV-cache latency
        run: |
          .d07-kv-locked/bin/python tools/run_s3_kv_cache_cpu_benchmark.py \
            --repo-root . \
            --source-sha "$SOURCE_SHA" \
            --prompt-length 64 \
            --decode-steps 8 \
            --repeats 3 \
            --threads 1 \
            --seed 20260825 \
            --output s3-kv-cache-cpu-benchmark.json
          cat s3-kv-cache-cpu-benchmark.json

      - name: Validate non-promotion evidence boundary
        run: |
          .d07-kv-locked/bin/python - <<'PY'
          import json
          import os
          from pathlib import Path

          report = json.loads(Path("s0-kv-cache-evidence.json").read_text(encoding="utf-8"))
          benchmark = json.loads(
              Path("s3-kv-cache-cpu-benchmark.json").read_text(encoding="utf-8")
          )
          assert report["source_sha"] == os.environ["SOURCE_SHA"]
          assert report["schema"] == "12-6.s0-kv-cache-evidence.v1"
          assert report["canonical_base"] == "random_init"
          assert report["parameter_count"] == 10140
          assert report["greedy_token_choices_exact"] is True
          assert report["max_abs_logit_error"] <= report["logit_tolerance"]
          assert report["decoder_input_positions"]["cached"] < report["decoder_input_positions"]["stateless_full_prefix"]
          assert report["cache"]["ephemeral_not_checkpointed"] is True
          assert report["truth_boundary"]["runtime_latency_benchmark"] is False
          assert report["truth_boundary"]["paid_compute"] is False
          assert report["truth_boundary"]["promotion_authority"] is False
          assert report["truth_boundary"]["base_behavior_changed"] is False
          assert benchmark["source_sha"] == os.environ["SOURCE_SHA"]
          assert benchmark["schema"] == "12-6.s3-kv-cache-cpu-benchmark.v1"
          assert benchmark["parameter_count"] == 10059840
          assert benchmark["latency_speedup_ratio"] > 0.0
          assert benchmark["decoder_input_positions"]["cached_incremental"] < benchmark["decoder_input_positions"]["stateless_full_prefix"]
          assert benchmark["truth_boundary"]["cpu_only"] is True
          assert benchmark["truth_boundary"]["serving_throughput"] is False
          assert benchmark["truth_boundary"]["capacity_or_sla"] is False
          assert benchmark["truth_boundary"]["promotion_authority"] is False
          PY

      - name: Upload exact-head KV-cache evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: d07-kv-cache-evidence-${{ env.SOURCE_SHA }}
          path: |
            locked-environment-linux-x86_64.json
            s0-kv-cache-evidence.json
            s3-kv-cache-cpu-benchmark.json
          if-no-files-found: error
          retention-days: 30
