name: PERF-148 10M PyTorch Profiler

on:
  pull_request:
    paths:
      - "tools/profile_perf148_10m.py"
      - "src/twelve_six/training/trainer.py"
      - "tests/test_perf148_trainer_optimization.py"
      - ".github/workflows/perf148-10m-profiler.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  profile-local-free:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      BASE_SHA: fb9c6d9b73ce436d637077892d73edf136fcaeac
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Prove exact source checkout
        run: test "$(git rev-parse HEAD)" = "$SOURCE_SHA"

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11.16"

      - name: Verify locked LOCAL_FREE environment
        run: >-
          python tools/verify_locked_environment.py
          --profile linux-x86_64
          --source-sha "$SOURCE_SHA"
          --evidence-out perf148-locked-environment.json

      - name: Create exact locked execution environment
        run: |
          python -m venv .perf148-locked
          .perf148-locked/bin/python -m pip install --disable-pip-version-check --require-hashes --no-deps -r requirements/locks/linux-x86_64/toolchain.lock.txt
          .perf148-locked/bin/python -m pip install --disable-pip-version-check --require-hashes --no-deps -r requirements/locks/linux-x86_64/runtime.lock.txt
          .perf148-locked/bin/python -m pip install --disable-pip-version-check --require-hashes --no-deps -r requirements/locks/linux-x86_64/dev.lock.txt
          PIP_NO_INDEX=1 PIP_DISABLE_PIP_VERSION_CHECK=1 .perf148-locked/bin/python -m pip install --no-deps --no-build-isolation -e .
          cp tools/profile_perf148_10m.py /tmp/profile_perf148_10m.py

      - name: Run focused optimization tests at exact head
        run: .perf148-locked/bin/python -m pytest -q tests/test_perf148_trainer_optimization.py

      - name: Profile exact incumbent base trace
        run: |
          git checkout --detach "$BASE_SHA"
          test "$(git rev-parse HEAD)" = "$BASE_SHA"
          PYTHONPATH=src .perf148-locked/bin/python /tmp/profile_perf148_10m.py \
            --repo-root . \
            --source-sha "$BASE_SHA" \
            --output perf148-before.json \
            --trace-output perf148-before-trace.json \
            --device cpu \
            --precision fp32 \
            --batch-size 1 \
            --sequence-length 256 \
            --warmup-steps 1 \
            --profile-steps 3 \
            --cpu-threads 2

      - name: Profile exact optimized head trace
        run: |
          git checkout --detach "$SOURCE_SHA"
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          PYTHONPATH=src .perf148-locked/bin/python /tmp/profile_perf148_10m.py \
            --repo-root . \
            --source-sha "$SOURCE_SHA" \
            --output perf148-after.json \
            --trace-output perf148-after-trace.json \
            --device cpu \
            --precision fp32 \
            --batch-size 1 \
            --sequence-length 256 \
            --warmup-steps 1 \
            --profile-steps 3 \
            --cpu-threads 2

      - name: Validate equivalence and write comparison evidence
        run: |
          .perf148-locked/bin/python - <<'PY'
          import json
          import statistics
          from pathlib import Path

          before = json.loads(Path("perf148-before.json").read_text(encoding="utf-8"))
          after = json.loads(Path("perf148-after.json").read_text(encoding="utf-8"))
          assert before["schema"] == after["schema"] == "12-6.perf148-10m-profiler.v1"
          assert before["paid_compute"] is after["paid_compute"] is False
          assert before["candidate"] == after["candidate"]
          assert before["execution"]["device"] == after["execution"]["device"] == "cpu"
          assert before["execution"]["precision"] == after["execution"]["precision"] == "fp32"
          assert before["execution"]["optimizer_steps"] == after["execution"]["optimizer_steps"] == 4
          assert before["execution"]["tokens_seen"] == after["execution"]["tokens_seen"]
          assert before["trace"]["seed"] == after["trace"]["seed"]
          assert before["trace"]["data_seed"] == after["trace"]["data_seed"]
          assert before["trace"]["batch_sha256"] == after["trace"]["batch_sha256"]
          assert before["trace"]["initial_parameter_sha256"] == after["trace"]["initial_parameter_sha256"]
          assert before["trace"]["final_parameter_sha256"] == after["trace"]["final_parameter_sha256"]

          before_median = statistics.median(before["execution"]["step_wall_seconds"])
          after_median = statistics.median(after["execution"]["step_wall_seconds"])
          speedup = before_median / after_median
          comparison = {
              "schema": "12-6.perf148-before-after.v1",
              "base_sha": before["source_sha"],
              "head_sha": after["source_sha"],
              "device": "cpu",
              "precision": "fp32",
              "shape": before["candidate"]["profile_shape"],
              "parameters": before["candidate"]["parameters"],
              "trace_equivalence": {
                  "batch_sha256_equal": True,
                  "initial_parameter_sha256_equal": True,
                  "final_parameter_sha256_equal": True,
                  "tokens_seen_equal": True,
                  "optimizer_steps_equal": True,
              },
              "before_step_wall_seconds": before["execution"]["step_wall_seconds"],
              "after_step_wall_seconds": after["execution"]["step_wall_seconds"],
              "before_median_step_seconds": before_median,
              "after_median_step_seconds": after_median,
              "speedup_x": speedup,
              "speedup_percent": (speedup - 1.0) * 100.0,
              "before_top_bottlenecks": before["top_bottlenecks"],
              "after_top_bottlenecks": after["top_bottlenecks"],
              "before_top_operators": before["top_operators_by_self_time"][:20],
              "after_top_operators": after["top_operators_by_self_time"][:20],
              "truth_boundary": {
                  "cpu_only": True,
                  "cuda_evidence": False,
                  "paid_compute": False,
                  "training_objective_changed": False,
              },
          }
          Path("perf148-before-after.json").write_text(
              json.dumps(comparison, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          print(json.dumps(comparison, indent=2, sort_keys=True))
          PY

      - name: Upload profiler machine evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: perf148-10m-profiler-${{ env.SOURCE_SHA }}
          path: |
            perf148-locked-environment.json
            perf148-before.json
            perf148-after.json
            perf148-before-after.json
            perf148-before-trace.json
            perf148-after-trace.json
          if-no-files-found: error
          retention-days: 30
