name: NEXT100-062 License Compliance Manifest

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-license-compliance:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      TWELVE_SIX_EXECUTION_PROFILE: LOCAL_FREE
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11.16"

      - name: Bind exact source head
        env:
          EXPECTED_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SOURCE_SHA"

      - name: Validate deterministic manifest and sidecars
        run: python tools/validate_next100_062_license_compliance_manifest.py validate-manifest

      - name: Verify training-purpose verdict preservation
        run: python tools/validate_next100_062_license_compliance_manifest.py check-training

      - name: Regression tests
        run: python -m unittest tests.test_next100_062_license_compliance_manifest -v

      - name: Prove redistribution remains fail-closed while ShareAlike path is unresolved
        run: |
          if python tools/validate_next100_062_license_compliance_manifest.py check-redistribution; then
            echo "redistribution unexpectedly became READY" >&2
            exit 1
          fi
          echo "PASS expected fail-closed redistribution blocker"
