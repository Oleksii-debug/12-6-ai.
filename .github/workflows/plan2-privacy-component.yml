name: Plan 2 S5 Privacy Candidate Qualification

on:
  push:
    branches:
      - 'plan2/section5-*'
  pull_request:
    paths:
      - 'tools/plan2_privacy_gate_v1.py'
      - 'tests/test_plan2_privacy_gate_v1.py'
      - 'configs/data/plan2_privacy_policy_v1.json'
      - '.github/workflows/plan2-privacy-component.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  privacy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install LOCAL_FREE test dependencies
        run: python -m pip install pytest ruff
      - name: Static lint
        run: ruff check tools/plan2_privacy_gate_v1.py tests/test_plan2_privacy_gate_v1.py
      - name: Existing authority, integration and adversarial regression
        run: |
          PYTHONPATH=.:src pytest -q \
            tests/test_plan2_source_inventory_v1.py \
            tests/test_plan2_source_admissibility_v1.py \
            tests/test_plan2_physical_materialization_v1.py \
            tests/test_data324_current_main_port.py \
            tests/test_plan2_normalization_evidence_v1.py \
            tests/test_privacy_execution_authority.py \
            tests/test_privacy_filter_v3_redteam.py \
            tests/test_plan2_privacy_gate_v1.py
      - name: Immutable two-run CLI restart
        shell: bash
        run: |
          export PYTHONPATH=.:src
          python tools/plan2_privacy_gate_v1.py --out-dir "$RUNNER_TEMP/plan2-p5" > "$RUNNER_TEMP/first.json"
          python tools/plan2_privacy_gate_v1.py --out-dir "$RUNNER_TEMP/plan2-p5" > "$RUNNER_TEMP/second.json"
          cmp "$RUNNER_TEMP/first.json" "$RUNNER_TEMP/second.json"
