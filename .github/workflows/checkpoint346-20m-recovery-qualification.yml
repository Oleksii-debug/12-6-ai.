name: CHECKPOINT-346 20M Recovery Qualification Gate

on:
  pull_request:
    paths:
      - ".github/workflows/checkpoint346-20m-recovery-qualification.yml"
      - "evidence/checkpoint346/recovery_20m_dependency_gate_v1.json"
      - "tools/validate_checkpoint346_recovery_gate.py"
      - "tests/test_checkpoint346_recovery_gate.py"
      - "docs/CHECKPOINT346_20M_RECOVERY_QUALIFICATION.md"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checkpoint346-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  fail-closed-dependency-gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      EXPECTED_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      PYTHONPATH: ${{ github.workspace }}

    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Set exact CPython 3.11.16
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.11.16"

      - name: Bind exact source
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SOURCE_SHA"

      - name: Universal exact test bootstrap
        uses: ./.github/actions/execution-bootstrap
        with:
          capabilities: tests
          venv: .checkpoint346
          manifest: checkpoint346-environment.json
          command: python -m pytest tests/test_checkpoint346_recovery_gate.py

      - name: Validate fail-closed authority
        run: |
          set -euo pipefail
          .checkpoint346/bin/python tools/validate_checkpoint346_recovery_gate.py
          .checkpoint346/bin/python -m pytest -q tests/test_checkpoint346_recovery_gate.py

      - name: Enforce zero-execution truth boundary
        run: |
          set -euo pipefail
          .checkpoint346/bin/python - <<'PY'
          import json
          from pathlib import Path

          report = json.loads(
              Path("evidence/checkpoint346/recovery_20m_dependency_gate_v1.json")
              .read_text(encoding="utf-8")
          )
          assert report["verdict"] == "BLOCKED_MISSING_PRIMARY_20M_MODELSPEC"
          accounting = report["execution_accounting"]
          assert accounting["optimizer_updates"] == 0
          assert accounting["model_training_started"] is False
          assert accounting["recovery_injections_executed_on_20m"] == 0
          assert accounting["long_campaign_executed"] is False
          assert accounting["paid_compute"] is False
          assert report["unblock_rule"]["then_execute"]["maximum_optimizer_steps"] <= 3
          print(report["identity_sha256"])
          PY
