name: CHECKPOINT-346 MODEL-341 Recovery Qualification

on:
  pull_request:
    paths:
      - ".github/workflows/checkpoint346-20m-recovery-qualification.yml"
      - "tools/run_checkpoint346_model341_recovery.py"
      - "docs/CHECKPOINT346_20M_RECOVERY_QUALIFICATION.md"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checkpoint346-model341-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  bounded-model341-recovery:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      MODEL341_SHA: 82c43005bb5db153482ae5b20a31d59240faaebc

    steps:
      - name: Checkout exact CHECKPOINT-346 candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Checkout exact canonical MODEL-341 carrier
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: Oleksii-debug/12-6-ai.
          ref: ${{ env.MODEL341_SHA }}
          path: model341-carrier
          persist-credentials: false

      - name: Set exact CPython 3.11.16
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.11.16"

      - name: Bind exact carrier identities
        run: |
          set -euo pipefail
          test "$(git -C model341-carrier rev-parse HEAD)" = "$MODEL341_SHA"
          test "$(git -C model341-carrier hash-object configs/candidates/model341_20m_candidate_a.json)" = "69e3cbd5f5c83c9d3d529a2a6376db3055979c40"
          test "$(git -C model341-carrier hash-object src/twelve_six/model.py)" = "d0823aa666883ddb5c445a438730043ef8b50ff1"
          test "$(git -C model341-carrier hash-object src/twelve_six/training/trainer.py)" = "049394ae119a5a5ac301ceded6ae6dfcae66c020"
          test "$(git -C model341-carrier hash-object src/twelve_six/checkpoint/core.py)" = "8bff5f2cad79f64532f60dce3b413aa5e385d97a"

      - name: Bootstrap carrier-declared LOCAL_FREE CPU runtime
        run: |
          set -euo pipefail
          python model341-carrier/tools/execution_bootstrap.py bootstrap \
            --repo-root model341-carrier \
            --capabilities runtime \
            --venv "$GITHUB_WORKSPACE/.checkpoint346-runtime" \
            --manifest "$GITHUB_WORKSPACE/checkpoint346-environment.json"

      - name: Execute bounded fresh-process recovery qualification
        run: |
          set -euo pipefail
          .checkpoint346-runtime/bin/python tools/run_checkpoint346_model341_recovery.py \
            --carrier-root model341-carrier \
            --output checkpoint346-recovery-result.json

      - name: Enforce zero-credit scientific boundary
        run: |
          set -euo pipefail
          .checkpoint346-runtime/bin/python - <<'PY'
          import json
          from pathlib import Path

          report = json.loads(Path("checkpoint346-recovery-result.json").read_text(encoding="utf-8"))
          assert report["verdict"] == "PASS_MODEL341_RECOVERY_MECHANICS"
          assert report["carrier"]["git_sha"] == "82c43005bb5db153482ae5b20a31d59240faaebc"
          assert report["carrier"]["parameter_count"] == 20613440
          assert report["carrier"]["canonical_base"] == "random_init"
          execution = report["execution"]
          assert execution["local_free"] is True
          assert execution["synthetic_mechanics_only"] is True
          assert execution["optimizer_updates_total"] == 3
          assert execution["fresh_process_distinct"] is True
          assert execution["same_next_step_equal"] is True
          assert execution["binding_mismatch_failed_closed"] is True
          credit = report["scientific_credit"]
          assert credit["real_corpus_used"] is False
          assert credit["training_authorized_corpus_used"] is False
          assert credit["optimized_target_exposure"] == 0
          assert credit["model_training_credit"] is False
          assert credit["learned_weights_created"] is False
          assert credit["final_test_read"] is False
          assert credit["paid_compute_used"] is False
          assert credit["foreign_pretrained_weights"] is False
          assert report["limits"]["maximum_optimizer_updates"] == 3
          assert report["limits"]["long_campaign"] is False
          assert report["limits"]["selection_or_recipe_tuning"] is False
          print("CHECKPOINT346_MODEL341_RECOVERY=PASS_ZERO_CREDIT")
          print("RESULT_IDENTITY_SHA256=" + report["identity_sha256"])
          PY

      - name: Upload compact qualification evidence
        uses: actions/upload-artifact@v4
        with:
          name: checkpoint346-model341-recovery-qualification
          path: |
            checkpoint346-recovery-result.json
            checkpoint346-environment.json
          retention-days: 7
          compression-level: 9
          if-no-files-found: error
