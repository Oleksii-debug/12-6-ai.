name: EVAL-134 Code Diagnostic V1

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: eval134-code-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  code-diagnostic-cpu:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Prove exact source checkout
        env:
          SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$SOURCE_SHA"

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11.16"

      - name: Create hash-locked LOCAL_FREE runtime
        run: |
          python -m venv .eval134-locked
          .eval134-locked/bin/python -m pip install \
            --disable-pip-version-check --require-hashes --no-deps \
            -r requirements/locks/linux-x86_64/toolchain.lock.txt
          .eval134-locked/bin/python -m pip install \
            --disable-pip-version-check --require-hashes --no-deps \
            -r requirements/locks/linux-x86_64/runtime.lock.txt
          .eval134-locked/bin/python -m pip install \
            --disable-pip-version-check --require-hashes --no-deps --only-binary=:all: \
            -r requirements/experiments/tokenizers-linux-x86_64.lock.txt

      - name: Verify immutable reservation and focused tests
        env:
          PYTHONPATH: src:.
        run: |
          .eval134-locked/bin/python tools/eval134_code_suite.py verify --repo-root .
          .eval134-locked/bin/python -m pytest -q tests/test_eval134_code_suite.py

      - name: Execute random-init and learned 100K 500K 1M ladder
        env:
          SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          PYTHONPATH: src:.
        run: |
          .eval134-locked/bin/python tools/eval134_code_suite.py run \
            --repo-root . \
            --source-sha "$SOURCE_SHA" \
            --output-dir eval134-code-evidence \
            --learned-budget 65536 \
            --torch-threads 2
          .eval134-locked/bin/python tools/eval134_code_suite.py validate \
            eval134-code-evidence/eval134-code-scaling-report.json
          .eval134-locked/bin/python - <<'PY'
          import json
          report = json.load(open("eval134-code-evidence/eval134-code-scaling-report.json", encoding="utf-8"))
          for row in report["models"]:
              r = row["random_init"]["summary"]["overall"]
              l = row["learned"]["summary"]["overall"]
              print({
                  "parameters": row["parameters"],
                  "optimized_tokens": row["optimized_tokens"],
                  "random_raw_accuracy": r["raw_accuracy"],
                  "learned_raw_accuracy": l["raw_accuracy"],
                  "random_byte_normalized_accuracy": r["byte_normalized_accuracy"],
                  "learned_byte_normalized_accuracy": l["byte_normalized_accuracy"],
                  "random_bpb": r["mean_correct_bits_per_source_byte"],
                  "learned_bpb": l["mean_correct_bits_per_source_byte"],
              })
          print("BPE/byte segmentation:", report["tokenizer"]["probe_segmentation"]["aggregate"])
          print("report_identity_sha256:", report["report_identity_sha256"])
          PY

      - name: Upload EVAL-134 machine evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: eval134-code-diagnostic-v1
          path: eval134-code-evidence/
          if-no-files-found: warn
          retention-days: 30
