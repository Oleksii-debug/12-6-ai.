name: D03 Product record realization G6 160

on:
  pull_request:
    branches:
      - repair/2583-record-realization-bitset-g6-160-20261006
    paths:
      - ".github/workflows/d03_record_realization_product_g6_160.yml"
      - "tools/qualify_d03_record_realization_product_v2.py"

permissions:
  actions: read
  contents: read

concurrency:
  group: d03-product-record-realization-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  qualify-product-selector:
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.head_ref == 'qualification/3063-record-realization-g6-160-r2-20261006'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      EXECUTION_HEAD: ${{ github.event.pull_request.head.sha }}
      PRODUCT_HEAD: "efadbdac0c03e7c020501652f5624b96f289ec2e"
      PRODUCT_PARENT: "8e4efd89dbace1931032dc4283bb5c22cdeda597"
      SELECTION_BLOB: "79eed6a6d3b941e89132f072593db1c74bd1d90d"
      TEST_BLOB: "0e74808b92feb5acfe9bb49588173499fac01dbc"
      RUNNER_BLOB: "703935be70e7bd0ca34436769e548ad7abb6b6c4"
      BALANCE_ARTIFACT_ID: "11441000276"
      BALANCE_ARTIFACT_ZIP_SHA256: "85ae6ace4914cd8fae86cef71b8ac63cf73c97b1386ff7e01a716692ddce6c10"
      COMPOSITION_FILE_SHA256: "8a737ca830d0e98095b258c31bb1fc6f5e0c294384484b3f266dad654522850e"
      BALANCE_FILE_SHA256: "655eee7aa4fd0aeb7d124405a420a7148efb0474951f9843e0476bc4f05b56d4"
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Checkout exact qualification head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set exact CPython
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11.16"

      - name: Bind exact Product and qualification closure
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXECUTION_HEAD"
          test "$(git merge-base "$PRODUCT_HEAD" HEAD)" = "$PRODUCT_HEAD"
          test "$(git merge-base "$PRODUCT_PARENT" "$PRODUCT_HEAD")" = "$PRODUCT_PARENT"
          mapfile -t changed < <(git diff --name-only "$PRODUCT_HEAD"..HEAD | sort)
          test "${#changed[@]}" -eq 2
          test "${changed[0]}" = ".github/workflows/d03_record_realization_product_g6_160.yml"
          test "${changed[1]}" = "tools/qualify_d03_record_realization_product_v2.py"
          test "$(git hash-object src/twelve_six/data/current_clean_balanced_selection_v1.py)" = "$SELECTION_BLOB"
          test "$(git hash-object tests/test_postmaterialization_balance_projection_v1.py)" = "$TEST_BLOB"
          test "$(git hash-object tools/qualify_d03_record_realization_product_v2.py)" = "$RUNNER_BLOB"
          git diff --quiet HEAD --
          git diff --cached --quiet HEAD --
          python -m py_compile             src/twelve_six/data/current_clean_balanced_selection_v1.py             tests/test_postmaterialization_balance_projection_v1.py             tools/qualify_d03_record_realization_product_v2.py

      - name: Run focused Product regressions
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check "pytest>=8" "ruff>=0.12"
          ruff check             src/twelve_six/data/current_clean_balanced_selection_v1.py             tests/test_postmaterialization_balance_projection_v1.py             tools/qualify_d03_record_realization_product_v2.py
          PYTHONPATH="$GITHUB_WORKSPACE/src:$GITHUB_WORKSPACE"             python -m pytest -q tests/test_postmaterialization_balance_projection_v1.py             -k "exact_record_realization or selection_repairs_impossible_family_witness_at_cap_safe_stratum or selection_refuses_stratum_repair_when_full_family_exceeds_cap or current_clean_balanced_selection_materializes_exact_target or current_clean_balanced_selection_is_deterministic"

      - name: Fetch exact qualified 20M balance artifact
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/balance"
          mkdir -p "$root"
          curl --fail --location --retry 5 --retry-all-errors             -H "Authorization: Bearer $GH_TOKEN"             -H "Accept: application/vnd.github+json"             -H "X-GitHub-Api-Version: 2022-11-28"             -o "$RUNNER_TEMP/balance.zip"             "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/actions/artifacts/${BALANCE_ARTIFACT_ID}/zip"
          test "$(sha256sum "$RUNNER_TEMP/balance.zip" | cut -d' ' -f1)" = "$BALANCE_ARTIFACT_ZIP_SHA256"
          unzip -q "$RUNNER_TEMP/balance.zip" -d "$root"
          test "$(sha256sum "$root/composition.json" | cut -d' ' -f1)" = "$COMPOSITION_FILE_SHA256"
          test "$(sha256sum "$root/balance-result.json" | cut -d' ' -f1)" = "$BALANCE_FILE_SHA256"

      - name: Execute two fresh exact Product qualifications
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/balance"
          for pass_id in 1 2; do
            PYTHONPATH="$GITHUB_WORKSPACE/src"               python tools/qualify_d03_record_realization_product_v2.py                 --composition-json "$root/composition.json"                 --balance-result-json "$root/balance-result.json"                 --output "$RUNNER_TEMP/product-qualification-${pass_id}.json"
          done
          cmp "$RUNNER_TEMP/product-qualification-1.json"               "$RUNNER_TEMP/product-qualification-2.json"

      - name: Require fail-closed authority mutation rejection
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/balance"
          python - "$root/balance-result.json" "$RUNNER_TEMP/mutated-balance.json" <<'PY'
          import json
          import sys
          from pathlib import Path

          value = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          value["maximum_feasible_total_source_bytes"] -= 100
          Path(sys.argv[2]).write_text(
              json.dumps(value, ensure_ascii=False, sort_keys=True, separators=(",", ":")) + "\n",
              encoding="utf-8",
          )
          PY
          if PYTHONPATH="$GITHUB_WORKSPACE/src"             python tools/qualify_d03_record_realization_product_v2.py               --composition-json "$root/composition.json"               --balance-result-json "$RUNNER_TEMP/mutated-balance.json"               --output "$RUNNER_TEMP/mutated-output.json"; then
            echo "mutated balance unexpectedly accepted" >&2
            exit 1
          fi
          test ! -e "$RUNNER_TEMP/mutated-output.json"

      - name: Independently verify qualification receipt
        shell: bash
        run: |
          set -euo pipefail
          python - "$RUNNER_TEMP/product-qualification-1.json" <<'PY'
          import hashlib
          import json
          import sys
          from pathlib import Path

          value = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          canonical = lambda item: json.dumps(
              item,
              ensure_ascii=False,
              sort_keys=True,
              separators=(",", ":"),
              allow_nan=False,
          ).encode("utf-8")
          claimed = value["qualification_identity_sha256"]
          core = dict(value)
          del core["qualification_identity_sha256"]
          assert hashlib.sha256(canonical(core)).hexdigest() == claimed
          assert value["product_head_sha"] == "efadbdac0c03e7c020501652f5624b96f289ec2e"
          assert value["product_selection_blob_sha1"] == "79eed6a6d3b941e89132f072593db1c74bd1d90d"
          assert value["hard_impossible_canonical_families"] == ["github:numpy/numpy"]
          assert value["budget_false_blocker_families_proven_exact"] == [
              "common-pile/ubuntu_irc",
              "en.loc.selected-digitized-books",
              "ua.rada.open-data.laws-texts",
          ]
          assert value["fallback_eligibility_by_stratum"] == {
              "ua": False,
              "en": False,
              "code": True,
          }
          assert value["repaired_strata"] == ["code"]
          assert value["selected_record_count"] == 5294
          assert value["selected_total_source_bytes"] == 20_000_000
          assert value["selected_stratum_source_bytes"] == {
              "ua": 9_000_000,
              "en": 7_000_000,
              "code": 4_000_000,
          }
          assert value["selected_membership_sha256"] == "a00572acfb1033f7bfe55e7e1f53ae9eb44b6fa039f3f378a156bec6fd13615f"
          assert value["selected_payload_projection_sha256"] == "9bcfc6eb09418c93a00373df6d4c4cf3e5795d54e12c0e4bc106eaecbc89de82"
          assert value["selected_family_bytes_sha256"] == "f54dec34d6c86506d3321686e63af0c226f4f7adec6bffdf7a5d8d51133db280"
          zero = {
              "canonical_capacity_credited": 0,
              "training_authorized_bytes": 0,
              "authorized_unique_loss_positions": 0,
              "authorized_optimized_target_exposure": 0,
              "tokenizer_fit_authorized": False,
              "model_training_authorized": False,
              "optimizer_updates_executed_on_real_targets": 0,
              "training_executed": False,
              "learned_weights_created": False,
              "final_test_outcomes_read": False,
              "paid_compute_used": False,
              "scale_promotion_authorized": False,
          }
          for key, expected in zero.items():
              assert value[key] == expected
          print("D03_PRODUCT_RECORD_REALIZATION_RECEIPT_VERIFIED")
          print(claimed)
          PY

      - name: Upload text-free Product qualification authority
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: d03-product-record-realization-${{ github.event.pull_request.head.sha }}
          path: ${{ runner.temp }}/product-qualification-1.json
          if-no-files-found: error
          retention-days: 90
