name: D03 President Decrees Bounded Intake

on:
  pull_request:
    paths:
      - "configs/data/d03_ua_president_decrees_intake_v1.json"
      - "tools/materialize_d03_ua_president_decrees_v1.py"
      - "tools/validate_d03_ua_president_decrees_v1.py"
      - "tests/test_d03_ua_president_decrees_intake_v1.py"
      - "docs/D03_UA_PRESIDENT_DECREES_BOUNDED_INTAKE.md"
      - ".github/workflows/d03-president-decrees-bounded-intake.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bounded-intake:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install focused test and lint tools
        run: python -m pip install --disable-pip-version-check pytest==8.4.2 ruff==0.12.12
      - name: Static contract and code checks
        run: |
          python -m compileall -q tools tests
          ruff check \
            tools/materialize_d03_ua_president_decrees_v1.py \
            tools/validate_d03_ua_president_decrees_v1.py \
            tests/test_d03_ua_president_decrees_intake_v1.py
          pytest -q tests/test_d03_ua_president_decrees_intake_v1.py
      - name: Independent bounded materialization A
        run: |
          python tools/materialize_d03_ua_president_decrees_v1.py \
            --output evidence/president_decrees_a.json \
            --max-pages 2 \
            --max-documents 40 \
            --request-delay 1.05
          python tools/validate_d03_ua_president_decrees_v1.py \
            evidence/president_decrees_a.json \
            --contract configs/data/d03_ua_president_decrees_intake_v1.json
      - name: Independent bounded materialization B
        run: |
          python tools/materialize_d03_ua_president_decrees_v1.py \
            --output evidence/president_decrees_b.json \
            --max-pages 2 \
            --max-documents 40 \
            --request-delay 1.05
          python tools/validate_d03_ua_president_decrees_v1.py \
            evidence/president_decrees_b.json \
            --contract configs/data/d03_ua_president_decrees_intake_v1.json
      - name: Require stable double-materialization identity
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          a = json.loads(Path("evidence/president_decrees_a.json").read_text())
          b = json.loads(Path("evidence/president_decrees_b.json").read_text())
          key = "materialization_identity_sha256"
          if a[key] != b[key]:
              raise SystemExit(f"materialization mismatch: {a[key]} != {b[key]}")
          print("materialization_identity_sha256", a[key])
          print("observed_yield", json.dumps(a["observed_yield"], sort_keys=True))
          PY
      - name: Upload body-free evidence
        uses: actions/upload-artifact@v4
        with:
          name: d03-president-decrees-bounded-intake
          path: evidence/*.json
          if-no-files-found: error
          retention-days: 7
