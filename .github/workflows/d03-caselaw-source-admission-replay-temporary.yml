name: TEMP D03 Caselaw Source Admission Real Replay

on:
  push:
    branches:
      - d03/1342-caselaw-source-admission-real-replay
    paths:
      - ".github/workflows/d03-caselaw-source-admission-replay-temporary.yml"
      - "tools/run_d03_caselaw_source_admission_replay_v1.py"
      - "tests/test_d03_caselaw_source_admission_replay_v1.py"

permissions:
  contents: read

concurrency:
  group: d03-caselaw-source-admission-${{ github.ref }}
  cancel-in-progress: true

jobs:
  real-replay:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      EXECUTION_HEAD: ${{ github.sha }}
      PRODUCT_COMMIT: e63f2fd4eddbd348b57a42e1fb41cb658d0c3a82
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11.16"
          cache: pip
      - name: Install project dev environment
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]
      - name: Focused source-admission replay regressions
        run: pytest -q tests/test_d03_caselaw_source_admission_replay_v1.py
      - name: Recover exact historical Product blobs
        run: |
          mkdir -p "$RUNNER_TEMP/product"
          git show "$PRODUCT_COMMIT:tools/materialize_d03_common_pile_caselaw.py" \
            > "$RUNNER_TEMP/product/materialize.py"
          git show "$PRODUCT_COMMIT:configs/data/d03_common_pile_caselaw_zero_credit_v1.json" \
            > "$RUNNER_TEMP/product/config.json"
      - name: Independent exact replay and source admission A
        run: |
          mkdir -p "$RUNNER_TEMP/a"
          python tools/run_d03_caselaw_source_admission_replay_v1.py \
            --download \
            --product-tool "$RUNNER_TEMP/product/materialize.py" \
            --product-config "$RUNNER_TEMP/product/config.json" \
            --source-gzip "$RUNNER_TEMP/a/cap_00044.jsonl.gz" \
            --source-gzip "$RUNNER_TEMP/a/cap_00043.jsonl.gz" \
            --candidate-jsonl "$RUNNER_TEMP/a/candidate.jsonl" \
            --admitted-candidate-jsonl "$RUNNER_TEMP/a/admitted.jsonl" \
            --materializer-report "$RUNNER_TEMP/a/materializer-report.json" \
            --report "$RUNNER_TEMP/a/source-admission-report.json"
      - name: Independent exact replay and source admission B
        run: |
          mkdir -p "$RUNNER_TEMP/b"
          python tools/run_d03_caselaw_source_admission_replay_v1.py \
            --download \
            --product-tool "$RUNNER_TEMP/product/materialize.py" \
            --product-config "$RUNNER_TEMP/product/config.json" \
            --source-gzip "$RUNNER_TEMP/b/cap_00044.jsonl.gz" \
            --source-gzip "$RUNNER_TEMP/b/cap_00043.jsonl.gz" \
            --candidate-jsonl "$RUNNER_TEMP/b/candidate.jsonl" \
            --admitted-candidate-jsonl "$RUNNER_TEMP/b/admitted.jsonl" \
            --materializer-report "$RUNNER_TEMP/b/materializer-report.json" \
            --report "$RUNNER_TEMP/b/source-admission-report.json"
      - name: Verify independent byte identity and zero-credit evidence
        run: |
          cmp "$RUNNER_TEMP/a/cap_00044.jsonl.gz" "$RUNNER_TEMP/b/cap_00044.jsonl.gz"
          cmp "$RUNNER_TEMP/a/cap_00043.jsonl.gz" "$RUNNER_TEMP/b/cap_00043.jsonl.gz"
          cmp "$RUNNER_TEMP/a/candidate.jsonl" "$RUNNER_TEMP/b/candidate.jsonl"
          cmp "$RUNNER_TEMP/a/admitted.jsonl" "$RUNNER_TEMP/b/admitted.jsonl"
          cmp "$RUNNER_TEMP/a/materializer-report.json" \
            "$RUNNER_TEMP/b/materializer-report.json"
          cmp "$RUNNER_TEMP/a/source-admission-report.json" \
            "$RUNNER_TEMP/b/source-admission-report.json"
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          root = Path(os.environ["RUNNER_TEMP"])
          report = json.loads(
              (root / "a/source-admission-report.json").read_text(encoding="utf-8")
          )
          assert report["historical_product_replay_reproduced"] is True
          assert report["input_records"] == 5658
          assert report["input_normalized_utf8_bytes"] == 5962147
          assert report["source_admission_executed"] is True
          assert 0 <= report["source_admitted_records"] <= report["input_records"]
          assert (
              0
              <= report["source_admitted_normalized_utf8_bytes"]
              <= report["input_normalized_utf8_bytes"]
          )
          assert report["canonical_capacity_credited"] == 0
          assert report["training_authorized_bytes"] == 0
          assert report["unique_causal_loss_positions_authorized"] == 0
          assert report["tokenizer_fit_authorized"] is False
          assert report["training_eligible"] is False
          assert report["model_training_executed"] is False
          assert report["learned_weights_created"] is False
          assert report["final_test_accessed"] is False
          assert report["paid_compute_used"] is False
          assert report["foreign_pretrained_weights_used"] is False
          assert (
              report["external_llm_or_api_used_for_data_or_intelligence"] is False
          )
          out = root / "caselaw-source-admission-evidence"
          out.mkdir()
          (out / "source-admission-report.json").write_text(
              json.dumps(report, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          print(
              json.dumps(
                  {
                      "source_admitted_records": report["source_admitted_records"],
                      "source_admitted_normalized_utf8_bytes": report[
                          "source_admitted_normalized_utf8_bytes"
                      ],
                      "source_admitted_candidate_sha256": report[
                          "source_admitted_candidate_sha256"
                      ],
                      "report_identity_sha256": report["report_identity_sha256"],
                  },
                  sort_keys=True,
              )
          )
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: d03-caselaw-source-admission-${{ env.EXECUTION_HEAD }}
          path: ${{ runner.temp }}/caselaw-source-admission-evidence/
          if-no-files-found: error
          retention-days: 30
