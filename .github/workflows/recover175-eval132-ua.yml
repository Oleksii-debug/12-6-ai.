name: RECOVER-175 EVAL-132 Ukrainian Raw-LM Ladder

on:
  pull_request:
    branches:
      - milestone150/learned-base-ladder-v1-20260826
  workflow_dispatch:

concurrency:
  group: recover175-eval132-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  actions: read
  pull-requests: write

jobs:
  eval132-ua-ladder:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      PYTHONPATH: src
      OMP_NUM_THREADS: "2"
      MKL_NUM_THREADS: "2"
      M150_RUN_ID: "32938439174"
      M150_SOURCE_SHA: "8344085ddd0b52e4b698c3344a1d0482153525dc"
    steps:
      - name: Checkout exact RECOVER-175 head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up exact Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11.16"

      - name: Bind exact source and frozen EVAL-132 blobs
        env:
          EXPECTED_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SOURCE_SHA"
          test "$(git rev-parse HEAD:data/evaluation/benchmark_registry.json)" = "170d80f90b871481ceae6b3d651656130c1892f7"
          test "$(git rev-parse HEAD:data/evaluation/ua_raw_base_v1/manifest.json)" = "2db0bf5c6f93838852b8a730584946986fed530e"
          test "$(git rev-parse HEAD:data/evaluation/ua_raw_base_v1/source_rows.json)" = "068c5b515cfafef1f5dbd1ab8b44348e3e7e00f9"
          test "$(git rev-parse HEAD:data/external/reserved_fingerprints.json)" = "19e4dbebd8a34c165d6c20eb23f0ca79cbd02b53"
          test "$(git rev-parse HEAD:src/twelve_six/evaluation_ua_v1.py)" = "0f87477a9382281e63ee64ea85c07b7ce194d118"
          test "$(git rev-parse HEAD:tests/test_eval132_ua_suite.py)" = "5aef96e4d602adc0c41717610b47fc73f39e554e"

      - name: Dependency and tool preflight before tests or runtime install
        env:
          EXPECTED_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: >-
          python tools/ci_dependency_preflight.py
          --profile linux-x86_64
          --source-sha "$EXPECTED_SOURCE_SHA"
          --output recover175-ci-preflight.json

      - name: Install universal hash-locked CPU runtime and exact test tooling
        run: |
          set -euo pipefail
          python -m venv .r175
          .r175/bin/python -m pip install \
            --disable-pip-version-check --no-deps --require-hashes \
            -r requirements/locks/linux-x86_64/toolchain.lock.txt
          .r175/bin/python -m pip install \
            --disable-pip-version-check --no-deps --require-hashes \
            -r requirements/locks/linux-x86_64/runtime.lock.txt
          .r175/bin/python -m pip install \
            --disable-pip-version-check --no-deps --require-hashes \
            -r requirements/locks/linux-x86_64/dev.lock.txt

      - name: Compile and test frozen suite plus convergence contracts
        run: |
          set -euo pipefail
          .r175/bin/python -m compileall -q src/twelve_six
          .r175/bin/python -m pytest -q \
            tests/test_eval132_ua_suite.py \
            tests/test_recover175_eval132_ladder.py \
            tests/test_milestone150_learned_base_ladder.py

      - name: Require successful exact M150 evidence and download it
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          STATE="$(gh run view "$M150_RUN_ID" --repo "$GH_REPO" --json status,conclusion --jq '.status + " " + (.conclusion // "")')"
          test "$STATE" = "completed success"
          rm -rf m150-upstream
          mkdir -p m150-upstream
          gh run download "$M150_RUN_ID" --repo "$GH_REPO" \
            --name milestone150-learned-base-ladder-v1 \
            --dir m150-upstream
          REPORT="$(find m150-upstream -type f -name ladder-report.json -print -quit)"
          test -n "$REPORT"
          M150_DIR="$(dirname "$REPORT")"
          test -f "$M150_DIR/retained/index.json"
          printf 'M150_EVIDENCE=%s\n' "$M150_DIR" >> "$GITHUB_ENV"

      - name: Execute random-init and learned EVAL-132 ladder diagnostics
        run: |
          set -euo pipefail
          .r175/bin/python -m twelve_six.recover175_eval132_ladder \
            --repo-root . \
            --m150-evidence "$M150_EVIDENCE" \
            --expected-m150-sha "$M150_SOURCE_SHA" \
            --output recover175-evidence | tee recover175-evidence-summary.json

      - name: Validate convergence report boundaries
        run: |
          set -euo pipefail
          .r175/bin/python - <<'PY'
          import json
          from pathlib import Path
          from twelve_six.checkpoint import hash_json

          p = Path("recover175-evidence/learned-base-ladder-v1.json")
          r = json.loads(p.read_text(encoding="utf-8"))
          expected = r["report_sha256"]
          unsigned = dict(r)
          unsigned.pop("report_sha256")
          assert hash_json(unsigned) == expected
          assert r["minimum_comparable_ladder_complete"] is True
          assert r["ten_million"]["status"] == "INCOMPLETE_NO_VERIFIED_LEARNED_CHECKPOINT"
          diag = r["ukrainian_raw_lm_diagnostic"]
          assert diag["suite_registration"]["status"] == "PASS"
          assert diag["tokenizer_length_artifact_separation"]["status"] == "PASS"
          assert diag["claims"]["broad_ukrainian_proficiency"] is False
          assert diag["claims"]["instruction_following"] is False
          assert diag["claims"]["paid_compute"] is False
          for scale in ("100k", "500k", "1m"):
              learned = diag["scales"][scale]["learned_best"]
              random = diag["scales"][scale]["random_init"]
              assert learned["state_unchanged"] is True
              assert random["state_unchanged"] is True
              assert learned["optimized_tokens_delta"] == 0
              assert learned["tokenizer_normalized"]["preferred"]["tokens_per_source_byte"] == 1.0
          print(json.dumps({
              "validation": "PASS",
              "report_sha256": r["report_sha256"],
              "m150_report_sha256": r["base_ladder"]["report_sha256"],
              "eval132_report_sha256": diag["report_sha256"],
          }, indent=2, sort_keys=True))
          PY

      - name: Publish exact-head RECOVER-175 evidence to PR
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          .r175/bin/python - <<'PY'
          import json
          from pathlib import Path
          r = json.loads(Path("recover175-evidence/learned-base-ladder-v1.json").read_text(encoding="utf-8"))
          d = r["ukrainian_raw_lm_diagnostic"]
          lines = [
              "### RECOVER-175 EVAL-132 exact-head Ukrainian raw-LM evidence",
              "",
              f"- frozen dataset: `{d['suite']['dataset_sha256']}` / {d['suite']['item_count']} pairs / 9 phenomena",
              f"- reserved evaluation registration: `{d['suite_registration']['status']}` / {d['suite_registration']['reserved_variant_count']} variants",
              f"- upstream M150 report: `{d['common_truth']['m150_report_sha256']}`",
              "- tokenizer-length separation: exact common `s0-byte-v1`, 1.0 token/source-byte",
              "- 10M: `INCOMPLETE_NO_VERIFIED_LEARNED_CHECKPOINT`",
              "",
              "| scale | random acc | learned acc | learned mean margin nats/byte | learned preferred BPB |",
              "|---|---:|---:|---:|---:|",
          ]
          for scale in ("100k", "500k", "1m"):
              s = d["scales"][scale]
              lines.append(
                  f"| {scale} | {s['random_init']['overall']['accuracy']:.6f} | "
                  f"{s['learned_best']['overall']['accuracy']:.6f} | "
                  f"{s['learned_best']['overall']['mean_margin_nats_per_source_byte']:.9f} | "
                  f"{s['learned_best']['tokenizer_normalized']['preferred']['conditional_bpb']:.6f} |"
              )
          lines += [
              "",
              f"Composite ladder report SHA-256: `{r['report_sha256']}`",
              "",
              "Interpretation boundary: this is a project-owned raw-Base conditional-likelihood diagnostic, not a broad Ukrainian proficiency or instruction-following evaluation. No intelligence, production-readiness or alignment claim is made.",
          ]
          Path("recover175-evidence/pr-comment.md").write_text("\n".join(lines) + "\n", encoding="utf-8")
          PY
          gh pr comment "$PR_NUMBER" --repo "$GH_REPO" --body-file recover175-evidence/pr-comment.md

      - name: Upload RECOVER-175 convergence evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: recover175-eval132-ua-learned-base-ladder-v1
          path: |
            recover175-ci-preflight.json
            recover175-evidence/learned-base-ladder-v1.json
            recover175-evidence/eval132-ua-report.json
            recover175-evidence/pr-comment.md
            recover175-evidence-summary.json
          if-no-files-found: error
          retention-days: 30
