name: Plan 7 Section 7 local-free large-scale paths
on:
  pull_request:
    paths:
      - 'src/twelve_six/large_scale_paths.py'
      - 'tests/test_plan7_large_scale_paths.py'
      - '.github/workflows/plan7-large-paths.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  plan7-s7-fixture:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e '.[dev]'
      - run: python -m ruff check src/twelve_six/large_scale_paths.py tests/test_plan7_large_scale_paths.py
      - run: python -m pytest -q tests/test_plan7_billion_systems_gate.py tests/test_plan7_large_scale_paths.py
