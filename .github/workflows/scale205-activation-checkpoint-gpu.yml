name: SCALE-205 Activation Checkpoint GPU Qualification

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/scale205-activation-checkpoint-gpu.yml"
      - "tools/run_scale205_activation_checkpoint_gpu.py"
      - "tests/test_scale205_gpu_qualification.py"
      - "src/twelve_six/distributed/activation_checkpointing.py"
      - "tools/benchmark_activation_checkpointing.py"
      - "configs/stages/s3_10m.json"
      - "configs/stages/s4_100m_accelerator.candidate.json"
      - "requirements/locks/**"
      - "requirements/profiles/**"

permissions:
  contents: read

jobs:
  cpu-contract:
    name: Fail-closed contract tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Prove exact source checkout
        env:
          SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11.16"
      - name: Install exact CPU test closure
        run: |
          python -m venv .scale205-cpu
          .scale205-cpu/bin/python -m pip install --disable-pip-version-check --require-hashes --no-deps -r requirements/locks/linux-x86_64/toolchain.lock.txt
          .scale205-cpu/bin/python -m pip install --disable-pip-version-check --require-hashes --no-deps -r requirements/locks/linux-x86_64/runtime.lock.txt
          .scale205-cpu/bin/python -m pip install --disable-pip-version-check --require-hashes --no-deps -r requirements/locks/linux-x86_64/dev.lock.txt
          PIP_NO_INDEX=1 PIP_DISABLE_PIP_VERSION_CHECK=1 .scale205-cpu/bin/python -m pip install --no-deps --no-build-isolation .
      - name: Prove no-GPU result fails closed
        run: |
          .scale205-cpu/bin/python -m pytest -q tests/test_scale205_gpu_qualification.py tests/test_activation_checkpointing.py
          .scale205-cpu/bin/python tools/run_scale205_activation_checkpoint_gpu.py --output scale205-cpu-no-gpu.json
          .scale205-cpu/bin/python - <<'PY'
          import json
          value = json.load(open("scale205-cpu-no-gpu.json", encoding="utf-8"))
          if value["status"] != "NOT_RUN_NO_GPU":
              raise SystemExit(f"ordinary hosted CPU runner did not fail closed: {value['status']}")
          PY
      - name: Upload fail-closed CPU evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: scale205-cpu-fail-closed
          path: scale205-cpu-no-gpu.json
          if-no-files-found: error
          retention-days: 30

  gpu-qualification:
    name: Authorized target GPU measurement
    if: ${{ vars.SCALE205_FREE_GPU_AUTHORIZED == 'true' }}
    runs-on: [self-hosted, linux, x64, gpu, twelve-six-free-authorized]
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Prove exact source checkout
        env:
          SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11.16"
      - name: Verify exact D08 CUDA purpose environment
        env:
          SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          python tools/verify_purpose_environment.py \
            --profile linux-x86_64-cuda-training \
            --source-sha "$SOURCE_SHA" \
            --evidence-out scale205-d08-cuda-environment.json
      - name: Build persistent exact CUDA qualification environment
        run: |
          python -m venv .scale205-gpu
          .scale205-gpu/bin/python -m pip install --disable-pip-version-check --require-hashes --no-deps -r requirements/locks/linux-x86_64/toolchain.lock.txt
          .scale205-gpu/bin/python -m pip install --disable-pip-version-check --require-hashes --no-deps -r requirements/locks/linux-x86_64/runtime.lock.txt
          PIP_NO_INDEX=1 PIP_DISABLE_PIP_VERSION_CHECK=1 .scale205-gpu/bin/python -m pip install --no-deps --no-build-isolation .
      - name: Record physical GPU preflight
        run: |
          nvidia-smi --query-gpu=name,uuid,driver_version,memory.total,memory.free --format=csv,noheader > scale205-nvidia-smi.txt || true
          .scale205-gpu/bin/python - <<'PY' > scale205-cuda-preflight.json
          import json, torch
          value = {
              "torch": torch.__version__,
              "torch_cuda_build": torch.version.cuda,
              "cuda_available": torch.cuda.is_available(),
              "cuda_device_count": torch.cuda.device_count(),
          }
          if torch.cuda.is_available() and torch.cuda.device_count() > 0:
              free, total = torch.cuda.mem_get_info(0)
              value.update({
                  "device_name": torch.cuda.get_device_name(0),
                  "capability": list(torch.cuda.get_device_capability(0)),
                  "bf16_supported": torch.cuda.is_bf16_supported(),
                  "free_hbm_bytes": free,
                  "total_hbm_bytes": total,
              })
          print(json.dumps(value, sort_keys=True))
          PY
      - name: Run bounded SCALE-205 qualification
        env:
          SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          .scale205-gpu/bin/python tools/run_scale205_activation_checkpoint_gpu.py \
            --authorized-free-gpu \
            --dtype bf16 \
            --output scale205-activation-checkpoint-gpu.json
      - name: Upload compact device-bound evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: scale205-activation-checkpoint-gpu
          path: |
            scale205-d08-cuda-environment.json
            scale205-cuda-preflight.json
            scale205-nvidia-smi.txt
            scale205-activation-checkpoint-gpu.json
          if-no-files-found: warn
          retention-days: 30
