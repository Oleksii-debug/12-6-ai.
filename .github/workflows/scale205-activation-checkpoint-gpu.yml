name: SCALE-205 Activation Checkpoint GPU

on:
  pull_request:
    paths:
      - ".github/workflows/scale205-activation-checkpoint-gpu.yml"
      - "docs/SCALE205_ACTIVATION_CHECKPOINT_GPU.md"
      - "tools/run_scale205_activation_checkpoint_gpu.py"
      - "tests/test_scale205_activation_checkpoint_gpu.py"
      - "src/twelve_six/distributed/activation_checkpointing.py"
      - "tools/benchmark_activation_checkpointing.py"
      - "configs/stages/s3_10m.json"
      - "configs/stages/s4_100m_accelerator.candidate.json"
      - "requirements/profiles/linux-x86_64-cuda-training/profile.json"
      - "requirements/locks/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  target-gpu-validation:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Prove exact source checkout
        env:
          SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$SOURCE_SHA"

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11.16"

      - name: Validate accepted D08 CUDA-purpose identity
        run: >-
          python tools/verify_purpose_environment.py
          --profile linux-x86_64-cuda-training
          --validate-only

      - id: gpu
        name: Detect actual authorized CUDA hardware
        env:
          SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          if command -v nvidia-smi >/dev/null 2>&1 && nvidia-smi -L 2>/dev/null | grep -q '^GPU '; then
            echo "visible=true" >> "$GITHUB_OUTPUT"
            nvidia-smi --query-gpu=index,name,memory.total,memory.free,driver_version --format=csv,noheader
          else
            echo "visible=false" >> "$GITHUB_OUTPUT"
            python - <<'PY'
          import json
          import os
          import platform
          from pathlib import Path

          result = {
              "schema_version": "12-6.scale205.activation-checkpoint-gpu.v1",
              "source_sha": os.environ["SOURCE_SHA"].lower(),
              "scale143_source_sha": "30f85fdfb930bb38d45d116fee9c2e82f8241b56",
              "status": "NOT_RUN_NO_GPU",
              "gpu_pass": False,
              "paid_compute": False,
              "reason": "No NVIDIA CUDA device is visible on this runner; CPU evidence is not promoted to a GPU PASS.",
              "preflight": {
                  "nvidia_smi_visible_device": False,
                  "platform": platform.platform(),
                  "python": platform.python_version(),
              },
              "comparisons": {},
          }
          Path("scale205-activation-checkpoint-gpu.json").write_text(
              json.dumps(result, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          print(json.dumps(result, indent=2, sort_keys=True))
          PY
          fi

      - name: Install exact accepted CUDA runtime
        if: steps.gpu.outputs.visible == 'true'
        run: |
          set -euo pipefail
          python -m venv .scale205
          .scale205/bin/python -m pip install \
            --disable-pip-version-check \
            --require-hashes \
            --no-deps \
            -r requirements/locks/linux-x86_64/runtime.lock.txt

      - name: Run real CUDA none-vs-per-block validation
        if: steps.gpu.outputs.visible == 'true'
        env:
          SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          PYTHONPATH: src:.
        run: |
          set -euo pipefail
          .scale205/bin/python tools/run_scale205_activation_checkpoint_gpu.py \
            --dtype bf16 \
            --measured-steps 2 \
            --output scale205-activation-checkpoint-gpu.json

      - name: Upload SCALE-205 evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: scale205-activation-checkpoint-gpu
          path: scale205-activation-checkpoint-gpu.json
          if-no-files-found: error
          retention-days: 30
