name: D03 CPython stdlib terminal execution

on:
  push:
    branches:
      - d03/cpython-stdlib-expansion-current-main-20260907
    paths:
      - '.github/workflows/d03-cpython-stdlib-terminal-execution.yml'
      - 'tools/materialize_d03_cpython_stdlib_v1.py'
      - 'tests/test_materialize_d03_cpython_stdlib_v1.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  execute:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Focused validation
        run: |
          python -m pip install --disable-pip-version-check pytest ruff
          python -m pytest -q tests/test_materialize_d03_cpython_stdlib_v1.py
          ruff check tests/test_materialize_d03_cpython_stdlib_v1.py
          python -m py_compile tools/materialize_d03_cpython_stdlib_v1.py tests/test_materialize_d03_cpython_stdlib_v1.py
          python - <<'PY'
          from pathlib import Path
          for name in ('tools/materialize_d03_cpython_stdlib_v1.py', 'tests/test_materialize_d03_cpython_stdlib_v1.py'):
              too_long = [i for i, line in enumerate(Path(name).read_text(encoding='utf-8').splitlines(), 1) if len(line) > 100]
              if too_long:
                  raise SystemExit(f'{name}: lines >100: {too_long}')
          PY
      - name: Exact immutable source acquisition twice
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/cpython-run1" "$RUNNER_TEMP/cpython-run2" "$RUNNER_TEMP/receipt"
          url='https://codeload.github.com/python/cpython/tar.gz/23180c50082fe98784c78511b335d7274ed87fb7'
          curl --fail --location --retry 3 --retry-all-errors --silent --show-error "$url" -o "$RUNNER_TEMP/cpython-run1/source.tar.gz"
          curl --fail --location --retry 3 --retry-all-errors --silent --show-error "$url" -o "$RUNNER_TEMP/cpython-run2/source.tar.gz"
          test "$(stat -c %s "$RUNNER_TEMP/cpython-run1/source.tar.gz")" -le $((80 * 1024 * 1024))
          test "$(stat -c %s "$RUNNER_TEMP/cpython-run2/source.tar.gz")" -le $((80 * 1024 * 1024))
          sha256sum "$RUNNER_TEMP/cpython-run1/source.tar.gz" "$RUNNER_TEMP/cpython-run2/source.tar.gz"
          cmp "$RUNNER_TEMP/cpython-run1/source.tar.gz" "$RUNNER_TEMP/cpython-run2/source.tar.gz"
      - name: Build exact pinned source grammar interpreter
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/cpython-build"
          tar -xzf "$RUNNER_TEMP/cpython-run1/source.tar.gz" --strip-components=1 -C "$RUNNER_TEMP/cpython-build"
          cd "$RUNNER_TEMP/cpython-build"
          ./configure --without-ensurepip > "$RUNNER_TEMP/cpython-configure.log"
          make -j2 > "$RUNNER_TEMP/cpython-make.log"
          ./python - <<'PY'
          import ast
          import ssl
          import sys
          assert sys.version_info[:2] == (3, 16), sys.version
          ast.parse('lazy import example')
          print(sys.version)
          print(ssl.OPENSSL_VERSION)
          PY
      - name: Materialize independently twice under pinned grammar
        shell: bash
        run: |
          set -euo pipefail
          PY="$RUNNER_TEMP/cpython-build/python"
          "$PY" tools/materialize_d03_cpython_stdlib_v1.py \
            --archive "$RUNNER_TEMP/cpython-run1/source.tar.gz" \
            --records "$RUNNER_TEMP/cpython-run1/records.jsonl" \
            --report "$RUNNER_TEMP/cpython-run1/report.json"
          "$PY" tools/materialize_d03_cpython_stdlib_v1.py \
            --archive "$RUNNER_TEMP/cpython-run2/source.tar.gz" \
            --records "$RUNNER_TEMP/cpython-run2/records.jsonl" \
            --report "$RUNNER_TEMP/cpython-run2/report.json"
      - name: Verify reproducibility and zero-credit rights boundary
        env:
          PRODUCT_HEAD: ${{ github.sha }}
        run: |
          python - <<'PY'
          import hashlib
          import json
          import os
          import pathlib
          import re
          import subprocess

          root = pathlib.Path(os.environ['RUNNER_TEMP'])
          r1 = root / 'cpython-run1'
          r2 = root / 'cpython-run2'
          out = root / 'receipt' / 'execution_receipt.json'

          def digest(path):
              data = path.read_bytes()
              return {'bytes': len(data), 'sha256': hashlib.sha256(data).hexdigest()}

          source1 = digest(r1 / 'source.tar.gz')
          source2 = digest(r2 / 'source.tar.gz')
          records1 = digest(r1 / 'records.jsonl')
          records2 = digest(r2 / 'records.jsonl')
          report1_file = digest(r1 / 'report.json')
          report2_file = digest(r2 / 'report.json')
          if source1 != source2:
              raise SystemExit('archives are not byte-identical')
          if records1 != records2:
              raise SystemExit('records are not byte-identical across independent materializations')
          if report1_file != report2_file:
              raise SystemExit('reports are not byte-identical across independent materializations')

          report = json.loads((r1 / 'report.json').read_text(encoding='utf-8'))
          expected_source = {
              'repository': 'python/cpython',
              'commit': '23180c50082fe98784c78511b335d7274ed87fb7',
              'tree': '8853f9fbbf23d2a8c8b7afc9ecab242a482125f2',
              'license_blob_sha1': '20cf39097c68baa17cc566b64e76d34ebf034044',
              'family_id': 'code.python.cpython',
          }
          if report['source'] != expected_source:
              raise SystemExit('source authority drift')
          truth = report['truth_boundary']
          expected_zero = {
              'canonical_corpus_admitted': False,
              'canonical_capacity_credit_bytes': 0,
              'family_count_credit_added': 0,
              'training_authorized_bytes': 0,
              'unique_causal_loss_positions': 0,
              'tokenizer_fit_executed': False,
              'optimizer_updates': 0,
              'model_training_executed': False,
              'final_test_accessed': False,
              'paid_compute_used': False,
          }
          for key, value in expected_zero.items():
              if truth.get(key) != value:
                  raise SystemExit(f'truth-boundary drift: {key}')
          if report['rights']['selected_objects_rights_admitted'] is not False:
              raise SystemExit('rights admission must remain false')
          if report['rights']['file_level_incorporated_license_retest_required'] is not True:
              raise SystemExit('file-level rights retest must remain required')
          if report['selection']['selected_objects'] <= 0:
              raise SystemExit('no source objects selected')
          if report['selection']['selected_bytes'] > 1_200_000:
              raise SystemExit('selection exceeds cap')

          allowed_spdx = {'PSF-2.0', '0BSD'}
          spdx_re = re.compile(r'SPDX-License-Identifier:\s*([^\s*]+)', re.I)
          explicit_spdx = {}
          ambiguous_notice_objects = 0
          row_count = 0
          for line in (r1 / 'records.jsonl').read_text(encoding='utf-8').splitlines():
              row = json.loads(line)
              row_count += 1
              if row.get('training_eligible') is not False or row.get('evaluation_eligible') is not False:
                  raise SystemExit('candidate row gained scientific eligibility')
              text = row.pop('text')
              tags = sorted(set(spdx_re.findall(text[:12000])))
              if tags:
                  explicit_spdx[row['record_id']] = tags
              head = text[:12000].lower()
              if 'copyright' in head or 'license' in head or 'licence' in head:
                  ambiguous_notice_objects += 1
              if any(tag not in allowed_spdx for tag in tags):
                  raise SystemExit('selected object contains non-allowlisted SPDX marker')
          if row_count != report['selection']['selected_objects']:
              raise SystemExit('record/report count mismatch')

          parser_version = subprocess.check_output(
              [str(root / 'cpython-build' / 'python'), '-c', 'import sys; print(sys.version)'],
              text=True,
          ).strip()
          receipt = {
              'schema_version': '12-6.d03-cpython-stdlib-terminal-execution-receipt.v1',
              'product_pr': 903,
              'product_head_executed': os.environ['PRODUCT_HEAD'],
              'execution_class': 'LOCAL_FREE_GITHUB_HOSTED_PUBLIC_RUNNER',
              'source': expected_source,
              'source_parser': {
                  'authority': 'BUILT_FROM_SAME_PINNED_CPYTHON_ARCHIVE',
                  'expected_version': '3.16.0a0',
                  'observed_version': parser_version,
              },
              'acquisition': {
                  'run1_archive': source1,
                  'run2_archive': source2,
                  'archive_bytes_identical': source1 == source2,
              },
              'reproducibility': {
                  'records_run1': records1,
                  'records_run2': records2,
                  'records_byte_identical': records1 == records2,
                  'report_run1': report1_file,
                  'report_run2': report2_file,
                  'report_byte_identical': report1_file == report2_file,
                  'inventory_identity_sha256': report['selection']['inventory_identity_sha256'],
                  'materializer_report_identity_sha256': report['report_identity_sha256'],
              },
              'selection': {
                  'eligible_archive_objects': report['selection']['eligible_archive_objects'],
                  'selected_objects': report['selection']['selected_objects'],
                  'selected_bytes': report['selection']['selected_bytes'],
                  'skipped_for_cap': report['selection']['skipped_for_cap'],
              },
              'rights_retest': {
                  'status': 'NOT_ADMITTED_FILE_LEVEL_REVIEW_REQUIRED',
                  'blanket_admission': False,
                  'selected_objects_rights_admitted': False,
                  'explicit_spdx_object_count': len(explicit_spdx),
                  'explicit_non_allowlisted_spdx_object_count': 0,
                  'objects_with_copyright_or_license_notice_in_first_12k': ambiguous_notice_objects,
                  'conclusion': 'ZERO_CREDIT_PENDING_BINDING_RIGHTS_AUTHORITY',
              },
              'truth_boundary': {
                  'real_source_bytes_executed': True,
                  'canonical_corpus_admitted': False,
                  'canonical_capacity_credit_bytes': 0,
                  'family_count_credit_added': 0,
                  'training_authorized_bytes': 0,
                  'unique_causal_loss_positions': 0,
                  'optimized_target_exposure': 0,
                  'tokenizer_fit_executed': False,
                  'optimizer_updates': 0,
                  'model_training_executed': False,
                  'learned_weights_created': False,
                  'final_test_accessed': False,
                  'paid_compute_used': False,
                  'foreign_pretrained_weights': False,
              },
          }
          canonical = json.dumps(receipt, sort_keys=True, separators=(',', ':'), ensure_ascii=False).encode() + b'\n'
          receipt['evidence_identity_sha256'] = hashlib.sha256(canonical).hexdigest()
          out.write_text(json.dumps(receipt, sort_keys=True, indent=2, ensure_ascii=False) + '\n', encoding='utf-8')
          print(out.read_text(encoding='utf-8'))
          PY
      - name: Upload compact text-free execution receipt
        uses: actions/upload-artifact@v4
        with:
          name: d03-cpython-stdlib-execution-receipt
          path: |
            ${{ runner.temp }}/receipt/execution_receipt.json
            ${{ runner.temp }}/cpython-run1/report.json
            ${{ runner.temp }}/cpython-run2/report.json
          if-no-files-found: error
          retention-days: 1
