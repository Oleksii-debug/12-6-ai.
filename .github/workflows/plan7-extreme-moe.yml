name: Plan 7 Section 9 LOCAL_FREE sparse MoE validation
on:
  pull_request:
    paths:
      - 'src/twelve_six/extreme_moe_paths.py'
      - 'tests/test_plan7_extreme_moe_paths.py'
      - '.github/workflows/plan7-extreme-moe.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  plan7-s9:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e '.[dev]'
      - run: python -m ruff check src/twelve_six/extreme_moe_paths.py tests/test_plan7_extreme_moe_paths.py
      - run: python -m pytest -q tests/test_plan7_extreme_moe_paths.py
