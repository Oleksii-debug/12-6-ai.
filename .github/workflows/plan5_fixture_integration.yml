name: Plan 5 Agent Runtime Fixture Integration
on:
  push:
    paths:
      - 'src/twelve_six_agent_runtime/fixture_integration.py'
      - 'tests/test_agent_fixture_integration_section11.py'
      - 'tests/fixtures/plan5_agent_runtime_scenario_v1.json'
      - '.github/workflows/plan5_fixture_integration.yml'
  pull_request:
    paths:
      - 'src/twelve_six_agent_runtime/fixture_integration.py'
      - 'tests/test_agent_fixture_integration_section11.py'
      - 'tests/fixtures/plan5_agent_runtime_scenario_v1.json'
      - '.github/workflows/plan5_fixture_integration.yml'
jobs:
  local-free:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install pytest ruff
      - run: PYTHONPATH=src python -m pytest -q tests/test_agent_fixture_integration_section11.py tests/test_agent_security_section10.py tests/test_agent_memory_section3.py tests/test_agent_world_section4.py tests/test_agent_tools_section7.py tests/test_agent_scheduler_section6.py tests/test_agent_task_state_section2.py
      - run: PYTHONPATH=src python -m compileall -q src/twelve_six_agent_runtime
      - run: ruff check src/twelve_six_agent_runtime/fixture_integration.py tests/test_agent_fixture_integration_section11.py
