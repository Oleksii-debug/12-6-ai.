name: NEXT100-063 Canonical Source Registry V5

on:
  pull_request:
    paths:
      - ".github/workflows/next100-063-source-registry-v5.yml"
      - "configs/data/next100_063_terminal_source_registry_v4.json"
      - "configs/data/next100_063_terminal_source_registry_v5.json"
      - "tools/validate_next100_063_terminal_source_registry_v5.py"
      - "tools/validate_next100_063_terminal_source_registry_v5_live.py"
      - "tools/diagnose_next100_063_balance_capacity.py"
      - "tools/diagnose_next100_063_balance_capacity_v5.py"
      - "tests/test_next100_063_terminal_source_registry_v5.py"
      - "tests/test_next100_063_terminal_source_registry_v5_live.py"
      - "tests/test_next100_063_balance_capacity_v5.py"
  workflow_dispatch:

concurrency:
  group: next100-063-v5-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  actions: read
  contents: read

jobs:
  terminal-source-registry-v5:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      SOURCE_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11.16"

      - name: Prove exact V5 source checkout
        shell: bash
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          test "$actual" = "$SOURCE_HEAD"
          printf 'NEXT100_063_V5_SOURCE_SHA=%s\n' "$actual"

      - name: Install exact focused test runtime
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --require-hashes --no-deps \
            -r requirements/locks/linux-x86_64/dev.lock.txt

      - name: Validate immutable V4 plus exact V5 composition
        shell: bash
        run: |
          set -euo pipefail
          python tools/validate_next100_063_terminal_source_registry_v5.py
          python tools/diagnose_next100_063_balance_capacity_v5.py --json > next100-063-v5-balance.json

      - name: Focused V5 regressions and lint
        shell: bash
        run: |
          set -euo pipefail
          python -m pytest -q \
            tests/test_next100_063_terminal_source_registry_v5.py \
            tests/test_next100_063_terminal_source_registry_v5_live.py \
            tests/test_next100_063_balance_capacity_v5.py
          ruff check --select E4,E9,F,I \
            tools/validate_next100_063_terminal_source_registry_v5.py \
            tools/validate_next100_063_terminal_source_registry_v5_live.py \
            tools/diagnose_next100_063_balance_capacity_v5.py \
            tests/test_next100_063_terminal_source_registry_v5.py \
            tests/test_next100_063_terminal_source_registry_v5_live.py \
            tests/test_next100_063_balance_capacity_v5.py

      - name: Verify immutable attrs run and artifact and seal V5 authority
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p evidence/next100_063
          python tools/validate_next100_063_terminal_source_registry_v5_live.py \
            --source-head "$SOURCE_HEAD" \
            --output evidence/next100_063/v5-terminal-source-authority.json

      - name: Verify terminal authority truth boundary
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          path = Path("evidence/next100_063/v5-terminal-source-authority.json")
          value = json.loads(path.read_text(encoding="utf-8"))
          claimed = value.pop("authority_identity_sha256")
          raw = json.dumps(value, ensure_ascii=False, sort_keys=True, separators=(",", ":")).encode("utf-8")
          assert hashlib.sha256(raw).hexdigest() == claimed
          assert value["status"] == "TERMINAL_SOURCE_REGISTRY_V5_EXACT_EVIDENCE"
          assert value["source_head_sha"] == os.environ["SOURCE_HEAD"]
          assert value["v4_registry_identity_sha256"] == "9fc400a3144b46c481e45d043b0a3365eb2129c83bbacde6f9e7af8a41fadc58"
          assert value["v5_config_git_blob_sha1"] == "2dcc57cfba8ab6d600bc431a8713f7b8e305dcbf"
          vector = value["source_vector"]
          assert vector["source_object_count"] == 35
          assert vector["independent_family_count"] == 15
          assert vector["numeric_training_capacity_bytes"] == 2215615
          assert vector["by_stratum"] == {
              "uk": {"family_count": 4, "numeric_training_capacity_bytes": 100856},
              "en": {"family_count": 5, "numeric_training_capacity_bytes": 1838293},
              "code": {"family_count": 6, "numeric_training_capacity_bytes": 276466},
          }
          boundary = value["downstream_boundary"]
          assert boundary["global_cross_source_dedup_required"] is True
          assert boundary["candidate_corpus_frozen"] is False
          assert boundary["authorized_unique_causal_loss_positions"] == 0
          assert boundary["tokenizer_fit_authorized"] is False
          assert boundary["model_training_authorized"] is False
          assert boundary["paid_compute_authorized"] is False
          PY

      - name: Upload V5 terminal source-registry evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: next100-063-source-registry-v5-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            evidence/next100_063/v5-terminal-source-authority.json
            next100-063-v5-balance.json
            configs/data/next100_063_terminal_source_registry_v4.json
            configs/data/next100_063_terminal_source_registry_v5.json
          if-no-files-found: error
          retention-days: 90
