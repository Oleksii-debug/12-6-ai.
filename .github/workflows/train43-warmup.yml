name: TRAIN-43 Warmup Ablation

on:
  pull_request:
    paths:
      - ".github/workflows/train43-warmup.yml"
      - "configs/runs/train43_warmup.experimental.json"
      - "src/twelve_six/training/warmup_ablation.py"
      - "tests/test_warmup_ablation.py"
      - "src/twelve_six/training/optimization_experiments.py"
      - "src/twelve_six/training/trainer.py"

permissions:
  contents: read

jobs:
  locked-local-free-warmup:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Prove exact source checkout
        env:
          SOURCE_SHA: ${{ github.event.pull_request.head.sha }}
        run: test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11.16"
      - name: Bind exact D08 environment without inheriting unrelated branch lint blockers
        env:
          SOURCE_SHA: ${{ github.event.pull_request.head.sha }}
        run: >-
          python tools/verify_locked_environment.py
          --profile linux-x86_64
          --source-sha "$SOURCE_SHA"
          --evidence-out train43-locked-environment.json
      - name: Create exact locked experiment environment
        run: |
          python -m venv .train43-locked
          .train43-locked/bin/python -m pip install --disable-pip-version-check --require-hashes --no-deps -r requirements/locks/linux-x86_64/toolchain.lock.txt
          .train43-locked/bin/python -m pip install --disable-pip-version-check --require-hashes --no-deps -r requirements/locks/linux-x86_64/runtime.lock.txt
          .train43-locked/bin/python -m pip install --disable-pip-version-check --require-hashes --no-deps -r requirements/locks/linux-x86_64/dev.lock.txt
          PIP_NO_INDEX=1 PIP_DISABLE_PIP_VERSION_CHECK=1 .train43-locked/bin/python -m pip install --no-deps --no-build-isolation -e .
      - name: Run focused static and contract checks
        run: |
          .train43-locked/bin/ruff check src/twelve_six/training/warmup_ablation.py tests/test_warmup_ablation.py
          .train43-locked/bin/ruff format --check src/twelve_six/training/warmup_ablation.py tests/test_warmup_ablation.py
          .train43-locked/bin/python -m pytest -q tests/test_warmup_ablation.py
      - name: Execute S1 and S2 warmup ablation
        env:
          SOURCE_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          .train43-locked/bin/python -m twelve_six.training.warmup_ablation run \
            --repo-root . \
            --source-sha "$SOURCE_SHA" \
            --plan configs/runs/train43_warmup.experimental.json \
            --output train43-warmup-evidence.json \
            --summary-output train43-warmup-summary.json
          .train43-locked/bin/python -m twelve_six.training.warmup_ablation validate \
            train43-warmup-evidence.json \
            --expected-source-sha "$SOURCE_SHA"
          cat train43-warmup-summary.json
      - name: Upload TRAIN-43 evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: train43-warmup-evidence
          path: |
            train43-locked-environment.json
            train43-warmup-evidence.json
            train43-warmup-summary.json
          if-no-files-found: error
          retention-days: 30
