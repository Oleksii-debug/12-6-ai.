name: Secret History Diagnostics
on:
  pull_request:
permissions:
  contents: read

env:
  GITLEAKS_VERSION: "8.30.1"
  GITLEAKS_ARCHIVE_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"

jobs:
  sanitized-findings:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install hash-verified Gitleaks
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/gitleaks.tar.gz"
          bindir="$RUNNER_TEMP/gitleaks-bin"
          mkdir -p "$bindir"
          curl --fail --location --proto '=https' --tlsv1.2 --retry 3 --retry-all-errors \
            --output "$archive" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          printf '%s  %s\n' "$GITLEAKS_ARCHIVE_SHA256" "$archive" | sha256sum --check --strict
          tar -xzf "$archive" -C "$bindir" gitleaks
          "$bindir/gitleaks" version
          echo "$bindir" >> "$GITHUB_PATH"
      - name: Collect redacted full-history finding metadata
        shell: bash
        run: |
          set -euo pipefail
          raw_report="$RUNNER_TEMP/gitleaks-report.json"
          safe_report="sanitized-gitleaks-findings.json"
          gitleaks git --redact --exit-code 0 --report-format json --report-path "$raw_report" \
            --config .gitleaks.toml --log-opts="--full-history --all --diff-filter=tuxdb" .
          if [[ ! -f "$raw_report" ]]; then
            printf '[]\n' > "$raw_report"
          fi
          python tools/sanitize_gitleaks_report.py "$raw_report" "$safe_report"
          rm -f "$raw_report"
          cat "$safe_report"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: sanitized-gitleaks-findings
          path: sanitized-gitleaks-findings.json
          if-no-files-found: error
          retention-days: 30
