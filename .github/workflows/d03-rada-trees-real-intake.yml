name: D03 Rada Trees Real Intake

on:
  workflow_dispatch:
  push:
    branches:
      - "d03/rada-trees-archive-inventory-20260826-sol"
    paths:
      - ".github/workflows/d03-rada-trees-real-intake.yml"
      - "configs/data/d03_rada_trees_acquisition_probe_v1.json"
      - "configs/data/d03_rada_trees_archive_inventory_v1.json"
      - "configs/data/d03_rada_trees_member_classification_v1.json"
      - "tools/probe_d03_rada_trees_hf_objects.py"
      - "tools/validate_d03_rada_trees_acquisition_probe.py"
      - "tools/download_d03_rada_trees_from_hf_snapshot.py"
      - "tools/inventory_d03_rada_trees_archive.py"
      - "tools/run_d03_rada_trees_inventory_from_hf_snapshot.py"
      - "tools/classify_d03_rada_trees_members.py"

permissions:
  contents: read

jobs:
  exact-real-intake:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Bind exact checkout
        run: test "$(git rev-parse HEAD)" = "$GITHUB_SHA"

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.11.16"

      - name: Install bounded archive extractor
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends p7zip-full
          7z | head -n 3

      - name: Reconstruct exact HF object authority
        run: |
          set -euo pipefail
          mkdir -p /tmp/rada-evidence
          python tools/validate_d03_rada_trees_acquisition_probe.py
          python tools/probe_d03_rada_trees_hf_objects.py \
            --output /tmp/rada-evidence/hf-object-identity.json \
            --timeout 60

      - name: Acquire pinned primary archive
        run: |
          set -euo pipefail
          python tools/download_d03_rada_trees_from_hf_snapshot.py \
            --object-snapshot /tmp/rada-evidence/hf-object-identity.json \
            --archive-output /tmp/Rada_Trees.7z \
            --report-output /tmp/rada-evidence/exact-acquisition.json \
            --timeout 600

      - name: Materialize deterministic member inventory
        run: |
          set -euo pipefail
          python tools/run_d03_rada_trees_inventory_from_hf_snapshot.py \
            --archive /tmp/Rada_Trees.7z \
            --object-snapshot /tmp/rada-evidence/hf-object-identity.json \
            --extractor 7z \
            --output /tmp/rada-evidence/inventory-bridge.json
          python - <<'PY'
          import json
          from pathlib import Path

          bridge = json.loads(Path('/tmp/rada-evidence/inventory-bridge.json').read_text())
          inner = bridge['inventory_report']
          Path('/tmp/rada-evidence/inventory-report.json').write_text(
              json.dumps(inner, ensure_ascii=False, sort_keys=True, indent=2) + '\n',
              encoding='utf-8',
          )
          PY

      - name: Classify member payloads fail closed
        run: |
          set -euo pipefail
          python tools/classify_d03_rada_trees_members.py run /tmp/Rada_Trees.7z \
            --parent-report /tmp/rada-evidence/inventory-report.json \
            --seven-zip 7z \
            --output /tmp/rada-evidence/member-classification.json
          python tools/classify_d03_rada_trees_members.py verify \
            --report /tmp/rada-evidence/member-classification.json

      - name: Enforce zero-exposure and text-free evidence
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          root = Path('/tmp/rada-evidence')
          acquisition = json.loads((root / 'exact-acquisition.json').read_text())
          bridge = json.loads((root / 'inventory-bridge.json').read_text())
          classification = json.loads((root / 'member-classification.json').read_text())
          assert acquisition['claim_boundary']['training_authorized_bytes'] == 0
          assert bridge['claim_boundary']['training_authorized_bytes'] == 0
          assert classification['claim_boundary']['training_authorized_bytes'] == 0
          assert classification['claim_boundary']['unique_causal_loss_positions_authorized'] == 0
          assert classification['raw_member_text_emitted'] is False
          encoded = (root / 'member-classification.json').read_text().lower()
          assert '"text":' not in encoded
          assert '"preview":' not in encoded
          print('D03_RADA_TREES_ZERO_EXPOSURE_GATE=PASS')
          print('PLAIN_TEXT_CANDIDATE_MEMBERS=' + str(
              classification['classification']['plain_text_candidate_member_count']
          ))
          print('PLAIN_TEXT_CANDIDATE_UNIQUE_BYTES=' + str(
              classification['classification'][
                  'plain_text_candidate_bytes_after_exact_duplicate_collapse'
              ]
          ))
          PY
          rm -f /tmp/Rada_Trees.7z

      - name: Upload text-free evidence only
        uses: actions/upload-artifact@v4
        with:
          name: d03-rada-trees-real-intake-${{ github.sha }}
          path: /tmp/rada-evidence/
          if-no-files-found: error
          retention-days: 30
