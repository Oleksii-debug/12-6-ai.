name: D03 PR832 exact-head lint repair temporary

on:
  push:
    branches:
      - data/postdedup-inventory-v1-20260907
    paths:
      - ".github/workflows/d03-pr832-lint-repair-temporary.yml"

permissions:
  contents: write

concurrency:
  group: d03-pr832-lint-repair
  cancel-in-progress: true

jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      TWELVE_SIX_EXECUTION_PROFILE: LOCAL_FREE
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: true

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11.16"

      - name: Install dev tooling
        run: python -m pip install -e .[dev]

      - name: Repair only safe UP012 findings and validate
        run: |
          set -euo pipefail
          ruff check --fix src/twelve_six/data/postdedup_inventory_v1.py tests/test_postdedup_decontam_handoff_v1.py
          ruff check src tests
          python -m pytest -q tests/test_postdedup_decontam_handoff_v1.py
          git diff --check

      - name: Commit repaired source and remove temporary workflow
        env:
          TARGET_BRANCH: data/postdedup-inventory-v1-20260907
        run: |
          set -euo pipefail
          git rm .github/workflows/d03-pr832-lint-repair-temporary.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/twelve_six/data/postdedup_inventory_v1.py tests/test_postdedup_decontam_handoff_v1.py
          test -n "$(git status --short)"
          git commit -m "D03: resolve PR #832 exact-head lint blockers"
          git push origin "HEAD:${TARGET_BRANCH}"
