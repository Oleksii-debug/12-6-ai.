name: D03 current code Franko Ubuntu canonical balance

on:
  pull_request:
    branches:
      - execution/d03-balance-workflow-anchor-g8-136-20261005
    paths:
      - ".github/workflows/d03_current_code_franko_ubuntu_balance.yml"
      - "tools/run_d03_current_code_franko_ubuntu_balance_v1.py"
      - "tools/run_d03_current_plus_delta_balance_v1.py"
      - "tools/next100_106_balance_gate.py"
      - "src/twelve_six/data/current_plus_delta_inventory_composition_v1.py"
      - "src/twelve_six/data/trusted_family_authority_franko.py"
      - "src/twelve_six/data/trusted_family_authority_franko_ubuntu.py"
      - "configs/data/next100_106_balance_gate_policy_v1.json"
      - "configs/data/d03_common_pile_ubuntu_irc_source_rights_v1.json"

permissions:
  actions: read
  contents: read
  pull-requests: read

concurrency:
  group: d03-current-code-franko-ubuntu-balance-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  execute-canonical-balance:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.head_ref == 'execution/d03-current-code-franko-ubuntu-balance-g8-136-20261005'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      EXECUTION_HEAD: ${{ github.event.pull_request.head.sha }}
      GITHUB_TOKEN: ${{ github.token }}

      BASE_ARTIFACT_ID: "11339042870"
      BASE_ARTIFACT_NAME: d03-current-plus-delta-balance-d724db3873d33808361731d1f399f0d9a43079cf
      BASE_ARTIFACT_SHA256: a4134325106d7a5e2c7beae04b28cfa63ad0baeec9e0fb81dcd215e0f0d93f6d
      BASE_ARTIFACT_HEAD: d724db3873d33808361731d1f399f0d9a43079cf
      BASE_COMPOSITION_FILE_SHA256: 4e332581b541b587a15b8b73bb917426321d7a48fed1e9553777380b5270e7c2
      BASE_DEDUP_FILE_SHA256: c81fe947631b8bdb656585c6ca218c052ac926184ceb8695351fc3e7dc0e87f1
      BASE_RECEIPT_FILE_SHA256: de847ed84ce50ca3a46d55383109470b44e6204e5e3fccd1f6b1903abe0251fb

      FRANKO_ARTIFACT_ID: "11341354448"
      FRANKO_ARTIFACT_NAME: d03-franko-decontam-qp-4280ac3a6b901906b0b38b5ff0ce0e74a90dd154
      FRANKO_ARTIFACT_SHA256: f928b84da2c7b6447df7b753a8f90aa06945328fa26bf151481ffa9bab6f59d3
      FRANKO_ARTIFACT_HEAD: 4280ac3a6b901906b0b38b5ff0ce0e74a90dd154
      FRANKO_EVIDENCE_FILE_SHA256: e19ecfe9f220951bced85e791d1be38f115687123a6191e952fc5299ad17417e

      UBUNTU_ARTIFACT_ID: "11350370181"
      UBUNTU_ARTIFACT_NAME: d03-ubuntu-irc-decontam-qp-fb9c3d9c137b0ccacf40dbee8d6dc75db7a2209f
      UBUNTU_ARTIFACT_SHA256: a7dc4530834887e6309d3556e52e2fd4d79602fb96ccb751ee2343214b47d338
      UBUNTU_ARTIFACT_HEAD: fb9c3d9c137b0ccacf40dbee8d6dc75db7a2209f
      UBUNTU_EVIDENCE_FILE_SHA256: 438ea548af91e16ba8994b8e54576e45ed932e3b4cfc18665d3f1fedf68cee03

      RUNNER_BLOB: 2e708212d03a5f04d521712ea4d4697305452f25
      PRIOR_RUNNER_BLOB: 554d9cc7ddc05f73662119d1a316a9c879616b5a
      COMPOSITION_BLOB: 5bcc7b5298c8a4bfe80cdb6899e1b40ffbc15d95
      FAMILY_AUTHORITY_BLOB: 95805542b97a7867880cd43317fac842e34282c6
      BALANCE_GATE_BLOB: ae4f9ccdc3cfe3e053dd57d46f80aebe121268c5
      BALANCE_POLICY_BLOB: b5a2577aeb1a2e56ebff1a4b46ac325d99dd8f8f

    steps:
      - name: Checkout exact execution head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.EXECUTION_HEAD }}
          fetch-depth: 1

      - name: Set exact CPython
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11.16"

      - name: Bind exact executable closure
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXECUTION_HEAD"
          test "$(git hash-object tools/run_d03_current_code_franko_ubuntu_balance_v1.py)" = "$RUNNER_BLOB"
          test "$(git hash-object tools/run_d03_current_plus_delta_balance_v1.py)" = "$PRIOR_RUNNER_BLOB"
          test "$(git hash-object src/twelve_six/data/current_plus_delta_inventory_composition_v1.py)" = "$COMPOSITION_BLOB"
          test "$(git hash-object src/twelve_six/data/trusted_family_authority_franko_ubuntu.py)" = "$FAMILY_AUTHORITY_BLOB"
          test "$(git hash-object tools/next100_106_balance_gate.py)" = "$BALANCE_GATE_BLOB"
          test "$(git hash-object configs/data/next100_106_balance_gate_policy_v1.json)" = "$BALANCE_POLICY_BLOB"
          python -m py_compile \
            tools/run_d03_current_code_franko_ubuntu_balance_v1.py \
            tools/run_d03_current_plus_delta_balance_v1.py \
            tools/next100_106_balance_gate.py \
            src/twelve_six/data/current_plus_delta_inventory_composition_v1.py \
            src/twelve_six/data/trusted_family_authority_franko_ubuntu.py
          PYTHONPATH=src:. python tools/next100_106_balance_gate.py validate-policy

      - name: Authenticate immutable physical artifacts
        shell: bash
        run: |
          set -euo pipefail
          fetch_artifact() {
            kind="$1"
            artifact_id="$2"
            expected_name="$3"
            expected_digest="$4"
            expected_head="$5"

            curl --fail --silent --show-error --retry 5 --retry-all-errors \
              -H "Authorization: Bearer $GITHUB_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${artifact_id}" \
              -o "$RUNNER_TEMP/${kind}-metadata.json"

            KIND="$kind" EXPECTED_NAME="$expected_name" \
            EXPECTED_DIGEST="$expected_digest" EXPECTED_HEAD="$expected_head" \
            python - <<'PY'
          import json
          import os
          from pathlib import Path

          kind = os.environ["KIND"]
          meta = json.loads(
              (Path(os.environ["RUNNER_TEMP"]) / f"{kind}-metadata.json").read_text(
                  encoding="utf-8"
              )
          )
          if meta.get("name") != os.environ["EXPECTED_NAME"]:
              raise SystemExit(f"{kind}: artifact name drift")
          if meta.get("expired") is not False:
              raise SystemExit(f"{kind}: artifact expired")
          if meta.get("digest") != "sha256:" + os.environ["EXPECTED_DIGEST"]:
              raise SystemExit(f"{kind}: server digest drift")
          workflow = meta.get("workflow_run")
          if not isinstance(workflow, dict):
              raise SystemExit(f"{kind}: workflow metadata missing")
          if workflow.get("head_sha") != os.environ["EXPECTED_HEAD"]:
              raise SystemExit(f"{kind}: execution head drift")
          PY

            curl --fail --silent --show-error --location --retry 5 --retry-all-errors \
              -H "Authorization: Bearer $GITHUB_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${artifact_id}/zip" \
              -o "$RUNNER_TEMP/${kind}.zip"
            test "$(sha256sum "$RUNNER_TEMP/${kind}.zip" | cut -d' ' -f1)" = "$expected_digest"
          }

          fetch_artifact \
            base "$BASE_ARTIFACT_ID" "$BASE_ARTIFACT_NAME" \
            "$BASE_ARTIFACT_SHA256" "$BASE_ARTIFACT_HEAD"
          fetch_artifact \
            franko "$FRANKO_ARTIFACT_ID" "$FRANKO_ARTIFACT_NAME" \
            "$FRANKO_ARTIFACT_SHA256" "$FRANKO_ARTIFACT_HEAD"
          fetch_artifact \
            ubuntu "$UBUNTU_ARTIFACT_ID" "$UBUNTU_ARTIFACT_NAME" \
            "$UBUNTU_ARTIFACT_SHA256" "$UBUNTU_ARTIFACT_HEAD"

      - name: Extract exact text-free authorities
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/inputs"
          python - <<'PY'
          import hashlib
          import os
          import stat
          import zipfile
          from pathlib import Path

          tmp = Path(os.environ["RUNNER_TEMP"])
          output = tmp / "inputs"

          expected_sets = {
              "base": {
                  "balance-result.json",
                  "combined-dedup-proof.json",
                  "composition.json",
                  "execution-receipt.json",
                  "next100-input.json",
              },
              "franko": {
                  "output-a/evidence.json",
                  "franko-post-qp-two-clean-proof.json",
              },
              "ubuntu": {
                  "output-a/evidence.json",
                  "ubuntu-irc-post-qp-two-clean-proof.json",
              },
          }
          wanted = {
              "base": {
                  "composition.json": (
                      "base-composition.json",
                      os.environ["BASE_COMPOSITION_FILE_SHA256"],
                  ),
                  "combined-dedup-proof.json": (
                      "base-dedup.json",
                      os.environ["BASE_DEDUP_FILE_SHA256"],
                  ),
                  "execution-receipt.json": (
                      "base-receipt.json",
                      os.environ["BASE_RECEIPT_FILE_SHA256"],
                  ),
              },
              "franko": {
                  "output-a/evidence.json": (
                      "franko-evidence.json",
                      os.environ["FRANKO_EVIDENCE_FILE_SHA256"],
                  )
              },
              "ubuntu": {
                  "output-a/evidence.json": (
                      "ubuntu-evidence.json",
                      os.environ["UBUNTU_EVIDENCE_FILE_SHA256"],
                  )
              },
          }

          for kind in ("base", "franko", "ubuntu"):
              with zipfile.ZipFile(tmp / f"{kind}.zip") as bundle:
                  infos = bundle.infolist()
                  names = [info.filename for info in infos]
                  if len(names) != len(set(names)):
                      raise SystemExit(f"{kind}: duplicate ZIP member")
                  if set(names) != expected_sets[kind]:
                      raise SystemExit(f"{kind}: artifact member allowlist drift")
                  by_name = {}
                  for info in infos:
                      mode = (info.external_attr >> 16) & 0o170000
                      path = Path(info.filename)
                      if (
                          info.is_dir()
                          or "\\" in info.filename
                          or info.filename.startswith("/")
                          or ".." in path.parts
                          or mode == stat.S_IFLNK
                      ):
                          raise SystemExit(f"{kind}: unsafe artifact member")
                      by_name[info.filename] = info
                  for source, (destination, digest) in wanted[kind].items():
                      raw = bundle.read(by_name[source])
                      if hashlib.sha256(raw).hexdigest() != digest:
                          raise SystemExit(f"{kind}: member digest drift")
                      (output / destination).write_bytes(raw)
          PY

      - name: Prove fail-closed evidence binding
        shell: bash
        run: |
          set -euo pipefail
          cp "$RUNNER_TEMP/inputs/ubuntu-evidence.json" "$RUNNER_TEMP/mutated-ubuntu.json"
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          path = Path(os.environ["RUNNER_TEMP"]) / "mutated-ubuntu.json"
          value = json.loads(path.read_text(encoding="utf-8"))
          value["truth_boundary"]["training_executed"] = True
          path.write_text(
              json.dumps(
                  value,
                  ensure_ascii=False,
                  sort_keys=True,
                  separators=(",", ":"),
              )
              + "\n",
              encoding="utf-8",
          )
          PY
          if PYTHONPATH=src:. python tools/run_d03_current_code_franko_ubuntu_balance_v1.py \
            --base-composition-json "$RUNNER_TEMP/inputs/base-composition.json" \
            --base-dedup-json "$RUNNER_TEMP/inputs/base-dedup.json" \
            --base-receipt-json "$RUNNER_TEMP/inputs/base-receipt.json" \
            --franko-evidence-json "$RUNNER_TEMP/inputs/franko-evidence.json" \
            --ubuntu-evidence-json "$RUNNER_TEMP/mutated-ubuntu.json" \
            --source-git-sha "$EXECUTION_HEAD" \
            --output-dir "$RUNNER_TEMP/mutated-output"; then
            echo "mutated Ubuntu evidence was accepted" >&2
            exit 1
          fi
          test ! -e "$RUNNER_TEMP/mutated-output"

      - name: Execute canonical balance twice
        shell: bash
        run: |
          set -euo pipefail
          for suffix in a b; do
            out="$RUNNER_TEMP/balance-${suffix}"
            rm -rf "$out"
            PYTHONPATH=src:. python tools/run_d03_current_code_franko_ubuntu_balance_v1.py \
              --base-composition-json "$RUNNER_TEMP/inputs/base-composition.json" \
              --base-dedup-json "$RUNNER_TEMP/inputs/base-dedup.json" \
              --base-receipt-json "$RUNNER_TEMP/inputs/base-receipt.json" \
              --franko-evidence-json "$RUNNER_TEMP/inputs/franko-evidence.json" \
              --ubuntu-evidence-json "$RUNNER_TEMP/inputs/ubuntu-evidence.json" \
              --source-git-sha "$EXECUTION_HEAD" \
              --output-dir "$out"
          done
          for name in composition combined-dedup-proof next100-input balance-result execution-receipt; do
            cmp "$RUNNER_TEMP/balance-a/${name}.json" "$RUNNER_TEMP/balance-b/${name}.json"
          done

      - name: Qualify exact balance result
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          root = Path(os.environ["RUNNER_TEMP"]) / "balance-a"
          docs = {
              path.stem: json.loads(path.read_text(encoding="utf-8"))
              for path in root.glob("*.json")
          }
          if set(docs) != {
              "composition",
              "combined-dedup-proof",
              "next100-input",
              "balance-result",
              "execution-receipt",
          }:
              raise SystemExit("output set drift")

          receipt = docs["execution-receipt"]
          balance = docs["balance-result"]
          composition = docs["composition"]
          proof = docs["combined-dedup-proof"]

          expected_receipt = {
              "schema": "12-6.d03-current-code-franko-ubuntu-balance-execution.v1",
              "execution_profile": "LOCAL_FREE",
              "execution_head_sha": os.environ["EXECUTION_HEAD"],
              "balance_status": "PARTIAL_MIX_FEASIBLE_ACQUIRE_MORE_DATA",
              "maximum_feasible_total_source_bytes": 53100,
              "raw_capacity_by_stratum": {
                  "ua": 205315,
                  "en": 6404757,
                  "code": 4082728,
              },
              "raw_gap_to_target_by_stratum": {
                  "ua": 8794685,
                  "en": 595243,
                  "code": 0,
              },
              "combined_record_count": 2533,
              "combined_source_object_count": 2520,
              "combined_total_payload_bytes": 10692800,
              "next_scientific_gate": "ACQUIRE_MORE_DIVERSE_LAWFUL_SOURCE_CAPACITY",
          }
          for field, expected in expected_receipt.items():
              if receipt.get(field) != expected:
                  raise SystemExit(f"receipt drift: {field}")

          if receipt.get("maximum_feasible_stratum_bytes") != {
              "ua": 23895,
              "en": 18585,
              "code": 10620,
          }:
              raise SystemExit("maximum feasible stratum drift")
          if receipt.get("family_minimum") != {
              "required_per_stratum": 2,
              "observed": {"ua": 3, "en": 5, "code": 18},
              "pass": True,
          }:
              raise SystemExit("family-minimum result drift")

          if balance.get("result_identity_sha256") != receipt.get(
              "balance_result_identity_sha256"
          ):
              raise SystemExit("balance/receipt identity drift")
          if composition.get("composition_identity_sha256") != receipt.get(
              "composition_identity_sha256"
          ):
              raise SystemExit("composition/receipt identity drift")
          if proof.get("evidence_identity_sha256") != receipt.get(
              "combined_dedup_proof_identity_sha256"
          ):
              raise SystemExit("dedup/receipt identity drift")
          if proof.get("terminal_verdict") != "PASS":
              raise SystemExit("combined dedup proof nonterminal")
          for field in (
              "cross_inventory_record_id_collision_free",
              "cross_inventory_source_id_collision_free",
              "cross_inventory_exact_payload_collision_free",
          ):
              if composition.get(field) is not True or proof.get(field) is not True:
                  raise SystemExit(f"collision proof drift: {field}")

          exact_zero = {
              "canonical_capacity_credited": 0,
              "training_authorized_bytes": 0,
              "authorized_unique_loss_positions": 0,
              "authorized_optimized_target_exposure": 0,
              "tokenizer_fit_authorized": False,
              "model_training_authorized": False,
              "training_executed": False,
              "learned_weights_created": False,
              "final_test_outcomes_read": False,
              "paid_compute_used": False,
          }
          for field, expected in exact_zero.items():
              observed = receipt.get(field)
              if type(observed) is not type(expected) or observed != expected:
                  raise SystemExit(f"claim boundary widened: {field}")

          core = dict(receipt)
          claimed = core.pop("receipt_identity_sha256")
          raw = json.dumps(
              core,
              ensure_ascii=False,
              sort_keys=True,
              separators=(",", ":"),
              allow_nan=False,
          ).encode("utf-8")
          if hashlib.sha256(raw).hexdigest() != claimed:
              raise SystemExit("receipt self-hash mismatch")

          forbidden = {
              "text",
              "raw_text",
              "source_text",
              "normalized_payload",
              "payload_text",
              "document_text",
          }

          def walk(value):
              if isinstance(value, dict):
                  if forbidden.intersection(value):
                      raise SystemExit("raw-text field persisted")
                  for child in value.values():
                      walk(child)
              elif isinstance(value, list):
                  for child in value:
                      walk(child)

          walk(docs)
          print("D03_CURRENT_CODE_FRANKO_UBUNTU_BALANCE_QUALIFIED")
          print(json.dumps(receipt, sort_keys=True))
          PY

      - name: Upload text-free balance evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: d03-current-code-franko-ubuntu-balance-${{ env.EXECUTION_HEAD }}
          path: ${{ runner.temp }}/balance-a
          if-no-files-found: error
          retention-days: 90
