name: POSTBASE-256 Hypothesis Search V1

on:
  push:
    branches: [postbase256/hypothesis-search-v1-20260826]
  pull_request:
    branches: [postbase255/deliberation-controller-v1-20260826]
  workflow_dispatch:

permissions: {contents: read}

jobs:
  local-free:
    runs-on: ubuntu-24.04
    env:
      PYTHONPATH: src
      POSTBASE256_EXECUTION_PROFILE: LOCAL_FREE
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: "${{ github.sha }}"
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.11.16"
      - name: Install LOCAL_FREE test tooling
        run: python -m pip install -e ".[dev]"
      - name: Focused hypothesis and parent-controller tests
        run: >-
          python -m pytest -q
          tests/test_postbase_hypothesis.py
          tests/test_postbase_deliberation.py
      - name: Ruff isolated surface
        run: >-
          ruff check
          src/twelve_six/postbase_hypothesis.py
          tests/test_postbase_hypothesis.py
          tools/run_postbase256_hypothesis_probe.py
      - name: Execute objective rejection probe
        run: >-
          python tools/run_postbase256_hypothesis_probe.py
          --output reports/postbase256/local_free_probe.json
      - name: Assert LOCAL_FREE truth boundary
        run: >-
          python -c "import json; p=json.load(open('reports/postbase256/local_free_probe.json'));
          assert p['proof_passed']; assert not p['external_llm_used'];
          assert not p['unrestricted_shell_used']"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: postbase256-hypothesis-search-local-free
          path: reports/postbase256/local_free_probe.json
          if-no-files-found: error
