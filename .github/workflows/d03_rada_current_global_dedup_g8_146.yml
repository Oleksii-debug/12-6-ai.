      - name: Prepare exact incumbent helper and V7 worktrees
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin "$NBU_HELPER_BRANCH"
          test "$(git rev-parse FETCH_HEAD)" = "$NBU_HELPER_HEAD"
          NBU_ROOT="$RUNNER_TEMP/nbu-helper"
          git worktree add --detach "$NBU_ROOT" "$NBU_HELPER_HEAD"
          test "$(git -C "$NBU_ROOT" rev-parse HEAD)" = "$NBU_HELPER_HEAD"
          test "$(git -C "$NBU_ROOT" hash-object tools/run_d03_nbu_current40_global_dedup_v1.py)" = \
            "$NBU_HELPER_BLOB"

          git fetch --no-tags origin "$V7_BRANCH"
          test "$(git rev-parse FETCH_HEAD)" = "$V7_HEAD"
          V7_ROOT="$RUNNER_TEMP/v7-rada-current"
          git worktree add --detach "$V7_ROOT" "$V7_HEAD"
          test "$(git -C "$V7_ROOT" rev-parse HEAD)" = "$V7_HEAD"

      - name: Execute first fresh current-Rada global dedup
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH="$GITHUB_WORKSPACE/src:$GITHUB_WORKSPACE/tools" \
            python tools/run_d03_rada_current_global_dedup_v1.py run \
              --candidate-jsonl /tmp/current-rada-a.jsonl \
              --nbu-helper-root "$RUNNER_TEMP/nbu-helper" \
              --v7-root "$RUNNER_TEMP/v7-rada-current" \
              --bulk-workspace "$RUNNER_TEMP/rada-bulk-a" \
              --output-dir "$RUNNER_TEMP/rada-dedup-a" \
              --expected-execution-head "$EXECUTION_HEAD" \
              --max-candidate-pairs 100000000 \
              --max-index-postings 250000000 \
              --max-pair-expansions 250000000

      - name: Execute second fresh current-Rada global dedup
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH="$GITHUB_WORKSPACE/src:$GITHUB_WORKSPACE/tools" \
            python tools/run_d03_rada_current_global_dedup_v1.py run \
              --candidate-jsonl /tmp/current-rada-b.jsonl \
              --nbu-helper-root "$RUNNER_TEMP/nbu-helper" \
              --v7-root "$RUNNER_TEMP/v7-rada-current" \
              --bulk-workspace "$RUNNER_TEMP/rada-bulk-b" \
              --output-dir "$RUNNER_TEMP/rada-dedup-b" \
              --expected-execution-head "$EXECUTION_HEAD" \
              --max-candidate-pairs 100000000 \
              --max-index-postings 250000000 \
              --max-pair-expansions 250000000

      - name: Prove exact two-clean convergence
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH="$GITHUB_WORKSPACE/src:$GITHUB_WORKSPACE/tools" \
            python tools/run_d03_rada_current_global_dedup_v1.py compare \
              --output-a "$RUNNER_TEMP/rada-dedup-a" \
              --output-b "$RUNNER_TEMP/rada-dedup-b" \
              --proof "$RUNNER_TEMP/rada-two-clean.json"
          test -f "$RUNNER_TEMP/rada-two-clean.json"

      - name: Remove raw current-Rada text before publication
        if: always()
        shell: bash
        run: |
          rm -f /tmp/current-rada-a.jsonl /tmp/current-rada-b.jsonl

      - name: Publish text-free current-Rada global-dedup evidence only
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: d03-rada-current-global-dedup-${{ github.event.pull_request.head.sha }}
          path: |
            /tmp/replay-a.json
            /tmp/replay-b.json
            /tmp/github-replay-summary.json
            ${{ runner.temp }}/rada-dedup-a/dedup-report.json
            ${{ runner.temp }}/rada-dedup-a/rada-survivor-authority.json
            ${{ runner.temp }}/rada-dedup-a/execution-evidence.json
            ${{ runner.temp }}/rada-two-clean.json
          if-no-files-found: error
          retention-days: 14
