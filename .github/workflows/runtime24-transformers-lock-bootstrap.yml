name: Runtime24 Transformers lock bootstrap

on:
  push:
    branches:
      - runtime24/transformers-lock-bootstrap-20260825

permissions:
  contents: read

jobs:
  resolve-lock:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.11.16'
          check-latest: false
      - name: Resolve exact Transformers wheel closure
        env:
          PIP_DISABLE_PIP_VERSION_CHECK: '1'
          PIP_ONLY_BINARY: ':all:'
        run: |
          python - <<'PY'
          from pathlib import Path

          inputs = [
              Path('requirements/locks/linux-x86_64/toolchain.lock.txt'),
              Path('requirements/locks/linux-x86_64/runtime.lock.txt'),
          ]
          constraints = []
          for path in inputs:
              for raw in path.read_text(encoding='utf-8').splitlines():
                  line = raw.strip()
                  if not line or line.startswith('#'):
                      continue
                  constraints.append(line.split(' --hash=', 1)[0])
          Path('/tmp/runtime24-canonical-constraints.txt').write_text(
              '\n'.join(constraints) + '\n', encoding='utf-8'
          )
          PY
          rm -rf runtime24-wheels
          mkdir runtime24-wheels
          python -m pip download \
            --only-binary=:all: \
            --dest runtime24-wheels \
            --constraint /tmp/runtime24-canonical-constraints.txt \
            'transformers==5.15.0'
      - name: Emit exact hash lock
        run: |
          python - <<'PY'
          import hashlib
          import zipfile
          from pathlib import Path

          rows = []
          for wheel in sorted(Path('runtime24-wheels').glob('*.whl')):
              with zipfile.ZipFile(wheel) as archive:
                  metadata_name = next(
                      name for name in archive.namelist() if name.endswith('.dist-info/METADATA')
                  )
                  metadata = archive.read(metadata_name).decode('utf-8', errors='strict')
              name = next(line[6:] for line in metadata.splitlines() if line.startswith('Name: '))
              version = next(line[9:] for line in metadata.splitlines() if line.startswith('Version: '))
              digest = hashlib.sha256(wheel.read_bytes()).hexdigest()
              rows.append((name.lower(), f'{name}=={version} --hash=sha256:{digest}'))
          lock = (
              '# 12-6 AI Transformers runtime overlay lock; resolved on Ubuntu 24.04 / CPython 3.11.16.\n'
              '# Install after the canonical D08 toolchain/runtime with --require-hashes --no-deps.\n'
              + '\n'.join(line for _, line in sorted(rows))
              + '\n'
          )
          Path('runtime24-transformers.lock.txt').write_text(lock, encoding='utf-8')
          print('RUNTIME24_LOCK_BEGIN')
          print(lock, end='')
          print('RUNTIME24_LOCK_END')
          PY
      - name: Prove resolved closure offline and instantiate Llama
        env:
          HF_HUB_OFFLINE: '1'
          TRANSFORMERS_OFFLINE: '1'
        run: |
          python -m venv /tmp/runtime24-transformers
          /tmp/runtime24-transformers/bin/python -m pip install --no-index --find-links runtime24-wheels 'transformers==5.15.0'
          /tmp/runtime24-transformers/bin/python -m pip check
          /tmp/runtime24-transformers/bin/python - <<'PY'
          import transformers
          from transformers import LlamaConfig, LlamaForCausalLM

          config = LlamaConfig(
              vocab_size=256,
              hidden_size=20,
              intermediate_size=56,
              num_hidden_layers=1,
              num_attention_heads=2,
              num_key_value_heads=2,
              max_position_embeddings=128,
              rms_norm_eps=1e-5,
              tie_word_embeddings=True,
              bos_token_id=None,
              eos_token_id=None,
              pad_token_id=None,
          )
          model = LlamaForCausalLM(config)
          print(f'RUNTIME24_TRANSFORMERS_VERSION={transformers.__version__}')
          print(f'RUNTIME24_LLAMA_PARAMETERS={sum(p.numel() for p in model.parameters())}')
          PY
