name: TEMP D03 Rada Secondary Plaintext Full Scan

on:
  pull_request:
    paths:
      - "tools/scan_d03_rada_trees_secondary_plaintext.py"
      - "tests/test_d03_rada_trees_secondary_plaintext_scan.py"
      - "evidence/d03-rada-trees/secondary-archive-terminal-role-v1.json"
      - ".github/workflows/d03-rada-secondary-plaintext-scan.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: d03-rada-secondary-plaintext-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  selective-plaintext-scan:
    if: github.event_name != 'pull_request' || github.head_ref == 'd03/rada-trees-secondary-role-terminal-20260907'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.SOURCE_SHA }}
          fetch-depth: 1
          persist-credentials: false
      - name: Prove exact source checkout
        run: test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11.16"
      - name: Install and bind exact extractor runtime
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends 7zip
          python - <<'PY'
          import platform
          import sys
          sys.path.insert(0, "tools")
          import inventory_d03_rada_trees_archive as inventory
          assert platform.python_implementation() == "CPython"
          assert platform.python_version() == "3.11.16"
          extractor = inventory.find_extractor(None, ["7zz", "7z"])
          version = inventory.extractor_version(extractor)
          assert extractor == "7z", extractor
          assert version == "7-Zip 23.01 (x64) : Copyright (c) 1999-2023 Igor Pavlov : 2023-06-20", version
          print("extractor=", extractor)
          print("extractor_version=", version)
          PY
      - name: Compile and focused adversarial tests
        run: |
          python -m py_compile tools/scan_d03_rada_trees_secondary_plaintext.py tests/test_d03_rada_trees_secondary_plaintext_scan.py
          python -m unittest tests.test_d03_rada_trees_secondary_plaintext_scan -v
      - name: Selective full plaintext pass A
        run: >-
          python tools/scan_d03_rada_trees_secondary_plaintext.py
          --archive "$RUNNER_TEMP/rada_xtag_texts.7z"
          --report "$RUNNER_TEMP/plaintext-a.json"
          --timeout 1200
      - name: Independent processing pass B on exact same pinned archive
        run: >-
          python tools/scan_d03_rada_trees_secondary_plaintext.py
          --archive "$RUNNER_TEMP/rada_xtag_texts.7z"
          --report "$RUNNER_TEMP/plaintext-b.json"
          --timeout 1200
      - name: Require byte-identical reports and zero-credit truth boundary
        run: |
          set -euo pipefail
          cmp "$RUNNER_TEMP/plaintext-a.json" "$RUNNER_TEMP/plaintext-b.json"
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          report = json.loads((Path(os.environ["RUNNER_TEMP"]) / "plaintext-a.json").read_text(encoding="utf-8"))
          assert report["source"]["content_sha256"] == "737fa5df061c55555a8c761023559a206cbcabf0299ae52d1ccae387f685803e"
          assert report["selective_extraction"]["selected_member_count"] == 4391
          assert report["selective_extraction"]["selected_listed_bytes"] == 879031855
          assert report["selective_extraction"]["xtag_extracted"] is False
          assert report["classification"]["full_plaintext_member_classification_complete"] is True
          assert report["classification"]["raw_member_text_emitted"] is False
          boundary = report["claim_boundary"]
          assert boundary["training_authorized_bytes"] == 0
          assert boundary["unique_causal_loss_positions_authorized"] == 0
          assert boundary["tokenizer_fit_authorized"] is False
          assert boundary["model_training_executed"] is False
          assert boundary["final_test_payload_accessed"] is False
          assert boundary["paid_compute_used"] is False
          print("report_sha256=", report["report_sha256"])
          print("candidate_members=", report["classification"]["plain_text_candidate_members"])
          print("candidate_bytes_before_exact_dedup=", report["classification"]["plain_text_candidate_bytes_before_exact_duplicate_collapse"])
          print("candidate_bytes_after_exact_dedup=", report["classification"]["plain_text_candidate_bytes_after_exact_duplicate_collapse"])
          print("exact_duplicate_groups=", report["classification"]["plain_text_exact_duplicate_group_count"])
          print("metadata_identity=", report["classification"]["member_metadata_identity_sha256"])
          PY
      - name: Upload text-free selective plaintext evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: d03-rada-secondary-plaintext-${{ env.SOURCE_SHA }}
          path: ${{ runner.temp }}/plaintext-a.json
          if-no-files-found: error
          retention-days: 90
