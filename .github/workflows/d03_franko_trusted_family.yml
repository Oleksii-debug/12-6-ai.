name: D03 Franko trusted-family successor

on:
  pull_request:
    branches:
      - execution/d03-franko-postqp-g6-116-20261005
    paths:
      - ".github/workflows/d03_franko_trusted_family.yml"
      - "src/twelve_six/data/trusted_family_authority_franko.py"
      - "tests/test_trusted_family_authority_franko.py"

permissions:
  contents: read

concurrency:
  group: d03-franko-trusted-family-${{ github.event.pull_request.head.sha }}
  cancel-in-progress: false

jobs:
  qualify:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.head_ref == 'd03/franko-trusted-family-g6-116-20261005'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      PYTHONPATH: src

    steps:
      - name: Checkout exact child head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set exact CPython
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11.16"

      - name: Bind exact path scope and syntax
        shell: bash
        env:
          BASE_SHA: 4280ac3a6b901906b0b38b5ff0ce0e74a90dd154
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
          test "$(git merge-base "$BASE_SHA" HEAD)" = "$BASE_SHA"
          mapfile -t changed < <(git diff --name-only "$BASE_SHA"..HEAD | sort)
          expected=(
            ".github/workflows/d03_franko_trusted_family.yml"
            "src/twelve_six/data/trusted_family_authority_franko.py"
            "tests/test_trusted_family_authority_franko.py"
          )
          mapfile -t wanted < <(printf '%s\n' "${expected[@]}" | sort)
          test "${#changed[@]}" -eq "${#wanted[@]}"
          for i in "${!wanted[@]}"; do
            test "${changed[$i]}" = "${wanted[$i]}"
          done
          git diff --quiet HEAD --
          git diff --cached --quiet HEAD --
          python -m py_compile \
            src/twelve_six/data/trusted_family_authority_franko.py \
            tests/test_trusted_family_authority_franko.py

      - name: Install canonical project
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --upgrade pip
          python -m pip install --disable-pip-version-check -e .

      - name: Run parent and successor authority regression tests
        shell: bash
        run: |
          set -euo pipefail
          python -m pytest -q \
            tests/test_trusted_family_authority_current.py \
            tests/test_trusted_family_authority_franko.py

      - name: Prove old roots are byte-for-byte delegated
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from twelve_six.data import trusted_family_authority_current as current
          from twelve_six.data import trusted_family_authority_franko as successor

          old_sets = [
              ["ua.rada.open-data.laws-texts"],
              [
                  "ua.verba.public-domain.nomis1864",
                  "en.standardebooks.manual",
              ],
              [
                  "github:pydantic/pydantic",
                  "github:fastapi/fastapi",
                  "github:pallets/flask",
              ],
              sorted(current.TRUSTED_FAMILY_SEMANTICS),
          ]
          for families in old_sets:
              assert successor.trusted_family_projection(families) == (
                  current.trusted_family_projection(families)
              )
              assert successor.trusted_family_authority_root_sha256(families) == (
                  current.trusted_family_authority_root_sha256(families)
              )

          projection = successor.trusted_family_projection(
              [
                  successor.FRANKO_FAMILY,
                  "ua.verba.public-domain.nomis1864",
                  "github:pydantic/pydantic",
              ]
          )
          franko = next(
              row for row in projection
              if row["family"] == successor.FRANKO_FAMILY
          )
          assert franko["stratum"] == "uk"
          assert franko["language"] == "uk"
          assert franko["modalities"] == ["text"]
          print(
              "D03_FRANKO_TRUSTED_FAMILY=PASS_ZERO_CREDIT "
              f"family_count={len(successor.TRUSTED_FAMILY_SEMANTICS)}"
          )
          PY
