name: DATA 20M Corpus Readiness

on:
  pull_request:
    paths:
      - ".github/workflows/data20m-corpus-readiness.yml"
      - "configs/data/20m_capability_readiness.json"
      - "configs/candidates/model341_20m_candidate_a.json"
      - "data/corpus/v0.1/manifest.json"
      - "src/twelve_six/data/readiness.py"
      - "tools/check_corpus_readiness.py"
      - "tests/test_corpus_readiness.py"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: data20m-corpus-readiness-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  corpus-readiness:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.SOURCE_SHA }}
      - name: Prove exact source checkout
        run: test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.11.16"
      - name: Verify exact D08 locked environment
        run: >-
          python tools/verify_locked_environment.py
          --profile linux-x86_64
          --source-sha "$SOURCE_SHA"
          --evidence-out locked-environment-linux-x86_64.json
      - name: Create exact locked DATA execution environment
        run: |
          python -m venv .data20m-locked
          .data20m-locked/bin/python -m pip install --disable-pip-version-check --require-hashes --no-deps -r requirements/locks/linux-x86_64/toolchain.lock.txt
          .data20m-locked/bin/python -m pip install --disable-pip-version-check --require-hashes --no-deps -r requirements/locks/linux-x86_64/runtime.lock.txt
          .data20m-locked/bin/python -m pip install --disable-pip-version-check --require-hashes --no-deps -r requirements/locks/linux-x86_64/dev.lock.txt
          PIP_NO_INDEX=1 PIP_DISABLE_PIP_VERSION_CHECK=1 .data20m-locked/bin/python -m pip install --no-deps --no-build-isolation -e .
      - name: Focused readiness lint
        run: >-
          .data20m-locked/bin/python -m ruff check
          src/twelve_six/data/readiness.py
          tools/check_corpus_readiness.py
          tests/test_corpus_readiness.py
      - name: Focused readiness regression
        run: .data20m-locked/bin/python -m pytest -q tests/test_corpus_readiness.py
      - name: Prove current 20M corpus is fail-closed BLOCKED
        shell: bash
        run: |
          set +e
          .data20m-locked/bin/python tools/check_corpus_readiness.py --json-output corpus-readiness.json
          status=$?
          set -e
          test "$status" -eq 3
          .data20m-locked/bin/python - <<'PY'
          import json
          from pathlib import Path

          report = json.loads(Path("corpus-readiness.json").read_text(encoding="utf-8"))
          assert report["status"] == "BLOCKED"
          assert report["pass"] is False
          assert report["training_authorization_inferred"] is False
          assert report["training_performed"] is False
          floor = report["checks"]["data_parameter_floor"]
          assert floor["train_byte_tokens"] == 20_000_775
          assert floor["parameter_count"] == 20_613_440
          assert floor["required_train_byte_tokens"] == 412_268_800
          assert floor["deficit_train_byte_tokens"] == 392_268_025
          PY
