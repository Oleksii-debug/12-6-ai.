name: D02 Optimization Experiments

on:
  pull_request:

permissions:
  contents: read

jobs:
  locked-local-free-optimizer-matrix:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Prove exact source checkout
        env:
          SOURCE_SHA: ${{ github.event.pull_request.head.sha }}
        run: test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11.16"
      - name: Verify exact D08 locked environment and repository checks
        env:
          SOURCE_SHA: ${{ github.event.pull_request.head.sha }}
        run: >-
          python tools/verify_locked_environment.py
          --profile linux-x86_64
          --source-sha "$SOURCE_SHA"
          --evidence-out locked-environment-linux-x86_64.json
          --run-repo-checks
      - name: Create exact locked optimization environment
        run: |
          python -m venv .d02-optimizer-locked
          .d02-optimizer-locked/bin/python -m pip install --disable-pip-version-check --require-hashes --no-deps -r requirements/locks/linux-x86_64/toolchain.lock.txt
          .d02-optimizer-locked/bin/python -m pip install --disable-pip-version-check --require-hashes --no-deps -r requirements/locks/linux-x86_64/runtime.lock.txt
          PIP_NO_INDEX=1 PIP_DISABLE_PIP_VERSION_CHECK=1 .d02-optimizer-locked/bin/python -m pip install --no-deps --no-build-isolation -e .
          .d02-optimizer-locked/bin/python -c "import torch,twelve_six; assert torch.__version__; print(twelve_six.__version__)"
      - name: Run focused optimization harness tests
        run: .d02-optimizer-locked/bin/python -m pytest -q tests/test_optimization_experiments.py
      - name: Execute controlled S1 S2 S3 optimization experiments
        env:
          SOURCE_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          .d02-optimizer-locked/bin/python tools/run_optimization_experiments.py \
            --source-sha "$SOURCE_SHA" \
            --locked-environment-evidence locked-environment-linux-x86_64.json \
            --plan configs/runs/optimizer_experiments.experimental.json \
            --output optimization-experiments.json \
            --summary-output optimization-summary.json \
            --seed 1337
          .d02-optimizer-locked/bin/python tools/validate_optimization_experiments.py \
            optimization-experiments.json
          cat optimization-summary.json
      - name: Upload optimization experiment evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: d02-optimization-experiment-evidence
          path: |
            locked-environment-linux-x86_64.json
            optimization-experiments.json
            optimization-summary.json
          if-no-files-found: error
          retention-days: 30
