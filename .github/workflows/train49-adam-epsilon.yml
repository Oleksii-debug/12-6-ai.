name: TRAIN-49 AdamW Epsilon Ablation

on:
  pull_request:

permissions:
  contents: read

jobs:
  fixed-500k-adam-epsilon-local-free:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      OMP_NUM_THREADS: "2"
      MKL_NUM_THREADS: "2"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Prove exact source checkout
        env:
          SOURCE_SHA: ${{ github.event.pull_request.head.sha }}
        run: test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11.16"
      - name: Verify exact D08 locked environment inputs
        env:
          SOURCE_SHA: ${{ github.event.pull_request.head.sha }}
        run: >-
          python tools/verify_locked_environment.py
          --profile linux-x86_64
          --source-sha "$SOURCE_SHA"
          --evidence-out train49-locked-environment.json
      - name: Create exact locked LOCAL_FREE environment
        run: |
          python -m venv .train49-locked
          .train49-locked/bin/python -m pip install --disable-pip-version-check --require-hashes --no-deps -r requirements/locks/linux-x86_64/toolchain.lock.txt
          .train49-locked/bin/python -m pip install --disable-pip-version-check --require-hashes --no-deps -r requirements/locks/linux-x86_64/runtime.lock.txt
          PIP_NO_INDEX=1 PIP_DISABLE_PIP_VERSION_CHECK=1 .train49-locked/bin/python -m pip install --no-deps --no-build-isolation -e .
      - name: Run focused epsilon tests
        run: .train49-locked/bin/python -m pytest -q tests/test_adam_epsilon_experiment.py
      - name: Execute fixed 468K fp32 and bf16 epsilon matrix
        env:
          SOURCE_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          .train49-locked/bin/python tools/run_adam_epsilon_experiment.py \
            --source-sha "$SOURCE_SHA" \
            --locked-environment-evidence train49-locked-environment.json \
            --plan configs/runs/adam_epsilon_500k.experimental.json \
            --output train49-adam-epsilon-evidence.json \
            --summary-output train49-adam-epsilon-summary.json
          .train49-locked/bin/python tools/validate_adam_epsilon_experiment.py \
            train49-adam-epsilon-evidence.json
          cat train49-adam-epsilon-summary.json
      - name: Upload retained epsilon evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: train49-adam-epsilon-evidence
          path: |
            train49-locked-environment.json
            train49-adam-epsilon-evidence.json
            train49-adam-epsilon-summary.json
          if-no-files-found: error
          retention-days: 30
