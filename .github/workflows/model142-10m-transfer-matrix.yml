name: MODEL-142 10M Transfer Matrix

on:
  pull_request:
    paths:
      - "configs/experiments/model142_10m_transfer_matrix.v1.json"
      - "src/twelve_six/architecture_transfer_10m.py"
      - "tools/run_model142_10m_transfer_matrix.py"
      - "tests/test_model142_10m_transfer_matrix.py"
      - "docs/MODEL142_10M_TRANSFER_MATRIX.md"
      - ".github/workflows/model142-10m-transfer-matrix.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  matched-transfer-cpu:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Prove exact source checkout
        run: test "$(git rev-parse HEAD)" = "$SOURCE_SHA"

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11.16"

      - name: Verify D08 locks and repository checks
        run: >-
          python tools/verify_locked_environment.py
          --profile linux-x86_64
          --source-sha "$SOURCE_SHA"
          --evidence-out model142-locked-environment.json
          --run-repo-checks

      - name: Create locked LOCAL_FREE environment
        run: |
          python -m venv .model142-locked
          .model142-locked/bin/python -m pip install --disable-pip-version-check --require-hashes --no-deps -r requirements/locks/linux-x86_64/toolchain.lock.txt
          .model142-locked/bin/python -m pip install --disable-pip-version-check --require-hashes --no-deps -r requirements/locks/linux-x86_64/runtime.lock.txt
          .model142-locked/bin/python -m pip install --disable-pip-version-check --require-hashes --no-deps -r requirements/locks/linux-x86_64/dev.lock.txt
          PIP_NO_INDEX=1 PIP_DISABLE_PIP_VERSION_CHECK=1 .model142-locked/bin/python -m pip install --no-deps --no-build-isolation -e .

      - name: Focused transfer contracts
        run: .model142-locked/bin/python -m pytest -q tests/test_model142_10m_transfer_matrix.py

      - name: Execute fresh-process 3-candidate x 3-seed matrix
        run: |
          .model142-locked/bin/python tools/run_model142_10m_transfer_matrix.py matrix \
            --repo-root . \
            --source-sha "$SOURCE_SHA" \
            --torch-threads 2 \
            --output-dir model142-runs \
            --summary model142-summary.json

      - name: Validate retained evidence
        run: |
          .model142-locked/bin/python - <<'PY'
          import json
          import os
          from pathlib import Path
          from twelve_six.architecture_transfer_10m import validate_summary

          summary = json.loads(Path("model142-summary.json").read_text(encoding="utf-8"))
          assert summary["source_sha"] == os.environ["SOURCE_SHA"]
          assert summary["truth_boundary"]["architecture_freeze"] is False
          assert summary["truth_boundary"]["stage_promotion"] is False
          assert summary["truth_boundary"]["paid_compute"] is False
          assert len(summary["run_files"]) == 9
          assert set(summary["aggregates"]) == {
              "incumbent_gqa_8q2kv",
              "transfer_gqa_8q4kv",
              "mha_8q8kv",
          }
          assert summary["aggregates"]["incumbent_gqa_8q2kv"]["parameters"] == 10_000_640
          assert summary["aggregates"]["transfer_gqa_8q4kv"]["parameters"] == 9_997_568
          assert summary["aggregates"]["mha_8q8kv"]["parameters"] == 10_000_640
          assert summary["aggregates"]["incumbent_gqa_8q2kv"]["bf16_full_context_kv_bytes"] == 3 * 1024 * 1024
          assert summary["aggregates"]["transfer_gqa_8q4kv"]["bf16_full_context_kv_bytes"] == 6 * 1024 * 1024
          assert summary["aggregates"]["mha_8q8kv"]["bf16_full_context_kv_bytes"] == 12 * 1024 * 1024
          validate_summary(summary)
          PY

      - name: Print decision evidence
        run: cat model142-summary.json

      - name: Upload MODEL-142 exact-head evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: model142-10m-transfer-${{ env.SOURCE_SHA }}
          path: |
            model142-locked-environment.json
            model142-summary.json
            model142-runs/*.json
          if-no-files-found: error
          retention-days: 30
