name: DATA-287 External Snapshot Registry V2

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-external-snapshot-registry-v2:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      TWELVE_SIX_EXECUTION_PROFILE: LOCAL_FREE
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11.16"

      - name: Bind exact source head
        env:
          EXPECTED_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SOURCE_SHA"

      - name: Bootstrap universal exact LOCAL_FREE environment
        uses: ./.github/actions/execution-bootstrap
        with:
          capabilities: runtime,tests,lint
          venv: .data287
          command: python -m pytest
          manifest: data287-execution-environment.json

      - name: Focused static and contract tests
        env:
          PYTHONPATH: src
        run: |
          .data287/bin/python -m compileall -q src/twelve_six/data/external_snapshot_registry_v2.py tools/build_external_snapshot_registry_v2.py
          .data287/bin/ruff check --select E4,E9,F src/twelve_six/data/external_snapshot_registry_v2.py tools/build_external_snapshot_registry_v2.py tests/test_external_snapshot_registry_v2.py
          .data287/bin/python -m pytest -q tests/test_external_snapshot_registry_v2.py

      - name: Verify two byte-identical deterministic registry builds
        env:
          PYTHONPATH: src
        run: .data287/bin/python tools/build_external_snapshot_registry_v2.py --verify
