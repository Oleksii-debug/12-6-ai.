name: D05 checkpoint hardening

on:
  pull_request:
    paths:
      - "src/twelve_six/checkpoint/hardening.py"
      - "src/twelve_six/checkpoint/__init__.py"
      - "tests/test_checkpoint_integrity_hardening.py"
      - ".github/workflows/d05-checkpoint-hardening.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checkpoint-hardening:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      TWELVE_SIX_EXECUTION_PROFILE: LOCAL_FREE
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11.16"
      - name: Install project test dependencies
        run: python -m pip install -e . pytest
      - name: Run D05 corruption regressions
        run: python -m pytest tests/test_checkpoint_integrity_hardening.py -q
      - name: Run existing checkpoint transactional suite
        run: python -m pytest tests/test_checkpoint_transactional_safety.py tests/test_checkpointing.py -q
