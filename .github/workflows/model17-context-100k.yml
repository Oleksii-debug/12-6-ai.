name: MODEL-17 Context 100K

on:
  pull_request:
    paths:
      - "src/twelve_six/context_100k_experiment.py"
      - "tools/run_context_100k_experiment.py"
      - "configs/experiments/model17_context_100k.json"
      - "tests/test_context_100k_experiment.py"
      - ".github/workflows/model17-context-100k.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  local-free-context-100k:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Prove exact source checkout
        env:
          SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11.16"
      - name: Verify exact D08 locked environment
        env:
          SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: >-
          python tools/verify_locked_environment.py
          --profile linux-x86_64
          --source-sha "$SOURCE_SHA"
          --evidence-out locked-environment-linux-x86_64.json
      - name: Create exact locked MODEL-17 environment
        run: |
          python -m venv .model17-locked
          .model17-locked/bin/python -m pip install --disable-pip-version-check --require-hashes --no-deps -r requirements/locks/linux-x86_64/toolchain.lock.txt
          .model17-locked/bin/python -m pip install --disable-pip-version-check --require-hashes --no-deps -r requirements/locks/linux-x86_64/runtime.lock.txt
          .model17-locked/bin/python -m pip install --disable-pip-version-check --require-hashes --no-deps -r requirements/locks/linux-x86_64/dev.lock.txt
          PIP_NO_INDEX=1 PIP_DISABLE_PIP_VERSION_CHECK=1 .model17-locked/bin/python -m pip install --no-deps --no-build-isolation -e .
      - name: Run MODEL-17 contract tests
        run: .model17-locked/bin/python -m pytest -q tests/test_context_100k_experiment.py
      - name: Run context 128 in isolated process
        env:
          SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          mkdir -p model17-evidence
          .model17-locked/bin/python tools/run_context_100k_experiment.py \
            --source-sha "$SOURCE_SHA" --context 128 \
            --output model17-evidence/context128.json
      - name: Run context 256 in isolated process
        env:
          SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          .model17-locked/bin/python tools/run_context_100k_experiment.py \
            --source-sha "$SOURCE_SHA" --context 256 \
            --output model17-evidence/context256.json
      - name: Compare controlled context conditions
        run: |
          .model17-locked/bin/python tools/run_context_100k_experiment.py \
            --compare-128 model17-evidence/context128.json \
            --compare-256 model17-evidence/context256.json \
            --output model17-evidence/report.json
          cat model17-evidence/report.json
      - name: Upload MODEL-17 evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: model17-context-100k-evidence
          path: |
            locked-environment-linux-x86_64.json
            model17-evidence/
          if-no-files-found: error
          retention-days: 30
