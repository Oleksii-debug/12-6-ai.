name: NEXT100-021 Ukrainian Wikipedia Source Authority

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: next100-021-ua-wikipedia-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  ukwiki-source-authority:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      TWELVE_SIX_EXECUTION_PROFILE: LOCAL_FREE
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11.16"

      - name: Bind exact source head
        env:
          EXPECTED_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SOURCE_SHA"

      - name: Validate fail-closed rights registry and deterministic normalization contract
        run: |
          python -m compileall -q tools/probe_next100_021_ua_wikipedia.py
          python tools/probe_next100_021_ua_wikipedia.py validate

      - name: Acquire bounded upstream metadata only
        env:
          EXPECTED_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          mkdir -p next100-021-evidence
          python tools/probe_next100_021_ua_wikipedia.py probe-metadata \
            --source-sha "$EXPECTED_SOURCE_SHA" \
            --output next100-021-evidence/runtime-report.json
          python tools/probe_next100_021_ua_wikipedia.py verify-report \
            --output next100-021-evidence/runtime-report.json

      - name: Prove terminal REJECT and zero blocked content bytes
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          report = json.loads(Path("next100-021-evidence/runtime-report.json").read_text(encoding="utf-8"))
          assert report["decision"] == "REJECT"
          assert report["model_training_executed"] is False
          assert report["training_snapshot_created"] is False
          assert report["evaluation_material_reserved"] is False
          assert report["bounded_metadata_acquisition"]["metadata_bytes_downloaded"] <= 1048576
          assert report["bounded_metadata_acquisition"]["content_payload_bytes_downloaded"] == 0
          assert report["bounded_metadata_acquisition"]["verified_upstream_sha1"] == "e6aa53cf981f53807ca59d4fc7ab8e1d97151461"
          assert report["content_materialization"]["executed"] is False
          assert report["content_materialization"]["network_content_bytes_downloaded"] == 0
          assert report["content_materialization"]["raw_sha256"] is None
          assert report["content_materialization"]["normalized_sha256"] is None
          assert report["privacy_status"] == "NOT_RUN_RIGHTS_GATE_FAILED"
          assert report["dedup_status"] == "NOT_RUN_RIGHTS_GATE_FAILED"
          assert report["independent_family_credit"] == 0
          PY

      - name: Upload terminal REJECT evidence only
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: next100-021-ua-wikipedia-reject-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            configs/data/next100_021_ua_wikipedia_retest_v1.json
            next100-021-evidence/runtime-report.json
          if-no-files-found: error
          retention-days: 90
