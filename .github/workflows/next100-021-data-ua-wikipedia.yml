name: NEXT100-021 Ukrainian Wikipedia Source Retest

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ukwiki-source-retest:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      TWELVE_SIX_EXECUTION_PROFILE: LOCAL_FREE
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11.16"

      - name: Bind exact source head
        env:
          EXPECTED_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SOURCE_SHA"

      - name: Validate fail-closed rights and registry contract
        run: |
          python -m compileall -q tools/probe_next100_021_ua_wikipedia.py
          python tools/probe_next100_021_ua_wikipedia.py validate
          python - <<'PY'
          from tools.probe_next100_021_ua_wikipedia import normalize_wikitext

          source = "Ａ\r\nрядок  \u200b\rкінець  "
          expected = "A\nрядок\nкінець"
          assert normalize_wikitext(source) == expected
          assert normalize_wikitext(source) == normalize_wikitext(source)
          PY

      - name: Acquire exact bounded dump shard and build hash-only evidence
        env:
          EXPECTED_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          mkdir -p next100-021-evidence
          python tools/probe_next100_021_ua_wikipedia.py probe \
            --source-sha "$EXPECTED_SOURCE_SHA" \
            --output next100-021-evidence/runtime-report.json
          python tools/probe_next100_021_ua_wikipedia.py verify-report \
            --output next100-021-evidence/runtime-report.json

      - name: Prove artifact is metadata-only and decision remains RETEST
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          report = json.loads(Path("next100-021-evidence/runtime-report.json").read_text(encoding="utf-8"))
          assert report["decision"] == "RETEST"
          assert report["training_snapshot_created"] is False
          assert report["evaluation_material_reserved"] is False
          assert report["payload_retention"]["artifact_contains_text"] is False
          assert report["bounded_acquisition"]["raw_bytes"] == 166733586
          assert report["bounded_acquisition"]["raw_sha1"] == "e6aa53cf981f53807ca59d4fc7ab8e1d97151461"
          assert report["repeat_normalization_byte_identical"] is True
          assert report["bounded_normalization"]["record_count"] <= 128
          assert report["bounded_normalization"]["canonical_normalized_bytes"] <= 2000000
          for row in report["bounded_normalization"]["records"]:
              assert "text" not in row
              assert "title" not in row
          PY

      - name: Upload terminal RETEST evidence only
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: next100-021-ua-wikipedia-retest-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            configs/data/next100_021_ua_wikipedia_retest_v1.json
            next100-021-evidence/runtime-report.json
          if-no-files-found: error
          retention-days: 90
