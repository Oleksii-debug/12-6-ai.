name: D03 Nomis-Free Clean Successor V1

on:
  pull_request:
    paths:
      - "tools/run_d03_nomis_free_clean_successor_v1.py"
      - "tools/materialize_d03_nomis_free_data526_successor_v1.py"
      - "tools/run_d03_nomis_free_v7_data_only_v1.py"
      - "tests/test_d03_nomis_free_clean_successor_v1.py"
      - "tests/test_d03_nomis_free_data526_successor_v1.py"
      - ".github/workflows/d03-nomis-free-clean-successor-v1.yml"
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  issues: write

concurrency:
  group: d03-nomis-free-clean-successor-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  physical-clean-successor:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      TWELVE_SIX_EXECUTION_PROFILE: LOCAL_FREE
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.SOURCE_SHA }}
          fetch-depth: 1
          persist-credentials: false

      - name: Prove exact Product checkout and frozen bindings
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          python tools/run_d03_nomis_free_clean_successor_v1.py check-bindings
          python -m py_compile \
            tools/run_d03_nomis_free_clean_successor_v1.py \
            tools/materialize_d03_nomis_free_data526_successor_v1.py \
            tools/run_d03_nomis_free_v7_data_only_v1.py \
            tests/test_d03_nomis_free_clean_successor_v1.py \
            tests/test_d03_nomis_free_data526_successor_v1.py

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11.16"

      - name: Checkout exact terminal V7 implementation
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: d3333ec1b4a508df232a5aefccd6686adda745fb
          path: _terminal_v7
          fetch-depth: 1
          persist-credentials: false

      - name: Checkout exact historical PR623 DATA526 materializer
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: 70d6ccc87396d129d00771bbf0b6b29bc673bfc4
          path: _pr623
          fetch-depth: 1
          persist-credentials: false

      - name: Install deterministic PDF extractor required by terminal V7 reproduction
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends poppler-utils
          pdftotext -v

      - name: Retrieve immutable DATA-213 normalized artifact twice
        run: |
          set -euo pipefail
          for build in a b; do
            curl --fail --silent --show-error --location \
              -H "Authorization: Bearer $GITHUB_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/Oleksii-debug/12-6-ai./actions/artifacts/9600107886/zip" \
              -o "$RUNNER_TEMP/data213-${build}.zip"
          done
          cmp "$RUNNER_TEMP/data213-a.zip" "$RUNNER_TEMP/data213-b.zip"
          python - <<'PY'
          import hashlib
          import os
          from pathlib import Path
          root = Path(os.environ["RUNNER_TEMP"])
          raw = (root / "data213-a.zip").read_bytes()
          assert hashlib.sha256(raw).hexdigest() == "927e10ccb83f919d57a8b78e3ea9cae72f9d4e0232401043234a35eec150074d"
          PY

      - name: Independent clean source successor A
        run: >-
          python tools/run_d03_nomis_free_v7_data_only_v1.py _terminal_v7
          tools/run_d03_nomis_free_clean_successor_v1.py run
          --current-root .
          --v7-root _terminal_v7
          --workspace "$RUNNER_TEMP/source-work-a"
          --report "$RUNNER_TEMP/source-a.json"
          --survivor "$RUNNER_TEMP/survivor-a.json"

      - name: Independent clean source successor B
        run: >-
          python tools/run_d03_nomis_free_v7_data_only_v1.py _terminal_v7
          tools/run_d03_nomis_free_clean_successor_v1.py run
          --current-root .
          --v7-root _terminal_v7
          --workspace "$RUNNER_TEMP/source-work-b"
          --report "$RUNNER_TEMP/source-b.json"
          --survivor "$RUNNER_TEMP/survivor-b.json"

      - name: Require byte-identical clean source authorities
        run: |
          set -euo pipefail
          cmp "$RUNNER_TEMP/source-a.json" "$RUNNER_TEMP/source-b.json"
          cmp "$RUNNER_TEMP/survivor-a.json" "$RUNNER_TEMP/survivor-b.json"
          python tools/run_d03_nomis_free_clean_successor_v1.py verify \
            --current-root . \
            --report "$RUNNER_TEMP/source-a.json" \
            --survivor "$RUNNER_TEMP/survivor-a.json"

      - name: Independent clean DATA526 materialization A
        run: >-
          python tools/run_d03_nomis_free_v7_data_only_v1.py _terminal_v7
          tools/materialize_d03_nomis_free_data526_successor_v1.py
          --current-root .
          --execution-head-sha "$SOURCE_SHA"
          --v7-root _terminal_v7
          --historical-materializer-root _pr623
          --data213-zip "$RUNNER_TEMP/data213-a.zip"
          --bulk-workspace "$RUNNER_TEMP/data526-bulk-a"
          --source-report "$RUNNER_TEMP/source-a.json"
          --survivor "$RUNNER_TEMP/survivor-a.json"
          --historical-records-jsonl "$RUNNER_TEMP/historical-a.jsonl"
          --records-jsonl "$RUNNER_TEMP/records-a.jsonl"
          --inventory-json "$RUNNER_TEMP/inventory-a.json"
          --evidence-json "$RUNNER_TEMP/evidence-a.json"

      - name: Independent clean DATA526 materialization B
        run: >-
          python tools/run_d03_nomis_free_v7_data_only_v1.py _terminal_v7
          tools/materialize_d03_nomis_free_data526_successor_v1.py
          --current-root .
          --execution-head-sha "$SOURCE_SHA"
          --v7-root _terminal_v7
          --historical-materializer-root _pr623
          --data213-zip "$RUNNER_TEMP/data213-b.zip"
          --bulk-workspace "$RUNNER_TEMP/data526-bulk-b"
          --source-report "$RUNNER_TEMP/source-b.json"
          --survivor "$RUNNER_TEMP/survivor-b.json"
          --historical-records-jsonl "$RUNNER_TEMP/historical-b.jsonl"
          --records-jsonl "$RUNNER_TEMP/records-b.jsonl"
          --inventory-json "$RUNNER_TEMP/inventory-b.json"
          --evidence-json "$RUNNER_TEMP/evidence-b.json"

      - name: Require two-clean byte identity and build text-free terminal summary
        run: |
          set -euo pipefail
          cmp "$RUNNER_TEMP/historical-a.jsonl" "$RUNNER_TEMP/historical-b.jsonl"
          cmp "$RUNNER_TEMP/records-a.jsonl" "$RUNNER_TEMP/records-b.jsonl"
          cmp "$RUNNER_TEMP/inventory-a.json" "$RUNNER_TEMP/inventory-b.json"
          cmp "$RUNNER_TEMP/evidence-a.json" "$RUNNER_TEMP/evidence-b.json"
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          root = Path(os.environ["RUNNER_TEMP"])
          source = json.loads((root / "source-a.json").read_text())
          survivor = json.loads((root / "survivor-a.json").read_text())
          inventory = json.loads((root / "inventory-a.json").read_text())
          evidence = json.loads((root / "evidence-a.json").read_text())
          vector = source["source_vector"]
          assert vector["source_object_count"] == 263
          assert vector["source_capacity_bytes_before_global_dedup"] == 6_093_965
          assert vector["conservative_unique_capacity_bytes_after_global_dedup"] == 6_093_662
          assert vector["duplicate_discount_bytes"] == 303
          assert vector["duplicate_cluster_count"] == 1
          assert survivor["post_dedup_survivor_source_object_count"] == 261
          assert inventory["record_count"] == 274
          assert inventory["total_payload_bytes"] == 6_093_662
          boundary = evidence["truth_boundary"]
          assert boundary["tokenizer_fit_authorized"] is False
          assert boundary["authorized_training_exposure"] == 0
          assert boundary["model_training_executed"] is False
          assert boundary["optimizer_updates"] == 0
          assert boundary["learned_weights_created"] is False
          assert boundary["final_test_payload_read"] is False
          assert boundary["paid_compute_used"] is False
          summary = {
              "schema_version": "12-6.d03-nomis-free-clean-successor-terminal-summary.v1",
              "execution_head_sha": os.environ["SOURCE_SHA"],
              "two_independent_source_runs_byte_identical": True,
              "two_independent_data526_runs_byte_identical": True,
              "source_report_sha256": source["report_sha256"],
              "survivor_authority_sha256": survivor["survivor_authority_sha256"],
              "data526_evidence_identity_sha256": evidence["evidence_identity_sha256"],
              "clean_historical_record_payload_jsonl_sha256": evidence["clean_historical"]["record_payload_jsonl_sha256"],
              "clean_data526_record_payload_jsonl_sha256": evidence["clean_data526"]["record_payload_jsonl_sha256"],
              "pre_global_dedup_source_objects": vector["source_object_count"],
              "pre_global_dedup_bytes": vector["source_capacity_bytes_before_global_dedup"],
              "post_global_dedup_survivor_source_objects": survivor["post_dedup_survivor_source_object_count"],
              "post_global_dedup_bytes": vector["conservative_unique_capacity_bytes_after_global_dedup"],
              "duplicate_discount_bytes": vector["duplicate_discount_bytes"],
              "duplicate_cluster_count": vector["duplicate_cluster_count"],
              "clean_data526_record_count": inventory["record_count"],
              "clean_data526_payload_bytes": inventory["total_payload_bytes"],
              "record_inventory_digest_sha256": inventory["record_inventory_digest_sha256"],
              "payload_inventory_digest_sha256": inventory["payload_inventory_digest_sha256"],
              "raw_payloads_uploaded": False,
              "authorized_training_exposure": 0,
              "tokenizer_fit_authorized": False,
              "optimizer_updates": 0,
              "training_executed": False,
              "learned_weights_created": False,
              "final_test_payload_read": False,
              "paid_compute_used": False,
          }
          (root / "terminal-summary.json").write_text(
              json.dumps(summary, sort_keys=True, separators=(",", ":")) + "\n",
              encoding="utf-8",
          )
          print(json.dumps(summary, sort_keys=True))
          PY
          rm -f \
            "$RUNNER_TEMP/historical-a.jsonl" "$RUNNER_TEMP/historical-b.jsonl" \
            "$RUNNER_TEMP/records-a.jsonl" "$RUNNER_TEMP/records-b.jsonl"

      - name: Upload text-free clean-successor evidence only
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: d03-nomis-free-clean-successor-${{ env.SOURCE_SHA }}
          if-no-files-found: error
          retention-days: 90
          path: |
            ${{ runner.temp }}/source-a.json
            ${{ runner.temp }}/survivor-a.json
            ${{ runner.temp }}/inventory-a.json
            ${{ runner.temp }}/evidence-a.json
            ${{ runner.temp }}/terminal-summary.json

      - name: Publish exact text-free terminal summary to Product PR
        if: github.event_name == 'pull_request'
        continue-on-error: true
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          python - <<'PY' > "$RUNNER_TEMP/comment.md"
          import json
          import os
          from pathlib import Path
          summary = json.loads((Path(os.environ["RUNNER_TEMP"]) / "terminal-summary.json").read_text())
          print("PHYSICAL CLEAN-SUCCESSOR EXECUTION — exact-head terminal candidate evidence")
          print()
          print("```json")
          print(json.dumps(summary, sort_keys=True, separators=(",", ":")))
          print("```")
          print()
          print("Raw historical/final record JSONL was compared locally and deleted before artifact upload. This is still pre-decontamination and grants zero tokenizer/training authority.")
          PY
          gh api \
            --method POST \
            -H "Accept: application/vnd.github+json" \
            "/repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/comments" \
            -f body="$(cat "$RUNNER_TEMP/comment.md")"
