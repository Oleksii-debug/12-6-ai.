name: DATA-526 V8 record composition terminal

on:
  pull_request:
    paths:
      - "configs/data/data526_v8_record_composition_v1.json"
      - "tools/compose_data526_records_from_v8.py"
      - "tools/materialize_data526_record_inventory_v1.py"
      - "tests/test_data526_v8_record_composition.py"
      - ".github/workflows/data526-v8-record-composition-temporary.yml"

concurrency:
  group: data526-v8-records-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  actions: read
  contents: write

jobs:
  terminal-materialization:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      TWELVE_SIX_EXECUTION_PROFILE: LOCAL_FREE
      SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.SOURCE_SHA }}
          fetch-depth: 1
          persist-credentials: true

      - name: Prove exact current checkout
        run: test "$(git rev-parse HEAD)" = "$SOURCE_SHA"

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11.16"

      - name: Checkout exact historical DATA-526 materializer
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: 70d6ccc87396d129d00771bbf0b6b29bc673bfc4
          path: _data526_hist
          fetch-depth: 1
          persist-credentials: false

      - name: Install exact historical validation dependencies
        run: python -m pip install --require-hashes --no-deps -r _data526_hist/requirements/locks/linux-x86_64/dev.lock.txt

      - name: Install deterministic PDF extractor used by historical V7 acquisition
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends poppler-utils
          pdftotext -v

      - name: Bind terminal evidence to exact execution Git head
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          composer = Path("tools/compose_data526_records_from_v8.py")
          text = composer.read_text(encoding="utf-8")
          old = '''def _sha256(raw: bytes) -> str:
              return hashlib.sha256(raw).hexdigest()


          def _canonical_ascii(value: Any) -> bytes:
          '''
          new = '''def _sha256(raw: bytes) -> str:
              return hashlib.sha256(raw).hexdigest()


          def _validated_git_sha(value: str) -> str:
              _require(
                  len(value) == 40 and all(ch in "0123456789abcdef" for ch in value),
                  "execution head SHA must be lowercase 40-hex",
              )
              return value


          def _canonical_ascii(value: Any) -> bytes:
          '''
          if text.count(old) != 1:
              raise SystemExit("unexpected composer SHA-helper shape")
          text = text.replace(old, new, 1)

          old = '''    parser.add_argument("--evidence-json", type=Path, required=True)
              args = parser.parse_args()

              config = _read_json(args.config)
          '''
          new = '''    parser.add_argument("--evidence-json", type=Path, required=True)
              parser.add_argument("--execution-head-sha", required=True)
              args = parser.parse_args()
              execution_head_sha = _validated_git_sha(args.execution_head_sha)

              config = _read_json(args.config)
          '''
          if text.count(old) != 1:
              raise SystemExit("unexpected composer parser shape")
          text = text.replace(old, new, 1)

          old = '''        "paid_compute_used": False,
              }
          '''
          new = '''        "paid_compute_used": False,
                  "execution_head_sha": execution_head_sha,
              }
          '''
          if text.count(old) != 1:
              raise SystemExit("unexpected composer evidence shape")
          text = text.replace(old, new, 1)
          composer.write_text(text, encoding="utf-8")

          tests = Path("tests/test_data526_v8_record_composition.py")
          test_text = tests.read_text(encoding="utf-8")
          if "import pytest\n" not in test_text:
              test_text = test_text.replace(
                  "from pathlib import Path\n\n",
                  "from pathlib import Path\n\nimport pytest\n\n",
                  1,
              )
          marker = "def test_execution_head_sha_binding_is_fail_closed():"
          if marker not in test_text:
              test_text += '''

          def test_execution_head_sha_binding_is_fail_closed():
              exact = "a" * 40
              assert composer._validated_git_sha(exact) == exact
              for invalid in ("", "a" * 39, "a" * 41, "A" * 40, "g" * 40):
                  with pytest.raises(composer.Data526V8Error):
                      composer._validated_git_sha(invalid)
          '''
          tests.write_text(test_text, encoding="utf-8")
          PY
          python -m compileall -q tools/compose_data526_records_from_v8.py
          python -m pytest -q tests/test_data526_v8_record_composition.py
          git diff --check

      - name: Commit and publish exact execution-bound materializer
        run: |
          set -euo pipefail
          test -n "${GITHUB_HEAD_REF:-}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/compose_data526_records_from_v8.py tests/test_data526_v8_record_composition.py
          git diff --cached --quiet && { echo "expected execution-binding delta missing" >&2; exit 1; }
          git commit -m "DATA-526: bind materialization evidence to execution head"
          EXECUTION_SHA="$(git rev-parse HEAD)"
          echo "EXECUTION_SHA=$EXECUTION_SHA" >> "$GITHUB_ENV"
          git fetch --no-tags origin "$GITHUB_HEAD_REF"
          test "$(git rev-parse FETCH_HEAD)" = "$SOURCE_SHA"
          git push origin "HEAD:$GITHUB_HEAD_REF"

      - name: Checkout exact terminal V7 source materializer
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: d3333ec1b4a508df232a5aefccd6686adda745fb
          path: _data526_v7
          fetch-depth: 1
          persist-credentials: false

      - name: Retrieve immutable DATA-213 and V8 authority artifacts twice
        run: |
          set -euo pipefail
          for build in a b; do
            curl --fail --silent --show-error --location \
              -H "Authorization: Bearer $GITHUB_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/Oleksii-debug/12-6-ai./actions/artifacts/9600107886/zip" \
              -o "/tmp/data213-${build}.zip"
            curl --fail --silent --show-error --location \
              -H "Authorization: Bearer $GITHUB_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/Oleksii-debug/12-6-ai./actions/artifacts/10032510626/zip" \
              -o "/tmp/v8-${build}.zip"
          done
          test "$(sha256sum /tmp/data213-a.zip | cut -d' ' -f1)" = "927e10ccb83f919d57a8b78e3ea9cae72f9d4e0232401043234a35eec150074d"
          test "$(sha256sum /tmp/data213-b.zip | cut -d' ' -f1)" = "927e10ccb83f919d57a8b78e3ea9cae72f9d4e0232401043234a35eec150074d"
          test "$(sha256sum /tmp/v8-a.zip | cut -d' ' -f1)" = "960c678fdbe6245658fa69c39edf355eb7b38ef39b7f8f833155c894dbd90385"
          test "$(sha256sum /tmp/v8-b.zip | cut -d' ' -f1)" = "960c678fdbe6245658fa69c39edf355eb7b38ef39b7f8f833155c894dbd90385"
          cmp /tmp/data213-a.zip /tmp/data213-b.zip
          cmp /tmp/v8-a.zip /tmp/v8-b.zip
          mkdir -p /tmp/v8-a /tmp/v8-b
          unzip -q /tmp/v8-a.zip -d /tmp/v8-a
          unzip -q /tmp/v8-b.zip -d /tmp/v8-b

      - name: Rebuild exact historical 48-record graph twice
        run: |
          set -euo pipefail
          rm -rf /tmp/historical-a /tmp/historical-b
          mkdir -p /tmp/historical-a /tmp/historical-b
          (
            cd _data526_hist
            python tools/run_data526_materializer_data_only.py \
              --v7-root ../_data526_v7 \
              --data213-zip /tmp/data213-a.zip \
              --records-jsonl /tmp/historical-a/records.jsonl \
              --inventory-json /tmp/historical-a/inventory.json \
              --evidence-json /tmp/historical-a/evidence.json
            python tools/run_data526_materializer_data_only.py \
              --v7-root ../_data526_v7 \
              --data213-zip /tmp/data213-b.zip \
              --records-jsonl /tmp/historical-b/records.jsonl \
              --inventory-json /tmp/historical-b/inventory.json \
              --evidence-json /tmp/historical-b/evidence.json
          )
          cmp /tmp/historical-a/records.jsonl /tmp/historical-b/records.jsonl
          cmp /tmp/historical-a/inventory.json /tmp/historical-b/inventory.json
          cmp /tmp/historical-a/evidence.json /tmp/historical-b/evidence.json
          test "$(sha256sum /tmp/historical-a/records.jsonl | cut -d' ' -f1)" = "2f21f7655c9287bbc7424b410788f431f20f0936f445fefd26fcf6114b772dbd"

      - name: Freshly acquire exact six-family bulk code twice
        run: |
          set -euo pipefail
          rm -rf /tmp/bulk-a /tmp/bulk-b
          mkdir -p /tmp/bulk-a /tmp/bulk-b
          python tools/materialize_data_bulk_code1_permissive_python_bundle.py \
            --workspace /tmp/bulk-a \
            --output /tmp/bulk-a-report.json
          python tools/materialize_data_bulk_code1_permissive_python_bundle.py \
            --workspace /tmp/bulk-b \
            --output /tmp/bulk-b-report.json
          cmp /tmp/bulk-a-report.json /tmp/bulk-b-report.json
          python - <<'PY'
          import json
          from pathlib import Path
          for name in ("a", "b"):
              report = json.loads(Path(f"/tmp/bulk-{name}-report.json").read_text())
              assert report["report_identity_sha256"] == "80f3a8f20dfb82825e6c89ac1f76f2f41233296b8a426a1cf466b0fcc0892985"
              assert report["eligible_file_count"] == 229
              assert report["eligible_utf8_bytes"] == 3_880_009
              assert report["security"]["credential_scan"] == "PASS_NO_HIGH_CONFIDENCE_HITS"
          PY

      - name: Compose current V8 survivor-bound record graph twice
        run: |
          set -euo pipefail
          rm -rf /tmp/current-a /tmp/current-b
          mkdir -p /tmp/current-a /tmp/current-b evidence/data526/v8
          python tools/compose_data526_records_from_v8.py \
            --historical-records-jsonl /tmp/historical-a/records.jsonl \
            --bulk-report /tmp/bulk-a-report.json \
            --bulk-workspace /tmp/bulk-a \
            --v8-report /tmp/v8-a/v8-a.json \
            --v8-survivors /tmp/v8-a/v8-survivors-a.json \
            --records-jsonl /tmp/current-a/records.jsonl \
            --inventory-json /tmp/current-a/inventory.json \
            --evidence-json /tmp/current-a/evidence.json \
            --execution-head-sha "$EXECUTION_SHA"
          python tools/compose_data526_records_from_v8.py \
            --historical-records-jsonl /tmp/historical-b/records.jsonl \
            --bulk-report /tmp/bulk-b-report.json \
            --bulk-workspace /tmp/bulk-b \
            --v8-report /tmp/v8-b/v8-a.json \
            --v8-survivors /tmp/v8-b/v8-survivors-a.json \
            --records-jsonl /tmp/current-b/records.jsonl \
            --inventory-json /tmp/current-b/inventory.json \
            --evidence-json /tmp/current-b/evidence.json \
            --execution-head-sha "$EXECUTION_SHA"
          cmp /tmp/current-a/records.jsonl /tmp/current-b/records.jsonl
          cmp /tmp/current-a/inventory.json /tmp/current-b/inventory.json
          cmp /tmp/current-a/evidence.json /tmp/current-b/evidence.json
          cp /tmp/current-a/inventory.json evidence/data526/v8/record_inventory.json
          cp /tmp/current-a/evidence.json evidence/data526/v8/materialization_evidence.json

      - name: Assert terminal 275-record evidence remains text-free and pre-training
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          inventory_path = Path("evidence/data526/v8/record_inventory.json")
          evidence_path = Path("evidence/data526/v8/materialization_evidence.json")
          inventory = json.loads(inventory_path.read_text())
          evidence = json.loads(evidence_path.read_text())
          assert inventory["record_count"] == evidence["record_count"] == 275
          assert inventory["total_payload_bytes"] == evidence["total_payload_bytes"] == 6_095_321
          assert evidence["source_object_count"] == 262
          assert evidence["execution_head_sha"] == os.environ["EXECUTION_SHA"]
          assert evidence["authorized_unique_optimized_targets"] == 0
          assert evidence["decontamination_executed"] is False
          assert evidence["tokenizer_fit_executed"] is False
          assert evidence["training_executed"] is False
          assert evidence["optimizer_updates"] == 0
          assert evidence["final_test_payload_accessed"] is False
          assert evidence["paid_compute_used"] is False
          assert "normalized_payload" not in inventory_path.read_text()
          assert "normalized_payload" not in evidence_path.read_text()
          PY
          rm -f /tmp/current-a/records.jsonl /tmp/current-b/records.jsonl \
            /tmp/historical-a/records.jsonl /tmp/historical-b/records.jsonl

      - name: Upload text-free terminal DATA-526 V8 authority candidate
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: data526-v8-record-composition-${{ env.SOURCE_SHA }}
          if-no-files-found: error
          retention-days: 90
          path: |
            configs/data/data526_v8_record_composition_v1.json
            evidence/data526/v8/record_inventory.json
            evidence/data526/v8/materialization_evidence.json

      - name: Commit exact terminal text-free evidence
        run: |
          set -euo pipefail
          git add evidence/data526/v8/record_inventory.json evidence/data526/v8/materialization_evidence.json
          git diff --cached --quiet && { echo "expected terminal evidence delta missing" >&2; exit 1; }
          git commit -m "DATA-526: record exact V8 materialization authority"
          FINAL_EVIDENCE_SHA="$(git rev-parse HEAD)"
          git fetch --no-tags origin "$GITHUB_HEAD_REF"
          test "$(git rev-parse FETCH_HEAD)" = "$EXECUTION_SHA"
          git push origin "HEAD:$GITHUB_HEAD_REF"
          echo "FINAL_EVIDENCE_SHA=$FINAL_EVIDENCE_SHA"