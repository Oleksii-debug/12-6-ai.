name: Plan 5 self-model scoped qualification

on:
  pull_request:
    paths:
      - 'src/twelve_six_agent_runtime/self_model.py'
      - 'tests/test_agent_self_model_section5.py'
      - '.github/workflows/plan5_self_model.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  self-model:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v4
      - name: Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install LOCAL_FREE qualification tools
        run: python -m pip install 'pytest>=8,<10' 'ruff>=0.12,<1'
      - name: Plan 5 Section 5 evidence negative concurrency recovery
        run: PYTHONPATH=src python -m pytest -q tests/test_agent_self_model_section5.py
      - name: Focused Ruff
        run: ruff check src/twelve_six_agent_runtime/self_model.py tests/test_agent_self_model_section5.py
