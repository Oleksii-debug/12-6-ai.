name: LEARN02 268K Fixed-Control Training

on:
  pull_request:

permissions:
  contents: read

jobs:
  fixed-control-95k-vs-268k:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Prove exact source checkout
        env:
          SOURCE_SHA: ${{ github.event.pull_request.head.sha }}
        run: test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11.16"
      - name: Verify exact locked environment inputs
        env:
          SOURCE_SHA: ${{ github.event.pull_request.head.sha }}
        run: >-
          python tools/verify_locked_environment.py
          --profile linux-x86_64
          --source-sha "$SOURCE_SHA"
          --evidence-out learn02-locked-environment.json
      - name: Create locked LOCAL_FREE execution environment
        run: |
          python -m venv .learn02-locked
          .learn02-locked/bin/python -m pip install --disable-pip-version-check \
            --require-hashes --no-deps \
            -r requirements/locks/linux-x86_64/toolchain.lock.txt
          .learn02-locked/bin/python -m pip install --disable-pip-version-check \
            --require-hashes --no-deps \
            -r requirements/locks/linux-x86_64/runtime.lock.txt
          PIP_NO_INDEX=1 PIP_DISABLE_PIP_VERSION_CHECK=1 \
            .learn02-locked/bin/python -m pip install \
            --no-deps --no-build-isolation -e .
      - name: Test LEARN02 fixed-control invariants
        run: .learn02-locked/bin/python -m pytest -q tests/test_scaling_vertical_268k.py
      - name: Execute deep 95K vs 268K trajectory
        env:
          SOURCE_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          REPO_ROOT="$PWD"
          .learn02-locked/bin/python -m twelve_six.scaling_vertical_268k run \
            --repo-root "$REPO_ROOT" \
            --source-sha "$SOURCE_SHA" \
            --config "$REPO_ROOT/configs/experiments/learn02_research41_268k_vertical_v1.json" \
            --output "$REPO_ROOT/learn02-evidence/report.json" \
            --checkpoint-root "$REPO_ROOT/learn02-evidence/checkpoints"
          .learn02-locked/bin/python -m twelve_six.scaling_vertical_268k validate \
            "$REPO_ROOT/learn02-evidence/report.json" \
            --expected-source-sha "$SOURCE_SHA"
          .learn02-locked/bin/python - <<'PY'
          import json
          report = json.load(open("learn02-evidence/report.json", encoding="utf-8"))
          print(json.dumps({
              "source": report["source"],
              "decision": report["decision"],
              "equal_token_comparison": report["equal_token_comparison"],
              "report_sha256": report["report_sha256"],
          }, indent=2, sort_keys=True))
          PY
      - name: Upload machine-readable evidence and checkpoints
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: learn02-268k-fixed-control-evidence
          path: |
            learn02-locked-environment.json
            learn02-evidence/report.json
            learn02-evidence/checkpoints/
          if-no-files-found: error
          retention-days: 30
