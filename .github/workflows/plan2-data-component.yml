name: Plan 2 Data Component Qualification

on:
  push:
    branches:
      - 'plan2/**'
    paths:
      - 'tools/plan2_*.py'
      - 'tests/test_plan2_*.py'
      - 'configs/data/plan2_near_dedup_audit_v1.json'
      - 'configs/data/plan2_reserved_eval_fixture_v1.json'
      - 'configs/data/plan2_corpus_mixture_policy_v1.json'
      - 'configs/data/plan2_cluster_split_policy_v1.json'
      - 'configs/data/plan2_tokenizer_fit_policy_v1.json'
      - '.github/workflows/plan2-data-component.yml'
  pull_request:
    paths:
      - 'tools/plan2_*.py'
      - 'tests/test_plan2_*.py'
      - 'configs/data/plan2_near_dedup_audit_v1.json'
      - 'configs/data/plan2_reserved_eval_fixture_v1.json'
      - 'configs/data/plan2_corpus_mixture_policy_v1.json'
      - 'configs/data/plan2_cluster_split_policy_v1.json'
      - 'configs/data/plan2_tokenizer_fit_policy_v1.json'
      - '.github/workflows/plan2-data-component.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qualify-plan2:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install minimal LOCAL_FREE test dependencies
        run: python -m pip install pytest ruff
      - name: Lint new Plan 2 Section 3 surfaces
        run: ruff check tools/plan2_physical_materialization_v1.py tests/test_plan2_physical_materialization_v1.py
      - name: Verify integrated S1-S2-S3 and incumbent DATA324
        run: PYTHONPATH=src:. pytest -q tests/test_plan2_source_inventory_v1.py tests/test_plan2_source_admissibility_v1.py tests/test_plan2_physical_materialization_v1.py tests/test_data324_current_main_port.py
      - name: Lint Plan 2 Section 5 privacy candidate and tests
        run: ruff check tools/plan2_privacy_gate_v1.py tests/test_plan2_privacy_gate_v1.py
      - name: Qualify Plan 2 Section 5 privacy positive negative rebuild restart
        run: PYTHONPATH=src:. pytest -q tests/test_plan2_privacy_gate_v1.py
      - name: Replay privacy gate CLI on exact candidate without logging payload
        shell: bash
        run: |
          export PYTHONPATH=src:.
          python tools/plan2_privacy_gate_v1.py --out-dir "${RUNNER_TEMP}/plan2-privacy-candidate" > "${RUNNER_TEMP}/plan2-privacy-first.json"
          python tools/plan2_privacy_gate_v1.py --out-dir "${RUNNER_TEMP}/plan2-privacy-candidate" > "${RUNNER_TEMP}/plan2-privacy-restart.json"
          cmp "${RUNNER_TEMP}/plan2-privacy-first.json" "${RUNNER_TEMP}/plan2-privacy-restart.json"
      - name: Lint Plan 2 Section 6 exact dedup
        run: ruff check tools/plan2_exact_dedup_v1.py tests/test_plan2_exact_dedup_v1.py
      - name: Qualify Plan 2 Section 6 exact global dedup and recovery
        run: PYTHONPATH=src:. pytest -q tests/test_plan2_exact_dedup_v1.py
      - name: Verify S6 exact dedup CLI byte-for-byte restart
        shell: bash
        run: |
          export PYTHONPATH=src:.
          python tools/plan2_exact_dedup_v1.py --out-dir "${RUNNER_TEMP}/plan2-exact" > "${RUNNER_TEMP}/plan2-exact-first.json"
          python tools/plan2_exact_dedup_v1.py --out-dir "${RUNNER_TEMP}/plan2-exact" > "${RUNNER_TEMP}/plan2-exact-restart.json"
          cmp "${RUNNER_TEMP}/plan2-exact-first.json" "${RUNNER_TEMP}/plan2-exact-restart.json"
      - name: Lint Plan 2 Section 7 near and mirror dedup
        run: ruff check tools/plan2_near_dedup_v1.py tests/test_plan2_near_dedup_v1.py
      - name: Qualify Plan 2 Section 7 near dedup, audit and recovery
        run: PYTHONPATH=src:. pytest -q tests/test_plan2_near_dedup_v1.py
      - name: Verify S7 near dedup CLI deterministic restart
        shell: bash
        run: |
          export PYTHONPATH=src:.
          python tools/plan2_near_dedup_v1.py --out-dir "${RUNNER_TEMP}/plan2-near" > "${RUNNER_TEMP}/plan2-near-first.json"
          python tools/plan2_near_dedup_v1.py --out-dir "${RUNNER_TEMP}/plan2-near" > "${RUNNER_TEMP}/plan2-near-restart.json"
          cmp "${RUNNER_TEMP}/plan2-near-first.json" "${RUNNER_TEMP}/plan2-near-restart.json"
      - name: Lint Plan 2 Section 8 reserved evaluation firewall
        run: ruff check tools/plan2_reserved_eval_firewall_v1.py tests/test_plan2_reserved_eval_firewall_v1.py
      - name: Qualify Plan 2 Section 8 reserve / exclusion / negative / restart
        run: PYTHONPATH=src:. pytest -q tests/test_plan2_reserved_eval_firewall_v1.py tests/test_data232_decontamination_authority_v2.py
      - name: Verify S8 physical firewall CLI restart and clean rebuild
        shell: bash
        run: |
          export PYTHONPATH=src:.
          python tools/plan2_reserved_eval_firewall_v1.py --out-dir "${RUNNER_TEMP}/plan2-s8" > "${RUNNER_TEMP}/plan2-s8-first.json"
          python tools/plan2_reserved_eval_firewall_v1.py --out-dir "${RUNNER_TEMP}/plan2-s8" > "${RUNNER_TEMP}/plan2-s8-restart.json"
          python tools/plan2_reserved_eval_firewall_v1.py --out-dir "${RUNNER_TEMP}/plan2-s8-fresh" > "${RUNNER_TEMP}/plan2-s8-clean.json"
          cmp "${RUNNER_TEMP}/plan2-s8-first.json" "${RUNNER_TEMP}/plan2-s8-restart.json"
          cmp "${RUNNER_TEMP}/plan2-s8-first.json" "${RUNNER_TEMP}/plan2-s8-clean.json"
          cmp "${RUNNER_TEMP}/plan2-s8/reserved-eval-firewall-manifest.json" "${RUNNER_TEMP}/plan2-s8-fresh/reserved-eval-firewall-manifest.json"
      - name: Lint Plan 2 Section 9 corpus mixture and tests
        run: ruff check tools/plan2_corpus_mixture_v1.py tests/test_plan2_corpus_mixture_v1.py
      - name: Qualify S9 weights caps versioning decontamination recovery
        run: PYTHONPATH=src:. pytest -q tests/test_plan2_corpus_mixture_v1.py tests/test_plan2_reserved_eval_firewall_v1.py tests/test_data232_decontamination_authority_v2.py
      - name: Verify S9 exact restart and clean rebuild
        shell: bash
        run: |
          export PYTHONPATH=src:.
          python tools/plan2_corpus_mixture_v1.py --out-dir "${RUNNER_TEMP}/plan2-s9" > "${RUNNER_TEMP}/plan2-s9-first.json"
          python tools/plan2_corpus_mixture_v1.py --out-dir "${RUNNER_TEMP}/plan2-s9" > "${RUNNER_TEMP}/plan2-s9-restart.json"
          python tools/plan2_corpus_mixture_v1.py --out-dir "${RUNNER_TEMP}/plan2-s9-fresh" > "${RUNNER_TEMP}/plan2-s9-clean.json"
          cmp "${RUNNER_TEMP}/plan2-s9-first.json" "${RUNNER_TEMP}/plan2-s9-restart.json"
          cmp "${RUNNER_TEMP}/plan2-s9-first.json" "${RUNNER_TEMP}/plan2-s9-clean.json"
          cmp "${RUNNER_TEMP}/plan2-s9/corpus-mixture-manifest.json" "${RUNNER_TEMP}/plan2-s9-fresh/corpus-mixture-manifest.json"
      - name: Lint Plan 2 Section 10 document cluster split
        run: ruff check tools/plan2_cluster_split_v1.py tests/test_plan2_cluster_split_v1.py
      - name: Qualify S10 train validation test family isolation and negative recovery
        run: PYTHONPATH=src:. pytest -q tests/test_plan2_cluster_split_v1.py tests/test_split_robustness.py
      - name: Verify S10 LOCAL_FREE fixture restart and clean rebuild
        shell: bash
        run: |
          export PYTHONPATH=src:.
          python tools/plan2_cluster_split_v1.py --out-dir "${RUNNER_TEMP}/plan2-s10" > "${RUNNER_TEMP}/plan2-s10-first.json"
          python tools/plan2_cluster_split_v1.py --out-dir "${RUNNER_TEMP}/plan2-s10" > "${RUNNER_TEMP}/plan2-s10-restart.json"
          python tools/plan2_cluster_split_v1.py --out-dir "${RUNNER_TEMP}/plan2-s10-fresh" > "${RUNNER_TEMP}/plan2-s10-clean.json"
          cmp "${RUNNER_TEMP}/plan2-s10-first.json" "${RUNNER_TEMP}/plan2-s10-restart.json"
          cmp "${RUNNER_TEMP}/plan2-s10-first.json" "${RUNNER_TEMP}/plan2-s10-clean.json"
          cmp "${RUNNER_TEMP}/plan2-s10/cluster-split-manifest.json" "${RUNNER_TEMP}/plan2-s10-fresh/cluster-split-manifest.json"
      - name: Verify actual S9 single-document split fails closed
        shell: bash
        run: |
          export PYTHONPATH=src:.
          if python tools/plan2_cluster_split_v1.py --physical-candidate --out-dir "${RUNNER_TEMP}/plan2-s10-single-source"; then
            echo "ERROR: single-document candidate was incorrectly released" >&2
            exit 1
          fi
          test ! -f "${RUNNER_TEMP}/plan2-s10-single-source/cluster-split-manifest.json"
      - name: Lint Plan 2 Section 11 tokenizer candidate component
        run: ruff check tools/plan2_tokenizer_candidates_v1.py tests/test_plan2_tokenizer_candidates_v1.py
      - name: Qualify Plan 2 Section 11 tokenizer candidates and incumbent compatibility
        run: PYTHONPATH=src:. pytest -q tests/test_plan2_tokenizer_candidates_v1.py tests/test_tokenization.py tests/test_tokenizer_migration_compatibility.py
      - name: Verify S11 fixture probe restart and clean rebuild
        shell: bash
        run: |
          export PYTHONPATH=src:.
          python tools/plan2_tokenizer_candidates_v1.py --out-dir "$RUNNER_TEMP/plan2-s11" > "$RUNNER_TEMP/plan2-s11-first.json"
          python tools/plan2_tokenizer_candidates_v1.py --out-dir "$RUNNER_TEMP/plan2-s11" > "$RUNNER_TEMP/plan2-s11-restart.json"
          python tools/plan2_tokenizer_candidates_v1.py --out-dir "$RUNNER_TEMP/plan2-s11-clean" > "$RUNNER_TEMP/plan2-s11-clean.json"
          cmp "$RUNNER_TEMP/plan2-s11-first.json" "$RUNNER_TEMP/plan2-s11-restart.json"
          cmp "$RUNNER_TEMP/plan2-s11-first.json" "$RUNNER_TEMP/plan2-s11-clean.json"
          cmp "$RUNNER_TEMP/plan2-s11/tokenizer-candidate-manifest.json" "$RUNNER_TEMP/plan2-s11-clean/tokenizer-candidate-manifest.json"
      - name: Lint Plan 2 Section 12 tokenizer fit and freeze
        run: ruff check tools/plan2_tokenizer_fit_freeze_v1.py tests/test_plan2_tokenizer_fit_freeze_v1.py
      - name: Qualify Plan 2 Section 12 immutable tokenizer and compatibility
        run: PYTHONPATH=src:. pytest -q tests/test_plan2_tokenizer_fit_freeze_v1.py tests/test_plan2_tokenizer_candidates_v1.py tests/test_tokenization.py tests/test_tokenizer_migration_compatibility.py tests/test_plan2_cluster_split_v1.py
      - name: Verify S12 frozen fixture restart and clean rebuild
        shell: bash
        run: |
          export PYTHONPATH=src:.
          python tools/plan2_tokenizer_fit_freeze_v1.py --out-dir "$RUNNER_TEMP/plan2-s12" > "$RUNNER_TEMP/plan2-s12-first.json"
          python tools/plan2_tokenizer_fit_freeze_v1.py --out-dir "$RUNNER_TEMP/plan2-s12" > "$RUNNER_TEMP/plan2-s12-restart.json"
          python tools/plan2_tokenizer_fit_freeze_v1.py --out-dir "$RUNNER_TEMP/plan2-s12-clean" > "$RUNNER_TEMP/plan2-s12-clean.json"
          cmp "$RUNNER_TEMP/plan2-s12-first.json" "$RUNNER_TEMP/plan2-s12-restart.json"
          cmp "$RUNNER_TEMP/plan2-s12-first.json" "$RUNNER_TEMP/plan2-s12-clean.json"
          cmp "$RUNNER_TEMP/plan2-s12/frozen-tokenizer-fixture.json" "$RUNNER_TEMP/plan2-s12-clean/frozen-tokenizer-fixture.json"
      - name: Materialize source-level candidate and replay exact restart
        shell: bash
        run: |
          export PYTHONPATH=src:.
          python tools/plan2_physical_materialization_v1.py --out-dir "${RUNNER_TEMP}/plan2-current-candidate" > "${RUNNER_TEMP}/plan2-first-readback.json"
          python tools/plan2_physical_materialization_v1.py --out-dir "${RUNNER_TEMP}/plan2-current-candidate" > "${RUNNER_TEMP}/plan2-restart-readback.json"
          cmp "${RUNNER_TEMP}/plan2-first-readback.json" "${RUNNER_TEMP}/plan2-restart-readback.json"
      - name: Retain manifest-only hash evidence
        uses: actions/upload-artifact@v4
        with:
          name: plan2-s3-physical-manifest
          path: |
            ${{ runner.temp }}/plan2-current-candidate/manifest.json
            ${{ runner.temp }}/plan2-first-readback.json
            ${{ runner.temp }}/plan2-restart-readback.json
          if-no-files-found: error

      - name: Lint Plan 2 Section 13 deterministic fixture packing
        run: ruff check tools/plan2_deterministic_packing_v1.py tests/test_plan2_deterministic_packing_v1.py
      - name: Qualify Plan 2 Section 13 packing negative recovery and parent contracts
        run: PYTHONPATH=src:. pytest -q tests/test_plan2_deterministic_packing_v1.py tests/test_plan2_tokenizer_fit_freeze_v1.py tests/test_plan2_cluster_split_v1.py
      - name: Verify S13 packed shards restart and clean rebuild
        shell: bash
        run: |
          export PYTHONPATH=src:.
          python tools/plan2_deterministic_packing_v1.py --out-dir "$RUNNER_TEMP/plan2-s13" > "$RUNNER_TEMP/plan2-s13-first.json"
          python tools/plan2_deterministic_packing_v1.py --out-dir "$RUNNER_TEMP/plan2-s13" > "$RUNNER_TEMP/plan2-s13-restart.json"
          python tools/plan2_deterministic_packing_v1.py --out-dir "$RUNNER_TEMP/plan2-s13-clean" > "$RUNNER_TEMP/plan2-s13-clean.json"
          cmp "$RUNNER_TEMP/plan2-s13-first.json" "$RUNNER_TEMP/plan2-s13-restart.json"
          cmp "$RUNNER_TEMP/plan2-s13-first.json" "$RUNNER_TEMP/plan2-s13-clean.json"
          diff -r "$RUNNER_TEMP/plan2-s13" "$RUNNER_TEMP/plan2-s13-clean"

      - name: Lint Plan 2 Section 14 ordered exposures
        run: ruff check tools/plan2_exposure_ledger_v1.py tests/test_plan2_exposure_ledger_v1.py
      - name: Qualify Plan 2 Section 14 target IDs, causal chain and restart
        run: PYTHONPATH=src:. pytest -q tests/test_plan2_exposure_ledger_v1.py tests/test_plan2_deterministic_packing_v1.py
      - name: Verify S14 exact replay, clean rebuild, and immutable release
        shell: bash
        run: |
          export PYTHONPATH=src:.
          python tools/plan2_deterministic_packing_v1.py --out-dir "$RUNNER_TEMP/plan2-s14-input"
          python tools/plan2_exposure_ledger_v1.py --shards-dir "$RUNNER_TEMP/plan2-s14-input" --out-dir "$RUNNER_TEMP/plan2-s14" > "$RUNNER_TEMP/plan2-s14-first.json"
          python tools/plan2_exposure_ledger_v1.py --shards-dir "$RUNNER_TEMP/plan2-s14-input" --out-dir "$RUNNER_TEMP/plan2-s14" > "$RUNNER_TEMP/plan2-s14-restart.json"
          python tools/plan2_exposure_ledger_v1.py --shards-dir "$RUNNER_TEMP/plan2-s14-input" --out-dir "$RUNNER_TEMP/plan2-s14-clean" > "$RUNNER_TEMP/plan2-s14-clean.json"
          cmp "$RUNNER_TEMP/plan2-s14-first.json" "$RUNNER_TEMP/plan2-s14-restart.json"
          cmp "$RUNNER_TEMP/plan2-s14-first.json" "$RUNNER_TEMP/plan2-s14-clean.json"
          diff -r "$RUNNER_TEMP/plan2-s14" "$RUNNER_TEMP/plan2-s14-clean"

      - name: Lint Plan 2 Section 15 real public-domain book intake
        run: ruff check tools/plan2_public_domain_books_v1.py tests/test_plan2_public_domain_books_v1.py
      - name: Qualify 3 real book snapshots, hashes and negative recovery
        run: PYTHONPATH=src:. pytest -q tests/test_plan2_public_domain_books_v1.py
      - name: Verify reproducible book audit and same-destination restart
        shell: bash
        run: |
          export PYTHONPATH=src:.
          python tools/plan2_public_domain_books_v1.py --out-dir "$RUNNER_TEMP/plan2-books" > "$RUNNER_TEMP/plan2-books-1.json"
          python tools/plan2_public_domain_books_v1.py --out-dir "$RUNNER_TEMP/plan2-books" > "$RUNNER_TEMP/plan2-books-restart.json"
          python tools/plan2_public_domain_books_v1.py --out-dir "$RUNNER_TEMP/plan2-books-clean" > "$RUNNER_TEMP/plan2-books-clean.json"
          cmp "$RUNNER_TEMP/plan2-books-1.json" "$RUNNER_TEMP/plan2-books-restart.json"
          cmp "$RUNNER_TEMP/plan2-books-1.json" "$RUNNER_TEMP/plan2-books-clean.json"
          cmp "$RUNNER_TEMP/plan2-books/public-domain-physical-manifest.json" "$RUNNER_TEMP/plan2-books-clean/public-domain-physical-manifest.json"
      - name: Lint Plan 2 S15 physical-book document split probe
        run: ruff check tools/plan2_s15_physical_book_split_probe_v1.py tests/test_plan2_s15_physical_book_split_probe_v1.py
      - name: Verify real-book document split mechanics and negative controls
        run: PYTHONPATH=src:. pytest -q tests/test_plan2_s15_physical_book_split_probe_v1.py
      - name: Verify physical-book split probe restart and clean rebuild
        shell: bash
        run: |
          export PYTHONPATH=src:.
          python tools/plan2_s15_physical_book_split_probe_v1.py --out-dir "$RUNNER_TEMP/s15-book-probe" > "$RUNNER_TEMP/s15-book-probe-first.json"
          python tools/plan2_s15_physical_book_split_probe_v1.py --out-dir "$RUNNER_TEMP/s15-book-probe" > "$RUNNER_TEMP/s15-book-probe-restart.json"
          python tools/plan2_s15_physical_book_split_probe_v1.py --out-dir "$RUNNER_TEMP/s15-book-probe-clean" > "$RUNNER_TEMP/s15-book-probe-clean.json"
          cmp "$RUNNER_TEMP/s15-book-probe-first.json" "$RUNNER_TEMP/s15-book-probe-restart.json"
          cmp "$RUNNER_TEMP/s15-book-probe-first.json" "$RUNNER_TEMP/s15-book-probe-clean.json"
          cmp "$RUNNER_TEMP/s15-book-probe/book-split-probe.json" "$RUNNER_TEMP/s15-book-probe-clean/book-split-probe.json"
      - name: Lint Plan 2 Section 15 non-release qualification audit
        run: ruff check tools/plan2_terminal_qualification_v1.py tests/test_plan2_terminal_qualification_v1.py
      - name: Qualify S15 exact physical-candidate and synthetic clean-build refusal
        run: PYTHONPATH=src:. pytest -q tests/test_plan2_terminal_qualification_v1.py
