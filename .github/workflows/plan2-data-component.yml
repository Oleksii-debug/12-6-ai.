  qualify-three-family-s13-s14:
    name: real-three-family-s13-s14
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install LOCAL_FREE tools
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Lint Plan3/4 tokenizer ModelSpec compatibility guard
        run: ruff check tools/plan2_s15_plan34_compatibility_v1.py tests/test_plan2_s15_plan34_compatibility_v1.py
      - name: Require exact Plan3/4 contract to refuse fake production 32K vocab
        run: PYTHONPATH=src:. pytest -q tests/test_plan2_s15_plan34_compatibility_v1.py
      - name: Lint S13/S14 real three-family adapters and their independent tests
        run: ruff check tools/plan2_s15_three_family_train_packing_v1.py tools/plan2_s15_three_family_train_exposure_v1.py tests/test_plan2_s15_three_family_train_exposure_v1.py
      - name: Qualify physical 3-family train-only shard/target replay
        run: PYTHONPATH=src:. pytest -q tests/test_plan2_s15_three_family_train_exposure_v1.py
      - name: Fresh training-only physical shard and exposure publication
        shell: bash
        run: |
          export PYTHONPATH=src:.
          python -m tools.plan2_s15_three_family_train_exposure_v1 --root . --out-dir "$RUNNER_TEMP/real-three-s13-s14"
          python -c "import json,os,pathlib; p=pathlib.Path(os.environ['RUNNER_TEMP'])/'real-three-s13-s14/three-family-physical-s13-s14-candidate.json'; x=json.loads(p.read_bytes()); assert x['target_count']>0 and x['train_document_count']>0 and x['heldout_payloads_exposed'] is False and x['production_release_authorized'] is False and x['terminal_done'] is False"
      - name: Retain nonrelease cross-S13-S14 audit manifest
