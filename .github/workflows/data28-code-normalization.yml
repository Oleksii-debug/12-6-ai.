name: DATA-28 Code Normalization Fidelity

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  code-fidelity-local-free:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11.16"
      - name: Bind exact source head
        env:
          EXPECTED_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SOURCE_SHA"
      - name: Install locked test toolchain
        run: |
          python -m venv .data28
          .data28/bin/python -m pip install \
            --disable-pip-version-check --no-deps --require-hashes \
            -r requirements/locks/linux-x86_64/dev.lock.txt
      - name: Compile and lint DATA-28 code
        env:
          PYTHONPATH: src
        run: |
          .data28/bin/python -m compileall -q \
            src/twelve_six/data/code_normalization.py \
            src/twelve_six/data/pipeline.py \
            src/twelve_six/data/multilingual_pretraining.py \
            tests/test_code_normalization.py \
            tools/run_code_fidelity_suite.py
          .data28/bin/ruff check \
            src/twelve_six/data/code_normalization.py \
            src/twelve_six/data/pipeline.py \
            src/twelve_six/data/multilingual_pretraining.py \
            tests/test_code_normalization.py \
            tools/run_code_fidelity_suite.py
      - name: Run fidelity and D03 compatibility tests
        env:
          PYTHONPATH: src
        run: |
          .data28/bin/pytest -q \
            tests/test_code_normalization.py \
            tests/test_d03_s0_data_pipeline.py
      - name: Run pinned real licensed sample evidence
        env:
          EXPECTED_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          PYTHONPATH: src
        run: |
          .data28/bin/python tools/run_code_fidelity_suite.py \
            --source-sha "$EXPECTED_SOURCE_SHA" \
            --registry configs/data/code_fidelity_real_samples.v1.json \
            --output data28-code-fidelity-evidence.json
      - name: Upload DATA-28 evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: data28-code-normalization-fidelity
          path: |
            data28-code-fidelity-evidence.json
            configs/data/code_fidelity_real_samples.v1.json
          if-no-files-found: error
          retention-days: 30
