name: Plan 6 terminal LOCAL_FREE Evolution Engine qualification
on:
  pull_request:
    paths:
      - 'src/twelve_six/research_engine.py'
      - 'src/twelve_six/post_base_*.py'
      - 'src/twelve_six/teacher_council.py'
      - 'src/twelve_six/verified_data_factory.py'
      - 'src/twelve_six/self_play_engine.py'
      - 'src/twelve_six/continual_learning.py'
      - 'src/twelve_six/experience_replay.py'
      - 'src/twelve_six/autonomous_curriculum.py'
      - 'src/twelve_six/evolutionary_code.py'
      - 'src/twelve_six/autonomous_research_loop.py'
      - 'src/twelve_six/champion_lifecycle.py'
      - 'tests/test_plan6_terminal_qualification.py'
      - 'configs/plan6/evolution_engine_release_v1.json'
      - 'docs/PLAN6_TERMINAL_EVOLUTION_ENGINE.md'
      - '.github/workflows/plan6-terminal-local-free.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  plan6-evolution-fixture:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install local-only test dependencies
        run: python -m pip install -e '.[dev]'
      - name: Compile canonical engine and integration test
        run: python -m compileall -q src/twelve_six tests/test_plan6_terminal_qualification.py
      - name: Lint only Plan6 terminal test
        run: python -m ruff check tests/test_plan6_terminal_qualification.py
      - name: Run every Plan6 component and terminal cross-engine scenario
        env:
          TWELVE_SIX_EXECUTION_PROFILE: LOCAL_FREE
        run: |
          python -m pytest -q \
            tests/test_research_engine_plan6_section1.py \
            tests/test_post_base_instruction.py \
            tests/test_post_base_preference.py \
            tests/test_post_base_reasoning.py \
            tests/test_post_base_agentic.py \
            tests/test_teacher_council.py \
            tests/test_verified_data_factory.py \
            tests/test_self_play_engine.py \
            tests/test_continual_learning.py \
            tests/test_experience_replay.py \
            tests/test_autonomous_curriculum.py \
            tests/test_evolutionary_code.py \
            tests/test_autonomous_research_loop.py \
            tests/test_champion_lifecycle.py \
            tests/test_plan6_terminal_qualification.py
      - name: Prove no tracked source mutation by fixture tests
        run: git diff --exit-code -- .
