name: TEMP D03 Rada bulk quality privacy real execution 1337

on:
  pull_request:
    paths:
      - ".github/workflows/temp-d03-rada-bulk-qp-real-1337.yml"

permissions:
  contents: write
  actions: read

jobs:
  converge-and-execute-twice:
    if: github.event.pull_request.head.ref == 'gpt56/d03-rada-bulk-quality-privacy-20260826'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout incumbent PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Merge exact final parent and repair owned fail-closed bindings
        env:
          EXPECTED_PARENT_HEAD: 656dd4abe7bdf9c379a86ac9a19f046d5b0d8538
        run: |
          set -euo pipefail
          git config user.name "SWARM-1337"
          git config user.email "swarm-1337@users.noreply.github.com"
          git fetch --no-tags origin d03/rada-bulk-normalization-current-main-20260907
          test "$(git rev-parse FETCH_HEAD)" = "$EXPECTED_PARENT_HEAD"
          git merge --no-edit "$EXPECTED_PARENT_HEAD"

          python - <<'PY'
          from pathlib import Path

          owned = [
              Path("configs/data/d03_rada_bulk_quality_privacy_v1.json"),
              Path("docs/D03_RADA_BULK_QUALITY_PRIVACY.md"),
              Path("tests/test_d03_rada_bulk_quality_privacy.py"),
              Path("tools/filter_d03_rada_bulk_quality_privacy.py"),
          ]
          replacements = {
              "50069882dfb5866946626720a997a2c35458df7c": "656dd4abe7bdf9c379a86ac9a19f046d5b0d8538",
              "b2088754aa2d5ed6059d89587bbbf08437ba0f55": "f62670084f80041757e162743356ac16e0fd81a7",
              "34561144712": "34565921713",
              "663a8d60b595a6a57fc5fb5be631ce4ebb791e00ffc2bb6de8eae8d2c9743d30": "e1633070beaff596ae11f4974bd9662785723618f502f382850f7e3bea27ab6a",
          }
          seen = {old: 0 for old in replacements}
          for path in owned:
              text = path.read_text(encoding="utf-8")
              for old, new in replacements.items():
                  count = text.count(old)
                  seen[old] += count
                  text = text.replace(old, new)
              path.write_text(text, encoding="utf-8")
          for old, count in seen.items():
              if count == 0:
                  raise SystemExit(f"expected stale binding not found: {old}")

          doc = Path("docs/D03_RADA_BULK_QUALITY_PRIVACY.md")
          text = doc.read_text(encoding="utf-8")
          text = text.replace("PR #641", "PR #864")
          text = text.replace(
              "ae79b078f849513dc202bcb723a4145455309e35",
              "656dd4abe7bdf9c379a86ac9a19f046d5b0d8538",
          )
          marker = "Status: `QUALITY_PRIVACY_FILTERED_CANDIDATE_ONLY / ZERO_TRAINING_AUTHORIZATION`\n"
          if marker not in text:
              raise SystemExit("documentation status marker drift")
          text = text.replace(
              marker,
              marker
              + "\nCurrent parent authority: final merged PR #864 head `656dd4abe7bdf9c379a86ac9a19f046d5b0d8538`; repaired real execution head `f62670084f80041757e162743356ac16e0fd81a7`; run `34565921713`.\n",
              1,
          )
          doc.write_text(text, encoding="utf-8")

          tool = Path("tools/filter_d03_rada_bulk_quality_privacy.py")
          text = tool.read_text(encoding="utf-8")
          old_helper = '''def _require(condition: bool, message: str) -> None:\n    if not condition:\n        raise QualityPrivacyError(message)\n\n\ndef _sha256(payload: bytes) -> str:\n'''
          new_helper = '''def _require(condition: bool, message: str) -> None:\n    if not condition:\n        raise QualityPrivacyError(message)\n\n\ndef _require_exact_int(value: Any, expected: int, message: str) -> None:\n    _require(type(value) is int and value == expected, message)\n\n\ndef _sha256(payload: bytes) -> str:\n'''
          if text.count(old_helper) != 1:
              raise SystemExit("_require insertion seam drift")
          text = text.replace(old_helper, new_helper, 1)
          exact_replacements = {
              '_require(boundary.get("training_authorized_bytes") == 0, "training bytes nonzero")': '_require_exact_int(boundary.get("training_authorized_bytes"), 0, "training bytes nonzero")',
              '_require(boundary.get("optimizer_updates") == 0, "optimizer updates nonzero")': '_require_exact_int(boundary.get("optimizer_updates"), 0, "optimizer updates nonzero")',
              '_require(manifest.get("training_authorized_bytes") == 0, "parent grants training")': '_require_exact_int(manifest.get("training_authorized_bytes"), 0, "parent grants training")',
              '_require(manifest.get("normalized_capacity_credited") == 0, "parent grants capacity")': '_require_exact_int(manifest.get("normalized_capacity_credited"), 0, "parent grants capacity")',
          }
          for old, new in exact_replacements.items():
              if text.count(old) != 1:
                  raise SystemExit(f"strict-zero seam drift: {old}")
              text = text.replace(old, new, 1)
          tool.write_text(text, encoding="utf-8")

          tests = Path("tests/test_d03_rada_bulk_quality_privacy.py")
          text = tests.read_text(encoding="utf-8")
          import_needle = "    QualityPrivacyError,\n"
          if text.count(import_needle) != 1:
              raise SystemExit("test import seam drift")
          text = text.replace(
              import_needle,
              import_needle + "    _validate_config,\n    _verify_parent_manifest,\n",
              1,
          )
          test_marker = "def test_zero_credit_integer_fields_reject_bool_aliases()"
          if test_marker not in text:
              text += '''\n\ndef test_zero_credit_integer_fields_reject_bool_aliases() -> None:\n    for key, message in (("training_authorized_bytes", "training bytes nonzero"), ("optimizer_updates", "optimizer updates nonzero")):\n        tampered = copy.deepcopy(CONFIG)\n        tampered["claim_boundary"][key] = False\n        with pytest.raises(QualityPrivacyError, match=message):\n            _validate_config(tampered)\n\n\ndef test_parent_zero_credit_integer_fields_reject_bool_aliases() -> None:\n    text = "Нормативний український текст достатньої довжини для strict-zero перевірки. " * 5\n    _, manifest, _ = _parent_payload([text])\n    for key, message in (("training_authorized_bytes", "parent grants training"), ("normalized_capacity_credited", "parent grants capacity")):\n        tampered = copy.deepcopy(manifest)\n        tampered[key] = False\n        with pytest.raises(QualityPrivacyError, match=message):\n            _verify_parent_manifest(tampered)\n\n\ndef test_stale_parent_product_identity_cannot_reseal_current_config() -> None:\n    tampered = copy.deepcopy(CONFIG)\n    tampered["parent_normalization"]["head_sha"] = "50069882dfb5866946626720a997a2c35458df7c"\n    with pytest.raises(QualityPrivacyError, match="parent authority binding drift"):\n        _validate_config(tampered)\n'''
          tests.write_text(text, encoding="utf-8")
          PY

          python -m pip install --disable-pip-version-check pytest
          python -m py_compile \
            tools/filter_d03_rada_bulk_quality_privacy.py \
            tools/pin_d03_rada_bulk_observation.py \
            tools/normalize_d03_rada_bulk_html.py \
            tests/test_d03_rada_bulk_quality_privacy.py
          PYTHONPATH=. pytest -q \
            tests/test_d03_rada_bulk_quality_privacy.py \
            tests/test_d03_rada_bulk_observation_pin.py \
            tests/test_d03_rada_bulk_normalization.py \
            tests/test_d03_rada_bulk_probe_inventory_integrity.py
          git diff --check
          git add \
            configs/data/d03_rada_bulk_quality_privacy_v1.json \
            docs/D03_RADA_BULK_QUALITY_PRIVACY.md \
            tests/test_d03_rada_bulk_quality_privacy.py \
            tools/filter_d03_rada_bulk_quality_privacy.py
          git commit -m "D03: converge Rada quality/privacy authority"
          echo "REPAIR_HEAD=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Retrieve exact frozen source observation authority
        uses: actions/download-artifact@v4
        with:
          name: d03-rada-laws-current-observation-zero-credit
          github-token: ${{ github.token }}
          repository: Oleksii-debug/12-6-ai.
          run-id: 34535608294
          path: ${{ runner.temp }}/observation

      - name: Verify source authority and acquire exact archive twice
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          path = Path(os.environ["RUNNER_TEMP"]) / "observation/current-observation.json"
          raw = path.read_bytes()
          report = json.loads(raw)
          assert hashlib.sha256(raw).hexdigest() == "e2ad0d8a4fce01d2da03fc93d636354253beaaf563db43968b11b600e26d0cdf"
          assert report["archive"] == {
              "bytes": 46709153,
              "md5": "7ca9726549958ed8b8b54e6562c15da5",
              "sha256": "0b9e8ed8fe8aa663a68d2bc4eba858a754c626391dd7b5c461d50c3b6260df63",
              "url": "https://data.rada.gov.ua/ogd/zak/perv/text/texts.zip",
          }
          assert report["inventory"]["canonical_entry_count"] == 3052
          assert report["inventory"]["canonical_raw_bytes"] == 353426370
          assert report["inventory"]["entry_identity_sha256"] == "3939c8a407a910222173bba5a2df1b9c7d2edce1503c13b31a9c293d61c3a603"
          assert type(report["training_authorized_bytes"]) is int and report["training_authorized_bytes"] == 0
          assert report["corpus_admitted"] is False
          assert report["tokenizer_fit_authorized"] is False
          assert report["model_training_executed"] is False
          assert report["paid_compute_used"] is False
          PY
          for run in a b; do
            curl --fail --location --retry 3 --retry-all-errors \
              --output "${RUNNER_TEMP}/source-${run}.zip" \
              "https://data.rada.gov.ua/ogd/zak/perv/text/texts.zip"
          done
          python - <<'PY'
          import hashlib, os
          from pathlib import Path
          root = Path(os.environ["RUNNER_TEMP"])
          for name in ("source-a.zip", "source-b.zip"):
              raw = (root / name).read_bytes()
              assert len(raw) == 46709153
              assert hashlib.sha256(raw).hexdigest() == "0b9e8ed8fe8aa663a68d2bc4eba858a754c626391dd7b5c461d50c3b6260df63"
              assert hashlib.md5(raw, usedforsecurity=False).hexdigest() == "7ca9726549958ed8b8b54e6562c15da5"
          assert (root / "source-a.zip").read_bytes() == (root / "source-b.zip").read_bytes()
          PY

      - name: Normalize and quality privacy filter two clean acquisitions independently
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/run-a" "${RUNNER_TEMP}/run-b"
          for run in a b; do
            python tools/pin_d03_rada_bulk_observation.py \
              --archive "${RUNNER_TEMP}/source-${run}.zip" \
              --probe-report "${RUNNER_TEMP}/observation/current-observation.json" \
              --config configs/data/d03_rada_bulk_observation_pin_v1.json \
              --output "${RUNNER_TEMP}/run-${run}/pinned-report.json"
            test "$(sha256sum "${RUNNER_TEMP}/run-${run}/pinned-report.json" | awk '{print $1}')" = "9d94674323414d30f18517a71edbfee839a27a09a076eb94fe94d74cbaab53c8"
            python tools/normalize_d03_rada_bulk_html.py \
              --archive "${RUNNER_TEMP}/source-${run}.zip" \
              --probe-report "${RUNNER_TEMP}/run-${run}/pinned-report.json" \
              --config configs/data/d03_rada_bulk_normalization_v1.json \
              --output-jsonl "${RUNNER_TEMP}/run-${run}/normalized.jsonl" \
              --output-manifest "${RUNNER_TEMP}/run-${run}/manifest.json"
            test "$(sha256sum "${RUNNER_TEMP}/run-${run}/normalized.jsonl" | awk '{print $1}')" = "b46baa0f1c5087f4a9772ee273da459e87c0e82111dd5e51b22fc0b85cde840e"
            test "$(sha256sum "${RUNNER_TEMP}/run-${run}/manifest.json" | awk '{print $1}')" = "8923d26024ba396db14e6afeb367a5d3c54de573019252083aec88f2082bb119"
            python tools/filter_d03_rada_bulk_quality_privacy.py \
              --parent-jsonl "${RUNNER_TEMP}/run-${run}/normalized.jsonl" \
              --parent-manifest "${RUNNER_TEMP}/run-${run}/manifest.json" \
              --config configs/data/d03_rada_bulk_quality_privacy_v1.json \
              --output-jsonl "${RUNNER_TEMP}/run-${run}/quality-accepted.jsonl" \
              --output-report "${RUNNER_TEMP}/run-${run}/quality-report.json"
          done
          cmp "${RUNNER_TEMP}/run-a/normalized.jsonl" "${RUNNER_TEMP}/run-b/normalized.jsonl"
          cmp "${RUNNER_TEMP}/run-a/manifest.json" "${RUNNER_TEMP}/run-b/manifest.json"
          cmp "${RUNNER_TEMP}/run-a/quality-accepted.jsonl" "${RUNNER_TEMP}/run-b/quality-accepted.jsonl"
          cmp "${RUNNER_TEMP}/run-a/quality-report.json" "${RUNNER_TEMP}/run-b/quality-report.json"

      - name: Build compact text-free evidence and finalize branch
        env:
          BRANCH_NAME: gpt56/d03-rada-bulk-quality-privacy-20260826
        run: |
          set -euo pipefail
          mkdir -p evidence
          python - <<'PY'
          import hashlib, json, os, platform, sys
          from pathlib import Path

          root = Path(os.environ["RUNNER_TEMP"])
          report_path_a = root / "run-a/quality-report.json"
          report_path_b = root / "run-b/quality-report.json"
          accepted_a = root / "run-a/quality-accepted.jsonl"
          accepted_b = root / "run-b/quality-accepted.jsonl"
          normalized_a = root / "run-a/normalized.jsonl"
          normalized_b = root / "run-b/normalized.jsonl"
          manifest_a = root / "run-a/manifest.json"
          manifest_b = root / "run-b/manifest.json"

          def sha(path: Path) -> str:
              return hashlib.sha256(path.read_bytes()).hexdigest()

          report_a = json.loads(report_path_a.read_text(encoding="utf-8"))
          report_b = json.loads(report_path_b.read_text(encoding="utf-8"))
          assert report_a == report_b
          assert report_a["gates"]["exact_parent_authority"] == "PASS"
          assert report_a["gates"]["bounded_quality_privacy_filter_execution"] == "PASS"
          assert type(report_a["training_authorized_bytes"]) is int and report_a["training_authorized_bytes"] == 0
          assert type(report_a["optimizer_updates"]) is int and report_a["optimizer_updates"] == 0
          assert type(report_a["canonical_capacity_credited"]) is int and report_a["canonical_capacity_credited"] == 0
          assert report_a["tokenizer_fit_authorized"] is False
          assert report_a["model_training_executed"] is False
          assert report_a["final_test_accessed"] is False
          assert report_a["paid_compute_used"] is False

          evidence = {
              "schema_version": "12-6.d03-rada-bulk-quality-privacy-real-execution-evidence.v1",
              "execution_class": "LOCAL_FREE_GITHUB_HOSTED_ACTIONS",
              "repair_execution_head_sha": os.environ["REPAIR_HEAD"],
              "workflow_run_id": int(os.environ["GITHUB_RUN_ID"]),
              "workflow_run_attempt": int(os.environ["GITHUB_RUN_ATTEMPT"]),
              "parent_authority": {
                  "pr": 864,
                  "final_head_sha": "656dd4abe7bdf9c379a86ac9a19f046d5b0d8538",
                  "real_execution_head_sha": "f62670084f80041757e162743356ac16e0fd81a7",
                  "real_execution_run_id": 34565921713,
                  "real_execution_evidence_identity_sha256": "e1633070beaff596ae11f4974bd9662785723618f502f382850f7e3bea27ab6a",
                  "manifest_identity_sha256": "ee1c59dbc481b83bffb1380f751880e5fa6e64d654b5abad266c3e2c4d18293b",
                  "manifest_file_sha256": sha(manifest_a),
                  "normalized_jsonl_sha256": sha(normalized_a),
                  "normalized_record_inventory_sha256": "bd790b51809018950fcf8d9919f62920ab79aee64f8d73e131cbe16772554495",
                  "record_count": 3052,
                  "normalized_bytes_observed_not_credited": 211176449,
              },
              "source_authority": {
                  "observation_run_id": 34535608294,
                  "observation_report_sha256": "e2ad0d8a4fce01d2da03fc93d636354253beaaf563db43968b11b600e26d0cdf",
                  "archive_bytes": 46709153,
                  "archive_sha256": "0b9e8ed8fe8aa663a68d2bc4eba858a754c626391dd7b5c461d50c3b6260df63",
                  "entry_identity_sha256": "3939c8a407a910222173bba5a2df1b9c7d2edce1503c13b31a9c293d61c3a603",
              },
              "two_clean_reproducibility": {
                  "source_archives_identical": sha(root / "source-a.zip") == sha(root / "source-b.zip"),
                  "normalized_jsonl_identical": sha(normalized_a) == sha(normalized_b),
                  "manifests_identical": sha(manifest_a) == sha(manifest_b),
                  "quality_accepted_jsonl_identical": sha(accepted_a) == sha(accepted_b),
                  "quality_reports_identical": sha(report_path_a) == sha(report_path_b),
              },
              "observed_quality_privacy": {
                  "parent_record_count": report_a["input"]["parent_record_count"],
                  "parent_normalized_bytes": report_a["input"]["parent_normalized_bytes"],
                  "total_chunks": report_a["filter_result"]["total_chunks"],
                  "accepted_chunk_count": report_a["filter_result"]["accepted_chunk_count"],
                  "rejected_chunk_count": report_a["filter_result"]["rejected_chunk_count"],
                  "rejection_reasons": report_a["filter_result"]["rejection_reasons"],
                  "accepted_bytes_observed_not_credited": report_a["filter_result"]["accepted_bytes_observed_not_credited"],
                  "accepted_source_encoding_counts": report_a["filter_result"]["accepted_source_encoding_counts"],
                  "accepted_jsonl_file_bytes": accepted_a.stat().st_size,
                  "accepted_jsonl_sha256": sha(accepted_a),
                  "accepted_inventory_sha256": report_a["filter_result"]["accepted_inventory_sha256"],
                  "exact_duplicate_accepted_hashes_observed_not_removed": report_a["filter_result"]["exact_duplicate_accepted_hashes_observed_not_removed"],
                  "quality_report_file_sha256": sha(report_path_a),
                  "quality_report_identity_sha256": report_a["report_identity_sha256"],
              },
              "environment": {
                  "python": sys.version.split()[0],
                  "platform": platform.platform(),
                  "runner_os": os.environ.get("RUNNER_OS"),
                  "runner_arch": os.environ.get("RUNNER_ARCH"),
              },
              "truth_boundary": {
                  "current_corpus_eligible": False,
                  "canonical_capacity_credited": 0,
                  "training_authorized_bytes": 0,
                  "tokenizer_fit_authorized": False,
                  "authorized_optimized_target_exposure": 0,
                  "optimizer_updates_executed_on_real_targets": 0,
                  "model_training_executed": False,
                  "learned_weights_created": False,
                  "final_test_accessed": False,
                  "paid_compute_used": False,
                  "foreign_pretrained_weights": False,
                  "external_llm_api_data_or_intelligence": False,
              },
              "safe_result": "QUALITY_PRIVACY_FILTERED_CANDIDATE_ZERO_CREDIT_TWO_CLEAN_REAL_EXECUTION",
          }
          canonical = json.dumps(evidence, ensure_ascii=False, sort_keys=True, separators=(",", ":")).encode("utf-8")
          evidence["evidence_identity_sha256"] = hashlib.sha256(canonical).hexdigest()
          out = Path("evidence/d03-rada-bulk-quality-privacy-real-execution-v1.json")
          out.write_text(json.dumps(evidence, ensure_ascii=False, sort_keys=True, indent=2) + "\n", encoding="utf-8")
          artifact = root / "d03-rada-bulk-quality-privacy-real-execution-v1.json"
          artifact.write_bytes(out.read_bytes())
          print("EVIDENCE_JSON=" + json.dumps(evidence, ensure_ascii=False, sort_keys=True, separators=(",", ":")))
          PY

          git rm .github/workflows/temp-d03-rada-bulk-qp-real-1337.yml
          git add evidence/d03-rada-bulk-quality-privacy-real-execution-v1.json
          git diff --cached --check
          git commit -m "D03: retain real Rada quality/privacy execution evidence"
          git push origin "HEAD:${BRANCH_NAME}"

      - name: Upload compact text-free evidence only
        uses: actions/upload-artifact@v4
        with:
          name: d03-rada-bulk-quality-privacy-real-zero-credit
          path: ${{ runner.temp }}/d03-rada-bulk-quality-privacy-real-execution-v1.json
          if-no-files-found: error
          retention-days: 2
