name: NEXT100-060 Purpose Rights Firewall

on:
  pull_request:
    paths:
      - "src/twelve_six/data/rights_firewall.py"
      - "configs/data/next100_060_purpose_rights_firewall_v1.json"
      - "tools/validate_next100_060_purpose_rights_firewall.py"
      - "tests/test_next100_060_purpose_rights_firewall.py"
      - "docs/NEXT100_060_PURPOSE_RIGHTS_FIREWALL.md"
      - ".github/workflows/next100-060-purpose-rights-firewall.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONPATH: src
  TWELVE_SIX_EXECUTION_PROFILE: LOCAL_FREE

jobs:
  purpose-rights-firewall:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out exact trigger revision
        uses: actions/checkout@3d3c42b9d75bd4a39b1223454f1fbd1f62c507e3
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1

      - name: Assert exact checked-out head
        shell: bash
        run: |
          set -euo pipefail
          expected="${{ github.event.pull_request.head.sha || github.sha }}"
          test "$(git rev-parse HEAD)" = "$expected"

      - name: Set up Python 3.11.16
        uses: actions/setup-python@5fda3b5c7b42d0acba12d210d2a55f7c4f0c9d2d
        with:
          python-version: "3.11.16"

      - name: Bootstrap LOCAL_FREE test environment
        uses: ./.github/actions/execution-bootstrap
        with:
          capabilities: runtime,tests
          venv: .next100060
          manifest: next100060-environment.json
          command: >-
            python -m pytest -q
            tests/test_next100_060_purpose_rights_firewall.py

      - name: Validate sealed purpose authority
        shell: bash
        run: |
          set -euo pipefail
          .next100060/bin/python -m py_compile \
            src/twelve_six/data/rights_firewall.py \
            tools/validate_next100_060_purpose_rights_firewall.py \
            tests/test_next100_060_purpose_rights_firewall.py
          .next100060/bin/python tools/validate_next100_060_purpose_rights_firewall.py
          .next100060/bin/python -m pytest -q \
            tests/test_next100_060_purpose_rights_firewall.py

      - name: Assert no training execution authority
        shell: bash
        run: |
          set -euo pipefail
          .next100060/bin/python - <<'PY'
          import json
          from pathlib import Path

          config = json.loads(
              Path("configs/data/next100_060_purpose_rights_firewall_v1.json").read_text()
          )
          assert config["execution_profile"] == "LOCAL_FREE"
          assert config["training_executed"] is False
          PY
