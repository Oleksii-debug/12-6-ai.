name: DATA-183 Corpus V0.2 Real Candidate

on:
  push:
    branches:
      - data183/corpus-v02-real-20260826
  pull_request:
    branches:
      - data110/corpus-v1-rc-20260826
  workflow_dispatch:

permissions:
  contents: read

jobs:
  corpus-v02-real-candidate:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      PYTHONPATH: src
      OMP_NUM_THREADS: "2"
      MKL_NUM_THREADS: "2"
    steps:
      - name: Checkout exact DATA-183 head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up exact Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11.16"

      - name: Bind exact source head
        env:
          EXPECTED_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SOURCE_SHA"

      - name: Install hash-locked Product runtime
        run: |
          set -euo pipefail
          python -m venv .d183
          .d183/bin/python -m pip install \
            --disable-pip-version-check --no-deps --require-hashes \
            -r requirements/locks/linux-x86_64/toolchain.lock.txt
          .d183/bin/python -m pip install \
            --disable-pip-version-check --no-deps --require-hashes \
            -r requirements/locks/linux-x86_64/runtime.lock.txt
          .d183/bin/python -m pip install \
            --disable-pip-version-check --no-deps --require-hashes \
            -r requirements/locks/linux-x86_64/dev.lock.txt

      - name: Install exact DATA-31 DataTrove experiment runtime
        run: |
          set -euo pipefail
          mkdir -p /tmp/datatrove-wheel /tmp/tokenizers-wheel
          .d183/bin/python -m pip download --no-deps datatrove==0.10.0 -d /tmp/datatrove-wheel
          WHEEL="$(find /tmp/datatrove-wheel -name 'datatrove-0.10.0-*.whl' -print -quit)"
          test -n "$WHEEL"
          test "$(sha256sum "$WHEEL" | awk '{print $1}')" = "c7bb75deed2c3e88fb5138f8ea075a170ee98d6c94fc263829609091ea9c2b5d"
          .d183/bin/python -m pip download --no-deps tokenizers==0.23.1 -d /tmp/tokenizers-wheel
          TOKENIZERS_WHEEL="$(find /tmp/tokenizers-wheel -name 'tokenizers-0.23.1-*.whl' -print -quit)"
          test -n "$TOKENIZERS_WHEEL"
          test "$(sha256sum "$TOKENIZERS_WHEEL" | awk '{print $1}')" = "5075b405006415ea148a992d093699c66eb01952bf59f4d5727089a98bda45a4"
          .d183/bin/python -m pip install "$WHEEL" orjson regex "xxhash==3.8.1"
          .d183/bin/python -m pip install --no-deps "$TOKENIZERS_WHEEL"
          .d183/bin/python -m pip check

      - name: Compile and test DATA-183 convergence surface
        run: |
          set -euo pipefail
          .d183/bin/python -m compileall -q src/twelve_six
          .d183/bin/python -m ruff check --select E,F \
            src/twelve_six/data183_corpus_v02_real.py \
            src/twelve_six/data110_release_candidate.py \
            tests/test_data183_corpus_v02_real.py \
            tests/test_data110_release_candidate.py
          .d183/bin/python -m pytest -q \
            tests/test_data183_corpus_v02_real.py \
            tests/test_data110_release_candidate.py \
            tests/test_data25_corpus_v01.py \
            tests/test_milestone100_first_learned.py

      - name: Reacquire bounded real rights-approved UK and EN inputs
        run: |
          set -euo pipefail
          .d183/bin/python tools/run_external_source_intake.py \
            --output data183-external-intake \
            --max-download-bytes 2000000 \
            --max-normalized-chars 50000 \
            | tee data183-external-intake.stdout.json

      - name: Build DATA-183 through two clean DATA-110 builds
        env:
          EXPECTED_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          .d183/bin/python -m twelve_six.data183_corpus_v02_real build \
            --repo-root . \
            --source-sha "$EXPECTED_SOURCE_SHA" \
            --external-intake data183-external-intake \
            --output-dir data183-evidence

      - name: Validate fail-closed V0.2 truth boundary
        env:
          EXPECTED_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          .d183/bin/python -m twelve_six.data183_corpus_v02_real validate \
            data183-evidence/corpus-v0.2-real-candidate.json \
            --expected-source-sha "$EXPECTED_SOURCE_SHA"
          .d183/bin/python - <<'PY'
          import json
          from pathlib import Path
          r = json.loads(Path("data183-evidence/corpus-v0.2-real-candidate.json").read_text(encoding="utf-8"))
          assert r["status"] == "CANDIDATE_UA_EN_REAL_PROJECT_CODE"
          assert r["two_clean_builds"]["identical_corpus_identity"] is True
          assert r["two_clean_builds"]["identical_shard_hashes"] is True
          assert r["audit"]["normalization_audit"]["train_validation_overlap"] == 0
          assert r["truth_boundary"]["external_real_ua_present"] is True
          assert r["truth_boundary"]["external_real_en_present"] is True
          assert r["truth_boundary"]["external_real_code_present"] is False
          assert r["truth_boundary"]["project_authored_code_present"] is True
          assert r["truth_boundary"]["documents_duplicated_to_reach_token_target"] is False
          assert r["trainer_streaming"]["passed"] is True
          assert r["representativeness"]["full_v0_2_claim"] is False
          assert "EXTERNAL_REAL_CODE_UNAVAILABLE" in r["representativeness"]["blockers"]
          print(json.dumps({
              "status": r["status"],
              "corpus_identity_sha256": r["corpus_identity_sha256"],
              "optimized_token_supply": r["audit"]["optimized_token_supply"],
              "trainer_streaming": r["trainer_streaming"],
              "blockers": r["representativeness"]["blockers"],
              "report_sha256": r["report_sha256"],
          }, ensure_ascii=False, sort_keys=True, indent=2))
          PY

      - name: Upload DATA-183 release evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: data183-corpus-v02-real-candidate
          path: |
            data183-external-intake/manifest.json
            data183-external-intake/records.jsonl
            data183-external-intake/accepted_text/*.txt
            data183-external-intake.stdout.json
            data183-evidence/corpus-v0.2-real-candidate.json
            data183-evidence/data110/release-manifest.json
            data183-evidence/data110/build-a/manifest.json
            data183-evidence/data110/build-a/source-registry.json
            data183-evidence/data110/build-a/split-family.json
            data183-evidence/data110/build-a/shards/
            data183-evidence/data110/build-a/policy/quality-decisions.jsonl
            data183-evidence/data110/build-a/policy/privacy-manifest.json
            data183-evidence/data110/build-b/manifest.json
          if-no-files-found: warn
          retention-days: 30
