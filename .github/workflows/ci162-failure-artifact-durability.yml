name: CI-162 Failure Artifact Durability

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  failure-artifact-durability:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PYTHONPATH: src
    steps:
      - name: Checkout exact CI-162 head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up exact Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11.16"

      - name: Bind exact source
        env:
          SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"

      - name: Install hash-locked test runtime
        run: |
          set -euo pipefail
          python -m venv .ci162
          .ci162/bin/python -m pip install --disable-pip-version-check --no-deps --require-hashes -r requirements/locks/linux-x86_64/toolchain.lock.txt
          .ci162/bin/python -m pip install --disable-pip-version-check --no-deps --require-hashes -r requirements/locks/linux-x86_64/runtime.lock.txt
          .ci162/bin/python -m pip install --disable-pip-version-check --no-deps --require-hashes -r requirements/locks/linux-x86_64/dev.lock.txt

      - name: Run failure-injection contract matrix
        run: |
          set -euo pipefail
          .ci162/bin/python -m compileall -q tools/evidence_finalizer.py tests/test_evidence_finalizer_ci162.py
          .ci162/bin/python -m pytest -q tests/test_evidence_finalizer_ci162.py
