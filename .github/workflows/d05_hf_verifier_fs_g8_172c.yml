name: D05 HF verifier FS G8-172c

on:
  pull_request:
    branches:
      - repair/2985-hf-verifier-fs-errors-g8-172b-20261006
    paths:
      - ".github/workflows/d05_hf_verifier_fs_g8_172c.yml"

permissions:
  contents: read

concurrency:
  group: d05-hf-verifier-fs-172c-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  SOURCE_SHA: "3315472da4637bb42726dd39816d4279364758ea"
  EVENT_BASE_SHA: ${{ github.event.pull_request.base.sha }}
  QUALIFICATION_CARRIER_SHA: ${{ github.event.pull_request.head.sha }}
  PYTHONUTF8: "1"

jobs:
  linux-hf-verifier:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.head_ref == 'qualification/2986-hf-verifier-fs-errors-g8-172c-20261006'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Checkout exact qualification carrier
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.QUALIFICATION_CARRIER_SHA }}
          fetch-depth: 0
          persist-credentials: false
      - name: Set exact CPython 3.11.16
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.11.16"
      - name: Bind exact HF verifier source
        shell: bash
        run: |
          set -euo pipefail
          test "$EVENT_BASE_SHA" = "$SOURCE_SHA"
          test "$(git rev-parse HEAD)" = "$QUALIFICATION_CARRIER_SHA"
          test "$(git merge-base "$SOURCE_SHA" HEAD)" = "$SOURCE_SHA"
          git diff --name-only "$SOURCE_SHA"..HEAD | sort > /tmp/changed.txt
          printf '%s\n' '.github/workflows/d05_hf_verifier_fs_g8_172c.yml' > /tmp/expected.txt
          cmp /tmp/expected.txt /tmp/changed.txt
          test "$(git rev-parse "$SOURCE_SHA:src/twelve_six/checkpoint/hf_export.py")" = "7e4568baab19b7b3e490f619ec63334fb71b2408"
          test "$(git rev-parse "$SOURCE_SHA:tests/test_hf_export_transactional.py")" = "d638ad449b5780b78c6dfb74179a766a2c082aef"
          python -m py_compile src/twelve_six/checkpoint/hf_export.py tests/test_hf_export_transactional.py
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
      - name: Install focused test dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'
      - name: Lint exact HF verifier closure
        shell: bash
        run: |
          set -euo pipefail
          python -m ruff check src/twelve_six/checkpoint/hf_export.py tests/test_hf_export_transactional.py
      - name: Execute HF transactional regressions
        shell: bash
        run: |
          set -euo pipefail
          python -m pytest -q tests/test_hf_export_transactional.py
      - name: Prove Linux carrier remains clean
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$QUALIFICATION_CARRIER_SHA"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          echo "D05_HF_VERIFIER_FS_172C_LINUX=PASS_ZERO_SCIENTIFIC_CREDIT"

  windows-hf-verifier:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.head_ref == 'qualification/2986-hf-verifier-fs-errors-g8-172c-20261006'
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - name: Checkout exact qualification carrier
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.QUALIFICATION_CARRIER_SHA }}
          fetch-depth: 0
          persist-credentials: false
      - name: Set exact CPython 3.11.16
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.11.16"
      - name: Bind exact HF verifier source
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          if ($env:EVENT_BASE_SHA -ne $env:SOURCE_SHA) { throw "base SHA drifted" }
          if ((git rev-parse HEAD).Trim() -ne $env:QUALIFICATION_CARRIER_SHA) { throw "carrier SHA drifted" }
          if ((git merge-base $env:SOURCE_SHA HEAD).Trim() -ne $env:SOURCE_SHA) { throw "carrier ancestry drifted" }
          $changed = @(git diff --name-only "$env:SOURCE_SHA..HEAD" | Sort-Object)
          $expected = @(".github/workflows/d05_hf_verifier_fs_g8_172c.yml")
          if ($changed.Count -ne $expected.Count -or (Compare-Object $expected $changed)) {
            throw "unexpected carrier delta: $changed"
          }
          $hfBlob = (git rev-parse "$($env:SOURCE_SHA):src/twelve_six/checkpoint/hf_export.py").Trim()
          if ($hfBlob -ne "7e4568baab19b7b3e490f619ec63334fb71b2408") { throw "hf_export blob drifted" }
          $testBlob = (git rev-parse "$($env:SOURCE_SHA):tests/test_hf_export_transactional.py").Trim()
          if ($testBlob -ne "d638ad449b5780b78c6dfb74179a766a2c082aef") { throw "HF test blob drifted" }
          python -m py_compile src/twelve_six/checkpoint/hf_export.py tests/test_hf_export_transactional.py
          $dirty = git status --porcelain=v1 --untracked-files=all
          if ($dirty) { throw "carrier dirty before execution: $dirty" }
      - name: Install focused test dependencies
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Lint exact HF verifier closure
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          python -m ruff check src/twelve_six/checkpoint/hf_export.py tests/test_hf_export_transactional.py
      - name: Execute HF transactional regressions
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          python -m pytest -q tests/test_hf_export_transactional.py
      - name: Prove Windows carrier remains clean
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          if ((git rev-parse HEAD).Trim() -ne $env:QUALIFICATION_CARRIER_SHA) { throw "carrier SHA changed" }
          $dirty = git status --porcelain=v1 --untracked-files=all
          if ($dirty) { throw "carrier dirty after execution: $dirty" }
          Write-Output "D05_HF_VERIFIER_FS_172C_WINDOWS=PASS_ZERO_SCIENTIFIC_CREDIT"
