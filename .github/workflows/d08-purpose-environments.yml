name: D08 Purpose Environments
on:
  pull_request:
permissions:
  contents: read
jobs:
  linux-purpose-runtimes:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Prove exact source checkout
        env:
          SOURCE_SHA: ${{ github.event.pull_request.head.sha }}
        run: test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11.16"
      - name: ENV-152 bootstrap exact CPU and data wheel hashes
        run: |
          set -euo pipefail
          python -m venv .env152-bootstrap
          .env152-bootstrap/bin/python -m pip install --disable-pip-version-check 'pip==26.2.1'
          mkdir -p env152-bootstrap-wheels/cpu env152-bootstrap-wheels/data
          .env152-bootstrap/bin/python -m pip download --no-deps --only-binary=:all: --index-url https://download.pytorch.org/whl/cpu --dest env152-bootstrap-wheels/cpu 'torch==2.13.0+cpu'
          cat > /tmp/env152-constraints.txt <<'EOF'
          numpy==2.4.6
          fsspec==2026.7.0
          huggingface-hub==1.28.0
          tqdm==4.70.0
          pyarrow==25.0.1
          EOF
          .env152-bootstrap/bin/python -m pip download --only-binary=:all: --dest env152-bootstrap-wheels/data -c /tmp/env152-constraints.txt 'datatrove==0.10.0' 'pyarrow==25.0.1'
          .env152-bootstrap/bin/python - <<'PY' | tee env152-bootstrap-locks.txt
          from pathlib import Path
          import hashlib
          for group in ('cpu','data'):
              print(f'ENV152_LOCK_GROUP={group}')
              total=0
              for p in sorted((Path('env152-bootstrap-wheels')/group).iterdir()):
                  b=p.read_bytes(); total += len(b)
                  print(f'{p.name}\t{len(b)}\tsha256:{hashlib.sha256(b).hexdigest()}')
              print(f'ENV152_TOTAL_BYTES_{group.upper()}={total}')
          PY
      - name: Verify three independent clean purpose environments
        env:
          SOURCE_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          python tools/verify_purpose_environment.py \
            --profile linux-x86_64-tokenizer-experiment \
            --source-sha "$SOURCE_SHA" \
            --evidence-out d08-tokenizer-environment.json
          python tools/verify_purpose_environment.py \
            --profile linux-x86_64-transformers-interop \
            --source-sha "$SOURCE_SHA" \
            --evidence-out d08-transformers-environment.json
          python tools/verify_purpose_environment.py \
            --profile linux-x86_64-cuda-training \
            --source-sha "$SOURCE_SHA" \
            --evidence-out d08-cuda-training-environment.json
      - name: Upload Linux purpose-environment evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: d08-linux-purpose-environments
          path: |
            env152-bootstrap-locks.txt
            d08-tokenizer-environment.json
            d08-transformers-environment.json
            d08-cuda-training-environment.json
          if-no-files-found: error
          retention-days: 30

  windows-bundle-producer:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      source_sha: ${{ steps.source.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1
          persist-credentials: false
      - id: source
        name: Prove exact source checkout
        env:
          SOURCE_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          echo "sha=$SOURCE_SHA" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11.16"
      - name: Validate committed Windows profile before transport
        run: >-
          python tools/verify_purpose_environment.py
          --profile windows-x86_64-runtime
          --validate-only
      - name: Build exact project wheel without dependency resolution
        run: |
          python -m venv .d08-wheel-build
          .d08-wheel-build/bin/python -m pip install --disable-pip-version-check --require-hashes --no-deps -r requirements/locks/linux-x86_64/toolchain.lock.txt
          PIP_NO_INDEX=1 PIP_DISABLE_PIP_VERSION_CHECK=1 SOURCE_DATE_EPOCH=0 .d08-wheel-build/bin/python -m pip wheel --no-deps --no-build-isolation --wheel-dir dist .
          test "$(find dist -maxdepth 1 -name 'twelve_six_ai-*.whl' -type f | wc -l)" -eq 1
      - name: Stage artifact-only Windows authority bundle
        env:
          SOURCE_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          mkdir -p windows-bundle/tools windows-bundle/requirements windows-bundle/dist
          cp tools/verify_purpose_environment.py windows-bundle/tools/
          cp -R requirements/locks windows-bundle/requirements/
          cp -R requirements/profiles windows-bundle/requirements/
          cp dist/twelve_six_ai-*.whl windows-bundle/dist/
          printf '%s\n' "$SOURCE_SHA" > windows-bundle/source-sha.txt
          (cd windows-bundle && sha256sum dist/twelve_six_ai-*.whl > project-wheel.sha256)
      - name: Upload exact-source Windows authority bundle
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: d08-windows-runtime-bundle
          path: windows-bundle
          if-no-files-found: error
          retention-days: 30

  windows-runtime:
    needs: windows-bundle-producer
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - name: Download exact-source artifact-only bundle
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: d08-windows-runtime-bundle
          path: ${{ runner.temp }}\d08-windows-runtime
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11.9"
      - name: Verify exact transported source and wheel identity
        shell: pwsh
        working-directory: ${{ runner.temp }}\d08-windows-runtime
        env:
          EXPECTED_SOURCE_SHA: ${{ needs.windows-bundle-producer.outputs.source_sha }}
        run: |
          $actualSource = (Get-Content source-sha.txt -Raw).Trim()
          if ($actualSource -ne $env:EXPECTED_SOURCE_SHA) { throw "transported source SHA mismatch" }
          $wheels = @(Get-ChildItem -Path dist -Filter 'twelve_six_ai-*.whl' -File)
          if ($wheels.Count -ne 1) { throw "expected exactly one transported project wheel" }
          $expectedWheelSha = ((Get-Content project-wheel.sha256 -Raw).Trim() -split '\s+')[0].ToLowerInvariant()
          $actualWheelSha = (Get-FileHash -Algorithm SHA256 $wheels[0].FullName).Hash.ToLowerInvariant()
          if ($actualWheelSha -ne $expectedWheelSha) { throw "transported project wheel SHA-256 mismatch" }
      - name: Verify clean Windows x86_64 runtime
        shell: pwsh
        working-directory: ${{ runner.temp }}\d08-windows-runtime
        env:
          SOURCE_SHA: ${{ needs.windows-bundle-producer.outputs.source_sha }}
        run: |
          $wheel = (Get-ChildItem -Path dist -Filter 'twelve_six_ai-*.whl' -File | Select-Object -First 1).FullName
          python tools/verify_purpose_environment.py --root . --profile windows-x86_64-runtime --source-sha $env:SOURCE_SHA --project-wheel $wheel --evidence-out d08-windows-environment.json
      - name: Upload Windows environment evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: d08-windows-environment
          path: ${{ runner.temp }}\d08-windows-runtime\d08-windows-environment.json
          if-no-files-found: error
          retention-days: 30
