name: D03 Post-Dedup Survivor Handoff Terminal

on:
  pull_request:
    paths:
      - "src/twelve_six/data/postdedup_inventory_v1.py"
      - "src/twelve_six/data/postdedup_survivor_binding_v1.py"
      - "src/twelve_six/data/postdedup_decontam_handoff_v1.py"
      - "tests/test_postdedup_inventory_v1.py"
      - "tests/test_postdedup_survivor_binding_v1.py"
      - "tests/test_postdedup_decontam_handoff_v1.py"
      - "tools/materialize_postdedup_inventory_v1.py"
      - ".github/workflows/d03-postdedup-survivor-handoff-terminal.yml"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  terminal-handoff:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: src
      TWELVE_SIX_EXECUTION_PROFILE: LOCAL_FREE
      TERMINAL_V8_SHA256: 942cc15af60ee36a79345beba77fec347e33ee919d8148fb319b19d9ee072e5a
      TERMINAL_SURVIVOR_SHA256: 8115b35662fa89900b37f54f7cffd5f2fa8b2f8c60a72bcb18b89c92aaade0cf
      TERMINAL_ARTIFACT_ID: "10032510626"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Assert exact event head
        if: github.event_name == 'pull_request'
        run: test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
      - name: Run focused and adversarial regressions
        run: |
          python -m unittest \
            tests.test_postdedup_inventory_v1 \
            tests.test_postdedup_survivor_binding_v1 \
            tests.test_postdedup_decontam_handoff_v1 -v
          python -m py_compile \
            src/twelve_six/data/postdedup_inventory_v1.py \
            src/twelve_six/data/postdedup_survivor_binding_v1.py \
            src/twelve_six/data/postdedup_decontam_handoff_v1.py \
            tools/materialize_postdedup_inventory_v1.py
      - name: Download exact terminal NEXT100-065F artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${TERMINAL_ARTIFACT_ID}/zip" > "$RUNNER_TEMP/v8-terminal.zip"
          mkdir "$RUNNER_TEMP/v8-terminal"
          unzip -q "$RUNNER_TEMP/v8-terminal.zip" -d "$RUNNER_TEMP/v8-terminal"
          test -f "$RUNNER_TEMP/v8-terminal/v8-a.json"
          test -f "$RUNNER_TEMP/v8-terminal/v8-survivors-a.json"
      - name: Assert terminal artifact identities
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          root = Path(os.environ["RUNNER_TEMP"]) / "v8-terminal"
          v8 = json.loads((root / "v8-a.json").read_text())
          survivor = json.loads((root / "v8-survivors-a.json").read_text())
          assert v8["report_sha256"] == os.environ["TERMINAL_V8_SHA256"]
          assert survivor["survivor_authority_sha256"] == os.environ["TERMINAL_SURVIVOR_SHA256"]
          assert survivor["v8_report_sha256"] == os.environ["TERMINAL_V8_SHA256"]
          assert survivor["post_dedup_survivor_source_object_count"] == 262
          assert survivor["post_dedup_declared_capacity_bytes"] == 6095321
          print("terminal_v8_report_sha256=", v8["report_sha256"])
          print("terminal_survivor_authority_sha256=", survivor["survivor_authority_sha256"])
          PY
      - name: Materialize two independent survivor-bound handoffs
        run: |
          for label in a b; do
            python tools/materialize_postdedup_inventory_v1.py materialize \
              --v8-report "$RUNNER_TEMP/v8-terminal/v8-a.json" \
              --expected-v8-report-sha256 "$TERMINAL_V8_SHA256" \
              --survivor-authority "$RUNNER_TEMP/v8-terminal/v8-survivors-a.json" \
              --expected-survivor-authority-sha256 "$TERMINAL_SURVIVOR_SHA256" \
              --inventory "$RUNNER_TEMP/inventory-${label}.json" \
              --binding-evidence "$RUNNER_TEMP/binding-${label}.json"
          done
          cmp "$RUNNER_TEMP/inventory-a.json" "$RUNNER_TEMP/inventory-b.json"
          cmp "$RUNNER_TEMP/binding-a.json" "$RUNNER_TEMP/binding-b.json"
      - name: Reverify exact materialization and print compact authority
        run: |
          python tools/materialize_postdedup_inventory_v1.py verify \
            --v8-report "$RUNNER_TEMP/v8-terminal/v8-a.json" \
            --expected-v8-report-sha256 "$TERMINAL_V8_SHA256" \
            --survivor-authority "$RUNNER_TEMP/v8-terminal/v8-survivors-a.json" \
            --expected-survivor-authority-sha256 "$TERMINAL_SURVIVOR_SHA256" \
            --inventory "$RUNNER_TEMP/inventory-a.json" \
            --binding-evidence "$RUNNER_TEMP/binding-a.json"
          python - <<'PY'
          import json, os
          from pathlib import Path
          root = Path(os.environ["RUNNER_TEMP"])
          inventory = json.loads((root / "inventory-a.json").read_text())
          binding = json.loads((root / "binding-a.json").read_text())
          assert inventory["retained_source_count"] == 262
          assert inventory["retained_unique_capacity_bytes"] == 6095321
          assert inventory["authorized_training_exposure"] == 0
          assert inventory["reserved_evaluation_decontamination_complete"] is False
          assert inventory["input_survivor_authority_sha256"] == os.environ["TERMINAL_SURVIVOR_SHA256"]
          print("inventory_identity_sha256=", inventory["inventory_identity_sha256"])
          print("binding_identity_sha256=", binding["binding_identity_sha256"])
          print("retained_source_count=", inventory["retained_source_count"])
          print("retained_unique_capacity_bytes=", inventory["retained_unique_capacity_bytes"])
          print("independence_cluster_count=", inventory["independence_cluster_count"])
          PY
      - name: Upload text-free terminal handoff evidence
        uses: actions/upload-artifact@v4
        with:
          name: d03-postdedup-survivor-handoff-${{ github.sha }}
          path: |
            ${{ runner.temp }}/inventory-a.json
            ${{ runner.temp }}/binding-a.json
          if-no-files-found: error
          retention-days: 90
      - name: Assert truth boundary
        run: |
          test "$TWELVE_SIX_EXECUTION_PROFILE" = "LOCAL_FREE"
          python - <<'PY'
          import json, os
          from pathlib import Path
          value = json.loads((Path(os.environ["RUNNER_TEMP"]) / "inventory-a.json").read_text())
          assert value["authorized_training_exposure"] == 0
          assert value["tokenizer_fit_authorized"] is False
          assert value["model_training_executed"] is False
          assert value["final_test_payload_read"] is False
          assert value["paid_compute_used"] is False
          PY
