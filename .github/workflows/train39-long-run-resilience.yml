name: TRAIN39 Long Run Recovery
on:
  pull_request:
permissions:
  contents: read
jobs:
  local-failure-recovery:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Prove exact source checkout
        env:
          SOURCE_SHA: ${{ github.event.pull_request.head.sha }}
        run: test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11.16"
      - name: Verify exact D08 locked environment and repository checks
        env:
          SOURCE_SHA: ${{ github.event.pull_request.head.sha }}
        run: >-
          python tools/verify_locked_environment.py
          --profile linux-x86_64
          --source-sha "$SOURCE_SHA"
          --evidence-out locked-environment-linux-x86_64.json
          --run-repo-checks
      - name: Create exact locked TRAIN39 execution environment
        run: |
          python -m venv .train39-locked
          .train39-locked/bin/python -m pip install --disable-pip-version-check --require-hashes --no-deps -r requirements/locks/linux-x86_64/toolchain.lock.txt
          .train39-locked/bin/python -m pip install --disable-pip-version-check --require-hashes --no-deps -r requirements/locks/linux-x86_64/runtime.lock.txt
          PIP_NO_INDEX=1 PIP_DISABLE_PIP_VERSION_CHECK=1 .train39-locked/bin/python -m pip install --no-deps --no-build-isolation -e .
      - name: Run focused resilience contract tests
        run: |
          .train39-locked/bin/python -m ruff check src/twelve_six/training/resilience.py tools/run_s0_resilience_evidence.py tests/test_training_resilience.py
          .train39-locked/bin/python -m pytest -q tests/test_training_resilience.py
      - name: Execute real process failure and recovery evidence
        env:
          SOURCE_SHA: ${{ github.event.pull_request.head.sha }}
        run: >-
          .train39-locked/bin/python tools/run_s0_resilience_evidence.py
          --source-sha "$SOURCE_SHA"
          --output s0-train39-resilience-evidence.json
          --workspace .train39-resilience-work
          --max-steps 8
          --checkpoint-every-steps 2
      - name: Validate claim boundary
        run: |
          .train39-locked/bin/python - <<'PY'
          import json
          from pathlib import Path

          evidence = json.loads(Path("s0-train39-resilience-evidence.json").read_text())
          assert evidence["identity"]["source_sha"] == "${{ github.event.pull_request.head.sha }}"
          assert evidence["failure_injection"]["hard_process_loss"]["exact_final_state_match"] is True
          assert evidence["failure_injection"]["corrupt_latest_checkpoint"]["exact_final_state_match"] is True
          assert evidence["failure_injection"]["sigterm_preemption"]["exact_final_state_match"] is True
          assert evidence["claims"]["automatic_distributed_rank_replacement"] is False
          assert evidence["claims"]["multi_node_elastic_recovery"] is False
          assert evidence["claims"]["paid_compute_executed"] is False
          PY
      - name: Upload exact recovery evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: train39-long-run-recovery-evidence
          path: |
            locked-environment-linux-x86_64.json
            s0-train39-resilience-evidence.json
            .train39-resilience-work/**/recovery-state.json
            .train39-resilience-work/**/run-manifest.json
            .train39-resilience-work/**/attempts/*.json
            .train39-resilience-work/**/failures/*.json
            .train39-resilience-work/**/terminal.json
          if-no-files-found: error
          retention-days: 30
