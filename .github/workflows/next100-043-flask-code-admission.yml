name: NEXT100-043 Flask Code Admission

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  flask-code-admission:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      TWELVE_SIX_EXECUTION_PROFILE: LOCAL_FREE
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11.16"

      - name: Bind exact source head
        env:
          EXPECTED_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SOURCE_SHA"

      - name: Compile and run focused fail-closed tests
        env:
          PYTHONPATH: src
        run: |
          python -m py_compile src/twelve_six/next100_043_flask_admission.py
          python -m unittest discover -s tests -p 'test_next100_043_flask_admission.py' -v

      - name: Acquire and qualify exact Flask snapshot
        env:
          PYTHONPATH: src
          EXPECTED_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          rm -rf next100-043-evidence
          mkdir -p next100-043-evidence
          python -m twelve_six.next100_043_flask_admission run \
            --repo-root . \
            --output-dir next100-043-evidence \
            --source-sha "$EXPECTED_SOURCE_SHA" \
            | tee next100-043-evidence/stdout.json

      - name: Validate terminal report
        env:
          PYTHONPATH: src
          EXPECTED_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          python -m twelve_six.next100_043_flask_admission validate \
            next100-043-evidence/next100-043-flask-code-admission.json \
            --repo-root . \
            --expected-source-sha "$EXPECTED_SOURCE_SHA"
          python - <<'PY'
          import json
          from pathlib import Path

          report = json.loads(
              Path("next100-043-evidence/next100-043-flask-code-admission.json").read_text()
          )
          assert report["verdict"] == "ADMIT_TRAINING_ONLY"
          assert report["selected_object_count"] == 8
          assert report["admitted_raw_bytes"] == 183088
          assert report["source_family"] == "github:pallets/flask"
          assert report["source_family_count_delta"] == 1
          assert report["vendored_or_generated_counted_bytes"] == 0
          assert report["deduplication"]["result"] == "PASS"
          assert report["parse_checks"] == {"required": 8, "passed": 8}
          assert report["secret_scan"] == {"required": 8, "passed": 8}
          assert report["evaluation_authorized"] is False
          assert report["model_training_executed"] is False
          assert report["optimizer_steps"] == 0
          assert report["local_free_only"] is True
          print("report_sha256=" + report["report_sha256"])
          print("snapshot_manifest_sha256=" + report["snapshot_manifest_sha256"])
          PY

      - name: Upload immutable admission evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: next100-043-flask-code-admission-${{ github.event.pull_request.head.sha || github.sha }}
          if-no-files-found: error
          retention-days: 90
          path: |
            configs/data/next100_043_flask_code_rights_v1.json
            next100-043-evidence/
