name: LEARN-235 External Real 1M Gate

on:
  pull_request:
    branches: [env151/universal-execution-bootstrap-20260826]
  workflow_dispatch:

concurrency:
  group: learn235-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions: {contents: read}

jobs:
  prerequisite-gate:
    runs-on: ubuntu-24.04
    env:
      PYTHONPATH: src:.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: "${{ github.event.pull_request.head.sha || github.sha }}"
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.11.16"

      - name: Universal exact bootstrap
        uses: ./.github/actions/execution-bootstrap
        with:
          capabilities: runtime,tests
          venv: .learn235
          command: python -m pytest -q tests/test_learn235_blocker.py
          manifest: learn235-evidence/bootstrap.json

      - name: Validate fail-closed prerequisite decision
        run: |
          set -euo pipefail
          .learn235/bin/python tools/validate_learn235_prerequisites.py \
            evidence/learn235/blocker.json

      - name: Prove no training was launched
        run: |
          set -euo pipefail
          .learn235/bin/python - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path("evidence/learn235/blocker.json").read_text())
          assert report["status"] == "BLOCKED_NO_TERMINAL_LEARN234_IDENTITY"
          assert report["training_executed"] is False
          assert report["optimizer_updates"] == 0
          print("BLOCKED_AS_DESIGNED_NO_TRAINING")
          PY

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: learn235-prerequisite-gate
          path: |
            evidence/learn235/blocker.json
            learn235-evidence/bootstrap.json
          if-no-files-found: error
