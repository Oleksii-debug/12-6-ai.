name: NEXT100-046 Click Code Source Admission

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qualify-click:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      TWELVE_SIX_EXECUTION_PROFILE: LOCAL_FREE
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11.16"

      - name: Bind exact source head
        env:
          EXPECTED_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SOURCE_SHA"

      - name: Static verifier gate
        run: python -m py_compile tools/validate_next100_046_click_code_source.py

      - name: Acquire and qualify immutable Click objects
        run: |
          rm -rf next100-046-evidence
          python tools/validate_next100_046_click_code_source.py \
            --repo . \
            --output next100-046-evidence/next100-046-click-code-admission.json \
            | tee next100-046-evidence/stdout.json

      - name: Validate terminal report assertions
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          p = Path("next100-046-evidence/next100-046-click-code-admission.json")
          r = json.loads(p.read_text())
          assert r["verdict"] == "ADMIT"
          assert r["execution_profile"] == "LOCAL_FREE"
          assert r["source_family"] == "github:pallets/click"
          assert r["upstream_commit"] == "b2e30a175449cfda909ee4fbf4a29a6a071cad53"
          assert r["object_count"] == 3
          assert r["capacity_bytes"] == 52771
          assert r["training_purpose_decision"] == "ALLOWED"
          assert r["redistribution_decision"] == "ALLOWED_WITH_LICENSE_CONDITIONS"
          assert r["evaluation_use"] == "NOT_AUTHORIZED"
          assert r["normalization_identity_preserved"] is True
          assert r["privacy_secrets_pass"] is True
          assert r["syntax_parse_compile_pass"] is True
          assert r["quality_pass"] is True
          assert r["generated_vendored_capacity_bytes"] == 0
          assert r["dedup"]["exact_duplicates"] == []
          assert r["dedup"]["near_duplicate_pairs"] == []
          assert len(r["authority_sha256"]) == 64
          PY

      - name: Upload immutable verifier evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: next100-046-click-admission-${{ github.event.pull_request.head.sha || github.sha }}
          if-no-files-found: error
          retention-days: 90
          path: |
            configs/data/next100_046_click_code_source_v1.json
            next100-046-evidence/
