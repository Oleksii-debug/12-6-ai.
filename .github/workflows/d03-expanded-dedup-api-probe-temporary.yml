name: D03 expanded dedup API probe temporary

on:
  pull_request:
    paths:
      - ".github/workflows/d03-expanded-dedup-api-probe-temporary.yml"

permissions:
  contents: write
  pull-requests: write

jobs:
  probe:
    if: github.event.pull_request.head.ref == 'd03/expanded-dedup-api-probe-20260910'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      GITHUB_TOKEN: ${{ github.token }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
      SOURCE_SHA: ${{ github.event.pull_request.head.sha }}
      HEAD_REF: ${{ github.event.pull_request.head.ref }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.SOURCE_SHA }}
          fetch-depth: 0
          persist-credentials: true

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11.16"

      - name: Extract exact incumbent API contract
        run: |
          set -euo pipefail
          python - <<'PY'
          import ast
          import json
          from pathlib import Path

          repo = Path('.')
          candidates = sorted((repo / 'src/twelve_six/data').glob('cross_source_capacity_audit*.py'))
          tools = sorted((repo / 'tools').glob('*cross_source*dedup*.py'))
          lines = [
              '# D03 incumbent global-dedup API probe',
              '',
              f'Probe source head: `{__import__("os").environ["SOURCE_SHA"]}`.',
              '',
              'This disposable probe records only repository-local module/CLI contracts so the next Rada_Trees successor can reuse the incumbent matcher instead of creating a second dedup architecture.',
              '',
          ]

          def signature(node: ast.FunctionDef | ast.AsyncFunctionDef) -> str:
              args = []
              pos = list(node.args.posonlyargs) + list(node.args.args)
              defaults = [None] * (len(pos) - len(node.args.defaults)) + list(node.args.defaults)
              posonly_count = len(node.args.posonlyargs)
              for i, (arg, default) in enumerate(zip(pos, defaults)):
                  piece = arg.arg
                  if arg.annotation is not None:
                      piece += ': ' + ast.unparse(arg.annotation)
                  if default is not None:
                      piece += ' = ' + ast.unparse(default)
                  args.append(piece)
                  if posonly_count and i + 1 == posonly_count:
                      args.append('/')
              if node.args.vararg:
                  piece = '*' + node.args.vararg.arg
                  if node.args.vararg.annotation is not None:
                      piece += ': ' + ast.unparse(node.args.vararg.annotation)
                  args.append(piece)
              elif node.args.kwonlyargs:
                  args.append('*')
              for arg, default in zip(node.args.kwonlyargs, node.args.kw_defaults):
                  piece = arg.arg
                  if arg.annotation is not None:
                      piece += ': ' + ast.unparse(arg.annotation)
                  if default is not None:
                      piece += ' = ' + ast.unparse(default)
                  args.append(piece)
              if node.args.kwarg:
                  piece = '**' + node.args.kwarg.arg
                  if node.args.kwarg.annotation is not None:
                      piece += ': ' + ast.unparse(node.args.kwarg.annotation)
                  args.append(piece)
              ret = '' if node.returns is None else ' -> ' + ast.unparse(node.returns)
              return f'{node.name}(' + ', '.join(args) + ')' + ret

          for path in candidates:
              text = path.read_text()
              tree = ast.parse(text)
              lines.extend([f'## `{path.as_posix()}`', ''])
              module_doc = ast.get_docstring(tree)
              if module_doc:
                  lines.extend(['Module docstring:', '```text', module_doc[:1800], '```', ''])
              imports = []
              for n in tree.body:
                  if isinstance(n, ast.ImportFrom):
                      imports.append(f'from {n.module} import ' + ', '.join(a.name for a in n.names))
                  elif isinstance(n, ast.Import):
                      imports.append('import ' + ', '.join(a.name for a in n.names))
              lines.extend(['Imports:', '```text', *imports[:80], '```', ''])
              funcs = [n for n in tree.body if isinstance(n, (ast.FunctionDef, ast.AsyncFunctionDef))]
              classes = [n for n in tree.body if isinstance(n, ast.ClassDef)]
              lines.extend(['Top-level callables:', '```text'])
              for n in funcs:
                  lines.append(signature(n))
              for c in classes:
                  lines.append('class ' + c.name)
                  for n in c.body:
                      if isinstance(n, (ast.FunctionDef, ast.AsyncFunctionDef)) and not n.name.startswith('__'):
                          lines.append('  ' + signature(n))
              lines.extend(['```', ''])

              selected = [
                  n for n in funcs
                  if any(token in n.name.casefold() for token in ('build', 'audit', 'verify', 'material', 'report', 'source', 'dedup'))
                  and not n.name.startswith('_')
              ]
              for n in selected[:12]:
                  src = ast.get_source_segment(text, n) or ''
                  if len(src) > 5000:
                      src = src[:5000] + '\n# ... truncated by probe ...'
                  lines.extend([f'### Source excerpt: `{n.name}`', '```python', src, '```', ''])

          for path in tools:
              text = path.read_text()
              tree = ast.parse(text)
              lines.extend([f'## CLI `{path.as_posix()}`', ''])
              funcs = [n for n in tree.body if isinstance(n, (ast.FunctionDef, ast.AsyncFunctionDef))]
              lines.extend(['Top-level callables:', '```text', *[signature(n) for n in funcs], '```', ''])
              args = []
              for n in ast.walk(tree):
                  if isinstance(n, ast.Call) and isinstance(n.func, ast.Attribute) and n.func.attr == 'add_argument':
                      opts = [ast.literal_eval(a) for a in n.args if isinstance(a, ast.Constant) and isinstance(a.value, str)]
                      kwargs = {kw.arg: ast.unparse(kw.value) for kw in n.keywords if kw.arg in {'required','action','default','type','choices'}}
                      if opts:
                          args.append({'options': opts, 'kwargs': kwargs})
              lines.extend(['Argparse contract:', '```json', json.dumps(args, indent=2, sort_keys=True), '```', ''])
              for n in funcs:
                  if n.name in {'main', 'run', 'materialize', 'verify'} or 'material' in n.name or 'build' in n.name:
                      src = ast.get_source_segment(text, n) or ''
                      if len(src) > 5000:
                          src = src[:5000] + '\n# ... truncated by probe ...'
                      lines.extend([f'### CLI source excerpt: `{n.name}`', '```python', src, '```', ''])

          if not candidates:
              lines.extend(['**BLOCKER:** no `cross_source_capacity_audit*.py` module exists on this exact main-derived tree.', ''])
          body = '\n'.join(lines)
          if len(body) > 60000:
              body = body[:59500] + '\n\n[probe truncated at 59.5k characters]\n'
          Path('/tmp/probe.md').write_text(body)
          Path('/tmp/request.json').write_text(json.dumps({'body': body}))
          print(f'candidate_modules={len(candidates)} cli_tools={len(tools)} body_chars={len(body)}')
          PY

      - name: Publish contract into disposable PR body
        run: |
          set -euo pipefail
          curl --fail --silent --show-error \
            -X PATCH \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}" \
            --data-binary @/tmp/request.json >/dev/null

      - name: Retire disposable workflow
        run: |
          set -euo pipefail
          git rm .github/workflows/d03-expanded-dedup-api-probe-temporary.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "D03: retire global-dedup API probe"
          git fetch --no-tags origin "refs/heads/${HEAD_REF}"
          test "$(git rev-parse FETCH_HEAD)" = "$SOURCE_SHA"
          git push origin "HEAD:refs/heads/${HEAD_REF}"
